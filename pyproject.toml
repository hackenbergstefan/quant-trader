[project]
name = "pytrading"
version = "0.1.0"
description = "Reproducible research and backtesting for European equities"
requires-python = ">=3.15"
dependencies = [
    "duckdb>=1.2",
    "exchange-calendars>=4.9",
    "numpy>=2.2",
    "pandas>=2.2",
    "pdfplumber>=0.11.10",
    "plotly>=6.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "typer>=0.15",
    "vectorbt>=1.2.0",
    "pystooq>=1.0.3",
    "yfinance>=0.2.54",
    "fdnpy>=0.6.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pytrading"]
