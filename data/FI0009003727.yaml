longBusinessSummary: Wärtsilä Oyj Abp offers technologies and lifecycle solutions
  for the marine and energy markets worldwide. It offers energy storage; engine and
  hybrid power plants; and data centre power solutions, as well as lifecycle solutions,
  lifecycle upgrades, spare parts and field services, and decarbonisation solutions.
  It also provides engine power plant products, such as gas, multi-fuel, and diesel
  engines; Quantum BESS portfolio, a battery energy storage system (BESS) solutions;
  GEMS Digital Energy Platform, a software platform that monitors, controls, and optimizes
  energy assets on site and portfolio levels. In addition, the company offers power
  and propulsion products, such as electric shipping and hybrid ships, engine and
  generating sets, propulsors and gears, and shaft line solutions; liquid and gas
  handling products, including ballast water management, freshwater generation, waste
  and wastewater treatment, gas solutions, and exhaust treatment equipment; port and
  fleet optimization; simulation and training solutions; and marine navigation solutions.
  The company collaborate with RCT Solutions to launch Valo which is a global battery
  energy storage system integrator. Further, it provides spare parts, technical support,
  maintenance and repair, lifecycle upgrades, lifecycle agreements, training, and
  cyber services; and decarbonization solutions for existing fleets and newbuild vessels.
  The company was founded in 1834 and is headquartered in Helsinki, Finland.
