longBusinessSummary: Getlink SE, together with its subsidiaries, engages in the design,
  finance, construction, and operation of fixed link infrastructure and transport
  system in France and the United Kingdom. It operates through Eurotunnel, Europorte,
  and ElecLink segments. The Eurotunnel segment operates tunnels of a length of approximately
  50 kilometres each under the English Channel, as well as terminals at Folkestone
  in the United Kingdom and the Coquelles in France. It also provides passenger shuttle
  services for the transport of trucks, cars, motor homes, caravans, coaches, motorcycles,
  trailers, commercial vans, and other vehicles. In addition, this segment manages
  passenger trains and rail freight, as well as fixed equipment and related installations.
  Its Europorte segment offers a range of integrated rail freight services, including
  national and international haulage, local services for secondary lines, individual
  junction management, infrastructure maintenance, and wagon loading and unloading
  services. The ElecLink segment engages in the construction and operation of a 1-gigawatt
  electricity interconnector between France and the Great Britain. The company also
  engages in consultancy and custom services; professional training services for the
  rail sector; and third-party retail, telecommunication cables, and property businesses,
  as well as the sale of travel insurance products. The company was formerly known
  as Groupe Eurotunnel S.E. and changed its name to Getlink SE in April 2018. Getlink
  SE was founded in 1802 and is based in Paris, France.
