longBusinessSummary: Synchrony Financial, together with its subsidiaries, operates
  as a consumer financial services company in the United States. The company provides
  credit products, such as credit cards, commercial credit products, and consumer
  installment loans. It also offers private label credit cards, dual and general purpose
  co-branded cards, short- and long-term installment loans, and consumer banking products;
  and deposit products, including certificates of deposit, individual retirement accounts,
  money market accounts, savings accounts, and sweep and affinity deposits, as well
  as accepts deposits through third-party firms. In addition, the company provides
  debt cancellation products to its credit card customers through online and mobile
  channels; and healthcare payments and financing solutions under the CareCredit and
  Walgreens brands; payments and financing solutions in the apparel, specialty retail,
  outdoor, music, and luxury industries, such as American Eagle, Dick's Sporting Goods,
  Guitar Center, Pandora, Polaris, Suzuki, and Sweetwater. It offers its credit products
  through programs established with a group of national and regional retailers, local
  merchants, manufacturers, buying groups, industry associations, and healthcare service
  providers; and deposit products through various channels, such as digital and print.
  It serves digital, health and wellness, retail, home, auto, telecommunications,
  pet, outdoor, and other industries. The company was founded in 1932 and is headquartered
  in Stamford, Connecticut.
