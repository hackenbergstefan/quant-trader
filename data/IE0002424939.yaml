longBusinessSummary: DCC Energy plc engages in the sales, marketing, and distribution
  of carbon energy solutions in the Republic of Ireland, the United Kingdom, France,
  the United States, and internationally. The company operates in two segments, DCC
  Energy and DCC Technology. It sells transport and commercial fuels, heating oils
  and related products, liquid gas, refrigerants, electricity, natural gas; sells
  and distributes biofuels and biogas to commercial, industrial, and domestic customers;
  designs, sells, installs, and maintains on-site solar and energy systems for power
  customers, as well as provides energy efficiency solutions; owns or operates service
  stations (gas stations) for vehicles and trucks; and provides fleet payment, digital
  parking, and telematic services. The company also offers Pro Tech, which bring professional
  technologies together to enhance audio and visual experiences; Info Tech to make
  faster connections happen; and Life Tech that provides technology to improve lifestyle
  quality. The company was formerly known as DCC plc and changed its name to DCC Energy
  plc. in July 2026. The company was incorporated in 1976 and is headquartered in
  Dublin, Ireland.
