longBusinessSummary: Danske Bank A/S provides various banking products and services
  to corporate, institutional, and international clients. The company offers banking,
  mortgage finance, insurance, pension, real-estate brokerage, asset management, trading
  in fixed income products, foreign exchange, and equities. It also provides advisory
  services to personal and private banking customers. In addition, the company offers
  financing, risk management, investment, and financial advisory services for large
  corporates and institutions; healthcare solutions; and online and mobile banking
  services. It operates in Denmark, Finland, Sweden, Norway, the United Kingdom, Ireland,
  Lithuania, Luxembourg, Poland, and the United States of America. The company was
  founded in 1871 and is headquartered in Copenhagen, Denmark.
