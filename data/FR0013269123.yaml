longBusinessSummary: Rubis, together with its subsidiaries, engages in the energy
  distribution business in Europe, Africa, and the Caribbean. The company operates
  through Energy Distribution and Renewable Electricity Production segments. It retails
  and distributes aviation and marine fuel, heating oils, lubricants, liquefied gases,
  and bitumen; and provides trading, supply, refining, logistics, and shipping activities.
  The company also engages in the operation of service stations that provide charging
  stations, convenience stores, catering, and car washing services; and production
  of photovoltaic electricity, which includes large ground-based facilities, parking
  canopies, and rooftop installations. It serves distributors, companies, and industrialists;
  and the transport, hotel, poultry farming, and construction sectors. Rubis was incorporated
  in 1954 and is headquartered in Paris, France.
