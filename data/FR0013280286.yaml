longBusinessSummary: bioMérieux S.A. develops, manufactures, and markets in vitro
  diagnostic solutions for infectious diseases in France, Europe, Africa, the Middle
  East, North and South America, the Asia Pacific, and internationally. It operates
  through Clinical Applications and Industrial Applications segments. The company
  offers CHROMID RANGE, a chromogen culture media; air, surface, and water monitoring
  systems; BACT/ALERT VIRTUO, a blood sample culture system; BIOFIRE, a multiplex
  polymerase chain reaction system (PCR); BIOFIRE SPOTFIRE, a lowplex PCR point-of-care
  system; VITEK MS, a mass spectrometry system; VITEK 2, an automated identification
  and antimicrobial susceptibility testing (AST) system; API RANGE standardized ID
  strips; VITEK REVEAL, a rapid AST system; ETEST, a gradient method on culture media;
  BIOMERIEUX EPISEQ CS, a whole genome sequencing solution for epidemiologic monitoring;
  VIDAS, a specific marker of severe bacterial infections/sepsis; and Biomérieux vision
  suite, a software that provides information to support diagnosis and clinical decision
  making. It also provides culture media and associated instruments; ARGENE that provides
  PCR tests for diagnosing viral respiratory diseases; EMAG system and NUCLISENS extraction
  reagents for DNA and RNA extraction; GENE-UP and VERIFLOW for detection of microorganisms
  for the food industry; ETEST for manual measurement of minimum inhibitory concentration
  of an antibiotic; API and RAPIDEC CARBA NP for identification of bacteria and manual
  antimicrobial susceptibility testing; BIOBALL for quantitative microbiological quality
  control; CHEMUNEX, a microbiology instrument; ENDONEXT for detection of endotoxins;
  TEMPO for fluorescence counting of bacteria; and Hybiome, a CLIA technology, as
  well as lab consultancy service and training modules. The company was formerly known
  as B-D Mérieux. The company was founded in 1963 and is headquartered in Marcy-l'Étoile,
  France. bioMérieux S.A. operates as a subsidiary of Institut Mérieux SA.
