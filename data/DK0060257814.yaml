longBusinessSummary: Zealand Pharma A/S, a biotechnology company, engages in the discovery,
  development, and commercialization of peptide-based medicines in Denmark and the
  United States. The company has a portfolio of medicines focusing on gastrointestinal
  and metabolic diseases, and other specialty disease areas with unmet medical needs.
  It also provides Zegalogue, a single use syringe or autoinjector for the treatment
  of severe hypoglycemia; and Dasiglucagon bi-hormone artificial pancreas systems
  containing insulin and dasiglucagon. Its pipeline includes Dasiglucagon for treating
  congenital hyperinsulinism. In addition, the company developing glepaglutide, a
  long acting GLP-2 analog, which is in Phase III clinical trials for the treatment
  of short bowel syndrome. The company was incorporated in 1997 and is based in Søborg,
  Denmark.
