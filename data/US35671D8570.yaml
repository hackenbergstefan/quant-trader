longBusinessSummary: Freeport-McMoRan Inc. engages in the mining of mineral properties
  in North America, South America, and Indonesia. The company primarily explores for
  copper, gold, molybdenum, silver, and other metals. Its assets include the Grasberg
  minerals district in Indonesia; Morenci, Bagdad, Safford, Sierrita, and Miami in
  Arizona; Chino and Tyrone in New Mexico; and Henderson and Climax in Colorado, North
  America, as well as Cerro Verde in Peru and El Abra in Chile. The company was formerly
  known as Freeport-McMoRan Copper & Gold Inc. and changed its name to Freeport-McMoRan
  Inc. in July 2014. The company was incorporated in 1987 and is headquartered in
  Phoenix, Arizona.
