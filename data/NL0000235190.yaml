longBusinessSummary: 'Airbus SE, together with its subsidiaries, engages in the design,
  manufacture, and delivery of aeronautics and aerospace products, services, and solutions
  worldwide. It operates through three segments: Airbus, Airbus Helicopters, and Airbus
  Defence and Space. The Airbus segment develops, manufactures, markets, and sells
  commercial jet passenger aircraft, freighter aircraft, regional turboprop aircraft,
  and aircraft components, as well as provides aircraft conversion and related services.
  The Airbus Helicopters segment develops, manufactures, markets, and sells civil
  and military helicopters; and provides uncrewed aerial systems and their related
  services. The Airbus Defence and Space segment designs, develops, delivers, and
  supports crewed and uncrewed military air systems and related services. This segment
  also offers civil and defence space systems for telecommunications, earth observations,
  navigation, and science and orbital systems; and services around data processing
  from platforms, secure communication, and cyber security. The company was formerly
  known as Airbus Group SE and changed its name to Airbus SE in April 2017. The company
  was incorporated in 1998 and is headquartered in Leiden, the Netherlands.'
