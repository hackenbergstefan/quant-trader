longBusinessSummary: 'The J. M. Smucker Company manufactures and markets branded food
  and beverage products worldwide. The company operates through five segments: U.S.
  Retail Coffee, U.S. Retail Frozen Handheld and Spreads, U.S. Retail Pet Foods, Sweet
  Baked Snacks, and Away From Home. It offers coffee, sweet baked goods, pet snacks,
  frozen handheld products, peanut butter, cat and dog food, fruit and specialty spreads,
  cookies, frozen sandwiches and snacks, hot beverages, portion control products,
  toppings and syrups, baking mixes and ingredients, and flour. The company provides
  its products under the Folgers, Café Bustelo, Dunkin'', Jif, Smucker''s, Uncrustables,
  Meow Mix, Milk-Bone, Pup-Peroni, Canine Carry Outs, Hostess, and 1850 brand names.
  It sells its products through direct sales and brokers to food retailers, club stores,
  discount and dollar stores, online retailers, pet specialty stores, distributors,
  drug stores, military commissaries, mass merchandisers, supermarket chains, national
  mass retailers, convenience stores, vending channels, and foodservice distributors
  and operators. The J. M. Smucker Company was founded in 1897 and is headquartered
  in Orrville, Ohio.'
