longBusinessSummary: Rio Tinto Group engages in exploring, mining, and processing
  mineral resources worldwide. The company operates through Iron Ore; Aluminium and
  lithium; and Copper segments. The Iron Ore segment engages in the iron ore mining,
  and salt and gypsum production in Western Australia. The Aluminum and lithium segment
  is involved in bauxite mining; alumina refining; and aluminium smelting, and recycling,
  as well as mining and processing of lithium. The Copper segment engages in mining
  and refining of copper, gold, silver, molybdenum, and other by-products and exploration
  activities. It also owns and operates open pit and underground mines; and refineries,
  smelters, processing plants and power, and shipping facilities. The company was
  founded in 1873 and is headquartered in London, the United Kingdom.
