longBusinessSummary: Telia Company AB (publ) provides communication services to businesses,
  individuals, families, and communities in Sweden, Finland, Norway, Denmark, Lithuania,
  Estonia, and Latvia. It offers mobile, broadband, television, and fixed-line services;
  and networking, cloud and security, mobility, enterprise mobile network, contact
  center, managed mobility services, collaboration solutions, and telephony. The company
  also offers Internet of Things (IoT), broadband services via mobile network and
  fiber, LAN and WiFi, SD-WAN, mobile LAN, dedicated private networks, and data analysis
  services, as well as colocation solutions. In addition, it provides smart public
  transport, and smart utilities, as well as transport and logistics solutions comprising
  connected vehicle, GPS positioning, and fleet management services. It also provides
  data communication and security solutions to individuals and companies. The company
  markets its products and services under the Telia, Telia Cygate, TV4, Halebop, Fello,
  MTV, Phonero, Onecall, MyCall, Ezys, and Diil brand names for transport and logistics,
  forestry, healthcare and community, agriculture, and energy and mining, as well
  as manufacturing industries. Telia Company AB (publ) was formerly known as TeliaSonera
  AB (publ) and changed its name to Telia Company AB (publ) in April 2016. The company
  was founded in 1853 and is based in Solna, Sweden.
