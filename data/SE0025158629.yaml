longBusinessSummary: 'Mycronic AB (publ) develops, manufactures, and sells production
  equipment for electronics industry in Sweden, rest of Europe, the United States,
  other Americas, China, South Korea, rest of Asia, and internationally. It operates
  through four segments: Pattern Generators, PCB Assembly, High-Volume, and Global
  Technologies. The Pattern Generators segment develops, manufactures, and markets
  mask writers and metrology systems for display manufacturing and production of semiconductors.
  The PCB Assembly segment develops, manufactures, and markets flexible PCB assembly
  solutions, including jet printing, stencil printing, 3D inspection, component placement,
  and automated storage solutions. The High-Volume segment develops, manufactures,
  and markets automated system for dispensing and conformal coating for high-volume
  electronics production. The Global Technologies segment offers die bonding, PCB
  test, photonic interconnects, magnetic test, and applied plasma. The company sells
  its products through agents and distributors. It serves aerospace, defense, medical,
  and industrial electronics sectors. The company was formerly known as Micronic Mydata
  AB (publ) and changed its name to Mycronic AB (publ) in June 2014. Mycronic AB (publ)
  was incorporated in 1989 and is headquartered in Täby, Sweden.'
