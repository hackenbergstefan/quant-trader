longBusinessSummary: Applied Materials, Inc. provides materials engineering solutions,
  equipment, services, and software to the semiconductor and related industries in
  the United States, China, Korea, Taiwan, Japan, Southeast Asia, Europe, and internationally.
  The company operates through Semiconductor Systems and Applied Global Services (AGS)
  segments. The Semiconductor Systems segment includes semiconductor capital equipment
  to enable materials engineering steps, including etch, rapid thermal processing,
  deposition, chemical mechanical planarization, metrology and inspection, wafer packaging,
  and ion implantation. The AGS segment offers integrated solutions to optimize equipment
  and fab performance and productivity comprising spares, upgrades, services, and
  200 millimeter and other equipment and factory automation software for semiconductor
  and other products. It serves manufacturers of semiconductor wafers and chips, and
  other electronic devices. Applied Materials, Inc. was incorporated in 1967 and is
  headquartered in Santa Clara, California.
