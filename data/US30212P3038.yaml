longBusinessSummary: Expedia Group, Inc. operates as an online travel company in the
  United States and internationally. The company operates through B2C, B2B, and trivago
  segments. The B2C segment includes Brand Expedia, a full-service online travel brand
  offers various travel products and services; Hotels.com for lodging accommodations;
  Vrbo, an online marketplace for the alternative accommodations; and Orbitz, Travelocity,
  ebookers, and Wotif Group. The B2B segment provides various travel and non-travel
  companies including airlines, offline travel agents, online retailers, corporate
  travel management, and financial institutions who leverage its travel technology
  and tap into its diverse supply to augment their offerings and market Expedia Group
  rates and availabilities to its travelers. The trivago segment sends referrals to
  online travel companies and travel service providers from hotel metasearch websites.
  In addition, it provides brand advertising through online and offline channels,
  loyalty programs, mobile apps, and search engine marketing, as well as metasearch,
  social media, direct and personalized traveler communications on its websites, and
  through direct e-mail communication with its travelers. The company was formerly
  known as Expedia, Inc. and changed its name to Expedia Group, Inc. in March 2018.
  Expedia Group, Inc. was founded in 1996 and is headquartered in Seattle, Washington.
