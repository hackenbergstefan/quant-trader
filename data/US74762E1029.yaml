longBusinessSummary: Quanta Services, Inc. offers infrastructure solutions for the
  electric and gas utility, power generation, load center, manufacturing, communications,
  pipeline, and energy industries. The company's Electric Infrastructure Solutions
  segment engages in the design, procurement, construction, upgrade, repair, and maintenance
  of electric power transmission and distribution infrastructure and substation facilities;
  installation, maintenance, and upgrade of electric power infrastructure projects;
  installation of smart grid technologies on electric power networks; and design,
  installation, maintenance, and repair of commercial and industrial wirings. This
  segment offers aviation; emergency aerial firefighting services; emergency restoration;
  and other engineering and technical services; design and construction solutions
  to wireline and wireless communications, cable multi-system operators, technology
  companies, and other customers; engineering, procurement, new construction, and
  repair and maintenance services for renewable generation facilities; and training
  for electric workers, as well as training for the gas distribution and communications
  industries. Its Underground Utility and Infrastructure Solutions segment is involved
  in the transportation, distribution, storage, development, and processing of natural
  gas, oil, and other products, as well as owns and operates large load centers. This
  segment also engages in the design, engineering, procurement, construction, upgrade,
  and repair and maintenance services for natural gas systems; pipeline protection,
  integrity testing, rehabilitation, and replacement services; and catalyst replacement,
  high-pressure and critical-path turnaround, instrumentation and electrical, piping,
  fabrication, and storage tank services. The company was formerly known as Fabal
  Construction, Inc. and changed its name to Quanta Services, Inc. in November 1997.
  The company was incorporated in 1997 and is headquartered in Houston, Texas.
