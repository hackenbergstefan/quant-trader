longBusinessSummary: 'ACS, Actividades de Construcción y Servicios, S.A. provides
  construction and related services in Spain, the United States, Australia, Canada,
  Germany, the rest of Europe, and internationally. It operates through five segments:
  Turner, CIMIC, Engineering and Construction, Infrastructure, and Other. The Turner
  segment offers comprehensive construction and project management services, focusing
  on high-tech growth markets, including data centers and battery plants, primarily
  in North America. The CIMIC segment delivers construction, services, and public-private
  partnership (PPP) solutions, and includes mining services through Thiess. The Engineering
  and Construction segment encompasses Dragados'' activities in Europe and North America,
  as well as Hochtief''s construction and PPP operations in Europe. The Infrastructure
  segment covers Iridium and ACS Digital & Energy, and manages a 50% equity interest
  in Abertis Infraestructuras, S.A., focusing on digitalization, energy transition,
  sustainable mobility, concessions, and traditional infrastructure across Europe,
  Latin America, and North America. The Other segment comprises real estate, renewable
  energy, water assets, facilities management, social and health services, and insurance
  activities. The company offers services such as public and private works construction,
  maintenance and operation of transport and urban infrastructure, building restoration,
  development and management of energy and digital infrastructure, environmental services,
  waste treatment, logistics, and auxiliary urban services. ACS, Actividades de Construcción
  y Servicios, S.A. was incorporated in 1942 and is based in Madrid, Spain.'
