longBusinessSummary: 'Regions Financial Corporation, a financial holding company,
  provides various banking and related products and services to individual and corporate
  customers. It operates through three segments: Corporate Bank, Consumer Bank, and
  Wealth Management. The Corporate Bank segment offers commercial banking services,
  such as commercial and industrial, commercial real estate, and investor real estate
  lending; equipment lease financing; deposit products; capital markets activities,
  such as securities underwriting and placement; and loan syndication and placement,
  foreign exchange, derivatives, merger and acquisition, and other advisory services
  to corporate, middle market, and commercial real estate developers and investors.
  The Consumer Bank segment provides consumer banking products and services related
  to residential first mortgages, home equity lines and loans, consumer credit cards,
  and other consumer loans, as well as the corresponding deposit relationships. The
  Wealth Management segment offers credit related products, and retirement and savings
  solutions; and trust and investment management, asset management, and estate planning
  to individuals, businesses, governmental institutions, and non-profit entities.
  It also provides investment and insurance products; home improvement lending, investment
  advisory services, equipment financing for commercial clients, small business customers,
  low-income housing tax credit corporate fund syndication services, financing to
  CRA-qualified customers, and broker-dealer services to commercial clients, as well
  as other specialty financing services. The company was founded in 1971 and is headquartered
  in Birmingham, Alabama.'
