longBusinessSummary: Expeditors International of Washington, Inc., together with its
  subsidiaries, provides logistics services in the Americas, North Asia, South Asia,
  Europe, and Middle East, Africa, and India. The company offers airfreight services,
  such as air freight consolidation and forwarding; ocean freight and ocean services,
  including ocean freight consolidation, direct ocean forwarding, and order management;
  customs brokerage and other services, import, intra-continental ground transportation
  and delivery, and warehousing and distribution services; and customs clearance,
  purchase order management, vendor consolidation, time-definite transportation services,
  temperature-controlled transit, cargo insurance, specialized cargo monitoring and
  tracking, and other logistics solutions. It also provides optimization, trade compliance
  consulting, cargo insurance, cargo security, and solutions. In addition, it acts
  as a freight consolidator or as an agent for the airline that carries the shipment.
  Further, the company provides ancillary services that include preparation of shipping
  and customs documentation, packing, crating, insurance services, and the preparation
  of documentation to comply with local export and import laws. The company was incorporated
  in 1979 and is headquartered in Bellevue, Washington.
