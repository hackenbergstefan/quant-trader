longBusinessSummary: Dino Polska S.A., together with its subsidiaries, operates a
  network of medium-sized grocery supermarkets under the Dino brand in Poland. The
  company stores offer fresh food products, such as meat, poultry, cold cuts, fruits
  and vegetables, dairy products, and bread; other groceries, including children's
  food, breakfast products, ready to eat meals, beverages, candies, snacks, frozen
  goods, processed goods, oils, grain and bulk products, condiments, and alcohol and
  cigarettes; and non-grocery products comprising flowers, cleaning agents, sanitary
  articles, pet food, seasonal products, and small household appliances. It also produces
  meat products; rents and operates owned and leased real estate; purchases and sells
  real estate properties; and manufactures and processes refined petroleum products,
  as well as offers other financial services. In addition, it engages in the retail
  sale of automotive fuel in specialized stores; operation of warehousing and storage
  facilities; retail sales run by mail order houses or the internet; and advertising
  agency activities. The company was founded in 1999 and is based in Krotoszyn, Poland.
