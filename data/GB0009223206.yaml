longBusinessSummary: 'Smith & Nephew plc, together with its subsidiaries, develops,
  manufactures, markets, and sells medical devices and services in the United Kingdom,
  the United States, and internationally. The company operates in three segments:
  Orthopaedics, Sports Medicine & ENT, and Advanced Wound Management. It offers knee
  implant products for knee replacement procedures; hip implants for revision procedures;
  trauma and extremities products that include internal and external devices used
  in the stabilization of severe fractures and deformity correction procedures; and
  other reconstruction products. The company also provides sports medicine joint repair
  products comprise instruments, technologies, and implants to perform minimally invasive
  surgery, as well as treating soft tissue injuries and degenerative conditions of
  the shoulder, knee, hip, and small joints. In addition, it provides arthroscopic
  enabling technologies comprising fluid management equipment for surgical access,
  cameras, digital image capture, scopes, light sources, and monitors to assist with
  visualization inside the joints, radio frequency, electromechanical and mechanical
  tissue resection devices, and hand instruments for removing damaged tissue; and
  ear, nose, and throat solutions. Further, the company offers advanced wound care
  products for the treatment and prevention of acute and chronic wounds, leg, diabetic
  and pressure ulcers, burns, and post-operative wounds; advanced wound bioactives,
  such as biologics and other bioactive technologies for debridement and dermal repair/regeneration,
  and regenerative medicine products, including skin, bone graft, and articular cartilage
  substitutes; and advanced wound devices, such as traditional and single-use negative
  pressure wound therapy, and hydrosurgery systems. It serves the healthcare providers.
  Smith & Nephew plc was founded in 1856 and is headquartered in Watford, the United
  Kingdom.'
