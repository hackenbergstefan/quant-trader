longBusinessSummary: Entain Plc operates as a sports-betting and gaming company in
  the United Kingdom, Ireland, Italy, rest of Europe, Australia, New Zealand, and
  internationally. It provides online and multi-channel betting under the Ladbrokes
  name; street and online betting under the Coral name; online sports betting, casino,
  and gaming under the Eurobet name; scores, sports information, editorial and social
  content, and sports focused free-to play games under the 365Scores name; sports
  betting and gaming operator under the SuperSport and BetCity names; online betting
  under the bwin name; and sports betting, poker, and casino games under the Crystalbet
  name. The company also offers online casino and sports betting under the Optibet
  name; online bingo under the Gala Bingo; online bingo under the Foxy Bingo name;
  sportsbetting and gaming under the Sports Interaction and Vistabet names; games
  under the Nutz and Laimz names; game under the boost casino name; online gaming
  under the Borgata Bingo name; bingo and casino under the Foxy Games name; online
  bingo, sportsbook, casino, and poker under the betboo; and management software solutions
  for racing and sportsbooks under the Stadium name. In addition, it offers sports
  betting and iGaming under the BetMGM and Sportingbet names; sports betting under
  the Ladbrokes Australia, TAB, betcha, and STS names; Gioco Digitale, an online poker
  platform; Ladbrokes Belgium, a sports betting platform; online casino under the
  Ninja Casino and PartyCasino names; casino and live casino under the Gala Casino
  name; online poker under the PartyPoker name; sports under the Neds and Klondaika
  names; and iGaming platform under the Finnplay name. The company was incorporated
  in 2004 and is based in Douglas, Isle of Man.
