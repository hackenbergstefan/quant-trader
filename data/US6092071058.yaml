longBusinessSummary: Mondelez International, Inc., through its subsidiaries, manufactures,
  markets, and sells snack food and beverage products in Latin America, North America,
  Asia, the Middle East, Africa, and Europe. The company provides biscuits and baked
  snacks, including cookies, crackers, salted snacks, snack bars, and cakes and pastries;
  chocolates; and gums and candies, as well as various cheese, grocery, and powdered
  beverage products. Its brand portfolio includes Oreo, Ritz, LU, CLIF Bar, Tate's
  Bake Shop biscuits and baked snacks, Cadbury Dairy Milk, Milka, and Toblerone chocolate.
  It serves supermarket chains, wholesalers, supercenters, club stores, mass merchandisers,
  distributors, convenience stores, gasoline stations, drug stores, value stores,
  and other retail food outlets through direct store delivery, company-owned and satellite
  warehouses, distribution centers, third-party distributors, and other facilities,
  as well as through independent sales offices and agents. The company also sells
  products directly to businesses and consumers through e-retail platforms, retailer
  digital platforms, as well as through its direct-to-consumer websites and social
  media platforms. Mondelez International, Inc. was formerly known as Kraft Foods
  Inc. and changed its name to Mondelez International, Inc. in October 2012. The company
  was incorporated in 2000 and is headquartered in Chicago, Illinois.
