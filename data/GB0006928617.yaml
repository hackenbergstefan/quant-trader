longBusinessSummary: Unite Group PLC is the UK's largest owner, manager and developer
  of purpose-built student accommodation (PBSA) serving the country's world-leading
  higher education sector. Its property portfolio includes the Unite Students and
  Hello Student brands. Together, the Group provides homes for 72,000 students across
  207 properties in 29 leading university towns and cities. The firm currently partners
  with over 60 universities across the UK. The people are driven by a shared purpose,
  (to provide a home for success for the students who live with us). The firm's accommodation
  is safe, secure, high quality and affordable, with students living predominantly
  in en-suite study bedrooms. Rents are all inclusive, covering bills, insurance,
  24 hour security and high speed Wi Fi. Unite Group are committed to raising standards
  across the student accommodation sector for their customers, investors and employees.
  Their Sustainability Strategy includes a commitment to become net zero carbon across
  our operations and developments by 2030. Unite Group PLC was incorporated in 1991
  in United Kingdom.
