longBusinessSummary: Hensoldt AG, together with its subsidiaries, provides sensor
  solutions for defense and security applications worldwide. It operates through Sensors
  and Optronics segments. It offers mobile and stationary radar, and identification
  friend or foe systems used for surveillance, reconnaissance, civil air traffic control,
  and air defense; systems for secure data connections for air, sea and land platforms;
  electronic systems for the acquisition and evaluation of radar and radio signals
  and jammers; defensive cyber solutions; and situational awareness systems, mission
  computers, and flight data recorders. The company also provides electronic self-protection
  systems that integrate missile, laser and radar warning sensors; customer support
  and service activities; simulation solutions, training courses and special services,
  and components and solutions for space-based sensors; and solutions and services
  for secure digitalization and networking in military and civil dimensions. In addition,
  it offers telescopic sights, visors, laser rangefinders, night vision devices and
  thermal imaging cameras; devices for surveillance and target acquisition for armored
  vehicles; submarine periscopes, optronic mast systems, and other electro-optical
  systems for use at sea; and mobile and stationary surveillance solutions; and special
  equipment for industrial and space applications. Further, the company provides friend-or-foe
  detection systems, radar for ship and land applications, cryptographic devices,
  and tactical point-to-point communication systems; delivery, installation and maintenance
  of air traffic control radar, weather radar, navigation, voice communications, and
  runway lighting systems for military and civil airports; and software solutions
  for military and non-military use. Hensoldt AG was incorporated in 2020 and is headquartered
  in Taufkirchen, Germany.
