longBusinessSummary: "Derwent London Plc owns a commercial real estate portfolio predominantly\
  \ in central London valued at 5.0 billion pounds as at 30 June 2026, making it the\
  \ largest London office-focused real estate investment trust (REIT). Their experienced\
  \ team has a long track record of creating value throughout the property cycle by\
  \ regenerating buildings via redevelopment or refurbishment, effective asset management\
  \ and capital recycling. The firm typically acquires central London properties off\
  \ market with low capital values and modest rents in improving locations, most of\
  \ which are either in the West End or City Borders. They capitalize on the unique\
  \ qualities of each of their properties \x96 taking a fresh approach to the regeneration\
  \ of every building with a focus on anticipating tenant requirements and an emphasis\
  \ on design. Reflecting and supporting their long-term success, the business has\
  \ a strong balance sheet with modest leverage, a robust income stream and flexible\
  \ financing. They are frequently recognized in industry awards for the quality,\
  \ design and innovation of our projects. Landmark buildings in their 5.2 million\
  \ sq ft portfolio include 25 Baker Street W1, 1 Soho Place W1, 80 Charlotte Street\
  \ W1, Brunel Building W2, White Collar Factory EC1, Angel Building EC1 and Tea Building\
  \ E1. As part of commitment to lead the industry in mitigating climate change, Derwent\
  \ London has committed to becoming a net zero carbon business by 2030, with its\
  \ updated pathway published in 2025. Their science-based carbon targets have been\
  \ validated by the Science Based Targets initiative (SBTi). In 2013, the firm launched\
  \ a voluntary Community Fund which to date has supported 200 community projects\
  \ in central London. Derwent London Plc is a public limited company and incorporated\
  \ and domiciled in the UK. The address of its registered office is 25 Savile Row,\
  \ London, W1S 2ER."
