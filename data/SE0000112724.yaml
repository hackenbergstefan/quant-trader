longBusinessSummary: 'Svenska Cellulosa Aktiebolaget SCA (publ) operates in the forest
  business in Sweden, Germany, the United States, the United Kingdom, the rest of
  Europe, Asia, and internationally. It operates in five segments: Forest, Wood, Pulp,
  Containerboard, and Renewable Energy. The company offers various sawn wood products;
  wood solutions for industrial buildings comprising construction timber, outer panels,
  dimensionally planed timber, laths, base rafters, planks, and shaped timber products;
  wood solutions for merchants, including joists, battens, untreated and painted outer
  panels, as well as pressure-impregnated wood products; logistics services consisting
  of marine and land transportation services, such as forwarding services using RoRo
  vessels, container express, and road and rail; and wood pellets. It also provides
  pulp products comprising bleached softwood kraft pulp and chemical thermomechanical
  pulp; packaging paper/kraftliner products for consumer durables, electronics, hazardous
  goods, industrial products, fruit and vegetables, and frozen food; refined and unrefined
  solid biofuels, and liquid biofuels; and green products, such as tall oil, turpentine,
  district heating, and green electricity. In addition, the company engages in the
  management and harvesting of forest land, which includes the provision of hunting
  and fishing privileges; sourcing and transporting of timber; and wind power operations.
  It exports its products. Svenska Cellulosa Aktiebolaget SCA (publ) was incorporated
  in 1915 and is headquartered in Sundsvall, Sweden.'
