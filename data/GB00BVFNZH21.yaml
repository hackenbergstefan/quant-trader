longBusinessSummary: 'Rotork plc manufactures industrial flow control and instrumentation
  solutions for the oil and gas, water and wastewater, power, chemical process, and
  industrial markets. It operates through three segments: Oils & Gas; Water & Power;
  and Chemical, Process & Industrial segments. The company provides electric industrial,
  electric intelligent, electro-hydraulic, heavy and light duty fluid, and precision
  modulating actuators; and flow pressure control and filtration, gearbox accessories,
  master station, networks and protocols, multi-turn gearboxes, valve positioners
  and controllers, part-turn gearboxes, HVAC actuators and sensors, instrumentation
  valves, electrical instrumentation, and limit switches and position transmitters.
  It also provides integrated ethernet, packaged solutions, carbon capture and storage,
  hydrogen industrial gases, desalination, and methane emissions reduction solutions.
  The company offers its products under the Bifold, Centork, Fairchild, Hanbay, Mastergear,
  Midland, M&M International, Remote Control, RotoHammer, Schischek, Soldo Controls,
  and YTC brand names. It operates in the United Kingdom, the Asia Pacific, the United
  States, Europe, the Middle East, Africa, and internationally. Rotork plc was founded
  in 1956 and is headquartered in Bath, the United Kingdom.'
