longBusinessSummary: 'CRH plc, together with its subsidiaries, provides building materials
  solutions in Ireland, the United States, the United Kingdom, rest of Europe, and
  internationally. It operates through three segments: Americas Materials Solutions,
  Americas Building Solutions, and International Solutions. The company offers building
  materials for the construction and maintenance of public infrastructure, and commercial
  and residential buildings, as well as construction and renovation of transportation
  infrastructure, critical utility networks, commercial and residential buildings,
  and outdoor living spaces; paving and construction services; and produces and sells
  aggregates, cementitious materials, ready mixed concrete and mortars, and asphalt.
  It also manufactures, supplies, and delivers building products for the built environment
  in communities in North America; and provides building and infrastructure solutions
  for complex critical utility infrastructure, such as water, energy, transportation,
  and telecommunications projects, and outdoor living solutions for private and public
  spaces. In addition, the company produces and supplies precast and pre-stressed
  concrete products comprising vaults, pipes, and manholes; and concrete and polymer-based
  products, such as underground vaults, drainage systems, enclosures, and modular
  precast structures for applications in transportation, water, energy, and telecommunications
  markets. Further, it provides crushed stone, sand, and gravel; granite, limestone,
  and sandstone; fly ash, pozzolans, synthetic gypsum, calcined clay, and ground granulated
  blast-furnace slags; fencing and railing systems, lawn and garden products, and
  packaged concrete mixes; and concrete masonry, hardscape and related products, including
  pavers, blocks and curbs, retaining walls, and slabs. CRH plc was founded in 1936
  and is based in Dublin, Ireland.'
