longBusinessSummary: 'Centene Corporation operates as a managed care company that
  provides programs and services to under-insured families, and commercial organizations
  in the United States. It operates through four segments: Medicaid, Medicare, Commercial,
  and Other. The Medicaid segment offers the temporary assistance for needy families;
  medicaid expansion; aged, blind, or disabled; and children''s health insurance programs,
  as well as long-term services and supports; foster care; and medicare-medicaid plans.
  This segment also provides healthcare products and services. The Medicare segment
  offers special needs and medicare supplement, and prescription drug plans. The Commercial
  segment provides health insurance marketplace product for individual and commercial
  group. The Other segment operates clinical healthcare and pharmacies, as well as
  offers vision and dental, behavioral health, and centralized services. It provides
  services through primary and specialty care physicians, hospitals, behavioral health
  practitioners, and ancillary providers. The company was founded in 1984 and is headquartered
  in Saint Louis, Missouri.'
