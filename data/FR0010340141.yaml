longBusinessSummary: 'Aeroports de Paris SA, together with its subsidiaries, operates
  and designs airports in France, Turkey, Kazakhstan, Jordan, Georgia, and internationally.
  It operates in five segments: Aviation; Retail and Services; Real Estate; International
  and Airport Developments; and Other Activities. The Aviation segment offers airport
  services, such as landing, parking, and passengers; check-in and boarding counters,
  baggage handling facilities, de-icing facilities, and the supplying of electricity
  to aircraft; and security and airport safety services, including security checkpoints
  and screening systems, aircraft rescue, and fire-fighting services. Its Retail and
  Services segment is involved in retail activities in terminals comprising retail
  shops, bars and restaurants, banks and currency exchange offices, and car rentals;
  commercial distribution; advertising; car parks; production and supply of heat,
  drinking water, and access to the chilled distribution networks; tourism; luxury
  passenger services; and construction of metro station. The Real Estate segment engages
  in property leasing services; construction, commercialization, and lease management
  of office buildings, logistic buildings, and freight terminals; and rental of serviced
  land. Its International and Airport Developments segment designs and operates airport
  activities. The Other Activities segment offers telecom and cybersecurity services.
  Aeroports de Paris SA was incorporated in 1945 and is headquartered in Tremblay-en-France,
  France.'
