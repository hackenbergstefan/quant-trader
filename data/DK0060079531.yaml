longBusinessSummary: 'DSV A/S offers freight forwarding and logistics services in
  Europe, the Middle East, Africa, North America, South America, Asia, Australia,
  and the Pacific. It operates through three segments: Air & Sea, Road, and Solutions.
  The company provides air freight, charter, and sea-air freight services, as well
  as unit load devices; sea freight services, including less-than-container load services,
  sea freight services, break bulk, sea containers, and DSV LCL sailing schedule services;
  and warehousing, e-commerce fulfilment, supply chain, contract logistics, and logistics
  solutions. It also offers road freight services, such as full load, part load, and
  groupage; conventional freight forwarding services and tailored project cargo solutions;
  and freight management, customs clearance, decarbonising logistics, order management,
  insurance, and e-commerce solutions. The company serves the automotive, technology,
  healthcare, energy, industrial, consumer, defense, aerospace, and chemical industries.
  The company was formerly known as DSV Panalpina A/S and changed its name to DSV
  A/S in September 2021. DSV A/S was incorporated in 1976 and is based in Hedehusene,
  Denmark.'
