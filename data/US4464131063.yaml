longBusinessSummary: 'Huntington Ingalls Industries, Inc. designs, builds, overhauls,
  and repairs military ships in the United States. It operates through three segments:
  Ingalls, Newport News, and Mission Technologies. The company is involved in the
  design and construction of non-nuclear ships comprising amphibious assault ships,
  surface combatants, and national security cutters for the U.S. Navy and U.S. Coast
  Guard. It also provides nuclear-powered ships, such as aircraft carriers and submarines,
  as well as refueling and overhaul, and inactivation services of nuclear-powered
  aircraft carriers. In addition, the company offers naval nuclear support services,
  including fleet services comprising design, construction, maintenance, and disposal
  activities for in-service the U.S. Navy nuclear ships; and maintenance services
  on nuclear reactor prototypes. Further, the company provides C5ISR systems and operations;
  application of artificial intelligence and machine learning to battlefield decisions;
  defensive and offensive cyberspace strategies and electronic warfare; uncrewed autonomous
  systems; live, virtual, and constructive solutions; platform modernization; and
  critical nuclear operations. The company has a strategic partnership with HD Hyundai
  Heavy Industries to implement intelligent mechanized welding systems at Huntington
  Ingalls Industries, Inc.''s Ingalls Shipbuilding division. Huntington Ingalls Industries,
  Inc. was founded in 1886 and is headquartered in Newport News, Virginia.'
