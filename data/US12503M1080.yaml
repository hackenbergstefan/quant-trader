longBusinessSummary: 'Cboe Global Markets, Inc., through its subsidiaries, operates
  as a derivatives and securities exchange network that delivers trading, clearing,
  and investment solutions in the United States and internationally. It operates through
  five segments: Options, North American Equities, Europe and Asia Pacific, Futures,
  and Global FX. The Options segment includes options on market indices, stocks of
  individual corporations, and exchange-traded products (ETPs), such as exchange-traded
  funds (ETFs) and exchange-traded notes (ETNs). This segment also offers trading
  in listed options through a single system. The North American Equities segment comprises
  U.S. equities and ETP transaction services. This segment also includes listing services
  on Cboe Canada, ETP listings on BZX, the Cboe Global Markets, Inc. common stock
  listing, and applicable market data. The Europe and Asia Pacific segment provides
  pan-European derivatives transaction services; ETPs, including exchange-traded funds,
  exchange-traded notes, and exchange-traded commodities; international depository
  receipts; and an ETP listings business on regulated markets and clearing activities,
  as well as equities services. The Futures segment offers transaction services, including
  trading in VIX futures and other futures products, the licensing of proprietary
  market data, and access and capacity services. The Global FX segment provides institutional
  foreign exchange (FX) trading and non-deliverable forward FX transaction services.
  The company also provides trading solutions and products in multiple asset classes,
  including equities, derivatives, and FX across North America, Europe, and Asia Pacific.
  It has strategic relationships with S&P Dow Jones Indices, LLC; Frank Russell Company;
  and FTSE International Limited. The company was formerly known as CBOE Holdings,
  Inc. and changed its name to Cboe Global Markets, Inc. in October 2017. Cboe Global
  Markets, Inc. was founded in 1973 and is headquartered in Chicago, Illinois.'
