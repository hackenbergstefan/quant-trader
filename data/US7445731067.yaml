longBusinessSummary: Public Service Enterprise Group Incorporated, through its subsidiaries,
  operates in electric and gas utility, and nuclear generation businesses in the United
  States. It operates through PSE&G and PSEG Power segments. The PSE&G segment transmits
  electricity; distributes electricity and natural gas to residential, commercial,
  and industrial customers; and appliance services and repairs to customers through
  its service territory, as well as invests in solar generation projects, and energy
  efficiency and related programs. The PSEG Power segment engages in nuclear generation
  businesses; and supplies power and natural gas to nuclear power plants. As of December
  31, 2025, it had electric transmission and distribution system of 25,000 circuit
  miles and 871,000 poles; 58 switching stations with an installed capacity of 40,000
  megavolt-amperes (MVA), and 238 substations with an installed capacity of 10,890
  MVA; four electric distribution headquarters and five electric sub-headquarters;
  18,000 miles of gas mains, 12 gas distribution headquarters, two sub-headquarters,
  and two meter shop, as well as 54 natural gas metering and regulating stations;
  and 158 MegaWatts defined conditions of installed PV solar capacity. The company
  was founded in 1903 and is based in Newark, New Jersey.
