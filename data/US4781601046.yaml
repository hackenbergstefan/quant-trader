longBusinessSummary: Johnson & Johnson, together with its subsidiaries, engages in
  the research and development, manufacture, and sale of a range of products in the
  healthcare field worldwide. It operates in two segments, Innovative Medicine and
  MedTech. The Innovative Medicine segment offers products for various therapeutic
  areas, such as oncology, immunology, neuroscience, pulmonary hypertension, infectious
  diseases, and cardiovascular and metabolism distributed through retailers, wholesalers,
  distributors, hospitals, and healthcare professionals for prescription use. The
  MedTech segment provides a portfolio of products used in the surgery, orthopedic,
  cardiovascular, and vision fields distributed through wholesalers, hospitals and
  retailers, and used in the professional fields by physicians, nurses, hospitals,
  eye care professionals and clinics. This segment also offers products and enabling
  technologies that support joint reconstruction, trauma, spine, sports related injuries,
  and others, as well as open, laparoscopic, and robotic surgical procedures; instrumentation,
  energy devices, stapling systems, wound closure, biosurgery products, and digital
  and robotic technologies; breast aesthetics and reconstruction; contact lenses under
  the ACUVUE brand; intraocular lenses for cataract surgery, and other products used
  in cataract and refractive procedures under the TECNIS brand. The company was founded
  in 1886 and is based in New Brunswick, New Jersey.
