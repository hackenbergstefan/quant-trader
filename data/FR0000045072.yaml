longBusinessSummary: "Crédit Agricole S.A. provides retail and corporate banking,\
  \ insurance, and investment banking products and services in France, Italy, rest\
  \ of the European Union, rest of Europe, North America, Central and South America,\
  \ Africa, the Middle East, the Asia Pacific, and Japan. It operates in five segments:\
  \ Asset Gathering, Large Customers, Specialized Financial Services, French Retail\
  \ Banking \x96 LCL, and International Retail Banking. The company offers savings/retirement,\
  \ death and disability/creditor/group, and property and casualty insurance products;\
  \ asset management; investment solutions; banking products and services, savings,\
  \ wealth management, payment, cash flow management, and online banking services;\
  \ personal finance and mobility; and specialized financial services. It also provides\
  \ investment banking, structured finance, international trade finance, commercial\
  \ banking, capital market, and syndication services; leasing, factoring, and energy\
  \ and territorial financing; and asset servicing solutions for investment products,\
  \ as well as various asset classes, such as execution, clearing, forex, security\
  \ lending, custody, depositary banking, fund administration, middle-office outsourcing,\
  \ fund distribution, and issuer services. In addition, the company offers property\
  \ services, including transactions, rental, rental management, condominium trustee,\
  \ and renovation under the Square Habitat brand; property development and management;\
  \ and low-carbon electricity production. The company serves individuals, SMEs, small\
  \ businesses, corporates, farmers, financial institutions, local authorities, asset\
  \ managers, insurance companies, institutional investors, pension and unlisted funds,\
  \ banks, and brokers. Crédit Agricole S.A. was founded in 1894 and is headquartered\
  \ in Montrouge, France. Crédit Agricole S.A. operates as a subsidiary of SAS Rue\
  \ La Boetie."
