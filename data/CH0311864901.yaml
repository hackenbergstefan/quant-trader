longBusinessSummary: VAT Group AG, together with its subsidiaries, engages in the
  development, manufacture, and sale of vacuum and gas inlet valves, multi-valve modules,
  motion components, and edge-welded metal bellows. It operates in two segments, Valves
  and Global Service. The Valves segment offers vacuum valves for the semiconductor,
  displays, photovoltaics, and vacuum coating industries, as well as for the industrial
  and research sectors. The Global Service segment provides spare parts, repairs,
  and upgrades, as well as support services. The company offers vacuum isolation,
  gate, angle, inline, check, cylinder, and all-metal valves; vacuum pendulum and
  butterfly valves; 3 position, multi-value, and vacuum control valves; vacuum transfer
  valves and doors; pressure relief/venting, gas dosing, and fast closing/beam stopper
  valves; and flange connections, bellows, and vacuum modules. It has operations in
  Switzerland, rest of Europe, the United States, Japan, Korea, Singapore, China,
  rest of Asia, and internationally. VAT Group AG was founded in 1965 and is headquartered
  in Solothurn, Switzerland.
