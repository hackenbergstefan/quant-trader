longBusinessSummary: United Airlines Holdings, Inc., through its subsidiaries, provides
  air transportation services in the United States, Canada, Atlantic, the Pacific,
  and Latin America. It transports people and cargo through its mainline and regional
  fleets. The company also offers ground handling, flight academy, frequent flyer
  award non-travel redemptions, and maintenance services for third parties. In addition,
  it provides freight and mail transportation services to commercial businesses, freight
  forwarders, logistics firms, and national postal services, as well as loyalty programs.
  The company distributes its products through direct channels, such as the Company's
  website and the Company's mobile app; and traditional travel agencies, online travel
  agencies, and other intermediaries. The company was formerly known as United Continental
  Holdings, Inc. and changed its name to United Airlines Holdings, Inc. in June 2019.
  United Airlines Holdings, Inc. was incorporated in 1968 and is based in Chicago,
  Illinois.
