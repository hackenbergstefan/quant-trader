longBusinessSummary: Best Buy Co., Inc. offers technology products and solutions in
  the United States, Canada, and internationally. The company provides computing and
  mobile phone products, such as desktops, notebooks, and peripherals; mobile phones
  comprising related mobile network carrier commissions; networking products; tablets
  covering e-readers; smartwatches; and consumer electronics consisting of digital
  imaging, health and fitness products, portable audio comprising headphones and portable
  speakers, and smart home products, as well as home theaters that includes home theater
  accessories, soundbars, and televisions. It also offers appliances, such as dishwashers,
  laundry, ovens, refrigerators, blenders, coffee makers, vacuums, and personal care;
  entertainment products consisting of drones, peripherals, gaming, toys, and virtual
  reality, as well as hardware and software, and augmented reality glasses and other
  software products; and other products, such as baby, food and beverage, luggage,
  and outdoor living products. In addition, the company provides delivery, installation,
  marketplace commissions, memberships, repair, set-up, technical support, health-related,
  and warranty-related services. It offers its products through stores and websites
  under the Best Buy, Best Buy Ads, Best Buy Business, Best Buy Essentials, Best Buy
  Health, Best Buy Marketplace, Geek Squad, Imagine That, Insignia, Lively, Jitterbug,
  My Best Buy, My Best Buy Memberships, Pacific Kitchen, Home, TechLiquidators, and
  Yardbird brand names, as well as domain names comprising bestbuy.com, lively.com,
  techliquidators.com, yardbird.com, bestbuy.ca, and techliquidators.ca. The company
  was formerly known as Sound of Music, Inc. Best Buy Co., Inc. was incorporated in
  1966 and is headquartered in Richfield, Minnesota.
