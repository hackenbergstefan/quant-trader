longBusinessSummary: AB SKF (publ) designs, manufactures, and sells bearings and units,
  seals, lubrication systems, condition monitoring, and services worldwide. It operates
  in two segments, Industrial and Automotive. The company offers rolling, mounted
  and housings, super-precision, slewing, plain, magnetic, and thin section bearings;
  industrial and automotive seals; lubricants, manual lubrication tools, lubricators,
  automatic lubrication systems, and lubrication system components; maintenance products,
  such as hydraulic, mechanical, and alignment tools, as well as heaters; belts, pulleys,
  chains, sprockets, bushings and hubs, couplings, and bolts and tightening systems;
  condition monitoring systems; test and measuring equipment, such as waviness and
  roundness analyzers, noise and vibration testers, and grease test rigs, as well
  as calibration with traceability, machine training and support, and upgrades and
  refurbishment services; and vehicle aftermarket products. It provides application
  engineering services consisting of technical consultancy, numerical simulation and
  design, and root cause analysis; asset management services, such as assessment and
  benchmarking, maintenance strategy review, spare parts and inventory management,
  and lubrication management; condition-based maintenance, including vibration analysis
  and diagnostics, thermography, lubrication analysis, and condition monitoring system
  installation; mechanical maintenance comprising mounting and dismounting, precision
  alignment, and balancing; remanufacturing and customization; and training solutions,
  which include instructor-led training, e-learning courses, and webinar recordings.
  It serves the aerospace, agriculture, automotive, construction, food and beverage,
  general machinery, machine tools, marine, material handling, metals, mining, mineral
  processing, ocean energy, pulp and paper, railways, and wind industries. The company
  was incorporated in 1907 and is headquartered in Gothenburg, Sweden.
