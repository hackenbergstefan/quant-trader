longBusinessSummary: Naturgy Energy Group, S.A., together with its subsidiaries, engages
  in the supply, liquefaction, regasification, transport, storage, distribution, and
  sale of gas. It operates through Distribution Networks and Energy Markets segments.
  The company is involved in the regulated gas and electricity distribution; management
  of transport infrastructure; trade and shipping of liquefied natural gas; supply,
  procurement, and management of other gas infrastructure; and management of gas pipeline.
  It also manages conventional thermal generation facilities; facilities and generation
  projects using wind energy, mini hydro, solar and cogeneration, as well as hydroelectric
  power; photovoltaic generation projects; and renewable electricity generation projects.
  In addition, the company is involved in renewable gas projects, such as biomethane
  and green hydrogen; supply of gas, electricity and services to end customers. It
  operates in Spain, Australia, the United States, Argentina, Brazil, Chile, Mexico,
  Panama, the rest of Latin America, and the rest of Europe. The company was formerly
  known as Gas Natural SDG, S.A. and changed its name to Naturgy Energy Group, S.A.
  in June 2018. Naturgy Energy Group, S.A. was incorporated in 1843 and is based in
  Madrid, Spain.
