longBusinessSummary: 'Advanced Micro Devices, Inc. operates as a semiconductor company
  internationally. It operates in three segments: Data Center, Client and Gaming,
  and Embedded. The company offers artificial intelligence (AI) accelerators, microprocessors,
  and graphics processing units (GPUs) as standalone devices or as incorporated into
  accelerated processing units, chipsets, and data center and professional GPUs; and
  embedded processors and semi-custom system-on-chip (SoC) products, microprocessor
  and SoC development services and technology, data processing units, field programmable
  gate arrays (FPGA), system on modules, AI network interface cards, and adaptive
  SoC products. It provides processors under the AMD Ryzen, AMD Ryzen AI, AMD Ryzen
  PRO, AMD Ryzen Threadripper, AMD Ryzen Threadripper PRO, AMD Athlon, and AMD PRO
  A-Series brands; graphics under the AMD Radeon graphics and AMD Embedded Radeon
  graphics; professional graphics under the AMD Radeon Pro graphics brand; and AI
  and general-purpose compute infrastructure for hyperscale providers. The company
  offers data center graphics under the AMD Instinct accelerators and Radeon PRO V-series
  brands; server microprocessors under the AMD EPYC brand; low power solutions under
  the AMD Athlon, AMD Geode, AMD Ryzen, AMD EPYC, and AMD R-Series and G-Series brands;
  FPGA products under the Virtex-6, Virtex-7, Virtex UltraScale+, Kintex-7, Kintex
  UltraScale, Kintex UltraScale+, Artix-7, Artix UltraScale+, Spartan-6, and Spartan-7
  brands; adaptive SOCs under the Zynq-7000, Zynq UltraScale+ MPSoC, Zynq UltraScale+
  RFSoCs, Versal HBM, Versal Premium, Versal Prime, Versal AI Core, Versal AI Edge,
  Vitis, and Vivado brands; and compute and network acceleration board products under
  the Alveo and Pensando brands. It serves original equipment and design manufacturers,
  public cloud service providers, system integrators, distributors, and add-in-board
  manufacturers. The company was incorporated in 1969 and is headquartered in Santa
  Clara, California.'
