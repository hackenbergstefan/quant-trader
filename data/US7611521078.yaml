longBusinessSummary: ResMed Inc. engages in the digital health and cloud-connected
  medical devices business in the United States and internationally. It operates in
  two segments, Sleep and Breathing Health, and Residential Care Software. The company
  offers sleep recorders for the diagnosis and titration of sleep apnea in sleep clinics,
  hospitals, and at home, including ApneaLink Air, a portable diagnostic device that
  measures oximetry, respiratory effort, pulse, nasal flow, and snoring; NightOwl,
  a portable, cloud-connected, and disposable diagnostic device that measures AHI
  based on derived peripheral arterial tone, actigraphy, and oximetry; and EasyCare
  Tx, a sleep lab solution. It also provides AirView, a cloud-based system that enables
  remote monitoring and changing of patients' device settings; myAir, a personalized
  therapy management application for patients with sleep apnea that provides support,
  education, and troubleshooting tools for increased patient engagement and improved
  compliance; and connectivity module which provides a cellular connection between
  compatible ventilation devices and AirView system. In addition, the company offers
  Brightree solutions which are solutions and services for organizations in home medical
  equipment and pharmacy, orthotic and prosthetic, and home infusion; HEALTHCAREfirst
  solutions that offers electronic health record, software, billing and coding services,
  and advanced analytics that enables home health and hospice agencies to optimize
  clinical, financial and administrative processes; MatrixCare EHR software as a service
  solutions used by skilled nursing and senior living providers, life plan communities,
  and home health and hospice sectors; and MEDIFOX DAN software solutions that is
  used by residential care providers, such as home health and nursing home providers.
  ResMed Inc. was founded in 1989 and is headquartered in San Diego, California.
