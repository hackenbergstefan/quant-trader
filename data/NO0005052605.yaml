longBusinessSummary: Norsk Hydro ASA engages in power production, bauxite extraction,
  alumina refining, aluminum smelting, recycling activities, and extruded solutions
  worldwide. The company operates through Hydro Bauxite & Alumina, Hydro Aluminium
  Metal, Hydro Metal Markets, Hydro Extrusions, and Hydro Energy segments. The Hydro
  Bauxite & Alumina segment engages in bauxite mining activities, production of alumina,
  and related commercial activities, primarily the sale of alumina. The Hydro Aluminium
  Metal segment is involved in the primary aluminum production casting activities.
  This segment principally offers extrusion ingots, foundry alloys, and sheet and
  standard ingots. The Hydro Metal Markets segment sells products from the company's
  primary metal plants; operates recyclers; and trades in physical and financial metals.
  The Hydro Extrusions segment offers extrusion profiles, building systems, and precision
  tubing products for construction, automotive and heating, and ventilation and air
  conditioning sectors, as well as operates recycling facilities. The Hydro Energy
  segment engages in the trading and wholesale business in Brazil; energy sourcing
  operations; and operation of power stations in Norway, as well as renewable energy
  production, such as wind and solar. The company also provides extruded solutions.
  Norsk Hydro ASA was founded in 1905 and is headquartered in Oslo, Norway.
