longBusinessSummary: Xcel Energy Inc., through its subsidiaries, operates as an electric
  and natural gas delivery company in the United States. It operates through Regulated
  Electric Utility and Regulated Natural Gas Utility segments. The company generates,
  purchases, transmits, distributes, and sells electricity through its energy portfolio,
  including wind, nuclear, hydroelectric, biomass, and solar power from both owned
  generation facilities and PPAs, as well as its fossil fuel energy portfolio, such
  as coal and natural gas; sale and resale of wholesale transmission service; and
  engages in wholesale commodity and trading operations. It also purchases, transports,
  stores, distributes, and sells natural gas; develops and leases natural gas pipelines
  and storage facilities; operates interstate natural gas pipeline; and invests in
  rental housing projects, energy technology companies, and community solar garden
  nonregulated assets. It serves electric and natural gas customers in portions of
  Colorado, Michigan, Minnesota, New Mexico, North Dakota, South Dakota, Texas, and
  Wisconsin. The company was formerly known as Northern States Power company. Xcel
  Energy Inc. was incorporated in 1909 and is headquartered in Minneapolis, Minnesota.
