longBusinessSummary: Xylem Inc., together with its subsidiaries, engages in the design,
  manufacture, and servicing of engineered products and solutions for utility, industrial,
  and residential and commercial building services settings worldwide. It operates
  through Water Infrastructure; Applied Water; Measurement and Control Solutions;
  and Water Solutions and Services segments. The company offers water, wastewater,
  and storm water pumps and controls and systems; filtration, disinfection, and biological
  treatment equipment under the Flygt, Ionpure, Leopold, Neptune Benson, Sanitare,
  Wallace & Tiernan, and Wedeco brands; and pumps, valves, heat exchangers, controls,
  and dispensing equipment used for water and focuses on the residential, commercial
  and industrial markets under the Rule, Bell & Gossett, Flojet, Goulds Water Technology,
  Jabsco, and Lowara brands. It also provides smart meters, network communication
  devices, data analytics, test instruments, controls, sensor devices, software and
  managed services, critical infrastructure services, cloud-based analytics, and remote
  monitoring and data management under the Ebro, Sensus, Sentec, Smith Blair, WTW,
  YSI, and Xylem Vue brands. In addition, the company offers preventative maintenance
  services, rapid response mobile services, digitally enabled/outsourced solutions,
  process and wastewater treatment systems, environmental remediation, odor and corrosion
  control, filtration, reverse osmosis, continuous deionization, and mobile dewatering
  equipment and rental services; and municipal services comprising odor and corrosion
  control services, as well as condition assessment and asset management, and pressure
  monitoring solutions under the Grindex, Mar Cor, and Godwin brands. Xylem Inc. was
  formerly known as ITT WCO, Inc. and changed its name to Xylem Inc. in July 2011.
  The company was incorporated in 2011 and is headquartered in Washington, District
  Of Columbia.
