longBusinessSummary: Eaton Corporation plc operates as a power management company
  in the United States, Canada, Latin America, Europe, and the Asia Pacific. It operates
  through Electrical Americas, Electrical Global, Aerospace, Vehicle, and eMobility
  segments. The company offers electrical and industrial components, power distribution
  and assemblies, residential products, single- and three-phase power quality and
  connectivity products, wiring devices, circuit protection products, utility power
  distribution products, and power reliability equipment; and hazardous duty electrical
  equipment, emergency lighting, fire detection, intrinsically safe explosion-proof
  instrumentation, and structural support systems. It also provides pumps, motors,
  hydraulic power units, hoses and fittings, and electro-hydraulic pumps; valves,
  cylinders, electronic controls, electromechanical actuators, sensors, aircraft flap
  and slat systems, and nose wheel steering systems; hose and thermoplastic tubing
  products, fittings, adapters, couplings, and sealing and ducting products; air-to-air
  refueling systems, fuel pumps, fuel inerting products, sensors, and adapters and
  regulators; oxygen generation systems, payload carriages, and thermal management
  products; wiring connectors and cables; and hydraulic and bag filters, strainers
  and cartridges, and golf grips for manufacturers of commercial and military aircraft,
  related aftermarket customers, and industrial applications. In addition, the company
  offers transmissions, clutches, hybrid power systems, superchargers, engine valves
  and valve actuation systems, locking and limited slip differentials, transmission
  controls, and fuel vapor components for the vehicle industry; and voltage inverters,
  converters, fuses, circuit protection units, vehicle controls, power distribution
  systems, fuel tank isolation valves, and commercial vehicle hybrid systems. The
  company was formerly known as Abeiron Limited. The company was founded in 1911 and
  is based in Dublin, Ireland.
