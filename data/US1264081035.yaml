longBusinessSummary: 'CSX Corporation, together with its subsidiaries, provides rail-based
  freight transportation services in the United States and Canada. It operates through
  two segments: rail and trucking. The company offers rail services; and transportation
  of intermodal containers and trailers, as well as other transportation services,
  such as rail-to-truck transfers and bulk commodity operations. It also transports
  chemicals, agricultural and food products, minerals, automotive, forest products,
  fertilizers, and metals and equipment; and coal, coke, and iron ore to electricity-generating
  power plants, steel manufacturers, and industrial plants, as well as exports coal
  to deep-water port facilities. In addition, the company provides intermodal services
  through a network of approximately 30 terminals transporting manufactured consumer
  goods in containers; and drayage services, including the pickup and delivery of
  intermodal shipments. It serves the automotive industry with distribution centers
  and storage locations, as well as connects non-rail served customers through transferring
  products, such as plastics and ethanol from rail to trucks. The company operates
  approximately 20,000 route mile rail network, which serves various population centers
  in 26 states east of the Mississippi River, the District of Columbia, and the Canadian
  provinces of Ontario and Quebec, as well as owns 3400 locomotives. It serves production
  and distribution facilities through track connections. CSX Corporation was incorporated
  in 1978 and is headquartered in Jacksonville, Florida.'
