longBusinessSummary: 'Nemetschek SE provides software solutions for architecture,
  engineering, construction, operation, and media industries in Germany, the rest
  of Europe, the Americas, the Asia Pacific, and internationally. The company operates
  in four segments: Design, Build, Manage, and Media. The Design segment offers software
  solutions primarily under the Allplan, Graphisoft, and dRofus brands for architects,
  designers, engineers, structural engineers, specialist planners, and landscape designers,
  as well as developers and general contractors. This segment provides building information
  modeling (BIM) solutions for computer-aided design and engineering. The Build segment
  offers 5D BIM solutions, commercial enterprise resource planning solutions, and
  cloud-based workflow solutions under the Nevaris and Bluebeam brands to construction
  companies, developers, suppliers, general contractors, planning offices, architects,
  and civil engineers. The Manage segment provides software solutions for property,
  facility, and workplace management; building platforms for the operation and management
  of buildings under the Spacewell and Crem Solutions brands to property managers,
  facility managers, global real estate companies, banks, and insurance companies.
  The Media segment offers software solutions under the Maxon name, including 3D modeling,
  painting, animation, sculpting, and rendering solutions to create 3D motion graphics,
  architectural or product visualizations, graphics for computer games, medical illustrations,
  industrial designs, and visual effects for architects and designers, film and TV
  studios, advertising agencies, the video game industry, product and graphic designers,
  and freelancers. Nemetschek SE was founded in 1963 and is headquartered in Munich,
  Germany.'
