longBusinessSummary: "Dassault Systèmes SE provides software solutions and services\
  \ worldwide. The company offers 3D modeling applications, such as SOLIDWORKS, CATIA,\
  \ GEOVIA, and BIOVIA; social and collaborative applications, including 3DEXCITE,\
  \ CENTRIC PLM, and ENOVIA; and simulation applications comprising SIMULIA, DELMIA,\
  \ 3DVIA. It also provides information intelligence applications consisting of NETVIBES\
  \ and MEDIDATA; and OUTSCALE, an infrastructure for business experiences, as well\
  \ as 3DEXPERIENCE platform, a business and innovation platform that provides organizations\
  \ with a holistic and real-time vision of their business activity and ecosystem.\
  \ The company distributes its products through direct and indirect sales channels,\
  \ as well as commercial partners. It primarily serves companies in the aerospace\
  \ and defense; architecture, engineering and construction; business services; cities\
  \ and public services; consumer packaged goods \x96 retail; high-tech; home and\
  \ lifestyle; industrial equipment; infrastructure, energy, and materials; life sciences\
  \ and healthcare; marine and offshore; and transportation & mobility industries.\
  \ The company was incorporated in 1981 and is headquartered in Vélizy-Villacoublay,\
  \ France."
