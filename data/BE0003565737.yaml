longBusinessSummary: KBC Group NV, together with its subsidiaries, provides banking,
  insurance, and asset management services in Belgium, Bulgaria, the Czech Republic,
  Hungary, and Slovakia. The company offers demand deposits, time deposits, and savings
  and current accounts; home and mortgage loans; home insurance; consumer finance
  and SME funding services, investment fund, and life and non-life insurance; cash
  management, payments, trade finance, leasing, corporate finance, money and capital
  market products; and other financial services, such as factoring and stockbroking
  services. It also provides digital and mobile banking services. In addition, the
  company engages in the credit institution, software, driving school/roadside assistance
  business. It primarily serves retail, private banking, small and medium sized enterprises,
  and mid-cap clients. The company was formerly known as KBC Bank and Insurance Holding
  Company NV and changed its name to KBC Group NV in March 2005. KBC Group NV was
  incorporated in 1935 and is headquartered in Brussels, Belgium.
