longBusinessSummary: flatexDEGIRO SE, together with its subsidiaries, provides online
  brokerage and IT solutions for banking and securities in Europe. The company operates
  through two segments, flatex and DEGIRO. The company offers online brokerage services,
  including execution-only securities transactions under the flatex brand; funds,
  saving plans, stocks, crypto, exchange-traded products, and exchange-traded funds;
  and services for professional traders under the ViTrade brand. It also provides
  securities settlement and payment transaction processing services; development and
  operation of securities settlement; business process outsourcing; securities-backed
  loans; and treasury products, such as overnight and fixed-term deposits, bank and
  government bonds, cash loans, and mortgage bonds, as well as undertakings for collective
  investment in transferable securities and special funds. In addition, the company
  purchases, develops, produces, distributes, and maintains software and hardware;
  and supplies and operates information technology infrastructure. Further, it offers
  Core Banking System, a platform for the technological mapping of business processes
  for bank operations. The company was formerly known as flatexDEGIRO AG and changed
  its name to flatexDEGIRO SE in December 2025. flatexDEGIRO SE was founded in 1999
  and is based in Frankfurt am Main, Germany.
