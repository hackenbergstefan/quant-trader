longBusinessSummary: 'Grifols, S.A., together with its subsidiaries, engages in the
  research, development, production, and marketing of plasma-derived medicines in
  the United States, Canada, Spain, Europe, and internationally. It operates through
  four segments: Biopharma, Diagnostic, Bio Supplies, and Others. The company offers
  various hemoderivatives from human plasma for immunology, infectious diseases, hepatology,
  intensive care, pulmonology, hematology, and neurology treatment areas; and markets
  diagnostic testing equipment, reagents, and other equipment, as well as provides
  transfusion medicine, clinical diagnostics, and testing services. It also offers
  biological products, including albumin, albumin-derived products, immunoglobulins,
  thrombin, other proteins, and intermediate plasma products to pharma and biotech
  companies for biopharma use; and whole blood, blood components, processed plasma,
  and clinical samples to life-science research and in-vitro diagnostic companies
  for diagnostic use. In addition, the company provides healthcare solutions for hospitals,
  such as intravenous solutions to maintain or restore fluids and electrolyte balance
  in patients; high-tech solutions to automate hospital processes; clinical nutrition
  to deliver nutrition and medication; and medical devices comprising instrumentation
  and disposable materials for various hospital services, which include interventional
  neuroradiology, hemodynamics, urology, anesthesiology and cardiovascular surgery,
  as well as manufacturing services to third parties and research activities. Further,
  it is involved in engineering services; packaging, labelling, storage, distribution,
  manufacturing, and development of pharmaceutical products; import, export, and commercialization
  activities; travel agency services; reinsurance of insurance policies; support services;
  law business; and consultation, administration, and financing services. The company
  was founded in 1909 and is headquartered in Barcelona, Spain.'
