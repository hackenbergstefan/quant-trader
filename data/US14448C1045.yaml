longBusinessSummary: 'Carrier Global Corporation provides intelligent climate and
  energy solutions in the United States, Europe, the Asia Pacific, and internationally.
  It operates through four segments: Climate Solutions Americas; Climate Solutions
  Europe; Climate Solutions Asia Pacific, Middle East & Africa; and Climate Solutions
  Transportation. The company provides air conditioners, heating systems, heat pumps,
  home and building energy management systems, automation systems, aftermarket components,
  and repair and maintenance and rental services, as well as modernization and upgrades
  to meet the heating, cooling, and ventilation needs of residential and commercial
  customers. It also offers transport refrigeration and monitoring products, services,
  and digital solutions for trucks, trailers, shipping containers, and intermodal
  and rail applications. The company offers its products under the Carrier, Viessmann,
  Toshiba, Automated Logic, Bryant, CIAT, Day & Night, Heil, NORESCO, Carrier Transicold,
  and Sensitech brands. The company was incorporated in 2019 and is headquartered
  in Palm Beach Gardens, Florida.'
