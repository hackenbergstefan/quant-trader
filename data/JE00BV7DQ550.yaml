longBusinessSummary: Amcor plc, together with its subsidiaries, develops and produces
  packaging solutions for nutrition, health, beauty, and wellness categories in Europe,
  North America, Latin America, and the Asia Pacific. Its products include apparel,
  applicators, bags and bulk bags, bottles and vials, building materials, canisters
  and jerrycans, drinking cups, films and laminates, jars, lids, tapes and adhesives,
  trays, tubes, wipes packaging solutions, and miscellaneous and accessories, as well
  as tubs and pots. The company's Global Flexible Packaging Solutions segment develops
  and supplies flexible packaging; and supplies polymer resin, aluminum, and fiber
  based flexible packaging solutions. Its Global Rigid Packaging Solutions segment
  manufactures rigid packaging containers, closures, dispensing and pharma delivery
  devices, and related products. The company sells its products through its direct
  sales force. Amcor plc was incorporated in 1926 and is headquartered in Zurich,
  Switzerland.
