longBusinessSummary: Wise Group plc provides cross-border and domestic financial services
  in the United Kingdom, the rest of Europe, the Asia-Pacific, North America, and
  internationally. It offers money transfers, currency conversions, and account services.
  The company's products include Wise Account, a solution for individual customers
  to send, spend, hold, and get paid in one or more currencies; Wise Business, which
  offers the main features of the Wise Account product along with business-specific
  functionalities designed to enable businesses to operate internationally, including
  managing their accounting and accounts payable and receivables; and Wise Platform,
  which enables banks, financial institutions, and enterprises to integrate into a
  global payment infrastructure, allowing institutional partners to send and receive
  payments. Wise Group plc was founded in 2010 and is based in London, the United
  Kingdom.
