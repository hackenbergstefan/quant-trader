longBusinessSummary: 'Tomra Systems ASA provides sensor-based solutions for optimal
  resource productivity worldwide. It operates through four segments: TOMRA Collection,
  TOMRA Recycling, TOMRA Food, and TOMRA Horizon. The company provides reverse vending
  machines and related data management systems; and provides pick-up, transportation,
  and processing services of empty beverage containers on behalf of beverage producers/fillers.
  It also develops, produces, sale, and service sorting and processing technology
  for waste management companies or plant builders; and provides sorting systems for
  waste and metal material streams, as well as ore sorting sensors for mining companies.
  In addition, the company provides post-harvest food solutions for fresh and processed
  food industries. The company was founded in 1972 and is headquartered in Asker,
  Norway.'
