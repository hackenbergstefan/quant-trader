longBusinessSummary: ICG plc is a private equity firm specializing in direct and fund
  of fund investments. Within direct it specializes in private debt, venture debt,
  credit and equity investments. It invests in middle market, mature, growth capital,
  reinvestment, industry consolidations, bridge financing, restructuring of a shareholder
  base, acquisitions, public to private transactions with or without private equity
  backing, leveraged and acquisition finance, leveraged credit, partnership equity,
  management buyouts and management buyins, secondary (direct) and secondary (indirect)
  investments, traditional, development capital, public quoted company finance, off-balance-sheet
  finance, refinancing and recapitalizations, and pre-IPO financing. The firm does
  not invest in property companies, early-stage funds or start-ups. Within fund of
  fund, it specializes in secondary investments. It also invests in the debt, fixed
  income and alternate asset markets. The firm's alternative capital solutions invest
  in mid-market companies, in Europe, the United States and Asia Pacific. It invests
  in corporate businesses through private debt, senior, junior and sub-ordinate debt,
  mezzanine, structured loans and equity in Europe, Asia Pacific and North America.
  The firm prefers to invest in all sectors with a focus on insurance, energy, materials,
  environmental and facilities services, human resources and employment services,
  leisure products, consumer staples, healthcare, infrastructure services, media and
  entertainment, utilities, equity real estate investment trusts, education and childcare.
  The firm seeks to invest in life sciences in Western Europe and the United States.
  The firm invests in a diversified portfolio of senior secured loans to established
  companies in Australia and New Zealand. The firm focuses on European senior direct
  lending, investing in a diversified portfolio of mid-market and upper mid-market
  corporate borrowers in Western and Northern Europe. The firm is focused on limited
  partnership liquidity solutions in North America and Europe. It prefers to invest
  in commercial real estate assets and commercial property in the United Kingdom.
  It seeks to invest in companies whose principal place of business is Africa/Middle
  East, DACH region, European Union, Pan-European, Spain, Nordic, United States, Anguilla,
  Antigua and Barbuda, Aruba, Bahamas, Barbados, Bermuda, British Virgin Islands,
  Cayman Islands, Cuba, Dominica, Dominican Republic, Grenada, Guadeloupe, Haiti,
  Jamaica, Martinique, Montserrat, Netherlands Antilles, Saint Kitts & Nevis, Saint
  Lucia, Saint Vincent and the Grenadines, Trinidad and Tobago, Turks & Caicos Islands,
  Belize, Costa Rica, El Salvador, Guatemala, Honduras, Mexico, Nicaragua, Panama,
  Canada, United Kingdom, France, Italy, Liechtenstein, Monaco, Netherlands, Bulgaria,
  Romania, North America, South-East Asia and the Asia Pacific, Hong Kong, South Korea,
  Singapore, Taiwan, China, Japan, Australia, Luxembourg, Belgium and New Zealand.
  It prefers to invest between $100 and $200 million. The firm prefers to invest in
  companies with an enterprise value of at least $34.13 million. The firm provides
  mezzanine financing to firms with an enterprise value between $40.62 million and
  EUR 1000 million ($1353.94 million). In corporate strategies, it prefers to invest
  in firms with enterprise value of EUR 100 million ($107.36 million) and EUR 2000
  million ($2147.23 million). The firm invests between $50 million and $1000 million
  in North American Private Debt in companies with EBITDA between $25 million and
  $250 million. The firm seeks to acquire minority and majority stakes. It generally
  structures its financing in the form of subordinated loans with equity warrants,
  as preference shares, preferred equity, mezzanine debt, convertible loans, leveraged
  loans, senior, junior, and mezzanine loans, and CDOs. The firm provides loans for
  a maturity period between seven years and ten years with repayments to be made in
  one payment at final maturity. Its mezzanine investments are usually structured
  to provide a cash yield between three percent and four percent over the relevant
  interbank rate, plus an additional return to reflect the risk involved. Alternative
  Credit strategies are structured in portfolio format, such as CLOs, RMBS, CMBS and
  correlation tranches. It focuses on structured credit and credit portfolios sourced
  from banks' balance sheets. The firm's direct lending strategies invest in senior
  secured and subordinated debt investments in companies across Europe either as the
  lead arranger or the sole lender. In strategic secondaries, it focuses on restructuring,
  mainly in North America, the United States and Europe with a focus on leading restructuring
  and recapitalization transactions for mature private equity funds. In fixed income
  solutions, the firm invests in leveraged loans and high yield bonds; corporate loans
  and bonds - segregated loan strategies as well as multi-asset credit funds; multi-asset
  credit strategies - European loans and European high yield bonds; CLOs in Europe
  and in the United States; Asset Backed Securities and securitized debt in Europe
  and in the United States. It is also a manager of third-party mezzanine, CDO, and
  Institutional Client Funds. It seeks to make balance sheet investments and seeks
  board attendance rights from its portfolio companies. ICG plc was founded in 1989
  and is based in London, United Kingdom, with additional offices across Europe, North
  America, the Middle East and Asia Pacific.
