longBusinessSummary: FedEx Corporation, together with its subsidiaries, provides transportation,
  e-commerce, and business services in the United States and internationally. The
  company operates through two segments, Express U.S. Domestic and Express International.
  It provides e-commerce and digital solutions; dataworks; printing and shipping management,
  including digital printing, professional finishing, document creation, design solutions,
  direct mail, signs and graphics, custom-branded boxes, copying, computer rental,
  Wi-Fi, corporate print solutions, shredding, U.S. passport processing and renewal,
  and digital notarization; packing services, as well as packing supplies and boxes;
  document and business services; and retail access for package transportation. In
  addition, the company offers logistics services, air and ocean cargo transportation,
  specialty transportation, customs brokerage, trade management tools and data, and
  door-to-door solutions; and third party logistics and supply chain management solutions,
  such as inbound logistics, warehousing and distribution, fulfillment, contract packaging
  and product configuration, systems integration, returns process and disposition,
  test, repair, refurbishment, and product liquidation. Further, it provides sales,
  marketing, administrative, information technology, and back-office support services.
  FedEx Corporation was founded in 1971 and is headquartered in Memphis, Tennessee.
