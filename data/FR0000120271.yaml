longBusinessSummary: TotalEnergies SE, an integrated energy company, produces and
  markets oil and biofuels, natural gas, biogas and low-carbon hydrogen, renewables,
  and electricity in France, the United States, Europe, Africa, and internationally.
  It operates through Exploration & Production, Integrated LNG, Integrated Power,
  Refining & Chemicals, and Marketing & Services segments. The Exploration & Production
  segment engages in the activities of exploration and production of oil and natural
  gas, as well as carbon storage. The Integrated LNG segment is involved in the upstream
  and midstream LNG activities, as well as biogas and synthetic methane activities,
  as well as gas trading. The Integrated Power segment engages in the generation,
  storage, electricity trading, and B2B-B2C distribution of gas and electricity. The
  Refining & Chemicals segment is involved in the industrial hub activities comprising
  the activities of refining, petrochemicals and specialty chemicals. This segment
  also includes the activities of oil supply, trading and marine shipping, as well
  as hydrogen activities. The Marketing & Services segment engages in the marketing
  activities in the field of petroleum products, as well as corresponding supply and
  logistics activities. The company was formerly known as TOTAL SE and changed its
  name to TotalEnergies SE in June 2021. TotalEnergies SE was incorporated in 1924
  and is headquartered in Courbevoie, France.
