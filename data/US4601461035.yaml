longBusinessSummary: International Paper Company produces and sells renewable fiber-based
  packaging in North America, Latin America, Europe, South America, and North Africa.
  It operates through two segments, Packaging Solutions North America and Packaging
  Solutions EMEA. The company offers linerboard, medium, whitetop, and saturating
  kraft; and converts containerboard into corrugated boxes, bulk bins, shipping containers
  and specialty packaging through its converting facilities. Its products support
  customers in various industries, such as food and beverage, agriculture, industrial
  manufacturing, personal care pharmaceuticals and consumer goods. The company was
  founded in 1898 and is headquartered in Memphis, Tennessee.
