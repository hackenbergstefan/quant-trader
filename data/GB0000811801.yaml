longBusinessSummary: Barratt Redrow plc engages in the housebuilding business in the
  United Kingdom. It also engages in the commercial development business, which includes
  offices, retail, leisure, industrial, and distribution properties under the Wilson
  Bowden Developments brand; and land development activities. In addition, the company
  manufactures timber frames under the Oregon Timber Frame brand; and furniture under
  the BD Living brand. It offers its homes under the Barratt Homes, David Wilson Homes,
  Redrow, and Barratt London brand names. The company was formerly known as Barratt
  Developments plc and changed its name to Barratt Redrow plc in October 2024. Barratt
  Redrow plc was founded in 1953 and is headquartered in Coalville, the United Kingdom.
