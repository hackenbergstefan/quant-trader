longBusinessSummary: 'Addtech AB (publ.) provides technical products and solutions
  for the manufacturing and infrastructure sectors in Sweden, Denmark, Finland, Norway,
  Germany, the United Kingdom, the rest of Europe, and internationally. The company
  operates through six segments: Automation, Electrification, Energy, Industry, Process,
  and Safety. It produces and sells solutions for industrial IT and communications,
  such as control systems, sensors and vision products, robotics, and data collection
  solutions; and designs and delivers systems and solutions for the forestry, specialized
  vehicles, mechanical engineering, electronics industries, waste management and recycling,
  as well as underwater technology. The company also offers power supply and transmission,
  electric drivetrain solutions, advanced battery systems, and technical systems for
  buildings; and overhead line and substation materials for grid construction, railway
  related electrical infrastructure, control equipment, switchgear, and associated
  components for delivering electricity to industry, data centers, hospitals and defense.
  In addition, it is involved in the production and sale of solutions for measuring,
  controlling, cleaning, and streamlining industrial flows; and provision of components,
  products, and complete solutions that protect people, property, and critical societal
  systems. Addtech AB (publ.) was founded in 1906 and is headquartered in Stockholm,
  Sweden.'
