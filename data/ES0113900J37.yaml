longBusinessSummary: 'Banco Santander, S.A. provides various financial products and
  services to individuals, small and medium-sized enterprises, large corporations,
  and public entities worldwide. The company operates through five segments: Retail
  & Commercial Banking, Digital Consumer Bank, Corporate & Investment Banking, Wealth
  Management & Insurance, and Payments. It offers demand and time deposits, mutual
  funds, and current and savings accounts; mortgages, consumer finance, loans, and
  various financing solutions; and project finance, debt capital markets, global transaction
  banking, and corporate finance services. The company also provides credit and debit
  cards, real estate loans, microfinance, and auto loans; corporate and investment
  banking services; advice on mergers and acquisitions; wealth, asset, and risk management
  services; and digital payments and technology solutions. In addition, it is involved
  in the securitization, leasing, management of portfolios, e-commerce, air transport,
  aircraft rental, software, consulting, fund and investment management, renewable
  energy, vehicle rental, insurance, advertising, marketing, telemarketing, automotive,
  agricultural, factoring, securities brokerage and investment, pension fund management,
  trade intermediary, venture capital fund, renting, restaurant, electricity production,
  IT, internet, and financial advisory and other activities; management, and other
  real estate activities; and purchase and sale of vehicles. Further, the company
  offers mobile and online banking services. Banco Santander, S.A. was formerly known
  as Banco Santander Central Hispano SA and changed its name to Banco Santander, S.A.
  in February 2007. The company was incorporated in 1856 and is headquartered in Madrid,
  Spain.'
