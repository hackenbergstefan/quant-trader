longBusinessSummary: Ford Motor Company develops, delivers, and services Ford trucks,
  sport utility vehicles, commercial vans and cars, and Lincoln luxury vehicles in
  the United States, Canada, the United Kingdom, Mexico, and internationally. It operates
  through Ford Blue, Ford Model e, Ford Pro, and Ford Credit segments. The company
  sells Ford and Lincoln internal combustion engine and hybrid vehicles, electric
  vehicles, service parts, accessories, and digital services for retail customers;
  develops EV and digital vehicle technologies, and software; and provides telematics
  and EV charging solutions. It also sells Ford and Lincoln vehicles, service parts,
  and accessories through distributors and dealers, as well as through dealerships
  to commercial fleet customers, daily rental car companies, and governments. In addition,
  it engages in vehicle-related financing and leasing activities to and through automotive
  dealers. Further, the company provides retail installment sale contracts for new
  and used vehicles; and direct financing leases for new vehicles to retail and commercial
  customers, such as leasing companies, government entities, daily rental companies,
  and fleet customers. Additionally, it offers wholesale loans to dealers to finance
  the purchase of vehicle inventory; and loans to dealers to finance working capital
  and enhance dealership facilities, purchase dealership real estate, and other dealer
  vehicle programs. Ford Motor Company was incorporated in 1903 and is based in Dearborn,
  Michigan.
