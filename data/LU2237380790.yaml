longBusinessSummary: Allegro.eu S.A. operates a commerce platform for consumers in
  Poland, Czech Republic, Slovakia, Hungary, and internationally. It operates through
  Allegro, Ceneo, Allegro International, and Other segments. The company engages in
  operating B2C, C2C, and B2B e-commerce platforms comprising online marketplace;
  and various services, such as consumer lending and logistics services. It also provides
  multi-category price comparison services allowing the customer to find prices among
  the different websites and marketplaces. In addition, it operates eBilet, an event
  ticket sales site. Further, the company operates Allegro. pl, an online marketplace;
  Ceneo.pl, a price comparison platform. Additionally, the company engages in online
  marketplace; retail sale via the Internet; advertising; logistic services; online
  price comparison services; consumer lending to marketplace buyers; online tickets
  distribution; software and solutions for delivery logistics; and provides payment
  services to partners. The company was formerly known as Adinan Super Topco S.a r.l.
  and changed its name to Allegro.eu S.A. in August 2020. The company was incorporated
  in 2017 and is based in Luxembourg, Luxembourg.
