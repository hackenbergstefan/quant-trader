longBusinessSummary: 'Halma plc, together with its subsidiaries, provides technology
  solutions in the safety, health, and environmental markets in the United States,
  Mainland Europe, the United Kingdom, the Asia Pacific, Africa, the Middle East,
  and internationally. The company operates in three segments: Safety, Environmental
  & Analysis, and Healthcare. Its Safety segment provides products that protect people,
  assets, and infrastructure used in public and commercial spaces and in industrial
  and logistics operations. This segment serves fire safety, public safety, worker
  safety, and infrastructure and asset safety markets. The Environmental & Analysis
  segment offers technologies that monitor the environment used in optical solutions,
  water analysis and treatment system, and environmental monitoring technologies.
  Its Healthcare segment provides technologies and digital solutions for healthcare
  enablement, discovery, prevention, and diagnostics, and therapeutic solutions. The
  company also designs and manufactures differentiated orthobiologic products. Halma
  plc was incorporated in 1894 and is headquartered in Amersham, the United Kingdom.'
