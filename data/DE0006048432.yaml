longBusinessSummary: Henkel AG & Co. KGaA, together with its subsidiaries, engages
  in the adhesive technologies and consumer brands businesses in Europe, India, the
  Middle East, Africa, North America, Latin America, the Asia Pacific. It offers adhesives,
  sealants, and functional coatings for various business areas, including packaging
  and consumer goods; mobility and electronics; and craftsmen, construction, and professional
  industries. The company also provides hair styling, hair colorants, and hair care
  products; and body care products, as well as distributes its products through brick-and-mortar
  stores, hair salons, and digital channels. In addition, it offers laundry and home
  care products, such as heavy-duty and specialty detergents, fabric softeners and
  laundry additives, and other fabric cleaning and fabric care products; dishwashing
  products; and hard surface and toilet cleaners. Further, the company provides household
  cleaners products. The company was founded in 1876 and is headquartered in Düsseldorf,
  Germany.
