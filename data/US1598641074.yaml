longBusinessSummary: Charles River Laboratories International, Inc. provides drug
  discovery, non-clinical development, and safety testing services in the United States,
  Europe, Canada, the Asia Pacific, and internationally. The Research Models and Services
  segment produces and sells rodents, and purpose-bred rats and mice for use by researchers.
  This segment also provides a range of services to assist its clients in supporting
  the use of research models in research and screening pre-clinical drug candidates,
  including genetically engineered models and services, insourcing solutions, and
  research animal diagnostic services; and engages in development and production of
  cell therapies. The Discovery and Safety Assessment segment offers in vitro and
  in vivo discovery services for the discovery, development, and safety testing of
  novel drugs, molecule compounds, oligonucleotides, and biotherapeutics, and antibodies
  through delivery of preclinical drug and therapeutic candidates ready for safety
  assessment; safety assessment services, such as toxicology, pathology, safety pharmacology,
  bioanalysis, drug metabolism, and pharmacokinetics services; and vivarium space
  services. The Manufacturing Solutions segment provides in vitro methods for conventional
  and rapid quality control testing of sterile and non-sterile pharmaceuticals and
  consumer products; offers specialized testing of biologics that are outsourced by
  pharmaceutical and biotechnology companies; and contract development and manufacturing
  products and services. The company has collaborations with Parker Institute for
  Cancer Immunotherapy and Children's Hospital Los Angeles across its contract development
  and manufacturing organization; and Medigen Vaccine Biologics Corp for developing
  next-generation multivalent enterovirus vaccine, enhance global regulatory readiness,
  and support IND-enabling non-clinical studies. Charles River Laboratories International,
  Inc. was founded in 1947 and is headquartered in Wilmington, Massachusetts.
