longBusinessSummary: Terna S.p.A., together with its subsidiaries, provides electricity
  transmission and dispatching services in Italy, other Euro-area countries, and internationally.
  It operates through Regulated, Non-Regulated, and International segments. The company
  is involved in the design, construction, management, development, operation, and
  maintenance of national transmission grid; dispatching and metering; and construction
  of storage systems. It also supplies transformers and cables; provides energy and
  connectivity services; and installs and operates interconnecting lines. In addition,
  the company designs, produces, commercializes, and repairs power transformers for
  electricity transmission and distribution grids; industrial transformers for the
  steel and metals industries; special transformers for convertors used in electrochemical
  production; manufactures and sells marine and terrestrial cables; develops renewable
  energy projects; and undertakes private interconnector projects. The company was
  founded in 1962 and is headquartered in Rome, Italy.
