longBusinessSummary: TGS ASA provides geoscience data services to the oil and gas
  industry in Norway and internationally. It operates through Multi client, Marine
  Data Acquisition (MDA), Imaging, New Energy Solutions (NES), and Shared Services
  segments. The company offers seismic data using robust technology and imaging solutions;
  well data recorded expertly matched and validated, from permit to abandonment; carbon
  storage and monitoring solutions; wind energy data partner throughout the wind development
  lifecycle; solar operations; and asset management services. It also offers applications
  for oil and gas, new energies, data platforms, and ai/machine learning. TGS ASA
  has a agreement with Ministry of Hydrocarbon and Mining Development of the Republic
  of Equatorial Guinea to create an offshore MegaSurvey. The company was formerly
  known as TGS-NOPEC Geophysical Company ASA and changed its name to TGS ASA in June
  2021. TGS ASA was founded in 1981 and is headquartered in Oslo, Norway.
