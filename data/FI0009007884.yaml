longBusinessSummary: 'Elisa Oyj provides telecommunications, information and communication
  technology (ICT), and online services in Finland, rest of Europe, and internationally.
  It operates through two segments: Consumer Customers and Corporate Customers. The
  company offers consumers with telecommunications and communications services, including
  fixed and mobile subscriptions, supplementary digital services, cable TV subscriptions,
  and entertainment services, as well as IT and communication solutions. It provides
  sedApta, supply chain management and operational planning software; camLine, an
  automation, MES, and data analytics software; CalcuQuote, a integrated software
  for sourcing, quoting, procurement, and supplier collaboration; and TenForce, a
  platform to strengthen safety culture and operational oversight across complex industrial
  environments. It also offers Polystar, an intelligent network analytics and optimization
  software. The company markets its solutions under Elisa IndustrIQ brand. Further,
  it provides Gridle, an AI-powered energy flexibility optimization service; and Elisa
  Kotiakku, that smooths out spikes in electricity spot prices and stores electricity
  generated by solar panels. In addition, the company offers automation solutions
  for network management and operation for mobile operators, industrial IoT solutions
  and distributed energy solutions. It serves consumers, corporates, and public administration
  organizations. Elisa Oyj was founded in 1882 and is headquartered in Helsinki, Finland.'
