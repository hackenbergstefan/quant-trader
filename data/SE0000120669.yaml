longBusinessSummary: 'SSAB AB (publ) engages in the production and sale of steel products
  in Sweden, Finland, Germany, Poland, Denmark, Asia, the Rest of Europe, the United
  States, and internationally. It operates through five segments: SSAB Special Steels,
  SSAB Europe, SSAB Americas, Tibnor, and Ruukki Construction. The SSAB Special Steels
  segment offers quenched and tempered steels, and advanced high-strength steel products.
  The SSAB Europe segment provides strip, heavy plate, and tubular products. The SSAB
  Americas segment is involved in the sale of heavy plates. The Tibnor segment distributes
  a range of steel and non-ferrous metals in the Nordics and Baltics. The Ruukki Construction
  segment produces and sells building solutions. It also offers fossil free steel
  products. The company markets its steel products under the Strenx, Hardox, Docol,
  GreenCoat, Toolox, Armox, Duroxite, Cor-Ten, SSAB AM, SSAB Boron, SSAB Domex, SSAB
  Form, SSAB Laser, SSAB Weathering, and SSAB Multisteel brands. It serves heavy transport,
  automotive, material handling, construction machinery, energy, construction, protection,
  and tooling customers through its sales channels, service centers, and distributors.
  SSAB AB (publ) was founded in 1878 and is headquartered in Stockholm, Sweden.'
