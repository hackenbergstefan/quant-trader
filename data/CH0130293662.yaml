longBusinessSummary: 'BKW AG, an energy and infrastructure company, plans, builds,
  and operates infrastructure to produce and supply energy to businesses, households,
  and the public sector in Switzerland, Germany, Italy, France, and internationally.
  It operates in three segments: Energy Solutions, Power Grid, and Infrastructure
  & Buildings. The Energy Solutions segment builds, operates, and maintains its portfolio
  of power plants. This segment also sells energy; trades in electricity, certificates,
  and raw materials; and offers wind, solar, and smart energy services. Its Power
  Grid segment builds, operates, and maintains the company''s distribution grid. The
  Infrastructure and Buildings segment offers engineering planning and consulting
  services for energy, infrastructure, and environmental projects; integrated building
  technology solutions; and construction and maintenance services in the fields of
  energy, telecommunications, transport and water utility networks. It also provides
  digital business models for renewable energy. The company was formerly known as
  BKW FMB Energie AG and changed its name to BKW AG in December 2011. BKW AG was founded
  in 1898 and is headquartered in Bern, Switzerland.'
