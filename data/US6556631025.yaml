longBusinessSummary: Nordson Corporation engineers, manufactures, and markets products
  and systems to dispense, apply, and control adhesives, coatings, polymers, sealants,
  biomaterials, medical components, and other fluids. The Industrial Precision Solutions
  segment provides dispensing, coating, and laminating systems for adhesives, lotions,
  liquids, and fibers to disposable products and roll goods; automated adhesive dispensing
  systems; components and systems for thermoplastic and biopolymer melt stream; fluid
  components, such as nozzles, pumps, and filters; smart components that measure and
  control the flow, quantity and location of dispensed fluid; control systems; and
  product assembly solutions. It also offers automated and manual dispensing products
  and systems for cold materials, container coating, liquid finishing, and powder
  coating, as well as ultraviolet equipment. The Medical and Fluid Solutions segment
  offers precision manual and semi-automated dispensers, plastic molded syringes,
  cartridges, tips, and fluid connection components; interventional solutions for
  engineered shafts and interventional delivery systems, medical tubing, balloons,
  balloon inflators, nitinol devices, cardiovascular cannula, and biomaterial delivery;
  medical fluid components; and microplegia myocardial protection devices and related
  consumables. The Advanced Technology Solutions segment provides automated dispensing
  systems for high-speed, precise application of various attachment, protection, and
  coating fluids, and related gas plasma treatment systems; destructive and non-destructive
  testing technologies, such as bond testers and automated optical, acoustic microscopy,
  and x-ray inspection systems used in the semiconductor and printed circuit board
  industries; and precision measurement and control technologies. The company markets
  its products through direct sales force, distributors, and sales representatives.
  Nordson Corporation was founded in 1909 and is headquartered in Westlake, Ohio.
