longBusinessSummary: Evonik Industries AG operates as a chemicals company in the Asia-Pacific,
  Europe, the Middle East, Africa, and the Americas. It operates through the Advanced
  Technologies, Custom Solutions, and Infrastructure segments. The Advanced Technologies
  segment provides polymers for medical applications; crosslinkers; hydrogen peroxide,
  a sterilizing agent for cleaning silicon wafers and a bleaching agent for the paper
  and textile industries; fumed and precipitated silicas and silanes for the automotive,
  tire, electronics, and cosmetics industries; and D-/L-methionine and lysine for
  animal nutrition. Its Custom Solutions segment provides additives for coatings,
  adhesives, sealants, polyurethane foams, and lubricants for the cosmetic, cleaning,
  and pharmaceutical industries. The Infrastructure segment engages in the infrastructure
  activities and offers butadiene, MTBE, butene-1, isononanol, and DINP for use in
  the plastic and packaging industries, production of rubber and fuels, and as plasticizers
  in the construction and automotive sectors. The company was founded in 1847 and
  is headquartered in Essen, Germany.
