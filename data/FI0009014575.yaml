longBusinessSummary: Metso Oyj provides technologies, end-to-end solutions, and services
  for the aggregates, minerals processing, and metals refining industries in Europe,
  North and Central America, South America, the Asia Pacific, Greater China, Africa,
  the Middle East, and India. It operates in two segments, Aggregates and Minerals.
  The company provides various equipment, parts, and services for contractors, aggregates
  quarries, manufacturing sand, slag recycling, and construction and demolition waste
  recycling; mobile equipment; and stationary equipment, such as crushers, screens,
  crushing and screening plants, conveyors, chutes, feeders, and air classifiers.
  It also offers loading and hauling, crushing, conveying, screening, grinding, floatation,
  magnetic separation, filtration, material and slurry handling, thickening and clarifying,
  hydrometallurgy, in-pit crush and convey, tailing management, digital twins, and
  automation services. In addition, the company provides spare and wear parts, including
  haul truck liners, crusher spares and wears, conveyor parts, screen/feeder spares,
  screening media, mill liners and spares, floatation and filtration parts, stacker
  reclaimers parts, apron feeder parts, slurry pumps parts, thickener parts, and wear
  lining products. Further, it offers life cycle, maintenance and repairs, modernizations
  and upgrades, process optimization, and training services. The company was formerly
  known as Metso Outotec Oyj. Metso Oyj was incorporated in 1990 and is headquartered
  in Espoo, Finland.
