longBusinessSummary: Sartorius Aktiengesellschaft provides bioprocess solutions, and
  lab products and services worldwide. The company offers analytical solutions, such
  as biolayer interferometry systems, high-throughput screening by cytometry systems,
  process analytical technology and data analytics, cell selection and retrieval,
  live-cell imaging and analysis systems, and surface plasmon resonance systems; cell
  culture solutions, including bioreactors and fermenters, cell culture reagents,
  supplements and matrices, nucleic acid and delivery solutions, cell culture media,
  and cell lines and buffers; and fluid management products. It also provides lab
  filtration and purification solutions, lab water purification systems, microtissue
  technologies, lab weighing, pipettes, tips and dispensers, microbiological testing
  solutions, lab data and fleet management software, and OEM solutions; and Process
  chromatography and filtration solutions. The company serves the life science research,
  biopharmaceutical manufacturing, cell and gene therapy, and applied industries.
  The company was founded in 1870 and is headquartered in Göttingen, Germany.
