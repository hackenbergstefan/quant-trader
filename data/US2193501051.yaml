longBusinessSummary: Corning Incorporated operates in optical communications, display,
  specialty materials, automotive, and life sciences businesses in the United States,
  Canada, Mexico, Japan, Taiwan, China, South Korea, Germany, and internationally.
  The company provides optical fibers and cables; and hardware and equipment products,
  such as cable assemblies, fiber optic hardware and connectors, optical components
  and couplers, closures, network interface devices, and other accessories for the
  telecommunications industry, businesses, governments, and individuals. It also offers
  glass substrates for flat panel displays, including liquid crystal displays and
  organic light-emitting diodes that are used in televisions, notebook computers,
  desktop monitors, tablets, and handheld devices. In addition, it manufactures products
  that offer material formulations for glass, glass ceramics, crystals, precision
  metrology instruments, and software, as well as glass wafers and substrates, tinted
  sunglasses, and radiation shielding products for markets, such as mobile consumer
  electronics, semiconductor equipment optics and consumables, aerospace and defense
  optics, radiation shielding products, sunglasses, and telecommunications components.
  Further, the company provides ceramic substrates and filter products for emissions
  control in mobile, gasoline, and diesel applications, as well as technical glass
  and optic products and solutions for the interior and exterior of vehicles. Additionally,
  it offers laboratory products, including plastic vessels, liquid handling plastics,
  specialty surfaces, cell culture media, and serum, as well as general labware, and
  glassware and equipment under the Corning, Falcon, PYREX, and Axygen brands. It
  also offers polysilicon products and pharmaceutical glass tubing and vials. The
  company was formerly known as Corning Glass Works and changed its name to Corning
  Incorporated in April 1989. Corning Incorporated was founded in 1851 and is headquartered
  in Corning, New York.
