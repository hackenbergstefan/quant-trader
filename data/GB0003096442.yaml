longBusinessSummary: RS Group plc, together with its subsidiaries, engages in the
  distribution of maintenance, repair, and operations products and service solutions
  in the United Kingdom, the United States, France, Mexico, Germany, Italy, Switzerland,
  and internationally. The company offers automation and control, and electrification
  products; cables and connectors; mechanical and fluid power products, such as transmission,
  pneumatics, and hydraulic components; semiconductors and passive components; test
  and measurements products; personal protective equipment (PPE), workwear, and janitorial
  products; and facilities and maintenance products for buildings. It also provides
  bundling, kitting, labelling, and assembly services; digital procurement platforms
  that enhance productivity, reduce spend, and streamline supplier management; inventory
  solutions that optimize inventory management to reduce waste, enhance supply chains,
  and lower costs; and DesignSpark, a software tool for design engineers. In addition,
  the company offers design, manufacturing, and prototyping; maintenance engineering
  and safety; and integrated supply chain and procurement solutions. The company provides
  its customers with product and service solutions for designing, building, maintaining,
  repairing, and operating industrial equipment. It serves design and discrete manufacturing,
  process manufacturing, facilities and intralogistics, and energy and utilities industries.
  The company was formerly known as Electrocomponents plc. RS Group plc was founded
  in 1937 and is headquartered in London, the United Kingdom.
