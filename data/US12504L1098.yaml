longBusinessSummary: CBRE Group, Inc. operates as a commercial real estate services
  and investment company in the United States, the United Kingdom, and internationally.
  The company operates through Advisory Services, Building Operations and Experience,
  Project Management, and Real Estate Investments segments. The Advisory Services
  segment offers strategic advice and execution to owners, investors, and occupiers
  of real estate in connection with leasing of offices, and industrial and retail
  space; clients fully integrated property sales services under the CBRE Capital Markets
  brand; clients commercial mortgage and structured financing services; originates
  and sells commercial mortgage loans; property management services, such as marketing,
  building engineering, lease administration, accounting, investment reporting services,
  financial services on a contractual basis for owners of and investors in office,
  industrial, and retail properties; and valuation services that include market value
  appraisals, litigation support, discounted cash flow analyses, and feasibility studies,
  as well as consulting services, such as property condition reports, hotel advisory,
  and environmental consulting. The Global Workplace Solutions segment provides facilities
  management, and project management services comprising building consulting, program,
  and project and cost management services under the Turner & Townsend brand name.
  The Real Estate Investments segment offers investment management services under
  the CBRE Investment Management brand to pension funds, insurance companies, sovereign
  wealth funds, foundations, endowments, and other institutional investors and development
  services, such as real estate development and investment activities under the Trammell
  Crow Company brand to users and investors in commercial real estate, and for their
  own account. CBRE Group, Inc. was founded in 1906 and is headquartered in Dallas,
  Texas.
