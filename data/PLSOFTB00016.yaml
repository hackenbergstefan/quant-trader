longBusinessSummary: Asseco Poland S.A. produces and sells software products worldwide.
  The company offers software and IT solutions for banking, payment, insurance, public
  administration, healthcare, defense and uniformed services, energy and gas, telecommunications
  and media, and security sectors. It also provides cloud solutions; and ERP solutions
  and services, including proprietary and third-party software, and consulting and
  implementation services for micro, small, and mid-sized companies, as well as large
  enterprises. In addition, the company offers business intelligence software and
  services, such as professional consulting and advisory; data warehouses and big
  data solutions; reporting for regulators; fraud detection and anti-money laundering
  systems; and customer behavior analysis based on machine learning mechanisms, as
  well as access to information-analytical and reporting tools. The company was formerly
  known as Softbank S.A. and changed its name to Asseco Poland S.A. in January 2007.
  Asseco Poland S.A. was incorporated in 1989 and is based in Rzeszów, Poland.
