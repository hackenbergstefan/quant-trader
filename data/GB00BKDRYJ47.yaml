longBusinessSummary: Airtel Africa Plc, together with its subsidiaries, provides telecommunications
  and mobile money services in Nigeria, East Africa, and Francophone Africa. It offers
  pre and post-paid wireless voice, international roaming, and fixed line telephony
  services; data services, including 4G and 5G, home broadband, fibre, and data centers;
  and mobile money services, such as digital wallet payments systems, microloans,
  merchant, savings, insurance, international, and international money transfers.
  The company also provides messaging, value added, and tower sharing services, as
  well as infrastructure sharing, mobile commerce, and support services. The company
  was incorporated in 2018 and is based in London, the United Kingdom. Airtel Africa
  Plc is a subsidiary of Airtel Africa Mauritius Limited.
