longBusinessSummary: Allfunds Group plc, together with its subsidiaries, operates
  as a B2B WealthTech company that connects fund houses and distributors in the United
  Kingdom and internationally. It operates through two segments, Net Platform, and
  Net Subscription and Other Revenues. The company offers Connect, an Allfunds professional
  workstation; and Nextportfolio, a portfolio management system; and end-investor
  platform for wealth management needs of asset managers, banks, wealth managers,
  and insurance companies. It also provides ESG solutions, such as ESG scoring, reporting,
  portfolio advisory and construction, audit and certification, analysis, investment
  proposal generator, reporting generator, and monitoring; model portfolio advisory,
  bespoke reporting, private assets, audit and certification, fund selection, and
  regulatory implementation services; and Sustainability Navigator, a tool for constructing
  sustainable investment portfolios in line with SFDR regulation. In addition, the
  company offers regulatory reporting corner, a specialized platform to provide fund
  registration, regulatory reporting, and distribution, as well as generate fund regulatory
  reporting. Further, it provides investment solutions for Distributors and Fund Houses,
  including Management Company (ManCo) white label services in connection with the
  creation and distribution of UCITs funds; White Label Fund Hosting Platform that
  provides supports mutual funds and ETFs; Allfunds Navigator which provides market
  insights and identify opportunities; and Allfunds Blockchain solutions. The company
  serves private bank, insurance, asset management, bank, custodian, and other customers.
  The company was founded in 2000 and is based in London, the United Kingdom.
