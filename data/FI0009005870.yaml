longBusinessSummary: 'Konecranes Plc manufactures, sells, and services material handling
  products in Europe, the Middle East, Africa, the Americas, and the Asia-Pacific.
  It operates through three segments: Industrial Service, Industrial Equipment, and
  Port Solutions. The Industrial Service segment provides maintenance services for
  various industrial cranes and hoists. The Industrial Equipment segment offers industrial
  cranes and wire rope hoists, crane manufacturing components, digital controls, and
  software and automation; chain hoists, workstation lifting systems, overhead cranes,
  and cranes and hoists for hazardous environments. The Port Solutions segment provides
  equipment, services and software, and products, such as ship-to shore cranes, yard
  cranes, lift trucks, mobile harbor cranes, straddle carriers, and automated guided
  vehicles. It also offers maintenance, repair and digital services, and spare parts
  for the container handling industry. It serves general manufacturing metals production,
  power generation, automotive, pulp and paper, raw materials and chemicals, and container
  handling industries. The company was founded in 1910 and is headquartered in Hyvinkää,
  Finland.'
