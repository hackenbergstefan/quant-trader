longBusinessSummary: 'Bank of America Corporation, through its subsidiaries, provides
  various financial products and services for individual consumers, small and middle-market
  businesses, institutional investors, large corporations, and governments worldwide.
  It operates through four segments: Consumer Banking, Global Wealth & Investment
  Management (GWIM), Global Banking, and Global Markets. The Consumer Banking segment
  offers traditional and money market savings accounts, certificates of deposit and
  IRAs, checking accounts, and investment accounts and products; credit and debit
  cards; residential mortgages and home equity loans; and direct and indirect loans.
  The GWIM segment provides investment management, brokerage, banking, and trust and
  retirement products and services; wealth management solutions; and customized solutions,
  including specialty asset management services. The Global Banking segment offers
  lending products and services, including commercial loans, leases, commitment facilities,
  trade finance, and commercial real estate and asset-based lending; treasury solutions,
  and underwriting and advisory services. The Global Markets segment provides market-making,
  financing, securities clearing, settlement, and custody services; securities and
  derivative products; and risk management products using interest rate, equity, credit,
  currency and commodity derivatives, foreign exchange, fixed-income, and mortgage-related
  products. Bank of America Corporation was founded in 1784 and is based in Charlotte,
  North Carolina.'
