longBusinessSummary: "CVC Capital Partners plc is a private equity and venture capital\
  \ firm specializing in middle market secondaries, infrastructure and credit, management\
  \ buyouts, leveraged buyouts, growth equity, mature, recapitalizations, strip sales,\
  \ and spinouts. The firm makes investments in medium to large sized companies. It\
  \ seeks to invest in fintech, healthcare, industrial, Education, telecommunications,\
  \ information technology, electronics, biotechnology, medical, energy, chemistry,\
  \ new materials, industrial automatisms, tech-enabled businesses such as human resources\
  \ software, data centers, software as a service, payments, industrial goods and\
  \ services, real estate, other manufactured goods, financial services, manufacturing,\
  \ services, distribution, media, retail, consumer goods, consumer services, sports,\
  \ entertainment, buildings and construction, chemicals, gaming, oil and gas, and\
  \ public works. For Growth Partners, the firm seeks to invest in growth-oriented\
  \ companies operating in the software and technology-enabled business services sectors.\
  \ The firm also seeks to make infrastructure investments in Europe in the following\
  \ sectors: transport, public or business utilities, provision of government services,\
  \ communications infrastructure, energy production and provision, and businesses\
  \ providing related regulated services. It prefers to invest in companies based\
  \ in the United Kingdom, Belgium, Bermuda, Czech Republic, Finland, Greece, Iceland,\
  \ Netherlands, Poland, Spain, Sweden, Korea, Malta, Middle East, North Africa, North\
  \ America, United States, Latin America, Southeast Asia, Hong Kong, Philippines,\
  \ Japan, Australia, New Zealand, Vietnam, Singapore, Malaysia, South Korea, Greater\
  \ China, Taiwan, America, and Europe, with a focus on France, Italy, Germany, and\
  \ Switzerland. For Asia private equity strategy, it seeks to invest in companies\
  \ with enterprise value between USD 250 million and USD 1500 million. For CVC Catalyst,\
  \ it seeks to invest in companies with equity investments of between \x8075 million\
  \ ($86.36 million) and \x80250 million ($287.89 million). For Strategic Opportunities,\
  \ it seeks to invest in companies with enterprise value between EUR 1000 million\
  \ (USD 1067.05 million) and more than EUR 5000 million (USD 5727.4 million), with\
  \ a longer holding period of around six to fifteen years. It seeks to invest in\
  \ companies with enterprise value between USD 250 million and USD 5727.4 million.\
  \ For Growth strategy, its equity investments are more than USD 50 million. It seeks\
  \ to make equity investments between $50 million and $287.97 million. Asia private\
  \ equity strategy is focused on control, co-control, structured minority, and majority\
  \ investments. Europe and Americas strategy is focused on control or co-control\
  \ investments. For minority stakes, it takes equity investments between 15% and\
  \ 20%. For credit strategies, the firm focuses on investing in senior secured loans,\
  \ bonds, corporate credit, private credit, direct lending, and private credit. CVC\
  \ Capital Partners plc was founded in 1981 and is based in New York, New York, with\
  \ additional offices across Australia, Europe, South America, and Asia."
