longBusinessSummary: K+S Aktiengesellschaft, together with its subsidiaries, operates
  as a supplier of mineral products for the agricultural, industrial, pharma, consumer,
  and community sectors in Europe, Germany, North America, South America, Asia, Africa,
  and Oceania. The company offers potassium chloride for crops, such as grain, corn,
  rice, soybeans, and sugar cane; fertilizer specialties that are used for crops with
  magnesium and sulfur requirements, including rapeseed, sugar beet, and potatoes,
  as well as for chloride-sensitive specialty crops such as citrus, grapes, coffee,
  almond trees, and vegetables; and water-soluble fertilizers for use in fertigation
  of fruit and vegetables under the KALISOP, KORN-KALI, ROLLKALI, PATENTKALI, ESTA
  KIESERIT, GRANUAID, MAGNESIA-KAINIT, SOLUMOP, SOLUSOP, SOLUCMS, EPSO TOP, EPSO MICROTOP,
  EPSO COMBITOP, EPSO PROFITOP, and EPSO BORTOP brands. It also provides soil, fertigation,
  foliar fertilizers, natural rock salt, high-purity vaccum salt and mineral salt
  mixtures, potassium chloride, potassium sulphate, Epsom salt, minerals for pets
  and livestock, potassium, magnesium, salt, salt licks for farm and wild animals,
  sodium chloride, salt tablets, and vacuum salt granules under the k-DRILL, KaSa,
  SOLSEL, NUTRIKS, AXAL PRO, REGINET, Regesal, Marina, Marina Plus, Solea, and APISAL
  brands. In addition, the company offers salts under the Cérébos brand; rock salt
  under the Solné mlýny Olomouc brand; sea salt under the Vatel and Salinas d'Algarve
  brands; Saltissimo brands; optimal solutions for their homes under the AXAL Pro
  and AXAL brand; rock and pink salts under the Saldoro brand; dishwasher salt under
  the Regesoft brand; and Coarse rock salt under the DI-MIX brand. Further, the company
  provides waste management; and transportation and logistics services. Aktiengesellschaft
  was founded in 1889 and is headquartered in Kassel, Germany.
