longBusinessSummary: 'Valmet Oyj develops and supplies process technologies, automation,
  and services for the pulp, paper, and energy industries in North America, Latin
  America, EMEA, China, and Asia-Pacific. It operates through two segments: Process
  Performance Solutions and Biomaterial Solutions and Services. The Process Performance
  Solutions segment delivers flow control technologies and automation systems, ranging
  from individual measurements to full plant-wide solutions. The Biomaterial Solutions
  and Services segment serves global producers in the pulp, paper, packaging, tissue,
  and bioenergy industries, providing complete production lines, key process islands;
  and a full range of lifecycle services, enabling improvements in fiber yield, energy
  and water efficiency, emissions, and operational uptime. It offers automation systems,
  distributed control systems, industrial applications, analyzers and measurements,
  industrial internet solutions, automation services, valves, pumps, and valve automation
  soultions. The company also provides technologies for pulp, energy, circularity,
  packaging, paper, and tissue, including rebuilds, upgrades, conversions, and maintenance
  services. In addition, the company develops digital solutions for remote or on-site
  monitoring and predictive maintenance. It serves pulp, board and paper, energy and
  industrial gas, biomaterials and fuel, chemical, and mineral industries. Valmet
  Oyj was founded in 1750 and is headquartered in Espoo, Finland.'
