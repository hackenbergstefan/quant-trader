longBusinessSummary: AL Sydbank A/S, together with its subsidiaries, provides various
  banking products and services to retail clients, corporates, and associations in
  Denmark and internationally. The company operates through Banking, Asset Management,
  AL Sydbank Markets, Treasury, and Other segments. The company offers various deposits
  and loans and advances, advisory services, securities trading, asset management,
  distribution of mortgage credit products, investment products, pension, and insurance
  products. It also provides private banking solutions; services for investment funds,
  pooled pension plans, foundations, institutional clients, and wealthy customers;
  and economic research and equity research. Further, it provides retail banking services,
  such as insurance, housing, pension, and mortgage credit services to retail clients;
  mortgage bonds; and advice and quotes prices as regards bonds, shares, and foreign
  exchange, as well as undertakes market-making obligations for institutional clients,
  central banks, foreign and other clients, and banks. The company was formerly known
  as Sydbank A/S and changed its name to AL Sydbank A/S in December 2025. AL Sydbank
  A/S was founded in 1986 and is headquartered in Aabenraa, Denmark.
