longBusinessSummary: 'L3Harris Technologies, Inc. provides mission-critical solutions
  for government and commercial customers worldwide. It operates through three segments:
  Space & Mission Systems (SMS), Communications & Spectrum Dominance (CSD), and Missile
  Solutions (MSL). The SMS segment integrates satellite and payload capabilities,
  including missile warning and defense, with maritime, air special missions, and
  other global defense and civil government programs. Its MSL segment unites propulsion,
  hypersonic, and other advanced missile technologies. The CSD segment provides tactical
  radios, software, waveforms, satellite terminals, and end-to-end battlefield systems
  for the U.S. Department of Defense, international, federal, and state agency customers;
  broadband communications; integrated vision solutions, such as helmet-mounted integrated
  night vision goggles with image intensifier tubes and weapon-mounted sights, aiming
  lasers, and range finders; and public safety radios and system applications and
  equipment. The company was formerly known as Harris Corporation and changed its
  name to L3Harris Technologies, Inc. in June 2019. L3Harris Technologies, Inc. was
  founded in 1895 and is headquartered in Melbourne, Florida.'
