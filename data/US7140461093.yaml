longBusinessSummary: Revvity, Inc. provides health sciences solutions, technologies,
  and services. The company offers instruments, reagents, software, subscriptions,
  detection and imaging technologies, extended warranties, and training and services;
  and instruments, reagents, and assay platforms and software products for early detection
  of common and rare conditions, such as pregnancy and early childhood, as well as
  infectious disease testing in the diagnostics market. Its products are used for
  testing and screening genetic abnormalities, disorders, and diseases, including
  down syndrome, hypothyroidism, muscular dystrophy, infertility, and various metabolic
  conditions. It also develops technologies that enable and support genomic workflows
  using protein coupled receptors and next-generation DNA sequencing for oncology,
  immunodiagnostics, and drug discovery. It serves pharmaceutical and biotechnology
  companies, laboratories, academic and research institutions, public health authorities,
  private healthcare organizations, doctors, and government agencies under the AutoDELFIA,
  chemagic, Chitas, CNGnome, DELFIA, DELFIA Xpress, EONIS, EUROArray, EUROIMMUN, EUROLabWorkstation,
  EUROLINE, EUROPattern, Evolution Evoya, GSP, Haoyuan, IDS Immunodiagnosticsystems,
  IDS-i10, IDS-i10T, IDS-i20, IDS-iSYS, iLab, iQ, LifeCycle, LimsLink, Migele, NeoBase,
  NeoLSD, NEXTFLEX, Panthera Puncher, PreNAT II, Prime, RONIA, SimplicityChrom, Specimen
  Gate, Superflex, Symbio, T-SPOT, Vanadis, ViaCord, VICTOR2, and WholePanel brand
  names, as well as under the Accell, AlphaLISA, AlphaPlex, AlphaScreen, Alpha SureFire,
  AssayMate, BIOCHIPs, BioLegend, Bioo Scientific, BioQule, Brilliant Violet, Ce3D,
  CellCarrier, Cellaca, Celigo, Cellometer, cell::explorer, Cell-Vive, Chalice, ChemDraw,
  CHOSOURCE, Dharmacon, and DharmaFECT brand names. The company was formerly known
  as PerkinElmer, Inc. and changed its name to Revvity, Inc. in April 2023. Revvity,
  Inc. was founded in 1937 and is headquartered in Waltham, Massachusetts.
