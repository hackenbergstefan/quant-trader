longBusinessSummary: Sika AG, a specialty chemicals company, develops, produces, and
  sells systems and products for bonding, sealing, damping, reinforcing, and protecting
  in the building sector and motor vehicle industry worldwide. It offers admixtures
  and additives for concrete, cement, and mortar production;waterproofing solutions,
  such as flexible membrane systems, liquid-applied membranes, joint waterproofing
  systems, waterproofing mortars, and injection resins under the SikaProof brand for
  commercial and residential basements, tunnels, bridges, and water retaining structures;
  and flat roofing systems, including both flexible sheet and liquid-applied membranes
  under the Sika Sarnafil brand, as well as vapor control layers, adhesives, insulation,
  fixation, roof drainage, and accessories. The company also provides adhesives and
  grouts, systems for under-tile waterproofing, sound reduction, decorative finishes,
  and exterior insulation finishing systems; flooring solutions, such as synthetic
  resin and cementitious systems for industrial and commercial settings; and sealants,
  adhesives, spray foams, and tapes for commercial, industrial, residential, and infrastructure
  construction projects. It serves automobile and commercial vehicle assembly, industrial
  lamination, renewable energy, home appliances, and advanced resins industries. The
  company was founded in 1910 and is headquartered in Baar, Switzerland.
