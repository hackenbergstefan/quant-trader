longBusinessSummary: Hexagon AB (publ) provides geospatial and industrial enterprise
  solutions worldwide. It operates in Manufacturing Intelligence, Geosystems, Autonomous
  Solutions and Octave segments. The company provides autonomy and perception, enterprise
  software for farms, GNSS positioning, and machine control; airborne and mobile mapping,
  geospatial content, laser scanning, ERIDAA imagin, lucaid, and M.app enterprise;
  and asset lifecycle information management, design and visualization, engineering
  and schematics, enterprise project performance, operations and maintenance, OT/ICS
  cyber security, and smart digital reality, as well as procurement, fabrication,
  and construction services. It offers automated measurement systems, CAD/CAM and
  production software, CAE software, coordinate measuring machines, metrology software,
  portable measuring systems, quality assurance software, and service and support
  services. In addition, the company provides evaluation, planning and design; drill
  and blast; load and haul; mine survey and monitoring; processing; reclamation; operational
  safety; autonomous operations; and multi-senor technology insights services. Further,
  it offers anti-jam systems, anti-jam systems, correction services, GNSS and SMART
  antennas, GNSS/INS receivers and post processing, resilience and integrity technology,
  and visualization software; HxGN Oncall, Connect, and dC3; forensics and investigations;
  and AEC software, documentation and verification solutions, total stations, GNNS
  systems, survey software, detection systems, digital realities platform, monitoring
  solutions, and airborne solutions. It serves agriculture, geospatial, industrial
  asset lifecycle, manufacturing, mining, positioning, safety, security, and surveillance
  industries. The company was founded in 1975 and is headquartered in Stockholm, Sweden.
