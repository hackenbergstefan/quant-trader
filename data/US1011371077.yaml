longBusinessSummary: Boston Scientific Corporation develops, manufactures, and markets
  medical devices for use in various interventional medical specialties worldwide.
  The company operates in two segments, MedSurg and Cardiovascular. It offers devices
  to diagnose and treat a range of gastrointestinal conditions, such as resolution
  clips, biliary stent systems, stents and electrocautery enhanced delivery systems,
  SpyGlass, single-use scopes used for diagnostic and therapeutic procedures in the
  pancreaticobiliary system, in endoscopic retrograde cholangiopancreatography procedures,
  and single-use duodenoscopes, as well as endoluminal surgery and infection prevention
  products; devices to treat urological conditions, including ureteral stents, catheters,
  baskets, guidewires, urinary and bowel dysfunction, sheaths, balloons, single-use
  digital flexible ureteroscopes, holmium laser systems, penile implants, artificial
  urinary sphincter, laser system, and hydrogel systems; and devices to treat neurological
  movement disorders and manage chronic pain, such as spinal cord stimulator systems,
  radiofrequency ablation, and intraosseous nerve ablation and deep brain stimulation
  systems. The company also provides technologies for diagnosing and treating a range
  of diseases and abnormalities of the heart; WATCHMAN FLX, a left atrial appendage
  closure (LAAC) device; and implantable devices that monitor the heart and deliver
  electricity to treat cardiac abnormalities, such as cardioverter and cardiac resynchronization
  therapy defibrillators, MRI S-ICD systems, cardiac resynchronization therapy pacemakers,
  remote patient management systems, insertable cardiac monitor systems, and remote
  cardiac monitoring systems. In addition, it offers diagnosis and treatment of rate
  and rhythm disorders of the heart; peripheral arterial and venous diseases; and
  products to diagnose and treat forms of cancer. The company was incorporated in
  1979 and is headquartered in Marlborough, Massachusetts.
