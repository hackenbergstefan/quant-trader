longBusinessSummary: Heineken N.V. brews and sells beer and cider in Europe, the Americas,
  Africa, the Middle East, and the Asia Pacific. The company also provides soft drinks.
  It sells its products under the Heineken, Heineken 0.0, Heineken Silver, Amstel,
  Moretti, Tiger, Desperados, Edelweiss, Lagunitas, Orchard Thieves, Windhoek, Dos
  Equis, Red Stripe, Kingfisher, Bintang, Gosser, Affligem, Mort Subite, Strongbow,
  Stassen, Bulmers, Old Mout, Savanna, Turbo King, Tecate, Lagunitas Hoppy Refresher,
  Bia Viet, Tiger Crystal, Birra Moretti, Harar, Cruzcampo, Bernini, Legend Stout,
  Beavertown, Stëlz, Texels, Ladrón, Bandida, Stibitzer, El Aguila, and Murphy's brands.
  In addition, the company engages in rental of pubs and bars; wholesale activities;
  and pub management and technical services. The company offers its products to retailers,
  wholesalers and distributors, bars, restaurants, clubs, cafes, and hotels. Heineken
  N.V. was incorporated in 1864 and is headquartered in Amsterdam, the Netherlands.
  Heineken N.V. is a subsidiary of Heineken Holding N.V.
