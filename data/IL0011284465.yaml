longBusinessSummary: Plus500 Ltd., a fintech company, operates technology-based trading
  platforms in Europe, the United Kingdom, Australia, and internationally. It develops
  and operates an online trading platform, such as over the counter (OTC) products
  comprising the contracts for difference (CFDs) sector enabling its international
  customer base of individual customers to trade CFDs on underlying financial instruments
  comprising shares, indices, commodities, options, ETFs, foreign exchange pairs,
  and cryptocurrencies. The company also operates Plus500 Invest, a share dealing
  platform. The company was formerly known as Investsoft Ltd. and changed its name
  to Plus500 Ltd. in June 2012. Plus500 Ltd. was incorporated in 2008 and is based
  in Haifa, Israel.
