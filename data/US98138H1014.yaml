longBusinessSummary: Workday, Inc. provides enterprise cloud applications in the United
  States and internationally. The company offers a suite of financial management applications
  to maintain accounting information; manage financial processes, such as payables
  and receivables; identify real-time financial, operational, and management insights;
  perform financial consolidation; reduce time-to-close; promote internal control
  and auditability; and achieve consistency across finance operations. It also provides
  spend management solutions that help organizations to streamline supplier selection
  and contract management, build and execute sourcing events, such as requests for
  proposals, and manage indirect spend; expense management solutions to submit and
  approve expenses; and a suite of human capital management applications that enables
  HR teams to hire, onboard, pay, develop, reskill, and provide employee experiences.
  In addition, the company offers planning applications. Further, it provides supply
  chain and inventory solutions to healthcare organizations; solutions to manage the
  end-to-end student and faculty lifecycle; Workday Extend for customers and their
  developers to build custom applications. The company serves the professional and
  business services, financial services, healthcare, manufacturing, media, education,
  government, technology, media, retail, and hospitality industries. It sells its
  solutions through its direct sales organization. The company was formerly known
  as North Tahoe Power Tools, Inc. and changed its name to Workday, Inc. in July 2005.
  Workday, Inc. was incorporated in 2005 and is headquartered in Pleasanton, California.
