longBusinessSummary: HCA Healthcare, Inc., through its subsidiaries, provides health
  care services in the United States. The company owns, manages, and operates hospitals,
  ASCs, freestanding emergency care facilities, urgent care facilities, walk-in clinics,
  diagnostic and imaging centers, radiation and oncology therapy centers, as well
  as rehabilitation and physical therapy centers, physician practices, home health
  agencies, hospices, outpatient physical therapy providers, home and community-based
  services providers, and various other facilities. Its general and acute care hospitals
  offer medical and surgical services, including inpatient care, intensive care, cardiac
  care, diagnostic services, and emergency services; and outpatient services, such
  as outpatient surgery, laboratory, radiology, respiratory therapy, cardiology, and
  physical therapy. The company was formerly known as HCA Holdings, Inc. HCA Healthcare,
  Inc. was founded in 1968 and is headquartered in Nashville, Tennessee.
