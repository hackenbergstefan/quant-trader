longBusinessSummary: Cranswick plc engages in the production and supply of food products
  to grocery retailers, food service sector, and other food producers in the United
  Kingdom, Continental Europe, and internationally. The company offers fresh pork,
  gourmet sausages, gourmet bacon and gammon, fresh and coated chicken, ready to eat
  chicken, gourmet pastries, charcuterie, houmous and dips, cooked meats, olives and
  antipasti, and cheese, as well as provides food services, such as culinary solutions
  for pubs, restaurants, quick service restaurants, and coffee shops. It also offers
  mediterranean food products; olives, olive oil, nuts, grains, and pulses under the
  Cypressa brand; snacks and sharing boxes under the Bodega brand; and pet food and
  supplies under the Vitalin and Alpha Feeds, as well as operates export business.
  The company was incorporated in 1972 and is based in Hessle, the United Kingdom.
