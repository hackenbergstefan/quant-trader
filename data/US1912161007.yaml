longBusinessSummary: The Coca-Cola Company, a beverage company, manufactures and sells
  various nonalcoholic beverages in the United States and internationally. The company
  provides Trademark Coca-Cola, sparkling soft drinks and flavors; water, sports,
  coffee, and tea; juice, value-added dairy, and plant-based beverages; and emerging
  beverages. It also offers beverage concentrates and syrups, as well as fountain
  syrups to fountain retailers comprising restaurants and convenience stores. The
  company sells its products under the Coca-Cola, Diet Coke/Coca-Cola Light, Coca-Cola
  Zero Sugar, caffeine free Diet Coke, Cherry Coke, Fanta, Sprite, Simply, Fanta Orange,
  Fanta Zero Orange, Fanta Zero Sugar, Fanta Apple, Sprite Zero Sugar, Simply Orange,
  Simply Apple, Simply Grapefruit, Fresca, Schweppes, Thums Up, Aquarius, Ayataka,
  BODYARMOR, Ciel, Costa, Crystal, Dasani, Fuze Tea, Georgia, glacéau smartwater,
  glacéau vitaminwater, Gold Peak, I LOHAS, Powerade, Topo Chico, Core Power, Del
  Valle, fairlife, innocent, Maaza, Minute Maid, Minute Maid Pulpy, Santa Clara, and
  dogadan brands. It operates through a network of independent bottling partners,
  distributors, wholesalers, and retailers, as well as through bottling and distribution
  operators. The Coca-Cola Company was founded in 1886 and is headquartered in Atlanta,
  Georgia.
