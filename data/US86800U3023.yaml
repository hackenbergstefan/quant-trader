longBusinessSummary: Super Micro Computer, Inc., together with its subsidiaries, develops
  and sells server and storage solutions based on modular and open-standard architecture
  in the United States, Asia, Europe, and internationally. The company offers liquid
  and air-cooled AI servers for training and inferencing with integrated graphics
  processing units (GPUs) or PCIe based architectures; SuperBlade, MicroBlade, FlexTwin,
  GrandTwin, and BigTwin blade and multi-node systems; SuperStorage systems; Hyper,
  CloudDC, and WIO and rackmount systems; embedded (5G/IoT/Edge) systems; and MicroCloud
  server systems. It also provides workstations and networking devices; and modular
  server subsystems and accessories, including server boards, chassis, power supplies,
  and other accessories. In addition, the company offers remote system management
  solutions, such as Server Management suite comprising Supermicro Server Manager,
  Supermicro Power Management software, Supermicro Update Manager, SuperCloud Composer,
  SuperCloud Director, and SuperDoctor 5. Further, the company identifies service
  requirements; creates and executes project plans; conducts verification testing;
  offers training; and provides technical documentation. Additionally, it provides
  rack level services from design to deployment for full rack and cluster level deployments
  of AI and HPC datacenters; help desk services and on-site product support; and warranties,
  maintenance, and technical support services. The company serves enterprise data
  centers, cloud computing, artificial intelligence, 5G, and edge computing markets
  through direct and indirect sales force, distributors, value-added resellers, system
  integrators, and original equipment manufacturers. Super Micro Computer, Inc. has
  a strategic alliance with NetApp, Inc. Super Micro Computer, Inc. was incorporated
  in 1993 and is headquartered in San Jose, California.
