longBusinessSummary: 'Vulcan Materials Company produces and supplies construction
  aggregates in the United States. It operates through three segments: Aggregates,
  Asphalt, and Concrete. The company provides crushed stone, sand and gravel, sand,
  and other aggregates for use in construction and maintenance of highways, streets,
  and other public works, as well as in the construction of housing and commercial,
  industrial, and other nonresidential facilities; aggregates that are used as ballast
  for construction and maintenance of railroad tracks; riprap and jetty stones for
  use in erosion control along roads and waterways; asphalt mix; asphalt construction
  paving services; and ready-mixed concrete products. The company was formerly known
  as Virginia Holdco, Inc. and changed its name to Vulcan Materials Company. Vulcan
  Materials Company was founded in 1909 and is headquartered in Birmingham, Alabama.'
