longBusinessSummary: Snam S.p.A., together with its subsidiaries, engages in the operation
  of natural gas transport and storage infrastructure. It operates through Natural
  gas transportation; Natural gas storage; LNG regasification; and Market solutions
  segments. The company offers natural gas transportation and dispatching services;
  and owns and manages liquified natural gas (LNG) regasification plants. It also
  provides natural gas storage services through an integrated group of infrastructure
  comprising deposits, wells, gas treatment and compression plants, and the operational
  dispatching systems; and operates storage concessions located in Lombardy, Emilia-Romagna,
  and Abruzzo. In addition, the company offers energy efficiency solutions for companies,
  condominiums, tertiary, and public administration sectors; and invests, constructs,
  develops, and operates biogas and biomethane plants. Further, the company provides
  technical consulting services; and sells automotive compressed natural gas (CNG)
  compressors. It operates a natural gas transportation network of approximately 38,000
  kilometers in Italy, Austria, the United Arab Emirates, France, Greece, and the
  United Kingdom. The company was formerly known as Snam Rete Gas S.p.A. and changed
  its name to Snam S.p.A. in January 2012. Snam S.p.A. was founded in 1941 and is
  headquartered in Milan, Italy.
