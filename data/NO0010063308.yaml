longBusinessSummary: 'Telenor ASA, together with its subsidiaries, operates as a telecommunication
  company worldwide. It operates through four segments: Nordics, Asia, Infrastructure,
  and Amp. The company offers mobile and broadband telecom products and services,
  including mobile, broadband and TV services; other services, including solutions
  for business customers like managed services, virtual private networks, software
  defined networks, and network as a service; IoT solutions; and mobile maritime communication
  for cruise and ferry, fisheries, and oil and gas industry. It also provides hardware
  comprising mobile phones, broadband modems, and TV boxes; wholesale services, such
  as national and international roaming and interconnect, and solutions for mobile
  and fixed virtual network operators and service providers, as well as leased lines
  and colocation at towers and data centres. In addition, the company provides cloud
  storage service for private use and businesses that allows to back up, store, synchronize,
  and share files over the Internet. Telenor ASA was founded in 1855 and is headquartered
  in Fornebu, Norway.'
