longBusinessSummary: Vallourec S.A., through its subsidiaries, provides tubular solutions
  for the oil and gas, industry, and new energies markets in North America, South
  America, France, the Middle East, Indonesia, and East Asia. It operates through
  Tubes and Mine & Forests segments. The company offers seamless tubes for refineries,
  petrochemical facilities, onshore liquefied natural gas (LNG) facilities, and floating
  LNG facilities, as well as for floating production, storage, and offloading units;
  VAM connections; rigid subsea line pipes, onshore rigid line pipes, and pipe coating
  solutions; and carbon steel and steel alloy tubes, hollow bars, and connections.
  It also provides assistance in lowering tubes, inspecting connections, and supervising
  assembly; inventory management; engineering; training; on-site services; preparation
  for drilling operations; and integrated solutions for the subsea pipelines comprising
  analysis, coating, insulation, bending, logistics, and project management with digital
  support solutions. In addition, the company offers tubular products for the geothermal;
  carbon capture, utilization, and storage; and hydrogen industries. Further, it provides
  tubes and hollow bars, as well as circular, square, rectangular, and octagonal sections
  for the manufacture of cranes, construction machinery, agricultural machinery, and
  hydraulic and gas cylinders; and axle tubes and gearbox applications, motorbike
  frame components, and suspension and stabilizer tubular parts for heavy and light
  vehicles. Additionally, the company is involved in the iron ore and charcoal production
  businesses. It serves oil service, engineering, and construction companies; distributors
  and industrial equipment manufacturers; and energy companies, and carbon capture
  and storage specialists, as well as geothermal, green hydrogen, and solar developers.
  Vallourec S.A. was founded in 1890 and is headquartered in Meudon, France.
