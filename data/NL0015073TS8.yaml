longBusinessSummary: CSG N.V. manufactures and sells defence products in the Czech
  Republic, Europe, the United States, and the Asia Pacific. The company operates
  through CSG Defence Systems and CSG Ammo + segments. The CSG Defence Systems segment
  focuses on the production, sale, service, and maintenance of military and defence
  equipment to customers, including governments and private companies. Its products
  include medium and large calibre ammunition (105-155mm and other artillery ammunition,
  as well as tank ammunition, rockets, mortar bombs and medium calibre ammunition);
  land systems include military-use vehicles, such as military, wheeled and tracked
  vehicles, heavy off-road trucks and weapon systems; Aero space and defence electronics,
  including military radars for land vehicles and air defence systems, surveillance
  radars, and systems for air traffic control; and advanced systems, focuses on turbojet
  engines for unmanned aerial vehicles (UAVs) and missiles. The CSG Ammo + segment
  provides small calibre ammunicato products, including ammunition for pistols, revolvers,
  rifles and shotguns for civilian customers, law enforcement, and the military. The
  company has a strategic collaboration with FNSS Savunma Sistemleri A.S. for the
  development of advanced armored platforms. The company has strategic joint ventures
  with Hellenic Defence Systems S.A. in Greece to produce large-calibre ammunition
  and explosives supply security, and with partners in India to expand manufacturing
  capabilities and secure access to critical inputs for ammunition production. The
  company was founded in 1995 and is based in Prague, the Czech Republic. CSG N.V.
  operates as a subsidiary of CSG FIN a.s.
