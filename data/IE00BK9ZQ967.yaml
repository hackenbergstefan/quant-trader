longBusinessSummary: Trane Technologies plc designs, manufactures, sells, and services
  of solutions for heating, ventilation, air conditioning, and custom and transport
  refrigeration. It offers air conditioners, exchangers, and handlers; airside and
  terminal devices; air sourced heat pumps; chillers; coils and condensers; auxiliary
  power, cold storage, and condensing units; controls contracting and commissioning,
  decarbonization programs, and gensets; dehumidifiers; energy and water efficiency
  programs; energy recovery ventilators and power solutions; energy storage; furnaces;
  home automation; humidifiers; HVAC performance-monitoring products; and indoor air
  quality assessments and related products for HVAC and transport solutions. The company
  also provides asset management, building management, bus air purification, bus and
  rail HVAC, container refrigeration, control, ductless, geothermal, data center and
  multi-pipe HVAC, package heating and cooling, rail refrigeration, residential air
  filtration, self and vehicle powered truck refrigeration, temporary heating and
  cooling, truck refrigeration, unitary, variable refrigerant flow, and trailer refrigeration
  systems. In addition, it offers industrial process refrigeration, installation contracting,
  lighting retrofit, medical grade refrigeration, refrigerant reclamation, renewable
  energy and storage, residential hybrid heating, telematics, thermostats/controls
  and associated digital, ventilation, and stationary cold storage solutions; packaged
  rooftop units; rate chambers; residential air filters; thermal energy storage; transport
  heater products; temperature freezers; energy infrastructure programs and management,
  repair and maintenance, smart and AI-enabled, and rental services; water source
  heat pumps; and aftermarket and OEM parts and supplies. The company was formerly
  known as Ingersoll-Rand Plc and changed its name to Trane Technologies plc in March
  2020. The company was founded in 1885 and is headquartered in Swords, Ireland.
