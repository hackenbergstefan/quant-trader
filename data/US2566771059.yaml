longBusinessSummary: Dollar General Corporation, a discount retailer, provides various
  merchandise products in the southern, southwestern, midwestern, and eastern United
  States. It offers consumable products, including paper towels, bath tissues, paper
  dinnerware, trash and storage bags, disinfectants, and laundry products; packaged
  food, such as cereals, pasta, canned soups, canned meats, fruits and vegetables,
  condiments, spices, sugar, and flour; and perishables, including milk, eggs, bread,
  refrigerated and frozen food, beer, wine, and produce; candy, cookies, crackers,
  salty snacks, and carbonated beverages; over-the-counter medicines and personal
  care products including soap, body wash, shampoo, cosmetics, dental hygiene and
  foot care products; pet supplies and pet food; and tobacco products. The company
  also provides seasonal products comprising holiday items, toys, batteries, small
  electronics, greeting cards, stationery, prepaid phones and accessories, gardening
  supplies, hardware, automotive, and home office supplies; home products include
  kitchen supplies, cookware, small appliances, light bulbs, storage containers, frames,
  candles, craft supplies and kitchen, and bed and bath soft goods; and apparel products
  for infants, toddlers, girls, boys, women and men, as well as socks, underwear,
  disposable diapers, shoes and accessories. The company was formerly known as J.L.
  Turner & Son, Inc. and changed its name to Dollar General Corporation in 1968. Dollar
  General Corporation was founded in 1939 and is based in Goodlettsville, Tennessee.
