longBusinessSummary: 'Lagercrantz Group AB (publ), together with its subsidiaries,
  operates as a technology company in Sweden, Denmark, Norway, Finland, Germany, the
  United Kingdom, Benelux, Poland, rest of Europe, North America, Asia, and internationally.
  The company operates through five segments: Electrify, Control, TecSec, Niche Products,
  and International. It offers electrical connectors, electrical enclosures and technical
  housing, cabling, electrical products, and infrastructure products. The company
  also provides control systems for lifts and level sensors for molten metals, protective
  cases for the transport of advanced communications equipment, and conveyors for
  foodstuff. In addition, it offers technical security products, such as locking devices,
  fences and security doors, technical security systems, and security solutions that
  prevent accidents. Further, the company provides washing systems for heavy vehicles,
  dispenser systems for foodstuff, sharpening systems for knives and other edge tools,
  and special doors for refrigeration rooms and hospitals, as well as valves for land-based
  fish farms. It primarily serves customers in the fields of electric power generation
  and distribution, electronics, building/construction, IT, transport, and telecommunication.
  Lagercrantz Group AB (publ) was founded in 1906 and is headquartered in Stockholm,
  Sweden.'
