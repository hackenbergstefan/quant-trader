longBusinessSummary: NKT A/S designs, manufactures, and installs low, medium, and
  high voltage power cable solutions in Denmark. It operates through Solutions, Applications
  and Service & Accessories segments. The company offers high voltage cable solutions,
  including high voltage onshore and offshore cables; medium voltage, dynamic, and
  universal cables; and low voltage building wires, flexible cables and conduits,
  control cables, 1 kV cables, and telecom energy and fire performance cables. The
  company also provides medium voltage cable accessories, such as joints, terminations,
  separable connector, paper-insulated lead sheath and pre-assembled connection cables,
  cable branch cabinets, and pre-assembled connection cables; and high voltage cable
  accessories comprising GIS/transformer terminations, low pressure oil-filled cable
  systems, outdoor terminations, wind power applications, and transition joints. In
  addition, it offers lifecycle cable services; and installation, operation and maintenance,
  repair, decommissioning, and cable monitoring solutions. Further, the company provides
  oil and gas cable competence center services, and technology consulting services;
  and offshore and onshore wind, and solar solutions. It operates in Germany, Sweden,
  the United Kingdom, Poland, the United States, Norway, the Czech Republic, France,
  the Netherlands, Portugal, and internationally. The company was formerly known as
  NKT Holding A/S and changed its name to NKT A/S in May 2017. NKT A/S was founded
  in 1891 and is based in Copenhagen, Denmark.
