longBusinessSummary: CTS Eventim AG & Co. KGaA, together with its subsidiaries, operates
  in the leisure events market in Germany, Italy, Switzerland, the United States,
  Austria, the United Kingdom, Spain, Netherlands, Finland, France, Denmark, Sweden,
  Norway, Chile, Brazil, and internationally. The company operates through two segments,
  Ticketing and Live Entertainment. Its Ticketing segment produces, sells, brokers,
  distributes, and markets tickets for concerts, festivals, plays, musicals, trade
  fairs, art shows, film showings, exhibitions, edutainment, sports, and other events.
  It markets tickets in-store, online, and via mobile devices through using the internet
  EVENTIM.Web; EVENTIM.Net, its network platform; EVENTIM.Inhouse, for in-house ticketing;
  EVENTIM.Tixx, for sports ticketing; EVENTIM.Light, a self-service product for small,
  independent organizers; and EVENTIM.Access, a solution for ticket sales and admission
  control. This segment also provides EVENTIM.Pass ticket, which protects unauthorized
  resale and offers artists and organizers fair revenue and control. The Live Entertainment
  segment plans, prepares, and performs tours, events, and festivals, including music
  events and concerts, as well as markets music productions. This segment is also
  involved in the operation of venues. The company was formerly known as CTS EVENTIM
  AG and changed its name to CTS Eventim AG & Co. KGaA in May 2014. CTS Eventim AG
  & Co. KGaA was founded in 1989 and is headquartered in Hamburg, Germany.
