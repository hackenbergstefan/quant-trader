longBusinessSummary: 'GoDaddy Inc. engages in the design and development of cloud-based
  products in the United States and internationally. It operates in two segments:
  Applications and Commerce (A&C), and Core Platform (Core). The A&C segment offers
  applications products, including Websites + Marketing, a mobile-optimized online
  tool that enables customers to build websites and e-commerce enabled online stores;
  and Managed WordPress, a streamlined and optimized website building that allows
  customers to build and manage a WordPress site; marketing tools and services, such
  as GoDaddy Studio and search engine optimization designed to help businesses acquire
  and engage customers and create content; and digital marketing services include
  email marketing, reputation management, and development of brand guides. This segment
  also offers Microsoft 365 that connects to customers'' domains; email service plans
  with a multi-feature web interface; email backup, encryption, archiving, and other
  advanced e-mail security services; added security functionality services; GoDaddy
  Payments, a payment facilitator that enables customers to accept various forms of
  payments; Smart Terminal, a dual screen all-in-one point-of-sale system that allows
  customers to manage in-store inventory and product catalogs and accept payments;
  payment acceptance solutions; and online store capabilities. The Core segment offers
  domain products, including primary registrations, domain aftermarket platform, and
  domain name add-ons, as well as GoDaddy Registry, a provider of domain name registry
  services; and hosting and security services comprising shared website hosting and
  virtual private servers, as well as security products with a suite of tools designed
  to help secure customers'' online presence; and SSL certificates. The company serves
  small businesses, individuals, organizations, developers, designers, and domain
  investors. GoDaddy Inc. was founded in 1997 and is headquartered in Tempe, Arizona.'
