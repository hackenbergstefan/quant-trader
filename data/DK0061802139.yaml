longBusinessSummary: ALK-Abelló A/S, an allergy solutions company, develops treatments
  for respiratory allergy, anaphylaxis, and food allergy and new disease areas in
  the European Union, the United Kingdom, Norway, Switzerland, the United States,
  Canada, Japan, China, and internationally. The company offers allergy immunotherapy
  products in the form of vaccines, injections, sublingual drops, and tablets for
  the treatment of various allergies, including grass and tree pollen, house dust
  mites, ragweed, Japanese cedar, peanuts, and tree nuts; adrenaline nasal sprays
  for emergency treatment of anaphylaxis and acute flares in chronic spontaneous urticaria;
  and ALK 014, a biologic for food allergies. It also provides GRAZAX/GRASTEK, a tablet
  for grass pollen allergy; ACARIZAX, ODACTRA, and MITICURE/SENSIMUNE, which are tablets
  for house dust mite allergies; ITULAZAX/ITULATEK, a tablet for tree pollen allergy;
  RAGWITEK/RAGWIZAX, a tablet for ragweed pollen allergy; and CEDARCURE, a tablet
  for Japanese cedar pollen allergy. In addition, the company offers consumer healthcare
  solutions, such as klarify.me, a digital patient engagement platform to help people
  manage their allergies. Further, it provides allergen extracts for use in the diagnosis
  of specific allergies, such as skin prick and blood test; and emergency medicine
  treatment, such as adrenaline autoinjectors, an intra-muscular injection of adrenaline
  for the treatment of acute life-threatening allergic reactions, including anaphylaxis.
  The company has a collaboration with Torii Pharmaceutical Co., Ltd. for the development
  of GRAZAX and CEDARCURE; and Dr. Reddy's Laboratories for the development of Sensimune.
  ALK-Abelló A/S was founded in 1923 and is headquartered in Horsholm, Denmark.
