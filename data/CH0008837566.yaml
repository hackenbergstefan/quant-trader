longBusinessSummary: Allreal Holding AG, through its subsidiaries, operates as a real
  estate company in Switzerland. It operates in two segments, Real Estate and Development
  & Realisation. The company invests in residential and commercial properties. It
  also offers portfolio management, operational, and building management services.
  In addition, the company provides project development, and consulting services;
  and sells condominiums. Additionally, it is involved in planning, execution of construction
  projects, and buying and developing real estate projects and developing sites; maintenance
  of technical systems; renovation activities; and implementation of own and third-party
  construction projects, as well as acquires plots of land. Allreal Holding AG was
  founded in 1999 and is based in Opfikon, Switzerland.
