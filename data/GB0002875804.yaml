longBusinessSummary: British American Tobacco p.l.c. provides tobacco and nicotine
  products to consumers in the United States, Europe, Latin America, Canada, the Asia-Pacific,
  the Middle East, Central Asia, Caucasus, and Africa. The company offers vapour products;
  heated products, which consists of a battery-powered device and a plant-based substance
  consumable that is heated; modern oral products, such as nicotine pouches; combustibles,
  including cigarette sticks and other tobacco stick products; traditional oral products,
  such as snus and moist snuff; and fine cut/roll-your-own tobacco products. It sells
  its products under the Vuse, glo, Velo, Grizzly, Kodiak, Dunhill, Kent, Lucky Strike,
  Pall Mall, Rothmans, Newport, Natural American Spirit, and Camel Snus brands, as
  well as Vogue, Viceroy, Kool, Peter Stuyvesant, Craven A, and State Express 555
  brands. The company distributes its products to retail outlets. British American
  Tobacco p.l.c. was founded in 1902 and is headquartered in London, the United Kingdom.
