longBusinessSummary: Zebra Technologies Corporation, together with its subsidiaries,
  operates in the automatic identification and data capture solutions industry worldwide.
  It operates in two segments, Connected Frontline, and Asset Visibility and Automation.
  The company designs, manufactures, and sells printers that produce labels, wristbands,
  tickets, receipts, and plastic cards; dye-sublimination thermal card printers that
  produce images, which are used for personal identification, access control, and
  financial transactions; radio frequency identification device (RFID) printers that
  encode data into passive RFID transponders; accessories and options for printers,
  including carrying cases, vehicle mounts, and battery chargers; stock and customized
  thermal labels, receipts, ribbons, plastic cards, and RFID tags for printers; and
  electronic sensors and temperature-monitoring labels. It also provides various maintenance,
  technical support, repair, and managed and professional services; fixed readers,
  RFID enabled mobile computers, and RFID sleds; tags, sensors, exciters, middleware
  software, and application software; and physical inventory management solutions;
  rugged and enterprise-grade mobile computing products and accessories, as well as
  real-time location systems and services. In addition, the company offers barcode
  scanners and imagers, RFID readers, industrial machine vision cameras, and fixed
  industrial scanners; point-of-sale solutions, self-serve kiosks, and interactive
  touchscreen displays; workflow optimization solutions, such as workforce management,
  workflow execution and task management, and prescriptive analytics, and communications
  and collaboration solutions; and cloud-based software. The company serves retail
  and e-commerce, manufacturing, transportation and logistics, healthcare, public
  sector, and other industries through direct sales force and network of channel partners.
  The company was founded in 1969 and is headquartered in Lincolnshire, Illinois.
