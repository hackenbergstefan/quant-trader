longBusinessSummary: 'Intertek Group plc provides quality assurance solutions to various
  industries in the United Kingdom, the United States, China, Australia, and internationally.
  It operates through five segments: Consumer Products, Corporate Assurance, Health
  and Safety, Industry and Infrastructure, and World of Energy. The company offers
  quality assurance, testing, inspection, and certification services, including laboratory
  safety, quality and performance testing, accredited third-party management systems
  auditing and certification, technical inspection, second-party supplier auditing
  and supply chain solutions, sustainability data verification, process performance
  analysis and training, food safety testing, hygiene and safety audits, advisory
  and consulting, and validation services, as well as hardware, software, and cyber
  security solutions. It also provides asset performance management, analytical testing,
  non-destructive and materials testing, engineering, cargo and inventory inspection,
  analytical assessment, calibration, supply-chain traceability, and related research
  and technical services, as well as support services in product development, regulatory
  authorization, chemical testing, and production. The company serves a range of industries,
  including textiles, footwear, toys, hardlines, home appliances, consumer electronics,
  information and communication technology, automotive, aerospace, lighting, building
  products, industrial and renewable energy products, oil and gas, petrochemical,
  minerals, exploration, ore and mining, building and construction, solar energy,
  energy storage, green hydrogen, petroleum and biofuels, agricultural supply chain,
  food, transportation, chemicals and pharma, and healthcare, as well as governments,
  regulatory bodies, and exporters and importers to support trade compliance. The
  company was founded in 1885 and is based in London, the United Kingdom.'
