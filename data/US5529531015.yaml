longBusinessSummary: 'MGM Resorts International, through its subsidiaries, operates
  as a gaming and entertainment company in the United States, China, and internationally.
  It operates through four segments: Las Vegas Strip Resorts, Regional Operations,
  MGM China, and MGM Digital. The company operates casino resorts that offer gaming,
  hotel, convention, dining, entertainment, retail, and other resort amenities, as
  well as online/digital games through its online platforms. Its casino operations
  include slots and table games, as well as live dealer, online sports betting, and
  iGaming through BetMGM. The company''s customers include premium gaming customers;
  leisure and wholesale travel customers; business travelers; and group customers,
  including conventions, trade associations, and small meetings. The company was formerly
  known as MGM MIRAGE and changed its name to MGM Resorts International in June 2010.
  MGM Resorts International was incorporated in 1986 and is based in Las Vegas, Nevada.'
