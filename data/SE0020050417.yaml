longBusinessSummary: Boliden AB (publ) engages in the extracting, producing, and recycling
  of base metals in Sweden, Finland, other Nordic region, Germany, the United Kingdom,
  Europe, North America, and internationally. The company operates through Business
  Area Mines and Business Area Smelters segments. It explores copper, zinc, nickel,
  lead, gold, silver, cobalt, sulphuric acid, tellurium, platinum, palladium, rhodium,
  iridium, ruthenium, and osmium deposits. The company operates the Aitik, the Boliden
  Area, and Garpenberg mines in Sweden; the Tara mine in Ireland; the Kevitsa mines
  in Finland; the Somincor mine in Portugal; Kokkola smelters in Finland; Odda zinc
  smelters in Norway; the Rönnskär smelter in Sweden; Harjavalta copper smelters in
  Finland; and the Bergsöe lead smelter in Sweden. It sells its metals primarily to
  industrial customers. The company was founded in 1924 and is headquartered in Stockholm,
  Sweden.
