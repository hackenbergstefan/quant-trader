longBusinessSummary: Stellantis N.V. engages in the designing, engineering, manufacturing,
  distribution, and sale of automobiles and light commercial vehicles, engines, transmission
  systems, and mobility services worldwide. It provides luxury and premium vehicles;
  sport utility vehicles; and parts and accessories. The company also provides contract
  services; retail and dealer financing services; and vehicle leasing and rental services,
  as well as engages in after-market parts and service businesses and data businesses.
  It offers its products under the Abarth, Alfa Romeo, Chrysler, Citroën, DS Automobiles,
  Dodge, Fiat, Jeep, Maserati, Ram Trucks, Opel, Lancia, Vauxhall, Peugeot, Free2move,
  Share Now, Leasys, and Comau brand names through distributors and dealers. The company
  has a strategic collaboration with Microsoft Corporation for the development of
  AI initiatives across sales, customer care, and operations. The company operates
  in North America, France, Brazil, Italy, Germany, the United Kingdom, Turkiye, Spain,
  Argentina, Belgium, Austria, the Netherlands, Portugal, Poland, Algeria, Morocco,
  Japan, China, and internationally. Stellantis N.V. was founded in 1899 and is based
  in Hoofddorp, the Netherlands.
