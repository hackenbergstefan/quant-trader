longBusinessSummary: Kimco Realty is a real estate investment trust (REIT) and leading
  owner and operator of high-quality, open-air, grocery-anchored shopping centers
  and mixed-use properties in the United States. The company's portfolio is strategically
  concentrated in the first-ring suburbs of the top major metropolitan markets, including
  high-barrier-to-entry coastal markets and Sun Belt cities. Its tenant mix is focused
  on essential, necessity-based goods and services that drive multiple shopping trips
  per week. The company has specialized in shopping center ownership, management,
  acquisitions, and value-enhancing redevelopment activities for more than 65 years.
  With a proven commitment to corporate responsibility, Kimco Realty is a recognized
  industry leader in this area. As of September 30, 2026, the company owned interests
  in 561 U.S. shopping centers and mixed-use assets comprising 99 million square feet
  of gross leasable space. Kimco Realty Corporation was incorporated in 1958 in Maryland
  and is based in Jericho, New York.
