longBusinessSummary: FactSet Research Systems Inc., together with its subsidiaries,
  operates as a global data and artificial intelligence solutions provider for the
  financial markets in the Americas, Europe, the Middle East, Africa, and Asia Pacific.
  It offers data, products, and analytical applications; and workstations, portfolio
  analytics, and enterprise data solutions, as well as managed services for supporting
  data, performance, risk and reporting, and AI-enabled workflows. The company also
  provides financial data and market intelligence on securities, companies, industries,
  and people that enable clients to research advisory, dealmaking and investment ideas,
  as well as analyze, monitor, and manage portfolios; and solutions covering investment
  lifecycle of investment research, portfolio construction and analysis, trade execution,
  performance measurement, risk management, and reporting. In addition, it offers
  banking solutions that supports company and market research; wealth solutions which
  supports home office, advisory, and client engagement workflows; and data and technology
  offerings, including desktop and mobile platform, data solutions, cloud-based digital
  solutions, application programming interfaces, and model context protocol servers.
  The company serves professionals, including institutional asset managers, bankers,
  wealth managers, asset owners, partners, hedge funds, corporate users, private equity
  and venture capital professionals. FactSet Research Systems Inc. was founded in
  1978 and is headquartered in Norwalk, Connecticut.
