longBusinessSummary: Casey's General Stores, Inc., together with its subsidiaries,
  operates convenience stores under the Casey's and Casey's General Store names in
  the United States. Its stores offer pizza, donuts, hot breakfast items, and sandwiches;
  and beverages, tobacco and nicotine products. The company's stores also provide
  soft drinks, energy, water, sports drinks, juices, coffee, and tea and dairy products;
  beer, wine, and spirits; snacks, candy, packaged bakery, and other food items; ice,
  ice cream, meals, and appetizers; health and beauty aids, automotive products, electronic
  accessories, and housewares. In addition, its stores offer motor fuel for sale on
  a self-service basis; gasoline and diesel fuel; and ATM, lotto/lottery, and prepaid
  cards, as well as car wash services. The company also operates distribution centers.
  Casey's General Stores, Inc. was founded in 1959 and is headquartered in Ankeny,
  Iowa.
