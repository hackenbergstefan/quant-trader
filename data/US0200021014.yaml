longBusinessSummary: 'The Allstate Corporation, together with its subsidiaries, provides
  property and casualty, and other insurance products in the United States and Canada.
  It operates in four segments: Allstate Protection; Run-off Property-Liability; Protection
  Services; and Corporate and Other. The company offers private passenger auto, homeowners,
  other personal lines and commercial insurance through exclusive agents, independent
  agents, contact centers and online under the Allstate, National General, Direct
  Auto and Answer Financial brands. It also provides consumer product protection plans,
  device and mobile data collection services, and analytic solutions using automotive
  telematics information, roadside assistance, and protection plans; and insurance
  products, such as identity protection and restoration. In addition, the company
  offers property and casualty insurance, as well as engages in company activities
  and certain non-insurance operations, including expenses associated with strategic
  initiatives. Further, it offers automotive protection; vehicle service contracts,
  guaranteed asset protection, road hazard tires and wheels, and paintless dent repair
  protection; and roadside assistance, mobility data collection services, and analytic
  solutions using automotive telematics information, identity theft protection, and
  remediation services. The Allstate Corporation was founded in 1931 and is headquartered
  in Northbrook, Illinois.'
