longBusinessSummary: Waters Corporation provides analytical workflow solutions in
  Asia, the Americas, and Europe. The company operates through two segments, Waters
  and TA. The company designs, manufactures, sells, and services liquid chromatography,
  as well as mass spectrometry (MS) technology systems and supports products, including
  chromatography columns, and other consumable products. It also designs, manufactures,
  sells, and services thermal analysis, rheometry, and calorimetry instruments for
  use in predicting the suitability and stability of fine chemicals, pharmaceuticals,
  water, polymers, metals, and viscous liquids for various industrial, consumer goods,
  and healthcare products, as well as for life science research; and develops and
  supplies software-based products that interface with its instruments, as well as
  other manufacturers' instruments. In addition, the company offers MS technology,
  which is used in drug discovery and development comprising clinical trial testing,
  the analysis of proteins in disease processes, nutritional safety analysis, and
  environmental testing. Its products are used by clinical, pharmaceutical, biochemical,
  industrial, nutritional safety, environmental, academic, and governmental customers
  working in research and development, quality assurance, and other laboratory applications.
  The company was founded in 1958 and is headquartered in Milford, Massachusetts.
