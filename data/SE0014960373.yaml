longBusinessSummary: Sweco AB (publ) provides architecture and engineering consultancy
  services worldwide. The company operates through Buildings and Urban Areas; Water,
  Energy, and Industry; Transportation Infrastructure; and Architecture segments.
  It provides energy analysis and environmental certification, fire safety engineering
  and risk analysis, and HVAC and sanitation, as well as design of electrical, telecom,
  and security systems; building construction and industrial structures design, and
  construction economics, as well as steel, timber, and glass structures design; statistics
  and forecasts, analysis and strategy, studies, and planning and design; project
  and design management, property development and management, and site supervision;
  and systems development and big data, data coordination and BIM, 3D visualization
  and geographical analyses, and strategy and operational support services, as well
  as Twinfinity, a BIM platform. The company offers energy production studies, transmission
  and distribution planning, and energy market analysis and optimization advice; water
  and wastewater engineering, water resource planning, urban water management, and
  design of flood protection structures; waste management planning and advice, environmental
  studies and impact assessments, and chemical substances and associated legislation;
  and process engineering, plant design, and logistics planning services. It provides
  road and land use planning, rock excavation design and geotechnical engineering,
  bridge design, port master planning, and surveying; tracks, electricity, signaling,
  telecoms, and operation and maintenance; and capacity, accessibility, and strategic
  planning services, as well as intelligent transportation systems. The company also
  offers urban planning; landscape, building, and interior architecture; and cultural
  heritage and lighting design services. The company was founded in 1889 and is headquartered
  in Stockholm, Sweden.
