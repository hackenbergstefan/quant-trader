longBusinessSummary: Hiscox Ltd, through its subsidiaries, provides insurance and
  reinsurance services in the United Kingdom, Europe, the United States, and internationally.
  It operates through Hiscox Retail, Hiscox London Market, and Hiscox Re segments.
  The company offers commercial insurance, such as emerging professions, media and
  tech, and small business insurance; and personal lines, including high-value homes
  and fine art, as well as artwork, antiques, classic cars, jewelry, collectables,
  and other assets through brokers, partners, and direct-to-consumers. It also provides
  property insurance; marine, specialty, cyber, and energy insurance; casualty insurance;
  terrorism, kidnap, and ransom insurance; and other specialty insurance products.
  In addition, the company offers property and casualty reinsurance services, as well
  as investment services. Hiscox Ltd was founded in 1901 and is headquartered in Pembroke,
  Bermuda.
