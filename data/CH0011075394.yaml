longBusinessSummary: Zurich Insurance Group AG provides insurance products and related
  services in Europe, the Middle East, Africa, North America, Latin America, and the
  Asia Pacific. It operates through Property & Casualty Regions, Life Regions, and
  Farmers segments. The company offers car and motor, home, travel, general liability,
  life and critical illness, and other insurance products; and saving and investment,
  and pension and retirement planning products. It also provides property, casualty,
  energy and engineering lines, and marine; management liability, financial institutions,
  and professional indemnity; and cyber, accident and health, and credit lines and
  surety insurance products, as well as non-claims and ancillary services to the farmers
  exchanges. In addition, it offers employee benefit insurance products; and climate
  resilience, risk engineering, captive, cyber resilience, and reinsurance services.
  It serves individuals, small businesses, mid-sized and large companies, and multinational
  corporations. The company sells its products through agents, brokers, and bank distribution
  channels. Zurich Insurance Group AG was founded in 1872 and is based in Zurich,
  Switzerland.
