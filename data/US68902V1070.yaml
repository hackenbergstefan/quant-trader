longBusinessSummary: Otis Worldwide Corporation engages in manufacturing, installation,
  and servicing of elevators and escalators in the United States, China, and internationally.
  The company operates in two segments, New Equipment and Service. The New Equipment
  segment designs, manufactures, sells, and installs a range of passenger and freight
  elevators, as well as escalators and moving walkways for residential and commercial
  buildings, and infrastructure projects. This segment serves real-estate and building
  developers, and general contractors. It sells its products directly to customers,
  as well as through agents and distributors. The Service segment performs maintenance
  and repair services, as well as modernization services to upgrade elevators and
  escalators. Otis Worldwide Corporation was founded in 1853 and is headquartered
  in Farmington, Connecticut.
