longBusinessSummary: 'KLA Corporation, together with its subsidiaries, provides process
  control and process-enabling solutions for manufacturing wafers, reticles/masks,
  chemicals/materials, integrated circuits (ICs), packaged ICs, and printed circuit
  boards. It operates through three segments: Semiconductor Process Control; Specialty
  Semiconductor Process; and PCB and Component Inspection. The company offers inspection
  and review tools to identify, locate, characterize, review, and analyze defects
  on various surfaces of patterned and unpatterned wafers; chemical process control
  equipment; wired and wireless sensor wafers and reticles; wafer defect inspection,
  review, and metrology systems; reticle inspection and metrology systems; wafer inspection
  and metrology systems; semiconductor software solutions; KLA Pro systems; and specialty
  semiconductor manufacturing, benchtop metrology, surface characterization, material
  strength characterization, and electrical property measurement products. It also
  provides etch, plasma dicing, deposition and other wafer processing technologies
  and solutions; direct imaging, inspection, optical shaping, inkjet, and additive
  printing, as well as computer-aided manufacturing and engineering solutions; and
  components. In addition, the company offers service programs. It serves semiconductor,
  and semiconductor-related and electronic device manufacturers. The company operates
  in China, Taiwan, Korea, North America, Japan, Europe, Israel, and rest of Asia.
  The company was formerly known as KLA-Tencor Corporation and changed its name to
  KLA Corporation in July 2019. KLA Corporation was incorporated in 1975 and is headquartered
  in Milpitas, California.'
