longBusinessSummary: ArcelorMittal S.A., together with its subsidiaries, operates
  as integrated steel and mining companies in the Americas, Europe, Asia, and Africa.
  It offers semi-finished flat products, including slabs; finished flat products comprising
  plates, hot- and cold-rolled coils and sheets, hot-dipped and electro-galvanized
  coils and sheets, tinplate, and color coated coils and sheets; semi-finished long
  products, such as blooms and billets; finished long products consisting of bars,
  wire-rods, structural sections, rails, sheet piles, and wire-products; and seamless
  and welded pipes and tubes. The company also provides mining products, such as iron
  ore lumps, fines, concentrate, pellets, and sinter feeds; and coking coal. It sells
  its products to various customers in the automotive, appliance, engineering, construction,
  energy, and machinery industries through a centralized marketing organization, and
  distributors. The company operates iron ore mining activities in Brazil, Bosnia,
  Liberia, Mexico, South Africa, and Ukraine, as well as in India and in Canada. ArcelorMittal
  S.A. was founded in 1976 and is headquartered in Luxembourg, Luxembourg.
