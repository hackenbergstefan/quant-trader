longBusinessSummary: Raymond James Financial, Inc., a diversified financial services
  company, provides private client group, capital markets, asset management, banking,
  and other services to individuals, corporations, and municipalities in the United
  States, Canada, and Europe. The Private Client Group segment offers financial planning,
  investment advisory, securities transaction, investment services, portfolio management
  services, insurance and annuity products, and mutual funds; support to third-party
  mutual fund and annuity companies, including sales and marketing support, as well
  as distribution and accounting, and administrative services; margin loans; securities
  borrowing and lending services; and custodial, trade execution, research, and other
  support and services. The Capital Markets segment provides investment banking services,
  such as equity and debt underwriting, and merger and acquisition advisory; and fixed
  income and equity brokerage services. This segment also offers institutional sales,
  securities trading, equity research, and the syndication and management of investments
  in low-income housing funds and funds of a similar nature. The Asset Management
  segment provides asset management, portfolio management, and related administrative
  services to retail and institutional clients; and administrative support services,
  such as record-keeping. The Bank segment offers various types of loans, including
  securities-based, corporate, commercial and industrial, commercial real estate and
  construction, real estate investment trust, residential mortgage, and tax-exempt
  loans; Federal Deposit Insurance Corporation-insured deposit accounts; retail and
  corporate deposit; and liquidity management products and services. The Other segment
  engages in the private equity investments comprising investments in third-party
  funds. The company offers corporate, retail banking and trust services. Raymond
  James Financial, Inc. was founded in 1962 and is headquartered in Saint Petersburg,
  Florida.
