longBusinessSummary: 'Jack Henry & Associates, Inc. operates as a financial technology
  company that connects people and financial institutions through technology solutions
  and payment processing services in the United States. It operates through four segments:
  Core, Payments, Complementary, and Corporate Services. The Core segment provides
  core information processing platforms to banks and credit unions, which consists
  of integrated applications required to process deposit, loan, general ledger transactions,
  and maintain centralized accountholder information. The Payments segment offers
  secure payment processing tools and services, including ATM, money movement and
  embedded payment capabilities, remote deposit capture processing, and risk management
  products and services, as well as debit and credit card processing services, and
  online and mobile bill pay solutions. The Complementary segment provides software,
  and hosted processing platforms and services comprising digital/mobile banking,
  treasury, online account opening, fraud/anti-money laundering, and lending/deposit
  solutions. The Corporate Services segment offers hardware and other products. It
  offers specialized financial performance, imaging and payment, information security
  and risk management, retail delivery, and online and mobile solutions to financial
  services organizations and corporate entities. The company also provides SilverLake
  system, a system primarily designed for commercial-focused banks; CIF 20/20, a parameter-driven
  system for banks; and Core Director, a system with point-and-click operation for
  banks; and Symitar, a system designed for credit unions. It provides digital products
  and services under the Banno Digital Platform, and electronic payment solutions;
  hardware systems; implementation, training, and support and services; and data and
  transaction processing, and software licensing and related services, as well as
  professional services. The company was founded in 1976 and is headquartered in Monett,
  Missouri.'
