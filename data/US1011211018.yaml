longBusinessSummary: BXP, Inc. is the largest publicly traded developer, owner, and
  manager of premier workplaces in the United States. It is concentrated in six dynamic
  gateway markets - Boston, Los Angeles, New York, San Francisco, Seattle, and Washington,
  DC. BXP has delivered places that power progress for our clients and communities
  for more than 55 years. BXP is a fully integrated real estate company, organized
  as a real estate investment trust (REIT). As of June 30, 2026, including properties
  owned by joint ventures, BXP's portfolio totals 51.1 million square feet and 164
  properties, including six properties under construction/redevelopment. BXP's portfolio
  consists of 143 office properties, 13 retail properties, seven residential properties
  (including four residential properties under construction) and one hotel. BXP is
  well known for its in-house building management expertise and responsiveness to
  clients' needs. BXP holds a superior track record of developing premium Central
  Business District (CBD) office buildings, successful mixed-use complexes, suburban
  office centers and build-to-suit projects for a diverse array of creditworthy clients.
  BXP actively works to promote its growth and operations in a sustainable and responsible
  manner. BXP, Inc. was incorporated in 1970 in Delaware and is based in Massachusetts,
  Boston.
