longBusinessSummary: IG Group Holdings plc, a fintech company, engages in the online
  trading and investments business in the United Kingdom, Ireland, the Asia-Pacific,
  the Middle East, the United States, Europe, and institutional and emerging markets.
  The company offers retail over the counter derivatives, including contracts for
  difference, OTC FX and options; and exchange-traded derivatives options and futures
  under the tastytrade. It also provides stock trading and investment services, such
  as smart portfolios and ISA and SIPPs, as well as equities, exchange traded funds,
  and fixed income products, which include fractional shares, mutual funds, UK treasury
  bills, UK tax wrappers, securities lending, and proxy voting services; and cash
  crypto trading. In addition, the company offers content and education solutions,
  such as daily live programming, news and original content, and webinars and tutorials,
  as well as content, education, and support tools, including signals, analytics,
  charting applications, and proprietary insights through the Trade Live with IG and
  tastylive channels. Further, it engages in foreign exchange, and market risk management;
  spread betting; data distribution; software development and support services; turbo
  warrants issuing; financing; market maker; network and content provision; and brokerage
  activities. The company serves investors, customers, communities, colleagues, regulators,
  and suppliers. IG Group Holdings plc was founded in 1974 and is headquartered in
  London, the United Kingdom.
