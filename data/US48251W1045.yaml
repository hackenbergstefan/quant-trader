longBusinessSummary: KKR & Co. Inc. is a private equity and real estate investment
  firm specializing in direct and fund of fund investments. It specializes in acquisitions,
  leveraged buyouts, management buyouts, credit special situations, growth equity,
  mature, mezzanine, distressed, turnaround, lower middle market, and middle market
  investments. The firm considers investments in all industries with a focus on software,
  cybersecurity, fintech, data and information, security, semiconductors, consumer
  electronics, internet of things (iot), internet, information services, information
  technology infrastructure, financial technology, network and cyber security architecture,
  engineering and operations, content, technology and hardware, energy and infrastructure,
  real estate, services industry with a focus on business services, intelligence,
  industry-leading franchises and companies in natural resource, containers and packaging,
  agriculture, airports, ports, forestry, electric utilities, textiles, apparel and
  luxury goods, household durables, digital media, insurance, brokerage houses, non-durable
  goods distribution, supermarket retailing, grocery stores, food, beverage, and tobacco,
  hospitals, entertainment venues and production companies, publishing, printing services,
  capital goods, financial services, specialized finance, pipelines, and renewable
  energy. In energy and infrastructure, it focuses on the upstream oil and gas and
  equipment, minerals and royalties and services verticals. In real estate, the firm
  seeks to invest in private and public real estate securities including property-level
  equity, debt and special situations transactions and businesses with significant
  real estate holdings, and oil and natural gas properties. The firm also invests
  in asset services sector that encompasses a broad array of B2B, B2C and B2G services
  verticals including asset-based, transport, logistics, leisure/hospitality, resource
  and utility support, infra-like, mission-critical, and environmental services. Within
  Americas, the firm prefers to invest in consumer products; chemicals, metals and
  mining; energy and natural resources; financial services; healthcare; biopharmaceutical;
  medical device; health care services; life science tools/diagnostics; health care
  information technology sub-sectors; industrials; media and communications; retail;
  and technology. Within Europe, the firm invests in consumer and retail; energy;
  financial services; health care; industrials and chemicals; media and digital; and
  telecom and technologies. Within Asia, it invests in consumer products; energy and
  resources; financial services; healthcare; industrials; logistics; media and telecom;
  retail; real estate; and technology. It also seeks to make impact investments focused
  on identifying and investing behind businesses with positive social or environmental
  impact. The firm seeks to invest in mid to high-end residential developments but
  can invest in other projects throughout Mainland China through outright ownership,
  joint ventures, and merger. It invests globally with a focus on Australia, emerging
  and developed Asia, Middle East and Africa, Nordic, Southeast Asia, Asia Pacific,
  Ireland, Hong Kong, Japan, Taiwan, India, Vietnam, Malaysia, Singapore, Indonesia,
  France, Germany, Netherlands, United Kingdom, Caribbean, Mexico, South America,
  North America, Israel, Brazil, Latin America, Korea with a focus on South Korea,
  and United States of America. In the United States and Europe, the firm focuses
  on buyouts of large, publicly traded companies. For middle market private equity
  it seeks to invest in companies with enterprise values between $200 million and
  $1000 million and EBITDA between $50 million to $250 million. The firm prefers to
  invest in a range of debt and public equity investing and may co-invest. It seeks
  a board seat in its portfolio companies and a controlling ownership of a company
  or a strategic minority position. It prefers to invest in initial public offerings,
  follow-on offerings, PIPE transactions, co-investments or private capital raises.
  The firm may acquire majority and minority equity interests, particularly when making
  private equity investments in Asia or sponsoring investments as part of a large
  investor consortium. The firm typically holds its investment for a period of five
  to seven years and more and exits through initial public offerings, secondary offerings,
  and sales to strategic buyers. KKR & Co. Inc. was founded in May 1, 1976 and is
  based in New York, New York with additional offices across North America, Europe,
  Australia, Middle East and Asia Pacific.
