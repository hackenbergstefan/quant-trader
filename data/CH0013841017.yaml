longBusinessSummary: Lonza Group AG, together with its subsidiaries, operates as a
  contract development and manufacturing organization for pharma and biotech companies
  in Europe, North and Central America, Latin America, Asia, Australia, New Zealand,
  and internationally. It operates through Integrated Biologics; Advanced Synthesis;
  and Specialized Modalities segments. The Integrated Biologics segment offers CDMO
  biologics services from clinical development, drug substance, and drug product manufacturing;
  and operates mammalian and drug product platforms. Its Advanced Synthesis segment
  manufactures antibody-drug conjugates (ADCs) and other bioconjugates, small molecules,
  and highly potent active pharmaceutical ingredients; and operates small molecules
  and bioconjugates platforms. The Specialized Modalities segment operates various
  technologies, such as spanning cell & gene, microbial, bioscience, and mRNA. Lonza
  Group AG was incorporated in 1897 and is headquartered in Basel, Switzerland.
