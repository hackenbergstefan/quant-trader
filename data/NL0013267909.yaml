longBusinessSummary: Akzo Nobel N.V. produces and sells paints and coatings worldwide.
  It operates through Decorative Paints and Performance Coatings segments. The company
  offers decorative paints, including paints, enamels, varnishes, and surface preparation
  products; and a range of mixing machines, color concepts and advice, and training
  for applicators. It also provides performance coatings that produces engineered
  coatings designed to deliver functional properties, such as corrosion and fouling
  control, anti-scratch performance, and fire protection to protect and enhance ships,
  cars, aircraft, yachts, and architectural components, consumer goods, and oil and
  gas facilities. The company offers its products under the AkzoNobel, Alabastine,
  Alba, Andercol, Apla, Armstead Trade, Astral, Astral Batiment, AwlGrip, Brikol,
  Bruguer, Cetabever, Cetol, Chemcraft, Colourland Paints, CONSOLAN, Coral, Cromadex,
  Cuprinol, Dulux, Dynacoat, Flexa, Glitsa, Grip-Gard, Hammerite, Herbol, Inca, Innenweis,
  Interlux, International, Interpon, Lesonal, Levis, Luxol, Mactra, Marshall, Mauvilac,
  Maxilite, Modern Classikk, Molto, Nordsjo, Oxirite, Pintuco, Pinotex, Polycell,
  Polyfilla, Procolor, Protecto, Relest, Resicoat, Sadolin, Salcomix, Savana, Sea
  Hawk, Sikkens, Sparlack, Taubmans, Titanlux, Trimetal, U-Tech, Vivechrom, VPowdertech,
  Wanda, Xyladecor, and Xylazel brands. The company serves energy, packaging, infrastructure,
  and shipbuilding and maintenance industries, as well as general industries, such
  as agricultural and construction equipment, construction-related steel, metal fabrication,
  pipes, appliances, and transportation. The company was formerly known as Akzo NV
  and changed its name to Akzo Nobel N.V. in 1994. Akzo Nobel N.V. was founded in
  1646 and is headquartered in Amsterdam, the Netherlands.
