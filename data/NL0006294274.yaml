longBusinessSummary: Euronext N.V., together with its subsidiaries, operates securities
  and derivatives exchanges in the Netherlands, France, Italy, Belgium, Portugal,
  Ireland, the United States, Norway, Denmark, and internationally. The company offers
  a range of exchange and corporate services, including security listings, cash and
  derivatives trading, and market data dissemination. It also provides listing venues
  and cash equities trading venues; and various marketplaces comprising multilateral
  trading facilities for investors, broker-dealers, and other market participants
  to meet directly to buy and sell cash equities, fixed income securities, and exchange
  traded products. In addition, the company offers options contracts based on the
  blue-chip equities listed on Euronext; commodity derivatives, such as milling wheat
  futures contracts; and post-trade services, as well as distributes and sells real-time,
  historic, and reference data to data vendors, and financial institutions and individual
  investors. Further, it provides listing; cash, derivatives, fixed income, foreign
  exchange, and power trading; investor; advances data; clearing; custody and settlement;
  NTI; and other services. Additionally, it offers technology solutions and services
  to exchanges, venue operators, and financial institutions; colocation and network
  services; and software and services licensed by third parties. The company was formerly
  known as Euronext Group N.V. and changed its name to Euronext N.V. in May 2014.
  Euronext N.V. was founded in 2000 and is headquartered in Amsterdam, the Netherlands.
