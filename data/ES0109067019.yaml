longBusinessSummary: 'Amadeus IT Group, S.A., together with its subsidiaries, operates
  as a transaction processor for the travel and tourism industry in Europe, Central
  and South America, the Middle East, Africa, and Asia Pacific. It operates in three
  segments: Air Distribution, Air IT Solutions, and Hospitality & Other Solutions.
  The company acts as an international network providing real-time search, pricing,
  booking, ticketing, and other processing solutions through Amadeus GDS, Alt?a Passenger
  Service System, and New Skies platforms. It also offers travel providers a portfolio
  of technology solutions, which automate certain mission-critical business processes,
  such as reservations, inventory management, payments, and departure control. In
  addition, the company is involved in the installation of industrial machinery and
  equipment; provision of mobility, insurance and ferry, travel advertising, software
  development and definition, software distribution, distribution, regional support
  and management, data processing, intermediation, computer consulting, consultancy
  and technology development for digital invoicing and payments, and information technology
  services; and e-commerce business. It serves providers of travel products and services,
  such as network, domestic, low-cost, and charter carrier airlines; airports; independent
  property and big chain hotels; mainstream, specialist, and vertically integrated
  tour operators; insurance companies; land and sea transport companies, including
  car rental, railway, cruise line, and ferry line companies; travel sellers and brokers,
  such as offline and online travel agencies; and travel buyers. Amadeus IT Group
  S.A. has strategic collaborate with Accenture plc to develop Amadeus travel advertising
  platform. The company was formerly known as Amadeus IT Holding, S.A. and changed
  its name to Amadeus IT Group, S.A. in August 2016. Amadeus IT Group, S.A. was founded
  in 1987 and is headquartered in Madrid, Spain.'
