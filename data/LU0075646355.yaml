longBusinessSummary: Subsea 7 S.A. delivers offshore projects and services for the
  energy industry worldwide. The company offers subsea field development products
  and services, including project management, design and engineering, procurement,
  fabrication, survey, installation, and commissioning of production facilities on
  the seabed and the tie-back of its facilities to fixed or floating platforms or
  to the shore. It also provides remotely operated vehicles and tooling services to
  support exploration and production activities and to deliver full life-of-field
  services; procurement and installation of offshore wind turbine foundations and
  inter-array cables, as well as heavy lifting operations for renewables structures
  and heavy transportation services; and engineering and advisory services to clients
  in the oil and gas, renewables, and utilities industries. In addition, the company
  offers engineering, procurement, installation, and commissioning of subsea oil and
  gas systems in deep waters; fabrication, installation, extension, and refurbishment
  of fixed and floating platforms and associated pipelines in shallow water environments;
  inspection, and repair and maintenance services, management of subsea infrastructure,
  and remote intervention support; and carbon capture, utilization, and storage services.
  The company was incorporated in 1993 and is based in Luxembourg, Luxembourg.
