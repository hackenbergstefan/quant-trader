longBusinessSummary: Pirelli & C. S.p.A., through its subsidiaries, manufactures and
  sells tires for cars, motorcycles, and bicycles in Europe, North America, the Asia-Pacific,
  South America, Russia, India, the Middle East, and Africa. The company offers car
  tires under the P ZERO, Cinturato, Scorpion, Carrier, Winter Sottozero, and Ice
  brands; racing tires under the P Zero Trofeo R and P Zero Slick and Rain brands;
  rally tires under the P Zero, Scorpion, Scorpion Snow, and Sottozero Ice brands;
  collezione tires for classic and collector cars; and motorcycle tires under the
  Pirelli Diablo Superbike, Pirelli Diablo Supercorsa SP, Pirelli Diablo Rosso Corsa
  II, Pirelli Diablo Rosso Scooter, Pirelli Angel GT II, Pirelli Scorpion Trail II,
  Pirelli Scorpion Rally STR, Pirelli Scorpion MX, Metzeler Sportec M9 RR, Metzeler
  Sportec M7 RR, Metzeler Roadtec 01 SE, Metzeler Karoo Street, Metzeler Karoo 3,
  Metzeler Karoo Extreme, and Metzeler Cruisetec brands. It also provides bicycle
  tires under the P Zero Velo, P Zero Race TLR, Cinturato Velo, Cinturato Gravel,
  Scorpion MTB, Scorpion MTB XC, Scorpion Trail, Scorpion Enduro, Scorpion E-MTB,
  CYCL-E DT, CYCL-E GT, CYCL-E XT, and CYCL-E WT brands. In addition, the company
  offers Run Flat and Seal Inside technologies, which enable cars to continue driving
  after a puncture; Pirelli Noise Cancelling System (PNCS) for reducing noise generated
  by rolling; and Elect, a line of tires for electric vehicles. Further, it provides
  customer-oriented services, such as car valets and courtesy car services. The company
  sells its products through its stores. It serves vehicle manufacturers, retailers,
  specialized distributors, and car dealers. Pirelli & C. S.p.A. was incorporated
  in 1872 and is headquartered in Milan, Italy.
