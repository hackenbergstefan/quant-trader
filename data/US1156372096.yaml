longBusinessSummary: Brown-Forman Corporation, together with its subsidiaries, manufactures,
  distills, bottles, imports, exports, markets, and sells a variety of alcohol beverages.
  The company provides spirits, wines, whiskey spirits, whiskey-based flavored liqueurs,
  ready-to-drink cocktails, ready-to-pour products, vodkas, tequilas, gin, brandy,
  rum, bourbons, and liqueurs. The company offers its products primarily under the
  Jack Daniel's, Woodford Reserve, Old Forester, Gentleman Jack, Herradura, el Jimador,
  Fords Gin, The Glendronach, Chambord, Coopers' Craft, Diplomático, Benriach, Glenglassaugh,
  and Slane brands. It is also involved in the sale of used barrels, and bulk whiskey
  and wine; and provision of contract bottling services. The company serves retail
  customers and consumers through distributors and state governments; and retailers,
  wholesalers, and provincial governments directly. It operates in the United States,
  Germany, Australia, the United Kingdom, Canada, Spain, France, Mexico, Poland, Brazil,
  Türkiye, and internationally. Brown-Forman Corporation was founded in 1870 and is
  headquartered in Louisville, Kentucky.
