longBusinessSummary: Cintas Corporation provides corporate identity uniforms and other
  garments in the United States, Canada, and Latin America. It operates through Uniform
  Rental and Facility Services, First Aid and Safety Services, and All Other segments.
  The company offers rental and servicing of uniforms and other garments, including
  flame resistant clothing, mats, mops and shop towels, and other ancillary items.
  It also provides restroom cleaning services and supplies; and sells uniforms from
  catalogs. In addition, the company offers first aid and safety products and services;
  workplace water services; and fire protection products and services. Further, it
  provides automated external defibrillators; eye-wash stations; safety training;
  fire extinguishers; sprinkler systems; and alarm services. The company sells its
  products and services through its distribution network and local delivery routes,
  or local representatives to small service and manufacturing companies, as well as
  major corporations. It serves gaming, hospitality, healthcare, automotive, government,
  education, pharmaceutical, manufacturing, skilled trades, and food processing industries.
  The company was founded in 1929 and is based in Cincinnati, Ohio.
