longBusinessSummary: Tryg A/S, together with its subsidiaries, engages in the provision
  of insurance products and services to private, small and medium sized commercial,
  and corporate customers in Denmark, the United States, rest of Nordic, Luxembourg,
  the United Kingdom, and internationally. It operates through Private and Commercial
  segments. The company offers insurance products, such as motor, content, house,
  accident, travel, motorcycle, and pet and health, as well as property, liability,
  workers' compensation, and health under the Trygg-Hansa, Atlantica, Bilsport & MC,
  and Moderna Djurförsäkringar brands. It sells its products through its sales agents,
  online, call centers, franchises, bancassurance, car dealers, real estate agents,
  insurance brokers, and partners. The company was founded in 1731 and is headquartered
  in Ballerup, Denmark.
