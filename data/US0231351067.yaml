longBusinessSummary: 'Amazon.com, Inc. engages in the retail sale of consumer products,
  advertising, and subscriptions service through online and physical stores in North
  America and internationally. The company operates through three segments: North
  America, International, and Amazon Web Services (AWS). It also manufactures and
  sells electronic devices, including Kindle, fire tablets, fire TVs, echo, ring,
  blink, and eero; and develops and produces media content. In addition, the company
  offers programs that enable sellers to sell their products in its stores; and programs
  that allow authors, independent publishers, musicians, filmmakers, Twitch streamers,
  skill and app developers, and others to publish and sell content. Further, it provides
  compute, storage, Artificial intelligence, database, analytics, machine learning,
  and other services, as well as advertising services through programs, such as sponsored
  ads, display, and video advertising. Additionally, the company offers Amazon Prime,
  a membership program. The company''s products offered through its stores include
  merchandise and content purchased for resale and products offered by third-party
  sellers. It serves consumers, sellers, developers, enterprises, content creators,
  advertisers, and employees. The company was incorporated in 1994 and is headquartered
  in Seattle, Washington.'
