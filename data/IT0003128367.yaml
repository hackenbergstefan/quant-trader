longBusinessSummary: Enel SpA operates as an integrated operator in the electricity
  and gas industries worldwide. The company operates through the Thermal Generation
  and Trading, Enel Green Power, Enel Grids, and End-User Markets segments. It operates
  renewable, nuclear, wind, hydroelectric, thermal, solar, and geothermal power plants.
  The company also generates, distributes, transmits, and sells electricity. In addition,
  it provides solutions and technologies for the electrification of cities, such as
  smart cities and street lighting; for businesses, including energy efficiency and
  demand response; and for individuals, including energy efficiency solutions for
  houses and apartment buildings. Further, the company engages in the sale of energy
  commodities. The company was founded in 1962 and is headquartered in Rome, Italy.
