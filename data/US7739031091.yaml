longBusinessSummary: 'Rockwell Automation, Inc., together with its subsidiaries, provides
  industrial automation and digital transformation solutions in North America, Europe,
  the Middle East, Africa, the Asia Pacific, and Latin America. It operates in three
  segments: Intelligent Devices, Software & Control, and Lifecycle Services. The company
  offers drives, motion, advanced material handling, safety, sensing, industrial components,
  hardware, software, and configured-to-order products; and control and visualization
  software and hardware, digital twin, simulation and information software, network
  and security infrastructure, and custom-engineered systems. It also provides digital
  consulting, professional services, engineered-to-order solutions, recurring services,
  cybersecurity, safety, remote monitoring, customer technical support and repair,
  asset management and optimization consulting, and training, as well as spare parts.
  The company sells its products through independent distributors in relation to its
  direct sales force. It serves discrete end markets, including automotive, semiconductor,
  e-commerce, and warehouse automation; hybrid end markets, such as food and beverage,
  life sciences, and tire; and process end markets comprising energy, mining, and
  chemicals. The company was formerly known as Rockwell International Corporation
  and changed its name to Rockwell Automation, Inc. in February 2002. Rockwell Automation,
  Inc. was founded in 1903 and is headquartered in Milwaukee, Wisconsin.'
