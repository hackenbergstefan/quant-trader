longBusinessSummary: 'Monster Beverage Corporation, through its subsidiaries, engages
  in development, marketing, sale, and distribution of energy drink beverages and
  concentrates in the United States and internationally. The company operates through
  four segments: Monster Energy Drinks, Strategic Brands, Alcohol Brands, and Other.
  It offers carbonated non-carbonated energy drinks, ready-to-drink iced teas, lemonades,
  juice cocktails, single-serve juices and fruit beverages, ready-to-drink dairy and
  coffee drinks, energy drinks, sports drinks and single-serve still waters, and sodas
  that are considered natural, sparkling juices, and flavored sparkling beverages.
  In addition, the company provides its products under the Monster Energy, Monster
  Energy Ultra, Rehab Monster, Monster Energy Nitro, Java Monster, Punch Monster,
  Juice Monster, Monster Tour Water, Reign Total Body Fuel, Reign Storm, Bang Energy,
  NOS, Full Throttle, Burn, Mother, Nalu, Ultra Energy, Play and Power Play, Relentless,
  BPM, BU, Samurai, Live+, Predator, and Fury brands. Further, it offers craft beers,
  flavored malt beverages,and hard seltzers under the Jai Alai IPA, Florida Man IPA,
  Dale''s Pale Ale, Wild Basin Hard Seltzers, Dallas Blonde, Deep Ellum IPA, Perrin
  Brewing Company Black Ale, Hop Rising Double IPA, Wasatch Apricot Hefeweizen, The
  Beast, and Beast Tea, Blind Lemon, and Blinder Lemon brands. The company engages
  in the concentrates and/or beverage bases to authorized bottling, and canning operations.
  It sells its products to full-service beverage bottlers/distributors, retail grocery
  and specialty chains, wholesalers, club stores, mass merchandisers, convenience
  and gas chains, food service customers, value stores, e-commerce retailers, and
  the military. The company was formerly known as Hansen Natural Corporation and changed
  its name to Monster Beverage Corporation in January 2012. Monster Beverage Corporation
  was founded in 1985 and is headquartered in Corona, California.'
