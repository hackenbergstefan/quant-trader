longBusinessSummary: Danone S.A. operates in the food and beverage industry in Europe,
  Ukraine, North America, China, North Asia, the Oceania, Latin America, rest of Asia,
  Africa, Turkey, the Middle East, and the Commonwealth of Independent States. The
  company operates through Essential Dairy & Plant-Based, Specialized Nutrition, and
  Waters segments. It produces and distributes yogurts, dairy products, coffee creations
  and drinks, beverages, plant-based products, ice creams, frozen desserts, and cheese
  products. The company also provides specialized nutrition, including formulas and
  complementary feeding for babies and young children; and special medical purposes
  food for children and adults. In addition, it offers tube feeding products and oral
  nutritional supplements. Further, the company provides mineral waters from natural
  sources, waters infused with natural fruit extracts, fruit juices, and vitamins.
  The company offers its products under the Actimel, Activia, Alpro, Aptamil, Danette,
  Danio, Danonino, evian, Nutricia, Nutrilon, Volvic, Danone, Oikos, YoPRO, International
  Delight, SToK, Silk, So Delicious, Cow & Gate, Bebelac, SGM, Dumex, HiQ, Nursie,
  Phosphatine, Mizone, Blédina, Nutrison, Fortimel, Neocate, Nutridrink, AQUA, Bonafont,
  Salus, Hayat, Sirma, Font Vella, Lanjarón, and Zywiec Zdroj brands.It distributes
  its products through retail chains and traditional market outlets; convenience stores;
  hotels, restaurants, and coffee outlets; hospitals, clinics, and pharmacies; and
  e-commerce channels. The company was formerly known as Groupe Danone and changed
  its name to Danone S.A. in April 2009. Danone S.A. was incorporated in 1899 and
  is headquartered in Paris, France.
