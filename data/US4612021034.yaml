longBusinessSummary: 'Intuit Inc. provides financial management, payments and capital,
  compliance, and marketing products and services in the United States. The company
  operates in two segments: Global Business Solutions and Consumer. Its Global Business
  Solutions segment provides QuickBooks services, which include financial and business
  management online services, desktop software, payroll solutions, time tracking,
  merchant payment processing and bill pay solutions, checking accounts, and financing
  services for small and mid-market businesses; and Mailchimp, a marketing automation
  and customer relationship management. The Consumer segment provides TurboTax, a
  do-it-yourself and assisted income tax preparation products and services; Credit
  Karma, a personal finance solution that provides recommendations for credit card,
  home, auto, and personal loan, and insurance products; online savings and checking
  accounts; and access to its credit scores and reports, credit and identity monitoring,
  credit report dispute, credit building tools, debt pay-down assistance, credit card
  rewards optimization, and connected account capabilities. This segment also offers
  ProTax offerings which include Lacerte, ProSeries, and ProFile desktop tax-preparation
  software products; and ProConnect Tax Online, electronic tax filing service, and
  bank products and related services. It sells products and services through direct
  sales channels, multichannel shop-and-buy experiences, online application stores,
  and partner and other channels. Intuit Inc. has a strategic collaboration with Aprio,
  LLP to develop AI-powered solutions designed to help identify tax planning opportunities,
  benchmark business performance, improve financial visibility, and support more informed
  decision-making across industries, including construction, dental, wealth management,
  and tax. Intuit Inc. was founded in 1983 and is headquartered in Mountain View,
  California.'
