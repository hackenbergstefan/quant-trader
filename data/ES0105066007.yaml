longBusinessSummary: 'Cellnex Telecom, S.A. engages in the management of terrestrial
  telecommunications infrastructures in France, Italy, the United Kingdom, Spain,
  Poland, the Netherlands, Portugal, Switzerland, Denmark, Sweden, Ireland, and Austria.
  It operates through four segments: Towers; DAS, Small Cells, and RAN as a Service;
  Fiber, Connectivity, and Housing Services; and Broadcast. The Towers segment provides
  integrated network passive infrastructure services; other wireless telecommunications;
  and broadband network operators services, as well as colocation and engineering
  services. The DAS, Small Cells, and RAN as a Service segment offers services, such
  as RAN as a Service, which entails the emission and transmission active services;
  PPDR services comprising active infrastructure management for public administrations,
  including TETRA and 4G/LTE mission critical service networks; operation and maintenance;
  infrastructure support services; and other services that include smart cities/Internet
  of Things. The Fiber, Connectivity, and Housing Services segment provides data transport
  through fiber, including fibre-to-the-tower (FTTT), connectivity, backhaul transmission,
  and hosting services in edge data centers infrastructure. The broadcast segment
  engages in the distribution and transmission of television and radio signals; operation
  and maintenance of broadcasting networks; provision of connectivity for media content
  and over-the-top (OTT) broadcasting services; and other services, as well as offers
  coverage of the digital terrestrial television (DTT) services. The company also
  offers fixed and mobile telecommunication services; and provision of telecommunications
  equipment. In addition, it constructs and operates optic fiber telecommunications.
  The company was formerly known as Abertis Telecom Terrestre, S.A.U. and changed
  its name to Cellnex Telecom, S.A. in April 2015. Cellnex Telecom, S.A. was incorporated
  in 2008 and is headquartered in Madrid, Spain.'
