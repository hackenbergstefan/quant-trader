longBusinessSummary: Legrand SA, together with its subsidiaries, manufactures, distributes,
  and sells electrical and digital building infrastructures in Europe, North and Central
  America, and internationally. The company offers energy distribution, protection,
  and management solutions, such as electric vehicle charging, residential and small
  commercial panels, switchboards and power cabinets, and UPS devices; and wiring
  devices, connected home and building control solutions, and guestroom solutions,
  as well as flush-mounted, junction, DCL, and floor boxes. It also provides security,
  communication, and network solutions, including access security, digital home networks,
  emergency lighting, fire alarms, IT networks, intercom and door entry, and nurse
  call systems; conduits and cable management solutions comprising trunking, mini-trunking,
  skirting trunking, ducts, tubes, floor boxes, columns and feeders, and workstation
  solutions; industrial products, which comprises industrial enclosures and connections,
  transformers and power supply, marking accessories and cable ties, motor control
  and protection, fuse protection, and industrial plugs and sockets, as well as control,
  button, and signaling products; and installation accessories, including wiring accessories,
  extension cords, multi-outlet units, cable ties and fasteners, and connection boxes
  and terminals; and lighting products and accessories, as well as bulkhead lights
  and wall lights. In addition, the company offers single-phase UPS, three-phase UPS,
  communication accessories, software, and battery cabinets for three-phase UPS, as
  well as data center solutions. Further, it provides digital products and connected
  care services for health and social care sectors. The company also exports its products
  to approximately 180 countries. Legrand SA was founded in 1865 and is headquartered
  in Limoges, France.
