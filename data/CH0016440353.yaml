longBusinessSummary: EMS-CHEMIE HOLDING AG engages in the polymers and specialty chemicals
  businesses in the Americas, Europe, Asia, and internationally. The company manufactures
  and sells polymers, such as polyamide granulates used in automotive and construction
  applications in the electro and electronics, optics, and other industrial sectors,
  as well as offers feasibility studies, design, prototypes, component testing, and
  mould optimization services. It also offers bonding, coating, sealing, and damping
  services for the automotive industry; and develops and produces fibers, bonding
  agents, fusible adhesives, and adhesive yarns for technical and textile applications,
  powder coatings, and reactive diluents. The company was founded in 1936 and is based
  in Domat/Ems, Switzerland.
