longBusinessSummary: Veeva Systems Inc. provides cloud-based software for the life
  sciences industry in North America, Europe, the Asia Pacific, the Middle East, Africa,
  and Latin America. The company offers Veeva Commercial Cloud comprising Veeva Vault
  CRM Suite for pharmaceutical and biotechnology companies; Veeva Medical that provides
  source of medical content across multiple channels and geographies; Veeva PromoMats,
  an end-to-end content and digital asset management solution; and Veeva Crossix,
  an analytics platform for pharmaceutical brands. It also provides Veeva Data Cloud,
  such as Veeva OpenData, a customer reference data solution; Veeva Link, which provides
  deep data; Veeva Compass, which includes de-identified and longitudinal patient
  data; and Veeva CRM Pulse that provides access and multichannel engagement metrics.
  In addition, the company offers Veeva Development Cloud consisting of Veeva Clinical
  Platform, which advances clinical trial execution; Veeva Clinical Data Management
  that helps sponsors and CROs design and run trials; Veeva Safety, which unifies
  systems and processes; Veeva RIM that provides regulatory information management
  capabilities, as well as Veeva Quality Cloud, which is used by the life sciences
  and consumer products industries; and Veeva Business Consulting services. Further,
  it provides professional and support services, including implementation and deployment
  planning, and project management; requirements analysis, solution design, and configuration;
  systems environment management and deployment; services focused on advancing or
  transforming business and operating processes; technical consulting services on
  data migration and systems integrations; training; and ongoing managed services,
  such as outsourced systems administration. The company was formerly known as Verticals
  onDemand, Inc. and changed its name to Veeva Systems Inc. in April 2009. Veeva Systems
  Inc. was incorporated in 2007 and is headquartered in Pleasanton, California.
