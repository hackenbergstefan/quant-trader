  management services, including central purchasing, information services, finance
  and control systems, facilities planning, physician recruitment, administrative
  personnel management, marketing, and public relations services. Universal Health
  Services, Inc. was founded in 1978 and is headquartered in King of Prussia, Pennsylvania.
