longBusinessSummary: Holcim AG, together with its subsidiaries, provides building
  materials and solutions in Europe, Latin America, and Asia, Middle East, and Africa.
  It provides foundation, flooring, walling and roofing products, including cement,
  clinker, and other cementitious materials; ready-mix concrete; aggregates, such
  as crushed stone, gravel, and sand; and precast, concrete products, asphalts, mortars,
  roofing systems, insulation systems, tile adhesives, facade solutions, and contracting
  and services. The company also provides digital services through HOLCIM+ platform
  and digital concrete services. Its products are used in infrastructure projects,
  such as tunnels, railways and train stations, airports and ports, and bridges; housing
  projects, including individual and collective housing; commercial projects comprising
  offices, retail, and public buildings; and industrial projects consisting of renewable
  energy, oil and gas, and mining. The company sells its products under the ECOPact,
  ECOPlanet, ECOCycle, Ytong, Aggneo, Hydromedia, ZinCo Holcim, Elevate, Airium, PRB
  Group, Cantillana, Flachdach Technologie, Izolbet, Disensa, Tector, DYNAMax, Agilia,
  Ductal, Artevia, Humes, Tensolite, Compaktuna, and other service brands. The company
  was formerly known as LafargeHolcim Ltd and changed its name to Holcim AG in May
  2021. Holcim AG was founded in 1833 and is headquartered in Zug, Switzerland.
