longBusinessSummary: O'Reilly Automotive, Inc., together with its subsidiaries, operates
  as a retailer and supplier of automotive aftermarket parts, tools, supplies, equipment,
  and accessories in the United States, Puerto Rico, Mexico, and Canada. The company
  offers new and remanufactured automotive hard parts and maintenance items, such
  as alternators, batteries, brake system components, belts, chassis parts, driveline
  parts, engine parts, fuel pumps, hoses, starters, temperature control, water pumps,
  antifreeze, appearance products, engine additives, filters, fluids, lighting products,
  and oil and wiper blades; and accessories, including floor mats, seat covers, and
  truck accessories. It also provides auto body paint and related materials, automotive
  tools, and professional service provider service equipment. In addition, the company
  offers enhanced services and programs consisting of used oil, oil filter, and battery
  recycling; battery, wiper, and bulb replacement; battery diagnostic testing; electrical
  and module testing; check engine light code extraction; loaner tool program; referrals
  to trusted local repair shops; drum and rotor resurfacing; custom hydraulic hoses;
  and professional paint shop mixing and related materials. It offers its products
  to do-it-yourself and professional service providers for domestic and imported automobiles,
  vans, and trucks. It offers its products under the BesTest, BrakeBest, Cartek, Import
  Direct, MasterPro, MicroGard, Murray, Omnispark, O'Reilly Auto Parts, Precision,
  PowerTorque, SuperStart, Syntec, and Ultima brand names. O'Reilly Automotive, Inc.
  was founded in 1957 and is headquartered in Springfield, Missouri.
