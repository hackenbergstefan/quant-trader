longBusinessSummary: EQT AB (publ) is a global private equity & venture capital firm
  specializing in private capital and real asset segments. The firm seeks to invest
  in seed, startup, turnaround, middle market, mature, early venture, emerging growth,
  mid venture, late venture, distressed/vulture, loan, secondary (direct) investments.
  The firm seeks to invest through growth, buyout and recapitalization in companies.
  It also invests in green fund & fintech investments. The firm prefers to invest
  in financial services, engineering services, healthcare, IT services & software,
  business services, consumer, advanced manufacturing sectors, education, consumer
  goods, energy, oil and gas, commercial printing, diversified support services, environmental
  and facilities services, office services and supplies, automobile manufacturers,
  motorcycle manufacturers, consumer electronics, home furnishings, homebuilding,
  household appliances, housewares and specialties, leisure products, textiles, apparel
  and luxury goods, medical equipment, medical instruments, communications equipment,
  communication services, and security and alarm services, industrials and TMT sectors.
  It owns portfolio companies and assets in Europe, Asia-Pacific and the North America
  with focus in Turkey, Australia, Hong Kong, Japan, New Zealand, Georgia, Singapore,
  China, Macau, Taiwan, India, Austria, Belgium, Wallonia, Luxembourg, Guernsey, Jersey,
  Denmark, Finland, Germany, Iceland, Ireland, Liechtenstein, Luxembourg, Netherlands,
  Norway, Spain, Sweden, Switzerland, United Kingdom, Belarus, Bulgaria, Czech Republic,
  Estonia, Hungary, Latvia, Lithuania, Poland, Romania, Russia, Slovakia, Slovenia,
  South-East Asia and North America region. The firm typically invests between 2 million
  euro ($2.06 million) and 1600 million euro ($1879 million) in companies with enterprise
  value at between 27.79 million euro ($30 million) and $250 million. The firm prefers
  to take minority or majority stakes in its portfolio companies. EQT AB (publ) was
  founded in 1994 and is based in Stockholm, Sweden with additional offices across
  Europe, North America, and Asia.
