longBusinessSummary: Eni S.p.A. operates as an integrated energy company in Italy,
  Other European Union, Rest of Europe, the United States, Asia, Africa, and internationally.
  The company engages in exploration, development, extracting, manufacturing, trading,
  and marketing crude oil and natural gas, oil-based fuels, chemical products, and
  gas-fired power, as well as energy products from renewable sources. The company
  operates through Exploration & Production; Global Gas & LNG Portfolio and Power;
  Refining and Chemicals; Enilive; Plenitude; and Corporate and Other Activities segments.
  The company engages in research, development, and production of oil, condensates,
  and natural gas. It is also involved in the supply and sale of wholesale natural
  gas through pipelines; electricity; and international transport, and purchase and
  marketing of liquefied natural gas. In addition, the company supplies bio-feedstock
  and crude oil; and stores, produces, distributes, and markets biofuels, oil products,
  biomethane, basic chemical and petrochemical products, intermediates, plastics and
  elastomers, and other chemicals, as well as provides smart mobility solutions and
  services. Further, the company engages in the retail marketing of gas, power, and
  related services; production and wholesale sale of electricity from renewable plants;
  and building and managing a network of charging points for electric vehicles. Eni
  S.p.A. was founded in 1953 and is headquartered in Rome, Italy.
