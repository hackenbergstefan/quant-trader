longBusinessSummary: The Southern Company, through its subsidiaries, engages in the
  sale of electricity. The company offers electric service to retail customers and
  wholesale customers; and energy-related products and services to natural gas choice
  markets. It also develops, constructs, acquires, owns, operates, and manages power
  generation assets, as well as battery energy storage projects; sells electricity
  at market-based rates in the wholesale market; and deploys microgrids for commercial,
  industrial, governmental, and utility customers. In addition, the company is involved
  in the distribution of natural gas in Illinois, Georgia, Virginia, and Tennessee;
  distributes energy and resilience solutions; and invests in telecommunications.
  The Southern Company was incorporated in 1945 and is headquartered in Atlanta, Georgia.
