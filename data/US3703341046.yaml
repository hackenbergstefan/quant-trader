longBusinessSummary: 'General Mills, Inc. manufactures and markets branded consumer
  food in the United States and internationally. The company operates through four
  segments: North America Retail; International; North America Pet; and North America
  Foodservice. It offers snacks, including grain, fruit and savory snacks, nutrition
  bars, and frozen hot snacks; ready-to-eat cereal; convenient meals comprising meal
  kits, ethnic meals, pizza, soup, side dish mixes, frozen breakfast, and frozen entrees;
  wholesome natural pet food; refrigerated and frozen dough; baking mixes and ingredients;
  and ice cream products. The company also offers dog and cat food, such as dry food,
  wet food, fresh food, and treats. In addition, it operates 232 and franchises 376
  ice cream parlors. The company markets its products under the Annie''s, Betty Crocker,
  Bisquick, Blue Buffalo, Bugles, Cascadian Farm, Cheerios, Chex, Cinnamon Toast Crunch,
  Cocoa Puffs, Cookie Crisp, Dunkaroos, Edgard & Cooper, Fiber One, Fruit by the Foot,
  Fruit Gushers, Fruit Roll-Ups, Gardetto''s, Gold Medal, Golden Grahams, Häagen-Dazs,
  Kitano, Kix, Lärabar, Latina, Lucky Charms, Nature Valley, Nudges, Oatmeal Crisp,
  Old El Paso, Pillsbury, Progresso, Tastefuls, Tiki Pets, Total, Totino''s, Trix,
  True Solutions, Wanchai Ferry, Wheaties, Wilderness, and Yoki brands. It sells its
  products to grocery stores, mass merchandisers, membership stores, natural food
  chains, drug, dollar and discount chains, e-commerce retailers, commercial and noncommercial
  foodservice distributors and operators, restaurants, convenience stores, and pet
  specialty stores. The company was founded in 1866 and is headquartered in Minneapolis,
  Minnesota.'
