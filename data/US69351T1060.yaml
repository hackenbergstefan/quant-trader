longBusinessSummary: 'PPL Corporation provides electricity and natural gas to approximately
  3.6 million customers in the United States. It operates in three segments: Kentucky
  Regulated, Pennsylvania Regulated, and Rhode Island Regulated. The company engages
  in the transmission and distribution of electricity in eastern and central Pennsylvania;
  generation, transmission, distribution, and sale of electricity in Kentucky, Virginia,
  and Rhode Island; distribution and sale of natural gas in Kentucky and Rhode Island;
  sale of wholesale electricity in Kentucky; and generation of electricity from power
  plants in Kentucky. It generates electricity from coal, gas, hydro, and solar sources.
  The company was formerly known as PP&L Resources, Inc. and changed its name to PPL
  Corporation in 2000. PPL Corporation was founded in 1920 and is headquartered in
  Allentown, Pennsylvania.'
