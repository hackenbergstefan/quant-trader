longBusinessSummary: Bolloré SE engages in the transportation and logistics, communications,
  and industry businesses in France, rest of Europe, the Americas, the Asia-Pacific,
  and Africa. The company operates through Bolloré Energy, Communications, and Industry
  segments. It is involved in distribution and warehousing of oil products, as well
  as domestic fuel oil and transport and other diesel. The company also engages in
  the publishing and distribution of pay and free TV and production; sale and distribution
  of cinema films and TV series; design and release of downloadable video games on
  mobile devices and consoles; ticketing and venue services; communications consulting
  and advertising agencies; magazine sales; sales of goods and circulation of publications;
  travel retail sales; and sales of licenses and subscription services. In addition,
  it is involved in production and sale of electric batteries and their applications;
  and electric vehicles, and electricity storage and solutions and films. The company
  was founded in 1822 and is based in Puteaux, France. Bolloré SE operates as a subsidiary
  of Compagnie de l'Odet.
