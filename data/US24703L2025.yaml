longBusinessSummary: Dell Technologies Inc. designs, develops, manufactures, markets,
  sells, and supports various comprehensive and integrated solutions, products, and
  services in the Americas, Europe, the Middle East, Asia, and internationally. The
  company operates through Infrastructure Solutions Group (ISG) and Client Solutions
  Group (CSG) segments. The ISG segment provides modern and traditional storage solutions,
  including all-flash, purpose-built, hyper-converged infrastructure, software-defined
  storage, and general-purpose and AI-optimized servers. This segment also offers
  networking products and services comprising wide area network infrastructure, data
  center and edge networking switches, and cables and optics that help its business
  customers to transform and modernize their infrastructure and complementing its
  server and storage solutions; and software, peripherals, and services, including
  consulting and support, and deployment. The CSG segment provides notebooks, desktops,
  and workstations and branded peripherals that include displays, docking stations,
  keyboards, mice, webcam and audio devices, and third-party software and peripherals;
  and configuration, and extended warranties services. The company is involved in
  originating, collecting, and servicing customer financing arrangements and offers
  payment and consumption solutions and services, such utility, subscription, as-a-service,
  leases, and loans, as well as fixed-term leases and loans. It serves enterprises,
  governmental agencies and other public institutions, educational institutions, healthcare
  organizations, small and medium-sized businesses, and consumers. The company has
  a strategic alliance with Rafay Systems for the development of AI infrastructure
  solutions. The company was formerly known as Denali Holding Inc. and changed its
  name to Dell Technologies Inc. in March 2013. Dell Technologies Inc. was founded
  in 1984 and is headquartered in Round Rock, Texas.
