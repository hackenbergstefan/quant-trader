longBusinessSummary: Waste Management, Inc., through its subsidiaries, provides environmental
  solutions to residential, commercial, industrial, and municipal customers in the
  United States, Canada, Western Europe, and internationally. It offers collection
  services, including picking up and transporting waste and recyclable materials from
  where it was generated to a transfer station, recovery facility, or disposal site;
  owns and operates transfer stations; and owns, develops, and operates landfill gas-to-energy
  facilities that produce renewable electricity and renewable natural gas. It also
  operates materials processing and commodities recycling services, including cardboard,
  paper, glass, metals, plastics, construction and demolition materials, and other
  recycling commodities are recovered for resale or redirected for other purposes;
  markets and resells recycling commodities; recycling brokerage services, such as
  managing the marketing of recyclable materials for third parties; and other strategic
  business solutions. In addition, the company collects recyclable food and yard waste,
  as well as markets and sells mulch, compost, soil amendments, and renewable energy;
  offers remediation and construction, and industrial waste services; and manages
  and markets fly ash. Further, it provides Regulated Waste and Compliance Services
  (RWCS), which offers compliance programs, as well as collection, processing, and
  disposal of regulated and specialized waste, including medical, pharmaceutical,
  and hazardous waste; and Secure Information Destruction (SID) services that include
  the collection of personal and confidential information for secure destruction and
  recycling of sorted office paper. The company was formerly known as USA Waste Services,
  Inc. and changed its name to Waste Management, Inc. in 1998. Waste Management, Inc.
  was founded in 1968 and is based in Houston, Texas.
