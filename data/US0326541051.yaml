longBusinessSummary: Analog Devices, Inc. engages in the design, manufacture, testing,
  and marketing of integrated circuits (ICs), software, and subsystems products in
  the United States, rest of North and South America, Europe, Japan, China, and rest
  of Asia. It provides data converter products, which translate real-world analog
  signals into digital data, as well as translates digital data into analog signals;
  power management and reference products for power conversion, driver monitoring,
  sequencing, and energy management applications in the automotive, communications,
  industrial, and consumer markets; and power ICs that include performance, integration,
  and software design simulation tools for accurate power supply designs. The company
  also offers amplifiers to condition analog signals; and radio frequency and microwave
  ICs to support cellular infrastructure; and micro-electro-mechanical systems technology
  solutions, including accelerometers used to sense acceleration, gyroscopes for sense
  rotation, inertial measurement units to sense multiple degrees of freedom, and broadband
  switches for radio and instrument systems, as well as isolators. In addition, it
  provides digital signal processing and system products for numeric calculations.
  The company serves clients in the industrial, automotive, consumer, instrumentation,
  aerospace, defense and healthcare, and communications markets through a direct sales
  force, third-party distributors, and independent sales representatives, as well
  as online. The company was incorporated in 1965 and is headquartered in Wilmington,
  Massachusetts.
