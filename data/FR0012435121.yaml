longBusinessSummary: Elis SA provides flat linen, workwear, and hygiene and well-being
  solutions in France, Central Europe, Scandinavia, Eastern Europe, the United Kingdom,
  Ireland, Latin America, Southern Europe, and internationally. It offers accommodation,
  catering, and healthcare and social linens; workwear and personal protective equipment;
  beverage solutions, such as bottled water cooler, coffee bean machine, networked
  water cooler, and pod coffee machine; floor protection mats and mops; industrial
  wipers; and pest and rodent control, insect control, or disinfection services. The
  company provides washroom hygiene services, such as hand washing and drying, toilet
  hygiene and urinals, lavatories, and air fragrancing; and reusable cleanroom garments,
  footwear, goggles, and equipment solutions, as well as cleaning systems. In addition,
  it offers various solutions for collection and disposal of infectious waste. The
  company serves the catering, accommodation, healthcare and social welfare, industries,
  trade and retail, and services sectors, as well as public authorities and administration.
  The company was founded in 1883 and is headquartered in Saint-Cloud, France.
