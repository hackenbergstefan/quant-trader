longBusinessSummary: Southwest Airlines Co. operates as a passenger airline company
  that provides scheduled air transportation services in the United States and internationally.
  It also provides Rapid Rewards loyalty program; SWABIZ, an online booking tool;
  and inflight entertainment platform that includes movies-on-demand live and on-demand
  television, flight tracker, and additional curated content, as well as a variety
  of premium snacks and coffee. In addition, the company offers ancillary services,
  such as in-flight purchases, baggage fees, EarlyBird Check-In, and upgraded boarding,
  as well as transportation of pets and unaccompanied minors. As of December 31, 2025,
  the company operated a total fleet of 803 Boeing 737 aircraft; and served 117 destinations
  in 42 states, the District of Columbia, and the Commonwealth of Puerto Rico, as
  well as ten near-international countries, including Mexico, Jamaica, the Bahamas,
  Aruba, the Dominican Republic, Costa Rica, Belize, Cuba, the Cayman Islands, and
  Turks and Caicos. Southwest Airlines Co. was incorporated in 1967 and is headquartered
  in Dallas, Texas.
