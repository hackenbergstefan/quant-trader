longBusinessSummary: BT Group plc provides communications products and services in
  the United Kingdom, Europe, the Middle East, Africa, the Americas, and the Asia
  Pacific. The company operates through Consumer, Business, International, and Openreach
  segments. It builds, owns, and operates fixed and mobile networks; and designs,
  builds, markets, sells, and supports network access, connectivity, and related products.
  The company also offers mobile, broadband, and landline, as well as entertainment
  services to individuals and households; connectivity, networking, cybersecurity,
  collaboration tools, cloud connectivity, and cloud services to private and public
  sector businesses; and managed solutions for larger businesses and public sector
  customers. In addition, it provides fixed and IP voice; unified communications;
  mobile; fixed and networking; managed services; and security, and cloud and IoT
  solutions. Further, the company develops, manages, and leases network infrastructure,
  including mobile cell and switch sites; and offers handsets, network equipment,
  consumer electronics, gaming and insurance. It provides its products and services
  under the BT, EE, Plusnet, and Openreach brands. The company was formerly known
  as Newgate Telecommunications Limited and changed its name to BT Group plc in September
  2001. BT Group plc was founded in 1846 and is headquartered in London, the United
  Kingdom.
