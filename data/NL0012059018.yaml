longBusinessSummary: Exor N.V. engages in the automotive, agriculture and construction,
  sports car, commercial vehicle, health technology, football and powertrain businesses
  in the Netherlands and internationally. The company designs, engineers, produces,
  and sells luxury performance sports cars under the Ferrari brand. It also provides
  automotive vehicles and mobility solutions under the Abarth, Alfa Romeo, Chrysler,
  Citroen, Dodge, DS, Fiat, Fiat Professional, Jeep, Lancia, Maserati, Mopar, Opel,
  Peugeot, Ram, and Vauxhall brands; diagnostic imaging, ultrasound, image-guided
  therapy, monitoring and enterprise informatic, and personal health equipment under
  Philips brand; agricultural and construction equipment and services; heavy, medium,
  and light-duty trucks; powertrain technologies; mass-transit and premium buses and
  coaches; defense and civil protection equipment; heavy-duty quarry and construction
  vehicles; and firefighting vehicles and equipment, as well as financing services.
  In addition, the company offers men's footwear, leather goods, beauty, and accessories;
  equipment for the building and repairing of oil and gas wells; clean energy solutions;
  data, insights and analytics, expert, and workflow solutions; information through
  newspapers and magazines to conferences and electronic services and publishes The
  Economist; and apparel, furniture, homeware, and jewelry products. Further, it engages
  in the management of professional football teams under the Juventus Football Club
  name; and hospitals and outpatient clinics, as well as operates as investment management
  company and technology company specializing in the data-driven optimization of public
  mobility systems. Exor N.V. was founded in 1899 and is headquartered in Amsterdam,
  the Netherlands. Exor N.V. is a subsidiary of Giovanni Agnelli B.V.
