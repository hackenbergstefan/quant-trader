longBusinessSummary: Umicore SA operates as a materials technology and recycling company
  in Belgium, Europe, the Asia-Pacific, North America, South America, and Africa.
  It operates through Battery Material, Catalysis, Recycling, and Specialty Materials
  segments. The Battery Material segment develops, manufactures, and markets cathode
  materials and its precursors for lithium-ion batteries, as well as related refining
  activities of cobalt and nickel chemical refining activities; and offers integrated,
  circular and sustainable battery materials. Its Catalysis segment provides automotive
  catalysts for light-duty gasoline and diesel light, and heavy-duty diesel applications,
  including on-road and off-road vehicles; stationary catalysts for industrial emissions
  control; and produces precious metals-based compounds and catalysts for use in the
  pharmaceutical and fine chemicals industries, as well as fuel cell applications.
  The Recyling segment is involved in precious metals refining and management, jewelry
  and industrial metals; and treating complex waste streams containing precious and
  other specialty metals. This segment also produces precious metals-based materials
  for high-tech glass production and electronics; and offers products for chemical,
  electric, electronic, automotive and special glass applications. Its Specialty Materials
  segments offers cobalt and specialty materials, electro-optic materials, and metal
  deposition solutions; produces and distributes cobalt and nickel products; and supplies
  products for precious and non-precious metal-based electroplating and PVD coating,
  as well as germanium-based material solutions for the space, optics and electronics
  sectors. The company was formerly known as Union Minière du Haut Katanga and changed
  its name to Umicore SA in 2001. Umicore SA was founded in 1805 and is headquartered
  in Brussels, Belgium.
