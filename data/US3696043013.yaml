longBusinessSummary: General Electric Company, doing business as GE Aerospace, designs
  and produces commercial and defense aircraft engines, integrated engine components,
  electric power, and aircraft systems. The company operates through two segments,
  Commercial Engines & Services, and Defense & Propulsion Technologies. The Commercial
  Engines & Services segment designs, develops, manufactures, maintenance, repair,
  and overhaul (MRO) services of jet engines and sale of spare parts for commercial
  airframes, business aviation, and aeroderivative applications. The Defense & Propulsion
  Technologies designs, develops, manufactures, and services jet engines and avionics
  and power systems for governments, militaries, and commercial airframers, as well
  as MRO of engines and the sale of spare parts. This segment also offers aircraft
  components and systems, such as small turboprop engines, aeroengine mechanical transmissions,
  turbines, combustors and controls, additive manufacturing, propeller systems, ignition
  systems, sensors and engine accessories for fixed wing and rotorcraft applications
  for commercial and military end users under the Avio Aero, Unison, Dowty Propellers,
  and Colibrium Additive brands. The company operates in the United States, Europe,
  Asia, the Americas, the Middle East, and Africa. General Electric Company was incorporated
  in 1892 and is based in Evendale, Ohio.
