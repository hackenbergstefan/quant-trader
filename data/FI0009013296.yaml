longBusinessSummary: Neste Oyj, together with its subsidiaries, provides renewable
  diesel and sustainable aviation fuel in Finland, other Nordic countries, Baltic
  Rim, other European countries, the United States, and internationally. The company
  operates through Renewable Products, Oil Products, Marketing & Services segments.
  It produces, markets, and sells renewable diesel, sustainable aviation fuel, and
  related solutions. The company also provides various oil products, including diesel,
  gasoline, aviation and marine fuels, light and heavy fuel oils, gasoline components,
  and special fuels, such as small-engine gasoline, solvents, and liquid gases for
  retailers and distributors, oil majors and trading companies, and companies marketing
  lubricants and solvents. In addition, the company markets and sells lower emission
  fuels, oil products, and associated digital solutions to consumers, transport service
  providers, aviation, shipping, industrial and agricultural, and municipalities and
  heating fuel customers and fuel distributors; and markets transport fuels and electric
  vehicle charging services. The company was formerly known as Neste Oil Oyj and changed
  its name to Neste Oyj in June 2015. Neste Oyj was founded in 1948 and is headquartered
  in Espoo, Finland.
