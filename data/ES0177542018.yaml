longBusinessSummary: International Consolidated Airlines Group S.A., together with
  its subsidiaries, engages in the provision of passenger and cargo transportation
  services in the North Atlantic, Latin America, the Caribbean, Europe, Africa, the
  Middle East, South Asia, the Asia Pacific, and internationally. It operates through
  British Airways, Iberia, Vueling, Aer Lingus, and IAG Loyalty segments. The company
  manufactures, repairs, maintains, overhauls, retrofits, repurposes, upgrades aircraft,
  and aircraft parts and equipment. In addition, it provides airline operations, insurance,
  aircraft leasing, aircraft maintenance, tour operation, air freight operations,
  call center, ground handling, trustee, retail, IT, finance, flight procurement,
  storage, aircraft technical assistance, human resources support, and airport infrastructure
  development services; and manages airline loyalty reward currency. The company was
  incorporated in 2009 and is headquartered in Harmondsworth, the United Kingdom.
