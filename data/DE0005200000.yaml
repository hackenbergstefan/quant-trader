longBusinessSummary: 'Beiersdorf Aktiengesellschaft, together with its subsidiaries,
  manufactures and distributes consumer goods in Europe, the United States, Africa,
  Asia, and Australia. The company operates through two segments: Consumer Business
  and Tesa Business. The Consumer Business Segment offers skin and body care products.
  The Tesa Business segment provides adhesive tapes and self-adhesive solutions for
  industries, craft businesses, and consumers. This segment also offers its system
  solutions to the automotive, consumer electronics, printing and packaging, and electrical
  systems sectors. It operates an online store. The company offers its products under
  the NIVEA, Eucerin, Hansaplast, La Prairie, Chantecaille, Coppertone, Labello /
  NIVEA Lip / Liposan, ATRIX, 8x4, HIDROFUGAL, tesa, SKIN STORIES, GAMMON, Aquaphor,
  Elastoplast, and CURITAS brand names, as well as regionally focused brands. Beiersdorf
  Aktiengesellschaft was founded in 1882 and is headquartered in Hamburg, Germany.
  Beiersdorf Aktiengesellschaft is a subsidiary of maxingvest ag. Beiersdorf Aktiengesellschaft
  operates as a subsidiary of Maxingvest GmbH & Co. KGaA.'
