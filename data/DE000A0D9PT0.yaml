longBusinessSummary: 'MTU Aero Engines AG, together with its subsidiaries, engages
  in the development, manufacture, sale, and maintenance of commercial and military
  aircraft engines, and aero-derivative industrial gas turbines in Germany, other
  European countries, North America, Asia, and internationally. It operates through
  two segments: Original Equipment Manufacturing Business; and Maintenance, Repair,
  and Overhaul Business. The company offers commercial aircraft engines for wide body
  aircraft, narrow body, regional jets, helicopters, business jets, and turboprops;
  military aircraft engines for fighter jets, helicopters, and transporters; and industrial
  gas turbines. It also maintains, repairs, and overhauls commercial and military
  engines; and manufactures and markets various spare parts. The company was formerly
  known as MTU Aero Engines Holding AG and changed its name to MTU Aero Engines AG
  in May 2013. MTU Aero Engines AG was founded in 1913 and is headquartered in Munich,
  Germany.'
