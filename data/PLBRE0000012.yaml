longBusinessSummary: mBank S.A. provides various banking and financial services in
  Poland, the Czech Republic, Slovakia, and internationally. The company provides
  retail, SME, corporate, and investment banking services. It offers banking services,
  such as personal, savings, currency, investment, and business accounts, as well
  as various deposits. It also provides debit and credit cards; cash, car, secured,
  and corporate and personal loans, as well as mortgages; pension, insurance, and
  stock exchange products; and transaction and mobile banking services. In addition,
  the company offers wealth management services, including portfolio management, investment
  advisory, investment funds, financial dealer, private broker, and other investment
  services, as well as succession services. Further, it provides currency exchange
  and hedging transactions, and forex forward services, as well as treasury and non-treasury
  bonds, and Eurobonds. Additionally, the company offers leasing, factoring, brokerage,
  payment gateway, and corporate finance services. The company was formerly known
  as BRE Bank S.A. and changed its name to mBank S.A. in November 2013. The company
  was incorporated in 1986 and is headquartered in Warsaw, Poland. mBank S.A. is a
  subsidiary of Commerzbank AG.
