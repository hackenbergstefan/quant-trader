longBusinessSummary: Straumann Holding AG provides tooth replacement and orthodontic
  solutions in Switzerland, the United States, China, Germany, Brazil, Japan, France,
  and internationally. It operates through Sales Europe, Middle East and Africa; Sales
  North America; Sales Asia Pacific; Sales Latin America; and Operations segments.
  The company offers dental implants, instruments, CADCAM prosthetics, orthodontic
  and clear aligners, biomaterials, and digital equipment and solutions for use in
  tooth correction, replacement, and restoration, as well as to prevent tooth loss.
  It also provides implant systems, components, and related instruments, as well as
  healing components, materials and surfaces, surgical sets and instruments, and guided
  surgery and navigation products; prosthetics, including angled solutions, connections,
  components, and molar solutions; intra-oral and lab scanners, milling machines,
  dynamic navigation systems, and 3D printers; consumables, such as blocks, discs,
  resins, titanium bases, and abutment blanks, as well as scan bodies, analogs, and
  sleeves; online education; and dentists and dental labs solutions. In addition,
  the company offers regenerative solutions for tooth preservation, implant-site management,
  and implant preservation; scanner hardware, software licenses, sterile-packaged
  products, customer training, and other products; and logistics and supply chain
  services. Further, it provides thermoplastics; implant treatment referral; high-tech
  materials; artificial intelligence solutions for dental applications; and 3D orthodontic
  treatment animations. The company sells its products under the Straumann, Neodent,
  Medentika, Anthogyr, ClearCorrect, NUVO, and other brands through a network of distribution
  subsidiaries and partners, and third-party distributors, as well as through its
  e-shop. It serves clinicals needs, patient segments, and healthcare systems. Straumann
  Holding AG was founded in 1954 and is headquartered in Basel, Switzerland.
