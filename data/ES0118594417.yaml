longBusinessSummary: Indra Sistemas, S.A., together with its subsidiaries, provides
  technology services for the defense, aerospace, and advanced digital technologies
  sectors in Spain, Brazil, the rest of America, Italy, the rest of Europe, Asia,
  the Middle East, and Africa. It operates through the Defense, Air Traffic, Mobility,
  and Minsait segments. The company engages in the design, development, production,
  integration, and maintenance of systems, solutions, and services based on the use
  of information technologies, including computing, electronics, and communications.
  It also offers radars and radar systems, air defense systems, surveillance, security
  and unmanned vehicles, and shipboard systems for air and naval platforms; command
  and control systems, communications systems, and simulators; land military vehicles;
  unmanned aerial systems; satellite communication systems; air traffic management
  systems and equipment; air traffic control training services; and ticketing and
  tolling systems, information and control systems for multiple infrastructures and
  modes of transport, railway safety and signaling systems, and transport planning
  and consulting services. In addition, the company provides proprietary product solutions;
  implementation of third-party solutions; digital business services, including business
  consulting, cybersecurity, and advanced technologies; traditional information technology
  (IT) services, such as IT outsourcing, business process outsourcing, IT restructuring
  management, and user management; and technology solutions for the energy and industry,
  telecom and media, public administration and healthcare, and financial services.
  It offers its services to governments and public administrations under the Indra
  and Minsait brands. The company was formerly known as Experiencias Industriales
  S.A. and changed its name to Indra Sistemas, S.A. in 1993. Indra Sistemas, S.A.
  was founded in 1921 and is headquartered in Alcobendas, Spain.
