longBusinessSummary: 'Safran SA, together with its subsidiaries, engages in the aerospace
  and defense businesses in France, rest of Europe, the Americas, the Asia-Pacific,
  Africa, and the Middle East. The company operates through three segments: Aerospace
  Propulsion; Aircraft Equipment, Defense and Aerosystems; and Aircraft Interiors.
  The Aerospace Propulsion segment designs, develops, produces, and markets propulsion
  and mechanical power transmission systems for commercial aircraft, military transport,
  training and combat aircraft, civil and military helicopters, and drones; and offers
  maintenance, repair, and overhaul (MRO) services, as well as sells spare parts.
  The Aircraft Equipment, Defense and Aerosystems segment provides landing gears and
  brakes; nacelles and reversers; avionics, such as flight controls and onboard information
  systems; security systems, including evacuation slides and oxygen masks; onboard
  computers and fuel systems; electrical power management systems and related engineering
  services; optronic equipment and sights, navigation equipment and sensors, infantry,
  and drones; MRO services; and sells spare parts. The Aircraft Interiors segment
  designs, develops, manufactures, and markets aircraft seats for passengers and crew;
  cabin equipment, overhead bins, class dividers, passenger service units, cabin interior
  solutions, chilling systems, galleys, electrical inserts, and trolleys; and cabin
  equipment and passenger comfort-focused solutions such as water distribution, lavatories,
  air systems, and in-flight entertainment and connectivity (IFEC) solutions. The
  company''s products and services are used in commercial civil and military aircrafts,
  and helicopters. Safran SA was founded in 1896 and is headquartered in Paris, France.'
