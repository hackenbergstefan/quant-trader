longBusinessSummary: Loomis AB (publ) provides secure payment solutions in the United
  States, France, Switzerland, Spain, the United Kingdom, Sweden, and internationally.
  The company provides transportation of cash and valuables with logistics systems
  to and from central banks, financial institutions, retailers, restaurants and other
  businesses; cash management services, and vault and cash storage outsourcing for
  central banks and commercial banks; and international valuables logistics services,
  including collection and coordination of cross-border transportation, as well as
  customs clearance, storage, and secure delivery. It also offers automated teller
  machine services; automated cash-handling solutions, such as SafePoint, cash recyclers,
  and front office solutions; foreign exchange services; and Loomis Pay, an end-to-end
  payment solution that handles all types of payment instruments comprising cards,
  cash, and digital options in one system. Loomis AB (publ) was founded in 1852 and
  is headquartered in Stockholm, Sweden.
