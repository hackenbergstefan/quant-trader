longBusinessSummary: Chipotle Mexican Grill, Inc., together with its subsidiaries,
  owns and operates Chipotle Mexican Grill restaurants. The company sells food and
  beverages, such as burritos, burrito bowls, quesadillas, tacos, and salads, as well
  as kids' meals, chips, and sides. It also offers Mexican-inspired meals using responsibly
  sourced meats, such as chicken, beef, and pork under the Responsibly Raised brand.
  In addition, the company provides digital ordering through its website, mobile app,
  and third-party delivery platforms. It operates in the United States, Canada, France,
  Germany, South Korea, and the United Kingdom. Chipotle Mexican Grill, Inc. was founded
  in 1993 and is headquartered in Newport Beach, California.
