  its transportation and storage capacity and invests in entities. The Midstream and
  Marketing segment purchases, markets, gathers, processes, transports and stores
  oil, condensate, NGLs, natural gas, carbon dioxide, and power. Occidental Petroleum
  Corporation was founded in 1920 and is headquartered in Houston, Texas.
