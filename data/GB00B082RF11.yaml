longBusinessSummary: Rentokil Initial plc, together with its subsidiaries, provides
  route-based services in North America, Europe, the United Kingdom, Asia, the Middle
  East, North Africa, Turkey, and Pacific. The company offers a range of pest control
  services for rodents, and flying and crawling insects, as well as other forms of
  wildlife management. It provides hygiene services, including the provision and maintenance
  of products, such as soap and hand sanitizer dispensers, hand dryers, air care and
  purification, cubicle and surface sanitizers, feminine hygiene units, toilet paper
  dispensers, and floor protection mats. In addition, the company engages in the supply
  and laundering of garments for commercial organizations. Further, the company provides
  a range of specialist cleaning services, such as graffiti removal, deep cleaning
  of kitchens and washrooms, trauma cleaning, and flood or fire damage cleaning, as
  well as specialist deep cleaning services. Rentokil Initial plc was founded in 1903
  and is headquartered in Crawley, the United Kingdom.
