longBusinessSummary: NIKE, Inc., together with its subsidiaries, designs, develops,
  markets, and sells athletic footwear, apparel, equipment, accessories, and services
  for men, women, and kids in North America, Europe, the Middle East, Africa, Greater
  China, the Asia Pacific, and Latin America. The company offers its products under
  the NIKE, Jordan, Converse, Jumpman, Chuck Taylor, All Star, One Star, Star Chevron,
  and Jack Purcell trademarks. It also provides a line of performance equipment and
  accessories, including bags, socks, sport balls, eyewear, timepieces, digital devices,
  bats, gloves, protective equipment, and other equipment for sports activities; and
  sports apparel, as well as sells products to wholesale customers and directly to
  consumers through NIKE Direct operations; distributes and licenses casual sneakers,
  apparel, and accessories; and markets apparel with licensed college and professional
  team and league logos. In addition, the company offers consumer services and experiences,
  including sport focused events and activations; fitness and activity apps; sport,
  fitness, and wellness content; and digital services and features in retail stores.
  It sells its products to footwear stores; sporting goods stores; athletic specialty
  stores; department stores; skate, tennis, and golf shops; and other wholesale accounts
  through NIKE-owned retail stores, independent distributors, licensees, sales representatives,
  and digital platforms. The company was formerly known as Blue Ribbon Sports, Inc.
  and changed its name to NIKE, Inc. in May 1971. NIKE, Inc. was founded in 1964 and
  is headquartered in Beaverton, Oregon.
