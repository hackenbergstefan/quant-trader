longBusinessSummary: 'Motor Oil (Hellas) Corinth Refineries S.A. engages in oil refining
  and oil products trading in Greece and internationally. It operates through four
  segments: Refining Activity, Fuels'' Marketing Activity, Power and Gas, and Other.
  The company produces and sells liquid fuels, lubricants, and asphalt for transportation,
  industrial, and household use. It also markets and distributes a range of oil products,
  including gasoline, fuel oil, diesel, jet fuel, and lubricants through its retail
  network; renewable fuels and hydrogen; and operates gas stations. In addition, the
  company engages in the collection and trading of used lubricants; research, exploration,
  and trading of crude oil; and marketing and distribution of liquefied petroleum
  gas; as well as the manufacturing of LPG cylinders for the packaging and transportation
  of its goods; design, financing, construction, and operates aircraft fuel supply
  system and the storage facilities at the Athens International Airport at Spata of
  Attica. Further, it is involved in the purchase, sale, exploitation, and development
  of real estate properties; and provision of facilities management, airport technical
  consulting, waste management, and financial services. Motor Oil (Hellas) Corinth
  Refineries S.A. was founded in 1970 and is headquartered in Marousi, Greece.'
