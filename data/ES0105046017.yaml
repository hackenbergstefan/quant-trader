longBusinessSummary: Aena S.M.E., S.A., together with its subsidiaries, engages in
  the management of airports in Spain, Brazil, the United Kingdom, Mexico, and Colombia.
  The company operates through Airports, Real Estate Services, Región de Murcia International
  Airport, and International segments. It also manages commercial spaces in airport
  terminals, and a network of car parks; and leasing or transfer use of land, office
  buildings, warehouses, hangars, and cargo vessels to airlines, air cargo operators,
  handling agents and other airport service providers. In addition, the company is
  involved in the operation of duty-free shops, food and beverage, and specialty shops;
  rental of cars; advertising; baggage wrapping machines; other vending machines;
  regulated services, including pharmacies, tobacconists, lottery vendors, etc.; and
  provision of financial services, such as currency exchange, VAT refunds, and ATMs,
  as well as advisory services to international airports. Aena S.M.E., S.A. was formerly
  known as Aena, S.A. and changed its name to Aena S.M.E., S.A. in April 2017. The
  company was founded in 1991 and is headquartered in Madrid, Spain. Aena S.M.E.,
  S.A. operates as a subsidiary of Entidad Pública Empresarial ENAIRE.
