longBusinessSummary: "Sofina Société Anonyme is a private equity and venture capital\
  \ firm specializing in direct and fund of funds investments. Within direct investments,\
  \ it specializes in growth capital, early, startup, later stages, mature, emerging\
  \ growth, mid venture, late venture and LBO investments. The firm primarily invests\
  \ in portfolio of companies that engage in digital transformation, consumer & retail,\
  \ education, healthcare, life sciences, sustainable supply chains, energy and services,\
  \ e-commerce, consumer goods, digital, satellite operations, industry, finance companies,\
  \ and financial services worldwide. It also invests in the media, communications,\
  \ insurance, and property development sectors. The firm typically invests in European\
  \ based companies with a global exposure, and it also has a particular focus on\
  \ companies based in Western Europe and Asia such as in India, China and Southeast\
  \ Asia and in the United States. It invests in minority investments between \x80\
  100 million ($103.08 million) and \x80300 million ($309.25 million). The firm seeks\
  \ to invest between \x8020 million ($20.62million) and \x80100 million ($103.08\
  \ million) in fast-growing business. It seeks equity investment between \x805 million\
  \ ($5.35million) and \x8050 million (54.18 million) in venture and growth capital\
  \ funds. It invests in privately owned and listed companies. It invests in private\
  \ companies to support growth, finance acquisitions, give liquidity to existing\
  \ shareholders/families, support sales processes, and make minority investment alongside\
  \ shareholders controlling shareholders and in listed companies for replacement\
  \ of existing shareholders, long term support of controlling shareholders, and delisting.\
  \ Within fund of funds, the firm focuses on private equity, venture capital and\
  \ growth equity funds, and selected relationships in buyout and special situations.\
  \ It also manages funds in the fields of private equity funds. It typically invests\
  \ in North America, US, Europe and Asia, and concentrates on emerging markets. The\
  \ firm prefers to hold a minority ownership equity in its portfolio companies and\
  \ seeks board seats. The firm also prefers majority stake and co-invests. It typically\
  \ holds its investments for ten to twelve years. Sofina Société Anonyme was founded\
  \ in 1898 and is based in Brussels, Belgium with additional offices in Luxembourg,\
  \ Luxembourg; Singapore, Singapore and London, United Kingdom."
