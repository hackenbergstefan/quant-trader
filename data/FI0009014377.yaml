longBusinessSummary: Orion Oyj develops, manufactures, and markets human and veterinary
  pharmaceuticals and active pharmaceutical ingredients (APIs) in Finland, Scandinavia,
  rest of Europe, North America, and internationally. It offers pharmaceutical products,
  which includes Nubeqa for the treatment of prostate cancer; Entacapone, Stalevo,
  Comtess, and Comtan to treat Parkinson's disease; Burana for inflammatory pain;
  Divina series for menopausal symptoms; Simdax for acute decompensated heart failure;
  Fareston for breast cancer; Quetiapine products for antipsychotic; Trexan for rheumatoid
  arthritis and cancer; Easyhaler product portfolio for asthma and COPD; and Dexdor,
  Precedex, and Dexmedetomidine products for human use. The company also provides
  Salmeterol/fluticasone Easyhaler, Budesonide/formoterol Easyhaler, Formoterol Easyhaler,
  Budesonide Easyhaler, Beclomet Easyhaler, and Buventol Easyhaler drugs for the treatment
  of asthma and chronic obstructive pulmonary disease. In addition, it offers veterinary
  drugs comprising Bonqat, Clevor, Domosedan, Domitor, Antisedan, Dexdomitor, Domosedan
  Gel, Sileo, and Tessie; APIs for generic compounds and proprietary products, as
  well as contract manufacturing services; and markets and sells drugs and products
  manufactured by other companies. Additionally, the company provides self-care products,
  including non-prescription medicines, cosmetics, dietary supplements, vitamins,
  and skincare products. It also offers its products online. The company has a licensing
  agreement with Tenax Therapeutics, Inc. to develop oral levosimendan (TNX-103) for
  pulmonary hypertension in heart failure with preserved ejection fraction (PH-HFpEF);
  and Bayer for the development and commercialisation of darolutamide Nubeqa. Orion
  Oyj was founded in 1917 and is headquartered in Espo, Finland.
