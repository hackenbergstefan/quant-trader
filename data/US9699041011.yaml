longBusinessSummary: Williams-Sonoma, Inc. operates as an omni-channel specialty retailer
  of various products for home the United States and internationally. The company
  provides cooking, dining, and entertaining products, such as cookware, tools, electrics,
  cutlery, tabletop and bar, outdoor, furniture, and a library of cookbooks. It offers
  home furnishings, home decor products and accessories, bedding, lighting, rugs,
  table essentials, kids accessories, made-to-order lighting, hardware, personalized
  products, custom gifts, and vintage-inspired heirloom products. It offers its products
  under the Williams Sonoma, Pottery Barn, Pottery Barn Kids, Pottery Barn Teen, West
  Elm, Williams Sonoma Home, Rejuvenation, Mark and Graham, and GreenRow brand names.
  The company markets its products through e-commerce websites, direct-mail catalogs,
  and retail stores. Williams-Sonoma, Inc. was founded in 1956 and is headquartered
  in San Francisco, California.
