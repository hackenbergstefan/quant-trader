longBusinessSummary: Genmab A/S, a biotechnology company, develops antibody-based
  products and product candidates for the treatment of cancer and other diseases in
  Denmark. The company markets EPKINLY and TEPKINLY for adult patients with relapsed
  or refractory (R/R) diffuse large b-cell lymphoma (DLBCL), large B-cell lymphoma,
  and follicular lymphoma (FL); and Tivdak for adult patients with recurrent/metastatic
  cervical cancer with disease progression on or after chemotherapy. It is also developing
  Epcoritamab for R/R DLBCL and FL, first line DLBCL and FL, B-cell non-Hodgkin lymphoma,
  R/R chronic lymphocytic leukemia and Richter's syndrome, and aggressive mature B-cell
  neoplasms in pediatric patients; tisotumab vedotin for solid tumors; Acasunlimab
  for solid tumors and non-small cell lung cancer (NSCLC); Rinatabart Sesutecan for
  platinum resistant ovarian cancer and solid tumors; GEN1059, GEN1055, and GEN1057
  for solid tumors; and GEN1286 for advanced solid tumors. In addition, the company
  offers DARZALEX/DARZALEX FASPRO for multiple myeloma (MM) and light-chain Amyloidosis;
  RYBREVANT for NSCLC; TECVAYLI and TALVEY for R/R MM; Kesimpta for Relapsing multiple
  sclerosis; and TEPEZZA for thyroid eye disease. Further, it is developing Amivantamab
  for recurrent/metastatic head and neck cancer, and advanced or metastatic colorectal
  cancer; Amlenetug for multiple system atrophy; Inclacumab for vaso-occulsive crises
  in sickle cell diseases; and Mim8 for hemophilia A. The company has a collaboration
  agreement with AbbVie Inc., Pfizer Inc., BioNTech SE, Johnson & Johnson, Medarex,
  Inc., Bristol Myers Squibb Corporation, Lundbeck A/S, Amgen Inc., Novo Nordisk A/S,
  and argenx. Genmab A/S was incorporated in 1998 and is headquartered in Copenhagen,
  Denmark.
