longBusinessSummary: Reckitt Benckiser Group plc manufactures and sells health, hygiene,
  and nutrition products in the United Kingdom and internationally. The company offers
  germ protection under Dettol name; intimate wellness under Durex and KY brand names;
  over the counter under the Biofreeze, Gaviscon, Mucinex, Nurofen, Delsym, Cepacol,
  and Strepsils names. It also provides personal care products under Clearasil and
  Veet brand names; vitamins, minerals, and supplements under MegaRed, Airborne, Digestive-Advantage,
  Movefree, and neuriva names; stain removal under Vanish brand name; and disinfectant
  products under the Finish, Harpic, and Lysol brands. In addition, the company offers
  nutritious complementary foods and milk formulas for infant and young children under
  the Enfamil and Nutramigen brands. Reckitt Benckiser Group plc was founded in 1819
  and is headquartered in Slough, the United Kingdom.
