longBusinessSummary: "FDJ United engages in the gambling operation and distribution\
  \ business in France and internationally. The company operates through Lottery and\
  \ Sports Betting; Online Betting and Gaming; International Lottery; and Payment\
  \ and Services segments. It offers prize draws, such as Loto and Euromillions, as\
  \ well as Illiko instant games; online offer (open to competition), including sports\
  \ betting and horse-race betting, poker and casino games; and payment and collection\
  \ service through a network of point\x96of\x96sale registered as agents. The company\
  \ also provides B2B solutions; and owns Relax Gaming, a supplier of online gambling\
  \ products. The company was formerly known as La Française des Jeux Société anonyme\
  \ and changed its name to FDJ United in March 2025. FDJ United was founded in 1933\
  \ and is based in Boulogne-Billancourt, France."
