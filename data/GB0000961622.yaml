longBusinessSummary: 'Balfour Beatty plc finances, develops, builds, maintains, and
  operates infrastructure in the United Kingdom, the United States, and internationally.
  It operates through three segments: Construction Services, Support Services, Infrastructure
  Investments. The company constructs buildings, including commercial, healthcare,
  education, retail, and residential assets; and infrastructure assets comprising
  highways and railways, as well as other large-scale infrastructure assets, such
  as waste, water, and energy plants. It also offers a range of services, including
  design and/or build, mechanical and electrical engineering, shell and core and/or
  fit-out, and interior refurbishment; support services to various utility assets
  comprising servicing of power transmission and distribution assets, as well as construction
  and maintenance of electricity networks, including replacement or new build of overhead
  lines, underground cabling, cable tunnels, and offshore wind farm maintenance; and
  maintenance, asset and network management, and design services for highways, railways,
  and public assets. In addition, the company operates a portfolio of service concession
  assets comprising roads, healthcare, student accommodation, biomass, and waste and
  offshore transmission sectors; offers real estate management services, such as property
  development and asset management services; and develops housing units on land. Balfour
  Beatty plc was founded in 1909 and is based in London, the United Kingdom.'
