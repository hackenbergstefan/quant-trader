longBusinessSummary: Orange S.A. operates as a telecommunications operator in France
  and internationally. The company offers mobile services, such as voice, SMS, and
  data; and fixed broadband and narrowband services, as well as B2B fixed solutions
  and network services, including voice and data services. It also sells handsets,
  broadband equipment, connected devices, and accessories. In addition, it provides
  IT and integration services comprising unified communication and collaboration services,
  such as LAN and telephony, consultancy, integration, and project management; hosting
  and infrastructure services, including cloud computing; customer relations management
  and other applications services; security services; and video conferencing, as well
  as sells related equipment. Further, the company offers national and international
  roaming services; online advertising services; and mobile virtual network operator,
  network sharing, and mobile financial services, as well as sells equipment to external
  distributors, brokers, and operators. It markets its products and services under
  the Orange brand name. The company has a strategic collaboration with Nokia and
  NVIDIA for the development and evaluation of AI-RAN technologies The company was
  formerly known as France Telecom and changed its name to Orange S.A. in July 2013.
  Orange S.A. was incorporated in 1991 and is headquartered in Issy-les-Moulineaux,
  France.
