longBusinessSummary: Huhtamäki Oyj provides packaging solutions in the United States,
  Germany, the United Kingdom, India, Turkey, Australia, Thailand, Poland, South Africa,
  Spain, Finland, and internationally. It operates through Foodservice Packaging,
  North America, Flexible Packaging, and Fiber Packaging segments. The company offers
  beverage-to-go packaging solutions, which includes single and double-wall paper,
  coffee and cold drinks cups, cup carriers, lids, accessories and short run prints
  customized paper cups; food-to-go packaging solutions, such as trays, containers,
  clamshells, scoops, bowls, wraps, and various accessories for take-away and dining;
  and egg trays, egg cartons, fruit trays, and wine bottle separators. In addition,
  it provides stickpacks, sachets, and valve pouches for coffee packaging; stand-up
  and spouted pouches for liquid drinks; and tea bag envelopes, paper tags, and outer
  packaging for tea packaging, as well as powder drinks packaging. Further, the company
  offers packaged food consisting of satchets, stand up pouches, cube laminates, and
  cartons for culinary, ice cream, confectionary, stock cube, and other retail food
  markets; and pet food packaging, such as 4-side seal pouches and stand-up pouches
  for dry food, wet food, and snacks and treats. Additionally, it provides wicketed
  bags, stand-up pouches, sachets, and flowwraps for beauty, cleaning and laundry,
  and family care products; OTC/nutritional supplements, prescriptive, and transdermal
  patches packaging; and paper-based products for ice cream, yoghurt, dairy, spreads,
  and other snacks. The company also provides retail, catering disposables, and vending
  cups packaging products under the Chinet brand. It serves food, beverage, and petfood
  companies, quick service and fast casual restaurants, foodservice operators, fresh
  produce packers, and retailers, as well as home and personal care, industrial, FMCG,
  and healthcare sectors. Huhtamäki Oyj was founded in 1920 and is headquartered in
  Espoo, Finland.
