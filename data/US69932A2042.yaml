longBusinessSummary: 'Skydance Corporation operates as a media and entertainment company
  worldwide. It operates in three segments: Studios, Direct-to-Consumer, and TV Media.
  The company operates CBS Television Network, a domestic broadcast television network;
  CBS Stations, a television station; international free-to-air networks comprising
  Network 10, Channel 5, Telefe, and Chilevisión; and domestic premium and basic cable
  networks, such as Nickelodeon, MTV, CMT, Comedy Central, BET, Paramount+ with SHOWTIME,
  Paramount Network, The Smithsonian Channel, BET Media Group, CBS Sports Network,
  and international extensions of these brands. It also provides domestic and international
  television studio operations, including CBS Studios, Paramount Television Studios,
  and Showtime; CBS Media Ventures, which produces and distributes first-run syndicated
  programming; and digital properties consist of CBS News and CBS Sports HQ. In addition,
  the company offers a portfolio of domestic and international pay and free streaming
  services, including Paramount+, Pluto TV, and BET+. Further, it produces and acquires
  films, series, and short-form content for release and licensing worldwide, including
  in theaters, on streaming services, on television, through home entertainment, and
  DVDs, Blu-ray; and operates a portfolio consisting of Paramount Pictures, Paramount
  Players, Paramount Animation, Nickelodeon Studio, and Miramax. It provides production,
  distribution, and advertising solutions. The company was formerly known as Paramount
  Skydance Corporation and changed its name to Skydance Corporation in October 2026.
  The company was founded in 1914 and is headquartered in New York, New York.'
