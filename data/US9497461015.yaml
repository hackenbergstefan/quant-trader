longBusinessSummary: 'Wells Fargo & Company, a financial services company, provides
  diversified banking, investment, mortgage, and consumer and commercial finance products
  and services in the United States and internationally. It operates through four
  segments: Consumer Banking and Lending; Commercial Banking; Corporate and Investment
  Banking; and Wealth and Investment Management. The company''s financial products
  and services includes checking and savings accounts, and credit and debit cards,
  as well as home, auto, personal, and small business lending services. It also provides
  personalized wealth management, brokerage, financial planning, lending, private
  banking, trust and fiduciary products and services; and financial solutions to private,
  family owned and public companies through products and services including banking
  and credit products across multiple industry sectors and municipalities, secured
  lending and lease products, and treasury management. In addition, it offers a suite
  of capital markets, banking, and financial products and services, such as corporate
  banking, investment banking, treasury management, commercial real estate lending
  and servicing, equity, and fixed income solutions, as well as sales, trading, and
  research capabilities services to corporate, commercial real estate, government,
  and institutional clients. Wells Fargo & Company was founded in 1852 and is headquartered
  in San Francisco, California.'
