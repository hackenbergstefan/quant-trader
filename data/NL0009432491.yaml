longBusinessSummary: Koninklijke Vopak N.V., an independent tank storage company,
  stores and handles liquid chemicals, gases, and oil products to the energy and manufacturing
  markets worldwide. It operates gas, industrial, chemical, and oil terminals and
  owns and operates facilities consisting of tanks, jetties, truck loading stations,
  and pipelines. The company also stores and handles chemicals, such as methanol,
  xylenes, styrene, alpha olefins, and mono-ethylene glycol; gas, including liquefied
  natural gas, liquid petroleum gas, ethylene, butadiene, and ammonia; oil products
  consisting of crude oil, fuel oil, diesel, jet fuel, gasoline, and naphtha; and
  vegoils and biofuels comprising ethanol, biodiesel, and sustainable aviation fuel.
  In addition, it is involved in the development of infrastructure solutions for hydrogen,
  ammonia, CO2, battery energy storage, and low-carbon fuels and feedstocks. It serves
  producers, manufacturers, distributors, governments, and traders. The company was
  founded in 1616 and is based in Rotterdam, the Netherlands. Koninklijke Vopak N.V.
  operates as a subsidiary of HAL Trust.
