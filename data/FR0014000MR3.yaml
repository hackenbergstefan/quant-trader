longBusinessSummary: Eurofins Scientific SE, together with its subsidiaries, provides
  various analytical testing and laboratory services worldwide. It provides services,
  such as agroscience, including biological assessment, consumer and human, environmental
  safety, product chemistry, regulatory consultancy, and seed services; agro testing;
  assurance, including sustainability, audit, certification, quality inspection, QA-QC
  programme, and food and dietary supplement labelling services; biopharma, and clinical
  diagnostics. The company also offers consumer product testing, which include sustainability,
  testing, certifications and approvals, expert services and regulatory, inspections,
  audits, consumer research and sensory evaluation, and training courses; cosmetics
  and personal care; and electrical and electronics laboratories services. In addition,
  it provides environment testing, including maritime, water, air, soil, building
  material, pollution, waste, fuel/oil, microplastics, and radioactivity testing;
  and food and feed testing that include allergen, audit and certification, authenticity,
  carbohydrates, consulting, dioxins and POPs, food irradiation, GMO, heavy metal,
  melamine, microbiology, molecular biology, mycotoxin, nutritional analyses, organic
  contaminants, pesticide, veterinary drug, vitamin, and residual DNA testing. Further,
  the company provides forensic, genomic, maritime, materials and engineering, REACH,
  and sensory and consumer services, as well as in vitro diagnostics and PSS insourcing
  solutions. The company was founded in 1987 and is headquartered in Luxembourg, Luxembourg.
