longBusinessSummary: Atlas Copco AB (publ) provides compressed air and gas, air treatment
  systems, vacuum, industrial power tools and assembly systems, machine vision, and
  power and flow solutions in North America, South America, Europe, Africa, the Middle
  East, Asia, and Oceania. It operates through Compressor Technique, Vacuum Technique,
  Industrial Technique, and Power Technique segments. The company offers piston compressors,
  oil-free tooth and scroll compressors, rotary screw compressors, oil-free blowers,
  oil-free centrifugal compressors, gas and process compressors, air and gas treatment
  equipment, expanders and pumps, and medical air solutions. It also provides oil-sealed
  rotary vane, dry, and liquid ring vacuum pumps; turbomolecular and cryogenic pumps;
  abatement and integrated systems; industrial assembly tools and solutions; self-pierce
  riveting solutions; adhesive dispensing and flow drill fastening equipment; material
  removal tools, and drills and other pneumatic products; machine vision solutions;
  construction and demolition tools; mobile compressors, generators, and energy storage
  systems; and industrial flow, portable power, portable flow, and portable air products,
  as well as specialty rental services. The company serves the semiconductor and flat
  panel, industrial manufacturing, civil engineering, demolition, exploration drilling,
  automotive, off-highway vehicle producers, electronics, aerospace, energy, food,
  pharmaceutical, textile, and other industries. Atlas Copco AB (publ) was founded
  in 1873 and is headquartered in Nacka, Sweden.
