longBusinessSummary: Sectra AB (publ) provides solutions for medical IT and cybersecurity
  sectors in Sweden, the United Kingdom, the United States, rest of Europe, and internationally.
  The company operates through Imaging IT Solutions, Secure Communications, Business
  Innovation, and Other Operations. The Imaging IT Solutions segment develops and
  sells medical IT systems and services for diagnostics, managing, archiving, presenting,
  and communicating various types of medical images and patient information, as well
  as for operational follow-up and radiation dose monitoring; and maintenance in the
  form of support, system monitoring, and consulting services. The Secure Communications
  segment develops and sells products and services for secure voice and data communications,
  and project-based development, as well as security and threat analyses, and system
  monitoring services for control systems. The Business Innovation segment develops
  and sells IT systems for planning and monitoring orthopedic surgery; products for
  medical education and research projects; and IT support services for precision diagnostics
  in cancer care. The Other Operations is involved in the property management activities.
  It serves hospitals and private clinic chains. Sectra AB (publ) was incorporated
  in 1957 and is headquartered in Linköping, Sweden.
