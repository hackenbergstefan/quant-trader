longBusinessSummary: Antofagasta plc operates as a mining company. It operates through
  Los Pelambres, Centinela, Antucoya, Zaldívar, Exploration and Evaluation, and Transport
  Division segments. The company produces copper cathodes and copper concentrates;
  molybdenum concentrates; and gold and silver by-products. It also provides rail
  and road cargo services to mining customers in northern Chile. In addition, the
  company has exploration projects in various countries. It has operations in the
  United Kingdom, Switzerland, Spain, Germany, rest of Europe, Chile, rest of Latin
  America, the United States, Japan, China, Singapore, South Korea, Hong Kong, and
  rest of Asia. The company was incorporated in 1888 and is headquartered in London,
  the United Kingdom. Antofagasta plc is a subsidiary of Metalinvest Anstalt.
