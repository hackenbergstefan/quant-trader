longBusinessSummary: T. Rowe Price Group, Inc. is a publicly owned investment manager.
  The firm provides its services to individuals, institutional investors, retirement
  plans, financial intermediaries, and institutions. It launches and manages equity
  and fixed income mutual funds. The firm invests in the public equity and fixed income
  markets across the globe. It employs fundamental and quantitative analysis with
  a bottom-up approach. The firm utilizes in-house and external research to make its
  investments. It employs socially responsible investing with a focus on environmental,
  social, and governance issues. It makes investment in late-stage venture capital
  transactions and usually invests between $3 million and $5 million. The firm was
  previously known as T. Rowe Group, Inc. and T. Rowe Price Associates, Inc. T. Rowe
  Price Group, Inc. was founded in 1937 and is based in Baltimore, Maryland, with
  additional offices in North America, Europe, Asia, Australia.
