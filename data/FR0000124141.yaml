longBusinessSummary: Veolia Environnement SA designs and provides water, waste, and
  energy management solutions. It operates through France and Hazardous Waste Europe;
  Europe; Americas, Asia Pacific, Africa Middle-East; Water Technologies; and Other
  segments. The company is involved in resource management; production, treatment,
  distribution, and delivery of drinking and industrial process water; customer relationship
  management; collection, treatment, and recycling of wastewater; provision of organic
  matter, salts, metals, complex molecules, and energy; design and construction of
  water treatment and network infrastructure; and sale of water treatment equipment,
  technologies, and facilities. It also provides waste collection, product and waste
  material recovery, and waste-to-energy processing, including sale of recycled products;
  material recovery of organic waste; dismantling and remediation; hazardous waste
  processing and treatment; urban cleaning; and industrial maintenance and cleaning
  services. In addition, the company engages in the operation and maintenance of heating
  and cooling networks; optimization of industrial utilities, such as steam generation,
  cooling, electricity, and compressed air; installation and maintenance of production
  equipment; development of energy services to reduce energy consumption and CO2 emissions
  of buildings; integrated services for building management; production of electricity
  from renewable and alternative energy sources, including geothermy, biomass, co-generation,
  and wastewater plants, etc.; and provision of Hubgrade, a management platform for
  building and infrastructure energy efficiency monitoring, as well as thermal and
  multi-technical services. It serves industrial and service sector companies, public
  authorities, and individuals. The company was formerly known as Vivendi Environnement
  and changed its name to Veolia Environnement SA in January 2003. Veolia Environnement
  SA was founded in 1853 and is headquartered in Aubervilliers, France.
