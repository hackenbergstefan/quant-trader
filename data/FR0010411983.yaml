longBusinessSummary: SCOR SE, together with its subsidiaries, provides life and non-life
  reinsurance products in Europe, the Middle East, Africa, the Americas, Latin America,
  and the Asia Pacific. It operates in two segments, SCOR P&C and SCOR L&H. The SCOR
  P&C segment offers reinsurance products in the areas of property, motors, casualty
  treaties, credit and surety, decennial insurance, aviation, marine and energy, engineering,
  cyber agricultural risks, and binders and facilities; It also provides business
  solutions including corporate risk insurance, as well as specialist lines, such
  as Political and Credit risk and Environmental Liability; and binders and facilities.
  The SCOR L&H segment provides life reinsurance products, such as protection for
  mortality, morbidity, behavioral risks, disability, long-term care, critical illness,
  medical, and personal accident. This segment also provides financial solutions that
  combine traditional life reinsurance with financial components and provide liquidity,
  balance sheet, solvency, and income improvements to clients; and longevity solutions
  that include products covering the risk of negative deviation from expected results
  due to the insured or annuitant living longer than assumed in the pricing of insurance
  covers provided by insurers or pension funds. The company is involved in the asset
  management business. SCOR SE was incorporated in 1956 and is headquartered in Paris,
  France.
