longBusinessSummary: Arista Networks, Inc. engages in the development, marketing,
  and sale of data-driven, client to cloud networking solutions for AI, data center,
  campus, and routing environments in the Americas, Europe, the Middle East, Africa,
  and the Asia-Pacific. Its cloud networking solutions consist of Extensible Operating
  System (EOS), a publish-subscribe state-sharing networking operating system offered
  in combination with a set of network applications. The company offers data center,
  cloud and AI networking, cognitive adjacencies, and cognitive network software and
  services. It also provides post contract customer support services, such as technical
  support, hardware repair and replacement parts beyond standard warranty, bug fixes,
  patches, and upgrade services. The company serves a range of industries comprising
  internet companies, cloud service providers, financial services organizations, government
  agencies, media and entertainment, healthcare, oil and gas, education, manufacturing,
  industrial, and others. It markets and sells its products through distributors,
  system integrators, value-added resellers, and original equipment manufacturer partners,
  as well as through its direct sales force. Arista Networks, Inc. was formerly known
  as Arastra, Inc. and changed its name to Arista Networks, Inc. in October 2008.
  The company was incorporated in 2004 and is headquartered in Santa Clara, California.
