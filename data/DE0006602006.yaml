longBusinessSummary: GEA Group Aktiengesellschaft produces and supplies systems and
  components to the food, beverage, and pharmaceutical industries worldwide. The company
  operates through Separation & Flow Technologies; Liquid & Power Technologies; Food
  & Health Technologies; Farm Technologies; and Heating & Refrigeration Technologies
  segments. It manufactures process-related components and machinery, notably separators,
  decanters, homogenizers, valves, and pumps; and process solutions, including brewing
  systems, liquid processing and filling, concentration, fermentation, crystallization,
  purification, drying, powder handling, and packaging, as well as systems for carbon
  capture and emission control for dairy, new-food, beverage, food, chemical, and
  other industries. The company also prepares, marinates, and processes meat, poultry,
  seafood, vegan products, and snack and pasta, as well as slicing, packaging lines,
  freeze drying, granulators, and tablet presses for pharmaceutical industry. In addition,
  it offers customer solutions for milk production and livestock farming comprising
  automatic milking and feeding system, conventional milking solutions, manure handling,
  and digital herd management tools; and energy solutions in the field of industrial
  refrigeration and heating for various industries, including food, beverage, dairy,
  oil and gas, supporting automation, digital, and service platform. The company was
  formerly known as mg technologies ag and changed its name to GEA Group Aktiengesellschaft
  in 2005. GEA Group Aktiengesellschaft was founded in 1881 and is headquartered in
  Düsseldorf, Germany.
