longBusinessSummary: Vertiv Holdings Co designs, manufactures, and services critical
  digital infrastructure technologies and life cycle services for data centers, communication
  networks, and commercial and industrial environments in the Americas, the Asia Pacific,
  Europe, the Middle East, and Africa. The company offers AC and DC power management
  products, low/medium voltage switchgear, busbar, thermal management products, air
  cooled and liquid cooled thermal management products, integrated modular solutions,
  racks, single phase UPS, rack power distribution, rack thermal systems, configurable
  integrated solutions, energy storage solutions, hardware, and software infrastructure
  that are integral to the technologies used for various services, including artificial
  intelligence, e-commerce, online banking, file sharing, video on-demand, energy
  storage, wireless communications, Internet of Things, and online gaming. It also
  provides lifecycle management services, predictive analytics, and professional services
  for deploying, maintaining, and optimizing its products and their related systems;
  and preventative maintenance, acceptance testing, engineering and consulting, fluid
  management, performance assessments, remote monitoring, training, spare parts, and
  critical digital infrastructure software services. The company offers its products
  primarily under the Vertiv, Liebert, NetSure, Geist, Energy Labs, ERS, Albér, and
  Avocent brands. It serves through a network of direct sales professionals, independent
  sales representatives, channel partners, and original equipment manufacturers. The
  company is headquartered in Westerville, Ohio.
