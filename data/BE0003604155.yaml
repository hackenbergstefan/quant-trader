longBusinessSummary: Lotus Bakeries NV, together with its subsidiaries, provides various
  snack products in Belgium and internationally. It offers biscuits, cookies, ginger
  breads, cakes, donut, waffles, pastry, fruity bakes, veggie straws, wriggles, tiddlers,
  biscptti, melty bittons, and pepparkakor biscuits. The company also provides energy
  bars, fruit and nut bars, protein bars, fruit and fibre bars, ice creams, and spreads.
  It sells its products under the Lotus, Biscoff, nakd, TREK, BEAR, Kiddylicious,
  Peter's Yard, Dinosaurus, Peijnenburg, Snelle Jelle, Annas, Suzy, and Kung Oscar
  brands. The company was founded in 1932 and is headquartered in Lembeke, Belgium.
  Lotus Bakeries NV is a subsidiary of Stichting Administratiekantoor van Aandelen
  Lotus Bakeries.
