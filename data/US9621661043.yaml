longBusinessSummary: Weyerhaeuser Company is the world's largest private owners of
  timberlands and today owns or controls more than 10 million acres of timberlands
  in the U.S., as well as additional public timberlands managed under long-term licenses
  in Canada. Weyerhaeuser has been a global leader in sustainability for more than
  a century and manages 100 percent of its timberlands on a fully sustainable basis
  in compliance with internationally recognized sustainable forestry standards. Weyerhaeuser
  is also one of the largest manufacturers of wood products in North America and operates
  additional business lines around product distribution, climate solutions, real estate,
  energy and natural resources, among others. In 2025, the company generated 6.9 billion
  dollar in net sales and employed approximately 9,500 people who serve customers
  worldwide. Weyerhaeuser Company was founded in 1900 and was incorporated in Washington.
