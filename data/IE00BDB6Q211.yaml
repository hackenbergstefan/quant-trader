longBusinessSummary: 'Willis Towers Watson Public Limited Company operates as an advisory,
  broking, and solutions company worldwide. The company operates through two segments:
  Health, Wealth & Career and Risk & Broking. It offers strategy and design consulting,
  plan management service and support, broking and administration services for health,
  wellbeing, and other group benefit programs, including medical, dental, disability,
  life, voluntary benefits, and other coverages; actuarial support, plan design, and
  administrative services for pension and retirement savings plans; retirement consulting
  services and solutions; and integrated solutions that consists of investment discretionary
  management, pension administration, core actuarial, and communication and change
  management assistance services. The company also provides advice, data, software,
  and products to address clients'' total rewards and talent issues; and risk advice,
  insurance brokerage, and consulting services in the areas of property and casualty,
  affinity, risk and analytics, aerospace, construction, global markets direct and
  facultative, financial, executive and professional risks, credit risk solutions,
  crisis management, surety, marine, and natural resources. In addition, it offers
  software and technology, risk and capital management, products and product pricing,
  financial and regulatory reporting, financial and capital modeling, M&A, outsourcing,
  and business management services. The company was formerly known as Willis Group
  Holdings Public Limited Company and changed its name to Willis Towers Watson Public
  Limited Company in January 2016. Willis Towers Watson Public Limited Company was
  founded in 1828 and is based in London, the United Kingdom.'
