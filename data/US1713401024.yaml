longBusinessSummary: 'Church & Dwight Co., Inc. develops, manufactures, and markets
  household, personal care, and specialty products. It operates in three segments:
  Consumer Domestic, Consumer International, and Specialty Products Division. The
  company offers baking soda, cat litters, laundry detergents, carpet deodorizers,
  and other baking soda-based products under the ARM & HAMMER brand; stain removers,
  cleaning solutions, laundry detergents, and bleach alternatives under the OXICLEAN
  brand; dry shampoos under the BATISTE brand; water flossers under the WATERPIK brand;
  oral care products under the THERABREATH brand; acne treatment products under the
  HERO brand; hand sanitizers under the TOUCHLAND brand; and condoms, lubricants,
  and vibrators under the TROJAN brand. It also provides home pregnancy and ovulation
  test kits under the FIRST RESPONSE brand; depilatories under the NAIR; oral analgesics
  under the ORAJEL brand; laundry detergents under the XTRA brand; and cold shortening
  and relief products under the ZICAM brand. In addition, the company''s specialty
  products include animal and food productivity products, such as ARM & HAMMER baking
  soda as a feed additive to help dairy cow; BIO-CHLOR and FERMENTEN used to reduce
  health issues associated with calving, as well as needed protein; CELMANAX refined
  functional carbohydrate, a yeast-based prebiotic; and CERTILLUS a probiotics products
  used in the poultry, dairy, beef, and swine industries. Additionally, it offers
  sodium bicarbonate; and cleaning and deodorizing products. The company sells its
  consumer products through supermarkets, mass merchandisers, wholesale clubs, drugstores,
  convenience stores, home stores, dollar and other discount stores, pet and other
  specialty stores, websites and other e-commerce channels; and specialty products
  to industrial customers and livestock producers through distributors. Church & Dwight
  Co., Inc. was founded in 1846 and is headquartered in Ewing, New Jersey.'
