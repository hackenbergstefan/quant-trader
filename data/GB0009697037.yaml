longBusinessSummary: 'Babcock International Group PLC, together with its subsidiaries,
  engages in the design, development, manufacture, and integration of specialist systems
  for aerospace, defense, and security in the United Kingdom, rest of Europe, Africa,
  North America, Australasia, and internationally. The company operates through four
  segments: Marine, Nuclear, Land, and Aviation. The company offers type 31 frigates,
  arrowhead 140, arrowhead 120, ARMOR force, project lurcher, jackal contract, ground
  deployed advanced mortar system, general logistics vehicle, Babcock''s LGE, and
  armored land cruiser 300. It also provides weapons handling systems, autonomous
  and uncrewed aerial systems, and engineering and systems integration. In addition,
  the company is involved in the design, integration, and through-life support of
  various connected combat, support, and surveillance vehicles; integration of long-range
  fires, and command, control, communications, computers, intelligence, surveillance,
  targeting, acquisition and reconnaissance systems; provision of system engineering
  and general vehicle architecture services; and specialist vehicle conversions. Further,
  it provides equipment support, frontline support, and training services. Babcock
  International Group PLC was founded in 1891 and is based in London, the United Kingdom.'
