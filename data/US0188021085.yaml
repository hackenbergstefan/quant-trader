longBusinessSummary: Alliant Energy Corporation operates as a utility holding company
  that provides regulated electric and natural gas services in the United States.
  It operates through IPL and WPL segments. The company's IPL segment engages primarily
  in the generation and distribution of electricity and the distribution and transportation
  of natural gas to retail customers in select markets in Iowa. This segment also
  sells electricity to wholesale customers in Minnesota, Illinois and Iowa; and generates
  and distributes steam for two customers in Cedar Rapids, Iowa. Its WPL segment generates
  and distributes electricity, and distributes and transports natural gas to retail
  customers in select markets in Wisconsin; and sells electricity to wholesale customers
  in Wisconsin. It serves retail customers in the farming, agriculture, industrial
  manufacturing, chemical, packaging, and food industries, as well as wholesale customers
  comprising municipalities and rural electric cooperatives. In addition, the company
  owns and operates a short-line rail freight service in Iowa; a Mississippi River
  barge, rail, and truck freight terminal in Illinois; freight brokerage services;
  wind turbine blade recycling services; and a rail-served warehouse in Iowa. Further,
  it holds interests in a natural gas-fired electric generating unit near Sheboygan
  Falls, Wisconsin; and a wind farm located in Oklahoma. The company was formerly
  known as Interstate Energy Corp. and changed its name to Alliant Energy Corporation
  in May 1999. Alliant Energy Corporation is headquartered in Madison, Wisconsin.
