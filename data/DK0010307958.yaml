longBusinessSummary: Jyske Bank A/S provides financial solutions in Denmark and Germany.
  The company operates through Banking Activities, Mortgage Activities, and Leasing
  Activities segments. The Banking Activities segment provides advisory services relating
  to traditional financial solutions for personal, private banking, and corporate
  customers; and trading and investment services, including trading in interest rate
  products, currencies, equities, commodities, and derivatives for corporate and institutional
  customers. The Mortgage Activities segment offers financial solutions for the financing
  of real property to Danish personal customers, corporate customers, and subsidized
  rental housing. The Leasing Activities segment provides financial solutions in the
  form of leasing and financing within car financing, as well as leasing and financing
  of equipment for the corporate sector. The company also offers pension and insurance
  products; investment and asset-management products; and payment and advisory services,
  as well as online and mobile banking services. Jyske Bank A/S was incorporated in
  1917 and is based in Silkeborg, Denmark.
