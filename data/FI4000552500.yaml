longBusinessSummary: Sampo Oyj, together with its subsidiaries, provides non-life
  insurance products and services in Finland, Sweden, Norway, Denmark, Estonia, Lithuania,
  Latvia, Spain, Gibraltar, Germany, the Netherlands, France, and the United Kingdom.
  The company operates through Private Nordic, Private UK, Nordic Commercial, and
  Nordic Industrial segments. It offers property, casualty, liability, accident, sickness,
  household, homeowner, motor, travel, marine, aviation, transport, forest, livestock,
  health, workers compensation, car, van, and bike insurance, as well as reinsurance
  products under the If, Topdanmark, and Hastings brand names. Sampo Oyj was founded
  in 1909 and is based in Helsinki, Finland.
