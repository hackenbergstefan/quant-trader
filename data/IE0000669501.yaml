longBusinessSummary: Glanbia plc, together with its subsidiaries, operates as a nutrition
  company worldwide. The company offers sports nutrition and lifestyle nutrition products
  in various formats, such as powders, capsules, tablets, ready-to-eat bars, and ready-to-drink
  beverage. It also manufactures and sells cheese, dairy, and non-dairy nutritional
  and functional ingredients; and vitamin and mineral premixes products. In addition,
  the company engages in the financing business; property and land dealing business;
  property leasing; provision of business services and management solutions; and bioactive
  solutions. It offers its products under the Optimum Nutrition, BSN, Isopure, Nutramino,
  think!, Amazing Grass brands. The company sells its products through specialty retail,
  online, gym, and food, drug, mass, and club channels. Glanbia plc was founded in
  1964 and is headquartered in Kilkenny, Ireland.
