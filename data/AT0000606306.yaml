longBusinessSummary: Raiffeisen Bank International AG, together with its subsidiaries,
  offers banking services to corporate, retail, and institutional customers. The company
  provides cash management, investment and subsidized financing, eSpeedTrack, financing
  and sustainable solutions, electronic bank account management, reporting and payment,
  supply chain financing, payment acceptance, factoring solutions, export and trade
  finance, factoring, leveraged and acquisition financing, project and structured
  financing, real estate financing, leasing, digital banking, working capital, investment
  banking, investing, hedging, and investor services to its institutional clients
  and corporate customers in agri food and beverage, mobility, construction and building
  materials, healthcare and pharmaceuticals, infrastructure and logistics, manufacturing,
  metals and mining, energy, packaging, real estate, retail, technology, telecom,
  and utilities industries. It also offers corporate, investment, and retail banking
  services, such as wealth management services to retail customers and small and medium-sized
  enterprises. In addition, the company provides accounts, clearing, reporting, settlement,
  domestic banks, and instant payment services; and investment banking services, including
  asset based finance, fund finance and alternatives investments, loan syndication,
  mergers and acquisitions advisory, and debt and equity capital markets services.
  It operates through a network of business outlets in Central, Southeastern, and
  Eastern Europe, as well as Albania, Bosnia and Herzegovina, Croatia, Kosovo, Romania,
  Serbia, Russia, Austria, Czech Republic, Hungary, Poland, Slovenia, Montenegro,
  Slovakia, and Ukraine. Raiffeisen Bank International AG was founded in 1886 and
  is based in Vienna, Austria.
