longBusinessSummary: 'Intesa Sanpaolo S.p.A. engages in the provision of various financial
  products and services in Italy, Central/Eastern Europe, the Middle East, and North
  Africa. It operates through six segments: Banca dei Territori, IMI Corporate & Investment
  Banking, International Banks, Asset Management, Private Banking, and Insurance.
  The company offers lending and deposit products; private and commercial banking,
  corporate and transaction banking, structured finance, investment banking, public
  finance, and capital market services; life and non-life insurance and pension products;
  asset and wealth management services; private investments; and bancassurance products.
  It also provides industrial loans, leases, and factoring services, as well as digital
  banking services. The company serves individuals, small and medium-sized businesses,
  non-profit customers, corporates and financial institutions, public administration,
  private clients and high net worth individuals, and other customers. Intesa Sanpaolo
  S.p.A. is headquartered in Turin, Italy.'
