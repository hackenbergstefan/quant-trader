longBusinessSummary: Coherent Corp. develops, manufactures, and markets lasers, transceivers,
  other optical and optoelectronic devices, modules, and systems worldwide. Its products
  include critical components consisting of detectors, passive optics, thermal solutions,
  and PICS; silicon photonics and other advanced optical technologies; and coherent
  transmission components, transport products, optical amplifiers, passive optical
  components, optical line systems, and multi-rail platform. The company's Datacenter
  and Communications segment offers transceivers, co-packaged optics, and optical
  circuit switches, as well as other systems, such as subsystems, modules, and semiconductor
  devices for datacenter and communications applications; and VCSELS, EELS, pump lasers,
  and other components, optics, and ICs for datacenter and communication applications.
  Its Industrial segment offers excimer lasers, solid-state lasers, and CO2 lasers;
  laser systems for various industrial applications, including semiconductor capital
  equipment, display manufacturing, precision manufacturing, and scientific research;
  and laser systems and subsystems comprising high-power lasers for materials processing.
  This segment also provides engineered materials, laser optics, thermoelectric components,
  and advanced ceramic and metal-matrix composite materials and products. It markets
  its products and services through a direct sales force, representatives, and distributors.
  The company was formerly known as II-VI Incorporated and changed its name to Coherent
  Corp. in September 2022. Coherent Corp. was incorporated in 1971 and is headquartered
  in Saxonburg, Pennsylvania.
