longBusinessSummary: Johnson Controls International plc, together with its subsidiaries,
  engages in engineering, manufacturing, commissioning, and retrofitting building
  products and systems in the Americas, Europe, the Middle East, Africa, and the Asia-Pacific.
  The company designs, manufactures, sells, installs, and services heating, ventilating,
  air conditioning, controls, building management, refrigeration, integrated electronic
  security, integrated fire detection and suppression systems, and digital solutions.
  It also provides energy solutions and technical services, including inspection,
  scheduled maintenance, and repair and replacement of mechanical and control systems,
  as well as data-driven building solutions. It sells its products and services to
  commercial, residential security, institutional, industrial, data center, marine,
  and governmental customers. Johnson Controls International plc was incorporated
  in 1885 and is based in Cork, Ireland.
