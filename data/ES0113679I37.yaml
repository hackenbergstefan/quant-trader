longBusinessSummary: Bankinter, S.A. provides various banking products and services
  to individuals, corporates, and small- and medium-sized enterprises in Spain, Luxembourg,
  Portugal, and Ireland. The company operates through Commercial Banking, Corporate
  Banking, BKCF Spain, BK Portugal, BK Ireland, and Other Businesses segments. It
  offers smart digital, payroll, pension, business, non-salary, currency, youth, current,
  and management accounts; debit and credit cards; cash management cash pooling; guarantees;
  mortgages and loan products; financing; and investment banking and wealth management
  services. The company also provides investment funds, retirement, broker, alternative
  investment, deposit, and treasury bills; SEPA direct debit, VAT and invoice advance,
  commercial discount, factoring, cheque deposits, and POS; and cheque and promissory
  notes, confirming, payroll, and tax and social security; treasury management and
  documentary business; and VAT advance, multi-currency and open-term credit account,
  leasing, and structured financing services. In addition, it offers home, life, health,
  death, and motor vehicle; property, multi-risk, civil liability, construction and
  decennial, trade credit, and personal; general and business liability, liability
  for executives, construction, and machinery and equipment; group life, health, and
  accident; and pension scheme insurance products. Further, the company provides various
  services, such as real estate and account management, virtual agent, financial data
  aggregation, direct debit management, transfer, certificate, tax payment, estate
  administration, and foreign currency order services. Additionally, it offers retail,
  personal, private, and corporate banking products, as well as remote banking services.
  The company was formerly known as Banco Intercontinental Español, S.A. and changed
  its name to Bankinter, S.A. in July 1990. Bankinter, S.A. was incorporated in 1965
  and is headquartered in Madrid, Spain.
