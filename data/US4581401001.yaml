longBusinessSummary: 'Intel Corporation designs, develops, manufactures, markets,
  sells, and services computing and related end products and services in the United
  States, Ireland, Israel, and internationally. It operates through three segments:
  CCG, DCAI, and Intel Foundry. The company offers client computing group products,
  including client and commercial CPUs, discrete client GPUs, edge computing, and
  connectivity products; data center and AI products, such as server CPUs, discrete
  GPUs, and networking products; and semiconductors comprising wafer fabrication,
  substrates, and other related products and services. It also provides driving assistance
  and self-driving solutions; and develops and manufactures multi-beam mask writing
  tools. The company sells its products through sales organizations, distributors,
  resellers, retailers, and OEM partners. It serves original equipment manufacturers,
  original design manufacturers, cloud service providers, and other manufacturers
  and service providers. Intel Corporation has a strategic collaboration with Infosys
  Limited to develop a multi-layer AI fabric that unifies infrastructure, models,
  data, applications, and workflows into a composable and agent-ready ecosystem. The
  company was incorporated in 1968 and is headquartered in Santa Clara, California.'
