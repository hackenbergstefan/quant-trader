longBusinessSummary: 'Parker-Hannifin Corporation engages in the manufacture and sale
  of motion and control technologies and systems for aerospace and defense, in-plant
  and industrial equipment, transportation, off-highway, energy, and HVAC and refrigeration
  markets in North America, EMEA, Asia Pacific, and Latin America. It operates through
  two segments: Diversified Industrial and Aerospace Systems. The company offers various
  motion-control systems and components, such as active and passive vibration control,
  high purity sealing, coatings, high temperature sealing, cryogenic valves and fittings,
  HVAC/R controls and monitoring, elastomeric, fabric reinforced, metal, precision
  cut seals, hydrogen and natural gas filters, electric and hydraulic pumps and motors,
  industrial air, gas filtration, electric and hydraulic valves, miniature pumps and
  valves, electromagnetic interface shielding, pneumatic actuators, regulators and
  valves, electromechanical and hydraulic actuators, power take offs, electronics,
  drives and controllers, process filtration solutions, engine filtration solutions,
  rubber to substrate adhesives, fluid condition monitoring, sensors and diagnostics,
  fluid conveyance hose and tubing, structural adhesives, high pressure connectors,
  fittings, valves and regulators, thermal management, high purity fittings. The company
  also provides products for use in commercial and defense airframe and engine programs,
  such as avionics, electric and hydraulic braking systems, electric power, electromechanical
  actuators, engine exhaust systems and components, fire detection and suppression,
  flight control systems, fluid conveyance, fuel systems and components, fuel tank
  inserting systems, hydraulic pumps and motors, hydraulic valves and actuators, pneumatics,
  seals, sensors, and thermal management products. The company sells its products
  to original equipment manufacturers, distributors, direct-sales employees. Parker-Hannifin
  Corporation was founded in 1917 and is headquartered in Cleveland, Ohio.'
