longBusinessSummary: "MSCI Inc., together with its subsidiaries, provides research-based\
  \ data, analytics, and indexes, supported by advanced technology worldwide. The\
  \ Index segment provides indexes for use in various areas of the investment process,\
  \ including indexed financial products, such as ETFs, mutual funds, annuities, futures,\
  \ options, structured products, and over-the-counter derivatives; performance benchmarking;\
  \ portfolio construction and rebalancing; and asset allocation, as well as licenses\
  \ GICS and GICS Direct. The Analytics segment offers risk management, performance\
  \ attribution and portfolio management content, application, an integrated view\
  \ of risk and return service, and an analysis of market, credit, liquidity, counterparty,\
  \ and climate risk across asset classes; managed services, including consolidation\
  \ of client portfolio data, review and reconciliation of input data and results,\
  \ and customized reporting; and HedgePlatform to measure, evaluate, and monitor\
  \ the risk of hedge fund investments. The Sustainability and Climate segment provides\
  \ products and services that help institutional investors understand how ESG impacts\
  \ the long-term risk and return of their portfolio and individual security-level\
  \ investments; and data, ratings, research, and tools to assist investors navigate\
  \ increasing regulation. The All Other \x96 Private Assets segment comprises private\
  \ credit, real estate and infrastructure data, benchmarks, return-analytics, climate\
  \ assessments and market insights; business intelligence to real estate owners,\
  \ managers, developers, and brokers; and offers investment decision support tools\
  \ for private capital. The Private Capital Solutions segment offers tools to help\
  \ private asset investors across mission-critical workflows, such as sourcing terms\
  \ and conditions, evaluating operating performance, managing risk and other activities\
  \ supporting private capital investment. MSCI Inc. was incorporated in 1998 and\
  \ is based in New York, New York."
