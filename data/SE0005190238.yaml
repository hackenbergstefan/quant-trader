longBusinessSummary: Tele2 AB (publ) provides fixed and mobile connectivity and entertainment
  services in Sweden, Lithuania, Latvia, and Estonia. The company offers handset related
  data services, linear and streaming services, mobile telephony and data, fixed broadband
  and telephony, switch and contact center, cloud services, IT services, network services,
  workplace, video and collaboration, united communications, and security services.
  It also provides data network services, including dark fiber, dedicated wavelength,
  ethernet and IP VPN, and internet services; and unified communications comprising
  service provider, mobile virtual network operator, and carrier SIP-interconnect
  services. In addition, the company offers single and dual IMSI solutions for consumer
  and IoT applications; on-demand roaming services, such as subscription management,
  data plan management, real time charging, eSIM delivery, SIM management, and set
  up services; routing and termination solutions for international voice traffic;
  application-2-person messaging services; and value-added services comprising shortcodes
  and long numbers for businesses to have 2-way communication with their customers.
  Tele2 AB (publ) was formerly known as NetCom AB and changed its name to Tele2 AB
  (publ) in February 2001. The company was incorporated in 1990 and is headquartered
  in Kista, Sweden.
