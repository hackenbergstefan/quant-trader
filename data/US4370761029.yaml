longBusinessSummary: The Home Depot, Inc. operates as a home improvement retailer
  in the United States and internationally. It sells various building materials, home
  improvement products, lawn and garden products, and décor products, as well as facilities
  maintenance, repair, and operations products. The company also offers installation
  services for flooring, water heaters, baths, garage doors, cabinets, cabinet makeovers,
  countertops, sheds, furnaces and central air systems, windows, and window coverings.
  In addition, it provides tool and equipment rental services. The company serves
  consumers, such as do-it-yourself homeowners and do-it-for-me customers; and professional
  renovators/remodelers, general contractors, homebuilders, maintenance professionals,
  handymen, property managers, building service contractors and specialty tradespeople,
  such as electricians, landscapers, insulation installers, plumbers, painters, pool
  contractors, roofers, and wallboard and ceiling installers. It sells its products
  through websites and its mobile applications, including homedepot.com; homedepot.ca
  and homedepot.com.mx; blinds.com, justblinds.com, and americanblinds.com for custom
  window coverings; constructionresourcesusa.com or design-oriented surfaces, appliances,
  and architectural specialty products; thecompanystore.com, an online site for textiles
  and décor products; hdsupply.com for maintenance, repair, and operations products
  and related services; and srsdistribution.com, heritagelandscapesupplygroup.com,
  heritagepoolsupplygroup.com, and gms.com for roofing and building materials, landscape,
  and pool products; and The Home Depot stores. The Home Depot, Inc. was incorporated
  in 1978 and is headquartered in Atlanta, Georgia.
