longBusinessSummary: 'PACCAR Inc designs, manufactures, and distributes light, medium,
  and heavy-duty commercial trucks in the United States, Canada, Australia, Mexico,
  Europe, Central and South America, and internationally. It operates through three
  segments: Truck, Parts, and Financial Services. The Truck segment designs, manufactures,
  and distributes trucks for the over-the-road and off-highway hauling of commercial
  and consumer goods; and diesel engine products. It sells its trucks through a network
  of independent dealers under the Kenworth, Peterbilt, and DAF nameplates. The Parts
  segment distributes aftermarket parts for trucks and related commercial vehicles.
  The Financial Services segment conducts full-service leasing operations under the
  PacLease trade name, as well as provides finance and leasing products and services
  to customers and dealers. This segment offers equipment financing and administrative
  support services for its franchisees; retail loan and leasing services for small,
  medium, and large commercial trucking companies, as well as independent owners/operators
  and other businesses; and truck inventory financing services to independent dealers.
  In addition, this segment offers loans and leases directly to customers for the
  acquisition of trucks and related equipment; and operates its own full-service lease
  outlets. The company manufactures and markets industrial winches under the Braden,
  Carco, and Gearmatic nameplates. PACCAR Inc was founded in 1905 and is headquartered
  in Bellevue, Washington.'
