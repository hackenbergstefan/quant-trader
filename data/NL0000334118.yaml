longBusinessSummary: ASM International NV, together with its subsidiaries, engages
  in the research, development, manufacturing, marketing, and servicing of equipment
  and materials used to produce semiconductor devices in the United States, Europe,
  and Asia. The company offers equipment used in wafer processing, which encompasses
  the fabrication steps in which silicon wafers are layered with semiconductor devices.
  It also provides wafer-processing deposition systems for surface modification, atomic
  layer deposition (ALD), such as plasma enhanced ALD (PEALD); epitaxy (Epi); plasma
  enhanced chemical vapor deposition (PECVD); and vertical furnace systems, including
  low pressure chemical vapor deposition (LPCVD), diffusion, oxidation, and cure.
  In addition, the company provides silicon carbide epitaxy (SiC Epi) tools for power
  and wafer applications; chemical mechanical polishing equipment for compound semiconductors
  and More-than-Moore manufacturing; and spare parts and support services. It sells
  its products to semiconductor manufacturers. The company was formerly known as Advanced
  Semiconductor Materials International NV. ASM International NV was incorporated
  in 1968 and is headquartered in Almere, the Netherlands.
