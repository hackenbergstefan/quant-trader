longBusinessSummary: 'Ferrovial N.V., together with its subsidiaries, engages in the
  development, construction, and operation of highways and airports in the United
  States, Poland, Spain, the United Kingdom, Canada, and internationally. It operates
  through four segments: Construction, Highways, Airports, and Energy. The company
  is involved in the development, financing, and operation of toll road infrastructure
  and construction activities, including the design and construction of public and
  private works; construction of public infrastructures; and development, financing,
  investing, and operation of airports. It engages in the development and construction
  of energy transmission and renewable generation energy infrastructure, as well as
  rendering of services regarding energy efficiency; and operation of waste management
  plants. The company was founded in 1952 and is based in Amsterdam, the Netherlands.'
