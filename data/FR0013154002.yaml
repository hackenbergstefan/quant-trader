longBusinessSummary: Sartorius Stedim Biotech S.A. engages in the production and sale
  of instruments and consumables for the biopharmaceutical industry worldwide. The
  company offers various products, such as cell lines; cell culture media; bioreactors;
  reagents; advanced therapies; and a range of products for separation, purification,
  and concentration processes, as well as products and systems for storage and transportation
  of intermediate and finished biological products. It also provides fluid management
  services; biolayer interferometry instruments; microbiology testing, sterility testing,
  and air monitoring instruments; pipette products; sensors and analyzers; screening
  instruments; biomolecule analysis tools; batch liquid chromatography systems; lab
  data and fleet management software; live cell imaging and analysis; surface plasmon
  resonance solutions; water purification systems; and weighing products. In addition,
  the company offers data analytics software; process automation platform and software;
  and transfection reagents and plasmid DNA solutions. The company has a collaboration
  with Bio Usawa Biotechnology, Ltd. focusing on developing and manufacturing monoclonal
  antibodies in Sub-Saharan Africa to tackle oncology, diabetes-induced eye diseases,
  infectious diseases, and autoimmune conditions. It serves manufacturers of medications,
  vaccines, food, and chemicals, as well as research and development laboratories.
  The company was incorporated in 1978 and is headquartered in Aubagne, France. Sartorius
  Stedim Biotech S.A. is a subsidiary of Sartorius AG.
