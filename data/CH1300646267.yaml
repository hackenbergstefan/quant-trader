longBusinessSummary: 'Bunge Global SA operates as an agribusiness and food company
  worldwide. It operates through four segments: Soybean Processing and Refining, Softseed
  Processing and Refining, Other Oilseeds Processing and Refining, and Grain Merchandising
  and Milling. The Soybean Processing and Refining segment is involved in the purchase,
  storage, transportation, processing, distribution, refining, marketing, and sale
  of soybeans and soybean related products, as well as biodiesel and fertilizer production
  and distribution for the food, animal feed and biofuel industries. The Softseed
  Processing and Refining segment is involved in the purchase, storage, transportation,
  processing, distribution, refining, marketing, and sale of softseeds and softseed
  related products, as well as biodiesel production and distribution. The Other Oilseeds
  Processing and Refining Segment is involved in products of a specialty nature, including
  the purchase, storage, transportation, processing, distribution, refining, marketing,
  and sale of these related products. The Grain Merchandising and Milling segment
  is involved in the purchase, storage, transportation, distribution, and marketing
  of commodities primarily consisting of corn, wheat, barley, cotton, pulses, and
  sugar; milling of wheat and sugar; and related services including ocean freight
  and financial services. Bunge Global SA was founded in 1818 and is headquartered
  in Chesterfield, Missouri.'
