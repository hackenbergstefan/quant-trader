longBusinessSummary: 'Kuehne + Nagel International AG, together with its subsidiaries,
  provides integrated logistics services in Europe, the Middle East, Africa, the Americas,
  and the Asia-Pacific. The company operates through four segments: Sea Logistics,
  Air Logistics, Road Logistics, and Contract Logistics. It offers full loads and
  less than container loads, reefer cold chain solutions for temperature-sensitive
  goods, order management, and VinLog, a wine, spirits, and drinks logistics solutions,
  as well as cargo insurance and customs brokerage; and air freight services, such
  as air charter services, time-critical logistics, sea-air logistics, airside logistics,
  customs clearance, and smart labels. The company also provides road logistics include
  full truck load, less than truck load, and groupage services; and fulfillment, warehouse,
  and distribution services, such as fulfilment operation, distribution and last mile
  delivery, in-plant, inventory and order management, packaging, returns management,
  waste management, custom, quality inspections, and value-added services. In addition,
  it offers customs clearances services comprising export and import customs clearance
  and transit services, one-stop digital customs solution, and customs and trade consultancy
  services, as well as inbound logistics for e-commerce and cross-border e-commerce.
  Further, the company operates various logistic projects, such as industrial, renewable,
  energy, marine logistics, one global system, engineering, and chartering, and offers
  CO2e emissions calculator for project logistics. Additionally, it offers sustainable
  logistics; and supply chain management services comprising 4PL integrated logistics
  and order management. The company serves aerospace, automotive, mobility, consumer,
  healthcare, high-tech and semiconductor, industrial, and perishables industries.
  The company was founded in 1890 and is based in Schindellegi, Switzerland. Kuehne
  + Nagel International AG operates as a subsidiary of Kühne Holding AG.'
