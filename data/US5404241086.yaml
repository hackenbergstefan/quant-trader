longBusinessSummary: Loews Corporation, through its subsidiaries, provides commercial
  property and casualty insurance in the United States and internationally. The company
  offers specialty insurance products, such as management and professional liability
  and other coverage products; surety and fidelity bonds; professional liability coverages
  and risk management services to various professional firms, including architects,
  real estate agents, and accounting and law firms; standard and excess property,
  marine and boiler, machinery coverages, workers' compensation, general and product
  liability, commercial auto, umbrella, excess and surplus coverages, specialized
  loss-sensitive insurance programs, total risk management services relating to claim
  and information services; directors and officers, errors and omissions, employment
  practices, fiduciary, fidelity, and cyber coverages, as well as for small and mid-size
  firms, public and privately held firms, and not-for-profit organizations; and insurance
  products to serve the health care industry, including professional and general liability,
  as well as associated casualty coverage to aging services, allied medical facilities,
  dentists, physicians, nurses, and other medical practitioners. It also provides
  warranty and alternative risk, and run-off long-term care insurance products; ethane
  supply and transportation services for petrochemical customers, as well as transports
  and stores natural gas and natural gas liquids; operates a chain of hotels; develops,
  manufactures, and markets a range of extrusion blow-molded and injection molded
  plastic containers; and manufactures commodities and differentiated plastic resins.
  The company markets its insurance products and services through a network of retail
  and wholesale brokers, independent agents, brokers, and managing general underwriters.
  Loews Corporation was incorporated in 1969 and is headquartered in New York, New
  York.
