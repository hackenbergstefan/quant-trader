longBusinessSummary: Accelleron Industries AG designs, manufactures, sells, and services
  turbochargers, fuel injection equipment, and digital solutions for heavy-duty applications.
  The company operates in two segments, Medium & Low Speed and High Speed. Its products
  are used in electric power generation, such as gas-fired engines for base load power,
  combined heat and power, balancing power, and back-up power; and onshore oil and
  gas, including gas-fired engines driving compressor stations for gas pipelines,
  as well as in marine and off-highway applications. The company has operations in
  Asia, the Middle East, Africa, Japan, China, the Americas, the United States, Europe,
  and Switzerland. Accelleron Industries AG was founded in 1924 and is headquartered
  in Baden, Switzerland.
