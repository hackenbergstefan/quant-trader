longBusinessSummary: Aflac Incorporated, through its subsidiaries, provides supplemental
  health and life insurance products. It operates in two segments, Aflac Japan and
  Aflac U.S. The Aflac Japan segment offers cancer, medical, nursing care, whole life,
  and GIFT insurance products, as well as WAYS and child endowment, and Tsumitasu
  insurance products in Japan. Its Aflac U.S. segment provides accident, disability,
  cancer, critical illness, hospital indemnity, dental, vision, and life insurance
  products in the United States. The company also provides hearing, final expense,
  pet, Medicare supplement, supplemental dental and vision, short-term disability,
  and absence management insurance products, as well as cafeteria plans. It sells
  its products to individuals, families, and business owners through individual, independent
  corporate, and affiliated corporate agencies; banks; independent associates/career
  agents; and brokers. Aflac Incorporated was founded in 1955 and is headquartered
  in Columbus, Georgia.
