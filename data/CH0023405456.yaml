longBusinessSummary: Avolta AG operates as a travel retail company in Europe, the
  Middle East, Africa, North America, Latin America, and the Asia Pacific. It offers
  perfumes and cosmetics, food and beverages, wines and spirits, luxury goods, fuel,
  electronics, literature, publications, toys and souvenirs, soft drinks, packaged
  food, travel accessories, personal items, newspapers, magazines, books, watches
  and jewelry, sunglasses, destination, and other products; and confectionery and
  catering, textile, leather, luggage, and tobacco and related products. The company
  operates general travel retail shops under the Dufry, World Duty Free, Hellenic
  Duty Free, Autogrill, and HMSHost brands; and convenience stores under the Hudson
  brand. It operates duty-free and duty-paid shops, restaurants, and hybrid concepts
  located at airports, border, downtown and hotel shops, railway stations, cruise
  liners and ferries, seaports, and motorways. The company was formerly known as Dufry
  AG and changed its name to Avolta AG in November 2023. Avolta AG was incorporated
  in 1865 and is headquartered in Basel, Switzerland.
