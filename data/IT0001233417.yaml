longBusinessSummary: A2A S.p.A. engages in the production, sale, and distribution
  of gas and electricity, and district heating in Italy and internationally. It generates
  electricity through hydroelectric, thermoelectric, photovoltaic, and wind plants;
  and sells and distributes gas. The company also engages in the production and sale
  of heat produced through district heating networks; waste management activities,
  including collection and street sweeping, treatment, disposal, and recovery of materials
  and energy; and the construction and management of integrated waste disposal plants
  and systems. In addition, it offers integrated water cycle management services;
  and technical consultancy services relating to energy efficiency certificates. Further,
  the company is involved in the management of public lighting systems and street
  lights, and water purification and sewer activities, as well as offers garbage collection,
  street sweeping, video surveillance, energy efficiency, and electric mobility services.
  A2A S.p.A. is headquartered in Milan, Italy.
