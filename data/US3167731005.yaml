longBusinessSummary: 'Fifth Third Bancorp operates as the bank holding company for
  Fifth Third Bank, National Association that provides a range of financial products
  and services in the United States. It operates through three segments: Commercial
  Banking, Consumer and Small Business Banking, and Wealth and Asset Management. The
  Commercial Banking segment offers credit intermediation, cash management, and financial
  services; lending and depository products; and cash management, foreign exchange
  and international trade finance, derivatives and capital markets services, asset-based
  lending, real estate finance, public finance, commercial leasing, and syndicated
  finance for business, government, and professional customers. Its Consumer and Small
  Banking segment engages in the provision of a range of deposit and loan products
  to individuals and small businesses; residential mortgage activities, including
  the origination, retention and servicing of residential mortgage loans, sales and
  securitizations of loans, and associated hedging activities; home equity loans and
  lines of credit, credit cards, automobile and other indirect lending, and other
  consumer lending services; and home improvement and solar energy installation loans
  through contractors and installers. The Wealth and Asset Management segment provides
  various wealth management services, such as wealth planning, investment management,
  banking, insurance, trust, and estate services for individuals, companies, and not-for-profit
  organizations; retail brokerage services for individual clients; and advisory services
  for institutional clients. Fifth Third Bancorp was founded in 1858 and is headquartered
  in Cincinnati, Ohio.'
