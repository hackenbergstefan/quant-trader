longBusinessSummary: Alstom SA provides solutions for rail transport industry in Europe,
  the Americas, the Asia Pacific, the Middle East, Central Asia, and Africa. The company
  offers rolling stock solutions comprising people movers and monorails, light rails,
  metros, commuter and regional trains, high-speed trains, and locomotives; asset
  optimization, connectivity, and security and city mobility solutions; and signaling
  products, such as urban, mainline, and freight and mining signaling. It also provides
  APM, monorail, tram, metro, and main line systems; and tracklaying and track, catenary
  free and ground feeding, electrification, cybersecurity, and engineering consultancy
  solutions, as well as electromechanical equipment. In addition, the company offers
  rail maintenance, modernization, overhaul, parts, repair and overhauls, and support
  services. Further, it provides various components, including bogies, motors, dampers,
  brake friction products, switchgears, traction and auxiliary converters, transformers,
  green traction solutions, interiors, and train control and information systems.
  The company offers its products and solutions to original equipment manufacturers,
  operators, and asset owners. Alstom SA was founded in 1928 and is based in Saint-Ouen,
  France.
