longBusinessSummary: Avery Dennison Corporation operates as a materials science and
  digital identification solutions company in the North America, Europe, the Middle
  East, North Africa, Asia, and Latin America. It offers pressure-sensitive label
  materials, which consist of papers, plastic films, and metal foils; performance
  tapes products, including mechanical fasteners, which are precision-extruded and
  injection-molded plastic devices; and other pressure-sensitive adhesive-based materials
  and converted products under the Fasson, JAC, and Avery Dennison brands. The company
  provides graphics and reflective products that include films and other products
  for the architectural, commercial sign, digital printing, and other related market
  segments; durable cast and reflective films to the construction, automotive, and
  fleet transportation markets; sign shops, commercial printers, and designers for
  pressure-sensitive materials; reflective films for traffic and safety applications;
  and pressure-sensitive vinyl and specialty materials for digital imaging, screen
  printing, and sign cutting applications under the Avery Dennison and Mactac brand
  names. In addition, it offers branding solutions, which include brand embellishments,
  graphic tickets, tags, labels, and sustainable packaging; information solutions,
  such as item-level RFID, visibility and loss prevention, price ticketing and marking,
  productivity and media, and brand protection and security solutions; and shelf-edge
  productivity and media solutions under the Vestcom brand names, as well as care,
  content, and country of origin compliance solutions. It serves home and personal
  care, apparel, general retail, e-commerce, logistics, food and grocery, pharmaceuticals,
  and automotive industries. The company was formerly known as Avery International
  Corporation and changed its name to Avery Dennison Corporation in 1990. The company
  was founded in 1935 and is headquartered in Mentor, Ohio.
