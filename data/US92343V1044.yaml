longBusinessSummary: Verizon Communications Inc., through its subsidiaries, engages
  in the provision of communications, technology, information, and streaming products
  and services to consumers, businesses, and governmental entities worldwide. It operates
  in two segments, Verizon Consumer Group (Consumer) and Verizon Business Group (Business).
  The Consumer segment provides wireless services across the wireless networks in
  the United States under the Verizon and TracFone brands and through wholesale and
  other arrangements; and fixed wireless access (FWA) broadband through its wireless
  networks, as well as related equipment and devices, such as smartphones, tablets,
  smartwatches, and other wireless-enabled connected devices. The segment also offers
  wireline services in the Mid-Atlantic and Northeastern United States, as well as
  Washington D.C. through its fiber-optic network, Verizon Fios product portfolio,
  and a copper-based network. The Business segment provides wireless and wireline
  communications services and products, including FWA and wireline broadband, advanced
  communication services, corporate networking, security and managed network, local
  and long-distance voice, and network access services to deliver various IoT services
  and products to businesses, government customers, and wireless and wireline carriers
  in the United States and internationally. The company distributes its products and
  services through direct channels, company-operated stores, digital and omnichannel
  platforms, indirect agents, business solution resellers, and national retailers.
  The company was formerly known as Bell Atlantic Corporation and changed its name
  to Verizon Communications Inc. in June 2000. Verizon Communications Inc. was incorporated
  in 1983 and is headquartered in New York, New York.
