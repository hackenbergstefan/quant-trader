longBusinessSummary: CVS Health Corporation provides health solutions in the United
  States. The Health Care Benefits segment offers traditional, voluntary, and consumer-directed
  health insurance products and related services, including medical, pharmacy, dental,
  and behavioral health plans; medical management capabilities; Medicare Advantage
  and Medicare Supplement plans; prescription drug plans (PDPs); and Medicaid health
  care management services. It serves employer groups, individuals, college students,
  part-time and hourly workers, health plans, health care providers, governmental
  units, government-sponsored plans, labor groups, and expatriates. The Health Services
  segment offers pharmacy benefit management solutions, including plan design and
  administration, formulary management, retail pharmacy network management, specialty
  and mail-order pharmacy, clinical services, disease management, medical spend management
  services, and pharmacy and other administrative services. It serves employers, insurance
  companies, unions, government employee groups, health plans, PDPs, Medicaid managed
  care plans, CMS, plans offered on public health insurance exchanges, and other sponsors
  of health benefit plans. The Pharmacy & Consumer Wellness segment sells prescription
  and over-the-counter drugs, consumer health and beauty products, personal care products,
  and other general merchandise products. This segment also distributes prescription
  drugs; and provides related pharmacy consulting and other ancillary services to
  care facilities and other care settings. It operates online retail pharmacy websites,
  retail specialty pharmacy stores, and compounding pharmacies, as well as branches
  for infusion and enteral nutrition services. The company was formerly known as CVS
  Caremark Corporation and changed its name to CVS Health Corporation in September
  2014. CVS Health Corporation was founded in 1963 and is headquartered in Woonsocket,
  Rhode Island.
