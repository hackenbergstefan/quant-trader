longBusinessSummary: Mobimo Holding AG, together with its subsidiaries, operates as
  a real estate company in Switzerland. It operates in two segments, Real Estate and
  Development. The Real Estate segment engages in the portfolio management; purchase
  and sale of investment properties; initial letting and reletting of investment properties;
  sale of condominium; and property management, such as tasks and services of site
  management, property management, and facility management. The Development segment
  is involved in the development of investment properties, construction projects for
  third-party investors, and condominiums; acquisition of sites and building plots
  for development activities; construction projects; monitoring construction activity;
  and management of quality assurance process during the construction phase. The company
  was founded in 1999 and is headquartered in Lucerne, Switzerland.
