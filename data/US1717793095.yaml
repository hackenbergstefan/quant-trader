longBusinessSummary: Ciena Corporation, a network technology company, provides hardware,
  software, and services for various network operators in the Americas, Europe, the
  Middle East, Africa, the Asia Pacific, Japan, and India. It operates through Networking
  Platforms, Platform Software and Services, Blue Planet Automation Software and Services,
  and Global Services segments. The Networking Platforms segment consists optical
  networking, routing, and switching products and services. This segment products
  include the 6500 Packet-Optical Platform, Waveserver modular interconnect system,
  the 6500 Reconfigurable Line System, and coherent pluggable transceivers; and the
  3000 family of service delivery platforms and the 5000 family of service aggregation,
  as well as the 8100 Coherent Routing platforms and virtualization software. The
  Platform Software and Services segment offers navigator network control suite; and
  software subscription services, consulting, network migration and integration, installation
  and upgrade support services, and technical support solutions. The Blue Planet Automation
  Software and Services segment inventory management, orchestration, route optimization
  and analysis, and unified assurance and analytics software; and sells subscription,
  installation, support, consulting, and design services related to the Blue Planet
  automation platform. The Global Services segment provides services for advisory
  and enablement, implementation, and maintenance, support, and learning activities.
  Ciena Corporation was incorporated in 1992 and is headquartered in Fulton, Maryland.
