longBusinessSummary: 'RENK Group AG engages in the design, engineering, production,
  testing, and servicing of customized drive systems in Asia, Germany, the United
  States, Africa, Australia, Oceania, and other European and European Union countries.
  The company operates through three segments: Vehicle Mobility Solutions, Marine
  & Industry, and Slide Bearings. It offers single and dual engine gearboxes; marine
  gearboxes, clutches, and bearings; shaft generators; hybrid and electric, and onboard
  power grid solutions; transmissions, engines, final drives, suspension systems,
  and track tension; and electrification and hybrid mobility solutions. The company
  also provides helical, planetary, integral, vacuum, and clutch gearboxes; variable
  speed systems; and industrial gearboxes for mills, extruders, and hydropower plants.
  In addition, it offers slide bearings, couplings, and test systems. The company
  also provides engineering, condition monitoring, maintenance and modernization,
  and spare parts management services; mechanical and gear manufacturing, hardening,
  and metrology services; marine services, including evaluation and design of propulsion
  system, and power distribution and grid design; design of suspension for military
  vehicle; and spare parts management, contract manufacturing, and test systems. The
  company serves military vehicles, marine, civil maritime, cement and plastics production,
  and oil and gas industries, as well as customers in hydrogen, energy generation,
  carbon capture, utilization and storage, and industrial heat pump applications.
  RENK Group AG was founded in 1873 and is headquartered in Augsburg, Germany.'
