longBusinessSummary: 'Citigroup Inc., a diversified financial service holding company,
  provides various financial products and services to consumers, corporations, governments,
  and institutions. It operates through five segments: Services, Markets, Banking,
  U.S. Personal Banking, and Wealth. The Services segment includes treasury and trade
  solutions, which provides cash management, trade, and working capital solutions
  to multinational corporations, financial institutions, and public sector organizations;
  and securities services, such as cross-border support for clients, local market
  expertise, post-trade technologies, data solutions, and various securities services
  solutions. The Markets segment offers sales and trading services for equities, foreign
  exchange, rates, spread products, and commodities to corporate, institutional, and
  public sector clients; and market-making services, including asset classes, risk
  management solutions, financing, and prime brokerage. The Banking segment includes
  investment banking services comprising equity and debt capital markets-related strategic
  financing solutions; advisory services related to mergers and acquisitions, divestitures,
  restructurings, and corporate defense activities; and corporate lending consists
  of corporate and commercial banking. The U.S. Personal Banking segment provides
  proprietary and co-branded card portfolios; and traditional banking services to
  retail and small business customers. The Wealth segment offers financial services
  to high-net-worth clients through banking, lending, mortgages, investment, custody,
  and trust product offerings; professional industries, including law firms, consulting
  groups, accounting, and asset management; and affluent and high net worth clients.
  The company operates in North America, the United Kingdom, Japan, North and South
  Asia, Australia, Europe, the Middle East, and Africa. Citigroup Inc. was founded
  in 1812 and is headquartered in New York, New York.'
