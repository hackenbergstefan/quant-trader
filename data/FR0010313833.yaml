longBusinessSummary: 'Arkema S.A., together with its subsidiaries, manufactures and
  sells specialty materials in Europe, the United States, Canada, Mexico, China, Hong
  Kong, Taiwan, and internationally. It operates in three segments: Adhesive Solutions,
  Advanced Materials and Coating Solutions, and Intermediates. The company provides
  solutions for construction, renovation of buildings, and DIY; high performance adhesives
  for durable goods, and adhesive solutions for packaging and non-woven; and supplies
  technologies used in building activities for businesses and individuals, including
  sealants, tiles, flooring adhesives and waterproofing systems, and technologies
  used in automotive, textiles, glazing, flexible and rigid packaging, and hygiene
  markets. It also offers high performance polymers, such as specialty polyamides,
  PVDF, polyimides, fluorospecialties, and PEKK; and performance additives comprising
  interface agents combining specialty surfactants, molecular sieves, organic peroxides,
  thiochemicals, and hydrogen peroxide. In addition, the company provides lightweighting,
  new energies, access to water, bio-based products, and recycling solutions for automotive
  and transportation sectors, oil and gas, renewable energies, consumer goods, electronics,
  construction, coatings, animal nutrition and water treatment. Further, it offers
  coating solutions, including EU/US acrylics and coating resins; coating additives,
  such as sartomer photocure resins, and coatex rheology additives and specialties;
  decorative paints, industrial coatings, and adhesives; and solutions for applications
  in the paper, superabsorbent, water treatment and oil and gas extraction, and 3D
  printing and electronics markets. Additionally, the company provides fluorogases
  and asia acrylics; and industrial intermediate chemicals for construction, refrigeration
  and air conditioning, automotive, coatings, and water treatment sectors. Arkema
  S.A. was incorporated in 2003 and is headquartered in Puteaux, France.'
