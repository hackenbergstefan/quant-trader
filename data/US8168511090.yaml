longBusinessSummary: 'Sempra engages in the regulated utilities business in the United
  States and Mexico. It operates through three segments: Sempra California, Sempra
  Texas Utilities, and Sempra Infrastructure. It also invests in and operates electric
  and gas utilities and other energy infrastructure that provides energy services
  to customers. The Sempra California segment provides natural gas and electric services
  to Southern California and part of central California. As of December 31, 2025,
  it offered electric services to approximately 3.6 million population and natural
  gas services to approximately 3.3 million population that covers 4,100 square miles.
  This segment owns and operates a natural gas distribution, transmission, and storage
  system that supplies natural gas. As of December 31, 2025, it served a population
  of 21.3 million covering an area of 24,000 square miles. The Sempra Texas Utilities
  segment engages in the regulated electricity transmission and distribution utility
  business. As of December 31, 2025, transmission system included approximately 18,418
  circuit miles of transmission lines; 1,333 transmission and distribution substations;
  interconnection to 230 third-party generation facilities totaling 63,670 MW; and
  distribution system included more than 4.1 million points of delivery and consisted
  of 127,398 circuit miles of overhead and underground lines. The Sempra Infrastructure
  segment develops, constructs, operates, and invests in energy infrastructure to
  help enable the access to cleaner energy in markets in the United States, Mexico,
  and internationally. The company was formerly known as Sempra Energy and changed
  its name to Sempra in May 2023. Sempra was incorporated in 1996 and is headquartered
  in San Diego, California.'
