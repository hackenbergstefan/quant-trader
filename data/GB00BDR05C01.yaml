longBusinessSummary: National Grid plc engages in the transmission and distribution
  of electricity and gas. It operates through UK Electricity Transmission, UK Electricity
  Distribution, New England, New York, National Grid Ventures, and Other segments.
  The UK Electricity Transmission segment provides electricity transmission networks
  in England and Wales. The UK Electricity Distribution segment offers electricity
  distribution services in east and west Midlands, Southwest of England, and South
  Wales. The New England segment provides electricity and gas supply and distribution,
  and high-voltage electricity transmission services in New England. The New York
  segment offers electricity and gas distribution, and electricity transmission services
  in New York. The National Grid Ventures segment provides transmission services through
  electricity interconnectors and LNG importation at the Isle of Grain. The Other
  segment engages in the leasing and sale of commercial property, as well as insurance
  activities in the United Kingdom. The company was founded in 1990 and is headquartered
  in London, the United Kingdom.
