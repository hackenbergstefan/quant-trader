longBusinessSummary: 'FLSmidth & Co. A/S provides flowsheet technology and service
  solutions for the mining industries in Denmark, the United States of America, Canada,
  Chile, Brazil, Peru, Australia, North and South America, Europe, the Middle East,
  Africa, and Asia. The company operates through three segments: Service; Products;
  and Pumps, Cyclones & Valves (PC&V). The company offers mineral processing equipment,
  such as hydrocyclones and REFLUX classifiers; cone and roll crushers, crushing stations,
  gyratory and jaw crushers, and sizers; centrifuges, thickeners and clarifiers, and
  filters; apron and belt feeders, buffalo and vibrating feeders, mine hoists, hybrid
  apron feeders, and mine shaft equipment; and attrition scrubbers, column and forced-air
  flotation cells, mixed and self-aspirated flotation cells, and REFLUX and coarse
  flotation cells. It also includes ball and vertical fine grinding mills, and SAG
  and AG mills; laboratory equipment, such as automated laboratories, crushing, dividing,
  drying, drying, pulverizing, and thermogravimetric analysis equipment; carbon ADR
  plants and regeneration kilns, precious metals electrowinning and refinery, gravity
  concentration, mercury retort and abatement systems, Merrill Crowe systems, and
  cyanide leaches; flash dryers and heaters, gas suspension calciners, gear drive
  rotary and temperature shaft kilns, indirectly heated rotary kilns, multiple hearth
  furnaces, and rotary dryers; screening equipment; and froth, heavy duty, high pressure,
  large solids, medium duty, mills, recessed impeller, split case, sump pumps, and
  valves. In addition, the company offers consumables; digital services; mining education;
  minerals testing laboratories; mining field services; process automation; service
  centers; spare parts; and upgrade, rebuild, and exchange services. The company was
  formerly known as FLS Industries and changed its name to FLSmidth & Co. A/S in January
  2005. The company was founded in 1882 and is headquartered in Copenhagen, Denmark.'
