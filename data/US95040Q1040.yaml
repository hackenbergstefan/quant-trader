longBusinessSummary: Welltower Inc., an S&P 500 company, is positioned at the center
  of the silver economy, focusing on rental housing for aging seniors across the United
  States, United Kingdom, and Canada. Their portfolio of 2,500+ seniors and wellness
  housing communities are positioned at the intersection of housing and hospitality,
  creating vibrant communities for mature renters and older adults. They believe our
  real estate portfolio is unmatched, located in highly attractive micro markets with
  stunning built environments. Yet, Welltower is an unusual real estate organization
  as they view themselves as an operating company in a real estate wrapper, driven
  by highly aligned partnerships and an unconventional culture. Through their disciplined
  approach to capital allocation powered by their Data Science platform and superior
  operating results driven by the Welltower Business System - their end-to-end operating
  platform - they aspire to deliver long-term compounding of per share growth for
  their existing investors, North Star. Welltower Inc. was incorporated in 1970 in
  Delaware and is based in Toledo, Ohio.
