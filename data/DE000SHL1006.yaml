longBusinessSummary: 'Siemens Healthineers AG, through its subsidiaries, develops,
  manufactures, and sells a range of diagnostic and therapeutic products and services
  to healthcare providers in Germany, the United States, rest of Europe, CIS, Africa,
  the Middle East, the Americas, the Asia Pacific, Japan, and China. It operates in
  four segments: Imaging, Diagnostics, Varian, and Advanced Therapies. The Imaging
  segment offers magnetic resonance imaging, computed tomography, X-ray, molecular
  imaging, and ultrasound systems; and software solutions to support the reading and
  structured reporting of diagnostic images from different modalities. Its Diagnostics
  segment provides in-vitro diagnostic products and services to healthcare providers
  in the fields of general and specialty laboratory, and point-of-care diagnostics;
  and workflow solutions for laboratories and informatics products. The Varian segment
  offers microwave, cryoablation, and embolization technologies, as well as clinical
  professional services for cancer care that support oncology departments in hospitals
  and clinics; and customized support for cancer care operations. Its Advanced Therapies
  segment provides products that are designed to support image-guided minimally invasive
  clinical procedures in various areas, such as cardiology, neurology, and oncology;
  angiography systems and mobile C-arms; and AI-powered clinical applications. It
  also offers essential technical customer service, such as maintenance and repair;
  spare parts; medical equipment performance management; training; clinical education
  and e-learning; planning and design; financing; asset management; and managed departmental
  services for laboratories and healthcare facilities, as well as healthcare consulting,
  products, and services. It has strategic partnership with IFS and Novo. The company
  was founded in 1896 and is headquartered in Forchheim, Germany. Siemens Healthineers
  AG is a subsidiary of Siemens Aktiengesellschaft.'
