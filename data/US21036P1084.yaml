longBusinessSummary: Constellation Brands, Inc., together with its subsidiaries, produces,
  imports, markets, and sells beer, wine, and spirits in the United States, Canada,
  Mexico, New Zealand, and Italy. It offers beer under the Corona Extra, Corona Familiar,
  Corona Sunbrew, Corona Light, Corona Non-Alcoholic, Corona Premier, Modelo Especial,
  Modelo Chelada, Modelo Negra, Modelo Spiked Aguas Frescas, Modelo Oro, Modelo Noche
  Especial, Victoria, Vicky Chamoy, and Pacifico brand names. The company also offers
  wine under the Sea Smoke, Schrader Cellars, Kim Crawford, Mount Veeder, Ruffino,
  My Favorite Neighbor, Robert Mondavi Winery, and The Prisoner Wine Company brand
  names; and spirits under the Casa Noble, High West, Mi CAMPO, and Nelson's Green
  Brier brand names. Additionally, it offers a spirit-based, ready-to-drink alcoholic
  beverage under the SpikedAde brand. It provides its products to wholesale distributors,
  retailers, and state alcohol beverage control agencies. Constellation Brands, Inc.
  was founded in 1945 and is headquartered in Rochester, New York.
