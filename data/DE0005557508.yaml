longBusinessSummary: Deutsche Telekom AG, together with its subsidiaries, provides
  integrated telecommunication services worldwide. It operates through Germany, United
  States, Europe, Systems Solutions, and Group Development segments. The company offers
  fixed-network services, including voice and data communication services based on
  fixed-network and broadband technology; and sells terminal equipment and other hardware
  products, as well as services to resellers. It also provides mobile voice and data
  services to consumers and business customers; sells mobile devices and other hardware
  products; and sells mobile services to resellers and to companies that buys and
  markets network services to third parties, such as mobile virtual network operators.
  In addition, the company offers internet services; internet-based TV products and
  services; and information and communication technology systems for multinational
  corporations and public sector institutions with an infrastructure of data centers
  and network services. Further, it provides wireless communications services; and
  cloud services, digital solutions, and security and advisory solutions. The company
  has mobile and broadband customers, as well as fixed-network lines. Deutsche Telekom
  AG was founded in 1995 and is headquartered in Bonn, Germany.
