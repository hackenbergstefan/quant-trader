longBusinessSummary: Mercedes-Benz Group AG operates as an automotive company in Europe,
  Germany, North America, the United States, Asia, China, and internationally. It
  operates through Mercedes-Benz Cars, Mercedes-Benz Vans, and Mercedes-Benz Financial
  Services segments. The company develops, manufactures, and sells cars and vans under
  the Mercedes-Benz, Mercedes-AMG, Mercedes-Maybach, G-Class brands, as well as related
  spare parts and accessories. It also provides financing, leasing, vehicle subscription
  and rental, fleet management, insurance, and digital services related to charging
  electric vehicles. The company was formerly known as Daimler AG and changed its
  name to Mercedes-Benz Group AG in February 2022. Mercedes-Benz Group AG was founded
  in 1886 and is headquartered in Stuttgart, Germany.
