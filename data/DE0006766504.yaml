longBusinessSummary: Aurubis AG processes metal concentrates and recycling materials
  in Germany. The company engages in processing of scrap metals, organic and inorganic
  metalbearing recycling raw materials, and industrial residues. It also offers copper
  cast rods and specialty wires, shapes, bars and profiles, industrial rolled products,
  and architectural rolled products. In addition, the company produces gold, silver,
  tin, lead, lead-bismuth alloy, lead-antimony litharge, tellurium metals, and tellurium
  dioxide. Further, the company engages in the recycling of copper and alloy scrap;
  printed circuit board and electronic scrap; mixed heavy metal fractions and shredder;
  residues, slimes, and sludges; preciouse metal recycling material; tin scrap; and
  copper iron and bimetal scrap. Additionally, it provides sulfuric acid, iron-silicate,
  smelter intermediates, and selenium, as well as produces various products from purchased
  copper and copper alloy scrap, electronic scrap, and industrial residues. The company
  was formerly known as Norddeutsche Affinerie AG and changed its name to Aurubis
  AG in April 2009. Aurubis AG was incorporated in 1866 and is headquartered in Hamburg,
  Germany.
