longBusinessSummary: 'Pearson plc provides educational courseware, assessments, and
  services in the United Kingdom, the United States, Canada, the Asia Pacific, other
  European countries, and internationally. It operates through five segments: Assessment
  & Qualifications, Virtual Learning, English Language Learning, Enterprise Learning
  & Skills, and Higher Education. The Assessment & Qualifications segment offers pearson
  professional assessments, US student assessment, clinical assessment, UK GCSE, and
  A levels and international academic qualifications and associated courseware, including
  the English-speaking Canadian and Australian K-12 businesses, and PDR. The Virtual
  Learning segment provides virtual schools and online program management. The English
  Language Learning segment offers Pearson test of English, institutional courseware,
  and English online solutions. The Enterprise Learning & Skills segment provides
  vocational qualifications, GED, TalentLens, Faethm, Credly, Pearson College, and
  Enterprise content and training. The Higher Education segment engages in the US,
  Canadian, and international higher education courseware businesses. Pearson plc
  was founded in 1844 and is headquartered in London, the United Kingdom.'
