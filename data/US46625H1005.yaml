longBusinessSummary: 'JPMorgan Chase & Co. operates as a bank and financial holding
  company in the United States, rest of North America, Europe, the Middle East, Africa,
  the Asia Pacific, Latin America, and the Caribbean. It operates in three segments:
  Consumer & Community Banking, Commercial & Investment Bank, and Asset & Wealth Management.
  The company offers deposit, investment and lending products, and cash management;
  mortgage origination and servicing activities; residential mortgages and home equity
  loans; and credit cards, payment solutions, travel services, merchant offers, lifestyle
  benefits, auto loans, and leases to consumers and small businesses through bank
  branches, ATMs, and digital and telephone banking. It also provides investment banking,
  market-making, financing, custody, and securities products and services; corporate
  strategy and structure advisory, equity and debt market capital-raising, and loan
  origination and syndication services; cash and derivative instruments, risk management
  solutions, prime brokerage, clearing, and research; and fund services, liquidity
  and trading services, and data solutions products for large corporations, financial
  institutions, merchants, start-ups, small and midsized companies, local governments,
  municipalities, nonprofits, and commercial real estate clients. In addition, the
  company offers multi-asset investment management solutions in equities, fixed income,
  alternatives, and money market funds to institutional clients and retail investors;
  retirement products and services, estate planning, lending, deposits, and investment
  management products to high-net-worth clients; and financial transaction processing.
  JPMorgan Chase & Co. was founded in 1799 and is headquartered in New York, New York.'
