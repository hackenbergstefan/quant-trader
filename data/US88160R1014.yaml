longBusinessSummary: Tesla, Inc. designs, develops, manufactures, leases, and sells
  electric vehicles, and energy generation and storage systems in the United States,
  China, and internationally. The company operates in two segments, Automotive; and
  Energy Generation and Storage. The company offers electric vehicles, as well as
  sells automotive regulatory credits; and non-warranty maintenance services and collision,
  automotive insurance services, as well as part sales and retail merchandise sale.
  It also provides sedans and sport utility vehicles through direct and used vehicle
  sales, a network of Tesla Superchargers, and in-app upgrades; purchase financing
  and leasing services; services for electric vehicles through its company-owned service
  locations and Tesla mobile service technicians; and vehicle limited warranties and
  extended service plans. In addition, the company engages in the design, manufacture,
  installation, sale, and leasing of solar energy generation and energy storage products,
  and related services to residential, commercial, and industrial customers and utilities
  through its website, stores, and galleries, as well as through a network of channel
  partners. Further, it provides services and repairs to its energy product customers,
  including under warranty and extended service plans; and various financing options
  to its residential customers; lithium-ion battery energy storage products, such
  as Powerwall and Megapack; energy generation products, including solar panels and
  solar roof; self-driving development and artificial intelligence software, vehicle
  control and infotainment software, and battery and powertrain. The company was formerly
  known as Tesla Motors, Inc. and changed its name to Tesla, Inc. in February 2017.
  Tesla, Inc. was incorporated in 2003 and is headquartered in Austin, Texas.
