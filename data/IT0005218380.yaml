longBusinessSummary: 'Banco BPM S.p.A. provides banking and financial products and
  services to individual, business, and corporate customers in Italy. The company
  operates through six segments: Commercial; Corporate and Investment Banking; Asset
  Management and Insurance; Other Partnerships; Finance; and Corporate Centre. It
  offers current account and digital services; safety deposit boxes; home, personal,
  property, and car and vehicle insurances; credit, telepass family, debit, payment,
  and prepaid cards; T3 Trading, web, and T3 mobile platforms; home and surrogacy
  mortgagees; long term car rental; personal loans, including salary-backed loan;
  calculate mortgage payments; mutual funds, insurance investment, saving, and certificate
  products; and supplementary pension securities comprising true life secure retirement
  and anima arts and crafts pension funds. The company also provides business current
  accounts; green and sustainable, ordinary financing, dedicated, subsidized, and
  condominium credit financing products; international payments and collections, trade
  and export finance, and digital international solutions; license plate, equipment,
  real estate, renewable energy, operating, and nautical leasing services; POS receipts;
  and RIBA, MAV and SDD collections. In addition, it offers multi-risk, personal,
  property, and motor vehicle insurance; corporate cards; digital services; foreign
  risk coverage, exchange risk hedging, and interest rate risk coverage; investment
  banking, including equity capital market, mergers and acquisitions, securitization,
  and debt capital markets; documentary box office receipts, electronic collections
  abroad, international guarantees, and pro-soluto assignment of export credits services;
  structured finances; and collection and payment services. The company was formerly
  known as Banco Popolare Societa Cooperativa Scarl and changed its name to Banco
  BPM Società per Azioni in January 2017. Banco BPM S.p.A. was founded in 2017 and
  is headquartered in Verona, Italy.'
