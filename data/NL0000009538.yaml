longBusinessSummary: Koninklijke Philips N.V. operates as a health technology company
  in North America, the Greater China, and internationally. It operates through Diagnosis
  & Treatment, Connected Care, and Personal Health segments. The company provides
  diagnostic imaging solutions, includes ultrasound business unit, magnetic resonance
  imaging, computed tomography, and diagnostic x-ray; Image Guided Therapy, including
  image guided therapy systems and image guided therapy devices. It also offers monitoring,
  enterprise informatics, and sleep and respiratory care, as well as personal health.
  Koninklijke Philips N.V. has strategic alliance with WellSpan Health to advanced
  imaging and diagnostics technology products and platforms. The company was formerly
  known as Koninklijke Philips Electronics N.V. and changed its name to Koninklijke
  Philips N.V. in May 2013. Koninklijke Philips N.V. was founded in 1891 and is headquartered
  in Amsterdam, the Netherlands.
