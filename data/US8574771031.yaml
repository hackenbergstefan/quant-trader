longBusinessSummary: State Street Corporation provides various financial products
  and services to institutional investors. It offers custody, accounting, and fund
  administration services for traditional and alternative assets, as well as multi-asset
  class investments; recordkeeping, client reporting, and investment book of record,
  transaction management, loans, cash, derivatives, and collateral services; investor
  services operations outsourcing; performance, risk, and compliance analytics; financial
  data management to support institutional investors; foreign exchange, brokerage,
  and other trading services; securities finance, such as prime services products;
  and deposit and short-term investment facilities. The company also provides the
  State Street Alpha platform that combines portfolio management, trading and execution,
  analytics and compliance tools, and advanced data aggregation and integration with
  other industry platforms and providers; front-office technology that automates and
  simplifies the institutional investment process comprising portfolio management
  and risk analytics, trading, and post-trade settlement with integrated compliance
  and managed data; investment management solutions; and portfolio management, trading
  compliance, and manager/sponsor communication. In addition, it offers investment
  management solutions, such as strategies across equity, fixed income, cash, multi-asset,
  and alternatives; and ETFs, custom indexed, managed funds, and mandates. The company
  provides its products and services to mutual funds, collective investment funds
  and other investment pools, corporate and public retirement plans, insurance companies,
  wealth managers, investment managers, foundations, and endowments. The company was
  founded in 1792 and is headquartered in Boston, Massachusetts.
