longBusinessSummary: Banco de Sabadell, S.A. provides banking products and services
  in Spain, the United Kingdom, and Mexico. The company offers retail banking products,
  including investment products and medium- and long-term finance, such as consumer
  loans, mortgages, leasing and rental services, as well as other short-term finance;
  and cards and insurance products to individuals for personal use. It also provides
  financial products and services comprising investment and financing products, which
  include working capital products, revolving loans, and medium- and long-term finance;
  and custom structured finance and capital market solutions, and specialized advice
  for businesses; and cards and PoS terminals, as well as import and export and personalized
  expert advice services to companies and self-employed persons. In addition, the
  company offers corporate banking services consisting of financial and advisory solutions
  to large corporations and financial institutions; and structured finance, treasury,
  investment banking, trading, and custody and research services. Further, it provides
  current and savings accounts, loans, credit cards, and mortgages; and banking and
  financial services for corporate and commercial banking. Banco de Sabadell, S.A.
  was founded in 1881 and is based in Sabadell, Spain.
