longBusinessSummary: TransDigm Group Incorporated designs, produces, and supplies
  aircraft components in the United States and internationally. The Power & Control
  segment offers mechanical/electro-mechanical actuators and controls, ignition systems
  and engine technology, specialized pumps and valves, power conditioning devices,
  specialized AC/DC electric motors and generators, batteries and chargers, databus
  and power controls, sensor products, switches and relay panels, hoists, winches
  and lifting devices, cargo loading and handling and delivery systems, and electronic
  components. Its Airframe segment provides engineered latching and locking devices,
  engineered rods, engineered connectors and elastomer sealing solutions, cockpit
  security components and systems, cockpit displays, lavatory components, seat belts
  and safety restraints, engineered and customized interior surfaces and related components,
  thermal protection and insulation products, lighting and control technology, parachutes,
  specialized flight, wind tunnel and jet engine testing services and equipment, and
  testing and instrumentation solutions, as well as engineered audio, radio, and antenna
  systems. The Non-Aviation segment offers seat belts and safety restraints; mechanical/electromechanical
  actuators and controls; hydraulic/electromechanical actuators and fuel valves; refueling
  systems; and turbine controls. It serves engine and power system and subsystem suppliers,
  airlines, third party maintenance suppliers, military buying agencies, and repair
  depots; airframe manufacturers, cabin system and subsystem suppliers, airlines,
  and maintenance suppliers; and off-road vehicle and subsystem suppliers, child restraint
  system suppliers, and satellite and space system suppliers, as well as manufacturers
  of heavy equipment. The company was formerly known as TD Holding Corporation and
  changed its name to TransDigm Group Incorporated in January 2006. The company was
  founded in 1993 and is headquartered in Cleveland, Ohio.
