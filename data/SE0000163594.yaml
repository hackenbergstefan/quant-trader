longBusinessSummary: 'Securitas AB (publ) provides security services in North America,
  Europe, Latin America, Africa, the Middle East, Asia, and Australia. The company
  operates through three segments: Securitas North America, Securitas Europe, and
  Securitas Ibero-America. It provides intelligence services, such as risk intelligence;
  safety and security services, including aviation security, fire and safety services,
  mobile security services, and on-site guarding; operation management security services,
  such as remote video solutions, smart security, and track and trace services; advisory
  security services comprising corporate risk management; and technology security
  services, which include electronic security. The company also operates operation
  centers. Securitas AB (publ) was founded in 1934 and is headquartered in Stockholm,
  Sweden.'
