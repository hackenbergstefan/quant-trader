longBusinessSummary: 'Genuine Parts Company distributes automotive and industrial
  replacement parts. The company operates in three segments: North America Automotive
  Parts Group, International Automotive Parts Group, and Industrial Parts Group. It
  distributes automotive replacement parts, accessories, tools, equipment, and related
  solutions for hybrid and electric vehicles, trucks, buses, motorcycles, farm equipment,
  and heavy-duty equipment. The company also offers replacement parts, including brakes,
  batteries, filters, engine components, and fluids; specialized services, such as
  paint mixing, hydraulic hose assembly, battery testing, and key cutting; and accessories
  and specialty equipment for automotive and heavy-duty vehicles, as well as tools
  and diagnostic devices for repair and maintenance. In addition, it provides independent
  repair shops and auto care centers under the NAPA brand, and offers technical expertise
  and training programs to customers. Further, the company provides bearings, seals,
  and gaskets; hose, fittings, hydraulics, and pneumatics components; abrasives, adhesives,
  sealants, and tape; pumps and power transmission; tools and testing equipment; electrical
  supplies and safety products; and chemicals and janitorial supplies. Additionally,
  it offers inventory management; vendor-managed inventory; asset repair and tracking,
  including radio frequency identification; and specialized repair services for gearboxes,
  fluid power systems, pumps, drive shafts, electrical panels, and hoses and gaskets.
  The company was incorporated in 1928 and is headquartered in Atlanta, Georgia.'
