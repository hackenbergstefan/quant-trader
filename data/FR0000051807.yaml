longBusinessSummary: Teleperformance SE, together with its subsidiaries, operates
  as a digital business services company in France and internationally. The company
  operates in Core Services and Specialized Services segments. The company offers
  customer relationship, technical assistance, and customer acquisition services;
  business processes management, and back office and digital platform services; online
  interpretation, visa application management, health management, recruitment process
  outsourcing advisory and assistance, and accounts receivable credit management services.
  It also provides digital CX, trust and safety, artificial intelligence, real-time
  speech understanding, StoryfAI application, TP microservices, and video CX; back-office
  processing, integrated sales, finance and accounting, smartshoring, work-at-home,
  multilingual services, ad sales, and rebadging solutions; advanced analytics, business
  process optimization, business transformation consulting, and technology services;
  and claims management, collection services, interpretation and translation, recruitment
  process outsourcing, visa and consular services, and healthcare support. The company
  serves automotive, energy and utilities, media, government, technology, travel,
  hospitality, cargo, banking and financial services, healthcare, insurance, retail
  and e-commerce, telecom, and video games industries. The company was incorporated
  in 1910 and is based in Paris, France.
