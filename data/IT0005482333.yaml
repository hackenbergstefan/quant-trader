longBusinessSummary: Technoprobe S.p.A., together with its subsidiaries, produces
  and sells electronic circuits in Italy, Asia, the United States, and rest of Europe.
  The company provides mechanical interfaces for electrical contacting of hybrid circuits
  and semiconductor devices; and engages in the design, development, and production
  of probe cards for testing the operation of chips. Its products are used in digital
  data and 5G, IoT, data center, automotive and self-driving car, telecommunications
  and media, industry and aerospace, and consumer electronics applications. Technoprobe
  S.p.A. was founded in 1993 and is headquartered in Cernusco Lombardone, Italy. Technoprobe
  S.p.A. operates as a subsidiary of T- Plus S.P.A.
