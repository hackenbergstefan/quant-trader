longBusinessSummary: RATIONAL Aktiengesellschaft engages in the development, production,
  and sale of cooking systems for industrial kitchens in Germany, Austria, Switzerland,
  United States, Canada, Mexico, China, Japan, and South Korea. The company offers
  iCombi Pro; iCombi Classic; combi ovens; iVario Pro, a multi-functional cooking
  system; The iHexagon; and ConnectedCooking, a digital kitchen management solution.
  It also provides accessories, care products, service parts, and services. The company
  serves restaurants and hotels; catering, such as company canteens, hospitals, schools,
  universities, military facilities, prisons, and retirement homes; and quick service
  restaurants, caterers, supermarkets, bakeries, snack outlets, butchers' shops, service
  stations, and delivery services. It sells its products through independent distribution
  partners. The company was founded in 1973 and is headquartered in Landsberg am Lech,
  Germany.
