longBusinessSummary: Norfolk Southern Corporation, together with its subsidiaries,
  engages in the rail transportation of raw materials, intermediate products, and
  finished goods in the United States. The company transports agriculture, forest,
  and consumer products comprising soybeans, wheat, corn, fertilizers, livestock and
  poultry feed, food products, food oils, flour, sweeteners, ethanol, lumber and wood
  products, pulp board and paper products, wood fibers, wood pulp, beverages, and
  canned goods; chemicals, including sulfur and related chemicals, petroleum products
  comprising crude oil, chlorine and bleaching compounds, plastics, rubber, industrial
  chemicals, chemical wastes, sand, and natural gas liquids; metals and construction
  materials, such as steel, aluminum products, machinery, scrap metals, cement, aggregates,
  minerals, clay, transportation equipment, and military-related products; and automotive,
  including finished motor vehicles and automotive parts, as well as coal. It also
  transports overseas freight through various Atlantic and Gulf Coast ports; and operates
  an intermodal network. Norfolk Southern Corporation was incorporated in 1980 and
  is headquartered in Atlanta, Georgia.
