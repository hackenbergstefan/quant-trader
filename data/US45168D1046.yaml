longBusinessSummary: 'IDEXX Laboratories, Inc. develops, manufactures, and distributes
  products for the companion animal veterinary, livestock and poultry, dairy, and
  water testing industries in the United States and internationally. It operates through
  three segments: Companion Animal Group; Water Quality Products; and Livestock, Poultry
  and Dairy. The company offers point-of-care diagnostic solutions, blood and urine
  chemistry, hematology, immunoassay, urinalysis, cytology/morphology, and coagulation
  analyzers; and SNAP rapid assays test kits. It also provides commercial reference
  laboratory diagnostic and consulting services to veterinarians; veterinary consultation,
  telemedicine, and advisory services, including radiology, dental radiography, cardiology,
  internal medicine, and ultrasound consulting; Colilert, Colilert-18, and Colisure
  tests, which detect the presence of total coliforms and E. coli in water; Enterolert,
  Pseudalert, Filta-Max and Filta-Max xpress, Legiolert, Quanti-Tray products, and
  Tecta system instruments; UV Viewer Plus, a UV light cabinet which aids in the visual
  interpretation of fluorescent-based water tests; and veterinary software and services
  for independent veterinary clinics and corporate groups. In addition, the company
  offers diagnostic tests, services, and related instrumentation to manage the health
  status of livestock and poultry; human medical diagnostic products and services;
  and VetConnect PLUS, a cloud-based technology that enables veterinarians to access
  and analyze patients, as well as operates VetLab Station. It markets its products
  through marketing, customer service, sales, and technical service groups, as well
  as through independent distributors and other resellers. IDEXX Laboratories, Inc.
  was incorporated in 1983 and is headquartered in Westbrook, Maine.'
