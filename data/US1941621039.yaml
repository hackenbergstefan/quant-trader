longBusinessSummary: 'Colgate-Palmolive Company, together with its subsidiaries, manufactures
  and sells consumer products in the United States and internationally. It operates
  through two segments: Oral, Personal and Home Care; and Pet Nutrition. The Oral,
  Personal and Home Care segment offers toothpaste, toothbrushes, mouthwash, bar and
  liquid hand soaps, shower gels, shampoos, conditioners, deodorants and antiperspirants,
  skin health products, dishwashing detergents, fabric conditioners, household cleaners,
  and other related items. This segment markets and sells its products under the Colgate,
  Palmolive, Darlie, elmex, hello, meridol, Sorriso, Tom''s of Maine, EltaMD, Filorga,
  Irish Spring, Lady Speed Stick, PCA SKIN, Protex, Sanex, Softsoap, Speed Stick,
  Ajax, Axion, Fabuloso, Murphy, Soupline, and Suavitel brands to a range of traditional
  and eCommerce retailers, wholesalers, and distributors, as well as dentists and
  skin health professionals. It also offers pharmaceutical products for dentists and
  other oral health professionals. The Pet Nutrition segment offers pet nutrition
  products for everyday nutritional needs under the Hill''s Science Diet brand; and
  a range of therapeutic pet products to help nutritionally support dogs and cats
  in different stages of health under the Hill''s Prescription Diet brand; and a fresh
  pet food sold to pet specialty and other retailers in Australia under Prime100 brand.
  This segment markets and sells its products through pet supply retailers, veterinarians,
  and eCommerce retailers. Colgate-Palmolive Company was founded in 1806 and is headquartered
  in New York, New York.'
