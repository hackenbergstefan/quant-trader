longBusinessSummary: 'Fresnillo plc mines, develops, and produces non-ferrous minerals
  in Mexico. It operates through seven segments: Fresnillo, Saucito, Ciénega, Herradura,
  Noche Buena, San Julián, and Juanicipio. The company primarily explores for silver,
  gold, lead, and zinc concentrates. Its projects include the Fresnillo silver mine
  located in the state of Zacatecas; Saucito mine situated in the state of Zacatecas;
  Ciénega mine located in the state of Durango; Herradura mine located in the state
  of Sonora; Noche Buena mine located in the state of Sonora; San Julián mine situated
  on the border of Chihuahua/Durango states; and Juanicipio mine located in the state
  of Zacatecas. The company also leases mining equipment; produces lead, silver and
  zinc concentrates and silver precipitates; produces gold/silver doré bars; mines
  projects; and provides exploration and administrative services. Fresnillo plc was
  founded in 1887 and is headquartered in Mexico City, Mexico. Fresnillo plc is a
  subsidiary of Industrias Peñoles, S.A.B. de C.V.'
