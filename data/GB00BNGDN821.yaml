longBusinessSummary: "Melrose Industries PLC, together with its subsidiaries, designs\
  \ and delivers aerospace components and systems for civil and defence markets in\
  \ the United Kingdom, rest of Europe, North America, and internationally. The company\
  \ operates through Engines and Airframes segments. The Engines segment offers structural\
  \ engineered components; parts repair; commercial and aftermarket contracts; engine\
  \ mount structures; fan cases and turbine cases; and shafts and rotating components\
  \ to engines original equipment manufacturers. The Airframes segment provides civil\
  \ and defence air frames, including lightweight composite and metallic structures;\
  \ electrical distribution systems and components; wing structures; empennage; fuselage;\
  \ electrical wiring interconnection systems (\x93EWIS\x94); landing gear and ice\
  \ protection systems; and aircraft transparencies to airframe original equipment\
  \ manufacturers. The company was formerly known as New Melrose Industries PLC and\
  \ changed its name to Melrose Industries PLC in November 2015. Melrose Industries\
  \ PLC was founded in 2003 and is headquartered in London, United Kingdom."
