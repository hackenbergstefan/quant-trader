longBusinessSummary: 'Ameren Corporation, together with its subsidiaries, operates
  as a public utility holding company in the United States. The company operates through
  four segments: Ameren Missouri, Ameren Illinois Electric Distribution, Ameren Illinois
  Natural Gas, and Ameren Transmission. It engages in the rate-regulated electric
  generation, transmission, and distribution business and natural gas transmission
  and distribution business. The company also generates electricity through coal,
  nuclear, and natural gas, as well as renewable energy, including hydroelectric,
  wind, methane gas, and solar energy centers. It serves residential, commercial,
  and industrial customers. Ameren Corporation was founded in 1881 and is headquartered
  in Saint Louis, Missouri.'
