longBusinessSummary: Caterpillar Inc. provides construction and mining equipment,
  off-highway diesel and natural gas engines, industrial gas turbines, and diesel-electric
  locomotives in the United States and internationally. The Construction Industries
  segment offers asphalt pavers, cold planers, compactors, forestry machines, material
  handlers, motor graders, pipelayers, road reclaimers, telehandlers, track-type tractors,
  and track and wheel excavators; backhoe, compact track, skid steer, track-type,
  and wheel loaders; and related parts and work tools. Its Resource Industries segment
  provides electric rope and hydraulic shovels, draglines, rotary drills, hard rock
  vehicles, mining trucks, wheel loaders, off-highway and articulated trucks, wide-body
  trucks, wheel tractor scrapers and dozers, and landfill and soil compactors; machinery
  components, and wear and maintenance components; and technology products and services
  for fleet management, equipment management analytics, autonomous machine capabilities,
  safety services, and mining performance solutions. The Energy & Transportation segment
  offers reciprocating engine powered generator sets; reciprocating engines, drivetrain,
  and integrated systems and solutions; centrifugal gas compressors and related services;
  and diesel-electric locomotive components, and other rail-related products. Its
  Financial Products segment provides operating and finance leases, revolving charge
  accounts, installment sale contracts, repair/rebuild financing, working capital
  loans, and wholesale financing; and insurance and risk management products and services.
  The All Other segment offers parts distribution; logistics and distribution services;
  electronics and control systems; dealer portfolio management; brand management and
  marketing strategy; and digital investment services. It also provides mining software
  solutions. The company was formerly known as Caterpillar Tractor Co. Caterpillar
  Inc. was incorporated in 1925 and is headquartered in Irving, Texas.
