longBusinessSummary: 'Puig Brands, S.A. operates in the beauty and fashion industry
  in Europe, the Middle East, Africa, the Americas, and the Asia-Pacific. The company
  operates through three segments: Fragrance and Fashion, Makeup, and Skincare. The
  Fragrance and Fashion segment designs, develops, and markets fragrances in various
  forms, including eau de parfum sprays and colognes, lotions, powders, creams, candles,
  and soaps, that are based on a particular fragrance, as well as clothing, footwear
  and accessories under the Carolina Herrera, Jean Paul Gaultier, Nina Ricci, Rabanne,
  Byredo, Christian Louboutin, Dries Van Noten, L''Artisan Parfumeur, Penhaligon''s,
  Adolfo Domínguez, and Banderas brands. The Makeup segment engages in the creation,
  marketing, and sale of a range of cosmetic products, such as foundations, concealers,
  lipsticks, lip glosses, eyeliners, blushes, mascaras, and eyeshadows under the Carolina
  Herrera, Charlotte Tilbury, Rabanne, Byredo, Christian Louboutin, and Dries Van
  Noten brands. The Skincare segment offers cleansers, toners, moisturizers, serums,
  body care, exfoliators, acne, and oil correctors, facial masks, and sun care products
  under the Uriage, Apivita, Dr.Barbara Sturm, Kama Ayurveda, Loto del Sur, and Charlotte
  Tilbury brands. It sells its products in department stores, warehouses, pharmacies,
  drug stores, travel retail, spas, and Puig''s own shops through digital channels,
  brands'' own e-commerce, and distributors. The company was incorporated in 1914
  and is based in Barcelona, Spain. Puig Brands, S.A. is a subsidiary of Puig, S.L.'
