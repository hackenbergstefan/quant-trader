longBusinessSummary: Microchip Technology Incorporated develops, manufactures, and
  sells smart, connected, and secure embedded control solutions in the Americas, Europe,
  and Asia. It operates in two segments, Semiconductor Products and Technology Licensing.
  The company offers general-purpose 8-bit, 16-bit, 32-bit, and 64-bit mixed-signal
  microcontrollers; 32-bit and 64-bit embedded mixed-signal microprocessors; and specialized
  mixed-signal microcontrollers for automotive, industrial, computing, communications,
  lighting, power supplies, motor control, human-machine interface, security, wired
  connectivity, and wireless connectivity applications. It also provides analog products,
  including power management, linear, mixed-signal, high voltage, thermal management,
  discrete diodes and MOSFETs, radio frequency (RF), gate drivers, safety, security,
  timing, application-specific standard products, USB, Ethernet, wireless, and other
  interface products; field-programmable gate array (FPGA) products; and application
  development tools that enable system designers to program mixed-signal microcontroller,
  FPGA, and microprocessor products. In addition, the company offers memory products
  consisting of serial electrically erasable programmable read-only memory, serial
  flash memories, parallel flash memories, serial static random-access memory, and
  electrically erasable random-access memory for footprint devices. Further, it licenses
  its SuperFlash embedded flash and non-volatile memory technologies to foundries,
  integrated device manufacturers, and design partners for use in the manufacture
  of microcontroller products, gate arrays, RF, analog, and neuromorphic compute products.
  Additionally, the company offers engineering services; wafer foundry, assembly,
  and test subcontracting manufacturing services; and timing systems, application-specific
  integrated circuits, and products for aerospace applications. The company was incorporated
  in 1989 and is headquartered in Chandler, Arizona.
