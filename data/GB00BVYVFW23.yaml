longBusinessSummary: Autotrader Group plc operates an automotive platform in the United
  Kingdom. The company operates through Autotrader and Autorama segments. It provides
  vehicle advertisement on its websites for private sellers, as well as insurance
  and loan finance products to consumers; and display advertising on its websites
  for manufacturers and their advertising agencies. The company also sells new vehicles
  and accessories; and facilitates the lease of new vehicles. It offers its products
  to retailers, home traders, and logistics customers. The company was formerly known
  as Auto Trader Group plc and changed its name to Autotrader Group plc in January
  2026. The company was founded in 1977 and is headquartered in Manchester, the United
  Kingdom.
