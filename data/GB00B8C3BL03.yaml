longBusinessSummary: The Sage Group plc, together with its subsidiaries, offers technology
  solutions and services for small and medium businesses in North America, Europe,
  the United Kingdom, Ireland, Africa and Asia-Pacific. It offers Sage Intacct, a
  cloud accounting and financial management software for mid-sized and growing businesses;
  Sage People, an integrated HR and Payroll solution; Sage 200, a scalable management
  solution; Sage X3, a flexible, intuitive, and tailored business solution; Sage Accounting,
  a cloud software for managing invoicing, cash flow, tax, and more, from anywhere,
  ideal for small businesses; Sage Payroll for start-ups and small businesses manage
  their payroll; and Sage HR for small and mid-sized businesses for record management,
  leave management, staff scheduling, and expenses services. The company also provides
  Sage 50 accounts, that manages accounting, inventory, and payments, as well as Sage
  50 payroll. Additionally, it offers Sage Expenses, an expense management solution
  that automates the entire expense process from mobile receipt capture to posted
  and reimbursement, saving time, and reducing admin for small businesses in Spain.
  The Sage Group plc was formerly known as Ployfinal Public Limited Company and changed
  its name to The Sage Group plc in September 1988. The company was founded in 1981
  and is based in Newcastle upon Tyne, United Kingdom.
