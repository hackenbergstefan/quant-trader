longBusinessSummary: "Grupa Kety S.A. produces and sells aluminum profiles and components\
  \ in Poland and internationally. It operates through three segments: Extruded Products,\
  \ Aluminum Systems, and Flexible Packaging. The company produces and sells aluminum\
  \ profiles and components. It also engages in the production, trading, and sale\
  \ of aluminum facades systems, doors and windows, internal structures, external\
  \ aluminum roller shutters, and roller gates for the construction business. In addition,\
  \ the company produces and sells pergolas, external blinds, awnings, reflex screens,\
  \ and sunbreakers. Further, it is involved in the production and sale of printed\
  \ flexible packaging and BOPP films for food manufacturers and other sectors. It\
  \ sells its products under the Grupa Kety, Aluprof, Alupol Packaging, and Selt Sp.\
  \ z o.o. brands. The company serves construction, automotive, transport, electrical\
  \ engineering, household equipment, advertising, tourism, food concentrates, confectionery,\
  \ fats, dairy, meat, cold meat, pharmaceutical, and chemical industries. The company\
  \ was formerly known as Zaklady Metali Lekkich \x91Kety' and changed its name to\
  \ Grupa Kety S.A. in 2000. The company was founded in 1953 and is headquartered\
  \ in Kety, Poland."
