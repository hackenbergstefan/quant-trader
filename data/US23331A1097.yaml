longBusinessSummary: D.R. Horton, Inc. operates as a homebuilding company in East,
  North, Southeast, South Central, Southwest, and Northwest regions in the United
  States. It engages in the acquisition and development of land; and construction
  and sale of residential homes in 126 markets across 36 states under the names of
  D.R. Horton. The company also constructs and sells single-family detached homes;
  and attached homes, such as townhomes and duplexes. In addition, it provides mortgage
  financing and title agency services; and engages in the residential lot development
  business. Further, the company develops, constructs, owns, leases, and sells multi-family
  and single-family rental properties; conducts insurance-related operations; and
  owns water rights and other water-related assets, as well as non-residential real
  estate, including ranch land and improvements. It primarily serves homebuyers. D.R.
  Horton, Inc. was founded in 1978 and is headquartered in Arlington, Texas.
