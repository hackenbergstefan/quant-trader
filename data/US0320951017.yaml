longBusinessSummary: 'Amphenol Corporation, together with its subsidiaries, designs,
  manufactures, and markets electrical, electronic, and fiber optic connectors in
  the United States, China, and internationally. It operates through three segments:
  Communications Solutions, Harsh Environment Solutions, and Interconnect and Sensor
  Systems. The company offers connectors and connector systems, including high speed,
  radio frequency, power, fiber optic and other interconnect products; busbars and
  power distribution systems; power interconnect products; and other products. It
  also provides value-add products, such as backplane interconnect systems, cable
  assemblies and harnesses, and cable management products; and other products comprising
  flexible and rigid printed circuit boards, hinges, other mechanical, and production
  related products. In addition, the company offers consumer device, network infrastructure,
  and other antennas; coaxial, power, and specialty cables; and sensors and sensor-based
  products. It sells its products through its sales force, independent representatives,
  and a network of electronics distributors to original equipment manufacturers, electronic
  manufacturing services companies, original design manufacturers, and service providers
  in the automotive, commercial aerospace, communications networks, defense, industrial,
  information technology and data communications, mobile devices markets. Additionally,
  the company provides telecommunication and IT networking solutions. The company
  was founded in 1932 and is headquartered in Wallingford, Connecticut.'
