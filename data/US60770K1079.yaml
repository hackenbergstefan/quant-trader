longBusinessSummary: Moderna, Inc., a biotechnology company, provides messenger RNA
  medicines in the United States, Europe, and internationally. The company's respiratory
  vaccines include spikevax, mNEXSPIKE, mRESVIA, COVID, RSV, seasonal influenza, combination,
  and pandemic influenza vaccine; latent vaccines comprise cytomegalovirus, epstein-barr
  virus, and human immunodeficiency virus vaccines; enteric viruses include norovirus;
  public health vaccines consist of Zika, Nipah, and Mpox vaccines; and bacterial
  diseases vaccines, such as lyme vaccines. It also provides oncology therapeutics,
  such as intismeran autogene, cancer antigen therapy, t-cell engager, and cell therapy
  enhancer; and rare disease products, including propionic and methylmalonic acidemia,
  and cystic fibrosis. It has strategic alliances and collaborations with Merck &
  Co., Inc; Vertex Pharmaceuticals Incorporated; Vertex Pharmaceuticals (Europe) Limited;
  immatics N.V.; Defense Advanced Research Projects Agency; Biomedical Advanced Research
  and Development Authority; Institute for Life Changing Medicines; The Bill & Melinda
  Gates Foundation; and OpenAI. The company was formerly known as Moderna Therapeutics,
  Inc. and changed its name to Moderna, Inc. in August 2018. Moderna, Inc. was founded
  in 2010 and is headquartered in Cambridge, Massachusetts.
