longBusinessSummary: FirstEnergy Corp., together with its subsidiaries, engages in
  the generation, distribution, and transmission of electricity in the United States.
  It operates through Distribution, Integrated, and Stand-Alone Transmission segments.
  The company owns and operates coal-fired, nuclear, hydroelectric, wind, and solar
  power generating facilities. The company operates 252,959 distribution line miles
  and 24,157 transmission line miles, including overhead pole line and underground
  conduit carrying primary, secondary, and street lighting circuits. The company serves
  customers in Ohio, Pennsylvania, New Jersey, West Virginia, Maryland, and New York.
  FirstEnergy Corp. was incorporated in 1996 and is headquartered in Akron, Ohio.
