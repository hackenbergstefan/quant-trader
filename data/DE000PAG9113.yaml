longBusinessSummary: Dr. Ing. h.c. F. Porsche AG engages in automotive and financial
  services business in Germany, Europe, North America, China, and internationally.
  The company procures, develops, manufactures, and sells vehicles, as well as related
  services. It also offers leasing, dealer and customer financing, mobility services
  for Porsche brand vehicles, and other finance-related services. The company was
  formerly known as Porsche Fünfte Vermögensverwaltung AG and changed its name to
  Dr. Ing. h.c. F. Porsche AG in November 2009. The company was founded in 2009 and
  is headquartered in Stuttgart, Germany. Dr. Ing. h.c. F. Porsche AG is a subsidiary
  of Porsche Holding Stuttgart GmbH.
