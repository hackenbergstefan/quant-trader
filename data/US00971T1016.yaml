longBusinessSummary: Akamai Technologies, Inc. engages in the provision of security,
  delivery, and cloud computing solutions in the United States and internationally.
  It offers security solutions that include web application and application programming
  interfaces (API) protection solutions, which protect web, API, and mobile app traffic
  from attacks; Bot & Abuse portfolio, which provides solutions to help customers
  protect against threats; full account lifecycle protections including the ability
  to defend against account takeover and opening abuse, adversarial bot protection,
  protection against credential stuffing, inventory scalping, and hoarding; and solutions
  designed to stop persistent scrapers from stealing content; API security, which
  discovers, audits, and monitors API; and microservice and application component
  protection that analyzes and protects application traffic that moves between application
  components. The company also offers cloud computing services, which include compute,
  storage, and cloud native and networking services; and Akamai App Platform, provides
  ready-to-run templates that address challenges in deploying, managing and scaling
  Kubernetes clusters at scale. In addition, it offers delivery solutions that include
  web and mobile performance solutions, which enables dynamic websites and applications,
  as well as global traffic management, site acceleration, application load balancing,
  large-scale load testing, and real-user monitoring; and media delivery solutions,
  including video streaming and video player services, game and software delivery,
  broadcast operations, authoritative domain name system, resolution, and data and
  analytics. The company has a strategic alliance with Deloitte Canada to help organizations
  achieve platform-based resilience against AI-accelerated cyberthreats. Akamai Technologies,
  Inc. was incorporated in 1998 and is headquartered in Cambridge, Massachusetts.
