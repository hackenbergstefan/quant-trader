longBusinessSummary: 'Hewlett Packard Enterprise Company, together with its subsidiaries,
  develops intelligent solutions in the United States, the Americas, Europe, the Middle
  East, Africa, the Asia Pacific, Japan, and internationally. It operates in five
  segments: Server, Hybrid Cloud, Networking, Financial Services, and Corporate Investments
  and Other. The company offers general-purpose servers, workload-optimized servers,
  and integrated systems, including HPE ProLiant Rack and Tower servers; HPE Synergy;
  HPE Scale Up servers; HPE Edgeline servers; HPE Cray EX; HPE Cray XD; and HPE NonStop.
  It also provides cloud-native and hybrid solutions, such as HPE Alletra Storage;
  HPE InfoSight; HPE CloudPhysics; and HPE GreenLake. In addition, the company develops
  and sells networking and security products and services comprising hardware products,
  which include Wi-Fi and private cellular access points, MX and PTX routers, and
  gateways, as well as QFX, EX, and CX switches; software products, such as Mist and
  Aruba Central; and services comprising professional, maintenance, support services,
  management software, and education and training programs. Further, it offers investment
  solutions, including leasing, financing, IT consumption, utility programs, and asset
  management services, as well as supports financial solutions for on-premise flexible
  consumption models. The company serves commercial and large enterprise groups, as
  well as business and public sector enterprises. It sells its products through resellers,
  distribution partners, master area partners, original equipment manufacturers, independent
  software vendors, systems integrators, and advisory firms. The company was founded
  in 1939 and is headquartered in Spring, Texas.'
