longBusinessSummary: OMV Aktiengesellschaft operates as an oil, gas, and chemicals
  company in Austria, Belgium, Germany, New Zealand, Norway, Romania, the United Arab
  Emirates, the rest of Central and Eastern Europe, the rest of Europe, and internationally.
  It operates through Chemicals, Fuels & Feedstock, and Energy segments. The company
  provides advanced and circular polyolefin solutions, and base chemicals, as well
  as engages in the recycling of plastics. It also refines and markets crude oil and
  other feedstock; and operates refineries, filling stations, gas storage facilities,
  and gas-fired power plant. In addition, the company engages in the exploration,
  development, and production crude oil, natural gas liquids, and natural gas; development
  of energy sources, such as geothermal projects; Carbon Capture and Storage; provision
  and renewable power solutions, as well as sale, trade, and logistics of natural
  gas. OMV Aktiengesellschaft was incorporated in 1956 and is headquartered in Vienna,
  Austria.
