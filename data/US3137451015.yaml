longBusinessSummary: "Federal Realty Investment Trust is a recognized leader in the\
  \ ownership, operation and redevelopment of high-quality retail-based properties\
  \ located primarily in major coastal markets and select underserved regions with\
  \ strong economic and demographic fundamentals. Federal Realty's mission is to deliver\
  \ long-term, sustainable growth through investing in communities where retail demand\
  \ exceeds supply. This includes a portfolio of open-air shopping centers and mixed-use\
  \ destinations\x97such as Santana Row, Pike & Rose, and Assembly Row, which together\
  \ reflect the company's ability to create distinctive, high-performing environments\
  \ that serve as vibrant destinations for their communities. Federal Realty's 103\
  \ properties include approximately 3,700 tenants in 28.8 million commercial square\
  \ feet, and approximately 2,700 residential units. Federal Realty has increased\
  \ its quarterly dividends to its shareholders for 59 consecutive years, the longest\
  \ record in the REIT industry. Federal Realty Investment Trust is based in North\
  \ Bethesda, Maryland. Federal Realty Investment Trust was incorporated in 1962 in\
  \ Maryland."
