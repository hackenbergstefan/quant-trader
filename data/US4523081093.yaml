longBusinessSummary: 'Illinois Tool Works Inc. provides industrial products and equipment
  in North America, Europe, the Middle East, Africa, the Asia Pacific, and South America.
  It operates through seven segments: Automotive OEM; Food Equipment; Test & Measurement
  and Electronics; Welding; Polymers & Fluids; Construction Products; and Specialty
  Products. The Automotive OEM segment offers plastic and metal components, fasteners,
  and assemblies for automobiles, light trucks, and other industrial uses. The Food
  Equipment segment provides warewashing, cooking, refrigeration, and food processing
  equipment; kitchen exhaust, ventilation, and pollution control systems; and food
  equipment maintenance and repair services. The Test & Measurement and Electronics
  segment produce and sells test and measurement; and electronic manufacturing and
  maintenance, repair, and operations solutions. The Welding segment produces arc
  welding equipment, and metal arc welding consumables and related accessories. The
  Polymers & Fluids segment produces adhesives, sealants, lubrication and cutting
  fluids, and fluids and polymers for auto aftermarket maintenance and appearance.
  The Construction Products segment offers engineered fastening systems and solutions
  for the residential construction, renovation/remodel, and commercial construction
  markets. The Specialty Products segment provides beverage packaging equipment and
  consumables, product coding and marking equipment and consumables, and appliance
  components and fasteners. The company serves automotive OEM and aftermarket, commercial
  food equipment, construction, general industrial, industrial capital goods, consumer
  durables, and other markets, as well as MRO markets. It distributes its products
  directly to industrial manufacturers, as well as through independent distributors.
  Illinois Tool Works Inc. was founded in 1912 and is based in Glenview, Illinois.'
