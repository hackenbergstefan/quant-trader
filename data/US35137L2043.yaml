longBusinessSummary: Fox Corporation operates as a news, sports, and entertainment
  company in the United States. It operates in two segments, Cable Network Programming
  and Television. The Cable Network Programming segment produces and licenses news
  and sports content for distribution through traditional cable television systems,
  direct broadcast satellite operators, telecommunication companies, virtual multi-channel
  video programming distributors, and other digital platforms. The Television segment
  produces, acquires, markets, and distributes programming through the FOX broadcast
  network; advertising-supported video-on-demand service Tubi; and operates full power
  broadcast television stations, including duopolies and other digital platforms.
  This segment also produces content for third parties. It also engages in the consumer
  finance marketplace; and provision of television and film production services along
  with office space, studio operation services, and all operations of the facility.
  Fox Corporation was incorporated in 2018 and is headquartered in New York, New York.
