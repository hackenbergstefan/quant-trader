longBusinessSummary: 'Deutsche Börse AG operates as an international exchange organization
  in Germany, rest of Europe, the United States, and the Asia-Pacific. The company
  operates through four segments: Investment Management Solutions, Trading & Clearing,
  Fund Services, and Securities Services. The Investment Management Solutions segment
  offers financial data, analytics, and software-as-a-service solutions including
  research, data collection, data analysis, and the provision of indices, analytics
  and investment management software to institutional investors, banks, and corporate
  clients. The Trading & Clearing segment engages in the development and operation
  of markets and trading systems for securities, derivatives, commodities, currencies,
  digital assets, and other asset classes. This segment handles settlement of transactions
  through clearing houses. Its Fund Services segment provides infrastructure and services
  for fund processing, including order routing, settlement, custody, data and distribution
  support for investment funds. The Securities Services segment offers various services
  for securities issuance, settlement, custody as well as collateral, securities lending,
  and liquidity management. The company was founded in 1585 and is headquartered in
  Eschborn, Germany.'
