longBusinessSummary: National Bank of Greece S.A., together with its subsidiaries,
  provides banking, financial products, and services primarily in Greece, Cyprus,
  North Macedonia, Romania, Bulgaria, Luxembourg, the Netherlands, and the United
  Kingdom, and internationally. It operates through Retail Banking, Corporate & Investment
  Banking, Trouble Assets Units, Global Markets and Asset Management, International
  Banking Operations, and other segments. The Retail Banking segment provides deposit,
  investment, bancassurance products, mortgage loans, consumer and small business
  lending, debit and credit cards, prepaid cards, and other traditional products and
  services for individual customers, professionals, and small-medium and small sized
  companies through its network of branches and digital businesses. Its Corporate
  & Investment Banking segment offers financial and investment advisory services,
  deposit accounts, loans, foreign exchange, and trade services for corporate customers;
  and lending services for large and medium-sized companies, as well as shipping finance
  services. The Trouble Assets Unit segment manages various non-performing and denounced
  loans. Its Global Markets and Asset Management segment is involved in treasury activities;
  and asset management, custody, private equity, and brokerage services. The International
  Banking Operations segment offers traditional commercial banking, such as commercial
  and retail credit, trade financing, foreign exchange, and deposits; shipping finance;
  investment banking; and brokerage services. Its Other segment engages in the real
  estate management and warehousing businesses. It also provides factoring, capital
  markets, mutual fund management, and insurance brokerage services. National Bank
  of Greece S.A. was founded in 1841 and is headquartered in Athens, Greece.
