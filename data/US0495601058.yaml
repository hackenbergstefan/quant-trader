longBusinessSummary: Atmos Energy Corporation, together with its subsidiaries, engages
  in the regulated natural gas distribution, and pipeline and storage businesses in
  the United States. It operates through two segments, Distribution, and Pipeline
  and Storage. The Distribution segment is involved in the regulated natural gas distribution
  and related sales operations in eight states. This segment distributes natural gas
  to approximately 3.4 million residential, commercial, public authority, and industrial
  customers; and owned 76,000 miles of underground distribution and transmission mains.
  The Pipeline and Storage segment engages in the pipeline and storage operations.
  This segment transports natural gas for third parties and manages five underground
  storage facilities in Texas; provides ancillary services customary to the pipeline
  industry, including parking arrangements, lending, and inventory sales; and owned
  5,700 miles of gas transmission lines. Atmos Energy Corporation was founded in 1906
  and is based in Dallas, Texas.
