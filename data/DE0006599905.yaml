longBusinessSummary: Merck KGaA operates as a science and technology company in Europe,
  North America, Latin America, Middle East and Africa, and the Asia Pacific. The
  Life Science segment offers products, solutions, and services to academic, research
  and diagnostic labs, biotech, and pharmaceutical companies, as well as the industrial
  sector; reagents, consumables, devices, instruments, software, and services for
  research, production, and testing to lab water instruments, microbiology and biomonitoring
  products, test assays, analytical reagents, and flow cytometry kits and instruments.
  This segment also provides traditional and novel therapies, such as ration devices,
  chromatography resins, single-use systems, process chemicals, and excipients for
  bioprocessing; contract development, manufacturing and testing services, which supports
  customers from preclinical phases to commercialization. The Healthcare segment discovers,
  develops, manufactures, and markets prescription drugs and biopharmaceuticals to
  the therapeutic areas of oncology, rare diseases, neurology and immunology, fertility,
  cardiovascular, and metabolic and endocrinological disorders. The Electronics segment
  offers advanced dielectric and metallic materials; photoresist, anti-reflective
  coating, and material lithography products; clean and selective etch chemistries;
  materials for chemical-mechanical planarization; high-purity gases for semiconductor
  manufacturing; and develops and installs delivery equipment for handling of specialty
  chemicals and gases for semiconductor manufacturing; develops modulating, creating,
  engineering, and guiding light; and material solutions in liquid crystals, OLED
  materials, and photoresists. It has in-licensing agreement with Abbisko Therapeutics
  Co. Ltd., China on drug candidates for the treatment of tenosynovial giant cell
  tumor; and strategic partnership with Versant Ventures to advance treatments for
  rare genetic cardiomyopathies. The company was founded in 1668 and is headquartered
  in Darmstadt, Germany. Merck KGaA operates as a subsidiary of E. Merck KG.
