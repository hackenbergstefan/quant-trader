longBusinessSummary: 'Bureau Veritas SA provides laboratory testing, inspection, and
  certification services. It operates through six segments: Marine & Offshore; Agri-Food
  & Commodities; Industry; Buildings & Infrastructure; Certification; and Consumer
  Products services. The company engages in inspecting, analyzing, auditing, and certifying
  the products, assets, and management systems of its clients in relation to regulatory
  or self-imposed standards, as well as issues compliance reports. It also provides
  technical services, including asset integrity management for marine and offshore;
  post accident expertise, risk assessment for the offshore industry, marine accident
  investigations, pre- and post salvage advice, and refloating of vessels; inspection,
  audit, certification, and testing services for oil and petrochemicals, metals and
  minerals, and agri commodities; technical control, code compliance, independent
  technical assistance, quality assurance/quality control, construction management,
  and project management assistance; laboratory and on-site testing services for manufacturing
  and process industries; inspection services for products, services, assets, and
  installations, as well as various services designed to control quality, verify quantity,
  and meet regulatory requirements; and certification services for management systems,
  products, and people. The company serves construction and civil engineering, real
  estate, transportation, oil and gas, marine and offshore, nuclear, defense, automotive,
  aerospace, IT, electronics, power and utilities, consumer products, and retail industries,
  as well as financial services and public sectors. It operates in approximately 140
  countries through a network of offices and laboratories. Bureau Veritas SA was founded
  in 1828 and is headquartered in Neuilly-sur-Seine, France.'
