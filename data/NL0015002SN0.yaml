longBusinessSummary: Qiagen N.V. provides sample to insight solutions that transform
  biological samples into molecular insights worldwide. The company offers sample
  technology consumables, such as nucleic acid stabilization and purification kits
  for sample materials, manual and automated processing for genotyping, gene expression,
  and viral and bacterial analysis, as well as silica membranes and magnetic bead
  technologies; secondary sample technology consumables, including kits and components
  for purification of nucleic acids; and instruments for nucleic acid purification,
  quality control, and accessories. It also provides Immune response consumables,
  such as interferon-gamma release assay for TB testing, and assays for post-transplant
  testing and viral load monitoring; oncology and sexual and reproductive health consumables,
  inclsuing assays for prenatal testing and detection of sexually transmitted diseases
  and HPV; assays for analysis of genomic variants; and sample to insight instruments,
  including one-step molecular analysis of hard-to-diagnose syndromes, and integrated
  PCR testing. The company offers research PCR consumables, such as quantitative PCR,
  reverse transcription, and combinations kits for analysis of gene expression, genotyping
  and gene regulation, and running on QIAGEN instruments and technologies; human ID/forensics
  assay consumables comprising short tandem repeat assays for human ID, and assays
  for food contamination; PCR instruments, including digital PCR and qPCR solutions;
  and developed and configured enzymes and PCR solutions. It offers NGS gene panels,
  library prep kits and components, and whole genome amplification; DNA methylation
  analysis; QIAGEN consumables and instruments; bioinformatics solutions; and sequence-based
  assays forensic genetic genealog services. it provides software-as-a-service. It
  serves molecular diagnostics and life sciences sectors. The company was founded
  in 1984 and is headquartered in Venlo, the Netherlands.
