longBusinessSummary: "Compagnie de Saint-Gobain S.A., together with its subsidiaries,\
  \ designs, manufactures, and distributes materials and solutions for the construction\
  \ and industrial markets worldwide. It operates in five segments: High Performance\
  \ Solutions; Northern Europe; Southern Europe \x96 Middle East (ME) Americas; and\
  \ Asia-Pacific. The company offers plaster-based products and systems for the construction\
  \ and renovation markets under the Placo, Rigips, and Gyproc brands; insulation\
  \ solutions for a range of applications, such as heating and air conditioning systems,\
  \ insulation of pipes in industrial installations, engine and interior compartments\
  \ of vehicles, household appliances, and photovoltaic panels under the Isover, CertainTeed,\
  \ and Izocam brands; and mortars and construction chemicals under the Weber, Chryso,\
  \ and GCP brands. It also provides ceilings under the Ecophon, CertainTeed, Eurocoustic,\
  \ Gyptone, and Vinh Tuong brands; glazing solutions for buildings and mobility,\
  \ including flat glass under the Saint-Gobain Glass, GlassSolutions, Vetrotech,\
  \ and SageGlass brands; ductile cast iron pipe systems, covers, and gratings under\
  \ the PAM brand; glass fiber materials and technical textiles; and abrasives, adhesives,\
  \ sealants, adhesive tapes, foams, and films. In addition, the company offers ceramics\
  \ and polymers; and exterior products comprising asphalt and composite shingles,\
  \ solar roofing solutions, roll roofing systems, accessories, polymer shakes and\
  \ shingles, and insulation cladding solutions under the CertainTeed brands. Further,\
  \ it distributes heavy building materials; plumbing, heating, ventilation, and sanitaryware\
  \ products; construction products; office partitions; timber and byproducts; home\
  \ improvement products and services; bathrooms and kitchens; steel; and site equipment,\
  \ PPEs, and tools. Compagnie de Saint-Gobain S.A. was founded in 1665 and is headquartered\
  \ in Courbevoie, France."
