longBusinessSummary: 'SPIE SA provides multi-technical services in the areas of energy
  and communications in France, Germany, the Netherlands, and internationally. It
  operates through five segments: France, Germany, North-Western Europe, Central Europe,
  and Global Services Energy. The company provides design, ICT consultancy and engineering,
  installation, maintenance and maintenance durability, technical facility management,
  and managed services. It also offers E-Mobility, smart packing, barriers, smart
  FM 360, energy efficiency, modernization, maintid, fabloop, IoT and data management,
  control room, ergonomie, and cybersecurity products. SPIE SA was founded in 1900
  and is headquartered in Cergy-Pontoise, France.'
