longBusinessSummary: 'WPP plc, a creative transformation company, provides communications,
  experience, commerce, and technology services in North America, the United Kingdom,
  Western Continental Europe, the Asia Pacific, Latin America, Africa, the Middle
  East, and Central and Eastern Europe. The company operates through three segments:
  Global Integrated Agencies, Public Relations, and Specialist Agencies. It offers
  marketing strategy, creative ideation, production, commerce, influencer marketing,
  social media management, and technology implementation services; media strategy,
  planning, buying and activation, commerce media, data analytics, and consulting
  services; and media management, public affairs, reputation, risk and crisis management,
  social media management, and strategic advisory services. The company also provides
  brand consulting, brand identity, product and service design, and corporate and
  brand publication services. WPP plc was founded in 1985 and is based in London,
  the United Kingdom.'
