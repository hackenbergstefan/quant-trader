longBusinessSummary: Sulzer AG develops and sells products and services for fluid
  engineering and chemical processing applications worldwide. It operates through
  Flow, Services, and Chemtech divisions. The Flow division provides pumps, agitators,
  compressors, grinders, screens, and filters for water, oil and gas, power, chemicals,
  and industrial. Its Services division offers parts, as well as maintenance and repair
  solutions for pumps, turbines, compressors, motors, and generators. This division
  services its original equipment, as well as associated third-party rotating equipment.
  The Chemtech division provides mass transfer, static mixing, and polymer solutions
  for chemicals, petrochemicals, refining, and LNG. It also offers ecological solutions,
  such as bio-based chemicals, polymers and fuels, and recycling technologies for
  plastic, as well as carbon capture and utilization / storage. The company was founded
  in 1834 and is headquartered in Winterthur, Switzerland.
