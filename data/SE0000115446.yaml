longBusinessSummary: AB Volvo (publ), together with its subsidiaries, manufactures
  and sells trucks, buses, construction equipment, and marine and industrial engines
  in Europe, North America, South America, Asia, Africa, and Oceania. The company
  operates through Industrial Operations - Trucks, Industrial Operations - Construction
  Equipment, Industrial Operations - Buses, Industrial Operations - Volvo Penta, Industrial
  Operations - Group Functions & Other, and Financial Services segments. The company
  offers heavy-duty trucks for long-haulage and construction work, and light-duty
  trucks for distribution purposes under the Volvo, Renault Trucks, Mack, Eicher,
  and Dongfeng Trucks brands; and city and intercity buses, coaches, and chassis under
  the Prevost and Volvo Bus brands. It also provides haulers, wheel loaders, excavators,
  road construction machines, and compact equipment under the Volvo, SDLG, and Rokbak
  brands. In addition, the company offers engines and power solutions for industrial
  off-highway applications and power generation, as well as for leisure boats, yachts,
  and commercial vessels under the Volvo Penta brand. Further, it provides customer
  support agreements, machine control systems, attachments, financing, and leasing;
  and insurance, rentals, spare parts, repairs, preventive maintenance, uptime and
  service agreements, and assistance services. It serves customers primarily in the
  transportation, infrastructure, construction, marine, industrial, and public transportation
  industries. The company offers its products and services through a network of dealers.
  AB Volvo (publ) was incorporated in 1915 and is headquartered in Gothenburg, Sweden.
