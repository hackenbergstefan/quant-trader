longBusinessSummary: Bechtle AG provides information technology (IT) services in Germany,
  France, Benelux, and Europe. It operates through IT System House & Managed Services
  and IT E-Commerce segments. The company offers IT strategy consulting, hardware
  and software solutions, IT infrastructure consulting, modern workplace, application
  solutions, project planning and implementation, system integration, maintenance
  and training to multi cloud and managed services, and IT security services and artificial
  intelligence. The company also provides data centers workplace, networking, cybersecurity,
  IoT solutions, data and analytics, engineering and manufacturing, consulting, professional,
  managed, financial, and e-procurement services. In addition, it offers business
  applications, including business intelligence, collaboration, customer relationship
  management, and enterprise resource planning. Bechtle AG was founded in 1983 and
  is headquartered in Neckarsulm, Germany.
