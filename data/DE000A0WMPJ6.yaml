longBusinessSummary: AIXTRON SE, together with its subsidiaries, manufactures and
  sells deposition equipment to the semiconductor industry in Asia, Europe, and the
  United States. The company offers G10-SiC, G10-GaN, G10-AsP, AIX G5+ C, Closed Coupled
  Showerhead systems for research and development, AIX 2800G4-TM, and AIX G5 WW C.
  It also develops, produces, and installs equipment for the deposition of semiconductor
  materials; and offers deposition processes, consulting, training, customer support,
  and other related services, as well as peripheral equipment and services to support
  the operation of its systems. In addition, the company engages in supplying deposition
  equipment for volume production; and research and development and pre-series production
  activities. Its products are used in laser, LED, display technologies, optical data
  transmission, SiC and GaN power electronics, and other applications. AIXTRON SE
  was founded in 1983 and is headquartered in Herzogenrath, Germany.
