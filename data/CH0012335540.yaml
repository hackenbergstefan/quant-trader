longBusinessSummary: Vontobel Holding AG, together with its subsidiaries, provides
  various financial services to private and institutional clients in Switzerland and
  internationally. The company offers fixed advances, current account overdrafts,
  guarantees, and margin requirements for derivative transactions. It also offers
  private equity and credit, and venture capital; investment solutions for equities,
  fixed income, quantitative, multi asset, and private markets; and structured solutions.
  In addition, the company provides real estate financing and lombard loans; our structured
  products, including investment products, and thematic investments; leverage products,
  such as constant leverage certificates, mini futures, warrants, warrants with knock-out,
  and warrants with knock-out open-end; and thematic investments, comprising strategic
  and tracker certificates. Further, it offers barrier reverse convertibles, barrier
  reverse convertibles with conditional coupon, bonus certificates, bonus certificates
  with cap, callable barrier reverse convertibles, callable reverse convertibles,
  capital protection notes, capped capital protection notes, credit linked notes,
  discount certificates, discount certificates with barrier, multi barrier reverse
  convertibles, multi barrier reverse convertibles with conditional coupon, multi
  bonus certificates, multi bonus certificates with cap, multi callable barrier reverse
  convertibles, multi callable reverse convertibles, multi reverse convertibles, multi
  reverse convertibles with conditional coupon, outperformance certificates, outperformance
  certificates with cap, and reverse convertibles. Vontobel Holding AG was founded
  in 1924 and is headquartered in Zurich, Switzerland.
