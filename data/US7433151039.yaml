longBusinessSummary: The Progressive Corporation operates as an insurance company
  in the United States. It writes insurance for personal autos and special lines products,
  including motorcycles, RVs, and watercraft; and personal residential property insurance
  for homeowners and renters. The company also writes auto-related liability and physical
  damage insurance for comprising dump trucks, log trucks, garbage trucks, tractors,
  trailers, straight trucks, tow trucks and wreckers, vans, pick-up trucks, and autos;
  business-related general liability and commercial property insurance for small businesses;
  and workers' compensation insurance for the transportation industry. In addition,
  it offers other specialty property-casualty insurance and provides related services;
  personal property reinsurance products; and involved in investment activities. It
  sells its products through independent insurance agencies, as well as online and
  over the phone. The Progressive Corporation was founded in 1937 and is headquartered
  in Mayfield, Ohio.
