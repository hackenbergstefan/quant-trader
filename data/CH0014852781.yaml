longBusinessSummary: Swiss Life Holding AG provides life, pensions, and financial
  solutions for private and corporate clients. It operates through Switzerland, France,
  Germany, International, Asset Managers, and Other segments. The company offers a
  various life, pension, health, annuity, and investment-type policies to groups and
  individuals, as well as disability coverage. It also provides property and casualty,
  liability and motor, accident, health, and payment protection insurance products.
  In addition, the company manages assets and provides advisory services. Further,
  it engages in the private equity, information technology, real estate, finance,
  banking, reinsurance, brokering, and investment funds businesses. Additionally,
  the company distributes its products through its sales force and distribution partners.
  It provides its products under the Swiss Life Select, Tecis, Horbach, Proventus,
  and Chase de Vere brands. The company also operates in the United Kingdom and Luxembourg.
  Swiss Life Holding AG was founded in 1857 and is headquartered in Zurich, Switzerland.
