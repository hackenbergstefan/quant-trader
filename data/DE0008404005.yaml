longBusinessSummary: Allianz SE, together with its subsidiaries, provides property-casualty
  insurance, life/health insurance, and asset management products and services worldwide.
  The company's Property-Casualty segment offers various insurance products, including
  motor liability, accident, fire and property, general liability, credit, and travel,
  and assistance services to private and corporate customers. Its Life/Health segment
  provides a range of life and health insurance products on an individual and a group
  basis, such as annuities, endowment and term insurance, and unit-linked and investment-oriented
  products, as well as private and supplemental health, and long-term care insurance
  products. The company's Asset Management segment offers institutional and retail
  asset management products and services to third-party investors comprising equity
  and fixed income funds, cash, and multi-assets; and alternative investment products
  that include real estate, infrastructure debt/equity, real assets, liquid alternatives,
  and solutions business. In addition, it provides banking services for retail clients;
  and digital investment services. Allianz SE was founded in 1890 and is headquartered
  in Munich, Germany.
