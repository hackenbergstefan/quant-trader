longBusinessSummary: Smurfit Westrock Plc, together with its subsidiaries, manufactures,
  distributes, and sells containerboard, corrugated containers, and other paper-based
  packaging products in North America, South America, Europe, Asia, Africa, Australia,
  and internationally. The company produces containerboard and paperboard; packaging
  of corrugated containers; consumer packaging; and offers solid board, kraft paper,
  and graphic board, as well as other packaging products, such as solidboard packaging,
  paper sacks and bag-in-box. It produces linerboard and corrugated medium and paperboard;
  and other paper-based packaging, such as folding cartons, inserts, labels and displays.
  The company primarily serves food and beverage, healthcare, beauty and personal
  care, garden, consumer goods, industrial, and foodservice markets. It markets its
  products through its own sales force, independent sales representatives, and independent
  distributors. Smurfit Westrock Plc was founded in 1934 and is headquartered in Dublin,
  Ireland.
