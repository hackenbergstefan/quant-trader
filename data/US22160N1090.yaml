longBusinessSummary: CoStar Group, Inc. provides information, analytics, and online
  marketplace services to real estate and related business communities in the United
  States, Australia, Canada, Europe, the Asia Pacific, and Latin America. It offers
  CoStar Property that provides inventory of office, industrial, retail, multifamily,
  hospitality, and student housing, and land properties; CoStar Leasing, a data on
  lease transactions and tools to manage user-entered lease data; CoStar Sales, a
  database of commercial real estate sales transactions; CoStar Owners provides detailed
  portfolio information; CoStar Markets to view and report on market and submarket
  trends; and CoStar Tenant that provides tenant information. The company also provides
  hospitality benchmarking that allows hotels to measure performance against competitors;
  Debt Solutions, a tool for lenders to manage loan portfolios and risk; and real
  estate and lease management technology solutions, such as lease administration,
  lease accounting, and transaction management services. In addition, it offers Apartamentos.com,
  an apartment marketing sites; LoopNet.com, a commercial property marketing sites;
  Homes.com, a home for sale listings site; Ten-X, an online auction platform for
  commercial real estate; Land.com, a marketplace for rural land sales; and BizBuySell.com,
  a marketplace for operating businesses and franchises for sale. It serves sales,
  leasing, and mortgage brokers; property, real estate investment trust, insurance
  companies, and asset managers; and government agencies, property owners, mortgage-backed
  security issuers, appraisers, design and construction professionals, pension fund
  managers, real estate developers, reporters tenant vendors, bankers, building services
  vendors, mortgage bankers, communications providers, retailers, institutional advisors,
  hospitality owners, investors, and real estate agents. The company was founded in
  1986 and is headquartered in Arlington, Virginia.
