longBusinessSummary: ASSA ABLOY AB (publ) provides door opening and access products
  for the institutional, commercial, and residential markets. It operates through
  Europe, the Middle East, India, and Africa (EMEIA); North and South America (Americas);
  Asia and Oceania (Asia Pacific); Global Technologies; and Entrance Systems divisions.
  The company offers digital access solutions, such as electronic access control ecosystem,
  wireless and keyed access solutions, and standalone access and electrochemical solutions;
  swing, revolving, and sliding doors; hinges, lever handles, mortise lockcases, euro
  profile cylinders, panic exit devices, door closers, floor springs, pull handles,
  and general hardware; wooden and steel doors; and security entrance control and
  loading dock equipment. It also provides repair and maintenance, and digital services;
  building specification; and educational program and training services. In addition,
  the company's technology platforms for hi-tech door and entrance environments include
  Aperio, CLIQ, Hi-O, Incedo, and Seos. Further, it provides Openings Studio, a building
  information modeling software that integrates with design software to create and
  visualize openings for door, frame, and hardware specifications. The company offers
  its products under the ASSA ABLOY, Yale, ABLOY, Vachette, TESA, Kwikset, Baldwin,
  Weiser, Sargent, Curries, Norton Rixson, Papaiz, Odis, Philips, PanPan, Gateman,
  Lockwood, and HID brands. It sells its products through distributors and wholesalers.
  The company serves aviation, education, distribution and logistics, entertainment
  and public facilities, finance and banking, government and military, healthcare,
  hospitality, industry and manufacturing, mining, office and enterprise, residential,
  retail, shipyards, and transportation, hospitality, heavy, construction, critical
  infrastructure, key and asset management, marine, self-storage, and senior care
  industries. ASSA ABLOY AB (publ) was founded in 1881 and is based in Stockholm,
  Sweden.
