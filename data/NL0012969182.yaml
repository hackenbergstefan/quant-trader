longBusinessSummary: Adyen N.V. operates a payments platform in Europe, the Middle
  East, Africa, North America, the Asia Pacific, and Latin America. Its platform integrates
  payments stack, including gateway, risk management, processing, acquiring, and settlement
  services. The company offers a back-end infrastructure for authorizing. It accepts
  payment through online, in-person payments, cross channel, and Adyen for Platforms.
  The company also provides optimization services, including Adyen Uplift, protect,
  authenticate and tokenize. In addition, it offers financial products, such as accounts,
  capital, issuing, and payouts. It serves digital, mobility, SaaS platforms, retail,
  food and beverages, subscription, and travel and hospitality businesses. The company
  was incorporated in 2006 and is based in Amsterdam, the Netherlands.
