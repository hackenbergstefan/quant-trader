longBusinessSummary: 'Games Workshop Group PLC, together with its subsidiaries, engages
  in the design, manufacture, distribution, and sale of fantasy miniature figures
  and games in the United Kingdom, Continental Europe, North America, Australia, New
  Zealand, Asia, and internationally. The company operates in two segments, Core and
  Licensing. It offers games under the Warhammer 40,000; Warhammer: The Horus Heresy;
  Warhammer: The Old World; Warhammer: Age of Sigmar; and Necromunda and Blood Bowl
  brand names, as well as has a licensed property for the Lord of the Rings. The company
  also publishes short stories, audio dramas, full length novels, and audio books
  under the Black Library name. In addition, it engages in the magazine newsstand
  business; and grants licences to third parties for the development of video games,
  PC games, media, and other products. The company sells its products through its
  own retail stores, third party independent retailers, and online stores. The company
  was incorporated in 1991 and is headquartered in Nottingham, the United Kingdom.'
