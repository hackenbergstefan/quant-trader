longBusinessSummary: Scout24 SE operates ImmoScout24, a digital marketplace for the
  residential and commercial real estate sectors in Germany and internationally. The
  company operates through Professional and Private segments. It offers Pay-per-ad,
  for listing real estate without membership; Realtor Lead Engine (RLE) for selling
  real estate; Mortgage Lead Engine; CRM software solutions for real estate agents;
  and ESG energy performance certificates. In addition, the company provides software
  solutions for real estate valuations, such as viewings and expert opinions; an automated
  valuation model, a product for the automated valuation of real estate through application
  programming interfaces; provision of transaction-related documents for real estate
  professionals; and training courses, digital training, and education software. Further,
  it offers SearchPlus and SearchPlus for buying, which offers market analysis and
  a digital document folder; LivingPlus for digital services and legal protection;
  and LettingPlus, a cloud-based software solution to supports private landlords in
  rental and property management. It offers its products under the ImmoScout24, FLOWFACT,
  Vermietet.de, immoverkauf24, Propstack, BaufiTeam, SPRENGNETTER, Wohnungsboerse,
  bulwiengesa, EXPLOREAL, neubau kompass, and ENERGIE AUSWEIS 48 brand names. The
  company serves residential and business real estate agents, appraisers, financing
  intermediaries and banks, consumers, homeowners, and commercial service providers.
  The company was formerly known as Scout24 AG and changed its name to Scout24 SE
  in October 2021. Scout24 SE was founded in 1998 and is headquartered in Berlin,
  Germany.
