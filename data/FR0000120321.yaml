longBusinessSummary: 'L''Oréal S.A., through its subsidiaries, manufactures and sells
  cosmetic products for women and men in Europe, North America, North Asia, South
  Asia Pacific, the Middle East, North Africa, Sub-Saharan Africa, and Latin America.
  It operates through four divisions: Professional Products, Consumer Products, Luxe,
  and Dermatological Beauty. The company offers skincare, make-up, hair colourant,
  haircare, perfume, and hygiene products. It provides its products under the L''Oréal
  Paris, Garnier, Maybelline New York, NYX Professional Makeup, Stylenanda, Essie,
  Dark & Lovely, Mixa, Niely, L''Oréal Professionnel, Kérastase, Redken, Matrix, Pureology,
  Lancôme, Yves Saint Laurent Beauté, Armani Beauty, Kiehl''s, Helena Rubinstein,
  Aesop, Biotherm, Valentino, Prada, Shu Uemura, IT Cosmetics, Mugler, Ralph Lauren,
  Urban Decay, Azzaro, Maison Margiela, Viktor&Rolf, Takami, La RochePosay, CeraVe,
  Vichy, SkinCeuticals, Skinbetter Science, and other brand names. The company sells
  its products through distribution channels, such as hair salons, local stores, e-commerce,
  travel retail, mass market retail, department store perfumeries, pharmacies, drug
  stores, medi-spas, and free-standing stores. L''Oréal S.A. was founded in 1909 and
  is headquartered in Clichy, France.'
