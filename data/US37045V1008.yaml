longBusinessSummary: General Motors Company designs, builds, and sells trucks, crossovers,
  cars, and automobile parts worldwide. It operates through GM North America, GM International,
  and GM Financial segments. The company markets its vehicles primarily under the
  Buick, Cadillac, Chevrolet, GMC, Baojun, and Wuling brand names. In addition, it
  sells trucks, crossovers, cars, and automobile parts through retail dealers, distributors
  and dealers, as well as to fleet customers, including daily rental car companies,
  commercial fleet customers, leasing companies, and governments. Further, the company
  offers various range of after-sale services through dealer network, such as maintenance,
  light repairs, collision repairs, vehicle accessories, and extended service warranties.
  Additionally, it provides automotive financing; and software-enabled services and
  subscriptions. General Motors Company was founded in 1908 and is based in Detroit,
  Michigan.
