longBusinessSummary: Diageo plc, together with its subsidiaries, engages in the production,
  marketing, and distribution of alcoholic beverages in North America, Europe, the
  Asia Pacific, Latin America and Caribbean, and Africa. It offers beer, scotch, gin,
  vodka, rum, liqueur, raki, wine, cachaça, tequila, brandy, and Chinese white spirit
  beverages, as well as Irish, Canadian, Chinese US, and Indian whisky. The company
  also provides ready-to-drink and non-alcoholic beverages. Its principal brands include
  Johnnie Walker, Don Julio, Guinness, Crown Royal, Smirnoff, Baileys, Captain Morgan,
  Buchanan's, Casamigos, Shui Jing Fang, and McDowell's. The company was formerly
  known as Guinness plc and changed its name to Diageo plc in February 1998. The company
  was incorporated in 1886 and is headquartered in London, the United Kingdom.
