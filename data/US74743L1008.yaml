longBusinessSummary: Qnity Electronics, Inc. provides materials and solutions to the
  semiconductor and electronics industries in the United States, rest of Americas,
  Europe, the Middle East, Africa, Asia Pacific, China, South Korea, Taiwan, and internationally.
  The company operates in two segments, Semiconductor Technologies and Interconnect
  Solutions. Its Semiconductor Technologies segment offers chemical mechanical planarization
  (CMP) pads and slurries, photoresists, functional sub-layers, advanced overcoats,
  post-CMP cleaners, post-etch residue removers, and emerging cleans. The Interconnect
  Solutions segment provides copper pillar plating, copper redistribution layer, solder
  bump plating, under bump metallization, photoresists, packaging dielectrics, gap
  fillers, phase change, specialty thermal interface materials, thermally conductive
  insulators, copper plating solutions, dry film photoresists, and laminates and polyimide
  films. The company was formerly known as Novus SpinCo 1, Inc. and changed its name
  to Qnity Electronics, Inc. in April 2025. The company was incorporated in 2024 and
  is headquartered in Wilmington, Delaware.
