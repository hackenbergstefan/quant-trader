longBusinessSummary: Vodafone Group Public Limited Company provides telecommunication
  services in Germany, the United Kingdom, rest of Europe, Turkey, and South Africa.
  It offers mobile and fixed services; connectivity business solutions, such as digital
  services, the Internet of Things (IoT) and financial services; and IoT platforms.
  The company also provides cloud, multi-cloud, and edge computing solutions; M-PESA,
  an African mobile money platform to make payments and offer financial services;
  and international voice and roaming services. In addition, it offers unified communications,
  mobile connectivity, IoT connectivity, cloud and edge, E2E solutions, and security
  services; leases fibre and other fixed connectivity services; and engages in infrastructure
  assets, shared operations, growth platforms, retail, and service operations. The
  company serves private and public sector customers in health, banking and finance,
  transport and logistics, retail, utilities, and agriculture industries. Vodafone
  Group Public Limited Company was incorporated in 1984 and is based in Newbury, the
  United Kingdom.
