longBusinessSummary: Cencora, Inc. sources and distributes pharmaceutical products
  in the United States and internationally. The company's U.S. Healthcare Solutions
  segment distributes generic and injectable pharmaceuticals, over-the-counter healthcare
  products, home healthcare supplies and equipment, and related services to acute
  care hospitals and health systems, independent and chain retail pharmacies, mail
  order pharmacies, medical clinics, long-term care and alternate site pharmacies,
  and other customers; distributes plasma and other blood products, vaccines, and
  other specialty pharmaceutical products; provides pharmacy management, staffing,
  and other consulting services; supply management software to retail and institutional
  healthcare providers; packaging solutions to institutional and retail healthcare
  providers; clinical trial support, product post-approval, and commercialization
  support services; data analytics, outcomes research, and other services for biotechnology
  and pharmaceutical manufacturers; pharmaceuticals, vaccines, parasiticides, diagnostics,
  micro feed ingredients, and other products to the companion animal and production
  animal markets; sales force services to manufacturers; and offers other services
  to physicians who specialize in various disease states, such as oncology, as well
  as to other healthcare providers, including hospitals and dialysis clinics. Its
  International Healthcare Solutions segment provides international pharmaceutical
  wholesale and related service, and global commercialization services; distributes
  pharmaceuticals, other healthcare products, and related services to pharmacies,
  doctors, health centers, and hospitals; and offers specialty transportation and
  logistics services for the biopharmaceutical industry. The company was formerly
  known as AmerisourceBergen Corporation and changed its name to Cencora, Inc. in
  August 2023. Cencora, Inc. was founded in 1871 and is headquartered in Conshohocken,
  Pennsylvania.
