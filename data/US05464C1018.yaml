longBusinessSummary: Axon Enterprise, Inc. provides public safety technology solutions
  in the United States and internationally. The company operates in two segments,
  Software and Services, and Connected Devices. The Software and Services segment
  develops, manufactures, and sells cloud-based software-as-a-service solutions to
  capture, store, manage, share, and analyze video and other digital evidence. This
  segment also offers Axon Evidence, Draft One, Axon Records, Axon Standards, Axon
  Fusus, Axon Assistant, and others. The Connected Devices segment engages in the
  development, manufacture, and sale of integrated hardware solutions, such as conducted
  energy devices under the TASER brand, body cameras, fixed and in-car cameras, drone
  and counter-drone technologies, accessories, extended warranties, and related hardware
  products, as well as virtual reality training hardware. The company serves first
  responders across international, federal, state, and local governments, international
  governmental entities, commercial enterprises, and consumers through direct sales,
  distribution partners, and third-party resellers. The company was formerly known
  as TASER International, Inc. and changed its name to Axon Enterprise, Inc. in April
  2017. Axon Enterprise, Inc. was incorporated in 1993 and is headquartered in Scottsdale,
  Arizona.
