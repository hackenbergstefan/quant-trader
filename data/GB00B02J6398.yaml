longBusinessSummary: "Admiral Group plc, a financial services company, provides insurance\
  \ and personal lending products in the United Kingdom, France, Italy, and Spain.\
  \ It operates through four segments: UK Insurance, European Insurance, Admiral Money,\
  \ and Other. The company offers underwriting services that include motor, household,\
  \ pet, travel, and other insurance, as well as car and home insurance; and distributes\
  \ and underwrites unsecured personal loans, car finance products, and secured homeowner\
  \ loans. It provides its insurance products and services under the Admiral, Admiral\
  \ Business, Admiral Money, Admiral Pioneer, Balumba, Bell, Connect by Admiral, ConTe.it\
  \ Assicurazioni, ConTe.it Prestiti, Diamond, Gladiator, L'olivier \x96 assurance,\
  \ More Than, Qualitas Auto, and Veygo brand names. The company was formerly known\
  \ as Admiral Group Limited and changed its name to Admiral Group plc in September\
  \ 2004. Admiral Group plc was founded in 1993 and is headquartered in Cardiff, the\
  \ United Kingdom."
