longBusinessSummary: 'Uber Technologies, Inc. develops and operates proprietary technology
  applications in the United States, Canada, Latin America, Europe, the Middle East,
  Africa, and the Asia Pacific. The company operates through three segments: Mobility,
  Delivery, and Freight. The Mobility segment connects consumers with a range of transportation
  modalities, such as ridesharing, carsharing, micromobility, rentals, public transit,
  taxis, and other modalities; and offers riders in a variety of vehicle types, as
  well as financial partnerships products and advertising services. The Delivery segment
  allows consumers to search for and discover restaurants to grocery, alcohol, convenience,
  and other retailers, as well as order a meal or other items, and either pick-up
  at the restaurant or have it delivered; and provides Uber direct, a white-label
  delivery-as-a-service for retailers and restaurants, as well as advertising services.
  The Freight segment manages transportation and logistics networks, which connects
  shippers and carriers in digital marketplace, including carriers upfronts, pricing,
  and shipment booking; and offers on-demand platform to automate logistics end-to-end
  transactions for small-and medium-sized businesses to global enterprises. Uber Technologies,
  Inc. has strategic partnership with Mews to embed ride booking, real-time tracking
  and integrated billing directly into the Mews platform. The company was formerly
  known as Ubercab, Inc. and changed its name to Uber Technologies, Inc. in February
  2011. Uber Technologies, Inc. was founded in 2009 and is headquartered in San Francisco,
  California.'
