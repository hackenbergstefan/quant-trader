longBusinessSummary: Ipsen S.A., a biopharmaceutical company, develops and commercializes
  medicines in the areas of oncology, rare disease, and neuroscience in North America,
  Europe, and internationally. It engages in the development of Somatuline for neuroendocrine
  tumors and acromegaly indications; and Dysport for motor muscular disorders and
  medical aesthetics indications; and Decapeptyl for advanced metastatic prostate
  cancer, uterine fibroids, central precocious puberty, endometriosis, female infertility,
  and early-stage breast cancer in combination with hormone therapy. The company also
  develops Cabometyx for renal cell carcinoma, second line hepatocellular carcinoma,
  differentiated thyroid cancer, and neuroendocrine tumors; Onivyde for second-line
  metastatic pancreatic cancer; and Bylvay for the treatment of progressive familial
  intrahepatic cholestasis and cholestatic pruritus in patients with both PFIC and
  Alagille syndrome. In addition, it is involved in the development of Iqirvo for
  the second line treatment for primary biliary cholangitis; Sohonos for the treatment
  to reduce new, abnormal bone formation in soft and connective tissues, in people
  living with ultra-rare bone disease, and fibrodysplasia ossificans progressiva;
  and IPN60340 in Phase I/II clinical trial for first line acute myeloid leukemia
  indications. Further, the company develops Tazverik + rituximab and lenalidomide
  in Phase III clinical trials for second line follicular lymphoma indications; Tovorafenib
  in Phase III clinical trials for first line pediatric low-grade gliomas indications;
  and IPN01194, IPN01195, IPN60300, and IPN01203 in Phase I for solid tumors indications;
  and IPN10200 in Phase II clinical trials for aesthetic and therapeutic indications.
  Ipsen S.A. was founded in 1929 and is headquartered in Paris, France.
