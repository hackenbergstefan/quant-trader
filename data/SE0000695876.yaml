longBusinessSummary: 'Alfa Laval AB (publ) provides heat transfer, separation, and
  fluid handling products and solutions worldwide. The company operates through three
  divisions: Energy, Food & Pharma, and Ocean. It offers ballast water management
  systems; oil/gas-fired steam and composite steam boilers, exhaust gas economizers,
  electric steam boilers, and exhaust gas steam boilers; and exhaust gas cleaning
  products, as well as decanters and separators. The company also provides sensing
  and control, cleaning validation, and condition monitoring automation products;
  hygienic fittings, hygienic tubes, ultrapure fittings, and ultrapure tubes; agitators,
  tank mixers, and powder mixers; and centrifugal pumps, circumferential piston pumps,
  rotary lobe pumps, twin screws, three screw pumps, gear pumps, and reciprocating
  pumps. In addition, it offers rotary jet heads, rotary spray heads, wall mounted
  cleaning devices for tank cleaning, and static spray balls; and tank covers and
  accessories, as well as valves. Further, the company provides plate heat exchangers,
  air cooled heat exchangers, scraped surface heat exchangers, and tubular heat exchangers.
  It serves energy and utilities, home and personal care, food, dairy and beverage,
  marine and transportation, pharma and biotech, and water and wastewater industries.
  Alfa Laval AB (publ) was founded in 1883 and is headquartered in Lund, Sweden.'
