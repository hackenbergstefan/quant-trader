longBusinessSummary: Alpha Bank S.A., together with its subsidiaries, provides various
  banking and financial products and services in Greece and internationally. The company
  offers savings, premier, deposit, payroll, and payroll for pension accounts, as
  well as savings and sight account in foreign currency. It also provides personal,
  mortgage, home improvement, and green loans; debit, credit, and prepaid cards; digital
  wallets; health, home and car, credit card protection, online transactions, card
  theft, mortgage loan, personal insurance products, as well as unit-linked and insurance
  savings plans; and working capital facilities, corporate loans, leasing products,
  factoring services, letters of guarantee/letters of credit, trading, and wealth
  management services. In addition, the company offers investment products, such as
  mutual funds, investment plans and combined investment, equities and stock exchanges,
  bonds, and term deposits. Further, it provides various business banking products
  and services comprising business banking advisory, business cards, partner ecosystem,
  green solutions for small businesses, deposit products, financing solutions, sectorial
  programmes, insurance, Nexi POS, and international trade; international market products;
  corporate finance, custody, shipping, and other services; and mass payment, Nexi
  XPay, cash management, online legalization for legal entities, tools, online term
  deposit for business, myBusiness benefit, API portal, and e-banking. Additionally,
  the company offers supranational development and national development programmes,
  and recovery and resilience facility loans; gold personal and business banking services;
  GEM portfolio management and e-wealth services, and lombard loans. Alpha Bank S.A.
  was founded in 1879 and is based in Athens, Greece.
