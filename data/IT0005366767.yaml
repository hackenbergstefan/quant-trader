longBusinessSummary: Nexi S.p.A. provides electronic money and payment services to
  banks, small and medium-sized enterprises, large international corporations, institutions,
  and public administrations in Italy, Nordics and Baltics, Germany, Austria, Switzerland,
  Poland, Southeast Europe, and internationally. The company offers payment processing
  and acceptance services; configuration, activation, and maintenance of Point of
  Sales terminals; fraud prevention services; and dispute management services, as
  well as customer support and value-added services. It also provides various issuing
  services, such as issue, supply, and management of private and corporate payment
  cards; payment tracking and the production of monthly statements, data analysis
  and price-setting support services, customer service, and dispute management, as
  well as communication and customer development services; installation and management
  of Automated Teller Machines; clearing services; and digital banking services for
  the management of current accounts and payments. In addition, the company offers
  applications for invoice management and storage, prepaid card reloading, bill payments,
  and postal payments. The company was founded in 1939 and is based in Milan, Italy.
