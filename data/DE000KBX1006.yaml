longBusinessSummary: Knorr-Bremse AG, together with its subsidiaries, develops, produces,
  and markets brake systems for rail and commercial vehicles and other safety-critical
  systems worldwide. It operates in two segments, Rail Vehicle Systems and Commercial
  Vehicle Systems. The Rail Vehicle Systems segment offers braking systems, entrance
  and HVAC systems, sanitary systems, coupling systems, digital solutions, smart services
  for optimizing rail traffic, power electrics, rail computing and communication (RCC)/TCMS,
  signaling systems, stationary and mobile testing equipment, windshield wiper and
  wash systems, and extensive aftermarket solutions. The Commercial Vehicle Systems
  segment provides pneumatic braking systems comprising brake control systems, disk
  brakes, drum brakes, brake cylinders, valves, and pedal units; steering systems;
  vehicle dynamics solutions, such as anti-lock braking systems and electronic stability
  programs; driver assistance systems; automated driving and electronic leveling control;
  energy supply and distribution systems, including compressors and air treatment
  products; and engine components and transmission control systems, such as vibration
  dampers, engine air management, transmission control, and gear/clutch actuation
  products for trucks, buses, trailers, and agricultural machinery. The company offers
  leasing, holding, logistics, and media and IT services. The company was founded
  in 1905 and is headquartered in Munich, Germany. Knorr-Bremse AG operates as a subsidiary
  of KB Holding GmbH.
