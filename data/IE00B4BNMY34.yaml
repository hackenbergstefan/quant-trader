longBusinessSummary: Accenture plc provides consulting and managed services in the
  Americas, Europe, the Middle East, Africa, and the Asia Pacific. It offers artificial
  intelligence and data; cloud consulting; cybersecurity consulting; digital engineering
  and manufacturing; ecosystem partners; emerging technology; finance and risk management
  consulting; infrastructure and capital projects; digital learning; supply chain
  consulting; technology consulting; sustainability consulting; and metaverse solutions,
  as well as customer services. The company also provides proprietary assets and platforms,
  such as GenWizard, SynOps and reinvention.AI to clients. It serves aerospace and
  defense, automotive, banking, capital markets, chemicals, communications and media,
  consumer goods and services, energy, health, high tech, industrial, insurance, life
  sciences, natural resources, private equity, public service, retail, software and
  platforms, travel, and utilities industries. Accenture plc was founded in 1951 and
  is based in Dublin, Ireland.
