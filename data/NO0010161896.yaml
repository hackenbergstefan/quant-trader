longBusinessSummary: DNB Bank ASA provides financial services to individuals and businesses
  in Norway and internationally. The company offers savings, current, currency, client,
  tax withholding, and pension accounts; fixed rate and security deposits; home and
  cabin mortgages, construction and fixed-rate loans, car and consumer loans, business
  loans, and refinancing; home equity credit lines; car, house, home contents, travel,
  personal, and non-life insurance products; payment services; and online and mobile
  banking services, as well as cards. It also provides overdraft facilities; leasing;
  factoring, supply chain, and receivable purchase financing; bank guarantees; secure
  trading, documentary collection, and letter of credit; investment banking services,
  such as mergers and acquisitions, equity and debt capital market, loans, bonds,
  convertible bonds, direct lending, and other private placements; and private financing
  and commodities services. In addition, the company offers equity trading, foreign
  exchange, research, share and stock market, securities, and risk advisory services.
  Further, it provides treasury management, working capital, trade finance, equipment
  financing, real estate broking, and corporate finance services. DNB Bank ASA was
  founded in 1822 and is headquartered in Oslo, Norway.
