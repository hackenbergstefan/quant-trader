longBusinessSummary: Zoetis Inc. engages in the discovery, development, manufacture,
  and commercialization of medicines, vaccines, diagnostic products and services,
  biodevices, genetic tests, and precision animal health solutions for the animal
  health industry in the United States and internationally. The company commercializes
  products primarily across companion animals comprising dogs, cats, and horses; and
  species, including livestock, such as cattle, swine, poultry, fish, and sheep. It
  also offers parasiticides, vaccines, dermatology, anti-infectives, pain and sedation,
  other pharmaceutical, and animal health diagnostics. In addition, the company provides
  animal health diagnostics, including point-of-care diagnostic products, instruments
  and reagents, rapid immunoassay tests, reference laboratory kits and services, and
  blood glucose monitors; and other non-pharmaceutical products, which include nutritionals,
  as well as products and services in biodevices, genetic tests, and precision animal
  health. It markets its products to veterinarians, livestock producers, and pet owners.
  The company has collaborated with Blacksmith Medicines, Inc. to discover and develop
  novel antibiotics for animal health. Zoetis Inc. was incorporated in 2012 and is
  headquartered in Parsippany, New Jersey.
