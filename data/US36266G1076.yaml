longBusinessSummary: 'GE HealthCare Technologies Inc. engages in the development,
  manufacture, and marketing of products, services, and complementary digital solutions
  used in the diagnosis, treatment, and monitoring of patients in the United States,
  Canada, and internationally. The company operates through four segments: Imaging,
  Advanced Visualization Solutions (AVS), Patient Care Solutions (PCS), and Pharmaceutical
  Diagnostics (PDx). The Imaging segment offers molecular imaging, computed tomography
  (CT) scanning, magnetic resonance (MR) imaging, X-ray systems, and women''s health
  products. The AVS segment provides ultrasound, image guided therapies, and interventional
  solutions for screening, diagnosis, treatment, and monitoring of certain diseases
  in clinical areas, such as women''s health, cardiovascular, and comprehensive care
  ultrasound as well as surgical visualization and guidance products. The PCS segment
  provides medical devices, consumables, services, and digital solutions. Its portfolio
  includes patient monitoring, diagnostic cardiology, consumables and services, digital
  solutions, maternal infant care, and anesthesia products. The PDx segment supplies
  diagnostic agents, including CT, angiography and X-ray, MR, single-photon emission
  computed tomography, and positron emission tomography to the radiology and nuclear
  medicine industries. The segment also provides contrast media pharmaceuticals that
  are administered to a patient prior to certain diagnostic scans to increase the
  visibility of tissues or structures during imaging exams; and molecular imaging
  agents or radiopharmaceuticals, which are molecular tracers labeled with radioisotopes.
  The company has a strategic collaboration with DeepHealth. GE HealthCare Technologies
  Inc. was formerly known as GE Healthcare Holding LLC and changed its name to GE
  HealthCare Technologies Inc. in December 2022. The company was incorporated in 2022
  and is headquartered in Chicago, Illinois.'
