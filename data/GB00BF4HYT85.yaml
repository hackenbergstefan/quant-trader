longBusinessSummary: Lion Finance Group PLC, through its subsidiaries, provides banking
  and financial services with focus on the Georgian and Armenian markets. The company
  operates through Georgian Financial Services, Armenian Financial Services, and Other
  Businesses segments. The Georgian Financial Services segment provides retail banking,
  SME, and corporate and investment banking, and corporate center services; and brokerage
  and asset management services. The Armenian Financial Services offers retail banking,
  and investment banking services. The Other Businesses segment provides retail and
  corporate banking services for retail and SME clients in Belarus; and e-commerce,
  ticketing, and inventory management SaaS services. It also offers information sharing
  and market research services, charitable activities, leasing, digital, transportation,
  trade, registrar, card processing, electronic payment services, communication services,
  business servicing, and consulting services. The company was formerly known as Bank
  of Georgia Group PLC and changed its name to Lion Finance Group PLC in February
  2024. Lion Finance Group PLC was incorporated in 2017 and is headquartered in London,
  the United Kingdom.
