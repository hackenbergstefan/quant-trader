longBusinessSummary: Swedbank AB (publ) provides banking products and services to
  private and corporate customers in Sweden, Estonia, Latvia, Lithuania, Norway, the
  United States, Finland, Denmark, Luxembourg, and China. It operates through Swedish
  Banking; Baltic Banking; Corporates and Institutions; and Premium and Private Banking
  segments. The company offers saving and investment solutions, such as savings accounts,
  mutual funds and insurance savings, pension savings, institutional asset management,
  and other savings and investment products; financing solutions, including private
  residential lending, consumer financing, corporate lending, leasing, and other financing
  products, as well as trade finance and factoring services; and payment and card
  services, which include current accounts, cash management, cash handling, debit
  and credit cards, and card acquiring, as well as domestic, international, mobile,
  document, and other payment products. It also provides trading and capital market
  products, such as equity trading, structured products, corporate finance, custody
  services, fixed income and currency trading, and other capital market products;
  other services, including administrative services, treasury operations, real estate
  brokerage and management services, legal services, and safe deposit boxes; and private
  banking services. In addition, the company offers pension insurance and plans, endowment
  insurance, and personal insurance products; mortgage lending; mortgage lending;
  advisory services and investment banking; and transaction banking services comprising
  cash management, securities, account, and clearing and settlement services, as well
  as Internet and mobile banking services. The company was formerly known as ForeningsSparbanken
  AB and changed its name to Swedbank AB (publ) in September 2006. Swedbank AB (publ)
  was founded in 1820 and is headquartered in Sundbyberg, Sweden.
