longBusinessSummary: 'ON Semiconductor Corporation provides intelligent sensing and
  power solutions in Hong Kong, Singapore, the United Kingdom, the United States,
  and internationally. It operates through three segments: Power Solutions Group,
  Analog and Mixed-Signal Group, and Intelligent Sensing Group. The Power Solutions
  Group segment offers discrete, module, and integrated semiconductor devices designed
  to enable power conversion, including power switching, signal conditioning, and
  circuit protection technologies. Its Analog and Mixed-Signal Group segment designs
  and develops analog and mixed-signal solutions, including power management, sensor
  interface, connectivity, and standard products for automotive, industrial automation,
  AI data centers, computing, and mobile end markets. The Intelligent Sensing Group
  segment develops complementary metal-oxide-semiconductor image sensors, image signal
  processors, short-wave infrared sensors, and other products, as well as photon-counting
  technologies, including single-photon avalanche diode arrays and silicon photomultiplier
  devices for depth sensing, factory automation, safety systems, and robotics industries.
  ON Semiconductor Corporation was incorporated in 1992 and is headquartered in Scottsdale,
  Arizona.'
