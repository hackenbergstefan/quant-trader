longBusinessSummary: Moncler S.p.A., together with its subsidiaries, engages in the
  production and distribution of garments, children's clothing, footwear, eyewear
  and other related accessories under the Moncler and Stone Island brands. It also
  provides leather goods; bags, backpacks, and accessories; and glasses. The company
  operates through directly operated stores, e-concessions, multi-brand sales outlets,
  shop-in-shops in luxury department stores, airport locations, and online luxury
  multi-brand retailers. It also sells its products through moncler.com, an online
  store. It operates in Italy, rest of Europe, Asia, the Middle East, Africa, and
  the United States. Moncler S.p.A. was founded in 1952 and is headquartered in Milan,
  Italy.
