longBusinessSummary: Endesa, S.A. engages in the generation, distribution, and sale
  of electricity in Spain, Portugal, France, Germany, the United Kingdom, Switzerland,
  Luxembourg, the Netherlands, Singapore, Italy, Morocco, and internationally. It
  generates electricity from various energy sources, such as hydroelectric, nuclear,
  thermal, wind, and solar. The company also offers advisory services and technology
  relating to energy, distributed generation, and energy demand management; deploys
  infrastructures for charging electric vehicles, vehicle-to-grid, and second-life
  services for batteries; develops integrated services for local administrations,
  such as public lighting, smart city development, energy services, and solutions
  for connectivity; and provides financial solutions for energy producers, as well
  as offers engineering and construction services for facilities related to the electricity
  business. As of December 31, 2025, it had an installed capacity of 22, 616 MW; operated
  321,843 km of distribution networks and transmission grids; and distributed electricity
  to 9,590 thousand customers and gas to 1,699 thousand customers. The company was
  formerly known as Empresa Nacional de Electricidad, S.A. and changed its name to
  Endesa, S.A. in June 1997. The company was incorporated in 1944 and is headquartered
  in Madrid, Spain. Endesa, S.A. is a subsidiary of Enel Iberia Srl.
