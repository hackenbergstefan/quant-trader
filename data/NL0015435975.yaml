longBusinessSummary: Davide Campari-Milano N.V., together with its subsidiaries, trades
  in alcoholic and non-alcoholic beverages in the Americas, Europe, the Middle East,
  Africa, and the Asia-Pacific. It offers a range of products, including aperitifs,
  vodka, whisky, rum, agave, cognac, and champagne under the Aperol, Campari, Picon,
  Cynar, Sarti Rosa, Campari Soda, Crodino, Aperol Spritz RTE, Wild Turkey, Appleton
  Estate, Wray and Nephew, The GlenGrant, Wilderness Trail, Espolòn, Ancho Reyes,
  Montelobos, Grand Marnier, Courvoisier, Bisquit, Champagne Lallier, SKYY Vodka,
  Bulldog Gin, Averna, Braulio, Forty Creek, Frangelico, Cabo Wabo, Del Professore,
  Mondoro, Riccadonna, La Mauny, Trois Rivieres, Kingston 62, O'ndina, Bickens, Dreher,
  Ouzo 12, Sagabita, and Zedda Piras brand names. Davide Campari-Milano N.V. was founded
  in 1860 and is headquartered in Sesto San Giovanni, Italy. Davide Campari-Milano
  N.V. operates as a subsidiary of Lagfin S.C.A.
