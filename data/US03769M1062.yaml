longBusinessSummary: Apollo Global Management, Inc. is a private equity firm specializing
  in investments in credit, private equity, infrastructure, secondaries and real estate
  markets. The firm prefers to invest in private and public markets. The firm's private
  equity investments include traditional buyouts, recapitalization, distressed buyouts
  and debt investments in real estate, corporate partner buyouts, distressed asset,
  corporate carve-outs, middle market, growth capital, venture capital, turnaround,
  bridge, PIPES, corporate restructuring, special situation, acquisition, and industry
  consolidation transactions. For credit strategies, the firm focuses on investing
  in multi-sector credit, semi-liquid credit, direct lending, first lien, unitranche,
  whole loans and private credit. The firm provides its services to endowment and
  sovereign wealth funds, as well as other institutional and individual investors.
  It manages client focused portfolios. The firm launches and manages hedge funds
  for its clients. It also manages real estate funds and private equity funds for
  its clients. The firm invests in the fixed income and alternative investment markets
  across the globe. Its fixed income investments include income-oriented senior loans,
  bonds, collateralized loan obligations, structured credit, opportunistic credit,
  non-performing loans, distressed debt, mezzanine debt, and value oriented fixed
  income securities. The firm seeks to invest in chemicals, commodities, consumer
  and retail, oil and gas, metals, mining, agriculture, commodities, distribution
  and transportation, financial and business services, manufacturing and industrial,
  media distribution, cable, entertainment and leisure, telecom, technology, natural
  resources, energy, packaging and materials, and satellite and wireless industries.
  It also focuses on clean energy, sustainable industry, climate solutions, energy
  transition, industrial decarbonization, sustainable mobility, sustainable resource
  use, and sustainable real estate. It seeks to invest in companies based in across
  Africa, Asia, North America with a focus on United States, Western Europe and Europe.
  It employs a combination of contrarian, value, and distressed strategies to make
  its investments. The firm seeks to make investments in the range of $20 million
  and $1500 million. The firm seeks to invest in companies with enterprise value between
  $750 million to $2500 million and EBITDA up to $75 million. The firm conducts in-house
  research to create its investment portfolio. It seeks to acquire minority and majority
  positions in its portfolio companies. Apollo Global Management, Inc. was founded
  in 1990 and is based in New York, New York with additional offices in North America,
  Asia, Africa and Europe.
