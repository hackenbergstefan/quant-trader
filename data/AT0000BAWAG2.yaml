longBusinessSummary: BAWAG Group AG operates as a holding company for BAWAG P.S.K.
  Bank für Arbeit und Wirtschaft und Österreichische Postsparkasse Aktiengesellschaft
  that provides various banking products and services in Austria, Western Europe,
  Germany, Ireland, Switzerland, the Netherlands, North America, and internationally.
  It operates through Retail & SME; Corporates, Real Estate & Public Sector; and Treasury
  segments. The Retail & SME segment offers savings, payments, securities, cards and
  lending, and investment and insurance products and services; small business lending;
  factoring and leasing business; social housing activities; and auto, mobile, and
  real estate leasing, as well as consumer and mortgage loans. This segment also owns
  issues covered with retail assets and Wohnbaubank bonds. The Corporates, Real Estate
  & Public segment provides lending products; international real estate financing;
  corporate, mid-cap, and public lending; and other financial services. This segment
  also owns issues covered with corporate or public sector assets. The Treasury segment
  offers trading and investment services, such as group asset-liability management
  transactions, including secured and unsecured funding. The company serves retail,
  small business, corporate, real estate, and public sector customers. BAWAG Group
  AG is headquartered in Vienna, Austria.
