longBusinessSummary: Dassault Aviation société anonyme, an aerospace company, engages
  in designing and building military aircraft, business jets, and space systems in
  France, the United States, and internationally. The company offers Rafale, a twin-jet
  fighter aircraft able to operate from both an aircraft carrier and a shore base;
  nEUROn, an unmanned combat air vehicle technology demonstrator; and Multi-Role Falcons,
  designed to perform various government and military missions. It also provides falcon
  family products, including Falcon 10X, Falcon 8X, Falcon 6X, Falcon 900LX, and Falcon
  2000XLS. In addition, the company offers space products, including Véhicule Orbital
  Réutilisable de Transport et d'Exploration (VORTEX), designed to operate in space
  and return to Earth like an aircraft; and Intermediate eXperimental Vehicle (IXV).
  Further, it provides repair and maintenance of landing gear and flight controls;
  overhaul and repair of civil aeronautical equipment for french equipment manufacturers;
  aviation services and maintenance; falcon training; military aircraft mechanics
  training; insurance and reinsurance brokerage; training of fighter pilot; and military
  aircraft support services. Additionally, the company is involved in the design,
  production, and distribution of simulation tools; assembles and produces military
  and civil aerostructure parts and subassemblies; operates in defense and security
  markets; and production of composite aviation parts. The company was founded in
  1916 and is headquartered in Saint-Cloud, France. Dassault Aviation société anonyme
  operates as a subsidiary of Groupe Industriel Marcel Dassault S.A.
