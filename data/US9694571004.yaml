longBusinessSummary: The Williams Companies, Inc., together with its subsidiaries,
  operates as an energy infrastructure company primarily in the United States. It
  operates through Transmission, Power & Gulf, Northeast G&P, West, and Gas & NGL
  Marketing Services segments. The Transmission, Power & Gulf segment comprises Transco,
  NWP, and Mountain West interstate natural gas pipelines, and their related natural
  gas storage facilities, as well as natural gas gathering and processing; and crude
  oil production handling and transportation assets in the Gulf Coast region. The
  Northeast G&P segment engages in the midstream gathering, processing, and fractionation
  activities in the Marcellus Shale region primarily in Pennsylvania and New York,
  and the Utica Shale region of eastern Ohio. The West segment consists of gas gathering,
  processing, and treating operations in the Rocky Mountain region of Colorado and
  Wyoming, the Barnett Shale region of north-central Texas, the Eagle Ford Shale region
  of South Texas, the Haynesville Shale region of northwest Louisiana, the Mid-Continent
  region that includes the Anadarko and Permian basins, and the DJ Basin of Colorado;
  and operates natural gas liquid (NGL) fractionation and storage assets in central
  Kansas near Conway. The Gas & NGL Marketing Services segment provides wholesale
  marketing, trading, storage, and transportation of natural gas for natural gas utilities,
  municipalities, power generators, and producers; asset management services; and
  transports and markets NGLs. The company owns and operates approximately 32,000
  miles of pipelines. The Williams Companies, Inc. was founded in 1908 and is headquartered
  in Tulsa, Oklahoma.
