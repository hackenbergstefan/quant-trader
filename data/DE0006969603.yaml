longBusinessSummary: PUMA SE, together with its subsidiaries, engages in the development
  and sale of sports and sports lifestyle products in Europe, Middle East, Africa,
  India, North America, Latin America, Greater China, Rest of Asia-Pacific, and internationally.
  It offers sports lifestyle products for football, handball, rugby, cricket, volleyball,
  track and field, motor sports, golf, and basketball. The company also issues licenses
  to independent partners to design, develop, manufacture, and sell glasses, safety
  shoes, workwear, and gaming accessories. It sells its products under the PUMA and
  Cobra Golf brands through retail stores, factory outlets, and online stores, as
  well as wholesale and retail trade. PUMA SE was founded in 1919 and is headquartered
  in Herzogenaurach, Germany.
