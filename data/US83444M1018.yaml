longBusinessSummary: 'Solventum Corporation, a healthcare company, develops, manufactures,
  and commercializes a portfolio of solutions to address critical customer and patient
  needs in the United States and internationally. It operates through three segments:
  Medsurg, Dental Solutions, and Health Information Systems. The Medsurg segment offers
  solutions, such as negative pressure wound therapy, advanced wound dressings, advanced
  skin care, synthetic tissue matrices, I.V. site management, sterilization assurance,
  temperature management, surgical supplies, medical tapes and wraps, stethoscopes,
  medical electrodes, and medical technologies for original equipment manufacturers.
  The Dental Solutions segment provides dental and orthodontic products, including
  brackets, aligners, restorative cements, and bonding agents to span the life of
  the tooth, and products for preventative dental care, direct and indirect restoration,
  and orthodontic needs. The Health Information Systems segment offers healthcare
  systems with software solutions comprising computer-assisted physician documentation,
  direct-to-bill and coding automation, classification methodologies, speech recognition,
  and data visualization platforms. The company sells its products and services through
  direct-to-consumer, distribution, key account management, inside sales, and e-commerce.
  Solventum Corporation was incorporated in 2023 and is headquartered in Eagan, Minnesota.'
