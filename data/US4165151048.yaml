longBusinessSummary: The Hartford Insurance Group, Inc., together with its subsidiaries,
  provides insurance and financial services to individual and business customers in
  the United States, the United Kingdom, and internationally. It operates through
  Business Insurance, Personal Insurance, Property & Casualty Other Operations, Employee
  Benefits and Hartford Funds. The company offers insurance coverage, including workers'
  compensation, property, automobile, general and professional liability, package
  business, umbrella, fidelity and surety, marine, livestock, accident, health, and
  reinsurance through regional offices, branches, sales and policyholder service centers,
  independent retail agents and brokers, wholesale agents, and reinsurance brokers.
  The company also provides automobiles, homeowners, and personal umbrella coverages.
  The Property & Casualty Other Operations segment offers coverage for asbestos and
  environmental exposures. In addition, it provides group life, disability, and other
  group coverages to members of employer groups, associations, and affinity groups
  through direct insurance policies; reinsurance to other insurance companies; employer
  paid and voluntary product coverages; disability underwriting, administration, and
  claims processing to self-funded employer plans; leave management solution; distributes
  its group insurance products and services through brokers, consultants, third-party
  administrators, trade associations, and private exchanges. Further, the company
  offers managed mutual funds across various asset classes; and exchange-traded funds
  through broker-dealer organizations, independent financial advisers, defined contribution
  plans, financial consultants, bank trust, and registered investment advisers, as
  well as investment management, distribution, and administrative services, such as
  product design, implementation, and oversight. The company was founded in 1810 and
  is headquartered in Hartford, Connecticut.
