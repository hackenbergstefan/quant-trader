longBusinessSummary: The Charles Schwab Corporation, together with its subsidiaries,
  operates as a savings and loan holding company that provides wealth management,
  securities brokerage, banking, asset management, custody, and financial advisory
  services in the United States and internationally. The company operates in two segments,
  Investor Services and Advisor Services. It offers brokerage accounts with equity
  and fixed income trading, margin lending, options trading, futures and forex trading,
  and cash management capabilities, including money market funds, and certificates
  of deposit; third-party mutual funds through the Mutual Fund Marketplace and Mutual
  Fund OneSource service, as well as mutual fund trading and clearing services to
  broker-dealers; exchange-traded funds; advisory solutions for managed portfolios,
  separately managed accounts, customized personal advice for tailored portfolios,
  specialized planning, and full-time portfolio management; banking products comprising
  checking and savings accounts, first lien residential real estate mortgage loans,
  home equity lines of credit, and pledged asset lines; and trust custody services,
  personal trust reporting services, and administrative trustee services. It provides
  digital and software based trading platforms; research tools, and multichannel support,
  real-time market data, options trading; equity compensation plan sponsors full-service
  recordkeeping for stock plans, stock options, restricted stock, performance shares,
  and stock appreciation rights; retirement plan services; mutual fund clearing services;
  and advisor services, including interactive tools and educational content. The Company
  operates through branch offices. The Charles Schwab Corporation was founded in 1971
  and is headquartered in Westlake, Texas.
