longBusinessSummary: Yara International ASA provides crop nutrition, ammonia, and
  industrial solutions in Norway, European Union, Europe, Africa, Asia, North America,
  Latin America, Australia, and New Zealand. The company offers ammonium- and urea-based
  fertilizers; compound fertilizers that contain nutrients, such as nitrogen, phosphorus,
  and potassium; coatings; biostimulants; organic-based fertilizers; climate choice
  fertilizers; and nitrate-based fertilizers, as well as foliar and fertigation solutions;
  and nitrate, calcium nitrate, micronutrient, and urea fertilizers. It also provides
  digital solutions, such as YaraFX Insight, an agricultural API that connects unparalleled
  crop nutrition expertise with digital platforms; N-sensors, a tractor-mounted sensor;
  N-Tester, a handheld tool that measures chlorophyll content; YaraPlus, a digital
  platform to support crop nutrition decisions; Atfarm, a digital toolbox for farmer;
  Tankmix, an app and web solutions that provides guidelines; Yara E-commerce, a platform
  that enables customer access to nutritional solutions; Yara FarmCare, a mobile app
  for farmers; Yara AllFarm, a farm management platform; YaraConnect, a mobile app
  for retailers; and Yara Crop Nutrition Recommendation System, a service that helps
  farmers to make decisions for crop management. The company sells its products under
  YaraBela, YaraMila, YaraLiva, YaraVita, YaraAmplix, YaraRega, YaraTera, YaraSuna,
  and YaraVera brand names. Yara International ASA was founded in 1905 and is based
  in Oslo, Norway.
