longBusinessSummary: Renault SA engages in the design, manufacture, sale, repair,
  maintenance, and leasing of motor vehicles in Europe, Eurasia, Africa, the Middle
  East, the Asia Pacific, and the Americas. The company operates through Automotive,
  Sales Financing, and Mobility Services segments. The Automotive segment produces,
  sells, and distributes passenger cars and light commercial vehicles. The Sale Financing
  segment is involved in the sales financing, rental, maintenance, and service contracts
  under the Mobilize Financial Services trade name. The Mobility Services segment
  provides mobility and energy solutions for electric vehicle users under the Mobilize
  Beyond Automotive brand. It offers used vehicles and spare parts; and engages in
  the business-to-business powertrain activities, and research and advanced engineering
  activities. The company also engages in the design and production of parts and equipment
  used for manufacturing and operation of vehicles. It serves commercial, light commercial
  and passenger vehicles, tractors, farm machinery and construction equipment under
  the Renault, Dacia, and Alpine brands. The company was founded in 1898 and is based
  in Boulogne-Billancourt, France.
