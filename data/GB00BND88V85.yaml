longBusinessSummary: Bridgepoint Group plc is a private equity and private credit
  firm specializing in middle market, lower mid-market, small mid cap, small cap,
  growth capital, buyouts investments, syndicate debt, infrastructure, direct lending
  and credit opportunities in private credit investments. It prefers to invest in
  advanced industrials, automation, agricultural sciences, energy transition enablers,
  business services, financial services, professional services, testing inspection
  and certification, information services, consumer, digital brands, video games,
  wellbeing products, health care, pharma and Med-Tech outsourced services, pharma
  products, and Med-Tech Products sectors. The firm prefers to invest in companies
  based in United Kingdom, New York, Germany, Austria, Switzerland, Spain, France
  and Nordic region. It prefers to make equity investment between 4.77 million pounds
  ($5.91 million) and 300 million euro ($348.8 million), for small mid cap between
  40 million pounds ($49.54 million) and 125 pounds million ($154.82 million) and
  for small cap between 10 million pounds ($12.39 million) and 25 million pounds ($30.96
  million), with enterprise value between 10 million euro ($10.74 million) and 1000
  million euro ($1073.62 million). Bridgepoint Group plc was founded in 1985 and is
  based in London, United Kingdom with additional offices in North America, Asia and
  Europe. Bridgepoint Group plc formerly known as Bridgepoint Group Limited.
