longBusinessSummary: Hannover Rück SE, together with its subsidiaries, provides reinsurance
  products and services in Germany, the United Kingdom, France, Europe, the United
  States, Asia, Australia, Africa, and internationally. It operates through Property
  & Casualty Reinsurance; and Life & Health Reinsurance segments. The company provides
  property and casualty reinsurance solutions for agricultural, livestock, and bloodstock;
  aviation and space; natural catastrophe; credit, surety, and political risks; cyber;
  digital; marine and upstream energy; natural catastrophes; advanced and facultative
  business, insurance-linked securities and structured reinsurance; and parametric
  solutions. It also offers risk solutions in the areas of critical illness, disability,
  health, longevity, long term care, and mortality. In addition, the company offers
  group life, retirement, lifestyle, credit life, and Takaful reinsurance products.
  Further, the company provides various financial solutions, including new-business
  financing; monetization of embedded value; reserve and solvency relief; and reinsurance
  and solvency II businesses. The company was formerly known as Hannover Rückversicherung
  AG and changed its name to Hannover Rück SE in March 2013. Hannover Rück SE was
  founded in 1966 and is based in Hanover, Germany. Hannover Rück SE operates as a
  subsidiary of Talanx AG.
