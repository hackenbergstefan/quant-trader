longBusinessSummary: 'Comfort Systems USA, Inc., together with its subsidiaries, provides
  mechanical and electrical installation, renovation, maintenance, repair, and replacement
  services for the mechanical and electrical services industry in the United States.
  The company operates through two segments: Mechanical and Electrical. It offers
  heating, ventilation, and air conditioning systems, as well as plumbing, electrical,
  piping and controls, off-site construction, monitoring, and fire protection. The
  company is also involved in the design, engineering, integration, installation,
  and start-up of mechanical, electrical, and plumbing (MEP) and related systems in
  new buildings; and renovation, expansion, maintenance, monitoring, repair, and replacement
  of systems in existing buildings. In addition, it provides remote monitoring of
  power usage, temperature, pressure, humidity and air flow for MEP and other building
  systems. The company serves building owners and developers, general contractors,
  architects, consulting engineers, and property managers in the commercial, industrial,
  and institutional markets. Comfort Systems USA, Inc. was founded in 1917 and is
  headquartered in Houston, Texas.'
