longBusinessSummary: EQT Corporation engages in the exploration, production, gathering,
  and transmission of hydrocarbons and natural gas. The company sells natural gas,
  natural gas liquids, and oil to marketers, utilities, and industrial customers located
  in the Appalachian Basin. It also provides marketing services and contractual pipeline
  capacity management services, as well as engages in risk management and hedging
  activities. In addition, it owns and operates propane storage and distribution terminals.
  The company was formerly known as Equitable Resources Inc. and changed its name
  to EQT Corporation in February 2009. EQT Corporation was founded in 1888 and is
  headquartered in Canonsburg, Pennsylvania.
