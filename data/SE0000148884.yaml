longBusinessSummary: Skandinaviska Enskilda Banken AB (publ) provides corporate, retail,
  investment, and private banking services. It operates through Corporate & Investment
  Banking, Business & Retail Banking, Wealth & Asset Management, and Baltic segments.
  The company offers core banking products comprising loans, leasing, cards, and payment-related
  products; life insurance and pension solutions; capital market products consisting
  of trading and issues on financial markets; fund management; treasury services;
  structured financing solutions for commercial real estate, infrastructure projects,
  and shipping; investment banking services, including advisory, execution, and financing
  solutions for mergers and acquisitions, equities, leveraged finance, and debt capital
  markets; execution, advisory, and research for fixed income, currencies, and commodities;
  trade finance and asset solutions; and post-trade services, including sub-custody
  and global custody services. It also provides cash management products, including
  liquidity and integration services; venture capital; investor services; markets
  and trading services, such as equities, fixed income, commodities, foreign exchange,
  trading, sustainable financial products, prime brokerage, and derivatives clearing;
  trade and supply chain financing, including trade and export finance, and receivables
  and supply chain finance; private wealth management services; as well as invests
  in funds, equities, fixed income, commodities, and private equity. The company serves
  large corporates, financial institutions, private individuals, and small and medium-sized
  companies. It operates in Sweden, Denmark, Finland, Norway, Estonia, Latvia, Lithuania,
  Germany, the United Kingdom, Austria, the Netherlands, Switzerland, China, Hong
  Kong, Ireland, Luxembourg, Poland, Singapore, the United States, Ukraine, Russia,
  and internationally. Skandinaviska Enskilda Banken AB (publ) was founded in 1856
  and is headquartered in Stockholm, Sweden.
