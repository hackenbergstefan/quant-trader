longBusinessSummary: 'Gartner, Inc. provides business and technology insights to support
  decision-making and performance on an organization''s mission-critical priorities
  in the United States, Canada, Europe, the Middle East, Africa, and internationally.
  It operates through three segments: Insights, Conferences, and Consulting. The Insights
  segment delivers insights through subscription services, such as access to published
  content, data and benchmarks, and direct access to a network of business and technology
  experts. The Conferences segment enables executives and teams to learn, share, and
  network through its Symposium/Xpo series and peer-driven sessions, as well as through
  its conferences focused on specific business roles and topics. The Consulting segment
  provides technology-driven strategic initiatives, including custom analysis and
  on-the-ground support to senior executives. This segment also offers actionable
  solutions for IT-related priorities, including IT cost optimization, digital transformation,
  and IT sourcing optimization. The company was formerly known as Gartner Group, Inc.
  and changed its name to Gartner, Inc. in November 2001. Gartner, Inc. was founded
  in 1979 and is headquartered in Stamford, Connecticut.'
