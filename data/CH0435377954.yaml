longBusinessSummary: SIG Group AG provides aseptic carton packaging systems and solutions
  for beverage and food products primarily in Europe, India, the Middle East, Africa,
  the Asia Pacific, and the Americas. The company provides carton, bag-in-box, and
  spouted pouch packaging solutions; filling lines and other related equipment, packaging
  material, and after-sales services; carton sleeves, closures, and barrier film and
  fitments; and commodity hedging products. It operates in China, the United States,
  Germany, India, Brazil, the Netherlands, Australia, Austria, Mexico, Russia, Saudi
  Arabia, South Korea, Switzerland, Taiwan, Thailand, Spain, and the United Arab Emirates.
  The company was formerly known as SIG Combibloc Group AG and changed its name to
  SIG Group AG in April 2022. SIG Group AG was founded in 1853 and is headquartered
  in Neuhausen am Rheinfall, Switzerland.
