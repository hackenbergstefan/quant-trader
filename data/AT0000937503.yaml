longBusinessSummary: 'Voestalpine AG processes, develops, manufactures, and sells
  steel and technology products in Austria, the European Union, and internationally.
  It operates through five divisions: Steel Division, High Performance Metals Division,
  Metal Engineering Division, Metal Forming Division, and Holding & Group Services.
  The Steel division produces hot and cold-rolled steel strips, as well as electrogalvanized,
  hot-dip galvanized, and organically coated steel strips; heavy plates, and foundry
  products for the energy sector; and turbine casings. The High Performance Metals
  division offers special high-alloy tool and high-speed steel for the oil and natural
  gas, aerospace, and energy engineering industries; utilizing nickel-base and titanium
  alloys; tool manufacturing, component processing, heat treatment, and coating services;
  warehousing and preprocessing of special steels; and various services, including
  logistics, distribution, and processing for the oil and natural gas industries.
  The Metal Engineering division provides wire rods and drawn wires, seamless tubes
  for special applications, and welding consumables and machinery; rails and digital
  monitoring systems; and services related to rail infrastructure. The Metal Forming
  segment manufactures refined special sections, tubes, and precision strip steel
  products; pre-finished system components made from pressed, punched, and roll-profiled
  parts; and storage system solutions for manufacturers in the automotive production
  and supply industries, as well as various companies in the commercial vehicle, construction,
  storage, energy, and agricultural machinery industries. It serves automotive, energy,
  railway systems, construction, mechanical engineering, white goods/consumer goods,
  aerospace, and other industries. Voestalpine AG is headquartered in Linz, Austria.'
