longBusinessSummary: Vinci SA, together with its subsidiaries, engages in concessions,
  energy, and construction businesses in France and internationally. It operates through
  Concessions, Energy Solutions, and Construction segments. The company's Concessions
  segment operates motorways, autoroutes, airports, highways, railways, and stadiums.
  Its Energy segment provides services to the manufacturing sector, infrastructure,
  building solutions and facilities management, and information and communication
  technology; and industrial and energy-related services, which includes development
  of renewable energy assets, as well as engineering, procurement, construction projects
  in the energy sector, and development of renewable energy production facilities
  of solar, and wind farms. The company's Construction segment engages in designing
  and undertaking projects, which includes general contractor; geotechnical, and structural
  engineering and related digital activities, as well as provision of services in
  nuclear engineering; undertaking building, civil engineering, roadworks, rail works,
  and water works; development of properties, including residential and commercial
  properties; and management of residences and property services. Vinci SA was founded
  in 1899 and is headquartered in Nanterre, France.
