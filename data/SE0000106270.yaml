longBusinessSummary: H & M Hennes & Mauritz AB (publ) provides clothing, accessories,
  footwear, cosmetics, home textiles, and homeware for women, men, and children worldwide.
  It offers sportswear, shoes, bags, accessories, ready-to-wear, activewear, and jeans;
  interior products, including bed linens, towels and tablecloths, tableware, furniture,
  and lighting; and beauty products, such as make-up and fragrance collections. The
  company provides its products under the H&M, H&M HOME, H&M Move, H&M Beauty, COS,
  Cheap Monday, Weekday, Monki, & Other Stories, ARKET, and Singular Society brand
  names. In addition, it operates Sellpy, a broad digital platform for second-hand
  fashion and other products; Smartex.ai, a platform that detects faults in real time
  and helps in textile production; Syre, a platform which focuses on scaling textile-to-textile
  recycling primarily polyester; and A Retro Tale offers selected vintage and secondhand
  accessories, as well as provides collecting and sorting solutions to extend the
  useful life of no longer used garments through reuse and recycling under Looper
  Textile name. Further, the company operates seasonal vegetarian cafés and coffee
  shops. It offers its products through online and physical stores. H & M Hennes &
  Mauritz AB (publ) was incorporated in 1943 and is headquartered in Stockholm, Sweden.
