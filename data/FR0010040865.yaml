longBusinessSummary: 'Gecina is a leading operator that fully integrates all real
  estate expertise, owning, managing, and developing a unique prime portfolio valued
  at 17.4billion euros as at June 30, 2026. Strategically located in the most central
  areas of Paris and the Paris Region, Gecina''s portfolio includes 1.2 million sq.m
  of office space and nearly 5,000 residential units. By combining long-term value
  creation with operational excellence, Gecina offers high-quality, sustainable living
  and working environments tailored to the evolving needs of urban users. As a committed
  operator, Gecina enhances its assets with high-value services and dynamic property
  and asset management, fostering vibrant communities. Gecina places user experience
  at the heart of its strategy. In line with its social responsibility commitments,
  the Fondation Gecina supports initiatives across four core pillars: disability inclusion,
  environmental protection, cultural heritage, and housing access. Gecina was incorporated
  in 10th February 1959 in France.'
