longBusinessSummary: "TE Connectivity plc, together with its subsidiaries, manufactures\
  \ and sells connectivity and sensor solutions in Europe, the Middle East, Africa,\
  \ the Asia\x96Pacific, and the Americas. The company operates through Transportation\
  \ Solutions and Industrial Solutions segments. It provides antennas, application\
  \ tooling, automotive parts, cable assemblies, connectors, electromagnetic compatibility/electromagnetic\
  \ interference solutions, energy and power, fiber optics, heat shrink tubing, identification\
  \ and labeling, medical components, passive components, relays and contactors, sensors,\
  \ switches, terminals and splices, wires and cables, and wire protection and management\
  \ solutions. The company also offers training and other services, including 3D printing\
  \ for production, electrical installation training, HarnWare software, machine tooling\
  \ service and repair, medical device design services, material science academy,\
  \ and sensor manufacturing services as well as conducts automotive webinars. It\
  \ serves 5G and wireless equipment, aerospace, appliances, automation and control,\
  \ automotive, autosport, commercial and industrial vehicles, connected home, data\
  \ centers and artificial intelligence, defense and military, energy solutions, e-mobility,\
  \ industrial machinery, intelligent buildings, IoT connectivity, medical technologies,\
  \ oil and gas/marine, personal electronics and wearable technology, rail, sensor\
  \ applications, space, and other industries. The company was formerly known as Tyco\
  \ Electronics Ltd. and changed its name to TE Connectivity plc in March 2011. TE\
  \ Connectivity plc was founded in 1941 and is based in Ballybrit, Ireland."
