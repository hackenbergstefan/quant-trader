longBusinessSummary: 'Elevance Health, Inc., together with its subsidiaries, operates
  as a health benefits company in the United States. The company operates in four
  segments: Health Benefits, CarelonRx, Carelon Services, and Corporate & Other. It
  offers a variety of health plans and services to individual, employer group risk-based
  and fee-based, BlueCard, Medicare, Medicaid, and FEP members; health products; a
  broad array of fee-based administrative managed care services; and specialty and
  other insurance products and services, such as stop loss, dental, vision, and supplemental
  health insurance benefits. The company also operates in the pharmacy services business;
  and markets and offers pharmacy services, including home delivery and specialty
  pharmacies, claims adjudication, formulary management, pharmacy networks, rebate
  administration, a prescription drug database, and member services, as well as infusion
  services and injectable therapies through ambulatory infusion centers. In addition,
  it provides healthcare related services and capabilities, including specialty care
  enablement and utilization management support for specialized clinical domains;
  behavioral health and comprehensive care management services; palliative care services
  and management; virtual care; and payment integrity, subrogation, clinical data
  exchange through its HealthOS platform, research and data, reporting and clinical
  analytics, information technology, and business process support services, as well
  as manages home health, post-acute institutional management, and durable medical
  equipment costs; and supports plans in managing home and community-based services.
  The company provides its services under the Anthem Blue Cross and Blue Shield, Wellpoint,
  and Carelon brands. The company was formerly known as Anthem, Inc. and changed its
  name to Elevance Health, Inc. in June 2022. Elevance Health, Inc. was incorporated
  in 2001 and is based in Indianapolis, Indiana.'
