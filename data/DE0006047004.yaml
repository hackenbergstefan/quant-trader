longBusinessSummary: Heidelberg Materials AG, together with its subsidiaries, produces
  and distributes cement, aggregates, ready-mixed concrete, and asphalt worldwide.
  The company provides cement products; natural stone aggregates, including sand and
  gravel; crushed aggregates comprising stone chippings and crushed stones; and ready-mixed
  concrete for use in the construction of tunnels or bridges, office buildings, or
  schools, as well as to produce precast concrete parts, such as stairs, ceiling elements,
  or structural components. It also offers asphalt; and trades in cement, clinker,
  secondary cementitious materials, solid, alternative fuels, other building materials,
  and additives. The company was formerly known as HeidelbergCement AG and changed
  its name to Heidelberg Materials AG in May 2023. Heidelberg Materials AG was founded
  in 1873 and is headquartered in Heidelberg, Germany.
