longBusinessSummary: Schindler Holding AG engages in the production, installation,
  maintenance, and modernization of elevators, escalators, and moving walks worldwide.
  It offers Schindler PORT, a transit management system; CleanMobility solutions;
  Schindler R.I.S.E, a robotic installation system; Schindler MetaCore which enables
  buildings to be repurposed and their functionality to be reconfigured; Schindler
  CLIMB Lift, a self-climbing system; Schindler X8; Digital Twin; and BuildingMinds,
  a cloud based SaaS platform that lets users monitor the performance of a real estate
  portfolio. In addition, the company provides digital services; and Building Information
  Modeling which provides traceability and insights throughout the project life cycle,
  including planning, design, construction, operation, and maintenance. The company
  was founded in 1874 and is headquartered in Hergiswil, Switzerland.
