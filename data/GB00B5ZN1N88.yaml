longBusinessSummary: SEGRO Plc is a UK Real Estate Investment Trust (REIT), listed
  on the London Stock Exchange and Euronext Paris. The company owns, manages and develops
  modern warehousing, industrial property and data centres across the UK and seven
  other European countries, with a portfolio of 10.9 million square meters of space
  (117 million square feet) valued at 22.0 billion pounds. SEGRO's active approach
  to asset management and disciplined approach to capital allocation has created a
  portfolio of high-quality, sustainable buildings in some of Europe's largest cities
  and at key transport and digital infrastructure hubs. From big-box logistics to
  urban warehousing and data centres, SEGRO Plc creates the space that enables extraordinary
  things to happen. It provides the infrastructure of modern economies and everyday
  life, enabling efficient, low-carbon supply chains and digital connectivity across
  Europe, helping drive growth and job creation. This space supports a diverse customer
  base including retailers, manufacturers, logistics providers and technology companies.
  SEGRO Plc was incorporated in 1920 in United Kingdom.
