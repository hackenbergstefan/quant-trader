longBusinessSummary: Gilead Sciences, Inc., a biopharmaceutical company, discovers,
  develops, and commercializes medicines in the areas of unmet medical need in the
  United States, Europe, and internationally. The company provides Biktarvy, Descovy,
  Genvoya, Odefsey, Sunlenca, Symtuza, and YeztugoFor the treatment of HIV-1 infection
  in patients. It also provides Epclusa, Livdelzi, and Vemlidy to treat chronic hepatitis
  C virus, primary biliary cholangitis, and chronic hepatitis B virus; Tecartus, a
  T-cell therapy for the treatment of adult patients; Trodelvy, an injection for intravenous
  use; and Yescarta, a suspension for intravenous infusion, is a CAR T-cell therapy
  for the treatment of adult patients. Further, it provides AmBisome, for the treatment
  of serious invasive fungal infections; and Veklury for the treatment of COVID-19.
  Additionally, the company engages in the development of various immunotherapies
  for patients with cancer and other incurable diseases. The company has collaboration
  agreements with Shenzhen Pregene Biopharma Co., Ltd.; Abingworth; Arcus Biosciences,
  Inc.; Merck Sharp & Dohme Corp.; Janssen Sciences Ireland Unlimited Company; Japan
  Tobacco, Inc.; Everest Medicines; Merck & Co, Inc.; Tentarix Biotherapeutics Inc.;
  and Assembly Biosciences, Inc. It also has research collaboration, option, and license
  agreement with Merus N.V. for the discovery of novel dual tumor-associated antigens
  (TAA) targeting trispecific antibodies. The company has a collaboration with Terray
  Therapeutics, Inc. to discover and develop small molecule therapies; and LEO Pharma
  to develop, manufacture, and commercialize the small molecule oral STAT6 program.
  The company has a partnership with Pan American Health Organization (PAHO) to accelerate
  access to lenacapavir for HIV prevention as pre-exposure prophylaxis (PrEP) across
  all PAHO member states in Latin America and the Caribbean. The company was incorporated
  in 1987 and is headquartered in Foster City, California.
