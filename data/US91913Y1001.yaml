longBusinessSummary: 'Valero Energy Corporation manufactures, markets, and sells petroleum-based
  and low-carbon liquid transportation fuels and petrochemical products in the United
  States, Canada, the United Kingdom, Ireland, Latin America, Mexico, Peru, and internationally.
  It operates through three segments: Refining, Renewable Diesel, and Ethanol. The
  company produces California Reformulated Gasoline Blendstock for Oxygenate Blending
  (CARBOB) and Conventional Blendstock for Oxygenate Blending (CBOB) gasolines, CARB
  diesel, diesel, jet fuel, heating oil, and asphalt; feedstocks; aromatics; sulfur
  and residual fuel oil; intermediate oils; and sulfur, sweet, and sour crude oils.
  It sells its refined products through wholesale rack and bulk markets; and through
  outlets under the Valero, Beacon, Diamond Shamrock, Shamrock, Ultramar, and Texaco
  brands. The company also owns and operates renewable diesel and ethanol plants,
  as well as produces and sells renewable diesel, renewable naphtha, and neat sustainable
  aviation fuel under the Diamond Green Diesel brand name. In addition, it offers
  ethanol and various co-products, including dry distillers grains, syrup, and inedible
  distillers corn oil to animal feed customers. The company was formerly known as
  Valero Refining and Marketing Company and changed its name to Valero Energy Corporation
  in August 1997. Valero Energy Corporation was founded in 1980 and is headquartered
  in San Antonio, Texas.'
