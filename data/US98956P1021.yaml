longBusinessSummary: Zimmer Biomet Holdings, Inc., together with its subsidiaries,
  operates as a medical technology company worldwide. The company designs, manufactures,
  and markets orthopedic reconstructive products, such as knee and hip products; S.E.T.
  products, including sports medicine, biologics, foot and ankle, upper extremities,
  and trauma and CMFT products; sports medicine products for the repair of soft tissue
  injuries, used in the knee and shoulder; and craniomaxillofacial and thoracic products
  comprising face and skull reconstruction products, as well as products that fixate
  and stabilize the bones of the chest to facilitate healing or reconstruction after
  open-heart surgery, trauma, or for deformities of the chest. It offers technology
  and data, bone cement, and surgical products; and a suite of integrated digital
  and robotic technologies that leverage data, data analytics and artificial intelligence.
  The company's products and solutions are used to treat patients suffering from disorders
  of, or injuries to, bones, joints, or supporting soft tissues. It serves orthopedic
  surgeons, neurosurgeons, hospitals, healthcare institutions, stocking distributors,
  healthcare dealers, and other specialists, as well as agents, healthcare purchasing
  organizations, or buying groups. It also offers ROSA Robot, which utilizes robotic
  technologies to assist a surgeon with implant positioning in total knee arthroplasty
  or partial knee arthroplasty; and the ZBEdge Platform connects robotic and digital
  technologies together to collect data before, during and after surgery, that can
  deliver insights to surgeons to assist in making informed decisions on patient care.
  The company was formerly known as Zimmer Holdings, Inc. and changed its name to
  Zimmer Biomet Holdings, Inc. in June 2015. Zimmer Biomet Holdings, Inc. was founded
  in 1927 and is headquartered in Warsaw, Indiana.
