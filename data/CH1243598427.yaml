longBusinessSummary: Sandoz Group AG develops, manufactures, and markets generic and
  biosimilars worldwide. The company covers therapeutic areas, including cardiovascular,
  central nervous system, oncology, infectious diseases, pain and respiratory, supportive
  care, rare diseases, diabetes, immunology, endocrinology, neurology, osteoporosis,
  nephrology, hematology, and ophthalmology. It also provides a portfolio of active
  pharmaceutical ingredients and finished dosage forms. The company has a strategic
  collaboration with Shanghai Henlius Biotech, Inc. to broaden patient access to biosimilar
  medicines. Sandoz Group AG was founded in 1886 and is headquartered in Basel, Switzerland.
