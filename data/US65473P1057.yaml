longBusinessSummary: NiSource Inc., an energy holding company, operates as a regulated
  natural gas and electric utility company in the United States. It operates in two
  segments, Columbia Operations and NIPSCO Operations. The company provides natural
  gas to residential, commercial, and industrial customers through approximately 37,300
  miles of distribution main pipeline and the associated individual customer service
  lines; and 310 miles of transmission main pipeline in Ohio, Pennsylvania, Virginia,
  Kentucky, and Maryland. It also generates, transmits, and distributes electricity
  to approximately 0.5 million customers in various counties in the northern part
  of Indiana, as well as engages in wholesale electric and transmission transactions.
  It owns and operates steam coal generating stations in Wheatfield and Michigan City;
  combined cycle gas turbine in West Terre Haute; natural gas generating units in
  Wheatfield; hydro generating plants in Carroll County and White County; wind generating
  units in White County; and solar generating units in Sullivan County, Gibson County,
  Jasper County, and White County. The company was formerly known as NIPSCO Industries,
  Inc. and changed its name to NiSource Inc. in April 1999. NiSource Inc. was founded
  in 1847 and is headquartered in Merrillville, Indiana.
