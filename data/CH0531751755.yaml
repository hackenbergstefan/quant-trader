longBusinessSummary: 'Banque Cantonale Vaudoise engages in the provision of various
  financial services in Vaud Canton and rest of Switzerland, the European Union, North
  America, and internationally. It operates through four divisions: Retail Banking,
  Private Banking, Corporate Banking, and Asset Management & Trading. The company
  offers current, savings, foreign-currency, and retirement investment accounts; overdraft
  facilities; credit and payment cards; mortgage, personal, home, business, and construction
  loans; and production equipment financing and working capital and international
  trade finance products. It also provides a range of banking services, such as investments,
  real estate, financial planning services, and trading through its TradeDirect online
  platform; and cash management services, as well as instruments for hedging exchange-rate
  and interest-rate risk. In addition, the company offers asset and wealth management
  services; and investment and hedging products, such as currencies, equities, bonds,
  derivatives, and structured products. Further, it engages in the market transactions
  in equities, fixed-income instruments, forex, and precious metals on behalf of clients.
  Additionally, the company provides life insurance products, ATMs, and online banking
  services; manages finances and investments of high-net-worth individuals; and advisory
  services, such as tax planning, estate planning, and financial planning; and retirement,
  life insurance, and disability coverages. It primarily serves retail and business
  customers, and public sector institutions. Banque Cantonale Vaudoise was founded
  in 1845 and is headquartered in Lausanne, Switzerland.'
