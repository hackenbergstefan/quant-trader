longBusinessSummary: Temenos AG develops, markets, and sells integrated banking software
  systems to banking and other financial services institutions in North America, Europe,
  the Middle East and Africa, Latin America, and the Asia-Pacific. It operates through
  two segments, The Product and Service. The Product segment is primarily engaged
  in marketing, licensing and maintaining the Group's software solutions, including
  software development fees for requested functionality, as well as providing hosting
  and subscription arrangements. The Services segment represents various implementation
  tasks, such as consulting and training. It also offers retail and business; corporate
  and commercial; and wealth management solutions. The company was formerly known
  as Temenos Group AG and changed its name to Temenos AG in May 2018. Temenos AG was
  founded in 1993 and is headquartered in Lancy, Switzerland.
