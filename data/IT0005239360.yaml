longBusinessSummary: UniCredit S.p.A. provides commercial banking services in Italy,
  Germany, Central Europe, and Eastern Europe. The company offers retail, private,
  and wealth management solutions; and institutional investor solutions. It also provides
  corporate finance advisory, rating advisory, financial sponsor, patient capital,
  capital structure advisory, and sustainable finance solutions, as well as securities
  services. In addition, the company offers transactional and risk management, structured
  finance, debt funding, equity funding, project finance, commodity trade finance,
  and trade and export finance services; group trade and correspondent banking services;
  and payments solutions. It also owns and operates a digital platform that provides
  a one-stop-shop solution for the lending markets, offering a wide range of private
  debt transactions on both primary and secondary markets. The company serves SME,
  corporate, multinational corporate, financial institution, and public sector clients,
  as well as retail, private banking, wealth management, and family office clients.
  It has a strategic collaboration with Accenture plc and International Business Machines
  to establish a new technology operating model combining the resilience of mission-critical
  systems with the flexibility of cloud, data, and artificial intelligence. UniCredit
  S.p.A. was founded in 1870 and is headquartered in Milan, Italy.
