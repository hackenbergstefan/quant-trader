longBusinessSummary: 'The Clorox Company manufactures and markets consumer and professional
  products worldwide. It operates through four segments: Health and Wellness, Household,
  Lifestyle, and International. The company home care cleaning and disinfecting products
  and laundry additives, skin sanitization and cleaning products, professional cleaning
  and disinfecting products, and professional food service products under the Clorox,
  Clorox2, Pine-Sol, Scentiva, Tilex, Liquid-Plumr, Formula 409, Purell, GOJO, CloroxPro,
  Clorox Healthcare, Hidden Valley, Poett, Clorinda, and Chux brands. It also provides
  bags and wraps, cat litter, and grilling products under the Glad, Fresh Step, Scoop
  Away, Kingsford, and Ever Clean brands; and dressings, dips, seasonings, sauces,
  water-filtration products, and natural personal care products under the Brita and
  Burt''s Bees brands. The company sells its products through mass retailers; grocery
  outlets; warehouse clubs; dollar stores; home hardware centers; drug, pet, and military
  stores; third-party and owned e-commerce channels; distributors; and other retail
  outlets through direct sales force. The company was founded in 1913 and is headquartered
  in Oakland, California.'
