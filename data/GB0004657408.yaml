longBusinessSummary: Mitie Group plc, together with its subsidiaries, provides facilities
  management and professional services in the United Kingdom and internationally.
  It operates through the Business Services, Technical Services, and Corporate Centre
  segments. The company offers cleaning and hygiene, decarbonization, engineering
  maintenance, integrated facilities management, landscapes and grounds maintenance,
  projects, security and intelligence, waste and environmental management, managed
  water, guest services, and workplace solutions. It serves the central government,
  critical environments, data centers, defense, education, financial and professional
  services, healthcare, immigration and justice, life sciences, manufacturing, local
  government, retail and shopping centers, transport and aviation, and utilities sectors,
  as well as the media, telecoms, and tech sector. The company was incorporated in
  1936 and is headquartered in London, the United Kingdom.
