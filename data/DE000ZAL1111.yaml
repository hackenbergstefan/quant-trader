  retail, and commission sale of various type of goods, including shoes, apparel,
  accessories, and beauty products with free delivery and returns, as well as various
  payment options. The company sells its products through Lounge by Zalando and its
  outlets. Zalando SE was founded in 2008 and is headquartered in Berlin, Germany.
