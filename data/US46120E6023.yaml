longBusinessSummary: Intuitive Surgical, Inc. develops, manufactures, and markets
  products that enable physicians and healthcare providers to enhance the quality
  of and access to minimally invasive care in the United States and internationally.
  It offers the da Vinci Surgical System that enables surgical procedures using a
  minimally invasive approach; and Ion endoluminal system, which extends its commercial
  offerings beyond surgery into diagnostic endoluminal procedures enabling minimally
  invasive biopsies in the lung. The company also provides a suite of stapling, energy,
  and core instrumentation for its multi-port da Vinci surgical systems; progressive
  learning pathways to support the use of its technology; infrastructure of customer
  service and support specialists, a complement of services to its customers, including
  installation, repair, maintenance, 24/7 technical support, and proactive system
  health monitoring; and integrated digital capabilities providing connected offerings,
  streamlining performance for hospitals with program-enhancing insights. It sells
  its products through direct sales organizations, such as capital and clinical sales
  teams. Intuitive Surgical, Inc. was incorporated in 1995 and is headquartered in
  Sunnyvale, California.
