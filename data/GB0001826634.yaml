longBusinessSummary: 'Diploma PLC, together with its subsidiaries, supplies specialized
  technical products and services in the United Kingdom, Europe, North America, and
  internationally. It operates through three business sectors: Controls, Seals, and
  Life Sciences. The Controls sector offers wire and cabling, interconnect, specialty
  fasteners, specialty adhesive and industrial automation solutions for various applications.
  The Seals sector supplies sealing and fluid power products, gaskets, hoses and fittings,
  pumps and valves, and solutions for aftermarket repairs, original equipment manufacturing,
  and maintenance, repair and overhaul projects. The Life Sciences sector supplies
  and services equipment; provides consumables and instrumentation for surgery, diagnosis
  of disease, and critical care support; and supplies diagnostic and scientific technologies,
  surgical instruments, medical devices, endoscopes, patient monitoring equipment,
  specialist hospital supplies, and clinical nutrition. It serves public and private
  hospitals, clinics and diagnostics laboratories. Diploma PLC was incorporated in
  1999 and is based in London, the United Kingdom.'
