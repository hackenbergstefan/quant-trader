longBusinessSummary: 'M&T Bank Corporation operates as a bank holding company for
  Manufacturers and Traders Trust Company and Wilmington Trust, National Association
  that provides retail and commercial banking products and services in the United
  States. The company operates through three segments: Commercial Bank, Retail Bank,
  and Institutional Services and Wealth Management. It offers a range of credit products
  and banking services, such as commercial lending and leasing, letters of credits,
  deposit products, cash management services, commercial real estate loans, and credit
  facilities secured by various commercial real estate properties to middle-market
  and large commercial customers. The company also provides customers deposit products,
  including demand, savings and time accounts, and other services; automobile and
  recreational finance loans, home equity loans and lines of credit, credit cards,
  and other loan products, as well as residential mortgage and real estate loans;
  business loans, cash management, payroll, direct deposit, and merchant credit card
  services to consumers and small businesses through branch network, telephone banking,
  internet banking, and automated teller machines. In addition, it offers trustee,
  agency, investment management, and administrative services; personal trust, planning
  and advisory, fiduciary, asset management, family office, and other services; and
  investment products, including mutual funds and annuities, and other services for
  corporations and institutions, investment bankers, corporate tax, finance and legal
  executives, and other institutional clients. M&T Bank Corporation was founded in
  1856 and is headquartered in Buffalo, New York.'
