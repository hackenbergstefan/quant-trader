longBusinessSummary: Delta Air Lines, Inc. provides scheduled air transportation for
  passengers and cargo in the United States and internationally. The company operates
  through two segments, Airline and Refinery. Its domestic network centered on core
  hubs in Atlanta, Detroit, Minneapolis-St. Paul, and Salt Lake City, as well as coastal
  hub positions in Boston, Los Angeles, New York-LaGuardia, New York-JFK, and Seattle;
  and international network centered on hubs and market presence in Amsterdam, Bogota,
  Lima, Mexico City, London-Heathrow, Paris-Charles de Gaulle, Santiago (Chile), Sao
  Paulo, Seoul-Incheon, and Tokyo. It also provides aircraft maintenance and engineering
  support, repair, and overhaul services; and vacation packages. The company operates
  through a fleet of approximately 1,314 aircraft. Delta Air Lines, Inc. was founded
  in 1924 and is headquartered in Atlanta, Georgia.
