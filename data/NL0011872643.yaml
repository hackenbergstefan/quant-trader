longBusinessSummary: 'ASR Nederland N.V. provides insurance, pensions, and mortgages
  products and services for consumers, businesses, and employers in the Netherlands.
  The company operates through five segments: Non-Life, Life, Asset Management, Distribution
  and Services, and Holding and Other. It offers individual and group disability,
  as well as sickness leave; property and casualty, including motor, fire, liability,
  legal aid, travel and recreation, pet, and transport insurance; and health insurance,
  such as basic and supplementary health insurance. The company also provides pension
  products; Individual term life insurance; and funeral capital insurance. In addition,
  it is involved in the provision of asset management services, including investment
  property management, as well as managing of corporate bonds, government bonds, and
  equities; investment solutions; manages non-listed sector funds, which invest in
  retail and residential properties, offices, real estate on science parks, agricultural
  land, and renewable energy sources comprising wind, solar farms, and energy storage;
  and develops investment strategies. Further, the company operates in the residential
  mortgage markets under a.s.r. and Aegon brands; and specialised products for first-time
  buyers, customers who want to finance sustainable home modifications and senior
  citizens. Additionally, it engages in the provision of distribution and services;
  involved in the group-related activities, real estate development business, and
  activities relating to private investments for customers; offers expert guidance,
  software and advice on creating healthy and safe working environments services under
  the ArboNed, Mensely, HumanCapitalCare, Focus, and IT&Care brands; and health and
  reintegration services. The company was formerly known as Fortis Verzekeringen Nederland
  N.V. and changed its name to ASR Nederland N.V. in October 2008. The company was
  founded in 1720 and is based in Utrecht, the Netherlands.'
