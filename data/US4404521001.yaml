longBusinessSummary: "Hormel Foods Corporation develops, processes, and distributes\
  \ various meat, nut, and other food products to foodservice, convenience stores,\
  \ and commercial customers in the United States and internationally. It operates\
  \ through three segments: Retail, Foodservice, and International. The company provides\
  \ perishable products, including fresh meats, frozen items, refrigerated meal solutions,\
  \ bacon, sausages, hams, guacamole, and other items that require refrigeration,\
  \ as well as shelf-stable products, such as canned luncheon meats, nut butters,\
  \ snack nuts, chili, shelf-stable microwaveable meals, hash, stews, tortillas, salsas,\
  \ tortilla chips, and other items that do not require refrigeration. It sells its\
  \ products under the HORMEL, ALWAYS TENDER, APPLEGATE, AUSTIN BLUES, BACON 1, BLACK\
  \ LABEL, BREAD READY, BURKE, CAFÉ H, CERATTI, CHI-CHI'S, COLUMBUS, COMPLEATS, CORN\
  \ NUTS, CURE 81, DAN'S PRIZE, DI LUSSO, DINTY MOORE, DON MIGUEL, DOÑA MARIA, EMBASA,\
  \ FAST \x91N EASY, FIRE BRAISED, FONTANINI, HERDEZ, HORMEL GATHERINGS, HOUSE OF\
  \ TSANG, JENNIE-O, JUSTIN'S, LA VICTORIA, LAYOUT, LLOYD'S, MARY KITCHEN, MR. PEANUT,\
  \ NATURAL CHOICE, NUT-RITION, OLD SMOKEHOUSE, OVEN READY, PILLOW PACK, PLANTERS,\
  \ ROSA GRANDE, SADLER'S SMOKEHOUSE, SKIPPY, SPAM, SQUARE TABLE, SPECIAL RECIPE,\
  \ VALLEY FRESH, and WHOLLY brands through sales personnel, independent brokers,\
  \ and distributors. The company was formerly known as Geo. A. Hormel & Company and\
  \ changed its name to Hormel Foods Corporation in January 1995. Hormel Foods Corporation\
  \ was founded in 1891 and is headquartered in Austin, Minnesota."
