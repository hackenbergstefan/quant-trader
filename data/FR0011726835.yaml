longBusinessSummary: Gaztransport & Technigaz SA, a technology and engineering company,
  provides cryogenic membrane containment systems for the maritime transportation
  and storage of liquefied gases in South Korea, China, and internationally. It operates
  through the Core Business and Hydrogen segments. The. company offers onshore membrane
  storage tank solutions for the storage of LNG (Liquefied Natural Gas); LNG floating
  storage solution; solutions for the transportation and storage of other liquefied
  gases such as ethane, ethylene, propane, butane, and propylene; solutions for the
  offshore LNG industry, including floating storage and regasification units (FSRUs),
  floating storage and unloading units (FLNGs), and floating storage units (FSUs);
  and consultancy services, engineering studies, operational support, and maintenance
  and repairs of GTT membrane systems. It also sells decision-making support tools
  for ship-owners and operators, including data analysis and vessel performance optimization;
  designs and assembles electrolysers to produce green hydrogen from renewable energy;
  and adapts containment technology for LNG-fuelled vessels. It serves ship-owners,
  gas companies, terminal operators, and shipyards. Gaztransport & Technigaz SA was
  founded in 1963 and is headquartered in Saint-Rémy-lès-Chevreuse, France.
