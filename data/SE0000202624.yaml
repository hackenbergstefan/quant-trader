longBusinessSummary: Getinge AB (publ) provides products and solutions for operating
  rooms, intensive-care units, and sterilization departments in Sweden and internationally.
  The company operates through Acute Care Therapies, Life Science, and Surgical Workflows
  segments. It offers extracorporeal membrane oxygenation, mechanical ventilation,
  advanced patient monitoring, ICU infrastructure equipment, and drainage solutions.
  In addition, the company provides surgical perfusion, endoscopic vessel harvesting,
  intra-aortic balloon counterpulsation, vascular and cardiothoracic surgery equipment,
  peripheral stenting, OEM solutions, and beating heart surgery equipment; and operating
  room equipment, anesthesia, advanced patient monitoring, and operating room integration
  solutions. Further, it offers pre-cleaning, cleaning and disinfection, sterilization,
  consumables, endoscope reprocessing, and sterile supply management solutions; connected
  medical devices, and patient flow management; and low temperature sterilization,
  biocontainment in vaccine production, terminal sterilization, sterile isolation
  technology, cleaning and sterilization, aseptic transfer, and large-scale cultivation.
  Additionally, the company provides bioreactor preparation solution, bioprocess development
  and optimization, labware cleaning and sterilization, biocontainment, and vivarium.
  It offers its products through a network of sales companies, as well as through
  agents and distributors in the Americas, Europe, the Middle East, Africa, and the
  Asia and Pacific. Getinge AB (publ) was founded in 1904 and is headquartered in
  Gothenburg, Sweden.
