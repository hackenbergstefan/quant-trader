longBusinessSummary: 'Intercontinental Exchange, Inc., together with its subsidiaries,
  provides technology and data to financial institutions, corporations, and government
  entities in the United States, the United Kingdom, the European Union, Canada, Asia
  Pacific, and the Middle East. It operates through three segments: Exchanges, Fixed
  Income and Data Services, and Mortgage Technology. The Exchanges segment operates
  regulated marketplace technology for the listing, trading, and clearing of an array
  of derivatives contracts and financial securities, such as commodities, interest
  rates, foreign exchange and equities, and corporate and exchange-traded funds, as
  well as data and connectivity services related to its exchanges and clearing houses.
  The Fixed Income and Data Services segment provides fixed income pricing, reference
  data, indices, analytics, and execution services, as well as global CDS clearing
  and multi-asset class data delivery technology. The Mortgage Technology segment
  offers a technology platform that provides customers comprehensive and digital workflow
  tools to address inefficiencies and mitigate risks that exist in the U.S. residential
  mortgage market life cycle from application through closing, servicing, and the
  secondary market. The company was founded in 2000 and is headquartered in Atlanta,
  Georgia.'
