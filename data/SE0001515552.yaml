longBusinessSummary: 'Indutrade AB (publ) manufactures, develops, and sells components,
  systems, and services to various industries worldwide. It operates through five
  segments: Industrial & Engineering, Infrastructure & Construction, Life Science,
  Process, Energy & Water, and Technology & Systems Solutions. The company offers
  industrial equipment, tools, filters, hydraulics, fasteners, and chemical technology
  for general engineering and automotive industries; and flow technology products,
  including valves, pipes and pipe systems, and pumps, as well as measurement technology
  and industrial equipment for energy sector, water and wastewater, and process industries.
  It also provides measurement technology, sensors, control and regulating technology,
  as well as monitoring equipment to various industries; and materials, products,
  tools, and equipment for infrastructure and construction sectors. In addition, the
  company offers components; medical technology products, including products for diagnostics;
  and production equipment and system solutions to pharmaceutical, health care, and
  food sectors. Indutrade AB (publ) was incorporated in 1919 and is based in Kista,
  Sweden.'
