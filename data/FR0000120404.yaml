longBusinessSummary: Accor SA operates a chain of hotels worldwide. The company operates
  through Premium, Midscale and Economy; and Luxury & Lifestyle segments. Its Premium,
  Midscale and Economy segment includes the Ibis, Novotel, Mercure, Swissôtel, Mövenpick,
  and Pullman brands operating in Europe and North Africa, the Middle East, Africa,
  the Asia-Pacific, the Americas, and China. The company Luxury & Lifestyle segment
  includes the Raffles and Fairmont, Sofitel, MGallery and Emblems, and Ennismore
  brands. It also owns, leases, manages, and franchises hotels. In addition, the company
  provides discount card programs; catering and event management; digital, hotel booking,
  and concierge services; and other services in events, fine dining, and entertainment,
  as well as operation of performance venues and coworking spaces. Further, it offers
  hotel management, personnel, procurement, treasury and management, IT, advertising,
  and other advice services. Accor SA was incorporated in 1960 and is headquartered
  in Issy-les-Moulineaux, France.
