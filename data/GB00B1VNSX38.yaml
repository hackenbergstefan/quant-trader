longBusinessSummary: 'Drax Group plc, together with its subsidiaries, engages in renewable
  power generation in the United Kingdom. The company operates through four segments:
  Pellet Production, Biomass Generation, Flexible Generation, and Energy Solutions.
  The company provides renewable, dispatchable power, and system support services.
  It is involved in production and sale of biomass pellets; generation and sale of
  electricity from biomass assets, pumped storage, run-of-river hydro, and OCGTs assets;
  and processing and sale of waste-derived pellets, as well as supply of electricity
  to non-domestic customers. The company owns and operates Drax Power Station located
  in Selby, North Yorkshire; Cruachan Power Station, a pumped storage hydro station,
  with an installed capacity of 440 megawatts (MW) located in Argyll and Bute; and
  Lanark and Galloway hydro-electric power stations with an installed capacity of
  126 MW located in south-west Scotland. In addition, it owns and operates Daldowie
  fuel plant that processes sludge, a plant that converts it into dry low-odour fuel
  pellets. Further, the company manufactures and sells compressed wood pellets; and
  supplies renewable electricity. Drax Group plc was incorporated in 2005 and is based
  in Selby, the United Kingdom.'
