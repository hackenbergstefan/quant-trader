longBusinessSummary: 'IDEX Corporation, together with its subsidiaries, provides applied
  solutions in the United States, North America, Europe, Asia, and internationally.
  It operates through three segments: Health & Science Technologies (HST), Fluid &
  Metering Technologies (FMT) and Fire & Safety/Diversified Products (FSDP). The HST
  segment designs, produces, and distributes a range of precision fluidics, positive
  displacement pumps, powder and liquid processing technologies, drying systems, micro-precision
  components, pneumatic components and sealing solutions, high performance molded
  and extruded sealing components, and custom mechanical and shaft seals. This segment
  also offers engineered hygienic mixers and valves, biocompatible medical devices
  and implantable products, air compressors and blowers, optical components and coatings,
  ultra-precision diamond tools, and laboratory and commercial equipment, as well
  as precision photonic solutions, technical ceramics, hermetic sealing products,
  porous material structures, and flow control solutions. The FMT segment designs,
  produces, and distributes positive displacement pumps, valves, small volume provers,
  flow meters, injectors, other fluid-handling pump modules, and systems; and provides
  flow monitoring and other services. The FSDP segment designs, produces, and distributes
  firefighting pumps, valves and controls, and rescue tools; lifting bags and other
  components and systems; engineered stainless steel banding and clamping devices;
  and precision equipment for dispensing, metering, and mixing colorants and paints.
  The company was incorporated in 1987 and is headquartered in Northbrook, Illinois.'
