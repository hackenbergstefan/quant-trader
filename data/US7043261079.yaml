longBusinessSummary: Paychex, Inc., together with its subsidiaries, provides human
  capital management solutions (HCM) for human resources, payroll processing, employee
  benefits, and insurance services for small to medium-sized businesses in the United
  States, Europe, Canada, India, and Israel. It offers technology and advisory solutions;
  and payroll tax administration services. The company also provides retirement solutions,
  such as plan implementation, ongoing compliance with government regulations, employee
  and employer reporting, participant and employer online access, electronic funds
  transfer, and other administrative services; HCM solutions from recruiting and hiring
  to retirement; and talent management and talent acquisition services. In addition,
  it offers payroll solutions, including calculation, preparation, and delivery of
  employee payroll checks; production of internal accounting records and management
  reports; preparation of federal, state, and local payroll tax returns; and collection
  and remittance of clients' payroll obligations. Further, the company provides workforce
  management solutions; benefits administration solutions; digital marketplace for
  earned wages, financial wellness solutions, and voluntary lifestyle benefits; administrative
  services organization HR outsourcing solutions; solutions to payroll and non-payroll
  customers; retirement and funding solutions; and insurance services for property
  and casualty coverage, such as workers' compensation, business-owner policies, cyber
  security protection, and commercial auto, as well as health and benefits coverage,
  including health, dental, vision, and life. Additionally, it offers payroll, HR,
  employee benefits administration, retirement, insurance, risk management outsourcing,
  and access to professionally trained HR representatives, virtually and on-site.
  It markets and sells its solutions primarily through its direct sales force. Paychex,
  Inc. was founded in 1971 and is headquartered in Rochester, New York.
