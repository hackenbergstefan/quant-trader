longBusinessSummary: Nestlé S.A., together with its subsidiaries, manufactures and
  distributes food and beverage, and nutritional science products in the United States,
  Brazil, Mexico, Greater China, the Philippines, India, the United Kingdom, France,
  Germany, Switzerland, and internationally. The company offers cereals, chocolate
  and confectionery, coffee, culinary, chilled and frozen food, dairy, drinks, food
  service, ice cream, nutrition and health, petcare, water, plant-based portfolio,
  and recipe products. It sells its products under the Nesquik Cereal, Fitness, Cheerios,
  Lion Cereals, Cini Minis, KitKat Cereal, Chocapic, Koko Krunch, Shreddies, Shredded
  Wheat Original, Corn Flakes, Trix Cereal, Aero, Baci Perugina, KitKat, Milkybar,
  Smarties, Cailler, Quality Street, Garoto, Nestlé Toll House, Munch, Damak, Hsu
  Fu Chi, Sahne Nuss, Nestlé Sustainably Sourced Cocoa, Blue Bottle Coffee, Nescafé,
  Nescafé Dolce Gusto, Nespresso, Starbucks Coffee At Home, DiGiorno, Garden Gourmet,
  Maggi, Thomy, Stouffer's, Hot Pockets, Lean Cuisine, Life Cuisine, Buitoni, Nestlé
  carnation, Nestlé Coffee Mate, and Nestea brands. The company also offers its products
  under the Roastelier by Nescafé, Plant-based and so good!, Milo, Chef, Maggi Professional,
  La Lechera, Minor's, Antica Gelateria Del Corso, Drumstick, Extrême, Häagen-Dazs,
  Maxibon, Mövenpick, Nancare, Gerber, Cerelac, Nestum, Alfaré HMO, Athéra HMO, Alfamino
  HMO, Bear Brand, Nido, Orgain, Nestlé Vital, Garden of Life, Pure Encapsulations,
  Solgar, Compleat, Impact, Peptamen, Vitaflo, Resource, Cat Chow, Dentalife, Dog
  Chow, Fancy Feast, Felix, Friskies, Gourmet, Purina, Purina ONE, Purina Pro Plan,
  Purina Pro Plan Veterinary Diets, Acqua Panna, Nestlé Pure Life, Perrier, S.Pellegrino,
  Sanpellegrino, Buxton, Erikli, Levissima, Vittel, Contrex, HENNIEZ, Hépar, La Vie,
  Naleczowianka, and Essentia brands. The company was founded in 1866 and is headquartered
  in Vevey, Switzerland. Aimmune Therapeutics, Inc. operates as a subsidiary of Nestlé
  S.A.
