longBusinessSummary: 'SFS Group AG supplies precision components and assemblies, mechanical
  fastening systems, tools, and procurement solutions in Switzerland and internationally.
  It operates in three segments: Engineered Components, Fastening Systems, and Distribution
  & Logistics. The company offers airbag restraint systems; automation; brake systems;
  building technology; clip nuts; communication technology; components, assemblies,
  and complete devices; connections and reinforcements for timber construction; and
  domestic and kitchen appliances. It also provides fasteners for flat roof and industrial
  lightweight construction; fasters for inserts; fastening and hinge technology for
  doors, windows, and glass facades; fastening system for the facade; furniture fittings;
  hard disk drives; inserts; interior plastics; life-saving fall protection; lifestyle
  electronics; mobile devices; sensors; seats and doors; powertrain; powertrain technology;
  snap and click system; tools, forestry, and garden equipment; wire and hypo tubing;
  and window fittings. In addition, it offers products under the SFS, UNISTEEL, Tegra
  Medical, GESIPA, TFC, HECO, Hoffmann, GARANT, HOLEX, and other brand names. It serves
  aircraft, automotive, construction, electronics, medical, and other industries.
  SFS Group AG was founded in 1928 and is based in Heerbrugg, Switzerland.'
