longBusinessSummary: Epiroc AB (publ), together with its subsidiaries, develops and
  produces equipment for use in surface and underground applications in North America,
  South America, Europe, Africa, the Middle East, Asia, Australia, and India. It operates
  in two segments, Equipment & Service, and Tools & Attachments. The Equipment & Service
  segment offers equipment and solutions for rock drilling, rock excavation, rock
  reinforcement, loading and haulage, and ventilation systems; drilling equipment
  for exploration, and water and energy; and related spare parts and services for
  the mining and infrastructure industries. This segment also provides digital solutions,
  such as connectivity, collision avoidance systems, automation, and mine planning,
  as well as electrification. Its Tools & Attachments segment offers rock drilling
  tools, including tophammer, COPROD, down-the hole, rotary and raiseboring; drill
  string components comprising bits, rods, pipes, shanks, hammers, and other products;
  rock reinforcement tools, such as rock bolts, mesh, and accessories; and exploration
  drilling tools. This segment also provides hydraulic breakers, shears and pulverizers,
  concrete cutters and busters, quick couplers and thumbs, drum cutters, excavator
  grapples, excavator magnets, and crusher and screening buckets; ground engaging
  tools, including teeth, lip shrouds, and protective shrouds; and digital solutions
  for monitoring, optimization, loss detection and analytics. In addition, the company
  offers aftermarket services, such as replacement parts and kits, service agreements
  and audits, circular services, and custom-engineered solutions, as well as component
  remanufacturing, midlife upgrades, cost-per-meter contracts, and conversion kits.
  The company has a strategic collaboration with Sany Group Company Limited for the
  development of equipment and technology for mining applications. Epiroc AB (publ)
  was founded in 1873 and is headquartered in Nacka, Sweden.
