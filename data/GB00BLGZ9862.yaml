longBusinessSummary: Tesco PLC, together with its subsidiaries, operates as a grocery
  retailer in the United Kingdom, Republic of Ireland, the Czech Republic, Slovakia,
  and Hungary. The company offers grocery products through its stores, as well as
  online. It is also involved in the food and drink wholesaling activities. In addition,
  the company provides mobile virtual network operating services, as well as insurance
  products, such as for home, travel, pet, and car insurance products. Further, the
  company operates a network of convenience stores; and offers AI-enabled science,
  software, and trusted advice; and consultancy services. Tesco PLC was founded in
  1919 and is based in Welwyn Garden City, the United Kingdom.
