longBusinessSummary: HOCHTIEF Aktiengesellschaft engages in the construction business
  worldwide. It operates under Turner, CIMIC, Engineering and construction, and Abertis
  segment. The company provides solutions for large-scale building, civil engineering
  and industrial projects, including engineering, project management, supply chain,
  and procurement services to the execution of civil works and industrial and infrastructure
  maintenance services, as well as construction management services. It also engages
  in the engineering and construction businesses for public and private clients; infrastructure
  investment activities; and industrial, energy, natural resources, and civil infrastructure
  business. HOCHTIEF Aktiengesellschaft was founded in 1873 and is headquartered in
  Essen, Germany. HOCHTIEF Aktiengesellschaft is a subsidiary of ACS, Actividades
  de Construcción y Servicios, S.A.
