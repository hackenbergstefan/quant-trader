longBusinessSummary: Nordic Semiconductor ASA, a fabless semiconductor company, provides
  low power wireless connectivity solutions in Europe, the Americas, and the Asia
  Pacific. The company offers cellular IoT that comprises NB-IoT and LTE-M; non-terrestrial
  networks; Wi-Fi solutions; Bluetooth low energy System-on-Chip (SoC); Bluetooth
  direction finding solution; DECT NR+, a non-cellular radio standard; Thread, an
  IP-based wireless networking protocol solution; nRF52 and nRF51 wireless SoCs; and
  range extenders, as well as Bluetooth LE audio, Bluetooth mesh, and Zigbee products.
  It also provides Matter, a Connected Home over IP solution; Amazon sidewalk; multiprotocol
  SoCs; Bluetooth wireless technology; security solution; Edge AI; ANT solutions,
  including wireless multiprotocol SoCs supporting the ANT wireless protocol; and
  KNX IoT. In addition, the company offers power management integrated circuits (PMIC)
  comprising nPM1100 PMIC, nPM1300 PMIC, nPM2100, and nPM6001 PMIC; cloud services,
  such as location, security, and device management services; nRF Cloud solution;
  and application specific integrated circuits and related consulting services. Its
  products are used for consumer devices, including asset tracking, audio, education,
  HID, smart home and remotes, gaming, virtual reality and augmented reality products,
  and wearables; for industrial automation, such as automotive, beacons, building
  automation, professional lighting, transportation, retail, and smart agriculture
  and metering; and healthcare devices that include connected health and sports and
  fitness. Nordic Semiconductor ASA was founded in 1983 and is headquartered in Trondheim,
  Norway.
