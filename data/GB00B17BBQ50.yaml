longBusinessSummary: 'Investec Group provides various financial products and services
  in South Africa, the United Kingdom, and internationally. It operates through four
  segments: Wealth & Investment, Private Banking, Corporate and Investment Banking
  and Other, and Group Investments. The Wealth & Investment segment offers wealth
  management and investment services to high-net-worth individuals, families, charities,
  and trusts. The Private Banking segment provides lending solutions, transactional
  banking, savings, bespoke foreign exchange, property finance, leverage finance,
  travel, insurance, legacy services, investments, trading, and offshore banking.
  The Corporate and Investment Banking segment delivers lending, advisory, and risk
  management services to corporate clients, private companies, private equity, listed
  companies, state-owned enterprises, public sector bodies, institutions, and intermediaries,
  including central treasury, and liability management. The Group Investments segment
  manages assets separated from core banking activities, including franchise businesses
  and standalone asset values. The company offers insurance solutions comprising severe
  illness, disability, life, mortgage and income protection, and business overloads.
  It also offers business banking solutions, such as trade and debtor, asset and leverage,
  structured property, technology asset, supply chain, and medical practice financing
  services, as well as financing for corporate and private equity firms. In addition,
  the company provides the company provides advisory; treasury and risk management
  for foreign exchange, commodities, interest rates, liquidity management, and equity
  structuring; fixed-income instruments; execution and custody solutions for institutions,
  hedge funds, corporates, and intermediaries; securities lending; and clearing services.
  Investec Group was founded in 1974 and is based in Sandton, South Africa.'
