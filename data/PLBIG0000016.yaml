longBusinessSummary: Bank Millennium S.A. provides various banking products and services
  in Poland. It operates through Retail Customer; Corporate Customer; and Treasury,
  Assets and Liabilities Management, and Other segments. The company offers current,
  savings, foreign currency savings, individual investment retirement, private banking,
  business, and VAT accounts; and term and structured deposits. It also provides investment
  advisory; investment plan and funds; credit, debit, and prepaid cards; cash, promotional
  online, mortgage, home equity, renewable loans, as well as consolidation loan with
  fixed interest rate, EKO promotional mortgage, personal account overdraft limit,
  loans secured with assets accumulated in the bank, and loans for purchase of securities;
  current account overdraft and current account overdraft increase; and property,
  motor, travel, your assistant, loan under protection, mortgage loan, credit card,
  and payment cards insurance products. In addition, the company offers Millennium
  360 Prestige, Millennium Prestige World, and Prestige Personal Account; Millennium
  TFI Funds; domestic and foreign investment funds, such as polish and foreign investment
  funds, investors TFI, Goldman Sachs TFI, Esaliens TFI, and Franklin Templeton; brokerage
  services; and e-banking. Further, it provides loan with a de minimis guarantee,
  cash loan and overdraft facility in PLN, leasing; bank guarantee and document collection;
  additional services, including accounting, online store, payment gateway, payment
  terminal, and currency exchange services; and ongoing support, financing, and trade
  finance, as well as treasure products. Bank Millennium S.A. was formerly known as
  BIG Bank GDANSKI SA and changed its name to Bank Millennium S.A. in January 2003.
  The company was founded in 1989 and is headquartered in Warsaw, Poland. Bank Millennium
  S.A. is a subsidiary of Banco Comercial Português, S.A.
