longBusinessSummary: 'McKesson Corporation provides healthcare services in the United
  States and internationally. It operates through four segments: North American Pharmaceutical,
  Oncology & Multispecialty, Prescription Technology Solutions, and Medical-Surgical
  Solutions. The company distributes branded, generic, specialty, biosimilar and over-the-counter
  pharmaceutical drugs, and other healthcare-related products; delivers products to
  retail pharmacies, hospitals, long-term care centers, clinics, and institutions;
  and provides logistics and distribution services for manufacturers. It also provides
  consulting, outsourcing, technological, and other services, as well as sells financial,
  operational, and clinical solutions to pharmacies; gene therapy with InspiroGene,
  practice consulting, and vaccine distribution services; and technology solutions,
  as well as research, insights, technologies, and services to improve cancer and
  specialty care. In addition, the company helps in solving medication access, affordability,
  and adherence challenges for patients by working across healthcare to connect patients,
  pharmacies, providers, pharmacy benefit managers, health plans, and biopharma companies.
  Further, it offers technology services, which includes electronic prior authorization,
  prescription price transparency, benefit insight, dispensing support services, patient
  enrollment, third-party logistics, and wholesale distribution support; medical-surgical
  supplies, laboratory equipment, pharmaceutical distribution, logistics, and other
  services to healthcare providers, including physician offices, surgery centers,
  hospital reference labs, nursing homes, hospice and home health care agencies, government
  facilities, and online marketplaces and retailers. McKesson Corporation was founded
  in 1833 and is headquartered in Irving, Texas.'
