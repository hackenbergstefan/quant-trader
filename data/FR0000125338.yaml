longBusinessSummary: Capgemini SE, together with its subsidiaries, provides consulting,
  digital transformation, technology, and engineering services primarily in North
  America, France, the United Kingdom, Ireland, the rest of Europe, the Asia-Pacific,
  and Latin America. It offers strategy and transformation services in strategy, technology,
  engineering, data science, and creative design fields to support companies and organizations
  in creating new models and new products within the digital economy. The company
  provides applications and technology services to help clients to develop, modernize,
  extend, and secure IT and digital environment, as well as designs and develops technological
  solutions in data strategy and architecture, data engineering, information governance,
  data science and analytics, artificial intelligence, and data-driven innovation
  fields. In addition, it offers cloud infrastructure services for its clients to
  build an optimal, agile, and secure foundation for business transformations; and
  business process outsourcing and transactional services, as well as installation
  and maintenance services for its clients' IT infrastructures in data centers or
  in the cloud. The company serves various industries, including aerospace and defense,
  automotive, banking and capital markets, consumer products, energy and utilities,
  healthcare, high-tech, hospitality and travel, insurance, life sciences, manufacturing,
  media and entertainment, public sector, retail, and telecoms. The company has a
  strategic alliance with OpenAI for the development and deployment of enterprise
  AI solutions. The company was formerly known as Cap Gemini S.A. and changed its
  name to Capgemini SE in June 2017. It has a strategic partnership with Duality Technologies
  to help organizations operationalize secure AI and analytics across sensitive, regulated,
  and distributed data environments. The company was incorporated in 1967 and is headquartered
  in Paris, France.
