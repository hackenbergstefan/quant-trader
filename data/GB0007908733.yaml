longBusinessSummary: SSE plc engages in the generation, transmission, distribution,
  and supply of electricity. The company distributes electricity to approximately
  4 million homes and businesses in southern central England and the north of Scotland;
  and owns, develops, and operates the high voltage electricity transmission system
  in the north of Scotland and other areas. Its diversified portfolio includes onshore
  and offshore wind farms, hydro-electric power, and batteries, flexible thermal generation,
  and electricity transmission and distribution networks. In addition, the company
  provides energy products and services; and invests in, develops, builds, and operates
  electricity infrastructure and businesses. The company was formerly known as Scottish
  and Southern Energy plc and changed its name to SSE plc in September 2011. SSE plc
  was incorporated in 1989 and is based in Perth, the United Kingdom.
