longBusinessSummary: Banca Mediolanum S.p.A. engages in the provision of various banking
  products and services in Italy. It offers current accounts; deposits products; and
  mortgage and personal loans. The company also provides credit cards, debit cards,
  and prepaid cards; investment products, such as mutual funds, unit linked policies,
  investment strategies, trading services, asset management services, social security,
  and bond issues and certificates; and insurance policies, including health and personal,
  life, serious illness, and autonomy protection, as well as protection assistance,
  and home and family protection. In addition, it offers SelfyCare Pet for reimbursement
  of veterinary expenses; SelfyCare Travel for assistance and coverage for risks arising
  during trips; and SelfyCare LifeProject for a specific life project. Banca Mediolanum
  S.p.A. founded in 1982 and is headquartered in Basiglio, Italy.
