longBusinessSummary: Autodesk, Inc. engages in the provision of 3D design, engineering,
  and entertainment technology solutions worldwide. The company offers AutoCAD Civil
  3D, a surveying, design, analysis, and documentation solution; Autodesk Build, a
  toolset for managing, sharing, and accessing project documents for streamlined workflows
  between the office, trailer, and jobsite; Revit, a software built for building information
  modeling to help professionals design, build, and maintain energy-efficient buildings;
  Autodesk BIM Collaborate Pro, cloud-based design collaboration and design management
  software; BuildingConnected, a SaaS preconstruction solution; and Tandem, a cloud-based
  platform that transforms the built asset lifecycle. It also provides AutoCAD software,
  a customizable and extensible CAD application for professional design, drafting,
  detailing, and visualization; AutoCAD LT, a drafting and detailing software; Fusion,
  a 3D CAD, computer-aided manufacturing, and computer-aided engineering tool; Inventor,
  a software solution that offers a set of tools for 3D mechanical design, simulation,
  analysis, tooling, visualization, and documentation; product design and manufacturing
  collection tools; and Vault, a data management software for managing data in one
  central location, accelerate design processes, and streamline internal/external
  collaboration. The company offers Flow Production Tracking, a cloud-based production
  management software; Maya software that offers 3D modeling, animation, effects,
  rendering, and compositing solutions for film and video artists, game developers,
  and design visualization professionals; Media and Entertainment Collection that
  offers end-to-end creative tools for entertainment creation; and 3ds Max software,
  which provides 3D modeling, animation, and rendering solutions. It sells its products
  and services through a network of resellers and distributors. Autodesk, Inc. was
  incorporated in 1982 and is headquartered in San Francisco, California.
