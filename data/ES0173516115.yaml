longBusinessSummary: Repsol, S.A. operates as a multi-energy company in Spain, Peru,
  the United States, Portugal, and internationally. The Upstream segment engages in
  the exploration, development, and production of crude oil and natural gas reserves;
  and development of low-carbon geological solutions. Its Industrial segment is involved
  in oil refining; trading, transport, and wholesale of crude oil, natural gas, and
  fuels; and activities related to hydrogen, sustainable biofuels, and synthetic fuels.
  The Customer segment engages in the mobility/gas station business; and sale of electricity
  and gas, lubricants, and other products, as well as fuel products, such as gasoline,
  diesel, aviation kerosene, liquefied petroleum gas, and biofuels. Its Low-Carbon
  Generation segment is involved in electricity generation from hydroelectric, wind,
  and photovoltaic sources. The company also engages in financial services; sector
  studies; human resources and shared services; decarbonization; carbon dioxide capture
  and pyrolysis HUB pilot plants; development of production processes, storage, transport,
  use, consumption, and transformation of hydrogen; promotion, design, construction,
  and operation of molecular recycling facilities; and production of chemical and
  petrochemical products. In addition, it is involved in waste management; construction
  and operation of oil refinery; research; electricity distribution; maritime transport
  and inland waterways; LNG regasification; investment in liquefaction plant; safety;
  electric vehicle charging points; customer and oil product marketing management;
  payment management at gas stations; development of greenfield and new energy projects;
  and insurance and reinsurance activities. Further, the company offers various apps
  and tools, such as Waylet, Vivit, and WiBLE; and asphalt products. The company was
  formerly known as Repsol YPF, S.A. and changed its name to Repsol, S.A. in May 2012.
  Repsol, S.A. was founded in 1927 and is headquartered in Madrid, Spain.
