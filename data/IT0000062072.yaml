longBusinessSummary: Assicurazioni Generali S.p.A. provides various insurance solutions
  under the Generali brand in the Americas, Italy, rest of Europe, Africa, the Middle
  East, Asia, and the Oceania. The company operates through Life, Property & Casualty,
  and Asset & Wealth Management segments. It offers savings, individual and family
  protection, and unit linked products, as well as motor third-party liability, home,
  property and casualty, accident, health, and commercial and industrial risks insurance
  products; and insurance plans for multinational companies. It also provides equity
  and fixed-income funds, and alternative products. The company was formerly known
  as Assicurazioni Generali Austro-Italiche and changed its name to Assicurazioni
  Generali S.p.A. in 1848. Assicurazioni Generali S.p.A. was founded in 1831 and is
  headquartered in Trieste, Italy.
