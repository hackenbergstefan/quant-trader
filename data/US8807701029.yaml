longBusinessSummary: Teradyne, Inc. engages in the design, development, manufacture,
  and sale of automated test systems and robotics products in the United States, Asia
  Pacific, Europe, the Middle East, and Africa. The company operates through Semiconductor
  Test, Robotics, and Other segments. The Semiconductor Test segment offers products
  and services for wafer level and device package testing, and system level testing
  of semiconductor devices in automotive, industrial, communications, consumer, smartphones,
  cloud, computer and electronic game, and other applications. This segment also provides
  FLEX test platform systems; J750 test system to address the volume semiconductor
  devices, including microcontrollers; Magnum platform that tests memory devices,
  such as flash memory and DRAM; and ETS platform for semiconductor manufacturers,
  and assembly and test subcontractors in the analog/mixed signal markets. It serves
  integrated device manufacturers that integrate the fabrication of silicon wafers
  into their business; fabless companies that outsource the manufacturing of silicon
  wafers; foundries; and semiconductor assembly and test providers. The Robotics segment
  provides collaborative robotic arms and autonomous mobile robots for manufacturing,
  logistics, and industrial customers. It also provides product test instruments which
  includes operations related to the design, manufacturing and marketing of products
  and services for defense/aerospace test, circuit-board test, wireless test systems,
  and silicon photonics testing. The company has a strategic collaboration with Tokyo
  Electron Limited for the development of a test cell solution for device screening
  in AI and data center applications. Teradyne, Inc. was incorporated in 1960 and
  is headquartered in North Reading, Massachusetts.
