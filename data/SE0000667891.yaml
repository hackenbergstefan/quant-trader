longBusinessSummary: Sandvik AB (publ), an engineering company, provides products
  and solutions for mining and rock excavation, metal cutting, and materials technology
  worldwide. The company offers mining and rock excavation equipment, including drill
  rigs and bolters, underground loaders and trucks, mechanical cutting equipment,
  rock tools and rock drills, and mining automation; rock processing equipment, such
  as crushers, screens, hydraulic breakers, demolition tools, and breaker booms. It
  provides cutting tools and tooling systems, and digital solutions and software;
  metal powder for additive manufacturing, and products made from controlled expansion
  alloys; and tungsten powders, as well as recycling services of secondary tungsten
  raw materials. It serves aerospace, automotive, mining, general engineering, infrastructure,
  and other industries. Sandvik AB (publ) was founded in 1862 and is headquartered
  in Stockholm, Sweden.
