longBusinessSummary: AppLovin Corporation provides end-to-end artificial intelligence-powered
  advertising solutions for businesses in the United States and internationally. It
  operates through two segments, Advertising and Apps. The company offers Axon Ads
  Manager, a suite of marketing solutions that enables developers to automate, optimize,
  and manage marketing efforts; MAX, an in-app bidding technology that optimizes the
  value of a publisher's advertising inventory by running a real-time competitive
  auction; Adjust, a measurement and analytics marketing platform; and Wurl, a connected
  TV platform, which distributes streaming video for content companies, provides advertising
  and publishing solutions. It serves individuals, small and independent businesses,
  enterprises, advertisers and advertising networks, mobile app publishers, and indie
  studio developers. The company was incorporated in 2011 and is headquartered in
  Palo Alto, California.
