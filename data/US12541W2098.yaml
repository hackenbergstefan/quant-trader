longBusinessSummary: C.H. Robinson Worldwide, Inc., together with its subsidiaries,
  provides freight transportation and related logistics and supply chain services
  in the United States and internationally. It operates in two segments, North American
  Surface Transportation and Global Forwarding. The company offers transportation
  and logistics services, such as truckload; less than truckload transportation brokerage
  services, which include the shipment of single or multiple pallets of freight; intermodal
  transportation that comprises the shipment service of freight in containers or trailers
  by a combination of truck and rail; and non-vessel operating common carrier and
  freight forwarding services, as well as organizes indirect air carrier and freight
  forwarder providing door-to-door services. It also provides customs brokerage services;
  and other logistics services, such as fee-based managed, warehousing, supply chain
  consulting and optimization services, and other services. In addition, the company
  is involved in the buying, selling, and/or marketing of fresh fruits, vegetables,
  and other value-added perishable items under the Robinson Fresh trade name. Further,
  the company offers transportation management and other surface transportation services.
  It provides fresh produce to grocery retailers, restaurants, produce wholesalers.
  C.H. Robinson Worldwide, Inc. was founded in 1905 and is headquartered in Eden Prairie,
  Minnesota.
