longBusinessSummary: Universal Music Group N.V. operates as a music company worldwide.
  The company operates through Recorded Music, Music Publishing, and Merchandising
  & Other segments. Its Recorded Music segment discovers and develops recording artists,
  as well as licenses, markets, promotes, distributes, and sells their music across
  various formats and platforms; and engages in the live events, sponsorship, film,
  and television operations. The Music Publishing segment discovers and develops songwriters,
  as well as owns and administers the copyright for musical compositions used in recordings,
  public performances, and related uses, such as films and advertisements. Its Merchandising
  & Other segment produces and sells artist and other branded products through various
  sales channels, including fashion retail, concert touring, and online, as well as
  offers brand rights management services. Universal Music Group N.V. was incorporated
  in 2020 and is headquartered in Hilversum, the Netherlands.
