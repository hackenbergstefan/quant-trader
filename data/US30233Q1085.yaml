longBusinessSummary: ExxonMobil Holdings Corporation engages in the exploration and
  production of crude oil and natural gas in the United States, Canada, and internationally.
  The company operates through Upstream, Energy Products, Chemical Products, and Specialty
  Products segments. Its Upstream segment explores for and produces crude oil and
  natural gas. The Energy Products segment offers fuels, aromatics, and catalysts,
  as well as licensing services. Its Chemical Products segment manufactures and sells
  olefins, polyolefins, and intermediates. The Specialty Products segment offers finished
  lubricants, basestocks, waxes, synthetics, elastomers, and resins. It is also involved
  in the manufacture, trade, transport, and sale of crude oil, natural gas, petroleum
  products, petrochemicals, and other specialty products; and pursuit of lower-emission
  and business opportunities, including carbon capture and storage, hydrogen, lower-emission
  fuels, Proxxima resin systems, carbon materials, low-carbon data center, and lithium.
  In addition, the company offers aviation fuel. It sells its products under the Exxon,
  Esso, and Mobil brands. The company was formerly known as Exxon Mobil Corporation
  and changed its name to ExxonMobil Holdings Corporation in July 2026. ExxonMobil
  Holdings Corporation was founded in 1870 and is headquartered in Spring, Texas.
