longBusinessSummary: The Cooper Companies, Inc., together with its subsidiaries, develops,
  manufactures, and markets contact lens wearers. The company operates in two segments,
  CooperVision and CooperSurgical. The CooperVision segment offers spherical, toric,
  and multifocal contact lenses that address vision challenges, such as astigmatism,
  presbyopia, and myopia. Its CooperSurgical segment focuses on family and women's
  health care, which provides fertility products and services, medical devices, and
  contraception, as well as cryostorage, such as cord blood and cord tissue storage.
  This segment offers Paragard, a hormone-free intrauterine device; and fertility
  consumables and equipment, donor gamete services, and genomic services, including
  genetic testing. The company sells its products to distributors, group purchasing
  organizations, eye care and health care professionals, including independent practices,
  corporate retailers, hospitals and clinics, and authorized resellers. The Cooper
  Companies, Inc. was founded in 1958 and is headquartered in San Ramon, California.
