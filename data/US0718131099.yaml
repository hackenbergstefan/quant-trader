longBusinessSummary: 'Baxter International Inc., through its subsidiaries, provides
  a portfolio of healthcare products in the United States. The company operates through
  three segments: Medical Products & Therapies, Healthcare Systems & Technologies,
  and Pharmaceuticals. It offers sterile intravenous (IV) solutions; infusion systems
  and devices; parenteral nutrition therapies; inhaled anesthetics; generic injectable
  pharmaceuticals; surgical hemostat and sealant products; advanced surgical equipment;
  smart bed systems; patient monitoring and diagnostic technologies; and respiratory
  health devices, as well as advanced equipment for the surgical space comprising
  operating room integration technologies, precision positioning devices, and other
  accessories. The company also provides specialty injectable pharmaceuticals, inhaled
  anesthetics, and drug compounding services. Its products are used in hospitals,
  nursing homes, rehabilitation centers, ambulatory surgery centers, doctors'' offices,
  kidney dialysis centers, and patients at home under physician supervision. The company
  sells its products through direct sales force, independent distributors, drug wholesalers,
  and specialty pharmacy or other alternate site providers. It operates in Eastern
  Europe, the Middle East, Africa, Latin America, Asia, Western Europe, Canada, Japan,
  Australia, and New Zealand. Baxter International Inc. was incorporated in 1931 and
  is headquartered in Deerfield, Illinois.'
