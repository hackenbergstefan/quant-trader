longBusinessSummary: Cembra Money Bank AG provides consumer finance products and services
  in Switzerland. The company offers savings and deposit products; cash and personal
  loans, and auto loans and leasing products; credit card and invoice financing receivables;
  leasing services for new and used vehicles, including cars, light commercial vehicles,
  motorcycles, and caravans, as well as corporate leasing services; and investment
  securities comprising debt securities. It also provides financial protection products
  for involuntary unemployment, accident, illness, or disability; travel, cyber, and
  card protection insurance products; car insurance products; investment products;
  and credit cards, mobile payment, and online banking services. The company serves
  private and self-employed individuals, and small enterprises. It operates through
  a network of branches and online distribution channels; and credit card partners,
  independent intermediaries, and car dealers. The company was formerly known as GE
  Money Bank Aktiengesellschaft and changed its name to Cembra Money Bank AG in October
  2013. Cembra Money Bank AG was founded in 1912 and is headquartered in Zurich, Switzerland.
