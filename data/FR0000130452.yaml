longBusinessSummary: 'Eiffage SA, together with its subsidiaries, engages in the construction
  and concessions businesses in France, Germany, Europe, and internationally. It operates
  through five segments: Construction, Infrastructure, Energy Systems, Concessions,
  and Holding. The company constructs and renovates housing, offices, retail, hospitality,
  and public facilities; develops properties; and offers urban planning and regeneration.
  It also engages in the construction and maintenance of roads, motorways, ports,
  and airports, as well as industrial and commercial projects; civil engineering of
  transport infrastructure, water and waste treatment plants, energy production and
  transmission equipment, and hydraulic structures; and turnkey metal construction.
  In addition, the company designs, builds, implements, integrates, operates, and
  maintains systems and equipment related to electrical, industrial, climate control,
  and energy engineering. Further, it is involved in the construction and management
  of works under concession contracts and public-private partnerships; development
  and production of hydroelectric and photovoltaic energy; and management of equity
  investments and services. The company was founded in 1844 and is headquartered in
  Vélizy-Villacoublay, France.'
