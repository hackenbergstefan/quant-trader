longBusinessSummary: Berkshire Hathaway Inc., together with its subsidiaries, engages
  in the insurance, freight rail transportation, and utility businesses. The company
  provides property, casualty, life, accident, and health insurance and reinsurance;
  operates railroad systems in North America; generates, transmits, stores, and distributes
  electricity from natural gas, coal, wind, solar, hydroelectric, nuclear, and geothermal
  sources; operates natural gas distribution and storage facilities, interstate pipelines,
  liquefied natural gas facilities, and compressor and meter stations; and holds interest
  in coal mining assets. It manufactures boxed chocolates and other confectionery
  products; specialty chemicals, metal cutting tools, and components for aerospace
  and power generation applications; prefabricated and site-built residential homes,
  flooring products; insulation, roofing, and engineered products; building and engineered
  components; paints and coatings; and bricks and masonry products, as well as offers
  manufactured and site-built home construction, and related lending and financial
  services. In addition, the company provides recreational vehicles, apparel, footwear,
  toys, jewelry, custom picture framing products, alkaline batteries, logistics services,
  and professional aviation training and shared aircraft ownership programs; castings,
  forgings, fasteners/fastener systems, aerostructures, and precision components;
  and cobalt, nickel, and titanium alloys. Further, it distributes televisions and
  information, and grocery and non-food consumer products; franchises and services
  quick service restaurants; and distributes electronic components. Additionally,
  it retails automobiles; furniture, bedding, and accessories; household appliances,
  electronics, and floor coverings; watches, home decor and repair services; sells
  kitchenware; and motorcycle clothing and equipment. The company was incorporated
  in 1998 and is headquartered in Omaha, Nebraska.
