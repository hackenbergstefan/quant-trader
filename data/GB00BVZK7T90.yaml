longBusinessSummary: 'Unilever PLC operates as a fast-moving consumer goods company
  in the Asia Pacific, Africa, the Americas, and Europe. It operates through four
  segments: Beauty & Wellbeing, Personal Care, Home Care, and Foods. The Beauty &
  Wellbeing segment offers hair care, such as shampoo, conditioner, and styling; face,
  hand, and body moisturizer skin care products; and Prestige Beauty and Wellbeing
  products. The Personal Care segment provides soap and shower skin cleansing products;
  and deodorant and oral care, including toothpaste, toothbrush, and mouthwash products.
  The Home Care segment offers washing powders and liquids, and rinse conditioner
  fabric care products; and a range of home and hygiene cleaning products. The Foods
  segment provides cooking aids and mini meals comprising soups, bouillons, and seasonings,
  as well as mayonnaise and ketchup condiments; and Unilever food solutions. The company
  provides its products under the AXE, Clear, Cif, Closeup, Comfort, Dermalogica,
  Domestos, Dove, Dove Men+Care, Hellmann''s, Horlicks, Knorr, LUX, Lifebuoy, Liquid
  I.V., Nexxus, Nutrafol, OMO, Pond''s, Paula''s Choice, Pepsodent, Radiant, Rexona,
  Sunlight, Sunsilk, Surf, TRESemmé, and Vaseline brand names. Unilever PLC was founded
  in 1860 and is headquartered in London, the United Kingdom.'
