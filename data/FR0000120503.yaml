longBusinessSummary: Bouygues SA, together with its subsidiaries, operates in the
  construction, energies and services, telecom, and media sectors in France and internationally.
  It operates through Colas, Bouygues Construction, Bouygues Immobilier, Equans, Bouygues
  Telecom, TF1, and Other segments. The company engages in the construction and maintenance
  of roads; production, distribution, sale, and recycling of aggregates, emulsions,
  asphalt mixes, ready-mix concrete, and bitumen; design, construction, upgrade, and
  maintenance of rail networks; design, construction, refurbishment, and renovation
  of buildings, as well as property development and consulting; public works, which
  include civil engineering, bridges, nuclear power station, tunnels and underground
  structures, prestressing, and stay cable systems; and concession activities. It
  is also involved in property development of housing, offices, and hotels; urban
  operations; design, building, management, and decarbonization of electrical installations;
  mechanical and robotics; HVAC; cooling and fire protection; facility management
  solutions, including technical services for installations; and digital technology
  and ICT services. In addition, the company engages in the roll out, maintenance,
  and management of mobile and fixed networks; B2C and B2B services; production, editing,
  and broadcasting of televisual content; music production and live events; and creation
  and distribution of programmes for TV channels and digital platforms. Further, it
  operates unencrypted television channels comprising TF1, TMC, TFX, TF1 Séries Films,
  and LCI; theme television channels consisting of Ushuaia TV, Histoire TV, TV Breizh,
  and Série Club; TF1+, a free streaming platform for family entertainment and news;
  TFOU MAX, an on-demand platform; and TF1 PUB, an advertising sales unit. The company
  exports its products. Bouygues SA was founded in 1952 and is headquartered in Paris,
  France.
