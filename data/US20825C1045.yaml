  Australia; global LNG developments; oil sands assets in Canada; and an inventory
  of global exploration prospects. It serves in the United States, Canada, China,
  Equatorial Guinea, Libya, Malaysia, Norway, Singapore, the United Kingdom, and internationally.
  ConocoPhillips was founded in 1917 and is headquartered in Houston, Texas.'
