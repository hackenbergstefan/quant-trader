longBusinessSummary: Western Digital Corporation engages in the development, manufacture,
  and sale of data storage devices and solutions based on hard disk drive (HDD) technology
  in the United States, Asia, Europe, the Middle East, and Africa. The company offers
  internal HDDs, data center drives, data center platforms, external drives, portable
  drives, NAS for home and office, and accessories. It sells its data storage devices
  and solutions through its computer sales personnel, dealers, distributors, retailers,
  and subsidiaries. The company has a collaboration with Open Quantum Design for the
  development of quantum error correction technology and related systems to advance
  reliable quantum computing. Western Digital Corporation was founded in 1970 and
  is headquartered in San Jose, California.
