longBusinessSummary: Prudential Financial, Inc., together with its subsidiaries, provides
  financial products and services in the United States, Japan and internationally.
  It operates through PGIM, Retirement Strategies, Group Insurance, Individual Life,
  and International Businesses segments. The PGIM segment offers investment management
  services and solutions related to public fixed income, public equity, real estate
  debt and equity, private credit and other alternatives, and multi-asset class strategies
  to institutional and retail clients, as well as its insurance and retirement businesses.
  The Retirement Strategies segment provides a range of retirement investment, and
  income products and services to retirement plan sponsors in the public, private,
  and not-for-profit sectors; group annuities and other products; international reinsurance;
  investment only products; and FlexGuard suite, Fixed annuities, and variable annuities,
  as well as develops and distributes individual variable and fixed annuity products.
  The Group Insurance segment offers various group life, and long-term and short-term
  group disability, as well as group corporate-, bank-, and trust-owned life insurance;
  and supplemental health solutions including accident, critical illness, and hospital
  indemnity. The Individual Life segment develops and distributes variable life, universal
  life, and term life insurance products. The International Businesses segment develops
  and distributes life insurance, retirement products, investment products, and certain
  accident and health products. The company provides its products and services to
  individual and institutional customers through its proprietary and third-party distribution
  networks, financial professionals, and trusted partnerships. Prudential Financial,
  Inc. was founded in 1875 and is headquartered in Newark, New Jersey.
