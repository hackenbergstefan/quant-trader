longBusinessSummary: 'Globe Life Inc., through its subsidiaries, provides various
  life and supplemental health insurance products to lower middle- and middle-income
  families in the United States. It operates in three segments: Life Insurance, Supplemental
  Health Insurance, and Investments. The company offers whole, term, and other life
  insurance products, as well as life insurance for children; Medicare supplement
  and limited-benefit supplemental health insurance products, such as accident, cancer,
  critical illness, heart, intensive care, and other health products; and final expense,
  accidental death, mortgage protection, and hospital insurance products. It sells
  its products through direct-to-consumer channels, exclusive independent agents,
  general agency independent agents, and brokers. The company was formerly known as
  Torchmark Corporation and changed its name to Globe Life Inc. in August 2019. Globe
  Life Inc. was founded in 1900 and is headquartered in McKinney, Texas.'
