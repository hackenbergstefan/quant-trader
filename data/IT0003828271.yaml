longBusinessSummary: Recordati Industria Chimica e Farmaceutica S.p.A., together with
  its subsidiaries, researches, develops, produces, and sells pharmaceuticals in Italy,
  the United States, Spain, France, Germany, Russia, Ukraine, Turkey, Portugal, North
  Africa, and internationally. It operates through Specialty and Primary Care; and
  Rare Diseases segments. The company develops Maapliv for maple syrup urine disease;
  Isturia for endogenous Cushing's syndrome; Cystadrops treatment of the ocular manifestations
  of cystinosis; Carbaglu for hyperammonemia due to n-acetyl glutamate synthase deficiency;
  Qarziba for neuroblastoma patients and patients with relapsed or refractory neuroblastoma;
  and Fotivda for renal cell carcinoma. It also develops Sylvant for idiopathic multicentric
  castleman diseases; Caphosol for oral mucositis; ENJAYMO for hemolysis in adults
  with cold agglutinin disease; Zanidip, Zanipress, Vazkepa, and Logimax for hypertension;
  Urorec and Avodart for symptoms of benign prostatic hyperplasia; and Livazo for
  dyslipidemia; Combodart/Duodart; Seloken for angina pectoris, myocardial infarction
  and cardiac rhythm disorders, as well as hypertension and functional heart disorders.
  In addition, the company offers Procto-Glyveno for internal and external hemorrhoids;
  Polydexa, Isofra, and Otofa for ear, nose and throat infections; Isturisa, for Cushing's
  syndrome; Normosang, human hemin; Juxtapid, homozygous familial hypercholesterolemia;Ledaga,
  mycosis fungoides, T-cell cutaneous lymphoma;Tergynan, an anti-infective for gynecological
  infections; CitraFleet and Phosphosoda as bowel cleansers; Lomexin for gynecological
  and dermatological infections; Hexaspray, treatments for the oral cavity; Magnesio
  Supremo, a dietary supplement; Reaglia for schizophrenia; Eligard for hormone-dependent
  prostate cancer; and pasireotide in Phase II trial for patients with post-bariatric
  hypoglycemia, as well as other products. The company was founded in 1926 and is
  headquartered in Milan, Italy.
