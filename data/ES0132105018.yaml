longBusinessSummary: Acerinox, S.A., together with its subsidiaries, manufactures
  and distributes stainless steel and high-performance alloys in Spain, the United
  States, Africa, Asia, rest of Europe, and internationally. It operates through Stainless
  Steel and High-Performance Alloys segments. The company offers flat products, including
  slab, billet, black coil, plate, engraved coil/sheet, cold rolled coil and sheet,
  hot rolled coil and sheet, and circles; and stainless steel grades comprising austenitic,
  ferritic, duplex, and martensitic, as well as wire stainless steels for welding.
  It also provides long stainless steel products, such as wire, colour coated wire,
  reinforcement wire, wire rod, hexagonal wire rod, bar, hot rolled and cold rolled
  reinforcement bar, peeled bar, black bar, profiles, hot rolled reinforcement coil,
  and angles. In addition, the company offers high performance alloys, including nickel
  and nickel alloys, cobalt alloys, zirconium, special stainless steels, aluminum
  and copper, powder for 3D printing, and welding consumables. Its products are used
  for transport, industrial equipment and engineering, construction and infrastructure,
  food industry, household appliances and kitchenware, and energy and environmental
  technology applications. Acerinox, S.A. was incorporated in 1970 and is headquartered
  in Madrid, Spain.
