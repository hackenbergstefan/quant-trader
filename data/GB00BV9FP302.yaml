longBusinessSummary: Computacenter plc provides technology and services to corporate
  and public sector organizations in the United Kingdom, Germany, Western Europe,
  North America, and internationally. It offers procurement, specialist, software,
  logistical, technical, and circular technology sourcing services; IT strategy and
  advisory, integration, deployment, and support services; and managed services. The
  company also provides workplace solutions, including IT support, field and onsite
  support services, Productivity and Teamwork technology sourcing, modern endpoint,
  device lifecycle management, IT asset management, print solutions, and technology
  sourcing; cloud and applications solution, such as custom application, business
  automation, application platforms, data and AI platforms, and cloud services; infrastructure
  services, data center and edge platforms, relocation and migration, and operational
  resilience services; and software-defined (SD) wide area network service, proactive
  and reactive services, network automation, managed secure networking and implementation,
  SD campus networking, multi cloud connectivity, and data center networking and multi
  cloud network deployment. In addition, it offers security solutions, including service
  centers, integration centers, professional services hubs, and field and maintenance
  services. The company was founded in 1981 and is headquartered in Hatfield, the
  United Kingdom.
