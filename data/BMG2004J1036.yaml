  P&O Cruises (UK), Princess Cruises, and Seabourn brands. It sells its cruises through
  travel agents, tour operators, vacation planners, websites, and onboard future cruise
  consultants. Carnival Corporation Ltd. was founded in 1972 and is headquartered
  in Miami, Florida.'
