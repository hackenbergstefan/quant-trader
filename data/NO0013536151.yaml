longBusinessSummary: Kongsberg Gruppen ASA, together with its subsidiaries, provides
  high-tech systems and solutions primarily to customers in the defense markets. It
  operates through Kongsberg Defence & Aerospace, Kongsberg Discovery, and Other segments.
  The Kongsberg Defence & Aerospace segment provides various systems and services
  to the defence industry. It provides air defence and combat systems, sonars, and
  navigation for marine vessels and submarines, as well as integrated command and
  control systems; remote control weapon stations for land-based vehicles and marine
  vessels; remote tower solutions for airports; products for military tactical communication;
  naval strike and air-to-surface missiles; and components and services to the space
  industry, as well as port monitoring systems. This segment also offers lightweight
  composite and titanium components for F-35 combat aircraft, as well as maintenance
  and lifecycle services for military and civil capabilities. The Kongsberg Discovery
  segment offers subsea positioning and communication technologies; sustainable management
  technologies; and technologies that provide its customers with information about
  position, speed, acceleration, and heading, as well as uncrewed platforms that deliver
  autonomous underwater and surface vessels for research, defence, and commercial
  use. The Other segment focuses on digitalization within the oil and gas, and renewable
  energy markets. It operates primarily in Norway, Europe, North America, South America,
  Asia, Australia, and Africa. The company's distribution channels, including direct
  sales, partnerships and alliances, online platforms, marketing advanced technology.
  Kongsberg Gruppen ASA was founded in 1814 and is headquartered in Kongsberg, Norway.
