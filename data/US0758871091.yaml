longBusinessSummary: Becton, Dickinson and Company develops, manufactures, and sells
  medical supplies, devices, laboratory equipment, and diagnostic products for healthcare
  institutions, physicians, life science researchers, clinical laboratories, pharmaceutical
  industry, and the general public worldwide. It operates through Medical Essentials,
  Connected Care, BioPharma Systems, Interventional and Life Sciences segments. It
  provides peripheral intravenous (IV) and advanced peripheral catheters, central
  lines, acute dialysis catheters, vascular access technology, vascular care and preparation
  products, needle-free IV connectors and extensions sets, closed-system drug transfer
  devices, hazardous drug detections, hypodermic syringes and needles, anesthesia
  needles and trays, enteral syringes, and sharps disposal systems; IV medication
  safety and infusion therapy delivery systems, medication compounding workflow system,
  automated medication dispensing and supply management systems, informatics and analytics
  and pharmacy automation system, and medication inventory optimization and tracking
  system; hemodynamic monitoring system; and prefillable drug delivery systems. It
  also offers specimen and blood collection products; automated blood and tuberculosis
  culturing, molecular testing, and microorganism identification and drug susceptibility,
  as well as rapid diagnostic assays, microbiology laboratory automation products,
  and plated media products; and fluorescence-activated cell sorters and analyzers,
  antibodies and kits, reagent system, and solution for single-cell gene expression
  analysis, as well as clinical oncology, immunological, and transplantation diagnostic/monitoring
  reagents and analyzers. It provides hernia and soft tissue repair, biological and
  bioresorbable graft, biosurgery, and other surgical products; surgical infection
  prevention, peripheral intervention, and urology and critical care products. The
  company was founded in 1897 and is headquartered in Franklin Lakes, New Jersey.
