longBusinessSummary: 'The Travelers Companies, Inc., through its subsidiaries, provides
  a range of commercial and personal property, and casualty insurance products and
  services to businesses, government units, associations, and individuals in the United
  States, Canada, and internationally. It operates through three segments: Business
  Insurance, Bond & Specialty Insurance, and Personal Insurance. The Business Insurance
  segment offers workers'' compensation, commercial automobile and property, general
  liability, commercial multi-peril, employers'' liability, public and product liability,
  professional indemnity, marine, aviation, commercial property and automobile, onshore
  and offshore energy, construction, terrorism, personal accident, and kidnap and
  ransom insurance products. This segment operates through select accounts, which
  serve small businesses; middle accounts that serve mid-sized businesses; national
  accounts, which serve large companies; and national property and others that serve
  large and mid-sized customers, commercial trucking industry, and agricultural businesses,
  as well as markets and distributes its products through brokers, wholesale agents,
  and program managers. The Bond & Specialty Insurance segment provides surety, fidelity,
  management and professional liability, and other property and casualty coverages
  and related risk management services through independent agencies and brokers. The
  Personal Insurance segment offers property and casualty insurance covering personal
  risks, primarily automobile and homeowners'' insurance to individuals. The Travelers
  Companies, Inc. was founded in 1853 and is based in New York, New York.'
