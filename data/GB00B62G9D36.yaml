longBusinessSummary: Shaftesbury Capital PLC (Shaftesbury Capital) is the leading
  central London mixed-use REIT and is a constituent of the FTSE-250 Index. Our property
  portfolio under management, valued at 5.6 billion pounds, extends to 2.8 million
  square feet of lettable space across the most vibrant areas of London's West End.
  With a diverse mix of shops, restaurants, cafes, bars, residential apartments and
  offices, our destinations include the high footfall, thriving neighborhoods of Covent
  Garden, Carnaby, Soho and Chinatown. Our properties are close to the main West End
  Underground stations and transport hubs for the Elizabeth Line. Shaftesbury Capital
  shares are listed on the London Stock Exchange (LSE) (primary) and the Johannesburg
  Stock Exchange (JSE) (secondary) and the A2X (secondary). Shaftesbury Capital PLC
  was incorporated on February 3rd, 2010 in United Kingdom.
