longBusinessSummary: Comcast Corporation operates as a media and technology company
  worldwide. The company operates through Residential Connectivity & Platforms, Business
  Services Connectivity, Media, Studios, and Theme Parks segments. Its Residential
  Connectivity & Platforms segment provides residential broadband and wireless connectivity
  services, residential and business video services, sky-branded entertainment television
  networks, and advertising. The Business Services Connectivity segment offers connectivity
  services for small business locations, which include broadband, wireline voice,
  and wireless services; and ethernet network services for medium-sized customers
  and larger enterprises. Its Media segment operates NBCUniversal's national and regional
  cable networks; the NBC and Telemundo broadcast networks and owned local broadcast
  television stations; and Peacock, a direct-to-consumer streaming services. The company
  also operates international television networks comprising the Sky Sports networks,
  as well as other digital properties. Its Studios segment operates NBCUniversal and
  Sky film and television studio production and distribution operations. The Theme
  Parks segment operates Universal theme parks in Orlando, Florida; Hollywood, California;
  Osaka, Japan; and Beijing, China. It also offers a consolidated streaming platforms
  under the Philadelphia Flyers and the Xfinity Mobile Arena in Philadelphia, Pennsylvania;
  and Xumo. Comcast Corporation was founded in 1963 and is headquartered in Philadelphia,
  Pennsylvania.
