longBusinessSummary: "LyondellBasell Industries N.V. operates as a chemical company\
  \ in the United States, Germany, China, Mexico, Italy, Japan, France, Poland, the\
  \ Netherlands, and internationally. It operates in five segments: Olefins and Polyolefins\x97\
  Americas; Olefins and Polyolefins\x97Europe, Asia, International; Intermediates\
  \ and Derivatives; Advanced Polymer Solutions; and Technology. The company produces\
  \ and markets olefins and co-products, such as ethylene, aromatics, propylene and\
  \ butadiene; polyolefins; polyethylene; polypropylene homopolymers and copolymers;\
  \ propylene oxide and derivatives; oxyfuels and related products; and intermediate\
  \ chemicals, such as styrene monomer and acetyls. It also produces and markets compounding\
  \ and solutions, including polypropylene compounds, engineered plastics, masterbatches,\
  \ and engineered composites and colors. In addition, it develops and licenses chemical\
  \ and polyolefin process technologies; and manufactures and sells polyolefin catalysts\
  \ and serves food packaging, home furnishings, automotive components, and paints\
  \ and coatings applications. LyondellBasell Industries N.V. was incorporated in\
  \ 2009 and is headquartered in Rotterdam, the Netherlands."
