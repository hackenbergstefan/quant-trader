longBusinessSummary: 'Keurig Dr Pepper Inc. owns, manufactures, and distributors beverages
  and single serve brewing systems in the United States and internationally. The company
  operates through three segments: U.S. Refreshment Beverages, U.S. Coffee, and International.
  It manufactures and distributes branded concentrates, syrup, and finished beverages,
  as well as sales of owned brands and third-party brands; tea, cocoa, and other products;
  and offers finished goods relating to K-Cup pods, single serve brewers, specialty
  coffee, and ready to drink coffee products. The company offers its products under
  the Dr Pepper, Canada Dry, Mott''s, A&W, Peñafiel, GHOST, Snapple, 7UP, Green Mountain
  Coffee Roasters, Clamato, Core Hydration, The Original Donut Shop, Sunkist soda,
  Squirt, C4 Energy, Hawaiian Punch, Electrolit, Bloom, Bai, Evian, Yoo-Hoo, Vita
  Coco, Big Red, RC Cola, Crush, McCafé, Tim Hortons, Van Houtte, Celestial Seasonings,
  Bigelow, Starbucks, Dunkin'', Folgers, Peet''s, and Swiss Miss brands, as well as
  other partner and private label brands. It markets and sells its products to supermarkets,
  mass merchandisers, club stores, e-commerce retailers, office superstores, vending
  machines, fountains, grocery and drug stores, convenience stores, and other small
  outlets; and directly to consumers through Keurig.com website. Keurig Dr Pepper
  Inc. was founded in 1981 and is headquartered in Frisco, Texas.'
