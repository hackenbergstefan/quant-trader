  fish, plain and marinated fillets and steaks, hot- and cold-smoked salmon, and burgers
  and patties, as well as breaded, gravad, and sushi products. The company was formerly
  known as Marine Harvest ASA and changed its name to Mowi ASA in December 2018. Mowi
  ASA was founded in 1964 and is based in Bergen, Norway.
