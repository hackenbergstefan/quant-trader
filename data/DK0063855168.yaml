longBusinessSummary: 'Rockwool A/S produces and sells stone wool insulation products
  in Western Europe, Eastern Europe, Russia, North America, Asia, and internationally.
  The company operates through two segments: Insulation and Systems segments. The
  company offers products, including solutions for ceiling systems, ventilated façades,
  friction and water management and stone wool substrate. It also offers roof, floor,
  façade, ceiling, partition wall, internal and exterior wall, HVAC, acoustic, and
  technical insulation, as well as passive fire protection, industrial insulation,
  marine and offshore insulation, OEM, basement, chimney, shed, and garage insulation
  products. In addition, the company provides acoustic ceilings and walls, cladding
  boards, rainwater management, and prefab building systems, engineered fibers, noise
  and vibration control, and horticultural substrates. It sells its products under
  the ROCKWOOL, Rockfon, Rockpanel, Grodan, and Lapinus brand names. Rockwool A/S
  was founded in 1909 and is based in Hedehusene, Denmark.'
