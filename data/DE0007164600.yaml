longBusinessSummary: SAP SE, together with its subsidiaries, provides enterprise application
  and business solutions worldwide. It offers SAP Business AI; SAP S/4HANA that provides
  software capabilities for finance, risk and project management, procurement, manufacturing,
  supply chain and asset management, and research and development; SAP SuccessFactors
  solutions for human resources, including HR, time, payroll, talent and employee
  experience management, and analytics and planning; and spend management solutions
  that covers direct and indirect spend, travel and expense, and external workforce
  management. The company also provides SAP customer experience solutions; SAP Business
  Technology platform that enables customers and partners to build, integrate, and
  automate applications; and SAP Business Network, a business-to-business collaboration
  platform that helps digitalize key business processes across the supply chain and
  enables communication between trading partners. In addition, it offers SAP Signavio
  to help customers to discover, analyze, and understand business process operations;
  industry solutions that provide customers and partners with industry-specific solutions;
  and SAP LeanIX to visualize enterprise architecture, assess interdependencies and
  the potential impact of IT modernization, and manage the transition toward the target
  landscape. Further, the company provides WalkMe to execute workflows; SAP Enable
  Now, which offers e-learning content embedded in SAP workflows; Taulia solutions
  for working capital management; and sustainability solutions and services. Additionally,
  it provides services and support solutions. The company has a strategic collaboration
  with Fresenius SE & Co. KGaA and Avelios Medical GmbH for the development of a cloud-native,
  hospital information system that enables digitalization of clinical and administrative
  processes with AI integration. SAP SE was founded in 1972 and is headquartered in
  Walldorf, Germany.
