longBusinessSummary: 'General Dynamics Corporation operates as an aerospace and defense
  company worldwide. It operates through four segments: Aerospace, Marine Systems,
  Combat Systems, and Technologies. The Aerospace segment produces and sells business
  jets; and offers aircraft maintenance and repair, management, aircraft-on-ground
  support, customer support and custom completion services, modifications, upgrades,
  and lifecycle sustainment support services. The Marine Systems segment designs and
  builds nuclear-powered submarines, surface combatants, and auxiliary ships for the
  United States Navy and Jones Act ships for commercial customers, as well as provides
  maintenance, modernization, and lifecycle support services for navy ships; offers
  and program management, planning, engineering, and design support services for submarine
  construction programs. The Combat Systems segment manufactures land combat solutions,
  such as wheeled and tracked combat vehicles, Stryker wheeled combat vehicles, piranha
  vehicles, weapons systems, energetics and munitions, mobile bridge systems with
  payloads, tactical vehicles, main battle tanks, and armored vehicles; and offers
  modernization programs, support and sustainment services, and development programs.
  The Technologies segment provides information technology solutions and mission support
  services; mobile communication, computers, and command-and-control mission systems;
  intelligence, surveillance, and reconnaissance solutions to military, intelligence,
  and federal civilian customers; cloud services, cybersecurity, network modernization,
  artificial intelligence; machine learning; application development, high-performance
  computing, and 5G and advanced communications services; and unmanned undersea vehicle
  manufacturing and assembly services. The company was founded in 1899 and is headquartered
  in Reston, Virginia.'
