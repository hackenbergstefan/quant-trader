longBusinessSummary: Orlen S.A. operates in refining, petrochemical, energy, retail,
  gas, and upstream business. It engages in the processing and wholesale of refinery
  products, such as crude oil; production and sale of fuel, oil, chemicals, and petrochemicals,
  as well as provision of supporting services; production, distribution, and sale
  of electricity and heat from conventional and renewable energy sources comprising
  solar photovoltaics, as well as natural gas; trading of electricity; exploration
  and extraction of mineral resources; exploration, production, and import of natural
  gas; and trading and storage of gas and liquid gas. The company is also involved
  in the exploration, recognition, and extraction of hydrocarbons; fuel station activities;
  and provision of transportation, maintenance and overhaul, laboratory, security,
  design, administrative, courier, insurance, and financial services, as well as press
  distribution, and media activities, such as newspapers and websites. It offers petrol,
  diesel, LPG, and biofuels; aviation and marine fuels; heating oils; aromatics, including
  phenol, benzene, paraxylene, purified terephthalic acid, benzene-toulene fraction,
  and naphthalene concentrate; olefins; polyolefins comprising polyethylene; plastics,
  including polyvinyl chloride polanvil, compounds creovil, and PVC neralit; glycols;
  nitrogen fertilizers; and other products, such as acetone, ethylene oxide, masterbatch,
  advanced technical carbon black Chezacarb, caprolactam, soda lye, and sodium hypochlorite.
  In addition, the company provides base, car and motorbike, truck, marine, industrial,
  and agricultural oils, as well as paraffin and solvents; table, pickling, iodized
  table, feed, scrap, and industrial salt, as well as industrial salt brine and dishwasher
  salt granules; and bitumen. The company was formerly known as Polski Koncern Naftowy
  ORLEN Spólka Akcyjna and changed its name to Orlen S.A. in July 2023. The company
  was founded in 1999 and is headquartered in Plock, Poland.
