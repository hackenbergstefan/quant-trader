longBusinessSummary: 'PepsiCo, Inc. engages in the manufacture, marketing, distribution,
  and sale of various beverages and convenient foods worldwide. The company operates
  through six segments: PepsiCo Foods North America; PepsiCo Beverages North America;
  International Beverages Franchise; Europe, Middle East and Africa; Latin America
  Foods; and Asia Pacific Foods. It offers cereals, chips, dips, granola bars, oatmeal,
  pasta, rice, and syrups and mixes; refrigerated dips and spreads; beverage concentrates,
  fountain syrups, and finished goods; and ready-to-drink tea and coffee products.
  The company also provides SodaStream sparkling water makers and related products,
  as well as various dairy products under the Agusha, Chudo, and Domik v Derevne brands.
  It serves wholesale and other distributors, foodservice customers, grocery stores,
  drug stores, convenience stores, discount/dollar stores, mass merchandisers, membership
  stores, hard discounters, e-commerce retailers and authorized independent bottlers,
  and others through a network of direct-store-delivery, customer warehouse, and distributor
  networks, as well as directly to consumers through e-commerce platforms and retailers.
  PepsiCo, Inc. was founded in 1898 and is based in Purchase, New York.'
