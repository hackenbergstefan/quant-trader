longBusinessSummary: Lifco AB (publ) engages in the dental, demolition and tools,
  and systems solutions businesses in Sweden, Norway, Finland, Germany, rest of Europe,
  the United Kingdom, Asia, Australia, Italy, North America, and internationally.
  It is involved in the distribution of dental equipment, such as denture attachments,
  disinfectants, saliva ejectors, bite registration and dental impression materials,
  bonding agents, and other consumables, as well as develops and sells medical record
  systems. The company also operates dental laboratory; and offers technical and software
  services. In addition, it develops, manufactures, and sells demolition robots, forest
  machines, crane and excavator attachments to heavy machine manufacturing, construction,
  forestry, nuclear, cement, and process industries. Further, the company offers machinery
  and equipment for electrical installations and electricity production, electrical
  equipment, equipment for recycling of various materials, and interiors for service
  vehicles. Additionally, it provides contract manufacturing, such as electronic components,
  stainless steel, and galvanized products; environmental technology; infrastructure
  products in the areas of electrification, LED-lighting, lift safety, relining, lightning
  protection, measuring instruments, and telecommunication; special products, including
  coffee machines, cartooning and sleeving solutions, special instruments, and clothing;
  and transportation products comprising tarpaulin systems, advanced lifting systems,
  equipment for ground service of aircrafts, light bars for trucks, and vehicle racking
  systems for service vans. The company was founded in 1946 and is based in Enköping,
  Sweden. Lifco AB (publ) is a subsidiary of Carl Bennet AB.
