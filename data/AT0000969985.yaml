longBusinessSummary: AT & S Austria Technologie & Systemtechnik Aktiengesellschaft,
  together with its subsidiaries, manufactures, distributes, and sells printed circuit
  boards in Austria, Germany, rest of Europe, China, rest of Asia, and the Americas.
  The company operates through Electronics Solutions, Microelectronics, and Others
  segments. It offers integrated circuit substrates; printed circuit boards and modules;
  flexible and rigid-flex, thermally enhanced, high-density interconnect, substrate
  like, cavity, multilayer, and double-sided printed circuit boards; and test and
  reference boards. The company also provides Z-Interconnect, ECP, 2.5D, advanced
  and power packaging, radio frequency electronics, system in package, and mSAP technological
  solutions. In addition, it offers design, simulation, and turnkey solutions. The
  company distributes its products directly to original equipment and contract electronic
  manufacturers. It serves semiconductors and modules; communications and 5G; consumer
  electronics; medical; industrial; aerospace and aviation; and automotive sectors.
  AT & S Austria Technologie & Systemtechnik Aktiengesellschaft was incorporated in
  1987 and is headquartered in Leoben, Austria.
