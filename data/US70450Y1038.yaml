longBusinessSummary: PayPal Holdings, Inc. operates a technology platform that enables
  digital payments for merchants and consumers worldwide. The company operates a two-sided
  network at scale that connects merchants and consumers that enables its customers
  to connect, transact, and send and receive payments through online and in person,
  as well as transfer and withdraw funds using various funding sources, such as bank
  accounts, PayPal or Venmo account balance, consumer credit and debit products, credit
  and debit cards, and cryptocurrencies, as well as other stored value products, including
  gift cards and eligible rewards. It provides payment solutions under the PayPal,
  PayPal Credit, Braintree, Venmo, Xoom, Hyperwallet, Honey, and Paidy names. The
  company was founded in 1998 and is headquartered in San Jose, California.
