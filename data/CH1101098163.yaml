longBusinessSummary: BELIMO Holding AG, together with its subsidiaries, engages in
  the development, production, and sale of damper actuators, control valves, sensors,
  and meters for heating, ventilation, and air conditioning systems (HVAC) in Europe,
  the Middle East, Africa, the Americas, and the Asia Pacific. It offers HVAC damper
  actuators, including non-fail-safe and fail-safe actuators, fast running and linear
  actuators, actuators for harsh environmental conditions, linear actuators, fire
  damper and smoke control actuators, variable air volume, valve actuators, and accessories.
  The company also provides various control valves, such as energy, pressure independent
  control, zone, characterized control, ball, butterfly valves, globe valves, valve
  actuators, and valve accessories. In addition, it offers measurement and monitoring
  sensors and meters, which include duct and outdoor sensors for air; water pipe sensors;
  room units; gas monitoring devices; thermal energy meters; and sensors accessories
  for thermowells, mounting plates, brackets, and clamps and various adapter connectors;
  and data centre cooling, building internet of things (IoT), and indoor air quality
  solutions. Further, the company provides systems solutions that includes energy
  valves, IoT actuators, air flow and pressure control air solutions, ZoneEase variable
  air volume, and system mechanical accessories, and terminal cover, as well as RetroFIT+,
  a product replacement tool. BELIMO Holding AG was founded in 1975 and is headquartered
  in Hinwil, Switzerland.
