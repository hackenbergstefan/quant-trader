longBusinessSummary: Weir PLC, together with its subsidiaries, produces and sells
  highly engineered original equipment worldwide. The company operates in two segments,
  Minerals and ESCO. The Minerals segment offers engineering, manufacturing, and service
  processing technology for the use in abrasive and high-wear mining applications;
  and differentiated technology for the use in infrastructure and general industrial
  markets. This segment provides cloud-based artificial intelligence solutions to
  the mining industry. The ESCO segment provides ground engaging tools for mining
  machines. In addition, the company offers aftermarket products, wear parts, equipment
  attachments, and processing equipment. Further, it provides field services comprising
  commissioning and ongoing support services; rebuild and repair services; digital
  services; and process optimization services. The company offers its products and
  services under the Cavex, Enduron, ESCO, GEHO, Linatex, Motion Metrics, Next, Warman,
  Accumin, All-Cast, Arterra, Aspir, Bucyrus Blades, Carbide Plus, Delta Industrial,
  GeoVor, HYDRAU-FLO, Infinity, Isogate, Kwik-Lok, Lewis, Linacure, Linagard, Linard,
  Loadmaster, MaxTemp, Multiflo, Nemisys, Nexsys, Posilok, Production Master, ProFill,
  Sandmaster, Super V, SV2, TopLock, Trio, UltraEdge, Ultrlok, Uni-Lok, Vertasys,
  Vulco, and Whisler Plus brands. The company was formerly known as The Weir Group
  PLC and changed its name to Weir PLC in August 2026. The Weir Group PLC was founded
  in 1871 and is headquartered in Glasgow, United Kingdom.
