longBusinessSummary: Coca-Cola HBC AG engages in the production, sale, and distribution
  of non-alcoholic ready-to-drink beverages under franchise in Switzerland, West Coast
  of Ireland, Central and Eastern Europe, Nigeria, and internationally. It offers
  sparkling soft drinks, adult sparkling, hydration drinks, juices, ready-to-drink
  tea and coffee, sports and energy drinks, plant-based drinks, hard seltzers, premium
  spirit, dairy, and snacks; and distributes third-party products. The company markets
  and sells its products under several brands, including Coca-Cola, Fanta, Sprite,
  Adez, Averna, Amita, Aquarius, Aperol, Avra, Deep RiverRock, Fruice, Kinley, Schweppes,
  and various other brands. It serves various consumer channels, such as supermarkets,
  convenience stores, vending machines, hotels, cafés, and restaurants, as well as
  e-commerce channels. Coca-Cola HBC AG was incorporated in 1969 and is headquartered
  in Steinhausen, Switzerland.
