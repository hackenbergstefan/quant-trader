longBusinessSummary: Illumina, Inc. provides sequencing- and array-based solutions
  for genetic and genomic analysis in the Americas, Europe, Greater China, the Asia
  Pacific, the Middle East, and Africa. The company offers sequencing- and array-based
  instruments and consumables, which include reagents, flow cells, and library preparation;
  whole-genome sequencing kits, which sequence entire genomes of various size and
  complexity; and targeted resequencing kits, which sequence exomes, specific genes,
  and RNA or other genomic regions of interest. It also provides whole-genome sequencing,
  genotyping, noninvasive prenatal testing, and product support services. The company
  serves genomic research centers, academic institutions, government laboratories,
  and hospitals, as well as pharmaceutical, biotechnology, commercial molecular diagnostic
  laboratories, and consumer genomics companies. The company markets and distributes
  its products directly to customers, as well as through life-science distributors.
  The company has a collaboration with Labcorp Holdings Inc. for the development of
  oncology treatments through applications of sequencing solutions across the healthcare
  ecosystem; and strategic collaboration with Integrated DNA Technologies to enable
  a DRAGEN, secondary analysis pipeline for IDT xGena, FFPE and cfDNA next generation
  sequencing (NGS) library preparation with custom panels, delivering an integrated,
  end-to-end solution for somatic oncology research. It also has a data partnership
  with Center for Data-Driven Discovery in Biomedicine to advance research in pediatric
  cancer and rare disease. Illumina, Inc. was incorporated in 1998 and is headquartered
  in San Diego, California.
