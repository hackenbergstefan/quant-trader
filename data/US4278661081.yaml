longBusinessSummary: 'The Hershey Company, together with its subsidiaries, engages
  in the manufacture and sale of confectionery products and pantry items in the United
  States and internationally. It operates through three segments: North America Confectionery,
  North America Salty Snacks, and International. The company offers chocolate and
  non-chocolate confectionery products; gum and mint refreshment products, including
  mints, chewing gums, and bubble gums; protein bars; pantry items, such as baking
  ingredients, toppings, beverages, and sundae syrups; and snack items comprising
  spreads, bars, snack bites, mixes, popcorn, and pretzels. It provides its products
  primarily under the Hershey''s, Reese''s, Kisses, Jolly Rancher, Almond Joy, Brookside,
  barkTHINS, Cadbury, Good & Plenty, Heath, Kit Kat, Payday, Rolo, Twizzlers, Sour
  Strips, Whoppers, York, Ice Breakers, Breath Savers, Bubble Yum, Lily''s, SkinnyPop,
  Pirates Booty, Dot''s Homestyle Pretzels, and ONE Bar brands, as well as under the
  Pelon Pelo Rico, IO-IO, and Sofit brands. The company markets and sells its products
  to wholesale distributors, chain grocery stores, mass merchandisers, chain drug
  stores, vending companies, wholesale clubs, convenience stores, dollar stores, concessionaires,
  and department stores. It exports its products in approximately 65 countries worldwide.
  The Hershey Company was founded in 1894 and is based in Hershey, Pennsylvania.'
