longBusinessSummary: Saab AB (publ) provides products, services, and solutions for
  military defense, aviation, and civil security markets in Sweden, the United States,
  the United Kingdom, Germany, Australia, and internationally. The company operates
  through Aeronautics, Dynamics, Surveillance, Kockums, and Combitech segments. The
  Aeronautics segment engages in the manufacture of aerial systems; development of
  military aviation technology; and conducting of studies of manned and unmanned aircraft
  for new systems and further development of existing products. Its Dynamics segment
  offers combat weapons, missile systems, systems for training and simulation, and
  signature management systems for armed forces in the civil and defense markets.
  The Surveillance segment provides airborne, ground-based and naval radar, electronic
  warfare, combat systems, and C4I solutions. Its Kockums segment develops, delivers,
  and maintains submarines with the Stirling system for air independent propulsion,
  surface combatants, mine hunting systems, autonomous vessels, torpedoes, and unmanned
  underwater vehicles. The Combitech segment offers services in systems development,
  systems integration, information security, systems security, communications, mechanics,
  technical product information, and logistics, as well as technology consultancy
  services. Saab AB (publ) was founded in 1937 and is headquartered in Stockholm,
  Sweden.
