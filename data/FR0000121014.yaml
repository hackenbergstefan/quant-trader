longBusinessSummary: LVMH Moët Hennessy - Louis Vuitton, Société Européenne, together
  with its subsidiaries, operates as a luxury goods company worldwide. It offers wine
  and spirit products under the Ao Yun, Ardbeg, Armand de Brignac, Belvedere, Bodega
  Numanthia, Chandon, Cheval des Andes, Château Cheval Blanc, Château Galoupet, Château
  d'Yquem, Château d'Esclans, Cloudy Bay, Colgin Cellars, Dom Pérignon, Domaine des
  Lambrays, Eminente, Glenmorangie, Hennessy, Joseph Phelps, Krug, Mercier, Minuty,
  Moët & Chandon, Newton Vineyard, Ruinart, SirDavis, Terrazas de los Andes, Veuve
  Clicquot, Volcan de mi Tierra, and Woodinville brands; fashion and leather products
  under Barton Perreira,Berluti, Celine, Christian Dior, Fendi, Givenchy, Kenzo, Loewe,
  Loro Piana, Louis Vuitton, Marc Jacobs, Moynat, Patou, Pucci, Rimowa, and Vuarnet
  brands; and perfumes and cosmetics products under the Acqua di Parma, Benefit Cosmetics,
  Fenty Beauty by Rihanna, Fresh, Givenchy Parfums, Guerlain, Kenzo Parfums, Loewe
  Perfumes, Maison Francis Kurkdjian, Make Up For Ever, OLEHENRIKSEN, Officine Universelle
  Buly, and Parfums Christian Dior brands. The company also provides watches and jewelry
  under the Bvlgari, Chaumet, DANIEL ROTH, Fred, Gérald Genta, Hublot, L'Epée 1839,
  Repossi, TAG Heuer, Tiffany & Co., and Zenith brands; and selective retailing under
  the 24S, DFS, La Grande Épicerie de Paris, Le Bon Marché Rive Gauche, Samaritaine,
  and Sephora brands. In addition, it offers french business and cultural publications
  under the Les Echos group brand; custom-designed yachts under the Feadship brand;
  hotels under the Cheval Blanc and Belmond brands; and other activities under the
  Connaissance des Arts, Cova, Investir, Jardin d'Acclimatation, Le Parisien, Paris
  Match, and Radio Classique brands. LVMH Moët Hennessy - Louis Vuitton, Société Européenne
  was founded in 1365 and is headquartered in Paris, France.
