longBusinessSummary: Symrise AG operates as a supplier of fragrances, flavorings,
  cosmetic base materials and active ingredients, and functional ingredients and solutions
  in Europe, Africa, the Middle East, North America, the Asia Pacific, and Latin America.
  It operates in two segments, Taste, Nutrition & Health; and Scent & Care. The Taste,
  Nutrition & Health segment provides functional ingredients and product solutions
  used in the production of food and beverages; savory flavors; sweets, chocolate,
  chewing gum, baked goods, cereals, ice cream, milk, yogurt and milk alternatives;
  natural and sustainable ingredients for food and beverage manufacturers, baby food,
  and dietary supplements; product solutions and services for pet food manufacturers;
  sustainable ingredients and services for fish feed manufacturers to develop solutions
  for fish and shrimp farms; and probiotics for food supplements and functional foods.
  The Scent & Care segment develops, produces, and sells fragrance ingredients and
  compositions, aroma molecules, cosmetic ingredients, and mint flavors, as well as
  specific application processes for such substances. This segment's products are
  used by manufacturers of perfumes, personal care and cosmetic products, cleaning
  products, detergents, air fresheners, and oral care products. The company was founded
  in 1874 and is headquartered in Holzminden, Germany.
