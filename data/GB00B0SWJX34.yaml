longBusinessSummary: 'London Stock Exchange Group plc provides financial markets infrastructure
  and data products in the United Kingdom, the United States, Europe, Asia, and internationally.
  The company operates through four segments: Data & Analytics, FTSE Russell, Risk
  Intelligence, and Markets. It offers data, analytics, and AI tools through an open
  and interoperable architecture; real-time data and news, text, reference, and legal
  entity information; and cross-asset models and analytics solutions, such as Yield
  Book fixed income, Lipper fund performance, private credit analytics, and StarMine
  sentiment analysis. The company also provides index and benchmark solutions; risk
  intelligence solutions to meet Know Your Customer and Know Your Third Party obligations,
  perform due diligence, and mitigate identity and payment fraud risks; World-Check
  Verify, a cloud-native screening API; and World-Check On Demand for continuously
  updated sanctions, politically exposed persons, adverse media, and enforcement data.
  In addition, it offers access to various liquidity pools in multiple asset classes
  comprising equities, fixed income, exchange-traded funds and products, and foreign
  exchange; capital formation and execution venues consisting of London Stock Exchange,
  AIM, Turquoise, FXall, FX Matching, and Tradeweb; and clearing and capital optimization
  solutions for interest rate swap, foreign exchange, and credit default swap OTC
  derivatives. Further, the company provides securities clearing, capital optimization,
  and regulatory reporting solutions; software licenses; network connections; hosting
  services; clearing, settlement, and other post trade services; and events and media
  services. London Stock Exchange Group plc was founded in 1698 and is based in London,
  the United Kingdom.'
