longBusinessSummary: American Water Works Company, Inc., through its subsidiaries,
  provides water and wastewater services in the United States. It offers water and
  wastewater services on military installations; and undertakes contracts with municipal
  customers, primarily to operate and manage water and wastewater facilities, as well
  as offers other related services. The company also operates approximately 80 surface
  water treatment plants; 520 groundwater treatment plants; 170 wastewater treatment
  plants; 55,000 miles of transmission, distribution, and collection mains and pipes;
  1,200 groundwater wells; 1,800 water and wastewater pumping stations; 1,100 treated
  water storage facilities; and 75 dams. In addition, it offers water and wastewater
  services to 14 states serving approximately 3.6 million active customers. The company
  serves residential customers; commercial customers, including food and beverage
  providers, commercial property developers and proprietors, and energy suppliers;
  fire service and private fire customers; industrial customers, such as large-scale
  manufacturers, mining, and production operations; public authorities comprising
  government buildings and other public sector facilities, such as schools and universities;
  and other utilities and community water and wastewater systems. The company was
  founded in 1886 and is headquartered in Camden, New Jersey.
