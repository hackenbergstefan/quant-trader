longBusinessSummary: Norwegian Cruise Line Holdings Ltd., together with its subsidiaries,
  operates as a cruise company in North America, Europe, the Asia-Pacific, and internationally.
  It offers itineraries to destinations, such as Europe, Asia, Australia, New Zealand,
  South America, Africa, Canada, Bermuda, the Caribbean, and Alaska; and inter-island
  itinerary in Hawaii. The company also provides features, amenities, and activities,
  including various accommodations, dining venues, bars and lounges, spas, casino
  and retail shopping areas, and entertainment choices; shore excursions at each port
  of call, and air transportation and hotel packages for stays before or after a voyage.
  It offers its products and services under the Norwegian Cruise Line, Oceania Cruises,
  and Regent Seven Seas Cruises brands. The company was founded in 1966 and is based
  in Miami, Florida.
