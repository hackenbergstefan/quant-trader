longBusinessSummary: Salesforce, Inc. provides customer relationship management technology
  services that connect companies and customers together in the United States, Europe,
  and the Asia Pacific. The company offers Agentforce, which enables customers to
  build, deploy, and manage enterprise-grade, autonomous AI agents at scale, enabling
  humans and agents to work together; Agentforce Sales, an integrated platform that
  brings together the power of humans with AI agents to help sales teams for selling,
  managing, and automating entire sales processes; Agentforce Service, which enables
  companies in every industry to bring all of their customer, employee, IT, and field
  service needs onto one integrated AI-powered platform; Data 360, a data engine that
  gives AI agents their context and serves as the foundation for how customers unify
  service offerings, making their data actionable for both humans and agents; Informatica,
  an AI-powered data management platform that enables customers to discover, integrate,
  govern, and deliver trusted data at scale across hybrid and multi-cloud environments;
  and Slack, a conversational interface for the agentic enterprise where people and
  agents work together, connecting knowledge, actions, and data in real time. It also
  provides marketing platforms; commerce services, which empower shopping experiences
  across various customer touchpoints; integration and analytics solutions; Salesforce
  Starter, a suite for small and medium-sized businesses that brings sales, service,
  marketing, and commerce together; and a field service solution that enables companies
  to connect service agents, dispatchers, and mobile employees through one centralized
  platform to schedule and dispatch work, as well as track and manage jobs. It serves
  financial services, healthcare and life sciences, manufacturing, automotive, and
  government sectors. Salesforce, Inc. was incorporated in 1999 and is headquartered
  in San Francisco, California.
