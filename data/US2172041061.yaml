longBusinessSummary: Copart, Inc. provides online auctions and vehicle remarketing
  services in the United States, the United Kingdom, Germany, Brazil, Canada, the
  United Arab Emirates, Spain, Finland, Oman, the Republic of Ireland, and Bahrain.
  The company provides a range of services to process and sell vehicles over the internet
  through its virtual bidding third generation internet auction-style sales technology.
  It offers services, such as online seller access; salvage estimation; estimating;
  end-of-life vehicle processing; transportation; vehicle inspection stations; on-demand
  reporting; title processing and express; loan payoff; flexible vehicle processing
  programs; buy it now and make an offer; sales process; and dealer services. In addition,
  the company provides IntelliSeller, an automated tool that leverages its vehicle
  and sales data to assist its sellers in making vital auction decisions; BluCar to
  sell vehicles of financial institutions, fleet, and rental car companies; CashForCars.com,
  CashForCars.ca, CashForCars.de, CashForCars.co.uk, and Cash-for-cars.ie; and national
  powersport auctions services, which include services through live and online auction
  platforms to dealers, financial institutions, and original equipment manufacturers.
  Further, it offers wholesale construction, agriculture, and fleet remarketing services
  through no-reserve online auctions under Purple Wave brand name; Copart Recycling
  services; and Copart 360, a technology that captures clear 360-degree views of interiors
  and exteriors of cars, trucks, and vans. The company sells the vehicles to licensed
  vehicle dismantlers, rebuilders, repair licenses, used vehicle dealers, and exporters,
  as well as to the public. Copart, Inc. was incorporated in 1982 and is headquartered
  in Dallas, Texas.
