longBusinessSummary: First Solar, Inc., a solar technology company, provides photovoltaic
  (PV) solar energy solutions in the United States, France, India, Chile, and internationally.
  The company manufactures and sells PV solar modules with thin film semiconductor
  technology that provides conventional crystalline silicon PV solar modules. It also
  designs, manufactures, and sells cadmium telluride solar modules that convert sunlight
  into electricity. The company serves system developers, independent power producers,
  utilities, commercial and industrial companies, large corporate energy buyers, and
  other system owners and operators. The company was formerly known as First Solar
  Holdings, Inc. and changed its name to First Solar, Inc. in 2006. First Solar, Inc.
  was founded in 1999 and is headquartered in Phoenix, Arizona.
