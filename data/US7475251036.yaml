longBusinessSummary: 'QUALCOMM Incorporated engages in the development and commercialization
  of foundational technologies for the wireless industry in China, the United States,
  South Korea, and internationally. It operates through three segments: Qualcomm CDMA
  Technologies (QCT); Qualcomm Technology Licensing (QTL); and Qualcomm Strategic
  Initiatives (QSI). The QCT segment develops and supplies integrated circuits and
  system software with connectivity and computing technologies for use in mobile devices;
  automotive systems for connectivity, digital cockpit, and ADAS/AD; and IoT, including
  personal AI and compute devices and industrial, networking, and robotics products.
  The QTL segment grants licenses or provides rights to use portions of its intellectual
  property portfolio, which include various patent rights useful in the manufacture
  and sale of wireless products comprising products implementing LTE, and/or OFDMA-based
  5G products and derivatives; and grants licenses to use cellular standard-essential
  patents, including 3G, 4G and 5G for cellular devices. The QSI segment invests in
  early-stage companies in various industries, including AI, automotive, consumer,
  enterprise, IoT, and data center, as well as non-marketable and marketable equity
  securities, and convertible debt instruments. It is also involved in Qualcomm government
  technologies and data center businesses; and modular businesses that provides software
  platforms, tools, and cloud-based services that enable developers and enterprises
  to build, deploy, and scale AI applications across heterogeneous computing environments.
  QUALCOMM Incorporated was incorporated in 1985 and is headquartered in San Diego,
  California.'
