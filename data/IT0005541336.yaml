longBusinessSummary: Lottomatica Group S.p.A., together with its subsidiaries, operates
  in the gaming market in Italy. The company operates through Online, Sports Franchise,
  and Gaming Franchise segments. The Online segment provides a range of online games,
  such as sports betting, virtual betting, horse betting, online casino games, bingo,
  poker, betting exchange, and skill games through the GoldBet.it, Better.it, Lottomatica.it,
  Betflag.it, Totosì.it, and Planetwin365.it websites. The Sports Franchise segment
  offers various retail offerings, such as sports betting, virtual betting, and horserace
  betting under the GoldBet, Intralot, Better, and Planetwin365 brands. The Gaming
  Franchise segment engages in the management of gaming halls and concession activities
  for video lottery terminals and amusement with prize machines. Lottomatica Group
  S.p.A. was incorporated in 2019 and is based in Rome, Italy.
