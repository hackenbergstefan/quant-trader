longBusinessSummary: Labcorp Holdings Inc. provides laboratory services. It operates
  in Diagnostics Laboratories and Biopharma Laboratory Services segments. The company
  offers various tests, such as blood chemistry analyses, urinalyses, blood cell counts,
  thyroid tests, PAP tests, hemoglobin A1C, PSA, tests for sexually transmitted diseases,
  vitamin D testing, microbiology cultures and procedures, and alcohol and other substance
  abuse tests. It also provides specialty testing services comprising gene-based and
  esoteric testing; advanced tests target specific diseases; services related to anatomic
  pathology/oncology, cardiovascular disease, coagulation, diagnostic genetics, endocrinology,
  infectious disease, women's health, pharmacogenetics, parentage and donor testing,
  occupational testing service, medical drug monitoring services, chronic disease
  programs, and kidney stone prevention tests; and health and wellness services to
  employers and managed care organizations. In addition, it offers digital pathology
  solutions, a pathology platforms that support the digitization, centralized review,
  and sharing of pathology slides; provider and payer digital platforms, an online
  applications for providers, MCOs, and ACOs; online and mobile applications that
  enable patients to check offerings, schedule PSC visits, check-in upon PSC arrival,
  complete documentation, access tests and test results, and manage their accounts;
  and Generative AI enabled Test Selection, a generative AI enabled tool. It serves
  clients, third party, medicare/medicaid, patients, pharmaceutical, biotechnology,
  medical device, diagnostic companies, and CROs. It has a collaboration with the
  Children's Hospital of Philadelphia to accelerate the discovery, development, and
  availability of pediatric diagnostics. The company was founded in 1995 and is headquartered
  in Burlington, North Carolina.
