longBusinessSummary: 'Huber+Suhner AG engages in the provision of power and data connectivity
  components and system solutions in Switzerland, Europe, the Middle East, Africa,
  the Asia-Pacific, and the Americas. It operates through three segments: Industry,
  Communication, and Transportation. The company offers antennas and antenna accessories;
  optical fiber connectors, coaxial connectors, optical fiber adapters, and coaxial
  adapters; optical fiber, coaxial, signal and control, power, databus, jumper, rolling
  stock, instrumentation, system, and hybrid cables; coaxial and optical fiber cable
  assemblies, hybrid and power assemblies and systems, and connection system for electric
  vehicles (EVs); and fiber cable management products, such as chassis, modules, fiber
  management accessories, optical distribution frames, and enclosures. It also offers
  components, including terminations, attenuators, filters, splitters and couplers,
  tappers, coaxial DC blocks, and surge protective devices; tools and accessories;
  pluggable transceivers and transceiver cables; and other systems, such as optical
  switches, RF-over-fiber solutions, ethernet switches, optical multiplexers, and
  CPE. In addition, the company provides e-business and supply management services,
  as well as RF Tools, an application that operates as a cable assembly calculator;
  injection moduling and plating services. It serves aerospace and defense, EV charging
  infrastructure, test and measurement, data center, fixed access network, mobile
  network, general industrial, automotive, railway, and other industry markets. Huber+Suhner
  AG was founded in 1864 and is headquartered in Herisau, Switzerland.'
