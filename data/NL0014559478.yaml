longBusinessSummary: Technip Energies N.V., together with its subsidiaries, operates
  as an engineering and technology company in Europe, Central Asia, Africa, the Middle
  East, the Asia Pacific, and the Americas. It operates in two segments, Technology,
  Products & Services and Project Delivery. The company offers consulting solutions,
  such as advisory, project management consultancy, operations and maintenance, and
  T.EN, a digital service; engineering studies for pressure vessels, rotating equipment,
  instrumentation, electrical facilities, computing, piping, civil works, and cost
  control and scheduling for facilities and revamps; and sourcing and procurement
  solutions. It also provides transport and installation, construction management,
  and commissioning solutions; T.EN loading systems; CO2Connect, a marine loading
  arm to transfer CO2under the T.EN brand; Beyond LS, a digital platform; and monitoring,
  automation, and inspection solutions. In addition, the company offers silica and
  zeolite-based solutions under the Alpha and Opal brands; Capture.Now, a set of decarbonization
  solutions to capture and transform carbon; Canopy by T.EN, a suite of post-combustion
  carbon capture solutions; BlueH2, which produces low-carbon hydrogen from fossil
  sources; and SnapLNG by T.EN, which combines a compact modular design for mid-scale
  LNG trains. Further, it provides iLNGP, which performs functions of an LNG terminal
  and a gas power plant; iRPB, which reduces capital expenditures and a deployment
  schedule; Cyxense Commander, an open environment for robotics fleet management;
  CyXense Surveyor platform, a unified software for safety and security management;
  and CyXense Expert, an image acquisition and analysis software. Additionally, the
  company offers SPYRO for ethylene producers. Technip Energies N.V. was incorporated
  in 2019 and is headquartered in Nanterre, France.
