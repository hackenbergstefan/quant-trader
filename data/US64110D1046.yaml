longBusinessSummary: NetApp, Inc. develops enterprise software, systems, and services
  to transform data infrastructures in the United States, Canada, Latin America, Europe,
  the Middle East, Africa, and the Asia Pacific. It operates through two segments,
  Hybrid Cloud and Public Cloud. The company offers data management software, such
  as NetApp ONTAP, ONTAP One, NetApp Snapshot, NetApp SnapCenter Backup Management,
  NetApp SnapMirror Data Replication, and NetApp SnapLock Data Compliance; and storage
  infrastructure solutions, including NetApp AFF and ASA A-Series and C-Series, NetApp
  AFX, NetApp Fabric Attached Storage (FAS), NetApp E/EF series, and NetApp StorageGRID.
  It also provides cloud storage services comprising Azure NetApp Files, Amazon FSx
  for NetApp ONTAP, and Google Cloud NetApp Volumes, as well as NetApp Cloud Volumes
  ONTAP. In addition, the company offers operational services, such as NetApp Data
  Infrastructure Insights and Instaclustr; and professional and support services include
  storage-as-a-service (STaaS), strategic consulting, professional, managed, and support
  services, as well as assessment, design, implementation, migration, and proactive
  support services to optimize the performance and efficiency of their on-premises
  and hybrid multicloud storage environments. Further, it offers ransomware protection,
  data backup and recovery, and disaster recovery. It serves various industries comprising
  energy, financial services, government, technology, internet, life sciences, healthcare
  services, manufacturing, media, entertainment, animation, video postproduction,
  and telecommunications through a direct sales force and an ecosystem of partners,
  including the cloud providers. The company has a strategic alliance with Commvault
  Systems, Inc. to develop an integrated solution for enterprise data protection and
  cyber resilience; and Super Micro Computer, Inc. to build integrated AI infrastructure
  solutions. NetApp, Inc. was incorporated in 1992 and is based in San Jose, California.
