longBusinessSummary: DSM-Firmenich AG provides nutrition, health, and beauty solutions
  in Switzerland, the Netherlands, rest of Europe, the Middle East and Africa, North
  America, Latin America, China, and rest of Asia. The company operates through Perfumery
  & Beauty; Taste, Texture & Health; and Health, Nutrition & Care segments. The Perfumery
  & Beauty creates scents using natural, synthetic, and biotech ingredients. The Taste,
  Texture & Health segment provides food and beverages solutions, including flavors,
  natural extracts, and sugar reduction; and food enzymes, hydrocolloids, cultures,
  natural colorants, nutritional ingredients, and plant-based proteins. The Health,
  Nutrition & Care segment provides solutions for the early life nutrition, dietary
  supplement, pharmaceutical, medical nutrition, biomedical materials, and nutrition
  improvement markets. This segment also offers vitamins, nutritional lipids, minerals,
  carotenoids, botanical nutraceuticals, digestive enzymes, postbiotics, probiotics
  and prebiotics, and active pharmaceutical ingredients; biomedical solutions; and
  premix, market-ready, and personalized nutrition solutions, as well as expert services
  in regulatory affairs and nutrition. DSM-Firmenich AG was founded in 1902 and is
  based in Kaiseraugst, Switzerland.
