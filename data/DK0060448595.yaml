longBusinessSummary: 'Coloplast A/S develops and sells intimate healthcare products
  and services in Denmark, the United States, the United Kingdom, France, and internationally.
  The company operates through five segments: Chronic Care, Voice & Respiratory Care,
  Interventional Urology, Advanced Wound Dressings, and Biologics. It provides ostomy
  care products, including SenSura Mio, which provides fit individual body shapes
  and discretion for various types of ostomies; and SenSura Ostomy care solutions,
  as well as ostomy accessories under the Brava brand. The company also offers continence
  care products, such as Conveen Active urine bags; SpeediCath catheters that offer
  catheterization for both genders; Peristeen Plus, a transanal irrigation system;
  and Peristeen Light, a low-volume transanal irrigation. In addition, it provides
  wound care products comprising conforming dressing under the Biatain Silicone brand
  and hydrocolloid dressing under the Comfeel brand. Further, the company develops,
  produces, and markets products for the surgical treatment of urological and gynecological
  disorders, such as erectile dysfunction, urinary stone diseases, benign prostate
  hyperplasia, voiding dysfunctions, and urinary incontinence. Additionally, its voice
  and respiratory care solutions include laryngectomy care products comprising Provox,
  a voice prosthesis for speaking, HMEs, adhesives, laryngectomy tubes for breathing,
  devices for speaking hands-free, and accessories, as well as tracheostomy care products
  under Tracoe brand. Coloplast A/S was founded in 1954 and is headquartered in Humlebæk,
  Denmark.'
