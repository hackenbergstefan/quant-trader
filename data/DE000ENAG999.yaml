longBusinessSummary: E.ON SE operates as an energy company in Germany, the United
  Kingdom, Sweden, the Netherlands, rest of Europe, and internationally. The company
  operates through Energy Networks, Energy Infrastructure Solutions, and Energy Retail
  segments. The Energy Networks segment operates power and gas distribution networks;
  and offers maintenance, repair, and related services for its power and gas networks.
  Its Energy Infrastructure Solutions provides integrated and sustainable energy solutions
  for cities, municipalities, and industrial and commercial customers comprising district
  heating and cooling; heat, steam, and electricity services; embedded solutions;
  products and services that enhance energy efficiency. This segment also installs
  smart energy meters, block-type thermal power stations, photovoltaic systems, air-conditioning
  systems, and heat pumps. Its Energy Retail segment supplies power and gas; installs
  customer connections and connects renewable energy generating stations to the grid;
  and offers a range of green power and green gas, and sustainable solutions that
  enhance energy efficiency for residential, small and medium-sized enterprises, commercial
  and industrial, and sales partners. It also provides digital solutions; biogas and
  biomethane products; and compressed natural gas refueling services, as well as solar
  and battery storage systems, heating systems, and charging infrastructure for electric
  vehicle. E.ON SE was founded in 1923 and is headquartered in Essen, Germany.
