longBusinessSummary: Persimmon Plc, together with its subsidiaries, operates as a
  house builder in the United Kingdom. The company offers family housing under the
  Persimmon Homes brand name; housing under the Charles Church brand name; and social
  housing under the Westbury Partnerships brand name. It also provides broadband services
  under the FibreNest brand; and timber frame, insulated wall panels, and roof cassettes
  under the Space4 brand. In addition, the company offers concrete bricks under the
  Brickworks brand; and concrete roof tile under the Tileworks brand. Persimmon Plc
  was founded in 1972 and is headquartered in York, the United Kingdom.
