longBusinessSummary: Bank Polska Kasa Opieki S.A., a commercial bank, provides banking
  products and services to retail and corporate clients in Poland. It operates through
  Retail Banking and Private Banking; Enterprise banking; and Corporate and Investment
  Banking segments. The company offers bank accounts, deposits and certificates of
  deposit, payment cards, loan products, mortgage and consumer loans, and insurance
  products. It is also involved in the brokering activity and sale of investment products;
  leasing, factoring, arranging issues of debt securities, and other specialized forms
  of financing; and transactional banking. In addition, the company provides investment
  advisory services, advisory in M&A, advanced treasury, capital market products,
  and custody services; investment banking; structured finance; financing of commercial
  real estate projects, including financing of the construction of warehouses; and
  other services, such as collecting information on debtors' financial situation,
  collection, debt collection, settlements accounting, and monitoring of payments.
  Further, it is involved in the settlement of mass transactions, financial advisory
  and consulting services regarding the selection of financing method, and granting
  loans and credits related to the factoring agreement; brokerage services for large
  and medium-sized enterprises and financial institutions; payment card management
  systems, transaction authorization and card personalization; online payment systems;
  and financial intermediation and transfer agent services. Bank Polska Kasa Opieki
  S.A. was founded in 1929 and is headquartered in Warsaw, Poland.
