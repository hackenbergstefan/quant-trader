longBusinessSummary: Royal Unibrew A/S engages in the production of beverages in Denmark,
  Germany, Norway, Sweden, Italy, the Netherlands, France, Finland, Lithuania, Latvia,
  Estonia, Belgium, Luxembourg, and internationally. It offers soft drinks under the
  Faxe Kondi, Jaffa, Lemon Soda, Lorina, Royal Club, Fonti di Crodo, Adelhardt, Frem,
  Rebæl, Crystal Clear, Sisi, Sourcy Vitamin Water, Borg, Hansa, CB, and Pommac brands,
  as well as other partner brands. The company also provides energy drinks under the
  Faxe Kondi Booster, CULT, Crazy Tiger, Lemon Soda Energy, Jaffa Booster, and ED
  energy brands; water under the Novelle, Egekilde, Sourcy, Vichy Original, Olden,
  Mangali, and other partner brands; and malt beverages under the Vitamalt, Supermalt,
  and Powermalt brands. In addition, it offers beers under the Ceres Italy, Faxe,
  Royal, Hansa, Anarkist, Lapin Kulta, Amsterdam, Bauskas, Albani, Too Old To Die
  Young, Slots, Fuglsang, Thor, Nørrebro Bryghus, Schiøtz, Ceres Denmark, Borg, Kalnapilis,
  Helsinki Bryggeri, Tanker, Vilkmergés, Aura, Nøgne Ø, CB, Madonas Alus, Lielvardes,
  Frederikstad, Karjala, Lahden Erikois, Maltti, Lacplesis and other partner brands.
  Further, the company provides ready-to-drink products, cocktails, and ciders under
  the Original Long Drink, Grevens, Shaker, Tempt Cider, GiG Drinks, Mokai, Nohrlund,
  Happy Joe, Hartwall Seltzer, Hartwall Cocktails, Hansa Hard Seltzer, Urban Cocktails,
  Royale Cocktail Co., Lielvardes Sidrs, Vilkmerges Sidras, Strongbow, and other partner
  brands. Additionally, it offers juice under the Cido, Adelhardt, Looza, Pagoi, and
  Ranja brands; enhanced beverages under the Faxe Kondi Pro, Hartwall Sport, Cido
  Hydrate+, Sourcy Vitamin water, and Gatorda; and tea and coffee under partner brands.
  The company was formerly known as Bryggerigruppen A/S and changed its name to Royal
  Unibrew A/S in 2005. Royal Unibrew A/S was founded in 1901 and is headquartered
  in Faxe, Denmark.
