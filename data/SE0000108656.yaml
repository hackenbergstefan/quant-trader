longBusinessSummary: Telefonaktiebolaget LM Ericsson (publ), together with its subsidiaries,
  provides mobile connectivity solutions to communications service providers, enterprises,
  and the public sector in the Americas, Europe, the Middle East, Africa, Northeast
  Asia, Southeast Asia, Oceania, and India. It operates through Networks; Cloud Software
  and Services; Enterprise; and Other segments. The Networks segment offers hardware,
  software, and service offerings for intelligent, reliable and flexible 5G networks.
  This segment also provides energy-efficient RAN with an AI-native software architecture
  deployable on Ericsson silicon and third-party CPUs/GPUs; transport networks; and
  active/ passive antennas, as well as deployment and lifecycle management services.
  The Cloud Software and Services segment provides core networks, network management,
  business and operations support systems, and network operations delivered as managed
  services, including secure data and voice connectivity, service monetization and
  orchestration tools, and network management services. The Enterprise segment offers
  intelligent networking and advanced communications software solutions comprising
  global communications platform, wireless wide area networks (WWAN), and private
  5G networks. The Other segment includes RedBee Media that prepares and distributes
  live and on-demand video services for broadcasters, sports leagues, and communications
  service providers. The company has a strategic collaboration with T-Mobile US, Inc
  for the development of AI-native Scheduler with Link Adaptation software. The company
  was formerly known as Allmanna Telefon AB LM Ericsson and changed its name to Telefonaktiebolaget
  LM Ericsson (publ) in January 1926. Telefonaktiebolaget LM Ericsson (publ) was founded
  in 1876 and is headquartered in Stockholm, Sweden.
