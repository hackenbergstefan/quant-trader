longBusinessSummary: IMI plc designs and manufactures fluid and motion control solutions
  in the United Kingdom, Germany, rest of Europe, the United States, rest of the Americas,
  China, rest of the Asia Pacific, the Middle East, and Africa. It operates through
  Automation and Life Technology segments. The company provides engineer advanced
  fluid control automation solutions; creates fluid and motion control solutions;
  pneumatic and electric motion systems for creating smart, safe, and sustainable
  factories, production lines, and operations; valves, actuators, and digitally connected
  products. It also develops solutions that reduce emissions from commercial vehicles;
  and develops new products to support zero emission technologies. In addition, the
  company offers heating and cooling systems; syringe pumps; and detection technologies.
  It serves process automation, industrial automation, climate control, life science
  and fluid control, and transportation sectors. The company was formerly known as
  Imperial Metal Industries Limited and changed its name to IMI plc in December 1978.
  IMI plc was founded in 1862 and is headquartered in Birmingham, the United Kingdom.
