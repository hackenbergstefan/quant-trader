longBusinessSummary: 'Iveco Group N.V. engages in the design, production, marketing,
  sale, servicing, and financing of trucks, commercial vehicles, buses, specialty
  vehicles, combustion engines, alternative propulsion systems, transmissions, axles,
  and engines in Europe, South America, North America, and internationally. It operates
  in four segments: Truck, Bus, Powertrain, and Financial Services. The company offers
  light, medium, and heavy vehicles for the transportation and distribution of goods
  under the IVECO brand; and minibuses, city buses, intercity buses, and coaches for
  tour and intercity bus service operators, and transport authorities under the IVECO
  BUS and HEULIEZ brands. It also designs, manufactures, and distributes combustion
  engines, alternative propulsion systems, transmission systems, and axles for on-
  and off-road applications, agricultural and construction equipment, and marine and
  power generation applications under the FPT Industrial brand. In addition, the company
  offers financial products and services to dealers and customers; retail financing
  services to customers for the purchase or lease of new and used vehicles sold by
  brand dealers and distributors; wholesale financing consisting primarily of floor
  plan financing, which allows dealers to purchase and maintain a representative inventory
  of products; and discounts on non-dealer trade receivables. Further, it provides
  ePropulsion products, including eAxles, central drives, and electric drive units;
  energy storage systems, battery packs, and battery management systems; fuel-cell
  electric solutions and hybrid vehicle solutions, such as electric assist systems;
  and fuel cell electric vehicles. Iveco Group N.V. was founded in 1864 and is headquartered
  in Turin, Italy. As of October 26, 2026, Iveco Group N.V. operates as a subsidiary
  of Tata Motors Passenger Vehicles Limited.'
