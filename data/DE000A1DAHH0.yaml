longBusinessSummary: Brenntag SE distributes chemicals and ingredients in Germany,
  the United States, the United Kingdom, China, Canada, Italy, Poland, France, and
  internationally. The company operates in two segments, Brenntag Essentials and Brenntag
  Specialties. It provides just-in-time delivery, product mixing, blending, repackaging,
  inventory management, and drum return handling, as well as application, marketing
  and supply chain solutions, technical and formulation support, comprehensive regulatory
  know-how, and digital solutions, such as digital sales channels and product platforms.
  The company serves customers in various industries, including nutrition, pharma,
  beauty and care, and water treatment; and industrial markets, as well as coatings,
  adhesives, sealants and elastomers, and constructions, polymers, and rubber industries.
  The company was founded in 1874 and is headquartered in Essen, Germany.
