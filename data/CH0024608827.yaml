longBusinessSummary: Partners Group Holding AG is a private equity firm specializing
  in direct, secondary, and primary investments across private equity, private real
  estate, private infrastructure, private credit, private debt, royalties, and special
  opportunities. The firm also makes fund of funds investments. It seeks to invest
  in distressed, special situations, later stage, mature, early venture, mid venture,
  late venture, industry consolidation, buyouts, recapitalizations, emerging growth,
  and seed capital. Partners Group's cross-sector royalties strategy invests across
  several key sectors, including pharmaceuticals, music, broader media & entertainment,
  and energy transition. For direct private equity investments, the firm invests directly
  in Technology, Health & Life, Goods & Products, and Services. For its private real
  estate direct investment practice, it focuses on seeking out properties globally.
  It also makes investments in private real estate secondaries and primaries and focuses
  on distressed assets in United States, Europe, and Japan. Under private debt, the
  firm provides senior debt financing, junior debt lending, broadly syndicated loan,
  mezzanine financing, alongside secondaries and primaries, CLO debt securities and
  equity, and participates in add on acquisitions in in first/second lien. It seeks
  to invest in upper middle markets in Americas, Europe, and Asia. In energy infrastructure,
  the firm seeks to invest in the areas of midstream, power generation, gas transportation,
  gas export infrastructure, renewable energy including wind and solar energy. The
  firm seeks to invest globally with a focus on South Africa, China, India, Philippines,
  Austria, France, Germany, Switzerland, Russia, Brazil, and Chile. It seeks to invest
  between 0.50 million ($0.68 million) and 100 million ($137 million) in equity investment
  in companies with enterprise value between 100 million ($137 million) to 2 billion
  ($2740 million). While investing in funds, it invests in venture capital, mezzanine,
  private equity, real estate, distressed, turnaround, and secondary funds. It typically
  invests between 20 million ($21.17) and 100 million ($105.87) per fund. The firm
  is a value-add investor targeting majority and minority stake in its investee companies.
  Partners Group Holding AG was founded in 1996 and is based in Baar, Switzerland
  with additional offices across North America, South America, Europe, Australia,
  Asia and Abu Dhabi, United Arab Emirates.
