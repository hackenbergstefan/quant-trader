longBusinessSummary: Palo Alto Networks, Inc. provides cybersecurity solutions in
  the Americas, Europe, the Middle East, Africa, the Asia Pacific, and Japan. It offers
  Prisma Access, a secure access service edge solution; Strata Cloud Manager, a network
  security management solution; and Prisma AIRS to protect customers' entire AI ecosystem.
  It provides a comprehensive cloud native application protection platform; and Code
  to Cloud platform, as well as offers VM-Series and CN-Series virtual firewalls for
  inline network security on multi- and hybrid-cloud environments. It provides security
  operation solutions through the Cortex platform that includes Cortex XSIAM, an AI-driven
  security operations platform; Cortex XDR to prevent, detect, and respond to cybersecurity
  attacks; and Cortex XSOAR for security orchestration, automation, and response;
  and Cortex Xpanse for attack surface management, as well as offers threat intelligence
  and advisory services under the Unit 42 name. It provides subscription services
  covering the areas of threat prevention, malware and persistent threat, URL filtering,
  laptop and mobile device protection, DNS security, Internet of Things security,
  SaaS security API, and SaaS security inline; and threat intelligence, data loss
  prevention, services to resolve network disruptions, and sensitive data protection.
  It offers professional services, including architecture design and planning, implementation,
  configuration, and firewall migration; education services, such as certifications,
  as well as online and in-classroom training; and support services. It sells its
  products and services through its channel partners, as well as directly to enterprises,
  service providers, and government entities operating in various industries, including
  education, energy, financial services, government entities, healthcare, Internet
  and media, manufacturing, public sector, and telecommunications. The company was
  incorporated in 2005 and is headquartered in Santa Clara, California.
