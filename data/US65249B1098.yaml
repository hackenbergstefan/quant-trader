longBusinessSummary: 'News Corporation, a media and information services company,
  creates and distributes authoritative and engaging content, and other products and
  services for consumers and businesses in the United States, Canada, Europe, Australasia,
  and internationally. It operates through five segments: Dow Jones, Digital Real
  Estate Services, Book Publishing, News Media, and Other. The company distributes
  news, data, and business information under The Wall Street Journal, Barron''s, MarketWatch,
  Investor''s Business Daily, Dow Jones Risk & Compliance, Dow Jones Energy, Factiva,
  and Dow Jones Newswires brands through various media channels, including websites,
  mobile apps, newspapers, newswires, newsletters, magazines, proprietary databases,
  live journalism, video, and podcasts. It also provides property and property-related
  services on its websites and mobile apps, such as realestate.com.au, realcommercial.com.au,
  Flatmates.com.au, and property portals, as well as residential, commercial, and
  share property websites; mortgage broking offering and property-related data services
  to the financial sector; and Realtor.com, RealPRO Select, Connections Plus, Listing
  Toolkit products, RealChoice Selling, and Realtor.com +. In addition, the company
  publishes and distributes consumer books comprising general fiction, nonfiction,
  and children and religious publishing through print and digital formats under the
  Harper, William Morrow, Mariner, HarperCollins Children''s Books, Avon, Harlequin
  and Christian publishers, Zondervan, and Thomas Nelson; provides news and information
  under the The Australian, The Weekend Australian, The Daily Telegraph and The Sunday
  Telegraph, Herald Sun, Sunday Herald Sun, The Courier Mail, The Sunday Mail, The
  Advertiser, and Sunday Mail names; and operates talkSPORT, a sports radio network.
  News Corporation was founded in 2012 and is headquartered in New York, New York.'
