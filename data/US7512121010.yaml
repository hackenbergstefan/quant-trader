longBusinessSummary: Ralph Lauren Corporation designs, markets, and distributes lifestyle
  products in North America, Europe, Asia, and internationally. The company offers
  apparel, including a range of men's, women's, and children's clothing; footwear
  and accessories, which comprise casual shoes, dress shoes, boots, sneakers, sandals,
  eyewear, watches, fashion and fine jewelry, scarves, hats, gloves, and umbrellas,
  as well as leather goods comprising handbags, luggage, small leather goods, and
  belts; home products, such as bed and bath lines, furniture, fabric and wall coverings,
  lighting, dining, floor coverings, decorative accessories, and giftware; and fragrances.
  The company sells apparel and accessories under the Ralph Lauren Collection, Ralph
  Lauren Purple Label, Polo Ralph Lauren, Double RL, Lauren Ralph Lauren, RLX Ralph
  Lauren, Polo Ralph Lauren Children, and Chaps brands; women's fragrances under the
  Ralph Lauren Collection, Woman by Ralph Lauren, Romance Collection, and Ralph Collection
  brand names; and men's fragrances under the Ralph's Club, Purple Label, Polo Blue,
  Polo Red, Polo Green, Polo Black, Polo 67, Safari, Polo Sport, and Big Pony Men's
  brand names. Its restaurant collection includes The Polo Bar in New York City; RL
  Restaurant in Chicago; Ralph's in Paris; The Bar at Ralph Lauren located in Milan;
  Ralph's Bar located in Chengdu, China; and Ralph's Coffee concept. The company sells
  its products to department stores, specialty stores, and golf and pro shops, as
  well as directly to consumers through its retail stores, concession-based shop-within-shops,
  and its digital commerce sites. It operates retail stores and concession-based shop-within-shops;
  and operates Ralph Lauren stores and shops through licensing partners. Ralph Lauren
  Corporation was founded in 1967 and is based in New York, New York.
