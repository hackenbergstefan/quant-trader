longBusinessSummary: AXA SA, through its subsidiaries, provides insurance, asset management,
  and banking services worldwide. The company operates through France, Europe, AXA
  XL, Asia, Africa & EME-LATAM, and Transversal & Other segments. It offers life and
  savings insurance and property and casualty insurance products. The company also
  provides protection and retirement products for individual and professional customers;
  reinsurance coverages; property, primary and excess casualty, excess and surplus
  lines, environmental liability, professional liability, construction, marine, energy,
  aviation and satellite, fine art and specie, livestock and aquaculture, accident
  and health, and crisis management. In addition, it offers reinsurance solutions
  with casualty, property risk, property catastrophe, specialty, and other reinsurance;
  proportional and non-proportional, and facultative reinsurance; risk management
  solutions and consulting services; integrated ecosystem between healthcare solutions
  and the insurance coverage, which includes onsite services in clinics, remote teleconsultation
  and digital services, and home services; travel insurance and assistance services,
  as well as AXA Multilink platform, a B2B2C platform; Sophia, the customer facing
  GenAI chatbot; and EMMA, a digital assistant. Further, the company offers motor,
  household, property and general liability, banking, savings, health, term life,
  whole life, universal life, endowment, deferred and immediate annuities, and other
  investment-based products for retail/individual and commercial/group customers.
  AXA SA was founded in 1852 and is headquartered in Paris, France.
