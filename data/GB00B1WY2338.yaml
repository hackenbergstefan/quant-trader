longBusinessSummary: Smiths Group plc operates as an industrial engineering company
  in Americas, Europe, the Asia Pacific, and internationally. The company operates
  through two segments, John Crane and Flex-Tek. Its John Crane business offers mechanical
  seals, seal support systems, power transmission couplings, and specialized filtration
  systems. The Flex-Tek business offers engineered components, flexible hosing, and
  rigid tubing that heat and move fluids and gases. It serves energy, process industries,
  aerospace, construction, and other markets. The company was formerly known as Smiths
  Industries and changed its name to Smiths Group plc in 2000. Smiths Group plc was
  founded in 1851 and is headquartered in London, the United Kingdom.
