longBusinessSummary: Iberdrola, S.A. engages in the generation, production, transmission,
  distribution, and supply of electricity in Spain, the United Kingdom, the United
  States, Mexico, Brazil, Germany, France, and Australia. It generates electricity
  from renewable sources, such as onshore and offshore wind, photovoltaic, hydro,
  other energy sources, conventional nuclear, and combined cycle plants, as well as
  through batteries. The company is involved in the purchase and sale of electricity
  and gas on wholesale markets; energy retail supply activities, such as gas and electricity,
  and other products and services, including hydrogen, as well as non-renewable generation;
  and production of green hydrogen. It has a total installed capacity of 46,177 MW.
  In addition, the company offers heat pumps, self-consumption, solar, electric mobility,
  solar, etc. services to residential customers; and management of energy facilities,
  as well as supplies green H2, industrial heat, etc. to industrial customers. Iberdrola,
  S.A. was founded in 1840 and is headquartered in Bilbao, Spain.
