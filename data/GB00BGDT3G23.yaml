longBusinessSummary: Rightmove plc, together with its subsidiaries, operates property
  portal in the United Kingdom and internationally. The company operates through Agency,
  New Homes, and Other segments. The Agency segment provides resale and lettings property
  advertising services, and rental operators advertising and rental services on its
  platforms. This segment also offers tenant referencing and rent guarantee insurance
  services to lettings agents and landlords. The New Homes segment provides property
  advertising services to new home developers and housing associations on its platforms.
  The Other segment offers commercial and overseas property advertising services;
  non-property advertising services that include third party advertising and data
  services; and mortgage services. The company serves property professionals, such
  as residential and commercial estate/letting agents, residential developers and
  operators, surveyors, lenders, mortgage lenders/brokers, home services providers,
  and other professionals. Rightmove plc was founded in 2000 and is based in Milton
  Keynes, the United Kingdom.
