longBusinessSummary: Martin Marietta Materials, Inc., a natural resource-based building
  materials company, supplies aggregates and heavy-side building materials to the
  construction industry in the United States and internationally. It operates through
  East Group and West Group segments. The company offers crushed stone, sand, and
  gravel products; ready mixed concrete and asphalt; and paving products and services
  for use in the infrastructure projects, and nonresidential and residential construction
  projects, as well as in the railroad, agricultural, utility, and environmental industries.
  It also produces magnesia-based chemicals products, and dolomitic lime primarily
  to customers for steel production and soil stabilization. Its chemical products
  are used in flame retardants, wastewater treatment, pulp and paper production, and
  other applications. The company was founded in 1939 and is based in Raleigh, North
  Carolina.
