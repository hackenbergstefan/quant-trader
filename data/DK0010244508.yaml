longBusinessSummary: A.P. Møller - Mærsk A/S, together with its subsidiaries, operates
  as an integrated logistics company in Denmark and internationally. The company operates
  through Ocean, Logistics & Services, and Terminals segments. The company offers
  ocean, inland, less-than-container load, and air and ground freight solutions; warehousing,
  distribution, and depot services; cold chain solutions, cold chain management, pharmaceutical
  cold chain management, and cold storage solutions; and customs clearance, e-commerce
  logistics, and lead logistics services. It also provides ocean transport, specialized
  airlift, and vessel chartering services; project planning, orchestration, and site
  support; specialized cargo handling, cargo storage, and survey services. In addition,
  the company offers value-added services, such as labelling, relabeling, tagging
  or retagging, kitting and product customization, garments on hangers, re-packing,
  quality controls, reporting, shaving/topping off pallets, reverse logistics, and
  goods disposal services. It serves FMCG, fashion and lifestyle, retail, chemicals,
  automotive, technology, pharma and healthcare, and perishables industries. The company
  was founded in 1904 and is based in Copenhagen, Denmark.
