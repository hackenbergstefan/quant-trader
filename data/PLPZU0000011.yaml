longBusinessSummary: Powszechny Zaklad Ubezpieczen SA provides life and non-life insurance
  products and services in Poland, the Baltic States, and Ukraine. It operates through
  Corporate Insurance; Mass Insurance; Group Insurance and Individually Continued
  Insurance; Individual Insurance; Life Investment Insurance; Investments; Banking;
  Pension Insurance; Baltic Countries; Ukraine; and Investment Contracts segments.
  The company offers motor, property, casualty, agricultural, fire, and third-party
  liability insurance, as well as health and accident insurance. It also provides
  banking, asset management, brokerage, investment and transaction advisory, finance
  leasing, and factoring; and transfer agent, call center, business consulting, IT,
  venture capital fund management, medical, training, assistance, data center, printing,
  human resources and payroll, and financial and accounting services, as well as manages
  pension and mutual funds. In addition, the company is involved in buying, operating,
  leasing, and selling real estate; property management; rental of office and commercial
  space; investment activities; and investment of free funds and development activity
  in the construction of commercial real estate. Further, it engages in the manufacture
  and sale of bathroom and kitchen taps, aluminum central heating radiators, shower
  cabins, valves, and screens; and auxiliary activities associated with insurance
  and pension funds. Powszechny Zaklad Ubezpieczen SA was founded in 1803 and is headquartered
  in Warsaw, Poland.
