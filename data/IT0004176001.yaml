longBusinessSummary: 'Prysmian S.p.A., together with its subsidiaries, produces, distributes,
  and sells power and telecom cables and systems, and related accessories under the
  Prysmian, Draka, and General Cable brands worldwide. It operates through four segments:
  Transmission, Power Grid, Electrification, and Digital Solutions. The company offers
  high voltage direct current (HVDC), network component high voltage, submarine power,
  submarine telecom, offshore specialties, and EOSS high voltage units. It also provides
  power distribution, overhead lines, high voltage alternate current (HVAC), network
  component medium voltage/low voltage, EOSS medium voltage/low voltage units. In
  addition, it offers electrification products; and fiber optics, optical cables,
  connectivity components and accessories, optical ground wire cables, and copper
  cables. Further, it manufactures and sells thermoplastic and metal enclosures. Prysmian
  S.p.A. was founded in 1879 and is headquartered in Milan, Italy.'
