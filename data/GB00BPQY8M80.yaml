longBusinessSummary: Aviva plc provides various insurance, retirement, and wealth
  products in the United Kingdom, Ireland, Canada, India, and China. It operates through
  General Insurance; Insurance, Wealth & Retirement; Aviva Investors; and International
  Investments segments. The company offers gadget, home, motor, pet, and health insurance,
  as well as commercial, specialty insurance and protection. It also provides life
  insurance, long-term health and accident insurance, savings, pension, and annuity
  products, as well as pension fund and lifetime mortgage products; insurance cover
  to individuals, small and medium-sized businesses for risks associated with motor
  vehicles and medical expenses, as well as property and liability, such as employers'
  and professional indemnity liabilities; and personal and commercial lines insurance
  products for risks associated motor, property, and liability. In addition, the company
  offers investment management services for institutional pension fund mandates; and
  manages various retail investment products, including fixed income, equities, multi-asset,
  real estate and infrastructure for third-party financial institutions, pension funds,
  public sector organizations, investment professionals, and private investors. It
  markets its products through a network of insurance brokers, affinity partners,
  and banks, as well as MyAviva platform price comparison websites. The company was
  formerly known as CGNU plc and changed its name to Aviva plc in July 2002. Aviva
  plc was founded in 1696 and is headquartered in London, the United Kingdom.
