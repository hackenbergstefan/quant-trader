longBusinessSummary: 'Take-Two Interactive Software, Inc. develops, publishes, and
  markets interactive entertainment solutions for consumers worldwide. The company
  develops and publishes action/adventure products under the Grand Theft Auto, LA
  Noire, Max Payne, Midnight Club, and Red Dead Redemption names, as well as other
  franchises. It also publishes various entertainment properties across various platforms
  and a range of genres, such as shooter, action, role-playing, strategy, sports,
  and family/casual entertainment under the BioShock, Mafia, Sid Meier''s Civilization,
  XCOM series, Borderlands, and Tiny Tina''s Wonderland names. In addition, the company
  publishes sports simulation titles comprising NBA 2K series, a basketball video
  game; the WWE 2K professional wrestling series; mobile titles, including WWE SuperCard;
  and PGA TOUR 2K. Further, it offers free-to-play mobile games, such as CSR Racing,
  Dragon City, Empires & Puzzles, FarmVille 3, Game of Thrones: Legends, Golf Rival,
  Harry Potter: Puzzles & Spells, Hit It Rich!, Match Factory!, Merge Dragons!, Merge
  Magic!, Monster Legends, NBA 2K, Toon Blast, Top Eleven, Wizard Of Oz Slots Casino,
  Toy Blast, Words With Friends, and Zynga Poker; and Color Block Jam. The company''s
  products are designed for console gaming systems; and mobiles, such as smartphones,
  tablets, and personal computers. It provides its products through physical retail,
  digital download, online platforms, and cloud streaming services. Take-Two Interactive
  Software, Inc. was incorporated in 1993 and is based in New York, New York.'
