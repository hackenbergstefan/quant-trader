longBusinessSummary: Thales S.A. provides various solutions in the defence and security,
  aerospace and space, and digital identity and security markets worldwide. The company
  offers advance air defence systems, combat systems, defence onboard electronics
  c4isr solutions, command and control solutions, mission and surveillance systems,
  airborne optronics, and airspace protection solutions; collaborative combat, intelligence,
  connectivity and cloud, country and force protection, military vehicle, collaborative
  artillery, and augmented soldier solutions; robotics and drones; above-water combat,
  unmanned maritime, and underwater warfare systems; naval support and services; and
  joint systems. It also provides mission-critical and radio communications; cyber
  defence and electronic warfare solutions; protection systems; unmanned aerial vehicle
  systems; digital transformation services; and Geonav IoT for real-time indoor/outdoor
  precise navigations. In addition, it offers digital identity and security solutions
  comprising banking and payment, data protection, digital identity, identity and
  access management, biometric, mobile, software monetization, secure IoT solutions,
  and IoT connecting and security solutions. Further, it provides air traffic management
  solutions; flight decks and avionics equipment and functions; in-flight entertainment,
  connectivity, and services; drone and navigation solutions; support and services
  for civil aviation; connectivity solutions; antennas; and solutions for internal
  and external aircraft lighting. It offers lasers; microwave and imaging sub-systems;
  microelectronic solutions; mobile satellite, environmental testing and evaluation
  laboratory, and training and simulation services; cryogenic technology and coolers;
  silicon security solutions; and designs, operates, and delivers satellite-based
  technologies. The company was formerly known as Thomson-CSF and changed its name
  to Thales S.A. in 2000. Thales S.A. was founded in 1893 and is based in Meudon,
  France.
