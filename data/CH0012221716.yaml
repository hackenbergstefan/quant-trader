longBusinessSummary: ABB Ltd provides electrification, motion, and automation solutions
  and products for customers in utilities, industry and transport, and infrastructure
  in Europe, the Americas, Asia, the Middle East, and Africa. The company operates
  through Electrification, Motion, and Automation segments. Its Electrification segment
  offers renewable power solutions, modular substation packages, distribution automation
  products, switchboards and panelboards, switchgears, UPS solutions, circuit breakers,
  measuring and sensing devices, control products, wiring accessories, enclosures
  and cabling systems, and intelligent home and building solutions. The company's
  Motion segment designs, manufactures, and sells drives, motors, generators, and
  traction converters that are driving the low-carbon future for industries, cities,
  infrastructure, and transportation. The company's Automation segment offers industry-specific,
  integrated automation, electrification and digital solutions, as well as lifecycle
  services for the process, hybrid and marine industries. This segment also provides
  control technologies; process, machine and factory automation; industrial software;
  advanced analytics; sensing and measurement technology; and marine propulsion systems;
  services such as remote monitoring, preventive maintenance, asset performance management,
  emission monitoring and cybersecurity. It serves oil, gas, renewables, chemicals,
  mining, metals, cement, pulp and paper, pharmaceuticals, battery manufacturing,
  food and beverage, space, power generation, water, marine, and ports industries.
  The company was founded in 1883 and is headquartered in Zurich, Switzerland.
