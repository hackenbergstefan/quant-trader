longBusinessSummary: Public Power Corporation S.A., together with its subsidiaries,
  generates, transmits, and distributes electricity in Greece, Romania, Bulgaria,
  and North Macedonia. It generates electricity from fossil fuel or other energy sources,
  including wind, solar, and hydroelectric energy, as well as thermal, biomass, and
  photovoltaic powerplants. The company is involved in owning power generating stations;
  provision of infrastructure and charging, as well as wholesale telecommunication
  services; develops an urban fiber optic network on the distribution network; natural
  gas trading; and supply and trading of electricity. In addition, it retails and
  wholesale trade of electrical and electronic goods, and technology products; and
  provides repairs, maintenance, and delivery of devices. The company serves individuals,
  businesses, and public bodies. The company was founded in 1950 and is headquartered
  in Athens, Greece.
