longBusinessSummary: Hilton Worldwide Holdings Inc., a hospitality company, engages
  in managing, franchising, and leasing hotels and resorts. It operates in two segments,
  Management and Franchise, and Ownership. The company engages in the hotel management
  and licensing of its brand names, trademarks, and service marks. It operates a brand
  portfolio of luxury, lifestyle, full service, focused service, all-suites hotel,
  and timeshare under the Waldorf Astoria Hotels & Resorts, LXR Hotels & Resorts,
  Conrad Hotels & Resorts, Signia by Hilton, NoMad, Canopy by Hilton, Graduate by
  Hilton, Tempo by Hilton, Motto by Hilton, Hilton Hotels & Resorts, DoubleTree by
  Hilton, Curio Collection by Hilton, Tapestry Collection by Hilton, Outset Collection
  by Hilton, Embassy Suites by Hilton, Homewood Suites by Hilton, Home2 Suites by
  Hilton, LivSmart Studios by Hilton, Hilton Garden Inn, Hampton by Hilton, Tru by
  Hilton, Spark by Hilton, Hilton Grand Vacations, Small Luxury Hotels of the World,
  AutoCamp, and Hilton Honors brand names. The company has operations in North America,
  South America, and Central America, including various Caribbean nations; Europe,
  the Middle East, and Africa; and the Asia Pacific. Hilton Worldwide Holdings Inc.
  was founded in 1919 and is headquartered in McLean, Virginia.
