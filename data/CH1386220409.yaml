longBusinessSummary: 'Sunrise Communications AG, together with its subsidiaries, provides
  telecommunications services in Switzerland. It operates in three segments: Residential
  Customers; Business Customers and Wholesale; and Infrastructure and Support Functions.
  The company offers mobile services comprising prepaid and postpaid voice, SMS and
  data, and international calling and roaming services; broadband, TV, and fixed-line
  telephony services; and device-as-a-service, as well as sells third-party mobile
  phones, tablets, and other hardware and accessories. It also operates the MySports,
  which broadcasts Swiss National League ice-hockey games and North American National
  Hockey League games; and The Sunrise TV Shop, which consolidates streaming subscriptions.
  In addition, the company offers Sunrise Pay, a payment method involving paying through
  the phone bill or deducting payment from the prepaid balance; Sunrise Protect, a
  comprehensive security solution; Identity Protect, which safeguards personal and
  sensitive information; Device Protect, which combines antivirus protection and parental
  controls to a secure environment for browsing, banking, and online shopping; Sunrise
  Moments, a customer loyalty programme that gives access to pre-sales, fast-lane
  entry, and discounted tickets; travel and cyber insurance; home security products;
  property management; carrier and internet protocol television; and mobile private
  networks, mobile Internet of Things, and cloud services. Further, it provides infrastructure
  and support activities comprising network, IT, and customer care operations services.
  The company serves mobile and fixed virtual network operators, and branded resellers
  through its website, mobile applications, call centres, sales representatives, retail
  locations, and third-party distributors and partners. It sells its products under
  the Sunrise, yallo, CHmobile, swype, and Lebara brands. Sunrise Communications AG
  was founded in 1996 and is headquartered in Opfikon, Switzerland.'
