longBusinessSummary: Costco Wholesale Corporation, together with its subsidiaries,
  engages in the operation of membership warehouses in the United States, Puerto Rico,
  Canada, Mexico, Japan, the United Kingdom, Korea, Australia, Taiwan, China, Spain,
  France, Sweden, Iceland, and New Zealand. It offers merchandise, including sundries,
  dry groceries, candies, coolers, freezers, liquor, and tobacco; non-food merchandise
  comprising consumer electronics, appliances, small electrics, health and beauty
  aids, hardware, lawn and garden, sporting goods, tires, toys and seasonal, automotive,
  stamps, tickets, apparel, furniture, domestics, housewares, special order kiosks,
  and jewelry; and fresh food, such as meat, produce, deli, and bakery products. The
  company is also involved in warehouse ancillary operations, which include gasoline,
  pharmacies, food courts, optical, hearing aids, and tire installation centers. In
  addition, it engages in e-commerce, business centers, travel, and other businesses.
  Further, the company operates e-commerce sites; and offers branded and private-label
  products in various categories. The company was formerly known as Costco Companies,
  Inc. and changed its name to Costco Wholesale Corporation in August 1999. Costco
  Wholesale Corporation was founded in 1976 and is based in Issaquah, Washington.
