longBusinessSummary: 'PPG Industries, Inc. manufactures and distributes paints, coatings,
  and specialty materials in the United States, Canada, the Asia Pacific, Latin America,
  Europe, the Middle East, and Africa. It operates through three segments: Global
  Architectural Coatings, Performance Coatings, and Industrial Coatings. The Global
  Architectural Coatings segment supplies a variety of decorative coatings, adhesives,
  sealants, and finishes, as well as paint strippers, stains, and related chemicals.
  Its Performance Coatings segment offers aerospace coatings, automotive refinishing
  coatings, protective and marine coatings, and traffic solutions comprising paints,
  thermoplastics, raised pavement markers, and other technologies for pavement marking.
  The Industrial Coatings segment provides automotive OEM coatings, industrial coatings,
  and packaging coatings, as well as specialty products, such as optical monomers
  and coatings, low-friction coatings, and other specialty products. The company delivers
  its products to company-owned stores, home centers and other consumer retail outlets,
  paint dealers, concessionaires and independent distributors, company-owned distribution
  networks, and directly to manufacturing companies and retail customers. PPG Industries,
  Inc. was incorporated in 1883 and is headquartered in Pittsburgh, Pennsylvania.'
