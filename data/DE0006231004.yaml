longBusinessSummary: Infineon Technologies AG develops, manufactures, and markets
  semiconductors and semiconductor-based solutions in Germany, Europe, the Middle
  East, Africa, Mainland China, Hong Kong, Taiwan, the Asia-Pacific, Japan, the United
  States, and the Americas. The Automotive segment offers automotive and industrial
  microcontrollers; analog and memory ICs; ethernet; power diodes and modules; power
  switches; sensors; transceivers; and voltage regulators for assistance and safety
  systems, comfort electronics, infotainment, powertrain, and security applications.
  Its Green Industrial Power segment provides discrete and bare die IGBTs; IGBT modules;
  and SiC discretes and modules for air conditioning technology, energy generation
  and storage, energy transmission, home appliances, industrial drives, industrial
  power supplies and vehicles, and traction applications. The Power & Sensor Systems
  segment offers 3D ToF sensors; chips for gas and pressure sensors, and MEMS microphones;
  control ICs; customized chips; discrete low-, mid-, and high-voltage power MOSFETs;
  ESD protection diodes; GaN power switches; GPS low-noise amplifiers; low- and high-voltage
  driver ICs; radar sensor ICs; RF antenna switches and power transistors; SiC diode
  and MOSFETs; and USB controllers for audio amplifiers, automotive electronics, BLDC
  motors, cellular communications infrastructure, charging stations for electric vehicles,
  human machine interaction, IoT, LED and conventional lighting systems, microinverters,
  mobile devices, power management, and harsh environment applications. Its Connected
  Secure Systems segment provides connectivity solutions, embedded security controllers,
  microcontrollers, and security controllers for authentication, automotive, consumer
  electronics, government identification document, IoT, mobile communication, payment
  system, ticketing, access control, and trusted computing applications. The company
  was founded in 1952 and is headquartered in Neubiberg, Germany.
