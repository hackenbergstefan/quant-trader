longBusinessSummary: T-Mobile US, Inc., together with its subsidiaries, provides wireless
  communications services in the United States, Puerto Rico, and the United States
  Virgin Islands. The company offers voice, messaging, and data services to postpaid,
  prepaid, and wholesale and other services customers. It also provides wireless devices,
  including smartphones, wearables, tablets, home broadband gateways, headsets, and
  other mobile communication devices, as well as accessories; financing through equipment
  installment plans; reinsurance for device insurance policies and extended warranty
  contracts. The company offers services under the T-Mobile, Metro by T-Mobile, and
  Mint Mobile brands through its owned and operated retail stores, customer care channels,
  national retailers, and its websites, as well as through T-Mobile, Metro by T-Mobile,
  and Mint Mobile apps. It also sells devices to dealers and other third-party distributors
  for resale through independent third-party retail outlets and various third-party
  websites. It has 700 MHz wireless spectrum licenses. The company was founded in
  1994 and is headquartered in Bellevue, Washington. T-Mobile US, Inc. operates as
  a subsidiary of Deutsche Telekom AG.
