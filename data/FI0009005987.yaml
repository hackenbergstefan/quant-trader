longBusinessSummary: UPM-Kymmene Oyj, together with its subsidiaries, engages in the
  forest-based bioindustry worldwide. The company offers softwood, birch, and eucalyptus
  pulp for tissue, specialty papers, packaging papers, graphic papers, and board;
  sawn timber for joinery, packaging, furniture, planning, and construction industries;
  and wood-based renewable diesel and renewable naphtha for transport and petrochemical
  industry. It also generates electricity through hydro, thermal, and nuclear power
  plants; provides financial portfolio management services, as well as engages in
  forestry water protection. Further, it provides wood and wood-based biomass, and
  forestry services for forest investors and owners; biomedical products, such as
  nano-fibrillar cellulose for clinical and life science applications; wood-based
  lignin products for industrial use; and wood-based biochemicals for replacing fossil-based
  raw materials. It also manufactures plywood and veneer products. It serves distributors,
  industrial users, publishers, cataloguers, retailers, printing houses, merchants,
  converters, and label stock manufacturers; label printers; brand owners; and producers
  of tissue, board, specialty, and graphic paper. The company was founded in 1871
  and is headquartered in Helsinki, Finland.
