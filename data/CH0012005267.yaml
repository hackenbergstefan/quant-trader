longBusinessSummary: Novartis AG researches, develops, manufactures, distributes,
  markets, and sells pharmaceutical medicines in Switzerland and internationally.
  The company offers Entresto, an angiotensin receptorneprilysin inhibitor to treat
  symptomatic chronic heart failure; Cosentyx to treat plaque psoriasis, pso riatic
  arthritis, ankylosing spondylitis, and nonradiographic axial spondy loarthritis;
  Kisqali, a selective oral cyclin dependent inhibitor of kinases 4 and 6; Promacta/Revolade
  for immune thrombocytopenia (ITP), thrombocytopenia, and aplastic anemia patients;
  Tafinlar+Mekinist, an oral combination therapy to treat cancer patients; and Jakavi
  for treating myelofibrosis, polycythemia vera, and acute or chronic graftversushost
  disease. It also provides Tasigna to treat philadelphia chromosomepositive chronic
  myeloid leukemia in chronic and/or accelerated phase; Xolair for treating allergic
  asthma and nasal polyps or severe chronic rhinosi nusitis with nasal polyps; Ilaris
  to treat fever syndromes, Stills disease, and acute gouty arthritis; Pluvicto to
  treat prostatespecific membrane anti genpositive metastatic castrationresistant
  prostate cancer; Sandostatin SC and Sandostatin LAR to treat acromegaly carcinoid
  tumors and functional gastro intestinal and pancreatic neuroendocrine tumors; Zolgensma
  to treat genetic root cause of spinal muscular atrophy; Lucentis; Leqvio to reduce
  LDL cholesterol; Lutathera; Scemblix; and Fabhalta. The company focuses on therapeutic
  areas, such as cardiovascular, renal and metabolic, immunology, neuroscience, oncology,
  and hematology. It has a license and collaboration agreement with Alnylam Pharmaceuticals,
  Inc. to develop, manufacture, and commercialize Leqvio (inclisiran) to reduce LDL
  cholesterol. Novartis AG has a strategic alliance with CAS for enhancing reaction
  data accessibility and supporting AI-enabled research. Novartis AG was incorporated
  in 1996 and is headquartered in Basel, Switzerland.
