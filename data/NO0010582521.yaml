longBusinessSummary: 'Gjensidige Forsikring ASA, together with its subsidiaries, provides
  general insurance and pension products in Norway, Sweden, Denmark, Finland, Latvia,
  Lithuania, and Estonia. It operates in four segments: General Insurance Private,
  General Insurance Commercial, General Insurance Sweden, and Pension. The company
  offers motor, property, travel, accident and health, general liability, natural
  perils, agriculture, medical treatment and expense, disability, income protection,
  workers'' compensation, motor vehicle liability, marine, aviation, transport, fire
  and other damage to property, assistance, other non-life, and life insurance products,
  as well as non-proportional non-life reinsurance products. It also provides defined
  contribution occupational pension schemes for businesses, including disability pension,
  spouse/cohabitant pension, and child''s pension; and individual pension savings
  agreements. The company sells its products to private individuals, commercial and
  agricultural customers, and private and commercial markets through various distribution
  channels comprising customer service centres, office channel, call center, Internet,
  partners, agents, and external brokers. Gjensidige Forsikring ASA was founded in
  1816 and is headquartered in Oslo, Norway.'
