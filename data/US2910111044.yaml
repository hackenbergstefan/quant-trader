longBusinessSummary: 'Emerson Electric Co., an automation company, provides various
  solutions in the Americas, Asia, the Middle East, Africa, and Europe. It operates
  through five segments: Control Systems & Software; Test & Measurement; Sensors;
  Final Control; and Safety & Productivity. The Control Systems & Software segment
  provides automation systems, intelligent software, and industrial AI solutions for
  industrial organizations under the DeltaV and Ovation brands, as well as Aspentech''s
  asset optimization software; and programmable automation controllers. The Test &
  Measurement segment offers intelligent test platforms, modular hardware, and software
  which enables customers to connect data and automation, optimize testing processes,
  and assist in reliable performance. The Sensors segment delivers sensing and measurement
  solutions that provide real-time data to monitor critical parameters, optimize operations,
  and support performance. This segment''s portfolio includes secure, wireless, and
  non-intrusive instrumentation to detect, analyze and respond to changing conditions
  in even the harshest environments. The Final Control segment offers control, isolation
  and pressure relief valves, solenoid and pneumatic valves, valve position indicators,
  cylinders, air preparation equipment, and electric linear motion, as well as engages
  in the fluid and motion control business. The Safety & Productivity segment offers
  mechanical, electrical and diagnostic solutions to professionals that support infrastructure,
  promote safety, and enhance productivity across construction, maintenance, and industrial
  environments; and electrical equipment and materials. The company was incorporated
  in 1890 and is headquartered in Saint Louis, Missouri.'
