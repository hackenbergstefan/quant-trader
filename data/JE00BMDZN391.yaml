longBusinessSummary: TP ICAP Group PLC provides intermediary services, contextual
  insights, trade execution, pre-trade and settlement services, and data-led solutions
  in Europe, the Middle East, Africa, the Americas, and the Asia Pacific. It operates
  through Global Broking, Energy & Commodities, Liquidnet, and Parameta Solutions
  divisions. The Global Broking division operates in rates, foreign exchange (FX)
  and money markets, equities, and credit products; and offers broking, facilitating
  price discovery, and liquidity services. The Energy & Commodities division operates
  in various commodities markets, including oil, gas, power, renewables, ferrous metals,
  base metals, precious metals, soft commodities, and digital assets. This division
  also assists in canvassing the market for expressions of interest, intelligence
  gathering, negotiations, and post-transaction processing; and provides insights
  on the impact of unpredictable factors, such as weather conditions, geopolitics,
  and exchange rate movements. The Liquidnet division operates Liquidnet, a cash equities
  dark/block electronic trading network; and Coex Partners, a trade advisory and agency
  execution service that covers listed derivatives, FX, government bonds, cleared
  interest rate swaps, and cash equities. This division serves hedge funds, asset
  managers, and asset owners. The Parameta Solutions division provides unbiased data
  products that facilitate trading, enhance transparency, reduce risk, and enhance
  operational efficiency; and pricing, reference data, and analytical tools. This
  division also offers real-time price information for the OTC financial and commodity
  markets delivering independent data for various asset classes, including rates,
  FX and money markets, volatility, oil, energy, inflation, credit, and equities.
  The company is based in Saint Helier, Jersey.
