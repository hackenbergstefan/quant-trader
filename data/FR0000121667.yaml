longBusinessSummary: EssilorLuxottica Société anonyme designs, manufactures, and distributes
  ophthalmic lenses, frames, sunglasses, and instruments and equipment in North America,
  the Middle East, Africa, Europe, Latin America, and the Asia-Pacific. It offers
  lens, eyewear, contact lenses, reading glasses under Essilor, Varilux, Crizal, Eyezen,
  Stellest, Xperio, Transitions, Ray-Ban, Oakley, Barberini, KODAK Lens, Nikon, Shamir
  Optical, eyexpert, iWear, Humanware, Optifog, Persol, Oliver Peoples, Vogue Eyewear,
  Arnette, Alain Mikli, Costa, Bliz, Native Eyewear and Bolon, and Foster Grant brands.
  The company also provides vision assessment, eye pathology diagnosis and treatment,
  finishing equipment, fitting parameter measurement, small tools, and consumables.
  In addition, it offers SPECTRALIS, a multimodal imaging platform for diagnosis and
  treatment; RetinAI; Espansione Group; Cellview Imaging; ANTERION, a multidisciplinary
  all-in-one anterior segment imaging solution for measurements; apparel, footwear
  and accessories; and high-tech equipment for optical surfacing, polishing, measuring,
  coating, and finishing, as well as consumables, tools, and services under the Satisloh
  brand. Further, the company designs, develops, markets, and maintains diagnostics,
  refraction, lens edging and mounting instruments for opticians and prescription
  laboratories, and measurement; and optometry instruments for eyecare professionals,
  schools, occupational medicine centers, military, and other institutions. It sells
  its products to independent opticians, distributors, third-party e-commerce platforms,
  and large retail chains in the eyecare and eyewear industry; and consumers through
  the network of brick and mortar retail networks and its online channels. The company
  was formerly known as Essilor International Société Anonyme and changed its name
  to EssilorLuxottica Société anonyme in October 2018. EssilorLuxottica Société anonyme
  was founded in 1849 and is headquartered in Paris, France.
