longBusinessSummary: Swiss Re AG, together with its subsidiaries, provides reinsurance,
  insurance, other insurance-based forms of risk transfer, and other insurance-related
  services worldwide. The company operates through Property & Casualty Reinsurance,
  Life & Health Reinsurance, and Corporate Solutions segments. The Property & Casualty
  Reinsurance segment underwrites property reinsurance, including property, credit,
  surety and political, engineering and project, aviation, marine, agriculture, renewable
  energy, retakaful, and facultative reinsurance solutions; and casualty reinsurance,
  such as liability, motor, worker's compensation, personal accident, management and
  professional liability, cyber, and facultative reinsurance solutions. Its Life &
  Health Reinsurance segment underwrites life and health insurance products. The Corporate
  Solutions segment offers standard risk transfer covers and multi-line programs to
  customized solutions. It serves stock and mutual insurance companies, public sector
  and governmental entities, mid-sized and large corporations, and individuals. The
  company was founded in 1863 and is headquartered in Zurich, Switzerland.
