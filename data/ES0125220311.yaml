longBusinessSummary: Acciona, S.A., together with its subsidiaries, provides energy
  and infrastructure solutions in Spain and internationally. It develops, constructs,
  operates, and maintains wind, solar photovoltaic, hydropower, thermal solar, and
  biomass plants, as well as offers energy storage, renewable energy supply, energy
  efficiency, self-consumption, green hydrogen, and electric mobility solutions; and
  designs, develops, manufactures, and distributes wind turbines. The company also
  engages in the construction and development of civil engineering infrastructure
  projects, including roads, highways and motorways, bridges, tunnels, railways and
  railway services, and metros and trams, as well as ports and water channels, airports
  and airport services, freight forwarding, data center, and substation and transmission
  lines; water solutions, such as waste water treatment and reuse, desalination, drinking
  water, integral water cycle, and water for agriculture; and social services for
  healthcare, university campuses, and ecosystem restoration. In addition, it is involved
  in the provision of sustainable cities solutions comprising efficient building,
  circular economy, urban ecosystems, museums and universal exhibitions, immersive
  experiences, and event design and management; development of housing projects, hotels
  and holiday resorts, fit outs, offices, and industrial properties; and fund management
  and stock brokerage. The company was incorporated in 1916 and is headquartered in
  Madrid, Spain.
