longBusinessSummary: Kerry Group plc, together with its subsidiaries, provides taste
  and nutrition solutions. The company offers taste solutions, such as dairy and dairy-free
  flavours, savoury flavours and extracts, smoke and grill, sweet flavours and extracts,
  and taste modulations. It also provides nutrition solutions, including enzymes,
  proteins, nutritional lipids and bases, soluble dietary fibre, wellness and health,
  and dairy ingredients. In addition, the company offers functional ingredients, food
  solutions, and beverage solutions. Further, it provides pharmaceutical excipients,
  tablet film coatings, pharma lactose, cell culture supplements, fermentation, and
  acetates solutions. Additionally, the company offers emulsifier ingredients for
  bakery; food protection and preservation solutions; food reformulation solutions;
  bakery freshness solutions; texturant solutions; and foodservice solutions that
  include convenience retail and custom solutions under DaVinci Gourmet, Golden Dipt,
  Big Train, and Island Oasis brands. The company also engages in the investment and
  trading activities, as well as provides services. It serves food, beverage, supplement,
  pharma and life science, and pet markets. The company operates in Europe, the Americas,
  the Asia Pacific, the Middle East, and Africa. It provides its products through
  retail and foodservice channels. Kerry Group plc was founded in 1972 and is headquartered
  in Tralee, Ireland.
