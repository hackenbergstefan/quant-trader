longBusinessSummary: Interactive Brokers Group, Inc. operates as an automated electronic
  broker in the United States and internationally. The company engages in the execution,
  clearance, and settlement of trades in stocks, options, futures, foreign exchange
  instruments, bonds, precious metals, and cryptocurrencies; and the company provides
  custody, prime brokerage, securities, and margin lending services. It also offers
  custody and service accounts for hedge and mutual funds, ETFs, registered investment
  advisors, proprietary trading groups, introducing brokers, and individual investors.
  In addition, the company provides trading platforms, including IBKR Trader Workstation,
  IBKR Desktop, IBKR Mobile, and IBKR Client Portal platform, as well as IBKR GlobalTrader
  mobile application, and IBKR APIs, builds custom trading applications and automates
  any part of the trading process. Further, it offers IBKR Pro, IBKR Lite, IBKR Universal
  Account, insured bank deposit sweep program, investors' marketplace, mutual fund
  marketplace, bond marketplace, forecast and event contracts, fractional trading,
  no transaction fee program for exchange-traded funds, overnight trading hours, and
  karta visa infinite charge card. It serves institutional and individual customers
  through electronic exchanges and market centers. Interactive Brokers Group, Inc.
  was founded in 1977 and is headquartered in Greenwich, Connecticut.
