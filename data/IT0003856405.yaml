longBusinessSummary: "Leonardo S.p.a., an industrial and technological company, engages\
  \ in the helicopters, defense electronics and security, cyber security and solutions,\
  \ aircraft, aerostructures, and space sectors in Italy, the United Kingdom, rest\
  \ of Europe, the United States of America, and internationally. It offers a range\
  \ of helicopters for battlefield/personnel recovery, combat, maritime, training,\
  \ VIP/executive transport, medical and rescue, energy, security, and utility services,\
  \ as well as provides support and training services. The company also provides trainers,\
  \ fighters, multi-mission transport, and multi-mission surveillance aircraft; command\
  \ and controls, radars and sensors, optronics, communication systems, electronic\
  \ warfare, avionics, defense system, and air traffic management; defense systems\
  \ comprising turrets and canons, munitions, and torpedoes; and cyber security and\
  \ resilience, critical communications, digitalization, and global monitoring solutions.\
  \ In addition, it offers geoinformation, satellite communications, ground systems,\
  \ navigation, and satellite operations; interplanetary probes and orbiting modules;\
  \ and robotics and drilling, electro-optics, laser transmitters, atomic clocks,\
  \ photovoltaic panels, power distributors and amplifiers, attitude sensors, and\
  \ orbital micro propulsion. Further, the company engages in the production and assembly\
  \ of major structural composite and metallic components for commercial and military\
  \ aircraft, helicopters, and uncrewed aircraft. Additionally, it designs and manufactures\
  \ heavy-duty quarry and construction vehicles for the mining and construction industry.\
  \ The company was formerly known as Leonardo \x96 Finmeccanica S.p.a. and changed\
  \ its name to Leonardo S.p.a. in January 2017. Leonardo S.p.a. was founded in 1948\
  \ and is headquartered in Rome, Italy."
