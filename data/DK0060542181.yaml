longBusinessSummary: ISS A/S operates as workplace experience and facility management
  company in the United Kingdom, Ireland, the United States, Canada, Switzerland,
  Germany, Australia, New Zealand, Türkiye, Spain, Denmark, and internationally. The
  company offers space office, space plus, and space production; transportation and
  infrastructure cleaning, food hygiene, and hospitality and cleaning services; and
  catering, fine dining and event catering; and micro-kitchens and vending services,
  as well as operates restaurants and pop-ups. It also provides security services
  comprising front of house, concierge and manned guarding, video surveillance, and
  technical services. In addition, the company offers support services, which include
  front desk and reception, meeting and conference management, switchboards and service
  desk, concierge, mail and courier, document, executive and administrative support,
  and experience curation and management services. Further, the company provides energy
  management, asset management, critical environments, and waste management services.
  Additionally, it designs and delivers workplace strategies and solutions, such as
  portfolio strategy, curated experience and workplace strategy, workplace and service
  design, relocation strategy, capital projects, and mental rebuild services. It serves
  financial and professional services, life science, and technology industries. ISS
  A/S was founded in 1901 and is headquartered in Søborg, Denmark.
