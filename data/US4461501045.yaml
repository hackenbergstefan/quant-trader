longBusinessSummary: Huntington Bancshares Incorporated operates as the bank holding
  company for The Huntington National Bank that provides commercial, consumer, and
  mortgage banking services. It offers financial products and services to consumer
  and business customers, including deposits, lending, payments, mortgage banking,
  dealer financing, investment management, trust, brokerage, insurance, and other
  financial products and services. The company also provides 24-Hour Grace, Asterisk-Free
  Checking, Money Scout, $50 Safety Zone, Standby Cash, Early Pay, Instant Access,
  Savings Goal Getter, And Huntington Heads Up; digitally powered consumer and business
  financial solutions to consumer finance, regional banking, branch banking, and wealth
  management customers; direct and indirect consumer loans; dealer finance loans and
  deposits; and private banking, wealth management and legacy planning through investment
  and portfolio management, fiduciary administration and trust, institutional custody,
  and full-service retail brokerage investment services. In addition, it offers equipment
  financing, asset-based lending, distribution finance, structured lending, municipal
  financing solutions, and Huntington ChoicePay. Additionally, the company provides
  lending, liquidity, treasury management and other payment services, and capital
  markets; government and non-profits, healthcare, technology and telecommunications,
  franchises, financial sponsors, fund finance, Native American financial, and global
  services; and corporate risk management, institutional sales and trading, debt and
  equity issuance, and additional advisory services. The company offers its products
  through a network of channels, including branches and ATMs, online and mobile banking,
  and through customer call centers to customers in middle market banking, corporate,
  specialty, and government banking, asset finance, commercial real estate banking,
  and capital markets. The company was founded in 1866 and is headquartered in Columbus,
  Ohio.
