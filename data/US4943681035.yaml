longBusinessSummary: Kimberly-Clark Corporation, together with its subsidiaries, manufactures
  and markets personal care products in the United States. It operates in two segments,
  North America and International Personal Care. The North America segment offers
  disposable diapers, training and youth pants, swimpants, baby wipes, feminine and
  incontinence care products, reusable underwear, facial and bathroom tissue, paper
  towels, napkins, wipers, tissue, towels, soaps and sanitizers, and other related
  products under the Huggies, Pull-Ups, Goodnites, Kotex, Poise, Depend, Kleenex,
  Scott, Cottonelle, Viva, Wypall, and other brand names. Its International Personal
  Care segment provides baby and child care, adult care and feminine care, including
  disposable diapers, training and youth pants, swimpants, baby wipes, feminine and
  incontinence care products, reusable underwear, and other related products under
  the Huggies, Kotex, Goodfeel, Intimus, Depend, and other brand names. The company
  sells its household use products directly to supermarkets, mass merchandisers, drugstores,
  warehouse clubs, variety and department stores, and other retail outlets, as well
  as through other distributors and e-commerce. It also sells its professional use
  products through distributors directly to manufacturing, lodging, office building,
  food service, and high-volume public facilities, as well as through e-commerce.
  Kimberly-Clark Corporation was founded in 1872 and is headquartered in Dallas, Texas.
