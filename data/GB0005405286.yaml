longBusinessSummary: 'HSBC Holdings plc engages in the provision of banking and financial
  products and services worldwide. It operates through four segments: Hong Kong, UK,
  Corporate and Institutional Banking, and International Wealth and Premier Banking.
  The Hong Kong segment is involved in the retail banking and wealth and commercial
  banking of HSBC Hong Kong and Hang Seng Bank. The UK segment engages in UK retail
  banking and wealth, as well as first direct and M&S Bank, UK Commercial Banking,
  and HSBC Innovation Bank. The Corporate and Institutional Banking segment is involved
  in transaction banking and capital markets. The International Wealth and Premier
  Banking segment is involved in the business comprising premier banking outside of
  Hong Kong and the UK, its private bank, asset management, and insurance businesses.
  The company was founded in 1865 and is headquartered in London, the United Kingdom.'
