longBusinessSummary: Octave Intelligence plc provides various software solutions.
  Its solutions helps organizations to better understand and manage the environment
  in which they design, build, operate, and protect their assets, people, and critical
  infrastructure. Its platform connects data, events, and workflows across various
  environments and applies context-aware intelligence to help customers understand
  what is happening, what may happen next, and how actions in one area affect conditions
  in another. The company chemicals and petrochemicals, electronics, life sciences
  and pharma, public safety, construction, manufacturing, security, engineering services
  (EPCs), data centers, food, beverage and retail, metals and mining, transportation,
  defence, government and public sector, oil and gas, education, healthcare, and power
  and utilities industries. It operates in the United States, Canada, Latin America,
  Europe, the Middle East, India, Africa, and rest of APAC region. The company was
  incorporated in 2017 and is based in Madison, Alabama.
