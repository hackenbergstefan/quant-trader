longBusinessSummary: Johnson Matthey Plc engages in the clean air, catalyst and hydrogen
  technology, and platinum group metals (PGM) service businesses in the United Kingdom,
  Germany, rest of Europe, the United States, rest of North America, China, rest of
  Asia, and internationally. It operates through Clean Air, PGM Services, and Hydrogen
  Technologies segments. The Clean Air segment provides catalysts for emission control
  after-treatment systems to reduce harmful emissions from cars, other light duty
  vehicles, trucks, buses, and non-road equipment powered by internal combustion engines.
  The PGM Services segment enables the energy transition that offers circular solutions
  as demand for critical materials. This segment also offers PGM refining and recycling
  services; engages in PGM trading activities; other precious metal products; and
  PGM chemicals, industrial products, and catalysts. The Hydrogen Technologies segment
  offers components across the value chain for fuel cells and electrolysers, including
  catalyst coated membranes and membrane electrode assemblies. The company was formerly
  known as Johnson & Cock and changed its name to Johnson Matthey Plc in 1851. Johnson
  Matthey Plc was founded in 1817 and is headquartered in London, the United Kingdom.
