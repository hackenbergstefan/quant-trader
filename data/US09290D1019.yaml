longBusinessSummary: BlackRock, Inc. is a publicly owned investment manager. The firm
  primarily provides its services to institutional, intermediary, and individual investors
  including corporate, public, union, and industry pension plans, insurance companies,
  third-party mutual funds, endowments, public institutions, governments, foundations,
  charities, sovereign wealth funds, corporations, official institutions, and banks.
  It also provides global risk management and advisory services. The firm manages
  separate client-focused equity, fixed income, and balanced portfolios. It also launches
  and manages open-end and closed-end mutual funds, offshore funds, unit trusts, and
  alternative investment vehicles including structured funds. The firm launches equity,
  fixed income, balanced, and real estate mutual funds. It also launches equity, fixed
  income, balanced, currency, commodity, and multi-asset exchange traded funds. The
  firm also launches and manages hedge funds. It invests in the public equity, fixed
  income, real estate, currency, commodity, and alternative markets across the globe.
  The firm primarily invests in growth and value stocks of small-cap, mid-cap, SMID-cap,
  large-cap, and multi-cap companies. It also invests in dividend-paying equity securities.
  The firm invests in investment grade municipal securities, government securities
  including securities issued or guaranteed by a government or a government agency
  or instrumentality, corporate bonds, and asset-backed and mortgage-backed securities.
  It employs fundamental and quantitative analysis with a focus on bottom-up and top-down
  approach to make its investments. The firm employs liquidity, asset allocation,
  balanced, real estate, and alternative strategies to make its investments. In real
  estate sector, it seeks to invest in Poland and Germany. The firm benchmarks the
  performance of its portfolios against various S&P, Russell, Barclays, MSCI, Citigroup,
  and Merrill Lynch indices. BlackRock, Inc. was founded in 1988 and is based in New
  York, New York with additional offices in Atlanta, Georgia; Boston, Massachusetts;
  Chicago, Illinois; Dallas, Texas; Denver, Colorado; Greenwich, Connecticut; Houston,
  Texas; Miami, Florida; Newport Beach, California; Palo Alto, California; Philadelphia,
  Pennsylvania; Princeton, New Jersey; San Francisco, California; Santa Monica, California;
  Seattle, Washington; Washington, DC; West Palm Beach, Florida; Wilmington, Delaware;
  Mexico; Canada; South Africa; Netherlands; Greece; Serbia; Belgium; Hungary; Denmark;
  Ireland; Scotland; Germany; Switzerland; England; Luxembourg; Spain; Italy; France;
  Sweden; Austria; India; China; Australia; Hong Kong; South Korea; Singapore; Taiwan;
  Japan; Colombia; Argentina; Peru; Chile; Brazil; UAE; Saudi Arabia; Israel.
