longBusinessSummary: Biogen Inc. discovers, develops, manufactures, and delivers therapies
  in the United States, Europe, Germany, Asia, and internationally. The company provides
  TECFIDERA, VUMERITY, AVONEX, PLEGRIDY, and TYSABRI for multiple sclerosis (MS);
  SPINRAZA for spinal muscular atrophy; SKYCLARYS to treat Friedreich's Ataxia; QALSODY
  for treating amyotrophic lateral sclerosis; FUMADERM to treat plaque psoriasis;
  BENEPALI, an etanercept biosimilar referencing ENBREL; IMRALDI, an adalimumab biosimilar
  referencing HUMIRA; FLIXABI, an infliximab biosimilar referencing REMICADE. It offers
  LEQEMBI for the treatment of Alzheimer's disease; ZURZUVAE for the treatment of
  postpartum depression; RITUXAN to treat non-Hodgkin's lymphoma, chronic lymphocytic
  leukemia (CLL), rheumatoid arthritis, two forms of ANCA-associated vasculitis, and
  pemphigus vulgaris; RITUXAN HYCELA for non-Hodgkin's lymphoma and CLL; GAZYVA to
  treat CLL and follicular lymphoma; OCREVUS for relapsing MS and primary progressive
  MS; LUNSUMIO to treat relapsed or refractory follicular lymphoma; glofitamab for
  aRelapsed or refractory diffuse large B-cell lymphoma; and other anti-CD20 therapies.
  Biogen Inc. has collaboration and license agreements with Merz Therapeutics; Alkermes
  Pharma Ireland Limited; Denali Therapeutics Inc.; UCB; Eisai Co., Ltd.; Genentech,
  Inc.; Neurimmune SubOne AG; Ionis Pharmaceuticals, Inc.; Samsung Bioepis; and Sage
  Therapeutics, Inc., as well as collaborations with Stoke Therapeutics, Inc. for
  the development and commercialization of zorevunersen, a disease modifying medicine
  for the treatment of Dravet syndrome; Dayra Therapeutics, Inc. to develop oral macrocyclic
  peptides; Vanqua Bio, Inc. for developing Vanqua's preclinical oral C5aR1 antagonist
  compound; City Therapeutics, Inc. to develop select novel RNAi therapies; and ALTEOGEN
  Inc. to develop subcutaneous (SC) formulations of biologics utilizing ALT-B4. The
  company was founded in 1978 and is headquartered in Cambridge, Massachusetts.
