longBusinessSummary: 'Essity AB (publ) develops, produces, and sells hygiene and health
  products and services in Europe, North and Latin America, Asia, and internationally.
  The company operates through three segments: Health & Medical, Consumer Goods, and
  Professional Hygiene. The Health & Medical segment offers incontinence products,
  wound care, compression therapy, orthopedics, skincare products, and digital solutions
  with sensor technology under the TENA, Leukoplast, JOBST, Actimove, Cutimed, Delta-Cast,
  AquaCast Liner, and Hydrofera brands to family carers, professional caregivers,
  and patients and consumers through pharmacies, medical device stores, hospitals,
  distributors, care institutions, and e-commerce. The Consumer Goods segment provides
  pads, panty liners, tampons, diapers, wet wipes, shampoos, lotions, baby oil, skin
  creams, intimate soaps, intimate wipes, leakproof apparel, menstrual cups, toilet
  papers, household towels, handkerchiefs, facial tissues, and napkins under the TENA,
  Knix, Modibodi, Libero, Lotus, Libresse, Bodyform, Nana, Saba, Nosotras, TOM Organic,
  Tempo, Zewa, Cushelle, Plenty, Regio, and Familia brands through retail trade and
  e-commerce. The Professional Hygiene segment offers toilet papers, paper hand towels,
  napkins, hand soaps, hand lotions, hand sanitizers, dispensers, and cleaning and
  wiping products, as well as vision cleaning and data-driven cleaning solutions under
  the Tork brand to companies and office buildings, universities, healthcare facilities,
  airports, industries, restaurants, hotels, stadiums, and other public venues through
  direct to the end-customer, e-commerce, or distributors. Essity AB (publ) was founded
  in 1849 and is headquartered in Stockholm, Sweden.'
