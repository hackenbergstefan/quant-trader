longBusinessSummary: Associated British Foods plc engages in the food, ingredients,
  and retail businesses in the United Kingdom, Europe, the Americas, Africa, and the
  Asia Pacific. It operates through Retail, Grocery, and Ingredients segments. The
  Retail segment is involved in buying and merchandising clothing and accessories
  through the Primark and Penneys retail chains, which offer women's, men's, and kidswear,
  as well as beauty, homeware, and accessories. The Grocery segment offers hot beverages,
  sugar, vegetable oils, balsamic vinegars, bread and baked goods, cereals, international
  food and meat products to retail, wholesale, and foodservice businesses. The Ingredients
  segment manufactures yeast and bakery ingredients; specialty ingredients focused
  on enzymes, procession extracts, health and nutrition; and pharmaceutical delivery
  systems. The company was incorporated in 1934 and is headquartered in London, the
  United Kingdom. Associated British Foods plc operates as a subsidiary of Wittington
  Investments Limited.
