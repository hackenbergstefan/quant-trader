longBusinessSummary: 'RELX PLC, together with its subsidiaries, provides information-based
  analytics and decision tools for professional and business customers in North America,
  Europe, and internationally. It operates through four segments: Risk; Scientific,
  Technical & Medical; Legal; and Exhibitions. The Risk segment offers information-based
  analytics and decision tools that combine public and industry specific content with
  technology and algorithms to assist clients in evaluating and predicting risk, as
  well as a portfolio of commercial healthcare products. Its Scientific, Technical
  & Medical segment provides scientific and medical information and data sets for
  science and healthcare. The Legal segment provides legal, regulatory, and business
  information and analytics. Its Exhibitions segment combines digital tools and data
  to help customers connect in-person and online, discover new markets, source products,
  generate leads, and transact. The company was formerly known as Reed Elsevier PLC
  and changed its name to RELX PLC in July 2015. RELX PLC was incorporated in 1903
  and is headquartered in London, the United Kingdom.'
