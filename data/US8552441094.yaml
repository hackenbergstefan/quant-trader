longBusinessSummary: 'Starbucks Corporation, together with its subsidiaries, operates
  as a roaster, marketer, and retailer of coffee internationally. The company operates
  through three segments: North America, International, and Channel Development. Its
  stores offer coffee, tea, and other beverages, roasted whole beans and ground coffees,
  complementary food, packaged coffees, single-serve products, and ready-to-drink
  beverages; and various food products, such as pastries, breakfast sandwiches, and
  lunch items. The company also licenses its trademarks through licensed stores, and
  grocery and foodservice accounts. The company offers its products under the Starbucks
  Coffee, Teavana, Seattle''s Best Coffee, Ethos, and Starbucks Reserve brands. Starbucks
  Corporation was founded in 1971 and is based in Seattle, Washington.'
