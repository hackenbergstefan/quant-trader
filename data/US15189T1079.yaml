longBusinessSummary: CenterPoint Energy, Inc. operates as a public utility holding
  company in the United States. The company operates through Electric; Natural Gas;
  and Corporate and Other segments. The Electric segment provides electric transmission
  and distribution services to electric customers and electric generation assets,
  as well as optimizes assets in the wholesale power market in Indiana Electric's
  service territory. The Natural Gas segment engages in the intrastate natural gas
  sales, and natural gas transportation and distribution for residential, commercial,
  and industrial customers in Indiana, Minnesota, Ohio, and Texas; permanent pipeline
  connections through interconnects with various interstate and intrastate pipeline
  companies; and provides home appliance maintenance and repair services to customers
  in Minnesota and home repair protection plans to natural gas customers in Indiana,
  Mississippi, Ohio, and Texas through a third party. As of December 31, 2025, it
  served approximately 2,859,313 metered customers; owned 355 substations with transformer
  capacity of 81,692 megavolt amperes; and owned and operated approximately 208 miles
  of intrastate pipeline in Louisiana and Texas. The company was founded in 1866 and
  is headquartered in Houston, Texas.
