longBusinessSummary: Burberry Group plc, together with its subsidiaries, engages in
  manufacturing, retail, and wholesale of luxury goods under the Burberry brand in
  the Asia Pacific, China, Europe, the Middle East, India, Africa, and the Americas.
  The company operates in two segments, Retail/Wholesale and Licensing. It offers
  accessories, womenswear, menswear, childrenswear, and others, as well as eyewear
  and beauty, and bags. The company also licenses third parties to manufacture and
  distribute products using the Burberry trademarks. It sells its products through
  operated stores, concessions, outlets, digital commerce, Burberry franchisees, department
  stores, multi-brand specialty accounts, and through the Burberry.com website. Burberry
  Group plc was founded in 1856 and is headquartered in London, the United Kingdom.
