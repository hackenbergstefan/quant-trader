longBusinessSummary: Barclays PLC provides various financial services in the United
  Kingdom, Europe, the Americas, Africa, the Middle East, and Asia. The company operates
  through Barclays UK; Barclays UK Corporate Bank; Barclays Private Bank and Wealth
  Management; Barclays Investment Bank; and Barclays US Consumer Bank segments. It
  offers financial services, such as current accounts, savings accounts, mortgages
  and unsecured lending, such as credit cards and loans retail banking, wholesale
  banking, investment banking, wealth management, and investment management services,
  as well as lending products. In addition, the company engages in securities dealing
  activities and issuing of credit cards. The company was formerly known as Barclays
  Bank public limited company and changed its name to Barclays PLC in January 1985.
  Barclays PLC was founded in 1690 and is headquartered in London, the United Kingdom.
