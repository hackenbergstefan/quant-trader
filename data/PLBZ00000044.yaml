longBusinessSummary: Erste Bank Polska S.A. provides various banking products and
  services for individuals, small or medium-sized enterprises, corporate clients,
  and public sector institutions. The company offers personal account, savings accounts
  and term deposits, currencies, internet and mobile banking, and contactless payments,
  and debit and credit solutions. It also provides consumer loans and home mortgages;
  mutual funds, including pension schemes and various investment programmes; and tourist/travel,
  motor, and home insurance products, as well as bancassurance products. In addition,
  the company offers foreign exchange, bank guarantees, and foreign letter of credit.
  The company was formerly known as Santander Bank Polska S.A. and changed its name
  to Erste Bank Polska S.A. in April 2026. Erste Bank Polska S.A. was founded in 1857
  and is headquartered in Warsaw, Poland.
