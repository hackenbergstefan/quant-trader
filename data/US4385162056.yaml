longBusinessSummary: Honeywell International Inc. engages in the industrial automation,
  building automation, and energy and sustainability solutions businesses in the United
  States, Europe, and internationally. The Industrial Automation segment provides
  automation control and instrumentation products and services; smart energy products;
  sensing technologies, including custom-engineered sensors and related services;
  gas detection technologies and personal protective equipment; and system design
  automation equipment, as well as software and analytics for manufacturing, distribution,
  and fulfillment operations. The Building Automation segment provides software applications
  for building control and optimization; sensors, switches, control systems, and instruments
  for energy management; access control; video surveillance; fire products; and installation,
  maintenance, and system upgrade services. The Energy and Sustainability Solutions
  segment, through its UOP business, delivers licensed process technology, equipment,
  engineering, catalysts, adsorbents, and services for refining, petrochemicals, low-carbon
  energy, gas and LNG, and industrial solutions, as well as connectivity, data integration,
  and software solutions. The company also offers Forge Cognition, a self-contained
  agentic AI and simulation platform for facility operations. The company was formerly
  known as AlliedSignal, Inc. Honeywell International Inc. was founded in 1885 and
  is headquartered in Charlotte, North Carolina.
