longBusinessSummary: Gen Digital Inc. engages in the provision of cyber safety and
  trust-based solutions for individuals, families, and small businesses. The company
  offers security and performance management, identity protection, and online privacy,
  as well as technology platforms. It also provides restoration support services,
  digital reputation, and secure financial wellness. The company offers its products
  under the Norton, Avast, LifeLock, MoneyLion, Avira, AVG, ReputationDefender, and
  CCleaner brands. The company was formerly known as NortonLifeLock Inc. and changed
  its name to Gen Digital Inc. in November 2022. Gen Digital Inc. was founded in 1982
  and is headquartered in Tempe, Arizona.
