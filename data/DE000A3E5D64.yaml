longBusinessSummary: Fuchs SE, together with its subsidiaries, develops, produces,
  and distributes specialty lubricants and functional fluids in Europe, the Middle
  East, Africa, the Asia Pacific, and North and South America. The company offers
  automotive and industrial lubricants, such as biodegradable lubricants, central
  and mobile hydraulic oils, dry coatings, engine and gear oils, motorcycle/two wheelers,
  service fluids, chain lubricants, machine oils, open gear lubricants, compressor
  and refrigeration oils, release agents, slideways oils, fluids and industrial oils,
  hydraulic oils, and textile machine and turbine oils, as well as various oils for
  the agriculture sector. It also provides lubricating greases comprising assembly
  pastes, biodegradable and food grade greases, multi-purpose/long-life greases, pastes
  for extreme temperatures, perfluorinated pastes, and wheel bearing greases, as well
  as gear boxes; and greases for central lubricating systems, extreme temperature,
  machine tools, plain and roller bearings, rail vehicles, spray cans or rattle cans,
  and solid lubricants. In addition, the company offers metal processing lubricants
  consisting of cleaners, corrosion preventives, cutting and grinding, forming lubricants,
  and quenching oils; and special application lubricants for lubricating oils and
  pastes, adhesive lubricants, concrete and asphalt release agents, solid film and
  food grade lubricants, metal forming lubricants, corrosion protection and rust looseners,
  cleaners and protective agents, sprays, and application equipment. Further, it offers
  open gear and surface coating services. The company serves the automotive, industry,
  engineering, construction, mining, transport, heavy duty, steel and cement, aerospace,
  wind energy, and food sectors. The company was formerly known as Fuchs Petrolub
  SE and changed its name to Fuchs SE in July 2023. Fuchs SE was founded in 1931 and
  is headquartered in Mannheim, Germany.
