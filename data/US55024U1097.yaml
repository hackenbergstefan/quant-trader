longBusinessSummary: Lumentum Holdings Inc. manufactures and sells optical and photonic
  products in the Americas, the Asia-Pacific, Europe, the Middle East, and Africa.
  It offers component products, including semiconductor laser chips, laser sub-assemblies,
  line subsystems, and wavelength management systems. The company also offers system
  products, such as optical modules, optical circuit switches, and industrial lasers,
  including short-pulse solid-state lasers and kilowatt-class fiber lasers. Its products
  and solutions are used in cloud, artificial intelligence and machine learning (AI/ML),
  telecommunications, consumer, and industrial end-market applications. The company
  was incorporated in 2015 and is headquartered in San Jose, California.
