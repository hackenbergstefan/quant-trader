longBusinessSummary: Texas Pacific Land Corporation engages in the land and resource
  management, and water services and operations businesses. The Land and Resource
  Management segment manages surface acres of land, and oil and gas royalty interest
  in Permian Basin. This segment also engages in easements, such as transporting oil,
  gas and related hydrocarbons, power line and utility, and subsurface wellbore easements.
  In addition, this segment leases its land for processing, storage, and compression
  facilities and roads; and is involved in sale of materials, such as caliche, sand,
  and other material, as well as sells land. The Water Services and Operations segment
  provides full-service water offerings, including water sourcing, produced-water
  treatment, infrastructure development, and disposal solutions to operators in the
  Permian Basin. This segment also holds produced water royalties. The company owns
  a 1/128th nonparticipating perpetual oil and gas royalty interest (NPRI) under approximately
  85,000 acres of land; a 1/16th NPRI under approximately 371,000 acres of land; and
  approximately 33,000 additional net royalty acres, total of approximately 224,000
  NRA located in the Permian Basin. The company was founded in 1888 and is headquartered
  in Dallas, Texas.
