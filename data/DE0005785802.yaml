longBusinessSummary: Fresenius Medical Care AG provides dialysis and related services
  for individuals with renal diseases in Germany, the United States, and internationally.
  The company offers dialysis treatment and related laboratory and diagnostic services
  through a network of outpatient dialysis clinics; materials, training, and patient
  support services comprising clinical monitoring, follow-up assistance, and arranging
  for delivery of the supplies to the patient's residence; and dialysis services under
  contract to hospitals in the United States for the hospitalized end-stage renal
  disease (ESRD) patients and for patients suffering from acute kidney failure. The
  company operates through Care Delivery and Care Enablement segments. It also develops,
  manufactures, and distributes various health care products, including hemodialysis
  machines, peritoneal dialysis cyclers, peritoneal dialysis solutions, hemodialysis
  concentrates, solutions and granulates, bloodlines, renal pharmaceuticals, systems
  for water treatment, and acute cardiopulmonary and apheresis products. In addition,
  the company develops, acquires, and in-licenses renal pharmaceuticals; offers renal
  medications and supplies to patients at homes or to dialysis clinics; and provides
  vascular specialty, ambulatory surgery center, physician nephrology practice management,
  pharmacy and other services. The company sells its products to dialysis clinics,
  hospitals, and specialized treatment clinics, as well as through local sales forces,
  independent distributors, dealers, and sales agents. The company was incorporated
  in 1996 and is headquartered in Bad Homburg, Germany.
