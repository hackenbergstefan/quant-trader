longBusinessSummary: 'DHL AG provides logistics and mail communication services in
  Germany and Internationally. The company operates through five segments: Express,
  Global Forwarding, Supply Chain, eCommerce, and Post and Parcel Germany. Its Express
  segment offers time-definite courier and express delivery services for business
  and private customers, including Time Definite International cross-border transport
  with standardized transit times, medical express temperature-controlled shipment
  solutions, general cargo air freight, door-to-door courier services, and customs
  clearance, operating a global air freight network with dedicated aircraft and service
  points across Europe, the Middle East and Africa, the Americas, and Asia Pacific.
  The Global Forwarding segment provides international air, ocean, and overland freight
  forwarding services through its Global Forwarding and Freight business units. The
  Supply Chain segment delivers contract logistics services and supply chain solutions
  built on modular components, including warehousing, transport, e-fulfillment, and
  value-added services. The eCommerce segment provides international and domestic
  parcel delivery services in selected countries across Europe, Asia, and the United
  States, along with non-TDI cross-border parcel services. The Post and Parcel Germany
  segment transports, sorts, and delivers documents and goods within Germany and provides
  export services through its Post Germany, Parcel Germany, and International business
  units, offering physical and hybrid letter delivery, registered mail, insured items,
  redirection and storage services, dialogue marketing, national and international
  parcel and goods shipments, Packstation automated parcel lockers, Poststation combined
  parcel and postal services, and electronic communications services. DHL AG was formerly
  known as Deutsche Post AG and changed its name to DHL AG in September, 2026. DHL
  AG was incorporated in 1995 and is based in Bonn, Germany.'
