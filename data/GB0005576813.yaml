longBusinessSummary: Howden Joinery Group Plc supplies various kitchen, joinery, and
  hardware products in the United Kingdom, France, Belgium, and the Republic of Ireland.
  The company's product portfolio includes cabinet, worktops, sinks and taps, flooring,
  appliances, and handles; internal and external doors, such as fire doors, flooring,
  stair parts, and general joinery items; and cooking, cleaning, and cooling appliances.
  The company was formerly known as Galiform Plc and changed its name to Howden Joinery
  Group Plc in September 2010. Howden Joinery Group Plc was incorporated in 1987 and
  is based in London, the United Kingdom.
