longBusinessSummary: 'Poste Italiane S.p.A. provides postal, logistics, and financial
  and insurance products and services in Italy. The company operates through four
  segments: Mail, Parcels and Distribution; PostePay Services; Financial Services;
  and Insurance Services. Its Mail, Parcels and Distribution segment engages in the
  mail, parcel, and logistics activities, as well as provision of welfare services.
  The PostePay Services segment provides payment management and e-money services through
  a network of LIS sales points, as well as mobile and fixed telephone services and
  electricity and gas sales services. Its Financial Services segment engages in the
  placement and distribution of financial and insurance products and services, such
  as current accounts, postal savings products, mutual funds, financing, insurance
  policies, and activities. The Insurance Services segment is involved in the investment,
  retirement, and protection businesses through the issuance of life and P&C insurance
  products. The company was founded in 1862 and is based in Rome, Italy.'
