longBusinessSummary: 'Swedish Orphan Biovitrum AB (publ), a biopharma company, provides
  medicines in the areas of haematology, immunology, and specialty care in Europe,
  North America, the Middle East, Asia, and Australia. The company operates through
  three segments: Haematology, Immunology, and Specialty Care. It offers Alprolix
  for haemophilia B; ALTUVOCT for the treatment and prophylaxis of bleeding in patients
  with haemophilia A; Aspaveli/Empaveli for treating adult patients with paroxysmal
  nocturnal haemoglobinuria; Doptelet for the treatment of immune thrombocytopenia
  and thrombocytopenia; Elocta/Eloctate for the treatment and prophylaxis of bleeding
  in patients with haemophilia A; Gamifant for treating hemophagocytic lymphohistiocytosis;
  Kineret for the treatment of cryopyrin-associated periodic syndrome, rheumatoid
  arthritis, familial Mediterranean fever, deficiency of interleukin-1 receptor antagonist,
  and systemic juvenile idiopathic arthritis; Orfadin for hereditary tyrosinemia type
  1 and alkaptonuria; Synagis for the prevention of serious lower respiratory tract
  infection caused by respiratory syncytial virus in infants and young children; VONJO,
  a kinase inhibitor indicated for the treatment of post-polycythemia vera or post-essential
  thrombocythemia myelofibrosis; and Zynlonta for treating adult patients with relapsed
  or refractory diffuse large and high grade B-cell lymphoma. The company also provides
  other medicines, such as Akynzeo, Jyseleca, Tegsedi, and Waylivra, as well as develops
  drug substances for ReFacto AF/Xyntha for Pfizer. The company has collaboration
  agreements with Sanofi, Apellis Pharmaceuticals, Inc., ADC Therapeutics SA, and
  Cartesian Therapeutics, Inc. The company is in strategic partnership with Innate
  Pharma SA to enable initiation of the TELLOMAK-3 confirmatory Phase 3 study in cutaneous
  T cell lymphoma. The company was incorporated in 1939 and is headquartered in Stockholm,
  Sweden.'
