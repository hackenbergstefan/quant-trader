longBusinessSummary: Linde plc operates as an industrial gas company worldwide. The
  company offers atmospheric gases, including oxygen, nitrogen, argon, and rare gases;
  and process gases, such as hydrogen, helium, carbon dioxide, carbon monoxide, electronic
  gases, specialty gases, and acetylene. It also engages in the design and construction
  of turnkey process plants for third-party customers, as well as for its gas businesses,
  including air separation, hydrogen, synthesis, olefin, and natural gas plants. The
  company serves the healthcare, chemicals and energy, manufacturing, metals and mining,
  food and beverage, and electronics industries. It operates in the United States,
  Brazil, Mexico, Canada, Germany, the United Kingdom, Eastern Europe, China, Australia,
  South Korea, and India. Linde plc was founded in 1879 and is based in Woking, the
  United Kingdom.
