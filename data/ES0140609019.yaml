longBusinessSummary: 'CaixaBank, S.A., together with its subsidiaries, provides various
  banking products and services for individuals and businesses in Spain, Portugal,
  and internationally. It operates through four segments: Retail Banking, Business
  Banking, Private Banking, and CIB segments. The company offers retail, private,
  business, institutional, corporate and investment, premier, InTouch, and international
  banking; payment methods; savings and investment products; financing; life, life-risk,
  and non-life insurance; traditional financial and independent advice, and broker
  services; ATMs; pension fund management; asset and wealth management; securitisation
  fund management; consumer finance; IT services; and back-office administration services.
  It also engages in the management of collective investment institutions; holding
  of property assets; venture capital company; promotion of business and entrepreneurial
  initiatives; development of digital projects; vehicle and equipment leasing; project
  management, maintenance, logistics, and procurement; marketing of products and cashless
  platforms; mortgage loan management; digital business; hotels; private security
  of goods and people; shopping center real estate; administration, management, development,
  and operation of real estate; and reinsurance activities. The company was formerly
  known as Criteria CaixaCorp, S.A. and changed its name to CaixaBank, S.A. in July
  2011. CaixaBank, S.A. was founded in 1904 and is based in Valencia, Spain.'
