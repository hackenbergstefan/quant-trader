longBusinessSummary: CF Industries Holdings, Inc., together with its subsidiaries,
  engages in the production of ammonia in North America, Europe, and internationally.
  It operates through Ammonia, Granular Urea, UAN, AN, and Other segments. The company
  offers ammonia products; nitrogen products, such as granular urea, urea ammonium
  nitrate solution, and ammonium nitrate; diesel exhaust fluid, urea liquor, and nitric
  acid products. It serves cooperatives, retailers, independent fertilizer distributors,
  traders, wholesalers, and industrial users. The company was founded in 1946 and
  is headquartered in Northbrook, Illinois.
