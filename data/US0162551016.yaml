longBusinessSummary: Align Technology, Inc. provides Invisalign clear aligners, Vivera
  retainers, and iTero intraoral scanners and services in the United States, Switzerland,
  and internationally. The company's Clear Aligner segment offers Invisalign comprehensive
  package to treat adults and teens malocclusion and features, and orthodontic needs
  of teenage or younger patients; and Invisalign First Phase I and Invisalign First
  Comprehensive Phase 2 package for younger patients between the ages of six and ten
  years with a mixture of primary/baby and permanent teeth. This segment also provides
  Invisalign express, Invisalign lite, and Invisalign moderate; Invisalign Go, Invisalign
  Go express, and Invisalign Go Plus; retention products, Invisalign training, adjusting
  tools used by dental professionals during treatment, ancillary Invisalign accessory
  products, and other oral health products; Invisalign Professional Whitening system;
  Invisalign Palatal Expander, a 3D printed orthodontic device; and 3D printing solutions.
  Its Imaging Systems and CAD/CAM Services segment offers iTero intraoral scanning
  system, a single hardware platform for restorative or orthodontic procedures; exocad,
  a computer-aided design and computer-aided manufacturing software; orthodontist
  software for digital records storage, orthodontic diagnosis, and fabrication of
  printed models and retainers; and restorative software for general practitioner
  dentists, prosthodontists, periodontists, and oral surgeons. This segment also offers
  Invisalign outcome simulator, a chair-side and cloud-based application for the iTero
  scanner; Invisalign progress assessment tool; Align Oral Health Suite, a digital
  interface for dental consultations; iTero TimeLapse technology for doctors or practitioners
  to compare a patient's historic 3D scans to the present-day scan; and subscription
  software, disposables, rents scanners, and pay per scan services. Align Technology,
  Inc. was incorporated in 1997 and is headquartered in Tempe, Arizona.
