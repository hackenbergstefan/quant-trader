longBusinessSummary: 'The AES Corporation, together with its subsidiaries, operates
  as a power generation and utility company. It operates through four segments: Renewables,
  Utilities, Energy Infrastructure, and New Energy Technologies. The company owns
  and/or operates power plants to generate and sell power to customers, such as utilities,
  industrial users, and other intermediaries; owns and/or operates utilities to generate
  or purchase, distribute, transmit, and sell electricity to end-user customers in
  the residential, commercial, industrial, and governmental sectors; and generates
  and sells electricity on the wholesale market, as well as investments in technologies
  to support leading-edge greener energy solutions. It uses various fuels and technologies
  to generate electricity, such as solar, hydro, wind, coal, and gas, as well as renewables
  comprising energy storage and landfill gas. The company owns and/or operates a generation
  portfolio of approximately 34,740 megawatts and distributes power to 2.7 million
  customers. The company operates in the United States, Chile, Dominican Republic,
  El Salvador, Mexico, Bulgaria, Panama, Colombia, Argentina, Vietnam, Jordan, Puerto
  Rico, and internationally. The company was formerly known as Applied Energy Services,
  Inc. and changed its name to The AES Corporation in April 2000. The AES Corporation
  was incorporated in 1981 and is based in Arlington, Virginia.'
