longBusinessSummary: Novozymes A/S produces and sells industrial enzymes, functional
  proteins, and microorganisms in Denmark, rest of Europe, North America, the Asia
  Pacific, the Middle East, Africa, and Latin America. It provides biosolutions for
  the food and beverage industry, such as dairy, baking, beverage, meat, plant-based,
  functional, and other foods, as well as precision protein and early lie nutrition.
  The company also offers bioenergy solutions including biodiesel; biogas from agricultural
  and industrial residues and food waste; biomass; carbon capture; ethanol for liquefaction,
  saccharification, fermentation, and fiber conversion; and renewable diesel. In addition,
  it provides dishwashing, home cleaning, laundry, medical, and industrial and institutional
  cleaning services; gastrointestinal, immune, mental, women's, children's cardiometabolic,
  and oral human health solutions. Further, the company offers corn and wheat separation,
  liquefaction, saccharification, filtration, isomerization, maltose, and specialties
  solutions; corn, cotton, forages, peanuts, pulses, soybeans, wheat, small grains,
  bioyield, and biocontrol solutions; silage, diary and beef cattle, poultry, swine,
  aquaculture solutions; pet care solutions; leather and textiles solutions; fiber
  modification, bleach boosting, deposit control, and starch modification solutions;
  and distilling, oils and fats, sustainable plastic solutions. Additionally, it provides
  lipases, proteases, oxidoreductases, and carbohydrases. Novozymes A/S is headquartered
  in Lyngby, Denmark.
