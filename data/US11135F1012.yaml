longBusinessSummary: 'Broadcom Inc. designs, develops, and supplies various semiconductor
  devices and infrastructure software solutions internationally. The company operates
  in two segments: Semiconductor Solutions and Infrastructure Software. The company
  offers networking connectivity, such as custom silicon solutions, ethernet switching
  & routing, ethernet NIC controllers, physical layer devices, and fiber optic components;
  wireless device connectivity, including RF semiconductor devices, connectivity solutions,
  custom touch controllers, and inductive charging ASICS; servers and storage system
  solutions, such as PCIE switches, SAS & raid products, fibre channel products, and
  HDD & SSD solutions; broadband solutions, includes set-top box, and broadband access;
  and industrial. The company also offers a private cloud software portfolio, including
  the VMware Cloud Foundation, Edge, vSphere foundation, telco cloud platform, private
  AI, live recovery, application networking and security, application development
  and data services; mainframe software, such as AIOPS & automation, database & data
  management, DEVX & DEVOPS, cybersecurity & compliance management, beyond code programs,
  foundational & open mainframe solutions; cybersecurity, such as endpoint, network,
  information, application security, and identity & access management; enterprise
  software; and fc san management. Its products are used in various applications in
  enterprise and data center networking, including artificial intelligence networking
  and connectivity, home connectivity, set-top boxes, broadband access, telecommunication
  equipment, wireless device and base stations, data center servers and storage systems,
  factory automation, power generation and alternative energy systems, and electronic
  displays. Broadcom Inc. was founded in 1961 and is headquartered in Palo Alto, California.'
