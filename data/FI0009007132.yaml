longBusinessSummary: Fortum Oyj, together with its subsidiaries, engages in the generation
  and sale of electricity and heat to private and business customers in Finland, Sweden,
  Norway, Poland, and internationally. It operates through Generation, Consumer Solutions,
  and Other Operations segments. The Generation segment offers low-carbon hydro, nuclear,
  onshore wind, and solar power generation; district heating and cooling; and decarbonization
  services. The Consumer Solutions segment offers invoicing and customer services;
  electricity and related value-added products; and digital services for consumers,
  including small- and medium-sized enterprises. It is also involved in the electricity
  and gas retail business; power trading and energy supply services; industrial site
  development; and battery recycling activities. The company was formerly known as
  IVO-Neste Yhtymä Oyj and changed its name to Fortum Oyj in June 1998. The company
  has strategic partnership with Google for nuclear power purchase agreement. Fortum
  Oyj was incorporated in 1998 and is headquartered in Espoo, Finland.
