longBusinessSummary: 'Equifax Inc. operates as a data, analytics, and technology company.
  The company operates through three segments: Workforce Solutions, U.S. Information
  Solutions (USIS), and International. The Workforce Solutions segment offers services
  that enables customers to verify income, employment, educational history, criminal
  justice data, healthcare professional licensure, and sanctions of people in the
  United States; and employer customers with services that assist them in complying
  with and automating certain payroll-related and human resource management processes
  throughout the entire cycle of the employment relationship. The U.S. Information
  Solutions segment provides consumer and commercial information services, such as
  credit information and credit scoring, credit modeling and portfolio analytics,
  locate, fraud detection and prevention, identity verification, and other consulting
  services; mortgage services; financial marketing services; identity management services;
  and credit monitoring products. The International segment offers information service
  products, which include consumer and commercial services comprising credit and financial
  information, and credit scoring and modeling; and credit and other marketing products
  and services, as well as information, technology, and services to support debt collections
  and recovery management. The company also provides information solutions for businesses,
  governments and consumers; and human resources business process automation and outsourcing
  services for employers. It operates in Argentina, Australia, Brazil, Canada, Chile,
  Costa Rica, Dominican Republic, Ecuador, El Salvador, Honduras, India, Ireland,
  Mexico, New Zealand, Paraguay, Peru, Portugal, Spain, the United Kingdom, Uruguay,
  and the United States. The company was founded in 1899 and is headquartered in Atlanta,
  Georgia.'
