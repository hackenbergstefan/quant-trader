longBusinessSummary: 'Medtronic plc develops, manufactures, and sells device-based
  medical therapies to healthcare systems, physicians, clinicians, and patients in
  the United States, Ireland, and internationally. It operates through three segments:
  The Cardiovascular Portfolio, Neuroscience Portfolio, and Medical Surgical Portfolio.
  The Cardiovascular Portfolio segment offers implantable cardiac pacemakers, cardioverter
  defibrillators, and cardiac resynchronization therapy devices; cardiac ablation
  products; insertable cardiac monitor systems; TYRX products; and remote monitoring
  and patient-centered software. It also provides aortic valves, surgical valve replacement
  and repair products, endovascular stent grafts and accessories, and transcatheter
  pulmonary valves, left atrial appendage exclusion systems, extracorporeal membrane
  oxygenation (ECMO) systems and percutaneous coronary intervention products, percutaneous
  angioplasty balloons, and endovenous products. The Neuroscience Portfolio segment
  offers medical devices and implants, biologic solutions, spinal cord stimulation
  and brain modulation systems, implantable drug infusion systems, and interventional
  products, as well as nerve ablation system under the Accurian name. This segment
  offers its products for spinal surgeons, neurosurgeons, neurologists, pain management
  specialists, anesthesiologists, orthopedic surgeons, urologists, urogynecologists,
  and interventional radiologists, as well as ear, nose, and throat specialists, and
  energy surgical instruments. The Medical Surgical Portfolio segment offers surgical
  stapling devices, vessel sealing instruments, wound closure and electrosurgery products,
  AI-powered surgical video and analytics platform, robotic-assisted surgery products,
  hernia mechanical devices, mesh implants, gynecology products, gastrointestinal
  and hepatologic diagnostics and therapies, and therapies to treat diseases and conditions,
  and patient monitoring and airway management products, as well as insulin pumps
  and consumables, continuous glucose monitoring systems, and sensors. Medtronic plc
  was founded in 1949 and is headquartered in Galway, Ireland.'
