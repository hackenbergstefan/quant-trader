longBusinessSummary: West Pharmaceutical Services, Inc. designs, manufactures, and
  sells containment and delivery systems for injectable drugs and healthcare products
  in the Americas, Europe, the Middle East, Africa, and the Asia Pacific. It operates
  in two segments, Proprietary Products and Contract-Manufactured Products. The Proprietary
  Products segment offers stoppers and seals for injectable packaging systems; syringe
  and cartridge components, including custom solutions for the needs of injectable
  drug applications, as well as administration systems that enhance the safe delivery
  of drugs through advanced reconstitution, mixing, and transfer technologies; and
  films, coatings, washing, and vision inspection and sterilization processes and
  services to enhance the quality of packaging products. This segment also provides
  drug containment solutions in the form of vials, syringes, and cartridges; and self-injection
  devices; and a range of integrated solutions, including analytical lab services,
  pre-approval primary packaging support and engineering development, regulatory expertise,
  and after-sales technical support. This segment serves biologic, generic, and pharmaceutical
  drug companies. The Contract-Manufactured Products segment is involved in the design,
  manufacture, and automated assembly of devices used in surgical, diagnostic, ophthalmic,
  injectable, and other drug delivery systems, as well as consumer products. This
  segment primarily serves pharmaceutical, diagnostic, and medical device companies.
  It sells and distributes its products through its sales force and distribution network,
  contract sales agents, and regional distributors. West Pharmaceutical Services,
  Inc. was founded in 1923 and is headquartered in Exton, Pennsylvania.
