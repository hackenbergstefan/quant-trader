longBusinessSummary: NEXT plc engages in the retail of clothing, homeware, and beauty
  products in the United Kingdom, rest of Europe, the Middle East, Asia, and internationally.
  It operates through Retail Stores, Online (UK), Online (International), NEXT Finance,
  Total Platform, and Other Business Activities segments. The company offers NEXT
  branded products; and women's, men's, children's fashion clothing, and accessories;
  and third-party branded products. It also provides consumer credit; services to
  third-party brands, including websites, marketing, warehousing, distribution networks,
  and contact centers; and property management, which holds and leases properties.
  The company operates through retail stores, online retail platforms, and franchise
  stores. The company was formerly known as J Hepworth & Son and changed its name
  to NEXT plc in 1986. NEXT plc was founded in 1864 and is headquartered in Enderby,
  the United Kingdom.
