longBusinessSummary: "D'Ieteren Group SA operates as an investment company in Belgium,\
  \ France, rest of Europe, and internationally. The company operates through D'Ieteren\
  \ Automotive, Belron, Moleskine, TVH, and PHE segments. It is involved in vehicle\
  \ glass repair, replacement, and recalibration under Carglass, Safelite, and Autoglass\
  \ brands; and manages vehicle glass and other insurance claims on behalf of insurance\
  \ customers. The company also distributes Volkswagen, Audi, SEAT, \x8Akoda, Bentley,\
  \ Lamborghini, Bugatti, Cupra, Rimac, Microlino, Maserati and Porsche vehicles,\
  \ as well as spare parts and accessories; markets used vehicles; and provides maintenance,\
  \ financing, and leasing services. In addition, it manages real estate assets, such\
  \ as offices, workshops, concessions, logistics centers, residential units, parking\
  \ lots and landbanks; and offers real estate advice and a range of services to the\
  \ tenants of the properties in the portfolio. Further, the company provides notebooks,\
  \ planners, writing instruments, bags, reading accessories, and smart writing systems\
  \ through wholesale, retail, e-commerce and strategic partnerships. Additionally,\
  \ it distributes aftermarket parts for material handling, construction & industrial,\
  \ and agricultural equipment. The company was founded in 1805 and is based in Brussels,\
  \ Belgium."
