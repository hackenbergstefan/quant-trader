longBusinessSummary: Svenska Handelsbanken AB (publ) provides various banking products
  and services for private and corporate customers primarily in Sweden, the United
  Kingdom, Norway, the Netherlands, and internationally. The company offers personal
  and corporate banking, and financial institutions. It provides green loans, pension,
  advisory, investment and other financing services. In addition, the company's financial
  services, includes asset management, transaction banking, corporate finance, financing,
  markets, trade finance, market information and research services to large corporations;
  trading and execution. Further, it provides cash management, and securities finance
  solutions; and various corporate banking services to small and medium-sized companies
  and large corporates, as well as digital and private banking services. Svenska Handelsbanken
  AB (publ) was incorporated in 1871 and is headquartered in Stockholm, Sweden.
