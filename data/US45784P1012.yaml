longBusinessSummary: Insulet Corporation develops, manufactures, and sells insulin
  delivery systems for people with insulin-dependent diabetes in the United States
  and internationally. The company offers Omnipod platform products comprising Omnipod
  5 automated insulin delivery system, which includes a proprietary AID algorithm
  embedded in the pod that integrates with a third-party continuous glucose monitor
  to obtain glucose values through wireless Bluetooth communication; Omnipod DASH
  insulin management system that features a Bluetooth enabled pod that is controlled
  by a smartphone-like personal diabetes manager with a color touch screen user interface;
  and the Omnipod Insulin Management System. It also provides pods for Amgen for use
  in the Neulasta Onpro kit, which is a delivery system to help reduce the risk of
  infection after intense chemotherapy. The company sells its products to end-users
  through the pharmacy channel; and independent distributors. Insulet Corporation
  was incorporated in 2000 and is headquartered in Acton, Massachusetts.
