longBusinessSummary: Merck & Co., Inc. operates as a healthcare company worldwide.
  It offers human health pharmaceutical for various areas under the Keytruda, Keytruda
  Qlex, Welireg, Gardasil, ProQuad, M-M-R II, Varivax, Vaxneuvance, Capvaxive, RotaTeq,
  Pneumovax 23, Bridion, Prevymis, Dificid, Zerbaxa, Winrevair, Adempas/ Verquvo,
  Ohtuvayre, Lagevrio, Isentress/Isentress HD, Delstrigo, Pifeltro, Belsomra, Januvia,
  and Janumet brands. The company also provides veterinary pharmaceuticals, vaccines
  and health management solutions and services, such as livestock products under the
  Nuflor, Bovilis/Vista, Bovilis Cryptium, Banamine, Estrumate, Matrix, Resflor, Zuprevo,
  Revalor, Safe-Guard, M+Pac, Porcilis, Circumvent, Nobilis/Innovax, Paracox and Coccivac,
  Exzolt, Slice, Imvixa, Clynav, Aquavac/Norvax, Aquaflor, Flexolt brands; Allflex
  Livestock Intelligence solutions; and companion animal products under the Bravecto
  One-Month, Bravecto Injectable/Quantum, Bravecto TriUNO, Bravecto Plus, Sentinel
  Spectrum, Sentinel Flavor Tabs, Numelvi, Optimmune, Nobivac NXT, GilvetMab, Otomax,
  Mometamax, Mometamax Ultra, Posatex, Caninsulin/Vetsulin, Panacur, Safeguard, Regumate,
  Prestige, Scalibor/Exspot, Sure Petcare, and Home Again brands. It has development
  and commercialization agreement for three of Daiichi Sankyo's deruxtecan ADC candidates;
  AstraZeneca PLC to co-development and co-commercialize AstraZeneca's Lynparza products
  for multiple cancer types; licensed to develop, manufacture and commercialize LM-299,
  a novel investigational PD-1/VEGF bispecific antibody from LaNova; and collaboration
  agreement with Eisai Co., Ltd., Bayer AG, and Ridgeback Biotherapeutics LP, as well
  Moderna, Inc. Merck & Co., Inc. has strategic collaboration with Infinimmune, Inc.
  to discover and develop antibodies against multiple therapeutic targets. The company
  was founded in 1891 and is headquartered in Rahway, New Jersey.
