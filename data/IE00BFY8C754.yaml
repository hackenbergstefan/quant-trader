longBusinessSummary: 'STERIS plc provides infection prevention products and services
  in the United States, Ireland, and internationally. It operates through three segments:
  Healthcare, Applied Sterilization Technologies, and Life Sciences. The company offers
  cleaning chemistries and sterility assurance products, automated endoscope reprocessing
  system and tracking products, endoscopy accessories, instruments, washers, and sterilizers
  and other pieces of capital equipment, as well as equipment used directly in the
  procedure rooms, including surgical tables, lights, equipment management services,
  and connectivity solutions; and various preventive maintenance programs, repair
  services, custom process improvement consulting, and outsourced instrument sterile
  processing, as well as instrument, devices, and endoscope repair and maintenance
  services. It also provides process controls and monitoring systems, as well as integrated
  sterilization equipment, such as accelerators, product handling, and automation;
  and sterilization modalities, product development, materials testing, and process
  validation, as well as support services for sterilization equipment and control
  systems comprising installation, preventive maintenance, updates, repairs, and troubleshooting.
  In addition, the company offers pharmaceutical detergents, cleanroom disinfectants
  and sterilants, pharmaceutical grade and research sterilizers and washers, sterility
  assurance and maintenance products, vaporized hydrogen peroxide room decontamination
  systems and sterilizers, and high purity water and pure steam generators; and preventive
  maintenance programs and repair services to support the operation of capital equipment.
  It serves healthcare providers, medical device and pharmaceutical manufacturers,
  biopharmaceutical manufacturing facilities, and hospitals. The company was formerly
  known as New STERIS Limited and changed its name to STERIS plc in November 2015.
  STERIS plc was founded in 1985 and is headquartered in Mentor, Ohio.'
