longBusinessSummary: 'Kenvue Inc. operates as a consumer health company in the United
  States, rest of North America, Europe, the Middle East, Africa, the Asia-Pacific,
  and Latin America. It operates in three segments: Self Care, Skin Health and Beauty,
  and Essential Health. The company offers over-the-counter medicine for cough, cold
  and allergy, pain care, digestive health, smoking cessation, and eye care, as well
  as other naturally inspired and self-care products, digital diagnostics, and telemedicine;
  face and body care, hair, sun, and other care products; oral and baby care, women''s
  health, wound care, and other essential health products; tampons; cosmetics; and
  vitamins and supplements. It sells its products under the Benadryl, Calpol, Motrin,
  Nicorette, Rhinocort, Tylenol, Zarbee''s Naturals, and Zyrtec; Aveeno, Dr.Ci:Labo,
  Le Petit Marseillais, Lubriderm, Neutrogena, OGX, and Rogaine; BAND-AID, Carefree,
  Desitin, Johnson''s, Listerine, o.b., and Stayfree; and ORSL, Clean & Clear, Versalie,
  Benylin, Daktarin, Imodium, Johnson''s Baby, Johnson''s Adult, Maui Moisture, Microlax,
  Motilium, Neosporin, Neostrata, Pepcid, Pulmicort, Regaine, Sudafed, and Visine/Vispring/Visclear
  brands. Kenvue Inc. was incorporated in 2022 and is headquartered in Summit, New
  Jersey.'
