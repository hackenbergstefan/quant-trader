longBusinessSummary: Ameriprise Financial, Inc., together with its subsidiaries, operates
  as a diversified financial services company in the United States and internationally.
  The company offers financial planning and advice services to individual and institutional
  clients. It operates through Advice & Wealth Management, Asset Management, Retirement
  & Protection Solutions, Corporate & Other segments. The Advice & Wealth Management
  segment provides financial planning and advice; brokerage products and services
  for retail and institutional clients; discretionary and non-discretionary investment
  advisory accounts; mutual funds; insurance and annuities products; cash management
  and banking products; and face-amount certificates. The Asset Management segment
  offers investment management, advice, and products to retail, high net worth, and
  institutional clients through third-party financial institutions, advisor network,
  direct retail, and its institutional sales force under the Columbia Threadneedle
  Investments brand name. Its products include U.S. mutual funds and their non-U.S.
  equivalents, exchange-traded funds, variable product funds underlying insurance,
  and annuity separate accounts; and institutional asset management products, such
  as traditional asset classes, separately managed accounts, individually managed
  accounts, collateralized loan obligations, hedge funds, collective funds, and property
  and infrastructure funds. The Retirement & Protection Solutions segment provides
  variable annuity products, as well as life and disability income insurance products
  to retail clients. Ameriprise Financial, Inc. was formerly known as American Express
  Financial Corporation and changed its name to Ameriprise Financial, Inc. in September
  2005. The company was founded in 1894 and is based in Minneapolis, Minnesota.
