longBusinessSummary: 'BE Semiconductor Industries N.V. develops, manufactures, markets,
  sells, and services semiconductor assembly equipment for the semiconductor and electronics
  industries in the Netherlands, Switzerland, Austria, Singapore, Malaysia, and internationally.
  It operates through three segments: Die Attach, Packaging, and Plating. The company
  offers single chip, multi chip, multi module, flip chip, epoxy and soft solder die
  bonding systems, hybrid, TCB and embedded bridge die bonding, die lid attach, and
  fan out wafer level packaging systems; and conventional, ultra-thin and wafer level
  molding, trim and form, and singulation systems. It also provides tin, copper, precious
  metal and solar plating systems, and related process chemicals; and tooling, conversion
  kits, spare parts, and other services. The company sells its products under the
  Fico, Meco, Datacon, and Esec brands. It serves multinational chip manufacturers,
  foundries, assembly subcontractors and electronics, and industrial companies. BE
  Semiconductor Industries N.V. was incorporated in 1995 and is headquartered in Duiven,
  the Netherlands.'
