longBusinessSummary: Invesco Ltd. is a publicly owned investment manager. The firm
  provides its services to retail clients, institutional clients, high-net worth clients,
  public entities, corporations, unions, non-profit organizations, endowments, foundations,
  pension funds, financial institutions, and sovereign wealth funds. It manages separate
  client-focused equity and fixed income portfolios. The firm also launches equity,
  commodity, fixed income, multi-asset, and balanced mutual funds for its clients.
  It launches equity, fixed income, multi-asset, and balanced exchange-traded funds.
  The firm also launches and manages private funds. It invests in the public equity
  and fixed income markets across the globe. The firm prefers to invest between $5
  million and $15 million in companies. The firm also invests in alternative markets,
  such as commodities and currencies. For the equity portion of its portfolio, it
  invests in growth and value stocks of large-cap, mid-cap, and small-cap companies.
  For the fixed income portion of its portfolio, the firm invests in convertibles,
  government bonds, municipal bonds, treasury securities, and cash. It also invests
  in short term and intermediate term bonds, investment grade and high yield bonds,
  taxable and tax-free bonds, senior secured loans, and structured securities such
  as asset-backed securities, mortgage-backed securities, and commercial mortgage-backed
  securities. The firm employs absolute return, global macro, and long/short strategies.
  It employs quantitative analysis to make its investments. The firm was formerly
  known as Invesco Plc, AMVESCAP plc, Amvesco plc, Invesco PLC, Invesco MIM, and H.
  Lotery & Co. Ltd. Invesco Ltd. was founded in 1935 and is based in Atlanta, Georgia
  with an additional office in Asia, Europe, Africa and North America.
