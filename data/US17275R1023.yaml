longBusinessSummary: Cisco Systems, Inc. designs, develops, and sells technologies
  to power, help, secure, and draw insights from the internet in the Americas, Europe,
  the Middle East, Africa, the Asia Pacific, Japan, and China. The company provides
  data center switching; network security, identity and access management, and secure
  access service edge; identity and agentic security solutions; interconnects public
  and private wireline and mobile networks, delivering connectivity to campus, data
  center, and branch networks; WEBEX suite, collaboration devices, and contact center;
  communication platform as a service software, including perpetual licenses, subscription
  arrangements, and hardware solutions; network assurance and observability suite;
  accelerated issue resolution, software support, and hardware replacement; professional
  services, such as planning, design, implementation, and high-value consulting; service
  and support packages, financing, and managed network services; and regional, national,
  and international wireline carriers, webscale products, internet, and cable. It
  also provides wireless products, including indoor and outdoor coverage designed
  for seamless roaming use of voice, video, and data applications; end-to-end collaboration
  solutions through cloud, on-premise, or within hybrid cloud environments. In addition,
  it offers technical support services. The company serves businesses, public institutions,
  governments, and service providers. It sells its products and services directly,
  through systems integrators, service providers, and resellers, and distributors.
  It has a collaboration with NVIDIA Corporation to develop Ultra-Dense Small Form
  Factor Pluggable (USFP), a high-density optical module pluggable transceiver. Cisco
  Systems, Inc. was incorporated in 1984 and is headquartered in San Jose, California.
