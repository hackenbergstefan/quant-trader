longBusinessSummary: Engie SA engages in renewables and decentralized and low-carbon
  energy networks in France, Europe, North America, Asia, the Middle East, Oceania,
  South America, Africa, and internationally. The Renewables & Flex Power segment
  comprises renewable energy generation activities, including financing, construction,
  operation, and maintenance of renewable energy, such as hydroelectric, onshore wind,
  photovoltaic solar, biomass, offshore wind, geothermal, and battery storage. It
  also offers flexible thermal generation and electricity, pumping, and battery storage
  facilities; solutions for decarbonizing industry with low-carbon hydrogen; and operation
  of desalination plants. The Networks segment comprises the gas and power infrastructure
  activities, including the management and development of gas and electricity transportation
  networks and natural gas distribution networks in and outside of Europe, natural
  gas underground storage, and regasification infrastructure. The Local Energy Infrastructures
  provides the construction and management of decentralized energy networks, including
  heating and cooling networks, distributed power generation plants, distributed solar
  power parks, low-carbon mobility, low-carbon cities and public lighting, energy
  efficiency, technical maintenance, and sustainable development consulting. The Supply
  & Energy Management segment optimizes the Group's energy assets, manages market
  and portfolio risks, and supplies natural gas, green and low-carbon gas, and electricity
  to residential, business, industrial customers, develops green energy contracts,
  and digital consumption management. The Other segment manages nuclear power production
  and holds drawing rights, focusing on operational management, safety, and decommissioning.
  It offers renewable electricity, green gas, energy management. The company was formerly
  known as GDF SUEZ S.A. and changed its name to Engie SA in April 2015. Engie SA
  was founded in 1880 and is based in La Garenne-Colombes, France.
