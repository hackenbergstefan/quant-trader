longBusinessSummary: Barry Callebaut AG, together with its subsidiaries, engages in
  the manufacture and sale of chocolate and cocoa products in Western Europe, North
  America, Central and Eastern Europe, Latin America, and internationally. It operates
  in two segments, Global Chocolate and Global Cocoa. It offers chocolates, chips
  and chunks, cocoa, cacao fruit, fillings, coatings, nuts, decorations and inclusions,
  and food colorants, as well as beverage products for vending machines. The company
  is also involved in the sourcing of ingredients for chocolate production and cocoa-processing
  business, as well as offers dairy products and drinks, ice cream, and desserts.
  In addition, it provides centralized treasury and management services, captive reinsurance,
  research and development services, and conference and training services through
  CHOCOLATE ACADEMY centers. The company markets its products under the American Almond,
  Barry Callebaut, Cacao Barry, Cacaofruit, Callebaut, Caprimo, Carma, Dings Décor,
  Gertrude Hawk Ingredients, Mona Lisa, Van Houten, and Van Leer Chocolates brands.
  It serves food manufacturers and artisans, as well as professional users of chocolate,
  including chocolatiers, pastry chefs, bakers, hotels, restaurants and caterers.
  Barry Callebaut AG was founded in 1996 and is headquartered in Zurich, Switzerland.
