longBusinessSummary: Metlen Energy & Metals PLC operates as an industrial and energy
  company focusing on the metals and energy sectors worldwide. The company engages
  in the development, construction, and operation of thermal power plants; and design
  and construction of electricity infrastructure projects. It also develops RES and
  energy storage projects; manages power generation and energy plants; and retails
  electricity and natural gas supply. In addition, the company engages in the procurement
  and management of natural gas and other energy products for large B2B corporate
  clients; and develops large-scale energy projects for electricity production and
  energy transition. Further, it extracts, processes, and refines alumina, aluminium,
  bauxite, and various metals and minerals. Additionally, the company undertakes various
  infrastructure construction projects, such as roadworks, buildings, and railway
  and port projects, as well as solid and liquid waste management projects; and designs,
  constructs, operates, finances, and maintains infrastructure, building, environmental,
  hydraulic, and technology and energy projects. Metlen Energy & Metals PLC was founded
  in 1908 and is headquartered in Athens, Greece.
