longBusinessSummary: 'Tyson Foods, Inc., together with its subsidiaries, operates
  as a food products company worldwide. It operates through four segments: Beef, Pork,
  Chicken, and Prepared Food products. The company processes live fed cattle and hog;
  fabricates dressed beef and pork carcasses into primal and sub-primal meat cuts,
  as well as case ready beef and pork, and fully cooked meats; raises and processes
  chicken into fresh, frozen, and value-added chicken products, including breaded
  chicken strips, nuggets, patties, and other ready-to-fix or fully cooked chicken
  parts; and supplies poultry breeding stock. It also manufactures and markets frozen
  and refrigerated food products, including ready-to-eat sandwich, flame-grilled hamburger,
  Philly steak, pepperoni, bacon, breakfast sausage, turkey, lunchmeat, hot dogs,
  flour and corn tortilla products, appetizers, snacks, prepared meals, ethnic foods,
  side dishes, meat dishes, breadstick, and processed meats under the Tyson, Jimmy
  Dean, Hillshire Farm, Ball Park, Wright, Aidells, Gallo Salame, ibp, and State Fair
  brands. The company sells its products through its sales staff to grocery retailers,
  grocery wholesalers, meat distributors, warehouse club stores, military commissaries,
  industrial food processing companies, chain restaurants or their distributors, live
  markets, international export companies, and domestic distributors who serve restaurants
  and food service operations, such as plant and school cafeterias, convenience stores,
  hospitals, and other vendors, as well as through independent brokers and trading
  companies. The company has a strategic alliance with Allied Beef Company to establish
  a long-term partnership to strengthen domestic cattle supply. Tyson Foods, Inc.
  was founded in 1935 and is headquartered in Springdale, Arkansas.'
