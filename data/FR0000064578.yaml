longBusinessSummary: 'Covivio is drawing on its history of partnership, its property
  expertise and its European culture, Covivio is shaping today''s user experience
  and designing the city of tomorrow. As a leading property player operating primarily
  at European level, Covivio builds close relationships with end users, understands
  their aspirations, combines working, travelling and living, and collaborates in
  creating vibrant spaces. As a leading European operator with 24.2 Bn euro in assets
  under management, Covivio supports businesses, hotel brands and local authorities
  in addressing their challenges relating to attractiveness, transformation and responsible
  performance. Building well-being and lasting connections is Covivio''s raison d''être,
  which defines its role as a responsible property operator towards all its stakeholders:
  clients, shareholders and financial partners, internal teams, local authorities
  and future generations. Furthermore, its dynamic approach to property opens up exciting
  project opportunities and career paths for its teams. Covivio was incorporated in
  1963 and is incorporated in France.'
