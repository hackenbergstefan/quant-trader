longBusinessSummary: 'QinetiQ Group plc provides science and technology solution in
  the defense, security, and infrastructure markets in the United States, Australia,
  Canada, and Germany. The company operates through four segments: Test and Training;
  Mission Support and Operations; Research and Development; and Engineering Services.
  It offers test and evaluation, training and simulation, mission rehearsal, and threat
  representation; cyber and intelligence capabilities, mission data, and persistent
  surveillance. The company also provides advanced materials, AI and Analytics, autonomous
  systems, cyber and electromagnetic spectrum, directed energy systems, human factors
  integration, immersive technology, navigation and communication systems, quantum
  technology, secure communication solutions, and sensing and processing systems.
  It serves ministry of defense, government agencies, department of defense and commercial
  sectors. QinetiQ Group plc was founded in 2001 and is based in Farnborough, the
  United Kingdom.'
