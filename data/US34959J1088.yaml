longBusinessSummary: Fortive Corporation designs, develops, manufactures, and markets
  products, software, and services in the United States, China, and internationally.
  It operates through Intelligent Operating Solutions and Advanced Healthcare Solutions
  segments. The Intelligent Operating Solutions segment provides advanced instrumentation,
  software, and services, including maintenance, repair, measurement and condition
  monitoring, facility and asset lifecycle software applications, and connected worker
  safety and compliance solutions for manufacturing, process industries, healthcare,
  utilities and power, communications and electronics, and other industries. This
  segment markets its products and services under the ACCRUENT, FLUKE, GORDIAN, INDUSTRIAL
  SCIENTIFIC, INTELEX, and SERVICECHANNEL brand names. The Advanced Healthcare Solutions
  segment provides critical workflow solutions comprising instrument sterilization,
  instrument tracking, biomedical test tools, radiation detection and safety monitoring,
  and end-to-end clinical productivity software and solutions under the ASP, CENSIS,
  FLUKE BIOMEDICAL, LANDAUER, and PROVATION brand names. Fortive Corporation was incorporated
  in 2015 and is headquartered in Everett, Washington.
