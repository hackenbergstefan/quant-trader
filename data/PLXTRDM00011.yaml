longBusinessSummary: XTB S.A., together with its subsidiaries, provides ETF, currency
  derivatives, commodities, indices, stocks, and bonds brokerage services in Central
  and Eastern Europe, Western Europe, Latin America, and the Middle East. It operates
  in two segments, Retail Operations and Institutional Activity. The Retail operations
  segment engages in the provision of trading in financial instruments for individual
  customers. The Institutional Activity segment involves the provision of trading
  in financial instruments and offering trade infrastructure to entities that provide
  services of trading in financial instruments for own customers under own brand.
  The company was formerly known as X-Trade Brokers Dom Maklerski Spólka Akcyjna and
  changed its name to XTB S.A. in January 2022. XTB S.A. was founded in 2002 and is
  headquartered in Warsaw, Poland. XTB S.A. operates as a subsidiary of XXZW Investment
  Group S.A.
