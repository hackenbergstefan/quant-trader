longBusinessSummary: Givaudan SA engages in the manufacture, supply, and sale of fragrance,
  beauty, taste, and wellbeing products to the consumer goods industry. It operates
  in two divisions, Fragrance & Beauty, and Taste & Wellbeing. The Fragrance & Beauty
  division offers fine fragrances; consumer products, such as personal, home, fabric,
  and oral care; fragrance ingredients; and active beauty products. The Taste & Wellbeing
  division provides beverages, such as fizzy drinks, bottled waters, ready-to-drink
  juices, and alcoholic drinks; dairy and cheese products, including dairy drinks,
  yoghurt, ice cream, chilled desserts, cream cheese, and spreads; snacks; givaudan
  flavour ingredients; savory, and supplements and nutraceutical products; and biscuits,
  crackers, and cereals, as well as confectionery products, such as chewing gums,
  chocolates, and sweets. It operates in Switzerland, Europe, Africa, the Middle East,
  North America, Latin America, and the Asia Pacific. Givaudan SA was founded in 1796
  and is headquartered in Vernier, Switzerland.
