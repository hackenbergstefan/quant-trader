longBusinessSummary: Rosebank Industries plc engages in supply of low-voltage electrical
  distribution systems, control box assemblies, and engineered components in Jersey,
  North America, Europe, the Middle East, Asia, Pacific, and internationally. The
  company operates through Electrification & Industrial; and Appliance & HVAC segments.
  It provides industrial automation, electrified mobility, and energy transition technologies,
  includes wire harnesses, complex control box assemblies, and engineered components
  for electric vehicles, robotics, data centres, AI, and other industrial applications.
  The company also offers smart control components for home and commercial appliances,
  and wire harnesses. Rosebank Industries plc was founded in 2003 and is based in
  Saint Helier, Jersey.
