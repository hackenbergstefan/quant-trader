longBusinessSummary: Ferrari N.V., through its subsidiaries, engages in design, engineering,
  production, and sale of luxury performance sports cars worldwide. It offers sports,
  track, one-off, and road cars, as well as supercars. The company also provides spare
  parts and engines, as well as after sales, repair, maintenance, and restoration
  services for cars; and licenses its Ferrari brand to various producers and retailers
  of luxury and lifestyle goods. In addition, it operates Ferrari museums in Modena
  and Maranello; Il Cavallino restaurant in Maranello; and theme parks in Abu Dhabi
  and Spain. Further, the company provides direct or indirect finance and leasing
  services; range of financial and ancillary services; special financing arrangements;
  and operates franchised and owned Ferrari stores. The company was founded in 1947
  and is headquartered in Maranello, Italy.
