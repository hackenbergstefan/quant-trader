longBusinessSummary: 'Abbott Laboratories, together with its subsidiaries, discovers,
  develops, manufactures, and sells health care products worldwide. It operates in
  four segments: Established Pharmaceutical Products, Diagnostic Products, Nutritional
  Products, and Medical Devices. The company offers generic pharmaceuticals for the
  treatment of pancreatic exocrine insufficiency, irritable bowel syndrome or biliary
  spasm, intrahepatic cholestasis or depressive symptoms, gynecological disorder,
  hormone replacement therapy, dyslipidemia, hypertension, hypothyroidism, hypertriglyceridemia,
  Ménière''s disease and vestibular vertigo, pain, fever, inflammation, and migraine,
  as well as provides anti-infective clarithromycin, influenza vaccine, and products
  to regulate physiological rhythm of the colon. It also provides laboratory and transfusion
  medicine systems in the areas of immunoassay, clinical chemistry, hematology, and
  transfusion serology testing; molecular diagnostics polymerase chain reaction instrument
  systems that automate the extraction, purification, and preparation of DNA and RNA
  from patient samples, and detect and measure infectious agents; point of care systems;
  cartridges for testing blood gas, chemistry, electrolytes, coagulation, and immunoassay;
  rapid diagnostics lateral flow testing products; molecular point-of-care testing
  for HIV, SARS-CoV-2, influenza A and B, RSV, and strep A; cardiometabolic test systems;
  and drug and alcohol test. In addition, the company offers pediatric and adult nutritional
  products and infant formula; rhythm management, electrophysiology, heart failure,
  vascular, and structural heart devices for the treatment of cardiovascular diseases;
  diabetes care products, such as glucose and blood glucose monitoring systems; and
  neuromodulation devices. The company was formerly known as Abbott Alkaloidal Company
  and changed its name to Abbott Laboratories in 1915. Abbott Laboratories was founded
  in 1888 and is based in Abbott Park, Illinois.'
