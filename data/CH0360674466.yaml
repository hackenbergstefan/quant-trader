longBusinessSummary: Galenica AG provides healthcare services in Switzerland and internationally.
  It operates through two segments, Products & Care, and Logistics & IT. The Products
  & Care segment operates and manages pharmacies and partner pharmacies under the
  Amavita, Sun Store, and Coop Vitality brands, as well as covers specialty pharmacy
  mediservice. This segment also offers medication for treatment of patients at home;
  laboratory medicine, pathology and specialized personalized diagnostic services;
  and develops, markets, and sells healthcare services and products through various
  distribution channels. The Logistics & IT segment provides various specialized pre-wholesale
  services, including storage, distribution, and debt collection to pharmaceutical
  and healthcare companies. This segment also offers master data systems for the healthcare
  market; develops management solutions for the healthcare market; and publishes printed
  and electronic technical information on pharmaceutical products, as well as offers
  complete management solutions for pharmacies. In addition, it provides on-schedule
  delivery services to pharmacies, drugstores, doctors, hospitals, and care homes.
  The company was founded in 1927 and is headquartered in Bern, Switzerland.
