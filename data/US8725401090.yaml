longBusinessSummary: 'The TJX Companies, Inc., together with its subsidiaries, operates
  as an off-price apparel and home fashions retailer worldwide. It operates through
  four segments: Marmaxx, HomeGoods, TJX Canada, and TJX International. The company
  provides family apparel comprising footwear; accessories, such as beauty and jewelry;
  home fashion products, including home basics, decorative accessories and giftware,
  as well as furniture, rugs, lighting, soft home, decorative accessories, tabletop,
  and cookware; pet and gourmet food; and other merchandise. It also offers home decor,
  furniture, and seasonal home merchandise. The company sells its products through
  stores and e-commerce sites. The TJX Companies, Inc. was incorporated in 1962 and
  is headquartered in Framingham, Massachusetts.'
