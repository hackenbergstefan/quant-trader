longBusinessSummary: Stanley Black & Decker, Inc. provides hand tools, power tools,
  outdoor products, and related accessories in the United States, Canada, Other Americas,
  Europe, and Asia. Its Tools & Outdoor segment offers professional grade corded and
  cordless electric power tools and equipment, including drills, impact wrenches and
  drivers, grinders, saws, routers, concrete prep and placement tools, and sanders;
  pneumatic tools and fasteners; corded and cordless electric power tools; household
  power tools, hand-held vacuums, and small appliances; leveling and layout tools,
  planes, hammers, demolition tools, clamps, vises, knives, saws, chisels, and industrial
  and automotive tools; drill, screwdriver, router bits, abrasives, saw blades, and
  threading products; tool boxes, sawhorses, medical cabinets, and engineered storage
  solutions; and electric and gas-powered lawn and garden products. This segment sells
  its products under the DEWALT, CRAFTSMAN, CUB CADET, STANLEY, BLACK+DECKER, and
  HUSTLER brands through retailers, third-party distributors, independent dealers,
  and a direct sales force. Its Industrial segment provides threaded fasteners, blind
  rivets and tools, blind inserts and tools, drawn arc weld studs and systems, engineered
  plastic and mechanical fasteners, self-piercing riveting systems, precision nut
  running systems, micro fasteners, high-strength structural fasteners, axel swage,
  latches, heat shields, pins, couplings, fitting, and other engineered products.
  This segment sells its products through direct sales force and third-party distributors
  to the automotive, manufacturing, electronics, construction, aerospace, and other
  industries. Stanley Black & Decker, Inc. has a strategic partnership with I4F Licensing
  Nv. The company was formerly known as The Stanley Works and changed its name to
  Stanley Black & Decker, Inc. in March 2010. The company was founded in 1843 and
  is headquartered in New Britain, Connecticut.
