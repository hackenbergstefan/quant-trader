longBusinessSummary: 'thyssenkrupp AG, together with its subsidiaries, provides industrial
  and technology solutions and services in Germany and internationally. The company
  operates in five segments: Automotive Technology, Decarbon Technologies, Materials
  Services, Steel Europe, and Marine Systems. It offers axle assembly and logistics,
  body in white, camshafts and electric engine components, carValoo, dampers, dies,
  plant engineering for batteries and powertrain, prototypes, serial production, springs
  and stabilizers, steering, crankshafts and conrods, thermal management, and undercarriages,
  as well as systems, automation, and mechatronic solutions; and slewing bearings
  and rings, chemical plants, coke plant technologies, green ammonia, methanol, and
  hydrogen, high-pressure processing, refinery services and cement plants. The company
  also provides alloys, logistics services, industrial minerals, material services,
  nonferrous metals, plastics, and stainless steel; composite materials, cut-to-length
  sheet products, electrical and packaging steel, hot and precision steel strips,
  organic coated strips and sheets, and sheet and coated products; and naval services,
  surface vessels, and submarines. It serves automotive, chemicals, energy generation
  and distribution, food and beverages, white goods, aerospace, mechanical and plant
  engineering, oil and gas, shipbuilding, and special vehicles, as well as construction,
  infrastructure, and buildings industries. In addition, The company operates as global
  materials distributor and technical and infrastructural service provider The company
  was founded in 1811 and is headquartered in Essen, Germany.'
