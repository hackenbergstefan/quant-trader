longBusinessSummary: Ørsted A/S, together with its subsidiaries, owns, develops, constructs,
  and operates offshore and onshore wind farms, solar farms, and energy storage and
  combined heat and power (CHP) plants. It operates through Offshore, Onshore, and
  Bioenergy & Other segments. The Offshore segment owns, develops, constructs, and
  operates offshore wind farms in Europe, the United States, and the Asia-Pacific
  region. The Onshore segment owns, develops, constructs, and operates onshore wind
  and solar farms in the United States, including integrated storage. The Bioenergy
  & Other segment generates heat and power and offers ancillary services from CHP
  plants in Denmark; and optimizes its gas portfolio, as well as manages its Danish
  and Swedish B2B business. The company was formerly known as DONG Energy A/S and
  changed its name to Ørsted A/S in November 2017. Ørsted A/S was incorporated in
  1972 and is based in Fredericia, Denmark.
