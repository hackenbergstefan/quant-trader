longBusinessSummary: Hera S.p.A., a multi-utility company, engages in the waste management,
  water services, and energy businesses in Italy. It is involved in the sale and distribution
  of methane and natural gas, as well as in the district heating and heating management
  business; generation, distribution, and sale of electricity; aqueduct, purification,
  and sewage services related to water cycle; waste collection, treatment, recycling,
  and disposal services; and provision of public lighting, telecommunications, and
  other services. The company's water services include activities related to water
  collection, drinking water treatment, and distribution for civil and industrial
  applications, as well as sewerage and sewage treatment activities. It also offers
  environmental services comprising sweeping, waste collection, transport, and recovery
  and disposal, and technical call center services. The company serves residential
  and business customers, as well as consumer associations. Hera S.p.A. was founded
  in 2002 and is based in Bologna, Italy.
