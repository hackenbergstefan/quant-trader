longBusinessSummary: EDP Renewables, S.A. engages in the renewable energy business
  in Europe, North America, South America, and the Asia Pacific. The company is involved
  in the planning, construction, operation, and maintenance of power generation plants
  using renewable energy sources, including wind and solar power. It operates in Spain,
  Portugal, Belgium, France, Italy, Germany, the Netherlands, Poland, Romania, the
  United Kingdom, Hungary, Greece, the United States, Canada, Mexico, Brazil, Chile,
  South Korea, Singapore, Vietnam, Thailand, China, Taiwan, Australia, and Japan.
  EDP Renewables, S.A. was formerly known as EDP Renováveis, S.A. and changed its
  name to EDP Renewables, S.A. in April 2026. The company was incorporated in 2007
  and is headquartered in Madrid, Spain. EDP Renewables, S.A. operates as a subsidiary
  of EDP, S.A.
