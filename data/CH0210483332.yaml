longBusinessSummary: Compagnie Financière Richemont SA, an investment holding company,
  engages in the luxury goods business. The company operates through Jewellery Maisons,
  Specialist Watchmakers, and Other segments. It is involved in the design, manufacture,
  and distribution of jewelry products, precision timepieces, watches, writing instruments,
  clothing, and leather goods and accessories. The company provides its products under
  the Cartier, Van Cleef & Arpels, Vhernier, Buccellati, A. Lange & Söhne, Baume &
  Mercier, IWC Schaffhausen, Jaeger-LeCoultre, Panerai, Piaget, Roger Dubuis, Vacheron
  Constantin, Alaïa, Chloé, Delvaux, dunhill, G/FORE, Gianvito Rossi, Montblanc, Peter
  Millar, Purdey, Serapian, Watchfinder&Co., TIMEVALLEE, and brand names through retail
  online retail, and wholesale distribution channels. It offers its products in France,
  the United Kingdom, Italy, Switzerland, rest of Europe, the United Arab Emirates,
  rest of the Middle East, Africa, China, Hong Kong, Macau, Japan, South Korea, rest
  of Asia, the United States, and rest of the Americas. The company was incorporated
  in 1979 and is headquartered in Bellevue, Switzerland.
