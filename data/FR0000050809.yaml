longBusinessSummary: Sopra Steria Group SA provides consulting, digital, and software
  development services in France and internationally. The company offers digital transformation
  consulting services; artificial intelligence; technology services in the field of
  artificial intelligence, blockchain, cloud, data, internet of things, digital interactions,
  emerging technologies, 5G design center, industrial metaverse, and intelligent process
  automation; systems integration comprising smart application modernization and product
  lifecycle management; infrastructure management services, including consulting,
  cloud, end-user support, digital workplace, and legacy services; and cybersecurity
  services. It also provides software solution, such as HR solutions and innovations,
  and property management solutions; and information warfare solutions. In addition,
  the company offers business process services, such as creation or on-boarding, and
  operation of multi-function shared services; and operation of finance and administration,
  and human resource functions, as well as operation of specialized industry-specific
  business processes comprising operating and executing services in police control
  rooms, managing compliance in financial services, and managing customer services
  for large utilities. It serves aerospace, defense and security, energy and utilities,
  financial services, insurance and social, government, retail, telecommunication,
  media and entertainment, space, and transport industries. The company was formerly
  known as Sopra Group and changed its name to Sopra Steria Group SA in September
  2014. Sopra Steria Group SA was incorporated in 1968 and is headquartered in Paris,
  France.
