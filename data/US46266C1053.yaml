longBusinessSummary: 'IQVIA Holdings Inc. provides clinical research services, commercial
  insights, and healthcare intelligence to the life sciences and healthcare industries
  in the Americas, Europe, Africa, and the Asia-Pacific. It operates through three
  segments: Technology & Analytics Solutions, Research & Development Solutions, and
  Contract Sales & Medical Solutions. The Technology & Analytics Solutions segment
  offers a range of cloud-based applications and associated implementation services;
  real world solutions that enable life sciences and provider customers to generate
  and disseminate evidence, which informs health care decision making and improves
  patients'' outcomes; and strategic and implementation consulting services, such
  as advanced analytics and commercial processes outsourcing services. This segment
  also provides country level performance metrics related to sales of pharmaceutical
  products, prescribing trends, medical treatment, and promotional activity across
  various channels, including retail, hospital, and mail order; and measurement of
  sales or prescribing activity at the regional, zip code, and individual prescriber
  level. The Research & Development Solutions segment offers project management and
  clinical monitoring; clinical trial support; strategic planning and design services;
  and patient and site centric solutions, as well as central laboratory, genomic,
  bioanalytical, ADME, discovery, vaccine and biomarker laboratory services. The Contract
  Sales & Medical Solutions segment provides health care provider and patient engagement
  services, and scientific strategy and medical services. It serves pharmaceutical,
  biotechnology, device and diagnostic, and consumer health companies. The company
  has a strategic collaboration with Kexing Biopharm Co., Ltd. for biosimilar development.
  The company was formerly known as Quintiles IMS Holdings, Inc. and changed its name
  to IQVIA Holdings Inc. in November 2017. IQVIA Holdings Inc. is based in Durham,
  North Carolina.'
