longBusinessSummary: Banca Generali S.p.A. distributes financial products and services
  for high net worth, affluent and private customers through financial advisors in
  Italy. The company operates through Private Banking CGU (PB CGU) and Senior Partner
  CGU (SP CGU) segments. It offers banking accounts and services comprising current
  and deposit accounts, other bespoke banking, and payment services; custody and administration
  services for the financial instruments; advisory services on the purchase and sale
  of instruments on the primary and secondary markets; asset management services,
  such as mutual investment funds, in-house products, and portfolio management solutions;
  distributes insurance products; and insurance investments. The company also provides
  wealth advisory services, including corporate advisory, which supports companies'
  growth and extraordinary finance transactions; real estate advisory, focused on
  the valuation and management of real estate; art and passion Advisory, dedicated
  to works of art and collectibles; and family protection and planning, which provides
  advice on wealth protection, transfer, and generational continuity for family and
  business assets. The company was founded in 1997 and is headquartered in Milan,
  Italy. Banca Generali S.p.A. is a subsidiary of Assicurazioni Generali S.p.A.
