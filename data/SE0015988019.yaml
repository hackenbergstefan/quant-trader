longBusinessSummary: NIBE Industrier AB (publ), together with its subsidiaries, develops,
  manufactures, markets, and sells energy-efficient solutions for indoor climate comfort,
  and components and solutions for intelligent heating and control. It operates through
  NIBE Climate Solutions, NIBE Element, and NIBE Stoves business areas. The NIBE Climate
  Solutions business area offers indoor climate comfort products, such as heat pumps,
  water heaters, refrigeration systems, accumulator tanks, ventilation systems, climate
  control systems, and district heating products for homes, apartment blocks, and
  commercial properties. The NIBE Element business area provides various components
  and solutions for heating and control, which include tubular, aluminum, foil, thick
  film, PTC, high-power, and ceramic elements, as well as opena spirals and tapes,
  heating cables and jackets, vacuum brazing, heat pump technology, resistors, heat
  exchangers, temperature sensors, heating cables, flexible hoses, and control equipment
  to domestic and household appliances; professional kitchens and the refrigeration
  industry; energy; transport; and advanced technology, as well as aviation sectors.
  The NIBE Stoves business area offers free-standing, wood-burning, gas, and electric
  stoves; heat-retaining products; and chimney systems, as well as inserts, fireplace
  cassettes, outdoor stoves, and accessories. It operates in Nordic countries, rest
  of Europe, North America, and internationally. The company was founded in 1949 and
  is headquartered in Markaryd, Sweden.
