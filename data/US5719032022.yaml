longBusinessSummary: Marriott International, Inc. engages in the operation, franchising,
  and licensing of hotel, residential, timeshare, and other lodging properties in
  the United States, Canada, Europe, the Middle East, Africa, Greater China, the Asia-Pacific,
  and internationally. The company operates properties under the JW Marriott, The
  Ritz-Carlton, The Luxury Collection, W Hotels, St. Regis, EDITION, Bvlgari, Marriott
  Hotels, Sheraton, Westin, Autograph Collection, Renaissance Hotels, Le Méridien,
  Delta Hotels by Marriott, MGM Collection with Marriott Bonvoy, Tribute Portfolio,
  Gaylord Hotels, Design Hotels, Marriott Executive Apartments, Apartments by Marriott
  Bonvoy, Courtyard by Marriott, Fairfield by Marriott, Residence Inn by Marriott,
  SpringHill Suites by Marriott, Four Points by Sheraton, TownePlace Suites by Marriott,
  Aloft Hotels, AC Hotels by Marriott, Moxy Hotels, Element Hotels, Protea Hotels
  by Marriott, citizenM, City Express by Marriott, and Four Points Flex by Sheraton
  brands. It also operates residences, timeshares, and yachts. The company was formerly
  known as New Marriott MI, Inc. and changed its name to Marriott International, Inc.
  in May 1998. Marriott International, Inc. was founded in 1927 and is headquartered
  in Bethesda, Maryland.
