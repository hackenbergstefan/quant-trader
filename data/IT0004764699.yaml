longBusinessSummary: Brunello Cucinelli S.p.A., together with its subsidiaries, engages
  in the production and sale of clothing, accessories, and lifestyle products in Italy,
  Europe, the United States, and Asia. The company offers women's collection, including
  coats and jackets, blazers, knitwear, jumpsuits, dresses, t-shirts and tops, shirts,
  skirts, pants, denim, beach and travel wear, and matching sets; sneakers, heels,
  boots, loafers, sandals, and flat shoes; hats, belts, eyewear, jewelry, scarves,
  leather goods, and other accessories; mini bags and clutches; crossbody bags and
  backpacks; and handbags and shoppers. It also provides men's collection, such as
  coats and jackets, knitwear, blazers, suits, tuxedos, t-shirts and polos, shirts,
  pants, denim, travel and beach wear, and ready-to-wear products; sneakers, lace-ups,
  loafers, slides and flip-flops, espadrilles, leisure products, and other shoes;
  leather goods, bags, hats, belts, scarves; other accessories; and kids, fragrance,
  and gift products. In addition, the company offers lifestyle products, which include
  throws and blankets, cushions, studio products, candles and fragrances, travel essentials,
  décor sets, bathrobes and towels, leisure wear, kitchen and tableware, and dining
  and ceramic creation products. It sells its products through directly operated stores,
  hard shops, single-brand stores, independent multi-brand points of sale, and dedicated
  shop-in-shops in department stores, as well as online under the Brunello Cucinelli
  brand. Brunello Cucinelli S.p.A. was founded in 1978 and is headquartered in Solomeo,
  Italy. Brunello Cucinelli S.p.A. is a subsidiary of Fedone S.R.L.
