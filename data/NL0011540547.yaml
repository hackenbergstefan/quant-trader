longBusinessSummary: 'ABN AMRO Bank N.V. provides various banking products and financial
  services to retail, private, and corporate banking clients in the Netherlands, rest
  of Europe, the United States, Asia, and internationally. It operates through three
  segments: Personal & Business Banking, Wealth Management, and Corporate Banking.
  The company offers fixed deposits; home improvement; mortgage products; investment
  products; and car, home travel, and legal expenses insurances. It also provides
  pension savings; asset-based solutions, including working capital solutions, equipment
  leases, equipment loans and vendor lease services, clearing services, equity brokerage
  services, payment and credit cards services; and internet and online banking. The
  company was incorporated in 2009 and is headquartered in Amsterdam, the Netherlands.
  ABN AMRO Bank N.V. operates as a subsidiary of Stichting Administratiekantoor Continuïteit
  Abn Amro Bank.'
