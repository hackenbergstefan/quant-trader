longBusinessSummary: 'Textron Inc. operates in the aircraft, defense, industrial,
  and finance businesses worldwide. It operates in six segments: Textron Aviation,
  Bell, Textron Systems, Industrial, Textron eAviation, and Finance. The Textron Aviation
  segment manufactures, sells, and services business jets, turboprop and piston engine
  aircraft, and military trainer and defense aircraft, as well as offers maintenance,
  inspection, and repair services; commercial parts; and advanced flight training
  devices. The Bell segment supplies military and commercial helicopters, tiltrotor
  aircraft, and related spare parts and services. The Textron Systems segment offers
  unmanned aircraft systems, electronic systems and solutions, advanced marine crafts,
  piston aircraft engines, live military air-to-air and air-to-ship training, weapons
  and related components, and armored and specialty vehicles. The Industrial segment
  offers blow-molded solutions, including conventional plastic fuel tanks and pressurized
  fuel tanks; plastic tanks for catalytic reduction systems and other fuel system
  components; lightweight and composite pentatonic battery systems for use in electric
  vehicles primarily to automobile original equipment manufacturers; and golf cars,
  off-road utility vehicles, powersports products, light transportation vehicles,
  aviation ground support equipment, professional turf-maintenance equipment, and
  turf-care vehicles to golf courses and resorts, government agencies and municipalities,
  consumers, outdoor enthusiasts, and commercial and industrial users. The Textron
  eAviation segment manufactures and sells light aircraft and gliders with electric
  and combustion engines; and provides other research and development initiatives
  related to sustainable aviation solutions. The Finance segment offers financing
  services to purchase new and pre-owned aviation aircraft and Bell helicopters. Textron
  Inc. was founded in 1923 and is headquartered in Providence, Rhode Island.'
