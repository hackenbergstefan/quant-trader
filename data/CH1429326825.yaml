longBusinessSummary: Siegfried Holding AG, together with its subsidiaries, engages
  in contract development and manufacturing of active pharmaceutical ingredient (API)
  and finished dosage forms worldwide. It offers drug substances, including exclusive
  synthesis that manufactures custom APIs. The company also offers an API portfolio,
  including non-exclusive APIs and pharma-grade substances that focus on anesthetics,
  pain and addiction treatment applications, and central nervous and respiratory diseases,
  as well as caffeine for human health and nutrition. In addition, it offers drug
  products, including steriles, which includes fill and finish in vials, ampoules,
  cartridges, and pre-filled syringes; ophthalmics, such as sterile ointments, gels,
  and suspensions and solutions; inhalation products, including capsules in medical
  devices for inhalation applications; oral solid dosage forms, which includes tablets
  and capsules; and viral vectors, such as AAV and lentiviruses for gene therapy.
  Further, the company provides technologies with chemistry capabilities, analytical
  services, formulation technologies, bridging technologies, containment technology,
  and cell and gene therapies. The company was founded in 1873 and is headquartered
  in Zofingen, Switzerland.
