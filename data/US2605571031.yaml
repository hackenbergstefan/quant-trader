longBusinessSummary: Dow Inc., through its subsidiaries, provides various materials
  science solutions for packaging, infrastructure, mobility, and consumer applications
  in the United States, Canada, Europe, the Middle East, Africa, India, the Asia Pacific,
  and Latin America. The company operates through Packaging & Specialty Plastics,
  Industrial Intermediates & Infrastructure, and Performance Materials & Coatings
  segments. The Packaging & Specialty Plastics segment provides ethylene, propylene,
  polyethylene, and aromatics products; and other ethylene derivatives, such as polyolefin
  elastomers, ethylene vinyl acetate, and ethylene propylene diene monomer rubber.
  The Industrial Intermediates & Infrastructure segment offers polyurethanes, including
  propylene oxide, propylene glycol, and polyether polyols; aromatic isocyanates and
  fully formulated polyurethane systems; and chlor-alkali and vinyl comprising chlorine
  and caustic soda, ethylene dichloride, and vinyl chloride monomer; and construction
  chemicals consisting of cellulose ethers, redispersible latex powders, and acrylic
  emulsions, as well as coatings, adhesives, sealants, elastomers, and composites.
  The Performance Materials & Coatings segment provides architectural paints and coatings,
  and industrial coatings; and acrylics-based building blocks, silicon metals, siloxanes,
  and intermediates. The company also engages in the property and casualty insurance,
  as well as reinsurance business. The company was founded in 1897 and is headquartered
  in Midland, Michigan.
