longBusinessSummary: Sanofi engages in the research, development, manufacture, and
  marketing of therapeutic solutions in Finland and Germany. It provides immunology
  and inflammation, rare diseases neurology, oncology, and other vaccines. It also
  offers poliomyelitis, pertussis, and haemophilus influenzae type b (Hib) pediatric
  vaccines; respiratory syncytial virus protection; hexavalent combination vaccines
  that includes hepatitis A, typhoid, yellow fever, and rabies vaccines; and Fluzone,
  a flu vaccine. It has a collaboration and license agreement with Exscientia to develop
  small-molecule for oncology and immunology; ABL Bio, Inc. to develop ABL301 for
  treatment of alpha-synucleinopathies; and Innate Pharma SA for cell engager program
  targeting B7-H3. Further, it has a collaboration agreements with Atomwise to use
  ATOMNET platform and Insilico Medicine to use Pharma.AI, a medicine's AI platform;
  Kymera Therapeutics, Inc. to develop and commercialize protein degrader therapies
  targeting IRAK4 in patients with immune-inflammatory diseases; Nurix Therapeutics,
  Inc. to develop protein degradation therapies; Denali Therapeutics Inc. to treat
  systemic inflammatory diseases, such as ulcerative colitis; and Adagene Inc. for
  development of antibody-based therapies. Additionally, it has a collaboration with
  Scribe Therapeutics Inc. to develop genome editing technologies; Teva Pharmaceuticals
  to co-develop and co-commercialize TEV'574, for treatment of ulcerative colitis
  and Crohn's disease; co-promotion service agreement with Provention Bio, Inc. for
  the commercialization of teplizumab; and antibody collaboration with Regeneron Pharmaceuticals,
  Inc. to develop antibodies, such as Dupixent (dupilumab) as treatment for diseases
  driven by type 2 inflammation. The company was formerly known as Sanofi-Aventis
  and changed its name to Sanofi in May 2011. Sanofi was incorporated in 1994 and
  is headquartered in Paris, France.
