longBusinessSummary: Tapestry, Inc. provides accessories and lifestyle brand products
  in North America, Greater China, rest of Asia, and internationally. The company
  operates in two segments, Coach and Kate Spade. It offers handbags, fashion designs,
  business cases, computer bags, messenger style bags, backpacks, travel bags, and
  totes; accessories, such as small leather goods which includes mini and micro handbags,
  money pieces, wristlets, pouches, and cosmetic cases, as well as novelty accessories,
  including address books, time management and travel accessories, sketchbooks, and
  portfolios; and belts, key rings, technology accessories, gifting, straps, and charms.
  The company also provides women's and men's footwear, which casual and dress shoes,
  boots, sneakers, and sandals; and other products which includes outerwear, ready-to-wear,
  jewelry, watches, eyewear, fragrance, scarves, hats, gloves, and other products.
  It offers its products through retail and outlet stores, brand e-commerce sites,
  and concession shop-in-shops, as well as third-party digital platforms, including
  marketplaces. The company was formerly known as Coach, Inc. and changed its name
  to Tapestry, Inc. in October 2017. Tapestry, Inc. was founded in 1941 and is headquartered
  in New York, New York.
