longBusinessSummary: Booking Holdings Inc., together with its subsidiaries, provides
  online and traditional travel and restaurant reservations and related services in
  the United States, the Netherlands, the United Kingdom, and internationally. The
  company operates Booking.com, which offers online accommodation reservations; and
  Priceline, which provides discount travel reservations services, as well as online
  accommodation, flight, rental car reservation services, vacation packages, cruises,
  activity, and affiliate programs. It also operates Agoda that offers online accommodation
  reservation, flight, ground transportation, and attractions. In addition, the company
  operates KAYAK, an online meta-search service that allows consumers to search and
  compare travel itineraries and prices; and OpenTable for booking online restaurant
  reservations, as well as reservation management services to restaurants. Further,
  it offers travel-related insurance products, payment facilitation, and restaurant
  management services to consumers, travel service providers, and restaurants; and
  advertising services. The company was formerly known as The Priceline Group Inc.
  and changed its name to Booking Holdings Inc. in February 2018. Booking Holdings
  Inc. was founded in 1997 and is headquartered in Norwalk, Connecticut.
