longBusinessSummary: 'S&P Global Inc., together with its subsidiaries, provides benchmarks,
  data, analytics, and workflow solutions in the global capital, energy and commodity,
  and automotive markets. It operates through four segments: S&P Global Market Intelligence,
  S&P Global Ratings, S&P Global Energy, and S&P Dow Jones Indices. The S&P Global
  Market Intelligence segment provides multi-asset-class data and analytics integrated
  with purpose-built workflow solutions. This segment offers Data, Analytics & Insights,
  a desktop product suite that provides data, analytics, and third-party research
  for global finance and corporate professionals; research, reference data, market
  data, derived analytics, and valuation services; enterprise solutions, such as software
  and workflow solutions; and credit and risk solutions for selling Ratings'' credit
  ratings and related data and research, analytics, and financial risk solutions.
  The S&P Global Ratings segment operates as an independent provider of credit ratings,
  research, and analytics offering investors information and independent benchmarks
  for their investment and financial decisions as well as access to the capital markets.
  The S&P Global Energy segment provides information and benchmark prices for the
  energy and commodity markets. The S&P Dow Jones Indices segment operates as an index
  provider that maintains various valuation and index benchmarks for investment advisors,
  wealth managers, and institutional investors. It has operations in the United States,
  European region, Asia, and internationally. S&P Global Inc. was founded in 1860
  and is headquartered in New York, New York.'
