longBusinessSummary: Tyler Technologies, Inc. provides integrated software and technology
  management solutions for the public sector in the United States. It operates in
  two segments, Enterprise Software and Platform Technologies. The company designs,
  develops, markets, and supports a range of software solutions to serve mission-critical
  back-office functions. It also offers platform and transformative technology solutions,
  such as cybersecurity services, including threat detection, response, vulnerability
  testing, and security training, data and insights, digital solutions, payments,
  platform technologies, and outdoor recreation solutions; public administration solutions,
  including civic services, ERP, property and recording, and regulatory; and corrections,
  courts and justice, and public safety solutions. In addition, the company provides
  school ERP and student transportation K-12 education solutions; and health and human
  services solutions comprising environmental health, and disability and benefits.
  It has a strategic collaboration agreement with Amazon Web Services for cloud hosting
  services. The company was formerly known as Tyler Corporation and changed its name
  to Tyler Technologies, Inc. in June 1999. Tyler Technologies, Inc. was founded in
  1966 and is based in Plano, Texas.
