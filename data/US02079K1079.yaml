longBusinessSummary: Alphabet Inc. offers various products and platforms in the United
  States, Europe, the Middle East, Africa, the Asia-Pacific, Canada, and Latin America.
  It operates through Google Services, Google Cloud, and Other Bets segments. The
  Google Services segment provides products and services, including ads, Android,
  Chrome, devices, Gmail, Google Drive, Google Maps, Google Photos, Google Play, Search,
  and YouTube. It is also involved in the sale of apps and in-app purchases and digital
  content in Google Play and YouTube; and devices, as well as the provision of YouTube
  consumer subscription services, such as YouTube TV, YouTube Music and Premium, NFL
  Sunday Ticket, and Google One. The Google Cloud segment offers consumption-based
  fees and subscriptions for AI solutions, including AI infrastructure, Vertex AI
  platform, and Gemini enterprise. It also provides cybersecurity, and data and analytics
  services; Google Workspace that include cloud-based communication and collaboration
  tools for enterprises, such as Calendar, Gmail, Docs, Drive, and Meet; and other
  enterprise services. The Other Bets segment sells transportation and internet services.
  Alphabet Inc. was incorporated in 1998 and is headquartered in Mountain View, California.
