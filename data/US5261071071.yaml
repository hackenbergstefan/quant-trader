longBusinessSummary: Lennox International Inc., together with its subsidiaries, designs,
  manufactures, and markets products for the heating, ventilation, air conditioning,
  and refrigeration markets in the United States, Canada, and internationally. The
  Home Comfort Solutions segment provides furnaces, air conditioners, heat pumps,
  packaged heating and cooling systems, indoor air quality equipment, comfort control
  products, and replacement parts and supplies; residential heating, ventilation,
  cooling equipment, and air conditioning; and evaporator coils, air handlers, and
  unit heaters under the Lennox, Dave Lennox Signature Collection, Armstrong Air,
  Ducane, AirEase, Concord, MagicPak, Advanced Distributor Products, Allied, Elite
  Series, Supco, Linebacker, Elite series, Merit Series, Comfort Sync, Healthy Climate,
  Healthy Climate Solutions, iComfort, ComfortSense, and Lennox Stores names. The
  Building Climate Solutions segment offers unitary heating and air conditioning equipment,
  controls, installation and service of commercial heating and cooling equipment,
  variable refrigerant flow commercial, curb, curb adapters, drop box diffusers, HVAC
  recycling, and salvage service. This segment also provides condensing units, unit
  coolers, fluid coolers, air cooled condensers, process chillers, compressorized
  racks, and replacement parts and supplies under the Lennox, Model L, CORE, Enlight,
  Xion, Energence, Prodigy, Strategos, Raider, Lennox VRF, Lennox National Account
  Services, Allied Commercial, Duro Dyne, Dyne-Tite, Durozone, Elite, AES Industries,
  Mechanical, Heatcraft Worldwide Refrigeration, Bohn, MAGNA, Larkin, Climate Control,
  Chandler Refrigeration, IntelliGen, and Interlink brands. The company also offers
  small package units, rooftop units, chillers, air handlers, and fan coils. It sells
  its products and services through direct sales, distributors, and company-owned
  parts and supplies stores. The company was founded in 1895 and is headquartered
  in Richardson, Texas.
