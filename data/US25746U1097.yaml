longBusinessSummary: Dominion Energy, Inc. provides regulated electricity and natural
  gas services in the United States. It operates through Dominion Energy Virginia,
  Dominion Energy South Carolina, and Contracted Energy segments. The Dominion Energy
  Virginia segment engages in the generation, distribution, and transmission of electricity
  to approximately 2.8 million residential, commercial, industrial, and governmental
  customers in Virginia and North Carolina. The Dominion Energy South Carolina segment
  generates, transmits, and distributes electricity to approximately 0.8 million customers
  in the central, southern, and southwestern portions of South Carolina; and distributes
  natural gas to approximately 0.5 million residential, commercial, and industrial
  customers in South Carolina. The Contracted Energy segment is involved in the nonregulated
  long-term contracted renewable electric generation fleet and renewable natural gas
  facilities. As of December 31, 2025, the company's portfolio of assets included
  approximately 30.7 GW of electric generating capacity, 10,800 miles of electric
  transmission lines, and 80,400 miles of electric distribution lines. The company
  was formerly known as Dominion Resources, Inc. Dominion Energy, Inc. was incorporated
  in 1983 and is headquartered in Richmond, Virginia.
