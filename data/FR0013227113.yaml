longBusinessSummary: Soitec SA develops and manufactures semiconductor materials in
  Asia, Europe, and the United States. The company offers CONNECT Radio Frequency
  Silicon-on-Insulator for smartphone front-end modules; CONNECT FD SOI for AI applications;
  CONNECT Piezoelectric-on-Insulator RF filters for smartphones; photonics and optical
  sensing solution for the integration of silicon optical components in data centers;
  and CONNECT RF gallium nitride which increases the frequency system efficiency and
  power density of next generation sub 6GHz and mmWave-band cellular 5G infrastructures
  and mobile devices. It also provides Power-SOI products for the automotive and industrial
  power electronic devices; Auto Smartsic for cost optimization of electric vehicles
  and industrial applications; and Photonics SOI that integrates photonic components
  on a silicon-on-insulator (SOI) substrate to enhance optical communication capabilities,
  as well as AUTO FD-SOI for automotive radar and processors. In addition, the company
  offers Imager-SOI, a compact solution for high-resolution 3D images and small form
  factor; PD -SOI offers complex computation capabilities and functionalities in cloud
  computing and network equipment; FD-SOI technology which provides the optimal balance
  between digital performance, mixed signal/RF compatibility, and power consumption
  and cost; and MEMS-SOI, an insulating oxide layer, and a supporting handle layer.
  It serves mobile communication, automotive, industry, edge AI and Internet of Things,
  and cloud AI and network infrastructure market. Soitec SA was incorporated in 1992
  and is headquartered in Bernin, France.
