longBusinessSummary: Eurobank S.A. provides retail, corporate and private banking,
  asset management, treasury and capital market, and other services in Greece, Bulgaria,
  Cyprus, and Luxembourg. It operates through Retail, Corporate, Markets, International,
  and Investment Property. The company offers current accounts, savings, deposits
  and investment savings products, credit and debit cards, consumer loans, small business
  banking, and mortgages, as well as overdrafts, loans and other credit facilities,
  foreign currency, and derivative products. It also provides custody and clearing
  services, cash management and trade service, and investment banking services, including
  corporate finance, and merger and acquisitions advice services. In addition, the
  company offers financial instruments trading and services to institutional investors,
  as well as specialized financial advice and intermediation services; and mutual
  fund products, institutional asset management, and equity brokerage services. Further,
  it is involved in investment property activities related to a portfolio of commercial
  real estate assets. Additionally, the company engages in the provision of business-to-business
  e-commerce, accounting, tax, sundry, leasing, factoring, investment banking, asset
  management, brokerage, informatics data processing services; real estate business
  and real estate services; fund management; insurance agency and brokerage services;
  general and life insurance; pension assurance intermediary business; and production
  and distribution of solar generated electric energy. Eurobank S.A. was founded in
  1924 and is based in Athens, Greece. Eurobank S.A. was formerly a subsidiary of
  Eurobank Ergasias Services and Holdings S.A.
