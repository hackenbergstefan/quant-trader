longBusinessSummary: Charter Communications, Inc. operates as a broadband connectivity
  company in the United States. The company offers subscription-based internet, mobile,
  video, and voice services; broadband connectivity services, including fixed internet,
  WiFi, and mobile; Spectrum internet products; advanced WiFi services; and in-home
  WiFi, which provides customers with high performance wireless routers and managed
  WiFi services to enhance their wireless internet experience. It also offers wireline
  voice communications services using voice over internet protocol technology; Call
  Guard, an advanced caller ID and robocall blocking solution; video programming and
  video services, including access to an interactive programming guide with parental
  controls, video on demand and pay-per-view services; and broadband communications
  solutions, such as internet access, data networking, fiber connectivity, video entertainment,
  and business telephone services. In addition, the company provides advertising services
  on cable television networks, various streaming services, and advertising platforms
  for local, regional and national businesses. Further, it offers production and technical
  services for regional sports networks; owns and manages local news channels, including
  Spectrum News NY1® and Spectrum News SoCal; and delivers broadband connectivity
  solutions to apartments, single-family gated communities, off-campus student housing,
  senior residences, and RV parks. The company was founded in 1993 and is headquartered
  in Stamford, Connecticut.
