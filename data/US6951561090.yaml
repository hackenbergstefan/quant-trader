longBusinessSummary: Packaging Corporation of America manufactures and sells containerboard
  and uncoated freesheet (UFS) paper products in North America. The company operates
  through Packaging and Paper segments. The Packaging segment offers various linerboard
  and corrugated packaging products, such as conventional shipping containers used
  to protect and transport manufactured goods; multi-color boxes and displays that
  help to merchandise the packaged product in retail locations; and honeycomb protective
  packaging products, as well as packaging for meat, fresh fruit and vegetables, processed
  food, beverages, and other industrial and consumer products. This segment sells
  its corrugated products through a direct sales and marketing organization. The Paper
  segment manufactures and sells commodity and specialty papers, as well as communication
  papers, including cut-size office papers, and printing and converting papers; and
  white papers. This segment sells papers through its sales and marketing organization.
  Packaging Corporation of America was founded in 1867 and is headquartered in Lake
  Forest, Illinois.
