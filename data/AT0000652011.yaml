longBusinessSummary: Erste Group Bank AG provides various banking and other financial
  services to retail, corporate, and public sector customers. It offers savings and
  current accounts, and term deposit products; consumer credit and mortgage lending;
  commercial real estate, investment loan, acquisition and leveraged finance, project
  finance, and product neutral financial advice; and factoring, accounts receivable
  purchasing, working capital finance, and structured trade finance, and ErsteConfirming,
  a supply chain finance solution. The company also provides interests and FX hedging,
  letters of credit, documentary collections, and guarantees; cash-management solutions,
  such as cash pooling, payment transactions, digital banking, payment factory, VIRTUAL.IBAN,
  and POS-terminals and e-commerce; equity interests and investments, revolving export
  credit lines, and customer financing. In addition, it offers loan syndication, debt
  capital market, and equity capital market services; custody and brokerage services,
  including safekeeping, settlement, corporate action events, tax reclaim assistance,
  proxy voting, brokerage services, securities lending, cash management, clearing
  services for remote members on Vienna Stock Exchange, and market news services;
  and George, a digital retail product. The company operates in Austria, the Czech
  Republic, Poland, Slovakia, Bosnia, Romania, Hungary, North Macedonia, Montenegro,
  Croatia, Serbia, and internationally. Erste Group Bank AG was founded in 1819 and
  is based in Vienna, Austria.
