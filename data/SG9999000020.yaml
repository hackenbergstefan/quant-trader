longBusinessSummary: 'Flex Ltd. provides technology innovation, supply chain, and
  manufacturing solutions to data center, communications, enterprise, consumer, automotive,
  healthcare, industrial, and power industries in the Americas, Asia, and Europe.
  The company operates through three segments: Integrated Technology Solutions (ITS),
  Regulated Manufacturing Solutions (RMS), and Cloud and Power Infrastructure (CPI).
  The ITS segment offers flexible supply and manufacturing solutions for communications,
  including high speed networking, enterprise, and satellite communications systems,
  as well as lifestyle solutions comprising products across commercial, home, and
  personal product categories. Its RMS segment includes industrial products, such
  as mission critical automation, energy, and industrial infrastructure; automotive
  products, including compute and power electronics platforms and integrated systems;
  and healthcare products comprising regulated manufacturing for medical devices,
  drug delivery, and equipment. The CPI segment provides cloud and cooling products,
  such as integrated compute systems supporting power dense digital infrastructure
  deployments and advanced liquid cooling solutions supporting higher density, power
  intensive rack architectures; and power products that include utility and facility
  level electrical infrastructure enabling power delivery and high density rack and
  board level power systems. The company was formerly known as Flextronics International
  Ltd. and changed its name to Flex Ltd. in September 2016. Flex Ltd. was founded
  in 1969 and is headquartered in Austin, Texas.'
