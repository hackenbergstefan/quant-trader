longBusinessSummary: Arcadis NV engages in the design, engineering, architecture,
  and consultancy solutions for natural and built assets in The Americas, Europe,
  the Middle East, and the Asia Pacific. The company operates through Places, Mobility,
  Resilience, and Intelligence segments. It provides architecture and urbanism services;
  and asset management services, such as asset management strategy and planning, asset
  management decision making and operational optimization, life cycle planning and
  asset management systems, asset information/condition assessment, risk and review,
  organization and people, and asset management/O&M. The company also provides business
  advisory services, including asset strategy and performance, business transformation
  and resiliency, investment and finance, operations and maintenance, and technology
  and information; contract solutions; cost and commercial management services; and
  design and engineering solutions for highways, railways, bridges, tunnels, power
  utilities, water utilities, ports and waterways, geotechnics, architecture, and
  structures, as well as building mechanical, electrical, and plumbing. In addition,
  it offers digital environmental health safety and sustainability, environmental
  restoration, and project management solutions. Further, the company provides mobility
  solutions for connected highways, intelligent rail and transit, integrated airports,
  and new mobility; places solutions; resilience solutions, such as energy transition,
  climate adaption, water optimization, enviro socio permitting, sustainable advisory,
  environmental restoration, and sustainable operations; and water supply and treatment,
  distribution, resource management, and industrial water and wastewater services.
  The company was formerly known as Heidemij NV and changed its name to Arcadis N.V.
  in October 1997. The company was founded in 1888 and is headquartered in Amsterdam,
  the Netherlands.
