longBusinessSummary: 'BNP Paribas SA provides various banking and financial products
  and services in Europe, the Middle East, Africa, the Americas, and the Asia Pacific.
  It operates through three divisions: Corporate & Institutional Banking; Commercial,
  Personal Banking & Services; and Investment & Protection Services. The Corporate
  & Institutional Banking division offers capital market, securities, financing, risk
  management, securities clearing, custody, consulting, transaction banking, cash
  management, investment banking, and financial advisory services for corporate and
  institutional clients. Its Commercial, Personal Banking & Services division provides
  financing and equipment leasing services, lending, investment, financial and non-financial
  services, mobility, and digital banking services, as well as current accounts, savings
  products, bancassurance, insurance products and services, and consumer loans. The
  Investment & Protection Services division provides protection, savings, investment,
  and real estate services to support individuals, professionals, corporate clients,
  and institutions, as well as asset management, insurance, protection, pensions,
  and private banking services. The company was formerly known as Banque Nationale
  de Paris and changed its name to BNP Paribas SA in May 2000. BNP Paribas SA was
  founded in 1822 and is headquartered in Paris, France.'
