longBusinessSummary: Orkla ASA operates as an industrial investment company within
  brands and consumer-oriented businesses worldwide. It offers decorative paints,
  marine coatings, protective coatings, and powder coatings; frozen pizza, condiments,
  bread toppings, and ready-to-eat meals; bakery, ice cream, and plant-based products;
  and confectionery, biscuits, and salty snacks. The company also provides branded
  consumer health products, such as daily nutrition and oral health, wound care, and
  functional personal care under the Möller's, Jordan, and Salvequick brand names;
  spices and spice blends, ready-to-eat sweets, breakfast mixes, and other; and cleaning
  and personal hygiene products, such as detergents, cleaning equipment, and personal
  care products. In addition, it operates a franchised pizza business; offers paintbrushes,
  rollers, and other painting project consumables comprising sanding equipment, tape,
  protective gear, and cleaning products; and health and sports nutrition products.
  The company was founded in 1654 and is headquartered in Oslo, Norway.
