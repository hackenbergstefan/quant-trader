longBusinessSummary: Commerzbank AG provides banking and capital market products and
  services to private and small business customers, corporate, financial service providers,
  and institutional clients in Germany, rest of Europe, the Americas, and Asia. It
  operates through two segments, Private and Small-Business Customers, and Corporate
  Clients. The company offers current, money market, checking, business accounts;
  insurance products; credit and debit cards; pension scheme; card payment terminal;
  and various loans. It also offers installment loans; renovation loans, debt structuring,
  car loan, overdraft facility; real estate financing; term deposits; and online banking
  services, as well as trades securities, such as shares, funds, ETFs, certificates,
  options and futures, and bonds. In addition, the company provides wealth management
  services. Commerzbank AG was founded in 1870 and is headquartered in Frankfurt am
  Main, Germany.
