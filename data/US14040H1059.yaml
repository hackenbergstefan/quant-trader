longBusinessSummary: 'Capital One Financial Corporation operates as the financial
  services holding company for the Capital One, National Association, which engages
  in the provision of various financial products and services in the United States,
  Canada, and the United Kingdom. It operates through three segments: Credit Card,
  Consumer Banking, and Commercial Banking. The company accepts checking accounts,
  money market deposits, negotiable order of withdrawals, savings deposits, time deposits,
  and sweep accounts. Its loan products include credit card and personal loans; auto
  and retail banking loans; and commercial and multifamily real estate, and commercial
  and industrial loans. The company offers credit and debit card products; bank lending;
  and provides advisory, capital markets, net interchange, treasury management, and
  depository services. It serves consumers, small businesses, and commercial clients
  through digital channels, branches, cafés, and other distribution channels located
  in New York, Louisiana, Texas, Maryland, Virginia, New Jersey, and the District
  of Columbia. Capital One Financial Corporation was founded in 1988 and is headquartered
  in McLean, Virginia.'
