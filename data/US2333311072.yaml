longBusinessSummary: 'DTE Energy Company engages in energy-related businesses and
  services. The company operates through four segments: Electric, Gas, DTE Vantage,
  and Energy Trading. The company''s Electric segment generates, purchases, distributes,
  and sells electricity to approximately 2.3 million residential, commercial, and
  industrial customers in southeastern Michigan. It generates electricity through
  coal-fired plants, natural gas plant, hydroelectric pumped storage, and nuclear
  plants, as well as wind and solar assets. This segment owns and operates 702 distribution
  substations with a capacity of approximately 37,870,000 kilovolt-amperes (kVA) and
  approximately 4,56,900 line transformers with a capacity of approximately 33,770,000
  kVA. The company''s Gas segment purchases, stores, transports, distributes, and
  sells natural gas to approximately 1.4 million residential, commercial, and industrial
  customers throughout Michigan; and sells storage and transportation capacity. This
  segment has approximately 21,000 miles of distribution mains; 1,242,000 service
  pipelines; and 1,361,000 active meters, as well as owns approximately 2,000 miles
  of transmission pipelines. Its DTE Vantage segment offers metallurgical and petroleum
  coke to steel and other industries; and power generation, steam production, chilled
  water production, and wastewater treatment services, as well as compressed air supply
  to industrial customers. This segment also owns and operates 2 renewable generating
  plants with a capacity of 70 MWs; and 22 gas recovery sites. Its Energy Trading
  segment engages in power, natural gas, and environmental marketing and trading;
  structured transactions; and the optimization of contracted natural gas pipeline
  transportation and storage positions. The company was founded in 1849 and is based
  in Detroit, Michigan.'
