longBusinessSummary: McCormick & Company, Incorporated manufactures, markets, and
  distributes herbs, spices, seasoning mixes, condiments, and other flavorful products
  to the food industry. It operates in two segments, Consumer and Flavor Solutions.
  The Consumer segment offers spices, herbs, and seasonings, as well as condiments,
  sauces, and desserts. This segment markets its products under the McCormick, French's,
  Frank's RedHot, Lawry's, Cholula Hot Sauce, Club House, Gourmet Garden, and OLD
  BAY brands in the Americas; Ducros, Schwartz, Kamis, LA Drogheria, and Vahiné brands
  in Europe, the Middle East, and Africa; and McCormick and DaQiao brands in the Asia/Pacific
  (APAC), as well as desserts under the Aeroplane brand; and packaged chilled herbs
  under the Gourmet Garden brand. Its authentic regional brands include Zatarain's,
  Stubb's, Thai Kitchen, and Simply Asia. The company also supplies its products under
  private labels. This segment serves retailers, including grocery, mass merchandise,
  warehouse clubs, discount and drug stores, and e-commerce retailers directly and
  indirectly through distributors and wholesale foodservice suppliers. The Flavor
  Solutions segment offers seasoning blends, spices, herbs, condiments, coating systems,
  and compound flavors to multinational food manufacturers and foodservice customers.
  It serves foodservice customers directly and indirectly through distributors. The
  company was founded in 1889 and is headquartered in Hunt Valley, Maryland.
