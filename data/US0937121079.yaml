longBusinessSummary: Bloom Energy Corporation designs, manufactures, sells, and installs
  solid oxide fuel cell systems for on-site power generation in the United States
  and internationally. It offers Bloom Energy Server, an energy server platform to
  convert fuel, such as natural gas, biogas, hydrogen, or a blend of these fuels,
  into electricity through a non-combustion electrochemical process. The company also
  provides Bloom Electrolyzer for producing hydrogen. It sells its products through
  direct and indirect sales channels to utilities, data centers, retail, healthcare,
  education, telecom, manufacturing, and other industries. The company was formerly
  known as Ion America Corp. and changed its name to Bloom Energy Corporation in 2006.
  Bloom Energy Corporation was incorporated in 2001 and is headquartered in San Jose,
  California.
