longBusinessSummary: VZ Holding AG, together with its subsidiaries, provides financial
  services in Switzerland, Germany, and England. The company offers retirement planning,
  estate planning, real estate pension scheme, tax advice, and corporate succession
  services; portfolio management, invest with ETFs, securities account consultancy,
  securities custody account, and securities portfolio check services; and estate
  consultation, execution of wills, corporate succession planning, VZ safe, and LGBT
  advice services. It also provides mortgages, mortgage alarm, real estate valuation,
  and properties sale services; tax returns, tax planning, and LGBT tax advice services;
  and pension analysis, vested benefits, and ETFs and individual stocks services.
  In addition, the company offers insurance, insurance check, pension planning, and
  digital organizers; VZ depository; VZ financial portal that enables to find properties
  worth, manage financial investments, insurance policies, and mortgages digitally,
  as well as set interest rate alarms; investment consultancy services; and trading
  of crypto assets. VZ Holding AG was founded in 1992 and is headquartered in Zurich,
  Switzerland. VZ Holding AG operates as a subsidiary of Madarex AG.
