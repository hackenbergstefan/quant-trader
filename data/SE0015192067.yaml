longBusinessSummary: Nordnet AB (publ), together with its subsidiaries, operates a
  digital platform for savings and investments in Sweden, Norway, Denmark, and Finland.
  Its platform allows customers to invest in stocks, mutual funds, and other securities
  through website, app, or other applications; offers margin lending and residential
  mortgages; and pension savings and occupational pension solutions; endowment insurance,
  and accounts for private pension savings, as well as digital pension management
  service. The company also offers Shareville, a social investment network that allows
  customers share their investments in real time. Nordnet AB (publ) was founded in
  1996 and is headquartered in Stockholm, Sweden.
