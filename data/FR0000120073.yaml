longBusinessSummary: L'Air Liquide S.A. provides gases, technologies, and services
  for the industrial and health sectors in Europe, the Americas, the Asia Pacific,
  the Middle East, and Africa. It operates in Gas & Services, and Engineering & Construction
  segments. The Gas & Services segment comprises large industries business, which
  offers gas and energy solutions including oxygen, nitrogen, argon, hydrogen, and
  carbon monoxide, as well as operates cogeneration plants to supply steam and electricity
  to metals, chemicals, refining, and energy industries; and industrial merchant business
  line provides industrial gases, equipment, hardgoods, and associated services to
  materials and energy, materials and chemicals, food and pharmaceuticals, technology
  and research, and fabrication and construction sectors. This segment also includes
  healthcare business, which provides medical gases, home healthcare services, medical
  equipment, and specialty ingredient; healthcare professionals, and hospitals; and
  electronic business supply carrier gases, electronic specialty and advanced materials,
  equipment and installation, service, and analysis to semiconductor, flat panel,
  and photovoltaic markets. The Engineering & Construction segment designs, develops,
  and builds industrial gas production plants to third parties; and designs and manufacture
  plants in the traditional, renewable, and alternative energy sectors. This segment
  also focuses on markets which require a global approach, drawing on science, technologies,
  development models, and usages related to digital transformation. L'Air Liquide
  S.A. was incorporated in 1902 and is headquartered in Paris, France.
