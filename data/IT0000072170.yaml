longBusinessSummary: FinecoBank Banca Fineco S.p.A. provides banking, credit, trading
  and investment services in Italy. It offers banking services, including current
  account services, payment services, mortgages, overdrafts, and personal loans, as
  well as debit, credit, and prepaid cards; and brokerage services comprising order
  execution services on behalf of customers with direct access to global equity markets,
  as well as trading of CFDs, futures, options, bonds, ETFs, and certificates. The
  company also provides asset management services, such as placement and distribution
  services of various products, including UCITS and SICAV units, and insurance and
  pension products, as well as investment advisory services. In addition, it operates
  financial shops. The company serves through a network of personal financial advisors,
  and online and mobile channels. FinecoBank Banca Fineco S.p.A. was founded in 1999
  and is headquartered in Reggio Emilia, Italy.
