longBusinessSummary: 'Comet Holding AG, together with its subsidiaries, provides X-ray
  and radio frequency (RF) power technology solutions in Europe, North America, Asia,
  and internationally. It operates through three divisions: Plasma Control Technologies,
  X-Ray Systems, and Industrial X-Ray Modules. The Plasma Control Technologies division
  develops, manufactures, and markets vacuum capacitors, RF generators, and RF impedance
  matching networks for the high-precision control of plasma processes required in
  the production of memory chips and flat panel displays. The X-Ray Systems division
  develops, manufactures, and markets compact x-ray and provides related services,
  for non destructive examination using x-ray computed tomography. The Industrial
  X-Ray Modules division develops, manufactures, and markets compact X-ray sources
  and portable X-ray modules for non-destructive examination, steel metrology, and
  security inspection. The company offers its products under the Comet and Comet Yxlon
  brands. The company serves manufacturers in the semiconductor, aerospace, automotive,
  and security sectors. Comet Holding AG was founded in 1948 and is headquartered
  in Flamatt, Switzerland.'
