longBusinessSummary: Quest Diagnostics Incorporated provides diagnostic testing and
  services in the United States. The company develops and delivers diagnostic information
  services, such as routine, non-routine and advanced clinical testing, anatomic pathology
  testing, and other diagnostic information services. It also provides services under
  the Quest Diagnostics brand, as well as under the AmeriPath, Dermpath Diagnostics,
  ExamOne, and Quanum brands to physicians, hospitals, patients and consumers, health
  plans, government agencies, employers, retailers, pharmaceutical companies and insurers
  commercial clinical laboratories, and accountable care organizations through a network
  of laboratories, patient service centers, phlebotomists in physician offices, call
  centers and mobile phlebotomists, nurses, and other health and wellness professionals.
  In addition, the company offers risk assessment services for the life insurance
  industry; healthcare IT healthcare providers and payers; testing and medical director
  services at hospital laboratories; test offerings in cardiometabolic and endocrine;
  cancer; clinical drug monitoring and toxicology; infectious disease, including autoimmune;
  neurology diagnostics, including Alzheimer's disease; and women's health, such as
  prenatal genetic; workplace drug testing, testing urine, hair, and oral fluid specimens
  services; and employer population health services, including biometric screenings,
  flu shots, and related preventative services. Further, it provides population health
  solutions; extended care services; develops in vitro diagnostic tests; laboratory
  diagnostic information and digital health connectivity systems; underwriting support
  services, including data gathering, paramedical examinations, and clinical laboratory
  testing and analytics; and national specimen collection and health data solutions.
  Quest Diagnostics Incorporated was founded in 1967 and is headquartered in Secaucus,
  New Jersey.
