longBusinessSummary: UCB SA, a biopharmaceutical company, develops products and solutions
  for people with neurology and immunology diseases worldwide. The company offers
  Cimzia for ankylosing spondylitis (AS), axial spondyloarthritis, Crohn's disease,
  non-radiographic axial spondyloarthritis, plaque psoriasis, psoriatic arthritis,
  polyarticular juvenile idiopathic arthritis, and rheumatoid arthritis; Vimpat, Keppra,
  and Briviact for epilepsy; and Neupro for Parkinson's disease and restless legs
  syndrome. It also provides Nayzilam, a nasal spray rescue treatment for epilepsy
  seizure clusters; and Zyrtec and Xyzal for allergies. In addition, the company offers
  Evenity for the treatment of osteoporosis in postmenopausal women; Bimzelx to treat
  plaque psoriasis, psoriatic arthritis, hidradenitis suppurativa, and axial spondyloarthritis;
  Fintepla for the treatment of Dravet and Lennox-Gastaut syndrome; and RYSTIGGO and
  ZILBRYSQ to treat people living with generalized myasthenia gravis. Further, it
  develops KYGEVVI (doxecitine/doxribtimine) for thymidine kinase 2 deficiency disorder;
  fenfluramine to treat CDKL5 deficiency disorder, and RETT-Syndrome; dapirolizumab
  pegol for systemic lupus erythematosus; STACCATO alprazolam for treating stereotypical
  prolonged seizures; bepranemab to treat Alzheimer's disease; and UCB9741 for atopic
  dermatitis, non cystic fibrosis bronchiectasis, and chronic obstructive pulmonary
  disease. Additionally, it engages in the contract manufacturing activities. The
  company was incorporated in 1925 and is headquartered in Brussels, Belgium.
