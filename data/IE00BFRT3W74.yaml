longBusinessSummary: 'Allegion plc engages in the provision of security products and
  solutions worldwide. It is operating through two segments: Allegion Americas and
  Allegion International. The company offers door controls, door control system, and
  exit devices; doors, glass and door systems, and accessories; electronic security
  products and access control systems, including time, attendance, and workforce productivity;
  and locks, locksets, portable locks, and key systems. It also provides services
  and software, such as inspection, maintenance, and repair services for its automatic
  entrance solutions; software as a service, including access control, platform integration,
  and workforce management solutions; and ongoing aftermarket services, and design
  and installation offerings. In addition, the company sells its products and solutions
  to end-users in commercial, institutional, and residential facilities, including
  education, healthcare, government, hospitality, retail, commercial office, and single
  and multi-family residential markets under the CISA, Interflex, LCN, Schlage, SimonsVoss,
  and Von Duprin brands. It sells its products and solutions through distribution
  and retail channels, such as specialty distribution, e-commerce, and wholesalers,
  as well as through various retail channels comprising do-it-yourself home improvement
  centers, online and e-commerce platforms, and small specialty showroom outlets.
  Allegion plc was incorporated in 2013 and is based in Dublin, Ireland.'
