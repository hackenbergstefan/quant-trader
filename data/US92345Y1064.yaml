longBusinessSummary: Verisk Analytics, Inc. engages in the provision of data analytics
  and technology solutions to the insurance industry in the United States and internationally.
  The company offers underwriting solutions, including forms, rules, and loss costs
  services that provides policy language, prospective loss costs, policy writing and
  rating rules, and underwriting solutions for risk selection and segmentation, pricing,
  and workflow optimization; underwriting data and analytics solutions, which provides
  property and auto specific rating, and underwriting information solutions; catastrophe
  modelling and risk solutions; life insurance solutions for transforming current
  workflows in life insurance underwriting, claim insights, policy administration,
  unclaimed property/equity, compliance and fraud detection, and actuarial and portfolio
  modelling; specialty business solutions, which provides full end-to-end management
  of insurance and reinsurance business; and international underwriting solutions.
  It also provides claims insurance solutions, including property estimating solutions,
  provide data, analytics, and networking solutions for professionals involved in
  estimating all phases of building repair and reconstruction; anti-fraud solutions
  that provide fraud-detection tools for the property and casualty insurance industry;
  casualty solutions, which focus on compliance, casualty claims decision, and workflow
  automation; and international claims solutions, which focus on personal injury and
  motor franchises with complementary offerings to the property claims solutions.
  The company was founded in 1971 and is headquartered in Jersey City, New Jersey.
