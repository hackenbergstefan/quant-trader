longBusinessSummary: Roche Holding AG engages in the pharmaceuticals and diagnostics
  businesses in Europe, North America, Latin America, Asia, Africa, Australia, and
  New Zealand. The company offers pharma solutions in the therapeutic areas of anaemia,
  blood and solid tumors, dermatology, haematology, infectious diseases, inflammatory
  and autoimmune, neurological disorders, ophthalmology, respiratory disorders, and
  transplantation. It also provides in vitro tests for the diagnosis of various diseases,
  such as cancer, diabetes, Covid-19, hepatitis, human papillomavirus, and others;
  diagnostic instruments; and digital health solutions. Roche Holding AG has a collaboration
  agreement with Excalipoint Therapeutics to evaluate EXP011 in DLL3-expressing solid
  tumors. The company was founded in 1896 and is based in Basel, Switzerland.
