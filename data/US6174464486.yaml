longBusinessSummary: Morgan Stanley, a financial holding company, provides various
  financial products and services to corporations, governments, financial institutions,
  and individuals in the Americas, Asia, Europe, the Middle East, and Africa. It operates
  through Institutional Securities, Wealth Management, and Investment Management segments.
  The company offers capital raising and financial advisory services, including services
  related to the underwriting of debt, equity securities, and other products, as well
  as advice on mergers and acquisitions, restructurings, and project finance. It also
  provides equity and fixed income products comprising sales, financing, prime brokerage,
  and market-making services; Asia wealth management; business-related investments
  services; originating corporate and commercial real estate loans, secured lending
  facilities, and extending securities-based and other financing; and research activities.
  In addition, the company offers financial advisor-led brokerage, investment advisory,
  custody, cash management, and administrative services; self-directed brokerage services;
  financial and wealth planning services; stock plan administration; securities-based
  lending, residential real estate loans, and other lending products; banking; and
  retirement plan services. Further, it provides equity, fixed income, alternatives
  and solutions, and liquidity and overlay services to benefit/defined contribution
  plans, foundations, endowments, government entities, sovereign wealth funds, insurance
  companies, third-party fund sponsors, corporations, and individuals. Morgan Stanley
  was founded in 1924 and is headquartered in New York, New York.
