longBusinessSummary: 'UBS Group AG operates as a wealth manager and bank worldwide.
  It operates through five segments: Global Wealth Management, Personal & Corporate
  Banking, Asset Management, Investment Bank, and Non-Core and Legacy. The Global
  Wealth Management segment offers financial services, advice, and solutions; investment
  management, estate planning, and corporate advice services; and wealth management
  and banking products and services to private wealth and institutional customers.
  Its Personal & Corporate Banking segment provides banking, retirement, financing,
  investments, and strategic transactions to private, corporate, and institutional
  customers through its branch network and digital channels in Switzerland. The Asset
  Management segment offers diversified asset management services. Its Investment
  Bank segment provides equities, foreign exchange, precious metals, research, advisory,
  and capital markets services to institutional, corporate, financial sponsor, and
  Global Wealth Management customers, as well as focused rates and credit platform.
  The company also offers lending products, such as securities-based lending, mortgages,
  structured products, and tailored solutions; collateralized lending residential
  and commercial real estate, primarily against securities, residential and commercial
  real estate, other real assets (such as ships and aircraft), private market and
  hedge fund interest; and unsecured lending. The company was formerly known as UBS
  AG and changed its name to UBS Group AG in December 2014. UBS Group AG was founded
  in 1862 and is headquartered in Zurich, Switzerland.'
