longBusinessSummary: EDP, S.A. engages in the generation, transmission, distribution,
  and supply of electricity in Portugal, Spain, France, Poland, Romania, Italy, Belgium,
  the United Kingdom, Greece, Colombia, Brazil, North America, and internationally.
  It operates through Renewables, Networks, and Client Solutions & Energy Management
  segments. The company generates and sells electricity through hydro, combined-cycle
  gas turbine, coal, wind, solar, nuclear, and cogeneration and waste sources. The
  company is also involved in the supply of natural gas. In addition, it offers engineering,
  laboratory tests, professional training, and energy services, as well as property
  management services. The company was formerly known as EDP - Energias de Portugal,
  S.A. and changed its name to EDP, S.A. in April 2024. The company was incorporated
  in 1976 and is headquartered in Lisbon, Portugal.
