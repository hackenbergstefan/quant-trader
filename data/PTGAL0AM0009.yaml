longBusinessSummary: "Galp Energia, SGPS, S.A. operates as an integrated energy operator\
  \ in Portugal and internationally. The company operates through four segments: Upstream,\
  \ Industrial & Midstream, Commercial, and Renewables. The Upstream segment engages\
  \ in the exploration, development, and production of hydrocarbons primarily in Brazil,\
  \ Mozambique, and Namibia. The Industrial & Midstream segment involved in refining\
  \ and logistics business in Portugal, as well as is involved in activities related\
  \ to oil products, carbon dioxide, gas, and power supply and trading activities.\
  \ This segment also includes co-generation. The Commercial segment is involved in\
  \ the areas of retail to final business-to-business and business to oil, gas, electric\
  \ mobility, power and non-fuel products. The Renewables segment is involved in the\
  \ renewables power generation and new businesses. In addition, the company engages\
  \ in the reinsurance business. The company was formerly known as Galp \x96 Petróleos\
  \ e Gás de Portugal, SGPS, S.A. and changed its name to Galp Energia, SGPS, S.A.\
  \ in September 2000. Galp Energia, SGPS, S.A. was incorporated in 1999 and is headquartered\
  \ in Lisbon, Portugal."
