longBusinessSummary: Monolithic Power Systems, Inc. provides semiconductor-based power
  electronics solutions in China, Taiwan, South Korea, Southeast Asia, Europe, the
  United States, Japan, and internationally. The company offers direct current (DC)
  to DC solutions to convert and control voltages within a range of electronic systems,
  such as cloud-based and on-premises CPU servers and workstations, AI systems, memory,
  storage solutions, notebooks, infotainment, power sources, home appliances, network
  infrastructure, and satellite communications. It also provides alternating current
  (AC) to DC; driver metal-oxide-semiconductor field-effect transistors; power management
  integrated circuits (ICs); and current limit switch and lighting control products.
  The company serves storage and computing, enterprise data, automotive, communications,
  consumer, and industrial end markets through third-party distributors and value-added
  resellers. Monolithic Power Systems, Inc. was incorporated in 1997 and is based
  in West Palm Beach, Florida.
