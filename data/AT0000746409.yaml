longBusinessSummary: VERBUND AG, together with its subsidiaries, generates, trades,
  and sells electricity in Austria, Germany, France, Romania, Spain, and Luxembourg.
  It operates through Hydro, New Renewables, Sales, Grid, and All Other segments.
  The company engages in the generation of hydropower, wind power, photovoltaic systems,
  and flexible storage systems; trading and sale activities, and business activities
  related to battery storage systems; electricity and thermal generation; and holds
  equity interests. It also offers electricity, gas, e-mobility, and large-scale photovoltaic
  systems. The company serves participants in energy exchange markets, traders, electric
  utilities, industrial companies, and household and commercial customers. VERBUND
  AG was founded in 1947 and is headquartered in Vienna, Austria.
