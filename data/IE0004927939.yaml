longBusinessSummary: 'Kingspan Group plc, together with its subsidiaries, provides
  insulation and building envelope solutions in Western and Southern Europe, Central
  and Northern Europe, the Americas, and internationally. It operates through two
  segments: Insulated Building Envelopes, and Advnsys. The Insulated Building Envelopes
  segment provides advanced energy-saving solutions for roofs, walls, and floors,
  delivering building solutions for energy efficiency in both new build and renovation
  applications across all building types. The Advnsys segment designs and manufactures
  bespoke critical infrastructure solutions, primarily focused on data centres, ventilation,
  and daylighting, offering high-performance systems that deliver energy efficient
  lighting, airflow, cooling, and ventilation for both new build and renovation projects
  in data centres and commercial buildings. The company offers a comprehensive suite
  of products, including insulated panels, insulation boards, roofing and waterproofing
  solutions, structural steel products and system, facades, ceiling systems, raised
  access floors, daylighting solutions, and water management technologies. It also
  provides solutions such as PowerPanel integrated solar roofing, QuadCore LEC insulated
  panels, Kooltherm insulation boards, and a range of lower embodied carbon and bio-based
  materials. Additionally, the company is involved in developing circular economy
  solutions, including product takeback and recycling schemes, and offers digital
  infrastructure, smoke management, and ventilation systems. Kingspan Group plc was
  founded in 1965 and is based in Kingscourt, Ireland.'
