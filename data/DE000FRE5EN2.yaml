longBusinessSummary: Fresenius SE & Co. KGaA, a health care company, provides products
  and services for chronically ill patients in North America, Europe, the Asia-Pacific,
  Latin America, and Africa. It operates through Fresenius Kabi and Fresenius Helios
  segments. The Fresenius Kabi segment offers products for therapy and care of critically
  and chronically ill patients, including biopharmaceuticals, clinical nutrition,
  MedTech products, intravenously administered generic drugs, and IV fluids. It also
  provides biosimilar drugs; enteral and parenteral nutrition products; and medical
  technologies that include disposables, infusions pumps, apheresis machines, cell
  therapy devices, and other products. The Fresenius Helios segment operates hospitals,
  medical care centers, occupational health centers, prevention centers, and outpatient
  health centers, as well as provision of medical diagnostics. The company has a strategic
  collaboration with SAP SE and Avelios Medical GmbH for the development of a cloud-native,
  modular hospital information system that enables digitalization of clinical and
  administrative processes with AI integration. The company was formerly known as
  Fresenius SE and changed its name to Fresenius SE & Co. KGaA in January 2011. Fresenius
  SE & Co. KGaA was founded in 1912 and is based in Bad Homburg vor der Höhe, Germany.
