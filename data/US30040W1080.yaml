longBusinessSummary: Eversource Energy, a public utility holding company, engages
  in the energy delivery business. The company operates through Electric Distribution,
  Electric Transmission, Natural Gas Distribution, and Water Distribution segments.
  It is involved in the transmission and distribution of electricity; solar power
  facilities; and distribution of natural gas. The company also operates regulated
  water utilities that provides water services to residential, commercial, industrial,
  municipal and fire protection, and other customers in Connecticut, Massachusetts,
  and New Hampshire. The company was formerly known as Northeast Utilities and changed
  its name to Eversource Energy in April 2015. Eversource Energy was incorporated
  in 1927 and is headquartered in Springfield, Massachusetts.
