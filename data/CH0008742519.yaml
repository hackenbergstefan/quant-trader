longBusinessSummary: Swisscom AG provides telecommunication services in Switzerland,
  Italy, and internationally. It operates through Switzerland, Italy, and Other segments.
  The company offers mobile communications, fixed network telephony, broadband, and
  TV to residential customers; telecommunications services and IT service solutions
  for corporate, public administration, and SME customers; business ICT infrastructure;
  range from individual products to end-to-end solutions to ICT infrastructure business;
  and makes network infrastructure to other telecommunications; and plans, operates,
  and maintains the network and IT infrastructure. It also provides network construction
  and maintenance, broadcasting services, and local search activities, as well as
  electronic signatures, digital certificates, and other trust services. In addition,
  the company offers integrated communication solutions, IT infrastructure, security,
  and cloud services to various workplace and other software solutions, IoT, and artificial
  intelligence; outsourcing services for financial and healthcare and public sectors;
  AI-supported services; and telecommunications provide a range of wholesale services
  for own use, refinement or resale based on copper, fibre-optic or mobile networks.
  Further, it provides broadband connections, leased lines, network connections, mobile
  virtual network operators, IP peering, co-location, and cable ducts; wholesale voice
  connections and roaming contracts; manages and markets digital booking platform;
  builds radio networks for broadcasting, security, and professional mobile radio
  networks; safety and security solutions; and ICT and network infrastructures for
  bandwidth, as well as road and tunnel construction. Additionally, the company provides
  FastwebAI Suite, a platform of generative artificial intelligence (AI) solutions
  designed for businesses and public authorities. Swisscom AG was incorporated in
  1998 and is headquartered in Worblaufen, Switzerland.
