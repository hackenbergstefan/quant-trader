longBusinessSummary: Avanza Bank Holding AB (publ), together with its subsidiaries,
  provides various savings, pension, and mortgages products in Sweden. It offers share
  and fund, investment savings, endowment insurance, savings, endowment child insurance,
  external deposit, and pension insurance accounts, as well as occupational pensions
  and individual pension plans. The company also trades in equities, funds, and other
  securities; and provides external and green mortgages, private banking mortgages,
  margin loans, and stock lending products. In addition, it offers decision support
  services and others; and publishes topical news and independent advice on the financial
  website, Placera, as well as on the weekly financial magazine, Börsveckan. The company
  primarily serves individual and professional investors, and corporate customers,
  such as entrepreneurs, asset managers, and occupational pension customers. Avanza
  Bank Holding AB (publ) was incorporated in 1986 and is headquartered in Stockholm,
  Sweden.
