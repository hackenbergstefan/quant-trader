longBusinessSummary: Swissquote Group Holding SA provides online financial services
  to retail investors, affluent investors, and professional and institutional customers
  in Switzerland and internationally. It operates through Securities Trading and Leveraged
  Forex segments. The company operates an online bank that accepts multi-currency
  deposits/withdrawals, including crypto assets and precious metals. It also offers
  securities trading services, such as custody services by means of tools to trade
  in real time in a palette of asset classes and access a set of investment, decision
  making, risk monitoring, and margin lending services to retail, affluent, and high-net-worth
  individuals; corporate and family offices; fund managers; asset managers; and brokers
  and banks. In addition, the company provides access to over-the-counter trading
  of foreign exchange and contracts-for-differences. Further, it offers securities,
  forex, CFDs, cryptocurrencies, and thematic trading; portfolio solutions, sustainable
  investing, and savings plans; debit cards, online payments, eMortgages, and loans.
  The company was founded in 1996 and is headquartered in Gland, Switzerland.
