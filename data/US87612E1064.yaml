longBusinessSummary: Target Corporation operates as a general merchandise retailer
  in the United States. It offers apparel for women, men, young adults, kids, toddlers,
  and babies, as well as jewelry, accessories, and shoes; and beauty products, such
  as skin and bath care, cosmetics, hair care, oral care, deodorant, and shaving products.
  The company also provides food and beverage products comprising dry and perishable
  grocery, including snacks, candy, beverages, deli, bakery, meat, produce, and food
  service; electronics which includes video games and consoles, toys, sporting goods,
  entertainment, and luggage; bed and bath, home décor, school/office supplies, storage,
  small appliances, kitchenware, greeting cards, party supplies, furniture, lighting,
  home improvement, and seasonal merchandise; and household essentials, such as household
  cleaning, paper products, over-the-counter healthcare, vitamins and supplements,
  baby gear, and pet supplies. In addition, it sells merchandise through periodic
  design and creative partnerships, and shop-in-shop experience; and in-store amenities.
  The company sells its products through its stores; and digital channels, including
  Target.com. Target Corporation was incorporated in 1902 and is headquartered in
  Minneapolis, Minnesota.
