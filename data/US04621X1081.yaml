longBusinessSummary: Assurant, Inc. provides protection services to connected devices,
  homes, and automobiles in North America, Latin America, Europe, and the Asia Pacific.
  It operates through Global Lifestyle and Global Housing segments. The Global Lifestyle
  segment offers mobile device solutions, and extended service contracts and related
  services for consumer electronics and appliances, and credit and other insurance
  products; and vehicle protection, commercial equipment protection, and other related
  services. The Global Housing segment provides lender-placed homeowners, manufactured
  housing, and flood insurance; renters insurance and other products; and voluntary
  manufactured housing, and condominium and homeowners insurance products. The company
  was formerly known as Fortis, Inc. and changed its name to Assurant, Inc. in February
  2004. Assurant, Inc. was founded in 1892 and is headquartered in Atlanta, Georgia.
