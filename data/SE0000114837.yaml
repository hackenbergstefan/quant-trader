longBusinessSummary: Trelleborg AB (publ) provides engineered polymer solutions for
  seal, damp, and protect critical applications worldwide. It offers antivibration
  solutions; automotive boots and noise damping; bearings and bushings; bridge expansion
  joints; cable and rubber compounds; electrical protection; embedded rail systems;
  and engineered coated fabrics and molded parts. The company also provides fenders,
  docking, and mooring; floatover solutions; fluid handling solutions; grout seals;
  inflatable products; medical solutions; hoses for milking equipment; and noise and
  vibration damping. In addition, it offers oil sand applications; pipe repair and
  seals; rubber flooring and sheeting; sealing profiles and solutions; ship fenders;
  squeegees; truck and diesel solutions; tunnel seals; and wear protection solutions.
  The company offers its solutions to aerospace; agriculture; automotive; building,
  construction, mining, and marine equipment; healthcare and medical; manufacturing;
  oil and gas; and rail and mass transit industry. Trelleborg AB (publ) was founded
  in 1905 and is headquartered in Trelleborg, Sweden.
