longBusinessSummary: AutoZone, Inc. operates as a retailer and distributor of automotive
  replacement parts and accessories in the Americas. The company offers a product
  line for cars, sport utility vehicles, vans, and light duty trucks, including new
  and remanufactured automotive hard parts, maintenance items, accessories, and non-automotive
  products. It also provides failure products, such as A/C compressors, batteries
  and accessories, bearings, belts and hoses, calipers, chassis, clutches, CV axles,
  engines, fuel pumps, fuses, ignition, lighting, mufflers, radiators, starters and
  alternators, thermostats, tire repair, and water pumps. In addition, the company
  offers maintenance products, including antifreeze and windshield washer fluid; brake
  drums, rotors, shoes, and pads; chemicals, including brake and power steering fluid,
  and oil and fuel additives; oil and transmission fluid; oil, cabin, air, fuel, and
  transmission filters; oxygen sensors; paint and accessories; refrigerant and accessories;
  shock absorbers and struts; spark plugs and wires; and windshield wipers. Further,
  it provides air fresheners, cell phone accessories, drinks and snacks, floor mats
  and seat covers, interior and exterior accessories, mirrors, performance products
  protectants and cleaners, sealants and adhesives, steering wheel covers, tools,
  towing, vehicle entertainment systems, and wash and wax. It offers its products
  under the AutoZone, AutoZone Rewards, Get in the Zone, Zone, Duralast, Econocraft,
  ProElite, ProVantage, ShopPro, SureBilt, TotalPro, TruGrade, Valucraft, and ALLDATA
  names. The company sells its products through stores, www.autozone.com, www.autozonepro.com,
  www.alldata.com, and www.duralastparts.com, as well as commercial sales program
  that provides delivery of parts and other products and commercial credit to local,
  regional and national repair garages, dealers, service stations, fleet owners, and
  other accounts. AutoZone, Inc. was founded in 1979 and is headquartered in Memphis,
  Tennessee.
