longBusinessSummary: 'Vistra Corp., together with its subsidiaries, operates as an
  integrated retail electricity and power generation company in the United States.
  The company operates through five segments: Retail, Texas, East, West, and Asset
  Closure. The company retails electricity and natural gas to residential, commercial,
  and industrial customers across states in the United States and the District of
  Columbia. It is also involved in electricity generation, wholesale energy purchases
  and sales, commodity risk management, fuel procurement, and fuel logistics management
  activities. In addition, the company engages in decommissioning and reclamation
  of retired generation facilities, including mines, and battery removal and remediation
  activities. It serves approximately 5 million customers with a generation capacity
  of approximately 44,000 megawatts with a portfolio of natural gas, nuclear, coal,
  solar, and battery energy storage facilities. The company was formerly known as
  Vistra Energy Corp. and changed its name to Vistra Corp. in July 2020. Vistra Corp.
  was founded in 1882 and is based in Irving, Texas.'
