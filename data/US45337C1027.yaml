longBusinessSummary: Incyte Corporation, a biopharmaceutical company, engages in the
  discovery, development, and commercialization of therapeutics in the United States,
  Europe, Canada, and Japan. The company offers JAKAFI for the treatment of myelofibrosis
  (MF), polycythemia vera, and steroid-refractory acute graft-versus-host disease;
  ICLUSIG, a kinase inhibitor to treat chronic myeloid leukemia and Philadelphia-chromosome
  positive acute lymphoblastic leukemia; MONJUVI/MINJUVI for the treatment of diffuse
  large B-cell lymphoma and Follicular Lymphoma; NIKTIMVO for the treatment of chronic
  graft-versus-host disease. It also provides INCA033989 for the treatment of essential
  thrombocythemia and MF; INCA035784 for the treatment of anti-mutant calreticulin
  and myeloproliferative neoplasms (MPNs); INCB160058 for the treatment of MPNs; PEMAZYRE,
  a selective fibroblast growth factor receptor kinase inhibitor for the treatment
  of unresectable biliary tract cancer, metastatic cholangiocarcinoma, and myeloid/lymphoid
  neoplasms; ZYNYZ to treat adults with metastatic or recurrent locally advanced Merkel
  cell carcinoma. The company's clinical stage products include INCB123667 for ovarian
  cancer; INCB161734 for solid tumors; INCA33890 for cancers; Ruxolitinib cream for
  atopic dermatitis, hidradenitis suppurativa (HS), and prurigo nodularis; Povorcitinib
  for HS, nonsegmental vitiligo, prurigo nodularis, and asthma; and INCB00928 for
  the treatment of fibrodysplasia ossificans progressive. It has collaboration and
  license agreement with Novartis, Lilly, and Syndax. The company sells its products
  to specialty and retail pharmacies, hospital pharmacies, and distributors. Incyte
  Corporation has a clinical trial collaboration with Genmab A/S to evaluate petosemtamab.
  The company was formerly known as Incyte Genomics Inc and changed its name to Incyte
  Corporation in March 2003. Incyte Corporation was incorporated in 1991 and is headquartered
  in Wilmington, Delaware.
