longBusinessSummary: NVR, Inc. operates as a homebuilder in the United States. The
  company operates through Homebuilding and Mortgage Banking segments. It engages
  in the construction and sale of single-family detached homes, townhomes, and condominium
  buildings under the Ryan Homes, NVHomes, and Heartland Homes names. The company
  markets its Ryan Homes products to first-time and first-time move-up buyers; and
  NVHomes and Heartland Homes products to move-up and luxury buyers. It also provides
  various mortgage related services to its homebuilding customers, as well as brokers
  title insurance; performs title searches; and sells mortgage loans to investors
  in the secondary markets on a servicing released basis. The company primarily serves
  Maryland, Virginia, West Virginia, Delaware, Washington, D.C., New Jersey, Eastern
  Pennsylvania, New York, Ohio, Western Pennsylvania, Indiana, Illinois, North Carolina,
  South Carolina, Tennessee, Florida, Georgia, and Kentucky. NVR, Inc. was founded
  in 1948 and is headquartered in Reston, Virginia.
