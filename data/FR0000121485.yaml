longBusinessSummary: Kering SA manages the development of a collection of renowned
  houses in fashion, leather goods, and jewelry in the Asia Pacific, Western Europe,
  North America, Japan, and internationally. The company provides ready-to-wear products,
  accessories, and beauty products for men and women. It also offers leather goods
  and shoes; watches and jewelry; eyewear products; and fragrances and cosmetics.
  The company provides its products under the Gucci, Saint Laurent, Bottega Veneta,
  Balenciaga, Alexander McQueen, Brioni, Boucheron, Pomellato, DoDo, Qeelin, and Ginori
  1735, as well as Kering Eyewear and Kering Beauté brands. Kering SA was formerly
  known as PPR SA. and changed its name to Kering SA in May 2013. The company was
  founded in 1963 and is based in Paris, France.
