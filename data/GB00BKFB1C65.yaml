longBusinessSummary: M&G plc, through its subsidiaries, provides investment and savings
  products to institutional clients and individual policyholders in the United Kingdom
  and internationally. The company operates through Asset Management and Life segments.
  The Asset Management segment offers managed investment products, such as equities,
  fixed income, and multi-asset, as well as real estate investment products and services
  to wholesale clients and institutional investors. The Life segment provides corporate
  pension solutions, individual life and pensions, and international solutions and
  advice; and Prudential guaranteed income plan. This segment also offers level annuities,
  which provide a fixed annuity payment; fixed increase annuities, which incorporate
  a periodic automatic fixed increase in annuity payments; inflation-linked annuities,
  which incorporate a periodic increase based on a defined inflation index; and with-profits
  annuities, written in the with-profits fund, combining income features of annuity
  contracts with the investment-smoothing features of with-profits products. The company
  was formerly known as M&G Prudential PLC and changed its name to M&G plc in September
  2019. M&G plc was founded in 1848 and is headquartered in London, the United Kingdom.
