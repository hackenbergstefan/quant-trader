longBusinessSummary: adidas AG, together with its subsidiaries, designs, develops,
  produces, and markets a range of athletic and sports lifestyle products in Europe,
  Greater China, Japan, South Korea, Latin America, North America, and internationally.
  The company offers footwear and apparel, as well as accessories and gear, including
  bags, balls, sunglasses, and fitness equipment under the adidas brand; golf footwear
  and apparel under the adidas Golf brand; and outdoor footwear under the Five Ten
  brand. It sells its products through its own retail stores, mono-branded franchise
  stores, shop-in-shops, joint ventures with retail partners, and co-branded stores,
  as well as through its wholesale and e-commerce platforms. The company was formerly
  known as adidas-Salomon AG and changed its name to adidas AG in June 2006. adidas
  AG was founded in 1920 and is headquartered in Herzogenaurach, Germany.
