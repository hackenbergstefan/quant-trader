longBusinessSummary: Air Products and Chemicals, Inc. provides atmospheric gases,
  process and specialty gases, equipment, and related services in the Americas, Asia,
  Europe, the Middle East, India, and internationally. The company produces atmospheric
  gases, including oxygen, nitrogen, and argon; process gases, such as hydrogen, helium,
  carbon dioxide, carbon monoxide, and syngas; and specialty gases for customers in
  various industries, including refining, chemical, metals, manufacturing, electronics,
  energy production, medical, food, chemical and petrochemical manufacturing, oil
  and gas recovery and processing, and steel and primary metals processing. It also
  designs and manufactures equipment for air separation, hydrocarbon recovery and
  purification, natural gas liquefaction, and liquid helium and liquid hydrogen transport
  and storage. Air Products and Chemicals, Inc. was founded in 1940 and is headquartered
  in Allentown, Pennsylvania.
