longBusinessSummary: 'MetLife, Inc., a financial services company, provides insurance,
  annuities, employee benefits, and asset management services worldwide. It operates
  in six segments: Group Benefits; Retirement and Income Solutions; Asia; Latin America;
  Europe, the Middle East and Africa; and MetLife Holdings. The company offers life,
  dental, group short-and long-term disability, paid family and medical leave, individual
  disability, accidental death and dismemberment, accident and health, vision, and
  pet insurance, as well as prepaid legal plans; administrative services-only arrangements
  to employers; and general and separate account, and synthetic guaranteed interest
  contracts, as well as private floating rate funding agreements. It also provides
  pension risk transfers, institutional income annuities, structured settlements,
  and capital markets investment products; and other products and services, such as
  life insurance products and funding agreements for funding postretirement benefits,
  as well as company, bank, or trust-owned life insurance used to finance nonqualified
  benefit programs for executives. In addition, it offers fixed, indexed-linked, and
  variable annuities; pension products; regular savings products; whole and term life,
  endowments, universal and variable life, and group life products; longevity and
  funded reinsurance solutions; credit insurance products; accident & health products
  covering hospitalization, cancer, critical illness, income protection, and scheduled
  medical reimbursement plans; and protection against long-term health care services.
  The company was incorporated in 1999 and is based in New York, New York.'
