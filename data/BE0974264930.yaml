longBusinessSummary: 'ageas SA/NV, together with its subsidiaries, engages in insurance
  business. It operates through five segments: Belgium, Europe, Asia, Reinsurance,
  and General Account. The company provides property, casualty, and life insurance
  products, as well as pension products; and reinsurance products. It offers life
  insurance products include risks related to the life, and death of individuals;
  and non-life insurance products comprise accident and health, motor, and fire insurance
  products, as well as insurance services for other damages to property; and pension
  funds. The company serves private individuals, as well as small, medium-sized, and
  large companies through independent brokers and the bank channels. ageas SA/NV was
  founded in 1824 and is based in Brussels, Belgium.'
