longBusinessSummary: Lennar Corporation, together with its subsidiaries, operates
  as a homebuilder primarily under the Lennar brand in the United States. It operates
  through Homebuilding East, Homebuilding Central, Homebuilding South Central, Homebuilding
  West, Financial Services, Multifamily, and Lennar Other segments. The company's
  homebuilding operations include the construction and sale of single-family attached
  and detached homes, as well as the purchase, development, and sale of residential
  land; and development, construction, and management of multifamily rental properties.
  It also offers residential mortgage financing, title insurance, and closing services
  for home buyers and others, as well as originating and selling securitization commercial
  mortgage loans. In addition, the company is involved in fund investment activities.
  It primarily serves first-time, move-up, active adult, and luxury homebuyers. The
  company was founded in 1954 and is based in Miami, Florida.
