longBusinessSummary: Koninklijke Ahold Delhaize N.V. operates retail food stores and
  e-commerce in the Netherlands, the United States, and internationally. The company's
  stores offer produce, dairy, meat, deli, bakery, seafood, and frozen products; grocery,
  beer, and wine; floral, pet food, health and beauty care, kitchen and cookware,
  gardening tools, general merchandise articles, electronics, newspapers and magazines,
  and tobacco; gasoline; and pharmacy products. It operates its supermarkets, convenience
  stores, and online stores under the Albert, Albert Heijin, Alfa Beta Vassilopoulos,
  bol, Delhaize, ENA, Food Lion, Gall & Gall, Giant Food, The GIANT Company, Hannaford,
  Maxi, Mega Image, Stop & Shop, Profi, and Super Indo brands. The company was formerly
  known as Koninklijke Ahold N.V. and changed its name to Koninklijke Ahold Delhaize
  N.V. in July 2016. The company was founded in 1867 and is headquartered in Zaandam,
  the Netherlands.
