longBusinessSummary: Softcat plc operates as a value-added IT reseller and IT infrastructure
  solutions provider in the United Kingdom. The company advices, procures, designs,
  implements, and manages digital infrastructure, such as hybrid infrastructure, workplace,
  cyber security, networking and connectivity, data, automation, and AI for businesses
  and public sector organizations. It also provides public cloud, collaboration, data
  centre and private cloud, devices, and financial solution services. In addition,
  the company offers Softcat intelligence services, lifecycle solutions, modern management,
  software licensing, supply chain operation, and virtual desktop and application,
  as well as IT service provider and retail banking hub. Softcat plc was incorporated
  in 1987 and is headquartered in Marlow, the United Kingdom.
