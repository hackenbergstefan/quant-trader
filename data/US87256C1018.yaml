longBusinessSummary: 'TKO Group Holdings, Inc. operates as a sports and entertainment
  company. The company operates through three segments: UFC, WWE and IMG. The UFC
  segment distributes programming content; ticket sales and site fees associated with
  the business''s global live events; partnerships and marketing; and consumer products
  licensing agreements of UFC-branded products. The WWE segment consists of media
  rights fees associated with the distribution of its programming content; ticket
  sales and site fees associated with the business''s global live events; partnerships
  and marketing; and consumer products licensing agreements of WWE-branded products.
  The IMG segment specializing in media rights management and sales, multi-channel
  content production and distribution, brand partnerships, strategic consulting, digital
  services, and event management. This segment also offers hospitality business, offering
  ticketing, curated guest experiences, live event production and travel management
  services. It is also involved in the merchandising of video games, apparel, equipment,
  trading cards, memorabilia, digital goods, and toys. In addition, the company engages
  in the sponsorships and advertising business, which offers sale of in-venue and
  in-broadcast advertising assets, content product integration, and digital impressions.
  The company was incorporated in 2023 and is based in New York, New York. TKO Group
  Holdings, Inc. is a subsidiary of WME Group, Inc.'
