longBusinessSummary: 'Honeywell Aerospace Inc. supplies mission critical systems and
  technologies that enable the production, maintenance, and safe operation of aerospace
  and defense platforms. It operates through three segments: Electronic Solutions
  (ES), Engines & Power Systems (E&PS), and Control Systems (CS). The ES segment provides
  avionics, radars, flight management systems, precision inertial navigation systems,
  and space components; solutions that enable complex sensing protection, targeting,
  and communications operations in the electromagnetic spectrum; and electronic warfare
  solutions, as well as solutions that focus on in-flight connectivity, cockpit safety,
  defense radiofrequency, and counter unmanned aerial systems. It serves OEMs, airlines,
  defense prime contractors, and space-system integrators, as well as aftermarket
  maintenance, repair, and overhaul providers. The E&PS segment offers propulsion
  engines, small and military auxiliary power units (APUs), narrowbody and widebody
  APUs, electric power systems, and fuel cells and adjacencies. This segment serves
  aerospace original equipment manufacturers, the U.S. military branches, and scaled
  aftermarket service providers. The CS segment provides environmental control systems,
  cabin pressure control systems, thermal management systems, engine start systems,
  fuel control systems, flight control actuation systems, and wheels and braking systems.
  The company operates in the United States, Switzerland, Europe, the Middle East,
  Africa, and internationally. Honeywell Aerospace Inc. was founded in 1914 and is
  headquartered in Phoenix, Arizona. Honeywell Aerospace Inc. is as a prior subsidiary
  of Honeywell International Inc.'
