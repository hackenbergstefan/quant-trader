longBusinessSummary: Tractor Supply Company operates as a rural lifestyle retailer
  in the United States. The company provides various merchandise, including livestock
  and equine feed and equipment, poultry, fencing, and sprayers and chemicals; companion
  animal products, such as food, treats, and equipment for dogs, cats, and other small
  animals, as well as dog wellness products; seasonal and recreation products comprising
  tractors and riders, lawn and garden, bird feeding, power equipment, and other recreational
  products; truck, tool, and hardware products, such as truck accessories, trailers,
  generators, lubricants, batteries, and hardware and tools; and clothing, gift, and
  décor products consist of clothing, footwear, toys, snacks, and decorative merchandise.
  It offers its products under the 4health, Paws & Claws, American Farmworks, Producer's
  Pride, Bit & Bridle, Red Shed, Blue Mountain, Redstone, C.E. Schmidt, Retriever,
  Country Lane, Ridgecut, Countyline, Royal Wing, Country Tuff, Strive, Dumor, Traveller,
  Farm Table, Treeline, Groundwork, TSC Tractor Supply Co, Huskee, Untamed, JobSmart,
  and Impeckable brand names. The company operates its retail stores under the Tractor
  Supply Company, Petsense by Tractor Supply, and Orscheln Farm and Home names; and
  operates websites under the TractorSupply.com and Petsense.com names. It sells its
  products to recreational farmers, ranchers, and others. Tractor Supply Company was
  founded in 1938 and is based in Brentwood, Tennessee.
