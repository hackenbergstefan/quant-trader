longBusinessSummary: Holmen AB (publ) engages in the forest, paperboard, paper, wood
  products, and renewable energy businesses in Sweden and internationally. The company
  operates through Forest, Renewable Energy, Wood Products, and Board and Paper segments.
  Its Forest segment offers logs, pulpwood, and biofuel to sawmills, pulp mills, and
  board and paper mills. The Renewable energy segment provides renewable energy from
  hydro and wind power to the Nordic electricity market. Its Wood Products segment
  provides construction and joinery timber; CLT and glulam; and plus wood for pallets
  and packaging to construction, joinery, and packaging industries, as well as builders'
  merchants. The Board and Paper segment offers paperboards for consumer packaging
  and paper products for books, magazines, advertising, and transport packaging to
  brand owners, converters, wholesalers, publishers, printers, and retailers. The
  company was founded in 1609 and is headquartered in Stockholm, Sweden.
