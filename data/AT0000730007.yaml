longBusinessSummary: 'Andritz AG engages in the provision of industrial machinery,
  equipment, and services in Europe, North America, South America, China, Asia, Africa,
  Australia, and internationally. It operates through four segments: Pulp & Paper,
  Metals, Hydropower, and Environment & Energy. The Pulp & Paper segment provides
  technology, automation, and service solutions to produce pulp, paper, board, and
  tissue; boilers for power generation; nonwovens technologies; panelboard production
  systems; and recycling, shredding, and energy solutions for various waste materials.
  Its Metals segment provides technologies, plants, and digital solutions, including
  automation and software solutions, and process know-how and services; and solutions
  for the production and processing of flat products for welding systems and furnaces,
  as well as services for the metals processing industry. The Hydro segment supplies
  electromechanical equipment, solutions, and services for hydropower stations; services
  and digital solutions for the operation and maintenance of hydropower plants; and
  turbo generators for the thermal industry. The Environment & Energy segment provides
  technologies to produce green hydrogen and renewable fuels, carbon capture and emission
  reduction, mechanical and thermal solid/liquid separation, grinding, pelletizing,
  and pumping fluids. It also serves agriculture, aluminum, architecture, automotive
  and e-mobility, carbon steel, chemicals, desalination, environment, feed, food and
  beverages, glass, kraft pulp, lime and cement, marine/offshore, mining and minerals,
  non-ferrous metals, non-woven and textile, oil and gas, panelboard, paper and packaging,
  pharmaceutical, power generation, recycling, solid biofuels, stainless steel, sugar,
  thermal power, tissue, and waste industries. The company was founded in 1852 and
  is headquartered in Graz, Austria.'
