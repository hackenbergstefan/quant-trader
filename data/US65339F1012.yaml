longBusinessSummary: NextEra Energy, Inc., through its subsidiaries, generates, stores,
  transmits, distributes, and sells electric power to retail and wholesale customers
  in North America. It operates through Florida Power & Light Company (FPL) and NEER
  segments. The company generates electricity from wind, solar, nuclear, natural gas,
  and other clean energy assets. It also invests in generation, storage, transmission,
  and distribution facilities; owns, develops, constructs, manages, and operates generation
  facilities, including renewables, nuclear and natural gas, and battery storage facilities
  in the wholesale energy market in the United States and Canada, as well as electric
  and gas transmission assets, and natural gas pipelines; provides full energy and
  capacity requirement services; markets and trades in energy-related commodities;
  and participates in the production of natural gas, natural gas liquids, and oil.
  As of December 31, 2025, the company had approximately 35,963 megawatts of net generating
  capacity; approximately 93,000 circuit miles of transmission and distribution lines;
  and 932 substations. It serves approximately 12 million people through approximately
  6 million customer accounts on the east and lower west coasts of Florida. The company
  was formerly known as FPL Group, Inc. and changed its name to NextEra Energy, Inc.
  in 2010. NextEra Energy, Inc. was founded in 1925 and is headquartered in Juno Beach,
  Florida.
