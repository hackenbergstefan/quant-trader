longBusinessSummary: Flughafen Zürich AG owns and operates the Zurich Airport in Switzerland.
  The company operates through Aviation; Passengers with Reduced Mobility (PRM); Usage
  Fees; Air Security; Access Fees; Noise; Non-Regulated Business; and International
  segments. It provides infrastructure and services related to flight operations,
  including the runway system, apron zones, passenger zones in the terminals, freight
  operations, passenger handling and services, and safety; support for passengers
  with reduced mobility; and check-in areas and facilities, baggage sorting and handling
  system, aircraft power supply system, handling apron areas, and the related services
  and fees. The company also offers passenger and aircraft security measures consisting
  of systems, operation, and maintenance to prevent actions that affect the security
  of commercial civil aviation, such as facilities for checks on passengers, hand
  luggage, checked baggage, and freight. In addition, it provides air security-related
  equipment and services comprising relevant systems, operation, and maintenance;
  and airport policing duties, surveillance patrols, and other security-related duties.
  Further, the company develops, markets, and operates commercial infrastructure at
  Zurich Airport, including retail and restaurant/catering operations at the airport,
  renting premises, parking services, and various commercial services; and provides
  consulting services. Additionally, it develops and operates other airports in Brazil,
  Chile, Curaçao, Colombia, and India. Flughafen Zürich AG was incorporated in 1986
  and is based in Zurich, Switzerland.
