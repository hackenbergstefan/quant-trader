longBusinessSummary: United Parcel Service, Inc., a package delivery and logistics
  provider, offers transportation and delivery services. It operates through two segments,
  U.S. Domestic Package and International Package. The U.S. Domestic Package segment
  offers time-definite delivery services for express letters, documents, packages
  and palletized freight through air and ground services. The International Package
  segment provides small package operations in Europe, the Middle East and Africa,
  Canada and Latin America, and Asia. The company offers a range of guaranteed day-
  and time-definite international transportation services; day-definite services;
  cross-border ground package delivery; contract-only, e-commerce solutions for non-urgent,
  and cross-border shipments; and international service for urgent and palletized
  shipments. It also provides international air and ocean freight forwarding, contract
  logistics, customs brokerage and insurance, mail services, healthcare logistics,
  distribution, and post-sales services. United Parcel Service, Inc. was founded in
  1907 and is headquartered in Atlanta, Georgia.
