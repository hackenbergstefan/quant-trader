longBusinessSummary: NN Group N.V., a financial services company, provides life and
  non-life insurance products in the Netherlands and internationally. It operates
  through the Netherlands Life, the Netherlands Non-Life, Insurance Europe, Japan
  Life, and NN Bank segments. The company provides insured defined benefit, defined
  contribution, pensions under the Nationale-Nederlanden brand name; premium pension
  institution services under the BeFrank brand name; and general pension fund administration
  and advisory services under AZL brand name, as well as non-life insurance products,
  including motor, fire, liability, transport, travel, health, and disability and
  accident insurance products. It also provides long-term protection to cover a variety
  of risks including disability, critical illness and health; and protection, savings
  and retirement solutions. In addition, the company offers financial services, such
  as savings, investments, bancassurance and mortgages under the Woonnu brand name.
  The company offers its products to individuals, small and medium-sized enterprises,
  and corporate customers directly through tied agents, advisors, brokers, and direct
  channels. The company was formerly known as ING Insurance Topholding N.V. and changed
  its name to NN Group N.V. in March 2014. NN Group N.V. was founded in 1845 and is
  headquartered in The Hague, the Netherlands.
