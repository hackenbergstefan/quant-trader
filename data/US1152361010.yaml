longBusinessSummary: Brown & Brown, Inc. markets and sells insurance products and
  services in the United States, the United Kingdom, and internationally. It operates
  through Retail and Specialty Distribution segments. The Retail segment provides
  property and casualty insurance products, employee benefits insurance products,
  personal insurance products, specialties insurance products, risk management strategies,
  loss control surveys and analysis, consulting, and claims processing services. This
  segment also offers non-insurance services and products through automobile and recreational
  vehicle dealer services businesses. It serves commercial, public and quasi-public
  entities, professionals, and individual customers. The Specialty Distribution segment
  comprises wholesale brokerage and specialty businesses. This segment offers professional
  liability and related package insurance products for dentistry, legal, eyecare,
  financial services, physicians, and real estate title professionals, as well as
  supplementary insurance products related to weddings, events, medical facilities,
  and cyber liabilities. This segment also provides public entity-related and specialty
  programs through a network of independent agents, as well as program management
  services for insurance carrier partners. In addition, the company's wholesale brokerage
  businesses underwrite and place excess and surplus commercial and personal lines
  insurance through independent agents and brokers. Its program businesses operate
  under the Arrowhead Programs name. The company was formerly known as Poe & Brown,
  Inc. and changed its name to Brown & Brown, Inc. in April 1999. Brown & Brown, Inc.
  was founded in 1939 and is headquartered in Daytona Beach, Florida.
