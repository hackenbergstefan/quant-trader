longBusinessSummary: 'ING Groep N.V. provides various banking products and services
  in the Netherlands, Belgium, Germany, rest of Europe, and internationally. The company
  operates through five segments: Retail Netherlands, Retail Belgium, Retail Germany,
  Retail Other, and Wholesale Banking. It accepts current and savings accounts; and
  time deposits. The company also offers business lending products; SME loans; consumer
  lending products, such as residential mortgage loans and other consumer lending
  loans; and mortgages. In addition, it provides working capital solutions; debt and
  equity market solutions; various loans; payments; and cash management, trade and
  corporate finance, and treasury services, as well as savings, investment, insurance,
  and digital banking services. The company serves individual customers, corporate
  clients, and financial institutions. ING Groep N.V. was founded in 1762 and is headquartered
  in Amsterdam, the Netherlands.'
