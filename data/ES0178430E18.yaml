longBusinessSummary: Telefónica, S.A., together with its subsidiaries, provides telecommunications
  services in Spain, Brazil, Germany, and the United Kingdom. The company offers digital
  services for residential customers, such as entertainment, home connectivity and
  security; and advanced solutions for businesses and public administrations, including
  cloud, cybersecurity, IoT, artificial intelligence, and professional services. It
  also provides wholesale services to other operators; fixed and wireless telephony
  services. It is also involved in the wholesale commercialization of a fiber-to-the-home
  network; and manages borrowing activities. In addition, the company offers ecosystem
  services, such as devices, health, insurance, video content, solar energy, alarm
  systems, advertising, financial services and education, etc.; traffic, connection
  fees, regular network usage fees, interconnection, network and equipment leasing,
  and handset sales; and other digital services comprising Pay TV and value-added
  services. Telefónica, S.A. was incorporated in 1924 and is based in Madrid, Spain.
