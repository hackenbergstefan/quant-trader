longBusinessSummary: Marsh & McLennan Companies, Inc., a professional services company,
  provides advisory services and insurance solutions to clients in the areas of risk,
  strategy, and people worldwide. The company operates through Risk and Insurance
  Services, and Consulting segments. The Risk and Insurance Services segment offers
  risk management services, such as risk management, insurance broking, insurance
  program management, risk consulting, analytical modeling, and alternative risk financing
  services. This segment also offers insurance and reinsurance broking, strategic
  advisory and actuarial services, and analytics solutions. It serves businesses,
  public entities, insurance companies, associations, professional services organizations,
  and private clients. The Consulting segment provides health, wealth and career advice,
  solutions and products; and specialized management, strategic, economic, and brand
  consulting services. Marsh & McLennan Companies, Inc. was founded in 1871 and is
  headquartered in New York, New York.
