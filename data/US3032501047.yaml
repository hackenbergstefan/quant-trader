longBusinessSummary: Fair Isaac Corporation provides analytics software in the Americas,
  Europe, the Middle East, Africa, and the Asia Pacific. It operates through two segments,
  Scores and Software. The Scores segment offers business-to-business scoring solutions
  and services that give clients access to predictive credit and other scores that
  can be integrated into their transaction streams and decision-making processes,
  as well as business-to-consumer scoring solutions comprising myFICO.com subscription
  offerings. The Software segment provides decisioning capabilities, models and solutions
  designed for various business needs or processes, such as account origination, customer
  management, customer engagement, fraud detection, and marketing, as well as associated
  professional services. This segment also offers FICO Platform, a modern and modular
  set of multi-purpose intelligent decisioning capabilities designed to support artificial
  intelligence, and advanced analytic and decision use cases. In addition, the company
  offers analytic and decisioning software comprising FICO Falcon fraud manager, FICO
  Customer Communication Service, FICO Decision Modeler, FICO Blaze Advisor, FICO
  Xpress Optimization, FICO Analytics Workbench, FICO Strategy Director, FICO Data
  Orchestrator, FICO DMP Streaming, and FICO TRIAD Customer Manager. Further, it develops
  predictive, machine learning, and AI models; business and technical systems for
  the secure and private sharing of data across consortiums of banking institutions;
  and provides professional services, as well as software implementation and configuration
  services. It markets its products and services primarily through its direct sales
  organization and indirect channels. The company was formerly known as Fair Isaac
  & Company, Inc. and changed its name to Fair Isaac Corporation in July 1992. Fair
  Isaac Corporation was founded in 1956 and is headquartered in Bozeman, Montana.
