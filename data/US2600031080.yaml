longBusinessSummary: Dover Corporation provides equipment and components, consumable
  supplies, aftermarket parts, software and digital solutions, and support services
  worldwide. The company's Engineered Products segment provides various equipment,
  component, software, solution, and services that are used in vehicle aftermarket,
  aerospace and defense, industrial winch and hoist, and fluid dispensing end-market.
  This segment offers software solutions and services used in light and heavy-duty
  vehicle lifts, wheel service equipment, vehicle diagnostics, and vehicle collision
  repair solutions; winches, hoists, bearings, drives, and electric monitoring system;
  and radio frequency and microwave filters and switches, and signal intelligence
  solutions, as well as soldering and fluid dispensing solutions. Its Clean Energy
  & Fueling segment offers component, equipment, and software and service solution
  enabling safe storage and transport of fuel, cryogenic gases, and hazardous fluids,
  as well as operation of retail fueling and vehicle wash establishment. The company's
  Imaging & Identification segment provides precision marking and coding, product
  traceability equipment, brand protection, and digital textile printing equipment
  and solution, as well as consumable, software, and service to packaged and consumer
  goods, pharmaceutical, industrial manufacturing, textile, and other end-market.
  Its Pumps & Process Solutions segment manufactures specialty pump, connector, flow
  meter, fluid connecting solution, plastics and polymer processing equipment, and
  engineered components for rotating and reciprocating machines. The company's Climate
  & Sustainability Technologies segment manufactures refrigeration system, refrigeration
  display case, commercial glass refrigerator and freezer door, and brazed plate heat
  exchanger for industrial heating and cooling, and residential climate control applications.
  Dover Corporation was incorporated in 1947 and is headquartered in Downers Grove,
  Illinois.
