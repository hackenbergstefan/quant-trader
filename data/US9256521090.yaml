longBusinessSummary: VICI Properties Inc. is a real estate investment trust that owns
  one of the largest portfolios of market-leading gaming, hospitality, wellness, entertainment
  and leisure destinations, including Caesars Palace Las Vegas, MGM Grand and the
  Venetian Resort Las Vegas. VICI Properties owns 103 experiential assets across a
  geographically diverse portfolio consisting of 63 gaming properties and 40 other
  experiential properties across the United States and Canada. The portfolio is comprised
  of approximately 130 million square feet and features approximately 66,000 hotel
  rooms and over 700 restaurants, bars, nightclubs and sports books. Its properties
  are occupied by industry-leading gaming, leisure and hospitality operators under
  long-term, triple-net lease agreements. VICI Properties has a growing array of real
  estate and financing partnerships with leading operators in other experiential sectors,
  including Cabot, Cain, Canyon Ranch, Chelsea Piers, Club Med, Great Wolf Resorts,
  Homefield, Kalahari Resorts and Lucky Strike Entertainment. VICI Properties also
  owns four championship golf courses and approximately 33 acres of undeveloped and
  underdeveloped land adjacent to the Las Vegas Strip. VICI Properties Inc. was established
  on July 05, 2016, and is based in New York, United States. VICI Properties Inc.
  was incorporated in Maryland.
