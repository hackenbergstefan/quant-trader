longBusinessSummary: Principal Financial Group, Inc. provides retirement, asset management,
  and insurance products and services to businesses, individuals, and institutional
  clients worldwide. The company operates through Retirement and Income Solutions,
  Principal Asset Management, and Benefits and Protection segments. The Retirement
  and Income Solutions segment provides retirement, and related financial products
  and services. This segment offers products and services for defined contribution
  plans, including 401(k) and 403(b) plans, defined benefit plans, nonqualified executive
  benefit plans, employee stock ownership plans, equity compensation, and pension
  risk transfer services; individual retirement accounts; investment only products;
  and mutual funds, individual variable annuities, registered index-linked annuities,
  and bank products, as well as trust and custody services. The Principal Asset Management
  segment provides equity, fixed income, real estate, and other alternative investments,
  as well as fund offerings. This segment also offers pension accumulation products
  and services, mutual funds, asset management, income annuities, and life insurance
  accumulation products, as well as voluntary savings plans. The Benefits and Protection
  segment provides specialty benefits, such as specialty benefits group dental and
  vision insurance, group life and other insurance, and group and individual disability
  insurance, as well as administers group dental, disability, and vision benefits;
  and individual life insurance products comprising universal, variable universal,
  indexed universal, and term life insurance products. This segment serves insurance
  solutions for small and medium-sized businesses and their owners, as well as employees.
  The company was founded in 1879 and is based in Des Moines, Iowa.
