longBusinessSummary: 'Cummins Inc. offers various power solutions worldwide. The company
  operates through five segments: Engine, Distribution, Components, Power Systems,
  and Accelera. It offers diesel and natural gas-powered engines; and drivetrain systems,
  including axles, drivelines, brakes, and suspension systems; and on- and off-highway,
  and other products. The company also provides aftertreatment technology and solutions
  comprising custom engineering systems and integrated controls, oxidation catalysts,
  particulate filters, and selective catalytic reduction systems, as well as engineered
  components, including dosers; turbochargers, fuel systems, and valvetrain technologies;
  electronic control modules, sensors, and supporting software; and automated manual
  transmissions, and automatic transmissions for internal combustion engines. In addition,
  it sells and offers support services power generation systems, high-horsepower engines,
  and heavy-duty and medium-duty engines; offers application engineering services,
  custom-designed assemblies, and in-shop and field-based repair services; and retail
  and wholesale aftermarket parts. Further, the company offers standby and prime power
  generators, controls, paralleling systems, and transfer switches; turnkey solutions
  for distributed generation and energy management applications using natural gas,
  diesel, battery energy storage systems, and newer alternative sustainable fuels;
  diesel and natural gas high-speed, high-horsepower engines; and A/C generator/alternator
  products. Additionally, it provides electrified power systems, including batteries,
  fuel cells, and electric powertrain technologies. It sells its products to original
  equipment manufacturers, distributors, dealers, and other customers. The company
  was formerly known as Cummins Engine Company and changed its name to Cummins Inc.
  in 2001. Cummins Inc. was founded in 1919 and is headquartered in Columbus, Indiana.'
