longBusinessSummary: 'Skanska AB (publ) operates as a construction and project development
  company in the Nordics, Europe, and the United States. It operates through four
  segments: Construction, Residential Development, Commercial Property Development,
  and Investment Properties. The Construction segment builds social infrastructure,
  including schools, hospitals, healthcare, and judicial buildings; mass transit comprising
  rails, subways, and airports; highways, bridges, and tunnels; data centers and advanced
  tech manufacturing buildings/facilities; energy; defense-related buildings and infrastructure;
  offices, manufacturing, and other commercial buildings; and residential multifamily
  buildings. Its Residential Development segment develops and builds single and multifamily
  homes. The Commercial Property Development segment initiates, develops, leases,
  and divests in offices, life-science, and logistics and commercial warehouses, as
  well as residential rental properties. Its Investment Properties segment invests
  and manages office properties. The company was formerly known as Skånska Cementgjuteriet
  and changed its name to Skanska AB (publ) in December 1983. Skanska AB (publ) was
  founded in 1887 and is headquartered in Stockholm, Sweden.'
