longBusinessSummary: Stryker Corporation operates as a medical technology company
  in the United States and internationally. It operates through two segments, MedSurg
  and Neurotechnology, and Orthopaedics. The MedSurg and Neurotechnology segment offers
  surgical equipment, patient and caregiver safety technologies, navigation systems,
  endoscopic and communications systems, patient handling, emergency medical equipment
  and intensive care disposable products, clinical communication and artificial intelligence-assisted
  virtual care platform technology, and minimally invasive products for the treatment
  of acute ischemic and hemorrhagic stroke and venous thromboembolism; traditional
  brain and open skull based surgical procedures products; and orthobiologic and biosurgery
  products, including synthetic bone grafts and vertebral augmentation products. The
  Orthopaedics segment provides implants for use in total joint replacements, such
  as hip, knee and shoulder, ankle, and trauma and extremities surgeries; and Mako
  Shoulder, which expands the smart robotics suite of applications. The company sells
  its products to doctors, hospitals, and other healthcare facilities through company-owned
  subsidiaries and branches, as well as third-party dealers and distributors in approximately
  61 countries. Stryker Corporation was founded in 1941 and is headquartered in Portage,
  Michigan.
