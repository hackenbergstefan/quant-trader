longBusinessSummary: AT&T Inc. provides telecommunications and technology services
  worldwide. It operates through two segments, Communications and Latin America. The
  Communications segment offers wireless voice and data communications services; and
  sells handsets, wireless data cards, wireless computing devices, carrying cases/protective
  covers, and wireless chargers through its own company-owned stores, agents, and
  third-party retail stores. It also provides AT&T Dedicated Internet, fiber ethernet
  and broadband, fixed wireless, and hosted and managed professional services; and
  copper-based voice and data, Virtual Private Networks (VPN), wholesale, outsourcing,
  and IP, as well as customer premises equipment for multinational corporations, small
  and mid-sized businesses, governmental, and wholesale customers. In addition, this
  segment offers broadband services, including fiber connections, legacy telephony
  voice communication services, and other VoIP services and equipment to residential
  customers. This segment markets its communications services and products under the
  AT&T, AT&T Business, Cricket, AT&T PREPAID, AT&T Fiber, and AT&T Internet Air brand
  names. Its Latin America segment provides postpaid and prepaid wireless services
  in Mexico under the AT&T and Unefon brand names, as well as sells smartphones through
  its stores, agents and third-party retail stores. The company was formerly known
  as SBC Communications Inc. and changed its name to AT&T Inc. in 2005. AT&T Inc.
  was incorporated in 1983 and is based in Dallas, Texas.
