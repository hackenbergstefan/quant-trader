longBusinessSummary: Aon plc operates as a professional services firm in the United
  States, rest of the Americas, the United Kingdom, Ireland, rest of Europe, the Middle
  East, Africa, and the Asia Pacific. It operates through Risk Capital and Human Capital
  segments. The company offers commercial risk solutions comprising retail and insurance
  brokerage, specialty solutions, global risk consulting, captives management, and
  affinity programs; health solutions, such as consulting and brokerage, consumer
  benefits, and talent advisory services; and wealth solutions, including retirement
  consulting and investments. It also provides treaty and facultative reinsurance;
  strategy and technology group solutions; insurance-linked securities, capital raising,
  strategic advice, restructuring, and merger and acquisition services; and risk management
  products and solutions, capital market solutions, and corporate finance advisory
  services. In addition, the company offers strategic design advice and actuarial
  services; pension risk transfer and integrated pension administration; and investment
  advisory services on developing and maintaining investment programs across various
  plan types, including defined benefit plans, defined contribution plans, master
  trusts, and pooled employer plans for corporations, public pensions, endowments,
  and foundations. Aon plc was incorporated in 1979 and is headquartered in Dublin,
  Ireland.
