longBusinessSummary: KION GROUP AG provides industrial trucks and supply chain solutions
  in Western and Eastern Europe, the Middle East, Africa, North America, Central and
  South America, China, and the rest of the Asia Pacific. It operates through Industrial
  Trucks & Services; and Supply Chain Solutions segments. The company offers forklift
  and heavy trucks, counterbalance trucks with electric drive and internal combustion
  engine, intralogistics systems, components and spare parts, narrow aisle trucks,
  lithium-ion batteries, and industrial and warehouse trucks under the Linde, STILL,
  Baoli, Fenwick, and OM brands. It also leases and rents industrial trucks and related
  equipment; and provides maintenance and repair services, fleet management solutions,
  driver assistance systems, and service options, as well as finance solutions. In
  addition, the company provides integrated technology and software solutions, automated
  guided vehicle systems, warehouse automation solutions, palletizers, storage and
  picking equipment, automated storage and retrieval systems, system components and
  racking, sorters, and conveyors under the Dematic brand. Further, it offers logistics
  solutions. The company was formerly known as KION Holding 1 GmbH. KION GROUP AG
  was founded in 2006 and is headquartered in Frankfurt am Main, Germany.
