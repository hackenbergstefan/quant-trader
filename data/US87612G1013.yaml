longBusinessSummary: Targa Resources Corp., together with its subsidiaries, owns,
  operates, acquires, and develops a portfolio of complementary domestic infrastructure
  assets in North America. It operates in two segments, Gathering and Processing,
  and Logistics and Transportation. The company is involved in gathering, compressing,
  treating, processing, transporting, and selling natural gas; storing, fractionating,
  treating, transporting, and selling natural gas liquids (NGL) and NGL products,
  including services to liquefied petroleum gas exporters; and gathering, storing,
  terminaling, purchasing, and selling crude oil. It is involved in the purchase and
  resale of NGL products; and sale of propane, as well as provision of related logistics
  services to multi-state retailers, independent retailers, and other end-users. In
  addition, the company offers NGL balancing services; and transportation services
  to refineries and petrochemical companies in the Gulf Coast area, as well as purchases,
  markets, and resells natural gas. The company also leased and owned railcars, tractors,
  vacuum trucks and pressurized NGL barges. Targa Resources Corp. was incorporated
  in 2005 and is headquartered in Houston, Texas.
