longBusinessSummary: 'Powszechna Kasa Oszczednosci Bank Polski Spólka Akcyjna provides
  various banking products and services in Poland and internationally. It operates
  through three segments: Retail, Corporate and Investment, and Transfer Center and
  Other. The company offers current, currency, children and teenagers, and savings
  accounts; term deposits; and consumer, real estate, business, mortgage, and corporate
  loans. It also provides investment and insurance products; investment funds; credit,
  account, and debit cards; payments and online banking services; and private banking,
  electronic, and mobile banking services; leases and factoring services to firms
  and enterprises, developers, cooperatives, and property managers; and cash management
  and trade finance services, safekeeping of securities, and currency products and
  derivatives. In addition, the company is involved in agreement for financing large
  projects; issuing non-treasury securities; and investing and brokerage activities,
  as well as transactions in derivative instruments and debt securities; investment
  and pension fund management; sale of post-lease assets; securitization of lease
  receivables; lease of cars; outsourcing of IT specialists; and developing, leasing,
  buying, selling, and managing real estate. Further, it offers life, house and apartment,
  travel, health, banking product, and personal insurance; and transfer agent, debt
  collection, and fleet management services. It serves its products and services to
  individual customers, companies, enterprises, and corporations and local governments.
  The company was founded in 1919 and is based in Warsaw, Poland.'
