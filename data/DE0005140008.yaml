longBusinessSummary: Deutsche Bank Aktiengesellschaft, a stock corporation, provides
  corporate and investment banking, private clients, and asset management products
  and services in Germany, the United Kingdom, the rest of Europe, the Americas, the
  Asia-Pacific, the Middle East, and Africa. It operates through Corporate Bank, Investment
  Bank, Private Bank, and Asset Management segments. The Corporate Bank segment offers
  cash management services, such as integrated payments and FX solutions; trade finance
  and lending offerings, including documentary and guarantee business, and structured
  trade finance and lending; and depository receipts, corporate trust, document custody,
  and securities services. The Investment Bank segment provides financing solutions
  in industries and asset classes; institutional sales, trading, and structuring in
  foreign exchange, rates, emerging markets, and credit trading; liquidity, market
  making services, and specialized risk management solutions for fixed income and
  currencies products; and advisory and financial products and services. This segment
  is also involved in the mergers and acquisitions business; and capital markets businesses
  in debt and equity. The Private Bank segment offers a range of payment and account
  services, and credit and deposit products, as well as investment advice, and postal
  and parcel services; and planning, managing and investing wealth, financing personal
  and business interests, and servicing institutional and corporate needs. The Asset
  Management segment provides access to investment capabilities in active and passive
  asset classes comprising Xtrackers range and alternatives; and access to private
  equity, private credit, real estate, and infrastructure. Deutsche Bank Aktiengesellschaft
  was incorporated in 1870 and is headquartered in Frankfurt am Main, Germany.
