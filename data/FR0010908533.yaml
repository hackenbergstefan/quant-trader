longBusinessSummary: Edenred SE operates as a digital platform for services and payments
  for companies, employees, and merchants worldwide. It offers employee benefit solutions,
  including Ticket Restaurant, a solution that allows employees to take time out for
  lunch at a partner merchant; Ticket Alimentación, which allows users to pay for
  groceries in stores and supermarkets; Edenred Regalo, a gift voucher; Ticket CESU,
  a human services solution; Edenred City, a solution that enables the purchase of
  staples, such as food and fuel; Welfare Edenred, which employees can use to pay
  for various services, including access to sports facilities and solutions for their
  children's educational needs; Edenred Eco, a solution that encourages the purchase
  of environmentally friendly products in Belgium; and Kadéos Culture in France and
  Ticket Cultura in Brazil for cultural goods and services, as well as mobility solutions
  through Edenred Mobility. The company also offers mobility solutions comprising
  Ticket Car for employees to pay for fuel and other business travel expenses; Empresarial,
  which enables companies to control spending to reimburse expense claims; Cintelink,
  a smart cloud platform for service stations and commercial fleets; UTA Edenred,
  a fuel card; Ticket Fleet Pro for truck fleet management; Edenred Finance that provides
  refund services to European transportation companies; The Right Fuel Card, a fuel
  card manager; and Spirii, a platform for recharging electric vehicles. In addition,
  it provides complementary solutions comprising corporate payment, incentive and
  rewards, salary card solutions; and benefits and engagement programs. Edenred SE
  was founded in 1962 and is headquartered in Issy-les-Moulineaux, France.
