longBusinessSummary: Nordea Bank Abp offers banking products and services for individuals,
  families, and businesses in Sweden, Finland, Norway, Denmark, and internationally.
  It operates through Personal Banking, Business Banking, Large Corporates & Institutions,
  and Asset & Wealth Management segments. The company provides various financial services
  to customers through mobile banking, over the phone, online meetings, and branch
  offices. It also offers payments, cash management, cards, working capital management,
  and cards and finance solutions. In addition, the company provides financing, payment,
  investment banking, capital market products, and securities services; and investment,
  savings, and risk management solutions. Further, it offers savings products and
  asset management, including investment funds, discretionary management, portfolio
  advice, and equity trading and pension accounts; and asset-based financing through
  leasing, hire purchase, factoring, and sales to finance partners, such as dealers,
  vendors and retailers, as well as life insurance and pension products and services.
  The company was founded in 1820 and is headquartered in Helsinki, Finland.
