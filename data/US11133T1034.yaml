longBusinessSummary: Broadridge Financial Solutions, Inc. provides investor communications
  and technology-driven solutions for the financial services industry in the United
  States and internationally. The company's Investor Communication Solutions segment
  handles the proxy materials distribution and voting processes for bank, broker-dealer,
  corporate issuer, and fund clients; provides fund manager; and various other regulatory
  communication solutions. The segment also offers ProxyEdge, an institutional voting
  platform that allows institutional investors to view, manage, and vote multi-custodial
  holdings, as well as third party vote recommendations; data-driven analytics solutions;
  international corporate governance solutions; fiduciary-focused learning and development,
  software and technology, and data and analytics services, as well as automated mutual
  fund and exchange-traded funds trade processing; content management and omni-channel
  distribution platform; corporate solutions that revolve around shareholder meetings
  and proxy, corporate governance, regulatory filings and disclosure, and stock transfer
  services; corporate issuer solutions; and customer communications solutions. The
  Global Technology and Operations segment provides solutions that automate the front-to-back
  transaction lifecycle of equity, mutual fund, fixed income, foreign exchange and
  exchange-traded derivatives, order capture and execution, trade confirmation, margin,
  cash management, clearing and settlement, reference data management, reconciliations,
  securities financing and collateral management, asset servicing, compliance and
  regulatory reporting, portfolio accounting, and custody-related services. This segment
  also offers business process outsourcing services; technology solutions, such portfolio
  management, compliance, fee billing, and operational support solutions; and capital
  market and wealth and investment management solutions. The company was founded in
  1962 and is headquartered in New York, New York.
