longBusinessSummary: American Electric Power Company, Inc., an electric public utility
  holding company, engages in the generation, transmission, and distribution of electricity
  for sale to retail and wholesale customers in the United States. It operates through
  Vertically Integrated Utilities, Transmission and Distribution Utilities, AEP Transmission
  Holdco, and Generation & Marketing segments. The company generates electricity using
  coal and lignite, nuclear, natural gas, renewable, hydro, solar, wind, and other
  energy sources; owns, operates, maintains, and invests in transmission infrastructure;
  and engages in the retail supply, and wholesale energy trading and marketing businesses.
  It operates approximately 252,000 circuit miles of distribution lines; 38,000 circuit
  miles of transmission lines; and 25,000 MWs of regulated owned generating capacity.
  American Electric Power Company, Inc. was incorporated in 1906 and is headquartered
  in Columbus, Ohio.
