longBusinessSummary: Live Nation Entertainment, Inc. operates as a live entertainment
  company worldwide. The company operates through Concerts, Ticketing, and Sponsorship
  & Advertising segments. Its Concerts segment promotes live music events in its owned
  or operated venues, and in rented third-party venues. This segment operates and
  manages music venues; produces music festivals; creates associated content; and
  offers management and other services to artists. The Ticketing segment manages the
  ticketing operations, including the provision of ticketing software and services
  to consumers with marketplace for tickets and event information through mobile apps,
  other websites, and retail outlets, as well as its websites, such as livenation.com
  and ticketmaster.com; and provides ticket resale services. This segment offers ticketing
  services for arenas, stadiums, amphitheaters, music clubs, concert promoters, professional
  sports franchises and leagues, college sports teams, performing arts venues, museums,
  and theaters. Its Sponsorship & Advertising segment sells international, national,
  and local sponsorships and placement of advertising, including signage, online advertising,
  and promotional programs; rich media offering, including advertising related with
  live streaming and music-related content; and ads through distribution network of
  venues, events, and websites. This segment also manages the development of strategic
  sponsorship programs, as well as develops, books, and produces custom events or
  programs for specific brands. It owns, operates, or leases entertainment venues.
  The company was formerly known as Live Nation, Inc. and changed its name to Live
  Nation Entertainment, Inc. in January 2010. Live Nation Entertainment, Inc. was
  incorporated in 2005 and is headquartered in Beverly Hills, California.
