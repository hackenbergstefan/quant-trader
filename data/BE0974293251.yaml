longBusinessSummary: Anheuser-Busch InBev SA/NV produces and sells beer in North America,
  Middle Americas, South America, Europe, the Middle East, Africa, and the Asia Pacific.
  It operates through North America, Middle Americas, South America, EMEA, Asia Pacific,
  and Global Export and Holding Companies segments. The company also offers flavored
  malt beverages, soft drinks, spirit-based ready-to-drink cocktails and beverages,
  and energy drinks. In addition, it operates BEES, a business-to-business digital
  commerce platform; on-demand delivery platforms under the Zé Delivery and TaDa Delivery
  brands; and premium at-home draft system under the PerfectDraft brand. The company
  provides a portfolio of approximately 500 beer brands, which primarily include Budweiser,
  Corona Extra, Michelob Ultra, and Stella Artois; Aguila, Brahma, Carling Black Label,
  Cass Fresh, Jupiler, Quilmes, SKOL, and Victoria; Beck's, Hoegaarden, and Leffe;
  Antarctica, Bud Light, Castle, Castle Lite, Cristal, Harbin, Modelo Especial, Sedrin,
  and Skol brands, as well as non-beer brands comprising Brutal Fruit, Cutwater, and
  NÜTRL brands. The company was formerly known as InBev SA and changed its name to
  Anheuser-Busch InBev SA/NV in November 2008. Anheuser-Busch InBev SA/NV was founded
  in 1366 and is headquartered in Leuven, Belgium.
