longBusinessSummary: Westinghouse Air Brake Technologies Corporation provides locomotives,
  equipment, systems, and services for the freight rail and passenger transit industries
  worldwide. It operates in two segments, Freight and Transit. It offers diesel-electric
  and liquid natural gas-powered locomotives; engines, electric motors, and propulsion
  systems; and marine and mining products. The company also offers positive train
  control equipment; electronically controlled pneumatic braking products; railway
  electronics; signal design and engineering services; distributed locomotive power,
  and train cruise and remote controls; industrial/mobile Internet of Things hardware
  and software, edge-to-cloud, on and off-board analytics and rules, and asset performance
  management solutions; rail and shipper transportation management, and port visibility
  and optimization solutions; and network optimization solutions. In addition, it
  provides freight car trucks, braking equipment, and related components; air compressors
  and dryers, as well as heating, ventilation, and air conditioning (HVAC) systems;
  heat transfer components and systems; custom engineered burners and combustion systems;
  rail gear, signaling, and switch products; and turbochargers. Further, it offers
  freight locomotive overhauls, modernizations, and refurbishment; locomotive and
  car maintenance; transit locomotive and car overhaul; unit exchange of locomotive
  components; long-term parts arrangements; and way equipment maintenance services.
  Additionally, it provides railway and freight braking equipment and related components;
  brake shoes, discs, and pads; HVAC equipment; access and platform screen doors;
  pantographs; power converters and battery chargers; passenger information systems
  and closed-circuit television; signaling and railway electric relays; and doors,
  window assemblies, accessibility lifts, ramps, and electric charging solutions for
  buses. The company was founded in 1869 and is headquartered in Pittsburgh, Pennsylvania.
