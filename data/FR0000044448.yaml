longBusinessSummary: Nexans S.A. manufactures and sells cables in France, Canada,
  Norway, Italy, and internationally. It operates through PWR-Grid & Connect, PWR-Transmission,
  and Other segments. The company provides cables for the energy distribution networks,
  as well as equipment cables for buildings. It also offers design, engineering, financing,
  asset management, and systems management solutions for offshore wind farms, subsea
  interconnections, onshore high voltage, and subsea data transmissions; and smart
  solutions for the oil and gas sector. In addition, the company offers wire rods
  and electrical wires; and engages in winding wire production operations. The company
  was formerly known as Atalec and changed its name to Nexans S.A. in October 2000.
  The company was incorporated in 1994 and is headquartered in Courbevoie, France.
