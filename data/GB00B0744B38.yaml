longBusinessSummary: Bunzl plc operates as a distribution and services company in
  the North America, Continental Europe, the United Kingdom, Ireland, and internationally.
  It provides personal protection and safety equipment, including gloves, boots, hard
  hats, ear and eye protection, other workwear, as well as cleaning and hygiene supplies
  and asset protection products; and healthcare consumables, such as gloves, masks,
  swabs, gowns, bandages, healthcare devices, and other healthcare related equipment.
  The company also offers cleaning and hygiene materials comprising chemicals and
  hygiene paper; goods-not-for-resale, including food packaging, films, labels, and
  other store supplies; non-food consumables, such as food packaging, disposable tableware,
  guest amenities, catering equipment, and agricultural supplies; and other products.
  It serves its products to industrial, construction, e-commerce, hospitals, care
  homes and other facilities serving the healthcare, public sector customers, grocery
  stores, supermarkets, convenience stores, hotels, restaurants, contract caterers,
  food processors, commercial growers, leisure, retail customers, and office supply
  companies. Bunzl plc was founded in 1854 and is based in London, the United Kingdom.
