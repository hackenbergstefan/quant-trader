longBusinessSummary: NatWest Group plc, together with its subsidiaries, provides banking
  and financial products and services in the United Kingdom and internationally. It
  operates through the Retail Banking, Private Banking, and Commercial & Institutional
  segments. The Retail Banking segment offers a range of banking products and related
  financial services, such as current accounts, mortgages, personal unsecured lending,
  and personal deposits, as well as mobile and online banking services. Its Private
  Banking segment provides banking, lending, and wealth management products for high-net-worth
  individuals and their business interests. The Commercial & Institutional segment
  consists of customer businesses under business banking, commercial mid-market, and
  corporates and institutions; and offers banking operations services in the Channel
  Islands, Isle of Man, Gibraltar, and Luxembourg, as well as products and solutions
  for businesses comprising start-ups, corporates, and large institutions. The company
  was formerly known as The Royal Bank of Scotland Group plc and changed its name
  to NatWest Group plc in July 2020. NatWest Group plc was founded in 1727 and is
  headquartered in Edinburgh, the United Kingdom.
