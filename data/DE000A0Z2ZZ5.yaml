longBusinessSummary: freenet AG provides telecommunications, broadcasting, and multimedia
  services for mobile communications/mobile internet, and digital lifestyle sectors
  in Germany. It operates through Mobile Communications, TV and Media, and Other/Holding
  segments. The Mobile Communications segment engages in marketing mobile communications
  services, which include voice and data services from the mobile network operators;
  planning, set up, installation, and maintenance services for WiFi networks; and
  selling and distribution of mobile devices, as well as offering additional services
  for mobile data communications and digital lifestyle. This segment also provides
  network-independent services and tariffs; tariffs of the network operators; and
  freenet Internet, an app-based Internet product. The TV and Media segment is involved
  in the planning, project management, construction, operation, service, and marketing
  services for broadcast-related solutions for business clients in the broadcasting
  and media sectors; and the provision of services to end users in the field of DVB-T2
  and IPTV. The Other/Holding segment offers portal services, such as e-commerce/advertising
  services; payment services; various digital products and entertainment formats for
  downloading and displaying, as well as use on mobile devices; communication development
  solutions, IT services, and other services; narrowband voice services; data services;
  and distribution services. Additionally, the company engages in the business that
  develops and operates a platform for IP Entertainment Services. The company offers
  live TV, video on demand, personalized content, and a media library of films and
  series. The company was formerly known as telunico holding AG and changed its name
  to freenet AG in March 2005. freenet AG was incorporated in 2005 and is headquartered
  in Büdelsdorf, Germany.
