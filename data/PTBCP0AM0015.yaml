longBusinessSummary: Banco Comercial Português, S.A. engages in the provision of various
  banking and financial products and services in Portugal and internationally. The
  company operates through Retail Banking; Companies and Corporate; Private Banking;
  International Business, and Other segments. It offers a range of financial products
  and services, including current accounts, payment systems, savings and investment
  products, private banking, asset management, and investment banking services, such
  as mortgage loans, personal loans, commercial banking, leasing, factoring, insurance,
  and other products. The company is also involved in the provision of investment
  fund and real estate management, e-commerce, web portal, leasing, consulting, brokerage,
  marketing, and real estate investment fund management services; and internet, telephone,
  and mobile banking services as well as buying and selling real estate. In addition,
  it offers credit, debit, and prepaid cards; personal, mortgage, car loan, and salary
  loan; health, car, life, travel, personal accident, home, pet, work accident, payment
  protection, and transportation and repatriation insurance; retirement services;
  structured products, discretionary management, investment funds, and other technology
  and services. Further, the company provides short, medium, and long term financing
  solutions; internacional operations financing; and treasury services. Banco Comercial
  Português, S.A. was incorporated in 1985 and is based in Porto, Portugal.
