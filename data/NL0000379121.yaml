longBusinessSummary: Randstad N.V. provides solutions in the field of work and human
  resources services primarily in North America, Northern Europe, Southern Europe,
  the United Kingdom, Latin America, and the Asia Pacific. The company offers temporary
  staffing and permanent placement, job posting, and résumé services on digital platforms.
  It also provides recruitment process outsourcing, payroll, and outplacement services,
  as well as managed services programs. In addition, the company offers inhouse, enterprise
  and digital, and tech suite services, as well as career development and online talent
  acquisition services. The company was formerly known as Randstad Holding NV and
  changed its name to Randstad N.V. in April 2018. Randstad N.V. was founded in 1960
  and is headquartered in Diemen, the Netherlands.
