longBusinessSummary: Rollins, Inc., through its subsidiaries, provides pest and wildlife
  control services and protection to residential and commercial customers in the United
  States and internationally. The company offers pest control services to residential
  properties protecting from common pests, including rodents, insects, and wildlife.
  It also provides workplace pest control solutions for customers across various end
  markets, such as healthcare, food service, and logistics. In addition, the company
  offers termite protection and ancillary services for both residential and commercial
  customers. It serves clients directly, as well as through franchisee operations.
  The company was formerly known as Rollins Broadcasting, Inc and changed its name
  to Rollins, Inc. in 1965. Rollins, Inc. was founded in 1901 and is headquartered
  in Atlanta, Georgia.
