longBusinessSummary: Deckers Outdoor Corporation, together with its subsidiaries,
  designs, markets, and distributes footwear, apparel, and accessories for casual
  lifestyle use and high-performance activities in the United States and internationally.
  The company offers footwear, apparel, and accessories under the UGG brand; footwear,
  such as running, trail, hiking, fitness, and lifestyle shoes, as well as apparel
  and accessories under the HOKA brand; and sandals, shoes, and boots under the Teva
  brand name. It also provides a casual footwear fashion line under the Koolaburra
  brand name; and footwear products under the AHNU brand name. The company sells its
  products through domestic and international retailers, international distributors,
  and directly to its consumers through its direct-to-consumer business, which includes
  e-commerce websites and retail stores. Deckers Outdoor Corporation was founded in
  1973 and is headquartered in Goleta, California.
