longBusinessSummary: Bayer Aktiengesellschaft operates as a life science company in
  Europe, the Middle East, Africa, Germany, Switzerland, North America, the United
  States, the Asia Pacific, China, Latin America, and Brazil. It operates through
  Pharmaceuticals, Consumer Health, and Crop Science segments. The Pharmaceuticals
  segment provides prescription products primarily for cardiology and women's health
  care; specialty therapeutics in the areas of oncology, hematology, and ophthalmology;
  and diagnostic imaging equipment and contrast agents, as well as cell and gene therapy.
  The Consumer Health segment offers nonprescription over-the-counter medicines for
  self-medication and self-care; nutritional supplements; allergy, cough, and cold;
  dermatology; pain and cardiovascular risk prevention; and digestive health products.
  The Crop Science segment offers chemical and biological crop protection products,
  improved plant traits, seeds, digital solutions, and pest and weed management products,
  as well as customer services for agriculture. It also engages in the breeding, propagation,
  and production/processing of seeds, including seed dressing. The company distributes
  its products through wholesalers, pharmacies and pharmacy chains, supermarkets,
  online and other retailers, and hospitals, as well as directly to farmers. Bayer
  Aktiengesellschaft has a strategic alliance with The University of Colorado Anschutz,
  along with UCHealth and Children's Hospital Colorado to advance drug development
  and clinical trials. Bayer Aktiengesellschaft has a strategic alliance Henry Ford
  Health. It has a commercial agreement with Neste to Jointly scale newgold winter
  canola for biofuels production. Bayer Aktiengesellschaft was founded in 1863 and
  is based in Leverkusen, Germany.
