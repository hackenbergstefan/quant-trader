longBusinessSummary: Quilter plc provides advice-led investment solutions in the United
  Kingdom and internationally. It operates through High Net Worth and Affluent segments.
  The High Net Worth segment provides discretionary investment management services
  to high-net worth clients, charities, companies, and institutions through a network
  of branches; and financial advice services for protection, mortgages, savings, investment,
  and pensions primarily to high-net-worth clients. Its Affluent segment comprises
  Quilter Investment Platform, an investment platform for advice-based wealth management
  products and services; Quilter Investor, which offers investment solutions in the
  form of funds for the group and third-party clients; and Quilter Financial planning,
  a restricted and independent financial adviser network that provides mortgage and
  financial planning advice, and solution for individuals and business through a network
  of intermediaries. The company was incorporated in 2007 and is based in London,
  the United Kingdom.
