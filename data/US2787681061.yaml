longBusinessSummary: EchoStar Corporation provides pay-tv services in the United States,
  Mexico, Canada, South and Central America, Asia, Africa, Australia, Europe, India,
  and the Middle East. The Pay-TV segment offers a direct broadcast and fixed satellite,
  owned and leased satellites, leased fiber optic networks, in-home services, and
  call center operation services; digital broadcast operations, including satellite
  uplinking/downlinking, transmission and, other services to third-party pay-TV providers;
  multichannel, live-linear and on-demand streaming over-the-top Internet-based domestic,
  international, Latino, and Freestream video programming services; and receiver systems.
  Its Wireless segment provides wireless communication services and products; and
  a range of wireless devices. The Broadband and Satellite Services offers broadband
  satellite technologies, and internet products and services to consumer customers,
  including home and small to medium-sized businesses; managed services, equipment,
  hardware, satellite services, and communications solutions to government and enterprise
  customers, as well as to the unserved and underserved consumer, enterprise, aeronautical,
  and government markets; and integrated multi-transport solutions that enable airline
  and airline service providers to deliver in-flight network connectivity. This segment
  also designs, provides, and installs gateway and terminal equipment to customers
  for other satellite systems; and designs, develops, constructs, and provides telecommunication
  networks comprising satellite ground segment systems and terminals to mobile system
  operators and enterprise customers. Its Other segment consists of 5G network and
  5G network deployment operations. The company sells its products and services under
  the Boost Mobile, DISH, Gen Mobile, Hughes, Hughesnet, and Sling brands. The company
  was formerly known as EchoStar Holding Corporation. EchoStar Corporation was founded
  in 1980 and is headquartered in Englewood, Colorado.
