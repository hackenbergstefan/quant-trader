longBusinessSummary: Hiab Oyj provides smart and on road load-handling solutions and
  services in Finland. The company provides loader cranes under HIAB, EFFER, and ARGOS
  brands; truck-mounted forklifts under MOFFETT and PRINCETON brands; forestry cranes
  under LOGLIFT brand; recycling cranes under JONSERED brand; demountable and hooklifts
  under MULTILIFT brand; roll-off cable hoists under GALFAB brand; tail lifts under
  ZEPRO, DEL, and WALTCO brands. It also offers maintenance, equipment warranty, and
  spare parts. The company serves waste and recycling, defense logistics, retail and
  final mile, and construction industries. The company was formerly known as Cargotec
  Corporation and changed its name to Hiab Oyj in March 2025. Hiab Oyj was founded
  in 1944 and is headquartered in Helsinki, Finland.
