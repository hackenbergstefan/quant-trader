longBusinessSummary: Bayerische Motoren Werke Aktiengesellschaft develops, manufactures,
  and sells automobiles and motorcycles, spare parts, and accessories worldwide. It
  operates through Automotive, Motorcycles, and Financial Services segments. The company
  offers automobiles under the BMW, MINI, and Rolls-Royce brands. It also develops,
  manufactures, and sells scooters, and motorcycles for private use and special-purpose
  vehicles for operational use under the BMW Motorrad brand. In addition, the company
  provides car rentals; credit financing; leasing that include insurance and service
  products; financing for dealership and customer deposits; vehicle fleet financing
  services for corporate car fleets under the Alphabet brand; and financial services
  for the automotive sector. It sells its products through retail outlet, agent, and
  independent dealerships. Bayerische Motoren Werke Aktiengesellschaft was founded
  in 1916 and is headquartered in Munich, Germany.
