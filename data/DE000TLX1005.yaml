longBusinessSummary: Talanx AG provides insurance and reinsurance products and services
  worldwide. The company offers life, casualty, third-party liability, space insurance,
  legal protection, fire, burglary and theft, tap water, plate glass, storm damage,
  comprehensive householders, comprehensive homeowners, hail, livestock, engineering,
  omnium, marine, business interruption, travel assistance, aviation and space liability,
  credit and surety, extended coverage, fire and fire business interruption insurance
  products, other property, and other non-life products. It also provides bancassurance
  activities; motor, life and property, fire, casualty, health, personal accident,
  and specialty insurance products, unit-linked life, annuity, term life, occupation
  disability; aviation and agricultural business; coverage for cyber and digital risks;
  parametric solutions; and structured reinsurance, as well as facultative and nat
  cat business; and asset management businesses. In addition, the company offers insurance
  cover, as well as customized products; and financial services. It has operations
  in Germany, the United Kingdom, Türkiye, Central and Eastern Europe, Rest of Europe,
  the United States, Rest of North America, Latin America, Asia, Australia, and Africa.
  The company was founded in 1903 and is based in Hanover, Germany. Talanx AG is a
  subsidiary of HDI Haftpflichtverband der Deutschen Industrie V.a.G.
