longBusinessSummary: Zabka Group S.A. operates as an ultimate convenience ecosystem
  in Poland. The company operates convenience retail stores and Zabka Nano Stores,
  an autonomous store. It also provides digital offering solutions, including Maczfit,
  a direct-to-consumer (D2C) meal solution; Dietly, an online D2C meal solutions marketplace.;
  and eGrocery and e-commerce services under the Zappka, delio and Zabka Jush brands.
  In addition, the company franchises retail stores; and engages in the IT consultancy
  related activities, real estate construction, warehousing and storage of goods,
  rental and management of own or leased real estate, and sale of merchandise. Further,
  it is involved in the retail sale of tobacco products in specialised stores; production
  and distribution of ready meals; software related activities connected with catering
  platform; transport of goods; distribution of FMCG products; and other activities
  supporting financial services. It sells its products through physical convenience
  stores and online. The company was founded in 1998 and is headquartered in Luxembourg,
  Luxembourg.
