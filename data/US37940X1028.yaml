longBusinessSummary: Global Payments Inc. provides payment technology and software
  solutions for card, check, and digital-based payments in the Americas, Europe, and
  the Asia-Pacific. It offers authorization, settlement and funding, customer support,
  chargeback resolution, reconciliation and dispute management, terminal rental, sales
  and deployment, payment security, and consolidated billing and reporting services.
  The company also provides an array of enterprise software solutions that streamline
  business operations of its customers in various vertical markets; and value-added
  solutions and services, such as point-of-sale software, analytics and customer engagement,
  payroll and reporting, and human capital management. It markets its products and
  services through direct sales force, trade associations, agent and enterprise software
  providers, referral arrangements with value-added resellers, independent sales organizations,
  payment facilitators, and financial institutions. The company was founded in 1967
  and is headquartered in Atlanta, Georgia.
