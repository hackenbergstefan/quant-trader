longBusinessSummary: Trimble Inc. offers technology solutions and platform that enable
  office professionals and field workers to connect workflows and industry lifecycles
  in North America, Europe, the Asia Pacific, and internationally. The company provides
  architecture and interior design; building information modeling, engineering, and
  virtual design and construction; and construction and owner software products. It
  also offers field and office software for estimating and job cost management, and
  project design and visualization; software for 3D design and data sharing; systems
  to guide and control construction equipment, such as excavators, bulldozers, wheel
  loaders, motor graders, and paving equipment; systems to monitor, track, and manage
  assets, equipment, and workers; and software to facilitate the management of the
  construction process and for sharing and communication of data in real time. In
  addition, it provides positioning services comprising VRSNow; CenterPoint RTX; FieldPoint
  RTX; Rangepoint RTX; ViewPoint RTX; and Trimble xFill services. Further, it offers
  transportation and logistics solutions for shippers, carriers, retailers, and intermediaries,
  such as carrier transportation management software (TMS) and maintenance solutions
  to manage core transportation operations and maintenance workflows; transporeon
  solutions to provide a cloud-based ecosystem that manages the transportation lifecycle
  from freight sourcing and procurement through transport execution, dock and yard
  management, and auditing; and MAPS, a mapping and routing solutions that provide
  the industry standard for truck-specific routing, mileage, and navigation. It sells
  its technology solutions directly to end users and through software integrations.
  The company was formerly known as Trimble Navigation Limited and changed its name
  to Trimble Inc. in October 2016. Trimble Inc. was founded in 1978 and is headquartered
  in Westminster, Colorado.
