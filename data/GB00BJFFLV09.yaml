longBusinessSummary: Croda International Plc engages in the consumer care, life science,
  and industrial specialty businesses in Europe, the Middle East, Africa, North America,
  Asia, and Latin America. The company offers consumer care products across beauty
  care, beauty actives, and home care products, as well as fragrances and flavours.
  It also provides biologics drug delivery, crop protection, and seed coating systems
  and enhancement technologies to improve germination. In addition, the company offers
  industrial specialties, including phase change materials; surfactants, such as emulsifiers,
  dispersants, wetting agents, detergents, and polymerics; and formulated textile
  and spin finishes. Croda International Plc was incorporated in 1925 and is headquartered
  in Goole, the United Kingdom.
