longBusinessSummary: 'Nokia Oyj, together with its subsidiaries, provides mobile,
  fixed, and cloud network solutions in North and Latin America, Greater China, India,
  Asia Pacific, Europe, the Middle East, and Africa. It operates in four segments:
  Network Infrastructure, Mobile Networks, Cloud and Network Services, and Nokia Technologies.
  The company offers fixed network solutions, such as fiber and copper technologies,
  access infrastructure, in-home Wi-Fi solutions, and cloud and virtualization services;
  IP network solutions, which delivers IP edge routing and data center networking
  solutions for residential, mobile, enterprise, and cloud applications; and optical
  networks solutions, which provides optical transport networks for metro, regional,
  and long-haul applications. It also provides mobile technology products, agentic
  AI platform, and services for radio access networks and microwave radio links for
  transport networks; and network management solutions, as well as network planning,
  optimization, network deployment, and technical support services. In addition, the
  company offers cloud and network services, including open, secure, automated, and
  scalable software and solutions; and 5G core, secure autonomous networks, private
  wireless and industrial edge, and network APIs. Further, it licenses intellectual
  property, including patents, technologies, and the Nokia brand. The company serves
  its products and services to defense communications energy and resources, enterprise
  and industrial campus, private networks, public sector, and transportation industries.
  Nokia Oyj was founded in 1865 and is headquartered in Espoo, Finland.'
