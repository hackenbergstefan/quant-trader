longBusinessSummary: 'Arch Capital Group Ltd., together with its subsidiaries, provides
  insurance, reinsurance, and mortgage insurance products in the United States, Canada,
  Bermuda, the United Kingdom, Europe, and Australia. The company operates through
  three segments: Insurance, Reinsurance, and Mortgage. The Insurance segment offers
  commercial automobile; commercial multiperil; financial and professional line liability;
  admitted, excess, and surplus casualty lines; property and short-tail specialty;
  workers compensation; and casualty insurance. Its Reinsurance segment provides reinsurance
  products for casualty; marine and aviation; property catastrophe; property excluding
  property catastrophe; and other specialty products. The Mortgage segment offers
  U.S. primary mortgage insurance business written predominantly on loans sold to
  the Federal National Mortgage Association and Federal Home Loan Mortgage Corporation;
  reinsurance and underwriting services related to the U.S. credit-risk transfer business
  and other U.S. mortgage reinsurance transactions; and international mortgage insurance
  and reinsurance business covering loans. It markets its products through a group
  of licensed independent retail and wholesale brokers. The company was formerly known
  as Risk Capital Holdings, Inc. Arch Capital Group Ltd. was founded in 1995 and is
  headquartered in Pembroke, Bermuda.'
