longBusinessSummary: 'J.B. Hunt Transport Services, Inc. provides surface transportation,
  delivery, and logistic services in the United States. It operates through five segments:
  Intermodal, Dedicated Contract Services, Integrated Capacity Solutions, Final Mile
  Services, and Truckload. The JBI segment offers intermodal freight solutions. It
  operates 124,838 pieces of company-owned trailing equipment; owns and maintains
  its chassis fleet of 104,474 units; and manages a fleet of 5,880 company-owned tractors,
  308 independent contractor trucks, and 8,704 company drivers. The DCS segment designs,
  develops, and executes supply chain solutions that support various transportation
  networks. As of December 31, 2025, it operated 11,878 company-owned trucks, 761
  customer-owned trucks, and a contractor trucks. It operates 26,767 owned pieces
  of trailing equipment and 5,218 customer-owned trailers. The ICS segment provides
  freight brokerage and transportation logistics solutions; flatbed, refrigerated,
  expedited, and less-than-truckload, as well as dry-van and intermodal solutions;
  online multimodal marketplace; and logistics management services for customers to
  outsource their transportation functions. The FMS segment delivers services through
  1,085 company-owned trucks, 169 customer-owned trucks, and 39 independent contractor
  trucks; and 1,091 owned pieces of trailing equipment and 98 customer-owned trailers.
  The JBT segment provides dry-van freight services by utilizing tractors and trailers
  operating over roads and highways through two company-owned tractors and 12,658
  company-owned trailers. It transports or arranges for the transportation of freight,
  such as general merchandise, specialty consumer items, appliances, home furnishings,
  forest, paper, rubber, plastic products, food, beverages, building materials, apparel,
  accessories, soaps, cosmetics, automotive parts, agricultural products, electronics,
  and chemicals. The company was incorporated in 1961 and is headquartered in Lowell,
  Arkansas.'
