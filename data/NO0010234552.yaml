longBusinessSummary: 'Aker ASA operates as an industrial investment company in Norway,
  Europa, North America, South America, and internationally. The company operates
  in two segments: Listed Equity Investments and Unlisted Equity Investments. It is
  involved in exploration and production of oil and gas; provision of offshore supply
  vessels to global offshore energy markets. In addition, the company develops and
  supplies krill-based products, and health and nutrition products; long-term property
  development and management; industrial software, artificial intelligence (AI) solutions
  and infrastructure, that improve efficiency and decision-making across capital-intensive
  industries; oil and gas production and energy services; renewable energy sector;
  and harvesting and processing of marine biomass for human, and animal nutrition.
  Further, it offers subscriptions to access the software-as-a-service (SaaS) applications.
  Additionally, the company engages in real estate activities. The company was founded
  in 1841 and is based in Lysaker, Norway. Aker ASA operates as a subsidiary of TRG
  Holding AS.'
