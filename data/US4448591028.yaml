longBusinessSummary: Humana Inc. provides medical and specialty insurance products
  in the United States. It operates in two segments, Insurance and CenterWell. The
  Insurance segment offers individual Medicare Advantage products, including health
  insurance benefits, including wellness programs, chronic care management, and care
  coordination; individual Medicare stand-alone prescription drug products (PDP);
  group Medicare advantage and Medicare stand-alone PDP; Medicare supplements; specialty
  and ancillary insurance comprising dental, vision, life and disability; and administrative
  services to arrange health care services for active-duty and retired military personnel
  and dependents, as well as pharmacy benefit managers. Its CenterWell segment operates
  full-service, value-based senior focused primary care centers under the Conviva
  Senior Primary Care and CenterWell Senior Primary Care brands; a management services
  organization; CenterWell Home Health, a home health provider; and OneHome, which
  manages post-acute patient needs, as well as provides pharmacy and hospice solutions.
  The company was formerly known as Extendicare Inc. and changed its name to Humana
  Inc. in April 1974. Humana Inc. was founded in 1961 and is headquartered in Louisville,
  Kentucky.
