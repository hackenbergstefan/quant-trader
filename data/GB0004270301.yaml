longBusinessSummary: Hill & Smith PLC manufactures and supplies infrastructure products
  in the United Kingdom, the rest of Europe, North America, the Middle East, the rest
  of Asia, and internationally. It operates through US Engineered Solutions, UK &
  India Engineered Solutions, and Galvanizing Services segments. The US Engineered
  Solutions segment provides composite and steel solutions for infrastructure construction,
  such as energy transmission and distribution, data centres, waterfront protection,
  transportation, and other industrial facilities, engineered support for water, power,
  and liquid natural gas markets, seismic protection solutions for road work zone
  safety products, and off-grid solar lighting and power solutions. The UK & India
  Engineered Solutions segment offers hostile vehicle mitigation and off-grid solar
  lighting solutions for energy markets. The Galvanizing Services segment offers hot-dip
  galvanizing and powder coating services, increasing the sustainability and maintenance-free
  life of steel products, such as structural steelwork, lighting, bridges, and other
  products for infrastructure and construction end markets. It also offers fiber reinforced
  polymer composite solutions; electrical transmission and distribution substation
  structures; temporary and permanent road safety barriers, vehicle restraint systems,
  security solutions, bridge parapets, and retained earth systems; engineered pipe
  support and ancillary; lighting columns and traffic safety; vibration and seismic
  control; and hostile vehicle mitigation perimeter security; solar light towers,
  message signs, and other construction equipment; perimeter security solutions; galvanized
  lintels, construction fittings, composite doors, builders' metalwork, and plasterers'
  accessories; and open steel flooring, and handrailing. It was formerly known as
  Hill & Smith Holdings PLC and changed its name to Hill & Smith PLC in November 2022.
  The company was founded in 1824 and is based in Solihull, the United Kingdom.
