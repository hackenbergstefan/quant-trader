longBusinessSummary: "Volkswagen AG manufactures automobiles and commercial vehicles\
  \ in Europe, Germany, North America, South America, the Asia-Pacific, and internationally.\
  \ It operates through three segments: Passenger Cars and Light Commercial Vehicles;\
  \ Commercial Vehicles; and Financial Services. The Passenger Cars and Light Commercial\
  \ Vehicles segment develops vehicles, engines and motors, vehicle software, and\
  \ vehicle batteries; produces and sells passenger cars and light commercial vehicles,\
  \ and the parts. This segment also offers compact cars, luxury vehicles, and motorcycles,\
  \ as well as mobility solutions. The Commercial Vehicles segment engages in the\
  \ development of vehicles, engines, and motors; production and sale of trucks and\
  \ buses, parts, and related services. The Financial Services segment engages in\
  \ the dealership and customer financing, leasing, direct banking, and insurance\
  \ activities; and provision of fleet management, and mobility services. In addition,\
  \ the company is involved in the large-bore diesel engines, turbomachinery, and\
  \ propulsion components businesses. Further, develops physical AI data flywheel\
  \ for autonomous vehicle development and connects fleet data to simulation, training,\
  \ and evaluation. It sells its products under the Volkswagen Passenger Cars, \x8A\
  koda, SEAT/CUPRA, Volkswagen Commercial Vehicles, Audi, Lamborghini, Bentley, Ducati,\
  \ Porsche, Scania, MAN, Volkswagen Truck & Bus, TRATON, and Bugatti Rimac, and international\
  \ commercial vehicles brands to individual, corporate, and fleet customers. The\
  \ company was founded in 1937 and is headquartered in Wolfsburg, Germany. Volkswagen\
  \ AG operates as a subsidiary of Porsche Automobil Holding SE."
