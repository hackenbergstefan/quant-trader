longBusinessSummary: Old Dominion Freight Line, Inc. operates as a less-than-truckload
  motor carrier in the United States and North America. The company offers regional,
  inter-regional, and national less-than-truckload services, as well as expedited
  transportation services. It also provides various value-added services, including
  container drayage, truckload brokerage, and supply chain consulting. In addition,
  the company operates fleet maintenance centers. As of December 31, 2025, it owned
  and operated 10,184 tractors, 30,824 linehaul trailers, and 14,313 pickup and delivery
  trailers. Old Dominion Freight Line, Inc. was founded in 1934 and is headquartered
  in Thomasville, North Carolina.
