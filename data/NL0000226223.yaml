longBusinessSummary: "STMicroelectronics N.V., together with its subsidiaries, designs,\
  \ develops, manufactures, and sells semiconductor products in Europe, the Middle\
  \ East, Africa, the Americas, and the Asia Pacific. The company operates through\
  \ Analog products, MEMS and Sensors Group (AM&S); Power and Discrete products (P&D);\
  \ Embedded Processing (\x93EMP\x94); and RF Products (D&RF) segments. It offers\
  \ industrial application-specific integrated circuits (ASICs) and application-specific\
  \ standard products (ASSPs); power management solutions; custom analog ICs, wireless\
  \ charging solutions; galvanic isolated gate and LED drivers; converters, transistors,\
  \ intelligent power switches, clocks and timers, comparators, and current-sense\
  \ amplifiers; micro-electro-mechanical systems (MEMS) sensors, including accelerometers,\
  \ gyroscopes, magnetic sensors, pressure, temperature, presence detection, biosensors,\
  \ machine learning, and edge AI processing smart sensors, as well as thermal and\
  \ piezoelectric actuators; and optical sensing solutions. The company also provides\
  \ silicon MOSFETs, SiC MOSFETs, IGBTs, thyristors, rectifiers, and power modules\
  \ and bipolar transistors; microcontrollers, and automotive microcontrollers and\
  \ secured; radio frequency (RF) communications and ASICs; car infotainment products;\
  \ ultra-wide band and radar systems; and Connected Security Products; and automotive\
  \ driver assistance systems. It serves automotive, industrial, personal electronics\
  \ and communications equipment, and computers and peripherals markets. STMicroelectronics\
  \ N.V. was incorporated in 1987 and is headquartered in Plan-les-Ouates, Switzerland."
