longBusinessSummary: Hubbell Incorporated, together with its subsidiaries, manufactures
  and sells electrical and utility solutions in the United States and internationally.
  It operates through two segments, Electrical Solutions and Utility Solutions. The
  Utility Solution segment offers critical components that allow the grid to transmit
  and distribute energy, as well as the communications and controls technologies,
  including utility transmission and distribution components, such as arresters, insulators,
  connectors, anchors, bushings, enclosures, cutouts, and switches; and solutions
  that serve the edge of the utility infrastructure comprising smart meters, communications
  systems, and protection and control devices. It sells its products under various
  brands and/or trademarks to the electrical distribution, substation and transmission
  markets, as well as markets for grid protection and controls, utility meters and
  advanced metering infrastructure and telcom and gas distribution markets. The Electrical
  Solution segment offers standard and special application wiring device products,
  rough-in electrical products, connector and grounding products, and other electrical
  equipment for use in industrial, commercial, and institutional facilities by electrical
  contractors, maintenance personnel, electricians, utilities, and telecommunications
  companies. It also designs and manufactures various industrial controls, and communication
  systems for use in the non-residential and industrial markets, as well as in the
  oil and gas, and mining industries. This segment sells its products through electrical
  and industrial distributors, home centers, retail and hardware outlets, and residential
  product-oriented internet sites; and special application products primarily through
  wholesale distributors to contractors, industrial customers, and original equipment
  manufacturers. The company was founded in 1888 and is headquartered in Shelton,
  Connecticut.
