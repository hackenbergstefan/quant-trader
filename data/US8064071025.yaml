longBusinessSummary: Henry Schein, Inc. provides health care products and services
  to office-based dental and medical practitioners worldwide. It operates through
  Global Distribution and Value-Added Services; Global Specialty Products; and Global
  Technology segments. The Global Distribution and Value-Added Services segment distributes
  infection-control products, handpieces, preventatives, impression materials, composites,
  anesthetics, teeth, gypsum, acrylics, articulators, abrasives, PPE products, branded
  and generic pharmaceuticals, vaccines, surgical products, diagnostic tests, dental
  chairs, delivery units and lights, digital dental laboratories, X-ray supplies and
  equipment, and high-tech and digital restoration equipment, as well as provides
  equipment repair services, financial services on a non-recourse basis, continuing
  education services for practitioners, consulting, and other services. It also markets
  and sells a portfolio of consumable merchandise under its own corporate brand. The
  Global Specialty Products segment engage in manufacturing, marketing, and sales
  of dental implant and biomaterial products; and endodontic, orthodontic and orthopedic
  products, and other health care-related products and services. The Global Technology
  segment is involved in the development and distribution of practice management software,
  e-services, and other products which are distributed to health care providers. The
  company serves dental practices, laboratories, physician practices, and ambulatory
  surgery centers, as well as government, institutional health care clinics, home
  health providers, and other alternate care clinics. It has a strategic partnership
  with GoTu Technology to help dental practices address ongoing staffing challenges.
  Henry Schein, Inc. was founded in 1932 and is headquartered in Melville, New York.
