longBusinessSummary: TUI AG, together with its subsidiaries, provides tourism services
  internationally. The company operates hotels and resorts under the Mora, Royalton,
  Riu, Robinson, TUI Blue, TUI Magic Life, Atlantica, Grupotel, Iberotel, Akra, TUI
  Suneo, and AQI brands; and cruises under the TUI Cruises, Hapag-Lloyd Cruises, and
  Marella brands. It also provides an online market for tours and activities, including
  experiences and tours; and operates aircraft. It distributes its services through
  markets and airlines, direct to customers, and via third parties, such as online
  travel agents and tour operators. The company was formerly known as Preussag AG
  and changed its name to TUI AG in June 2002. TUI AG was founded in 1968 and is headquartered
  in Hanover, Germany.
