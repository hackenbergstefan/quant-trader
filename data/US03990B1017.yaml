longBusinessSummary: Ares Management Corporation operates as an alternative asset
  manager. Its Direct Lending Group segment provides financing solutions to small-to-medium
  sized companies. The company's Private Equity Group segment specializes in early
  venture, turnaround, mid venture, late venture, recapitalization, growth capital,
  middle market, mezzanine, distressed and growth buyouts. The firm seeks to invest
  in healthcare, services, energy, industrials and consumer. The firm seeks to takes
  majority, minority and shared-control investments primarily in under-capitalized
  companies in North America, Europe, Asia Pacific, Southeast Asia and Australia.
  Its Real Estate Group segment invests in new developments and the repositioning
  of assets, with a focus on control or majority-control investments; and originates
  and invests in a range of self-originated financing opportunities for middle-market
  owners and operators of commercial real estate. The firm prefers to invest between
  $1 million and $500 million in companies having EBITDA between $10 million and $250
  million and debt investment value between $10 million and $100 million. Ares Management
  Corporation was founded in 1997 and is based in Los Angeles, California with additional
  offices in North America, Europe and Asia.
