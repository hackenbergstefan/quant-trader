longBusinessSummary: Roper Technologies, Inc. designs and develops vertical software
  and technology enabled products in the United States, Canada, Europe, Asia, and
  internationally. Its Application Software segment offers comprehensive management,
  diagnostic and laboratory information management, enterprise software and information
  solutions, K-12 school administration, transportation management, financial and
  compliance management, cloud-based and integrated payment processing, campus technology
  and payment, and cloud-based financial analytics, performance management software,
  and data solutions; cloud-based software for the property and casualty insurance
  industry; and foodservice technologies. The Network Software segment provides cloud-based
  data, collaboration, and estimating automation software; electronic marketplace;
  visual effects and 3D content software; cloud-based software and AI-enabled analytics
  solutions for the life insurance and financial services industries; supply chain
  software; health care services and software; data analytics and information; pharmacy
  software solutions; and AI-enabled SaaS providing digital engagement, as well as
  church management and integrated giving solutions for faith-based organizations.
  The Technology Enabled Products segment offers ultrasound procedures accessories;
  dispensers and metering pumps; wireless sensor network and solutions; automated
  surgical scrub and linen dispensing equipment; water meters; optical and electromagnetic
  precision measurement systems; RFID card and credential readers; and medical devices.
  It distributes and sells its products through direct sales offices, manufacturers'
  representatives, resellers, and distributors. The company was formerly known as
  Roper Industries, Inc. and changed its name to Roper Technologies, Inc. in April
  2015. Roper Technologies, Inc. was incorporated in 1981 and is based in Sarasota,
  Florida.
