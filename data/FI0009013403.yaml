longBusinessSummary: KONE Oyj, together with its subsidiaries, engages in the elevator
  and escalator business worldwide. The company provides elevators, escalators, automatic
  building doors, and integrated access control solutions, as well as maintenance
  and modernization solutions. It also offers KONE Office Flow, a modular connected
  people flow solution that delivers personalized access and enhanced user experiences
  in workplaces; health and well-being solutions for elevators, escalators, and doors;
  KONE Access, an access control system, which is integrated with elevator system
  and building doors; KONE Destination, a destination control system that reduce waiting
  and travel times; KONE infotainment, a communication channel for building tenants
  and visitors; and monitoring solutions that enable real-time inspection of elevators
  and escalators. In addition, the company provides people flow planning and consulting
  services; solutions for special buildings and large projects; cybersecurity solutions;
  and energy solutions for greener buildings. It also offers hands-on, immersive training
  to technicians, engineers, and service professional through a training center in
  Egypt. KONE Oyj was founded in 1908 and is based in Espoo, Finland.
