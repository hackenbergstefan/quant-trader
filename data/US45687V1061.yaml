longBusinessSummary: Ingersoll Rand Inc. provides mission-critical air, fluid, clean
  energy, and medical technologies services and solutions worldwide. It operates in
  two segments, Industrial Technologies and Services, and Precision and Science Technologies.
  The Industrial Technologies and Services segment designs, manufactures, markets,
  and services a range of air and gas compression and treatment equipment, vacuum
  and blower products, fluid transfer equipment, loading systems, and power tools
  and lifting equipment; and other specialized equipment, including aftermarket parts,
  consumables and services, air treatment equipment, controls, other accessories,
  and services under the Ingersoll Rand, Gardner Denver, Nash, CompAir, Elmo Rietschle,
  and other brands. The Precision and Science Technologies segment designs, manufactures,
  and markets diaphragm, piston, water-powered, peristaltic, gear, vane, progressive
  cavity, and syringe pumps; and gas boosters, hydrogen compression systems, liquid
  handling systems, odorant injection systems, controls, software, and other related
  components and accessories for precision dosing, liquid and solid transfer, dispensing,
  gas compression and sampling, pressure management, flow control, powder handling,
  and other applications under the Air Dimensions, Albin, ARO, Dosatron, Haskel, Ingersoll
  Rand, LMI, Maximus, Milton Roy, MP, Oberdorfer, Seepex, Thomas, Welch, Williams,
  YZ, and Zinnser Analytic brands. This segment's products are used in medical, laboratory,
  industrial manufacturing, water and wastewater, chemical processing, clean energy,
  food and beverage, agriculture and other markets. It sells its products through
  a network of direct sales representatives and independent distributors. It has a
  strategic alliance with Garrett Motion. The company was formerly known as Gardner
  Denver Holdings, Inc. and changed its name to Ingersoll Rand Inc. in March 2020.
  Ingersoll Rand Inc. was founded in 1859 and is headquartered in Davidson, North
  Carolina.
