longBusinessSummary: ING Bank Slaski S.A., together with its subsidiaries, provides
  various banking products and services for retail clients and businesses in Poland.
  It operates in two segments, Retail Banking and Corporate Banking. The company accepts
  personal and business accounts. Its loan products include cash loans, mortgages,
  business line of credit, invoice financing, leasing, factoring, investment loans,
  business loans, trade finance, guarantees, long-term financing, commercial real
  estate financing, and reverse factoring. The company also offers credit and debit
  cards; investment and savings, and insurance products; and payments, transfers,
  financial management, currency exchange, financial risk management, trust, and mobile
  and internet banking services. In addition, it offers pensions, insurance, and independent
  accounting services. The company was founded in 1989 and is headquartered in Katowice,
  Poland. ING Bank Slaski S.A. operates as a subsidiary of ING Bank N.V.
