longBusinessSummary: 'Storebrand ASA provides insurance products and services in Norway,
  the United States, Germany, Sweden, the United Kingdom, and internationally. It
  operates through four segments: Savings, Insurance, Guaranteed Pensions, and Other.
  The Savings segment offers retirement savings, defined contribution pensions, asset
  management, and retail banking products. The Insurance segment provides personal
  insurance, non-life insurance, personal risk, and pension-related insurance products.
  The Guaranteed Pensions segment offers long-term pension savings products, such
  as defined contribution pensions, paid-up policies, and individual capital and pension
  insurance products. The Other segment provides life insurance products. The company
  serves private individuals, businesses, public enterprises, and corporate and retail
  markets. Storebrand ASA was founded in 1767 and is headquartered in Lysaker, Norway.'
