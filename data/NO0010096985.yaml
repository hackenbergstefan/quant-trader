longBusinessSummary: Equinor ASA operates as an energy company in Norway and internationally.
  It operates through Exploration & Production Norway; Exploration & Production International;
  Exploration & Production USA; Marketing, Midstream & Processing; and Renewables
  segments. The company engages in the discovery and appraisal of new resources, as
  well as commercial development and operation of the oil and gas portfolios; oil
  and gas field development, well deliveries, and sourcing; research, technology development,
  specialist advisory services, digitalization, IT, improvement, innovation, and ventures
  and future business; and developing, exploring, investing in, and operating areas
  within renewable energy, such as offshore wind, green hydrogen, storage solutions,
  and solar power. It is also involved in the marketing, trading, processing, and
  transportation of crude oil and condensate, natural gas, NGL and refined products,
  including refineries, terminals, and processing plant operation; power and emissions
  trading; development of transportation solutions for natural gas, liquids, and crude
  oil, including pipelines, shipping, trucking, and rail; and provision of low carbon
  solutions. The company was formerly known as Statoil ASA and changed its name to
  Equinor ASA in May 2018. Equinor ASA was incorporated in 1972 and is headquartered
  in Stavanger, Norway.
