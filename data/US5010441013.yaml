longBusinessSummary: The Kroger Co. operates as a food and drug retailer in the United
  States. The company operates combination food and drug stores, multi-department
  stores, marketplace stores, and price impact warehouses. Its combination food and
  drug stores offer natural food and organic sections, pharmacies, general merchandise,
  pet centers, fresh seafood, and organic produce; and its multi-department stores
  provide apparel, home fashion and furnishings, outdoor living, electronics, automotive
  products, and toys. The company's marketplace stores offer full-service grocery,
  pharmacy, health and beauty care, and perishable goods, as well as general merchandise,
  including apparel, home goods, and toys; and its price impact warehouse stores provide
  grocery, and health and beauty care items, as well as meat, dairy, baked goods,
  and fresh produce items. It also manufactures and processes food products for sale
  in its supermarkets and online; and sells fuel through its fuel centers. The company
  sells its products through its stores, fuel centers, and online platforms. The Kroger
  Co. was founded in 1883 and is based in Cincinnati, Ohio.
