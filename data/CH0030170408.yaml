longBusinessSummary: Geberit AG develops, produces, and distributes sanitary products
  and systems for the residential and commercial construction industry. It offers
  installation and flushing systems, such as installation technology and flushing
  systems for toilets, including cisterns and interior fittings; and piping systems
  comprising building drainage and supply systems, as well as piping technology for
  use in buildings for drinking water, heating, gas, and other media. The company
  also provides bathroom system products that include bathroom ceramics, furniture,
  showers, bathtubs, taps and controls, and shower toilets. It operates in Germany,
  Switzerland, Benelux, Italy, Austria, Central Europe, Western Europe, Northern Europe,
  Eastern Europe, the United States, the Middle East, Africa, Far East, and the Pacific.
  The company sells its products to wholesalers, plumbers, architects, and sanitary
  engineers under the Geberit brand name. Geberit AG was founded in 1874 and is headquartered
  in Rapperswil-Jona, Switzerland.
