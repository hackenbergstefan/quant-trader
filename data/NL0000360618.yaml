longBusinessSummary: SBM Offshore N.V. provides floating production solutions to the
  offshore energy industry worldwide. It operates in two segments, Lease and Operate,
  and Turnkey. It engages in the design, supply, installation, operation, demobilization,
  and life extension of floating production storage and offloading (FPSO) vessels.
  The company also operates catenary anchor leg mooring (CALM), a single point mooring
  (SPM) system terminal; tension leg floaters, turret mooring systems, floating offshore
  wind, and brownfield and offshore loading terminals; and floating energy hubs. In
  addition, it owns and operates a fleet of 15 FPSOs and 1 semi-submersible unit,
  as well as offering offshore technologies development and digital services in the
  offshore oil and gas industry and broader offshore infrastructure sector. Further,
  the company offers turnkey supply contracts and after-sales services, which consist
  mainly of large production systems, large mooring systems, deepwater export systems,
  fluid transfer systems, tanker loading and discharge terminals, design services,
  supply of special components and proprietary designs and equipment activities. The
  company was formerly known as IHC Caland and changed its name to SBM Offshore N.V.
  in 2005. SBM Offshore N.V. was founded in 1862 and is headquartered in Schiphol,
  the Netherlands.
