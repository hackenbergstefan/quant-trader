longBusinessSummary: TBC Bank Group PLC, through its subsidiaries, provides banking,
  leasing, insurance, brokerage, and card processing services to corporate and individual
  customers in Georgia, Azerbaijan, and Uzbekistan. The company operates through Georgian
  Financial Services; Uzbekistan Operations; and Other Operations segments. It offers
  banking business solutions, such as deposit and loans; and other financial services,
  including non-health insurance and leasing services; asset finance solutions; advisory
  services; and financial leasing, operating leasing, and sale and leasebacks. The
  company also offers digital banking services comprising cash loans, deposits, debit
  cards, remittances, gamification, installment/POS loans, daily banking, credit cards,
  MSME, and buy now, pay later (BNPL). In addition, it provides payment solutions,
  such as P2P transfers, utility and government payments, PFM, and QR payments, as
  well as Payme travel, goals, tickets, and subscription. Further, the company offers
  brokerage and research solutions, leasing, payment processing, asset management,
  healthcare e-commerce, retail trade and leasing, PR and marketing, education, data
  analytics, computer programming, investment vehicle, ecosystem, and digital banking
  platform, as well as investment banking, financial, customer experience servicing,
  software services, and postal services. TBC Bank Group PLC was founded in 1992 and
  is based in London, the United Kingdom.
