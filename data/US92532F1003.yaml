longBusinessSummary: Vertex Pharmaceuticals Incorporated operates as a biotechnology
  company in the United States, Europe, and internationally. The company offers transformative
  medicines for people with serious diseases with a focus on specialty markets, such
  as cystic fibrosis (CF), sickle cell disease (SCD), transfusion dependent beta thalassemia
  (TDT), and acute pain. It markets TRIKAFTA/KAFTRIO for people with CF with at least
  one F508del mutation for 2 years of age and older; ALYFTREK for the treatment for
  people with CF 6 years of age and older; SYMDEKO/SYMKEVI for treatment of patients
  with CF 6 years of age and older; ORKAMBI for CF patients 1 year or older; and KALYDECO
  for the treatment of patients with 1 month or older who have CF with ivacaftor.
  The company also develops CASGEVY for the treatment of SCD and TDT; JOURNAVX for
  the treatment of acute pain in adults; VX-522, a CFTR mRNA therapeutic designed
  to treat the underlying cause of CF, which is in Phase 1/2 clinical trial; inaxaplin
  for the treatment of APOL1-mediated kidney disease, which is in single Phase 2 trial;
  VX-264 for treating Type 1 Diabetes; VX-670 for the treatment of myotonic dystrophy
  type 1; and VX-407, a small molecule corrector for the treatment of autosomal dominant
  polycystic kidney disease. In addition, the company also operates as a clinical-stage
  pharmaceutical company, that focuses on the discovery, development, and commercialization
  of novel therapeutics for rare endocrine diseases and endocrine-related tumors.
  The company sells its products primarily to specialty pharmacy and distributors,
  wholesalers, retail pharmacies, hospitals, and clinics. Vertex Pharmaceuticals Incorporated
  has a strategic collaboration with AbCellera Biologics Inc. to research, develop,
  manufacture, and commercialize multispecific T-cell engagers (TCEs) for autoimmune
  diseases and other conditions. Vertex Pharmaceuticals Incorporated was founded in
  1989 and is headquartered in Boston, Massachusetts.
