longBusinessSummary: Micron Technology, Inc. engages in the provision of semiconductor
  memory and storage products in the United States, Taiwan, Mainland China, other
  Asia Pacific countries, Japan, Europe, and internationally. It operates through
  Cloud Memory Business Unit, Core Data Center Business Unit, Mobile and Client Business
  Unit, and Automotive and Embedded Business Unit segments. The company provides dynamic
  random access memory (DRAM) products, including High-Bandwidth Memory, doublie data
  rate, low-power DRAM, and graphics DRAM products; NAND products comprising solid
  state drives, managed NAND, and multi-chip packages; and NOR products. The company
  sells its products under the Micron brand name and private labels through its own
  direct sales force, sales or representative offices, as well as through distributors,
  retailers, and independent sales representatives. Micron Technology, Inc. was founded
  in 1978 and is headquartered in Boise, Idaho.
