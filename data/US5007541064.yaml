longBusinessSummary: The Kraft Heinz Company, together with its subsidiaries, manufactures
  and markets food and beverage products in North America and internationally. Its
  products include condiments, sauces, dressings, and spreads; cheese, frozen potato
  products, and other frozen meals; meal kits, frozen snacks, and pickles; dry packaged
  desserts, refrigerated ready to eat desserts, and other dessert toppings; ready
  to drink and powdered beverages, and liquid concentrates; American sliced and recipe
  cheeses; mainstream coffee, coffee pods, and premium coffee; and cold cuts, bacon,
  and hot dogs. It offers its products under the Kraft, Oscar Mayer, Heinz, Philadelphia,
  Lunchables, Velveeta, Ore-Ida, Capri Sun, Maxwell House, Kool-Aid, Jell-O, ABC,
  Master, Quero, Golden Circle, Wattie's, Pudliszki, and Plasmon brands, as well as
  Bagel Bites, Claussen, A1, and Cool Whip. It sells its products through its own
  sales organizations, as well as through independent brokers, agents, and distributors
  to chain, wholesale, cooperative, and independent grocery accounts; convenience,
  value, and club stores; pharmacies and drug stores; mass merchants; foodservice
  distributors; institutions, including hotels, restaurants, bakeries, hospitals,
  health care facilities, and government agencies; and various e-commerce platforms
  and retailers. The company has a strategic partnership with the National Football
  League. The company was formerly known as H.J. Heinz Holding Corporation and changed
  its name to The Kraft Heinz Company in July 2015. The company was founded in 1869
  and is headquartered in Pittsburgh, Pennsylvania.
