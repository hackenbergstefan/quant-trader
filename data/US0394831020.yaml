longBusinessSummary: 'Archer-Daniels-Midland Company provides human and animal nutrition
  ingredients and solutions in the United States, Switzerland, the Cayman Islands,
  Brazil, Mexico, Canada, the United Kingdom, and internationally. It operates in
  three segments: Ag Services and Oilseeds; Carbohydrate Solutions; and Nutrition.
  The company engages in the origination, merchandising, transportation, and storage
  of agricultural raw materials, as well as the crushing and processing of oilseeds,
  including soybeans and soft seeds, such as cottonseed, sunflower seed, canola, rapeseed,
  and flaxseed; produces and markets vegetable oils and oilseed protein meals used
  by food, feed, energy, and industrial customers; sale of crude and partially refined
  vegetable oils; supplies peanuts and peanut-derived ingredients; and manufactures
  cotton cellulose pulp. It is also involved in the grain sourcing, handling, and
  multimodal transportation network supporting import, export, and distribution activities;
  structured trade finance activities; corn and wheat wet and dry milling and related
  processing activities; production of distillers'' grains, corn gluten feed, and
  corn gluten meal for use as animal feed ingredients; and carbon capture and sequestration
  and other emissions-reduction initiatives. In addition, the company engages in the
  creation, manufacturing, sale, and distribution of an array of ingredients and solutions
  comprising plant-based proteins, flavors and colors derived from nature, flavor
  systems, emulsifiers, soluble fiber, polyols, hydrocolloids, probiotics, prebiotics,
  postbiotics, enzymes, botanical extracts, and other specialty food and feed ingredients
  and systems. Further, it is involved in the derivatives and commodity exchanges
  and clearing houses; and insurance coverage for certain property, casualty, marine,
  medical, and other miscellaneous risks. The company was founded in 1902 and is based
  in Chicago, Illinois.'
