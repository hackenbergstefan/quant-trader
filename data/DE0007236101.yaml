longBusinessSummary: Siemens Aktiengesellschaft, a technology company, focuses in
  the areas of automation and digitalization across the world. It operates through
  Digital Industries, Smart Infrastructure, Mobility, Siemens Healthineers, and Siemens
  Financial Services (SFS) segments. The Digital Industries segment provides automation
  systems and software for factories, numerical control systems, servo motors, drives
  and inverters, and integrated automation systems for machine tools and production
  machines; process control systems, machine-to-machine communication products, sensors
  and radio frequency identification systems; production and product lifecycle management
  software, and simulation and testing of mechatronic system. The Smart Infrastructure
  segment offers products, systems, solutions, services, and software to support sustainable
  transition from fossil and renewable energy sources; sustainable buildings and communities;
  and buildings, electrification, and electrical products. The Mobility segment provides
  rail passenger and freight transportation, such as metro systems, trams and light
  rail, and commuter trains, as well as trains and passenger coaches; locomotives
  and solutions for automated transportation and leasing; products and solutions for
  rail automation and electrification; maintenance and digital services; and digital
  and cloud-based solutions, and related services. The Siemens Healthineers segment
  develops, manufactures, and sells various diagnostic and therapeutic products and
  services; and provides clinical consulting and training services. Its financial
  services segment offers debt and equity investments; leasing, lending, and working
  capital; structured, equipment, and project financing; and financial advisory services.
  It has a strategic collaboration with IFS to improve product lifecycle with industrial
  AI. The company was founded in 1847 and is headquartered in Munich, Germany.
