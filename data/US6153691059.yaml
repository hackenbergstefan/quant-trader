longBusinessSummary: Moody's Corporation, together with its subsidiaries, operates
  as an integrated risk assessment firm in the United States, the rest of the Americas,
  Europe, the Middle East, Africa, and the Asia Pacific. It operates through two segments,
  Moody's Analytics (MA) and Moody's Investors Service (MIS). The MA segment develops
  a range of products and services that support the risk management activities of
  institutional participants in financial markets. This segment also offers credit
  research, credit models and analytics, economic data and models, and structured
  finance solutions; data sets on companies and securities; and cloud-based SaaS subscription
  solutions supporting banking, insurance, and know-your-customer workflows. The MIS
  segment publishes credit ratings and provides assessment services on various debt
  obligations, programs and facilities, and entities that issue such obligations,
  including corporate, financial institution, and governmental obligations, as well
  as structured finance securities. It also provides ratings, investment research,
  compliance and third-party risk, supplier risk, trade credit, business intelligence
  sales and marketing, financial and regulatory reporting, balance sheet management,
  capital management, credit portfolio management, and model risk and governance solutions;
  Maxsight, a unified risk platform; lending suite, origination, and monitoring solutions;
  and property, casualty, and sustainable insurance underwriting solutions. The company
  serves the financial, banking, insurance, corporate, public, and asset management
  sectors. The company was formerly known as Dun and Bradstreet Company and changed
  its name to Moody's Corporation in September 2000. Moody's Corporation was founded
  in 1900 and is headquartered in New York, New York.
