longBusinessSummary: Ferguson Enterprises Inc. distributes essential water and air
  solutions to specialized professional in the United States and Canada. The company
  provides various products and services, including plumbing; pipe, valves, and fittings;
  heating, ventilation, and air conditioning; appliances; lighting; and water and
  wastewater solutions to residential and non-residential customers. It also supplies
  specialized water and wastewater treatment products to residential, commercial,
  and infrastructure contractors, as well as supplies pipe, valves, and fittings solutions
  to industrial customers. In addition, it offers customized solutions, such as virtual
  design, fabrication, valve actuation, pre-assembly, kitting, installation, and project
  management services, as well as after-sales support that comprises warranty, credit,
  project-based billing, returns and maintenance, and repair and operations support.
  The company sells its products through a network of distribution centers, branches,
  counter service and sales associates, showroom consultants, and e-commerce channels.
  Ferguson Enterprises Inc. was founded in 1953 and is headquartered in Newport News,
  Virginia.
