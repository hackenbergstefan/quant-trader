longBusinessSummary: Mondi plc, together with its subsidiaries, engages in the manufacture
  and sale of packaging and paper solutions in Africa, Western Europe, Emerging Europe,
  North America, South America, Asia, and Australia. The company operates through
  Corrugated Packaging, and Flexible Packaging segments. The Corrugated Packaging
  segment provides virgin and recycled containerboards for fresh fruit packaging and
  heavy and fragile goods transport packaging applications; and corrugated solutions,
  such as corrugated boxes and packaging products. The Flexible Packaging segment
  offers sack kraft paper, paper bags, specialty kraft paper, consumer flexibles,
  and functional paper and films. The Uncoated Fine Paper segment provides uncoated
  fine paper, including home, office, converting, and professional printing papers;
  and market pulp. The company was incorporated in 2007 and is based in Weybridge,
  the United Kingdom.
