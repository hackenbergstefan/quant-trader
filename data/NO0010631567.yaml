longBusinessSummary: SpareBank 1 Sør-Norge ASA, together with its subsidiaries, provides
  various financial products and services for personal and corporate customers in
  Norway. The company operates through Retail Market, Corporate Market, SME & Agriculture,
  and Other Activities segments. It offers savings, loans, insurance, and pension
  products. The company also provides account and payment, international cash management,
  foreign exchange, administrative securities, accounting, estate agency, HR, securities
  trading, and investment services; green loans; credit cards; consulting; commercial
  properties for leasing; and banking services. In addition, it facilitates and advises
  debt and equity funding; and sells real estate properties, homes, and commercial
  properties. Further, the company is involved in the customer trading of interest-rate
  instruments; and purchasing of home mortgages. It serves retail and corporate, SME,
  small business, and agricultural customers, as well as the public sector. The company
  was founded in 1839 and is headquartered in Stavanger, Norway.
