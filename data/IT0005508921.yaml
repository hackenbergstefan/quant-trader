longBusinessSummary: 'Banca Monte dei Paschi di Siena S.p.A., together with its subsidiaries,
  provides various banking products and services in Italy and internationally. It
  operates through four segments: Retail Banking, Wealth Management, Corporate Banking,
  and Large Corporate and Investment Banking. The company offers savings and deposit
  accounts, cards, advanced payment systems, insurance products, pensions, mortgages,
  and loans, as well as financial advisory, electronic payment, self-service customer
  operations, and consultancy services. It also provides asset management, financial
  planning, consultancy on non-financial services, and fiduciary and trust services;
  and credit intermediation, collaboration with trade associations, factoring offers,
  and third-party custody and storage services for dairy products. In addition, the
  company offers corporate and structured finance, medium and long-term credit, and
  specialized support, as well as leasing and bancassurance. It serves private customers,
  corporate and large group clients, and small and medium enterprises. The company
  was founded in 1472 and is headquartered in Siena, Italy.'
