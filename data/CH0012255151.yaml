longBusinessSummary: The Swatch Group AG designs, manufactures, and sells finished
  watches, jewelry, and watch movements and components in Switzerland, rest of Europe,
  Greater China, Asia, America, Oceania, and Africa. The company operates through
  Watches & Jewelry and Electronic Systems segments. The Watches & Jewelry segment
  designs, produces, and commercializes watches and jewelry. The Electronic Systems
  segment engages in the design, production, and commercialization of electronic components,
  as well as sports timing activities. The company is also involved in the provision
  of assembly, research and development, administration, logistics and distribution,
  and customer services; and hard material components, microelectronics, watch cases
  and crowns, miniature low-frequency quartz crystals, thin wires, miniature batteries,
  watch dials and hands, bracelets, sports timing technology and equipment, precision
  parts, electronic components assembly, and surface treatment products. In addition,
  it engages in the patent, retail, communication, real estate, real estate management,
  finance, reinsurance, and art center businesses. The company offers its watch and
  jewelry products under the Breguet, Harry Winston, Blancpain, Glashütte Original,
  Jaquet Droz, Omega, Longines, Rado, Union Glashütte, Tissot, Balmain, Certina, Mido,
  Hamilton, Swatch, and Flik Flak brands. The Swatch Group AG was founded in 1983
  and is headquartered in Biel/Bienne, Switzerland.
