longBusinessSummary: Consolidated Edison, Inc., through its subsidiaries, engages
  in the regulated electric, gas, and steam delivery businesses in the United States.
  The company offers electric services to approximately 3.7 million customers in New
  York City and Westchester County; gas to approximately 1.1 million customers in
  Manhattan, the Bronx, parts of Queens, and Westchester County; and steam to approximately
  1,490 customers in parts of Manhattan. It also supplies electricity to approximately
  0.3 million customers in southeastern New York and northern New Jersey; and gas
  to approximately 0.1 million customers in southeastern New York. In addition, the
  company operates 552 circuit miles of transmission lines; 16 transmission substations;
  63 distribution substations; 89,675 in-service line transformers; 3,764 pole miles
  of overhead distribution lines; and 2,417 miles of underground distribution lines,
  as well as 4,374 miles of mains and 379, 939 service lines for natural gas distribution.
  Further, it invests in electric and gas transmission projects. The company primarily
  sells electricity to industrial, commercial, residential, and government customers.
  Consolidated Edison, Inc. was founded in 1823 and is based in New York, New York.
