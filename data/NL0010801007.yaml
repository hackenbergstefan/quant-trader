longBusinessSummary: IMCD N.V. distributes, markets, and sells specialty chemicals
  and ingredients in the Netherlands, rest of Europe, the Middle East, Africa, North
  America, South America, and the Asia-Pacific. The company provides adhesives, core
  materials, filler reinforcements, flame retardants, masterbatch, modifiers, operating
  materials, pigments, plasticizers, processing aids, PUR raw materials, rubber elastomers,
  solvents, stabilizers, thermoplastic elastomers, thermoplastics, thermoplastics,
  and other additives. It offers actives, UV sunscreens, rheology modifiers, thickeners,
  surfactants, emulsifiers, emollients, film formers, humectants, waxes, conditioners,
  hair styling polymers, solvent, solubilizers, pigments, pearls, powders and colorants,
  opacifiers, pearlizers, preservatives, antioxidants, fragrances, and essential oils.
  In addition, the company provides functional fillers, pigments, resins, and specialty
  solvents; taste, texture, nutrition, and function; and abrasives, acids, alkalines,
  anti-soil redeposition and foam control systems, bio-actives, biocides, bittering
  and bleaching agents, builders, capsules, chelating agents, concentrates/ready-to-use,
  corrosion and dye transfer inhibitors, disintegrants, dispersants, emulsifiers,
  enzymes, fluorinated polymers, oleo chemicals, optical brighteners, perfumes, dyes,
  phosphates, plasticisers, proteins, rheology modifiers and thickeners, silicones,
  solvents/diluents, TAED, UV-filters, and waxes. Further, it offers base oils; lubricants
  addictive; lubricants finished fluids; fuel additives; solvents, degreasers, and
  fuel compounds; and upstream, midstream, and downstream oil, gas, and energy. IMCD
  N.V. was founded in 1995 and is headquartered in Rotterdam, the Netherlands.
