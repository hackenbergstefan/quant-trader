longBusinessSummary: Omnicom Group Inc., together with its subsidiaries, offers advertising,
  marketing, and corporate communications services. It provides a range of services
  in the areas of media and advertising, precision marketing, public relations, healthcare,
  branding and retail commerce, experiential, execution, and support. The company's
  services include advertising, branding, content marketing, crisis communications,
  customer data analytics and data-driven decision making, customer relationship management,
  decision sciences, digital experience design, digital transformation, e-commerce
  optimization, entertainment marketing, experiential marketing, field marketing,
  healthcare marketing and communications, in-store design, investor relations, and
  marketing research.Its services also comprise media planning and buying, merchandising
  and point of sale, mobile marketing, multi-cultural marketing, organizational communications,
  package design, performance marketing, product placement, promotional marketing,
  public affairs, public relations, retail media and e-commerce, shopper marketing,
  structured innovation, studio production, social media and influencer marketing,
  and sports and event marketing. It operates in the North and Latin America, Europe,
  the Middle East and Africa (EMEA), and the Asia Pacific. The company was incorporated
  in 1944 and is based in New York, New York.
