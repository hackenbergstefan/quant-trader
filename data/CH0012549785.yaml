longBusinessSummary: Sonova Holding AG manufactures and sells hearing care solutions
  for children and adults in Switzerland, the United States, rest of the Americas,
  Europe, the Middle East, Africa, and the Asia Pacific. It operates through Hearing
  Instruments, Cochlear Implants, and Lifestyle-Aligned segments. The Hearing Instruments
  segment engages in the design, development, manufacture, distribution, and service
  of hearing instruments and related products, as well as wireless headsets, speech-enhanced
  hearables, and audiophile headphones under the Phonak, Unitron, Hansaton, and Sennheiser
  brand names; and audiological care services under the AudioNova, Audition Santé,
  Boots Hearingcare, Connect Hearing, Geers, Hansaton, Lapperre, Schoonenberg, and
  Triton Hearing brands. The Cochlear Implants segment is involved in the design,
  development, manufacture, distribution, and service of hearing instruments and related
  products under the Advanced Bionics brand. The Lifestyle-Aligned segment designs
  connected solutions and integrating AI and digital capabilities. It sells its products
  directly to end consumers through its own store network; wholesales to independent
  audiologists, third party retail chains, and multinational and government customers;
  and provides hearing care services through a network of stores and clinics. The
  company was formerly known as Phonak Holding AG and changed its name to Sonova Holding
  AG in August 2007. Sonova Holding AG was founded in 1947 and is headquartered in
  Stäfa, Switzerland.
