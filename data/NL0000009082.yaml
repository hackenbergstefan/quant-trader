longBusinessSummary: Koninklijke KPN N.V. provides telecommunications and information
  technology (IT) services in the Netherlands. The company operates through Consumer,
  Business, Wholesale and Network, and Operations & IT segments. It offers fixed and
  mobile telephony, fixed and mobile broadband internet, and TV to retail and business
  consumers; infrastructure and network-related IT solutions to business customers;
  and wholesale network services to third parties. The company also provides network-related
  ICT solutions, such as security, internet of things, cloud, connectivity, and smart
  combinations; interconnect traffic, visitor roaming, digital products, and NL-ix
  interconnect exchange services; and sale of handsets and peripheral equipment, as
  well as software licenses. It offers its products and services under the KPN, XS4ALL,
  Simyo, KPN Security, KPN Health, Solcon, Inspark, and KPN Partner Network, KPN IoT,
  and youfone brands. The company was formerly known as Koninklijke PTT Nederland
  NV and changed its name to Koninklijke KPN N.V. in June 1998. Koninklijke KPN N.V.
  was founded in 1881 and is headquartered in Rotterdam, the Netherlands.
