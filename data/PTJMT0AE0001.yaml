longBusinessSummary: Jerónimo Martins, SGPS, S.A. operates in the food distribution
  sector in Portugal, Poland, Colombia, Slovakia, and internationally. The company
  operates through Portugal Retail, Portugal Cash & Carry, Poland Retail, Poland Health
  and Beauty, and Colombia Retail segments. It engages in the operation of chain of
  food stores under the Biedronka brand; online sales offerings, such as deliveries
  under the Biek brand, alternative ordering and delivery solutions with e-commerce
  players, and non-food products through a website; supermarket chains under the Pingo
  Doce brand; cash and carry stores under the Recheio brand; Bem-Estar parapharmacies
  and petrol stations; and coffee shops and kiosks under the Jeronymo brand. The company
  is also involved in the provision of specialized retail of health and beauty products,
  as well as in-store consultation services under the Hebe brand; operation of a chain
  of proximity food stores under the Ara brand; and production of dairy, livestock
  farming, aquaculture, and fruit and vegetables. In addition, it engages in the real
  estate purchase and sale; sea passenger water transport; renting of air transport
  equipment; growing of crops and animal farming; saline brackish waters aquaculture;
  and retail management, consultancy, and logistics. The company was founded in 1792
  and is headquartered in Lisbon, Portugal. Jerónimo Martins, SGPS, S.A. operates
  as a subsidiary of Sociedade Francisco Manuel Dos Santos B.V.
