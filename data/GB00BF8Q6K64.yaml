longBusinessSummary: Aberdeen Group Plc provides asset management services in the
  United Kingdom, Europe, North America, and Asia. It makes traditional, private equity/
  buyout, venture capital, secondary (direct), secondary (indirect), real estate investments
  & blend investments in early venture, middle market, growth capital & buyout investments.
  The company offers investment solutions and funds; long-term savings and investment
  products to individual and corporate customers; and life insurance and savings products.
  It provides its products through institutional, wholesale, and retail distribution
  channels. It invests in healthcare, information technology, telecommunication services,
  media & real estate investments. The firm invests globally. It prefers to have majority
  stakes in its portfolio companies. Aberdeen Group Plc was founded in 1825 and is
  based in Edinburgh, United Kingdom with additional offices across Europe, Middle
  East, Asia Pacific, North America and South America.
