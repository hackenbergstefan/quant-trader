longBusinessSummary: 'Münchener Rückversicherungs-Gesellschaft Aktiengesellschaft
  in München engages in the insurance and reinsurance businesses worldwide. The company
  operates through six segments: Life and Health Reinsurance, Property-Casualty Reinsurance,
  Global Specialty Insurance, ERGO Life and Health Germany, ERGO Property-Casualty
  Germany, and ERGO International. The company offers life and health reinsurance
  solutions, such as digital underwriting and advanced analytics solutions, health
  insurance management system, financial market risks, financing, portfolio risk management,
  digitalized investment-linked solution, data analytics, underwriting and claims,
  medical research, capital management, and health market, as well as MIRA digital
  suite that includes MIRA PoS, MIRApply insured and physician, claims risk assessment,
  and CLARA plus. It also provides property and casualty reinsurance solutions, including
  agricultural reinsurance; business advisory, personal lines, portfolio management,
  insurance consulting, commercial motor consulting; infrastructure risk; property
  insurance, location risk, insurance linked securities, and NatCatSERVICE for natural
  catastrophe loss database; prospective structured and retroactive reinsurance; risk
  transfer; cyber; and data analytics, REALYTIX ZERO, and cert2go. In addition, the
  company offers solutions for industry clients, such as corporate risk, new tech,
  green tech, parametric, and aviation and space solutions, as well as risk services.
  Further, it provides specialty property casualty insurance, such as professional
  liability, marine, cyber, aviation, and space for commercial and private customers.
  Additionally, the company offers life, property-casualty, health, legal protection,
  and travel insurance products under the ERGO brand; and insurance solutions for
  agriculture, captive, epidemic, cyber, and renewable energy sectors. The company
  was founded in 1880 and is based in Munich, Germany.'
