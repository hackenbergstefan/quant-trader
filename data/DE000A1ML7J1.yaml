longBusinessSummary: Vonovia SE operates as an integrated residential real estate
  company in Europe. The company operates through Rental, Value-Add, Recurring Sales,
  and Development segments. It offers property management services; property-related
  services; and value-added services, including maintenance and modernization of properties,
  craftsmen and residential environment organization, multimedia, energy supply, metering,
  condominium administration, and insurance services. The company is also involved
  in the sale of individual condominiums and single-family houses; and project development
  activities to build new homes. In addition, it engages in construction of owner-occupied
  and rented apartments; sale of projects to investors; and construction of new properties
  on existing land held in the portfolio. The company was formerly known as Deutsche
  Annington Immobilien SE and changed its name to Vonovia SE in August 2015. Vonovia
  SE was founded in 1998 and is headquartered in Bochum, Germany.
