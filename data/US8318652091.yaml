longBusinessSummary: A. O. Smith Corporation manufactures and markets residential
  and commercial gas and electric water heaters, boilers, heat pumps, tanks, and water
  treatment products in North America, China, Europe, and India. The company offers
  water heaters for residences, restaurants, hotels, office buildings, laundries,
  car washes, and small businesses; boilers for hospitals, schools, hotels, homes,
  apartments, and condominiums, and other large commercial buildings; and water treatment
  products comprising point-of-entry water softeners, well water solutions, and whole-home
  water filtration products, and point-of-use carbon and reverse osmosis products
  for residences, restaurants, hotels, and offices. It also provides commercial water
  treatment and filtration products; expansion tanks, commercial solar water heating
  systems, swimming pool and spa heaters, and related products and parts; and electric
  wall-hung, gas tankless, combi-boiler, and heat pump and solar water heaters. The
  company offers its products under the A. O. Smith, State, Lochinvar, Hague, Water-Right,
  Master Water, Atlantic Filter, Impact, and Water Tec brands. It distributes its
  products through independent wholesale plumbing distributors, as well as to retail
  channels consisting of hardware and home center chains, and manufacturer representative
  firms, as well as offers Aquasana branded products directly to consumers through
  e-commerce channels; and A. O. Smith branded water treatment products through dealer
  network and Amazon. A. O. Smith Corporation was founded in 1874 and is headquartered
  in Milwaukee, Wisconsin.
