  for chocolate and confectionery; dairy and ice cream; bakery; lecithin; special
  nutrition; foodservice and retail; personal care; candles; technical products; and
  animal nutrition. It also provides natural emulsifiers; fatty acids; plant-based
  candle waxes; and animal feed, proteins, and fats products. AAK AB (publ.) was founded
  in 1871 and is headquartered in Malmö, Sweden.
