longBusinessSummary: WEC Energy Group, Inc., through its subsidiaries, provides regulated
  natural gas and electricity, and renewable and nonregulated renewable energy services
  in the United States. The company operates through Wisconsin, Illinois, Other States,
  Electric Transmission, and Non-Utility Energy Infrastructure segments. It generates
  and distributes electricity from coal, natural gas, oil, and nuclear, as well as
  renewable energy resources, including wind, solar, hydroelectric, and biomass; and
  distributes and hydroelectric natural gas. The company also owns, maintains, monitors,
  and operates electric transmission systems; and generates, distributes, and sells
  steam. As of December 31, 2025, the company operated approximately 35,200 miles
  of overhead distribution lines and 37,600 miles of underground distribution cables,
  as well as 420 electric distribution substations and 649,500 line transformers;
  approximately 47,200 miles of natural gas distribution mains; 1,300 miles of natural
  gas transmission mains; 2.4 million natural gas lateral services; 510 natural gas
  distribution and transmission gate stations; and 67.0 billion cubic feet of working
  gas capacities in underground natural gas storage fields. The company was formerly
  known as Wisconsin Energy Corporation and changed its name to WEC Energy Group,
  Inc. in June 2015. WEC Energy Group, Inc. was founded in 1896 and is headquartered
  in Milwaukee, Wisconsin.
