longBusinessSummary: SGS SA operates as a testing, inspection, and certification company
  in the Asia Pacific, Europe, North America, Eastern Europe, the Middle East and
  Africa, and America. It operates in two segments, Testing & Inspection and Certification.
  The company offers testing services, such as crop production testing, agricultural
  commodities testing, field studies, laboratory studies, seed quality control, and
  seed research and development; and inspection services, including draft survey and
  marine services, e-certificates, loading and discharge supervision, pre-shipment
  inspection, quality and quantity inspection, and tally. It also provides consulting,
  digital trust assurance, medical devices regulatory compliance, product certification,
  supply chain assurance, sustainability assurance, and verification and assurance,
  as well as assessment, auditing, and certification services; and professional training
  services. The company serves agriculture and forestry, building and infrastructure,
  consumer products and retail, cosmetics and personal care, cybersecurity and technology,
  environmental, health and safety, food, government and trade facilitation, industrial
  manufacturing and processing, MedTech, mining, oil, gas and chemicals, pharma, power
  and utilities, and transportation industries. SGS SA was founded in 1878 and is
  headquartered in Baar, Switzerland.
