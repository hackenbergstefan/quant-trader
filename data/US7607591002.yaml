longBusinessSummary: Republic Services, Inc., together with its subsidiaries, offers
  environmental services in the United States and Canada. It is involved in the collection
  and processing of recyclable, solid waste, and industrial waste materials; transportation
  and disposal of non-hazardous and hazardous waste streams; and other environmental
  solutions. Its residential collection services include curbside collection of material
  for transport to transfer stations, landfills, recycling centers, and organics processing
  facilities; supply of recycling and waste containers; and renting of compactors.
  The company also engages in the processing and sale of old corrugated containers,
  old newsprint, aluminum, glass, and other materials; and provision of landfill services.
  It serves small-container, large-container, and residential customers. The company
  was incorporated in 1996 and is based in Phoenix, Arizona.
