longBusinessSummary: 'Axfood AB (publ) engages in the food retail and wholesale businesses
  primarily in Sweden. The company operates through five segments: Willys, Hemköp,
  City Gross, Snabbgross, and Dagab. The company sells groceries through Willys, HANDLAR''N,
  Hemköp, and Eurocash, City Gross, and Tempo store chains. It is also involved in
  the e-commerce business; and provision of private label products. In addition, it
  operates Urban Deli, a combination of restaurant, store, and market hall; Apohem,
  an online retail pharmacy; Matöppet, a personal grocery store and the retailer-owned
  mini-mart; Snabbgross, a restaurant; and Tempo, a mini-mart format of retailer-owned
  stores. The company serves restaurants, fast food operators, and cafés; and retailer-owned
  stores, mini-marts, and other convenience retailers. Axfood AB (publ) was incorporated
  in 1997 and is headquartered in Stockholm, Sweden. Axfood AB (publ) operates as
  a subsidiary of Axretail AB.'
