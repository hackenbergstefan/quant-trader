longBusinessSummary: AstraZeneca PLC, a biopharmaceutical company, focuses on the
  discovery, development, manufacture, and commercialization of prescription medicines.
  The company offers Imjudo, Datroway, Iressa, Tagrisso, Imfinzi, Lynparza, Calquence,
  Enhertu, Orpathys, Truqap, Zoladex, Faslodex, Crestor, Andexxa, Onglyza, Symlin,
  XIGDUO XR, Atacand, Atacand HCT, Atacand Plus, Farxiga/Forxiga, Plendil, Modip,
  Splendil, Munobal, Flodil, Tenormin, Tenormine, Prenormine, Atenol, Zestril, Brilinta/Brilique,
  Komboglyze, Qtern, Wainua, Byetta, Lokelma, Seloken ZOK, Toprol-XL, Betaloc ZOK,
  XIGDUO, Accolate, Accoleit, Vanticon, Bricanyl Respules, Eklira Genuair/Tudorza/Bretaris,
  Pulmicort Turbuhaler, Symbicort Turbuhaler, Airsupra, Bricanyl Turbuhaler, Fasenra,
  Rhinocort, Tezspire, Bevespi Aerosphere, Daliresp/Daxas, Oxis Turbuhaler, Saphnelo,
  Breztri Aerosphere, Duaklir Genuair, Pulmicort Respules, and Symbicort pMDI. It
  also provides Beyfortus, Kavigale, Evusheld, Fluenz/FluMist, Synagis, Kanuma, Ultomiris,
  Koselugo, Voydeya, Soliris, Strensiq, Nexium, and other medicines. The company offers
  its products for ocology, cardiovascular, renal and metabolism, respiratory & immunology,
  vaccines and immune, and therapies for rare diseases. It serves primary and specialty
  care physicians through distributors and local representative offices in the United
  Kingdom, USA, rest of Europe, Asia, Africa, and Australasia. It has a strategic
  agreement with Tempus and Pathos to develop the multimodal foundation model in oncology;
  CSPC Pharmaceutical Group Limited to advance the discovery and development of oral
  candidates; Nucs AI Inc. to develop AI-driven Response Prediction for Therapeutic
  Radioconjugates; and Carterra, Inc. to advances lab-in-the-loop drug discovery through
  new scientific research collaboration. The company was formerly known as Zeneca
  Group PLC and changed its name to AstraZeneca PLC in April 1999. AstraZeneca PLC
  was incorporated in 1992 and is based in Cambridge, the United Kingdom.
