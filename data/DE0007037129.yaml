longBusinessSummary: 'RWE Aktiengesellschaft generates and supplies electricity from
  renewable and conventional sources in Germany, the United Kingdom, rest of Europe,
  North America, and internationally. It operates through five segments: Offshore
  Wind; Onshore Wind/Solar; Flexible Generation; Supply & Trading; and Phaseout Technologies.
  The company generates wind, hydro, solar, gas, lignite, and biomass electricity.
  It also trades in electricity, gas, and energy commodities; operates gas storage
  facilities; and engages in battery storage activities, as well as lignite mining
  and refining. The company serves commercial, industrial, and municipal customers.
  RWE Aktiengesellschaft was founded in 1898 and is headquartered in Essen, Germany.'
