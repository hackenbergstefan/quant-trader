longBusinessSummary: 'The Sherwin-Williams Company engages in the development, manufacture,
  distribution, and sale of paint, coatings, and related products to professional,
  industrial, commercial and retail customers. The company operates through three
  segments: Paint Stores Group, Consumer Brands Group, and Performance Coatings Group.
  The Paint Stores Group segment offers architectural paint and coatings; protective
  and marine products; and OEM product finishes and related products for architectural
  and industrial paint contractors, and do-it-yourself homeowners under the Sherwin-Williams
  brand. The Consumer Brands Group segment supplies a portfolio of branded and private-label
  architectural paints, stains, varnishes, industrial products, wood finishes products,
  wood preservatives, applicators, corrosion inhibitors, aerosols, caulks, and adhesives
  to retailers, including home centers and hardware stores, and dedicated dealers
  and distributors. The Performance Coatings Group segment develops and sells industrial
  coatings for wood finishing and general industrial applications; automotive refinish
  products; protective and marine coatings; coil coatings; packaging coatings; and
  performance-based resins and colorants. This segment serves retailers, dealers,
  jobbers, licensees, and other third-party distributors. The company operates in
  North America, South America, the Caribbean, Europe, Asia, and Australia. The Sherwin-Williams
  Company was founded in 1866 and is headquartered in Cleveland, Ohio.'
