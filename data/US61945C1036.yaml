longBusinessSummary: 'The Mosaic Company, through its subsidiaries, produces and markets
  concentrated phosphate and potash crop nutrients. It operates in three segments:
  Phosphates, Potash, and Mosaic Fertilizantes. The company owns and operates mines
  and production facilities, which produce concentrated phosphate crop nutrients and
  phosphate-based animal feed ingredients, as well as concentrated phosphate crop
  nutrients, such as diammonium phosphate, monoammonium phosphate, and MicroEssentials,
  a value-added ammoniated phosphate product. It also mines, processes, and sells
  potash to crop nutrient manufacturers, distributors, retailers, and to customers
  for industrial use; and owns and operates mines, chemical plants, crop nutrient
  blending and bagging facilities, port terminals and warehouses, which produce and
  sell concentrated phosphate and potash-based crop nutrients, and phosphate-based
  animal feed ingredients. In addition, the company produces a double sulfate of potash
  magnesia product under the K-Mag brand; and purchases phosphate, potash, and nitrogen
  products to produce blended crop nutrients. Further, it offers triple superphosphate,
  single superphosphate, and dicalcium phosphate; feed phosphate under the Biofos
  and Nexfos brands; potash for de-icing and as a water softener regenerant; and phosphogypsum.
  The company sells its products to wholesale distributors, retail chains, cooperatives,
  independent retailers, and national accounts through its sales force. It also exports
  its products. The company operates in the United States, Brazil, China, Canada,
  Paraguay, Argentina, Japan, Colombia, India, Australia, Peru, Mexico, Honduras,
  the Dominican Republic, Indonesia, and internationally. The Mosaic Company was incorporated
  in 1987 and is headquartered in Tampa, Florida.'
