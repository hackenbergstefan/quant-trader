longBusinessSummary: PG&E Corporation, through its subsidiary, Pacific Gas and Electric
  Company, engages in the sale and delivery of electricity and natural gas to customers
  in northern and central California, the United States. It generates electricity
  using nuclear, hydroelectric, fossil fuel-fired, fuel cells, and photovoltaic sources.
  The company owns and operates interconnected transmission lines; electric transmission
  substations, distribution lines, switching and distribution substations; and natural
  gas transmission, storage, and distribution systems consisting of distribution pipelines,
  backbone and local transmission pipelines, and various storage facilities. It serves
  residential, commercial, industrial, and agricultural customers, as well as natural
  gas-fired electric generation facilities. The company was incorporated in 1995 and
  is based in Oakland, California.
