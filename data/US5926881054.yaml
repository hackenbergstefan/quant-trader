longBusinessSummary: 'Mettler-Toledo International Inc. manufactures and supplies
  precision instruments and services in the Americas, Europe, Asia, and internationally.
  It operates through five segments: U.S. Operations, Swiss Operations, Western European
  Operations, Chinese Operations, and Other Operations. The company offers laboratory
  instruments, such as laboratory balances, liquid pipetting solutions, real-time
  analytics, titrators, pH meters, process analytics sensors and analyzer technologies,
  density and refractometry instruments, and thermal analysis systems; and other analytical
  instruments, including UV/VIS spectrophotometers, moisture analyzers, and cell counters,
  as well as LabX, a laboratory software platform to manage and analyze data generated
  by its instruments and automate workflows. It also provides industrial instruments
  comprising industrial weighing instruments and related terminals, automatic dimensional
  measurement and data capture solutions, vehicle scale systems, industrial software,
  metal detectors, x-ray systems, checkweighers, and camera-based imaging equipment.
  In addition, the company offers retail weighing solutions consisting of weighing
  and software solutions, AI-driven image recognition solutions for fresh goods, and
  automated packaging and labeling solutions for the meat backroom. The company serves
  pharmaceutical and biotech companies, independent research organizations, and testing
  labs; food manufacturers and retailers; chemical, specialty chemicals, and cosmetics
  companies; transportation and logistics, metals, and electronics industries; and
  academic community through its direct sales force and indirect distribution channels.
  Mettler-Toledo International Inc. was incorporated in 1991 and is headquartered
  in Greifensee, Switzerland.'
