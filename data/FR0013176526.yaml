longBusinessSummary: 'Valeo SE, a technology company, designs, produces, and sells
  products and systems for the automotive markets in France, other European countries,
  Africa, North America, South America, and Asia. It operates through three segments:
  Power, Brain, and Light. The Power segment offers automotive thermal systems, including
  electric vehicle (EV) cooling systems, which comprise XL plate liquid coolers, high
  performance chillers, electrically driven compressors, front end cooling modules,
  and air intake modules; EV range extension, which includes heat pump systems, flexheater,
  and ultra-thin HVAC; thermal management of EV battery systems comprising battery
  coolers and composite battery casing. This segment also develops thermal comfort
  solutions, such as smart cocoon demo car, Valeo odor free, air-conditioning loop,
  active grille shutter, and HVAC unit; and air quality systems, which include PM
  sensor, Cabin filt''air range, and two-vane rotary compressors, as well as UV air
  purifiers for public transport. The Brain segment offers driving assistance systems
  that design ultrasonic sensors, radars, and cameras, including Valeo Scala Lidar,
  Valeo 360VUE, Park4U, an automated parking system, Valeo Xtravue trailer, front
  cameras, and domain controllers; intuitive controls, such as heads-up display, interior
  cocoon, display, and steering wheel hub; connectivity solutions, which include vehicle
  telematics systems; and access solution such as, phone as key, and passive entry
  passive start systems. The Light segment provides lighting system solutions, such
  as picturebeam moonlighic, 360° light projection on the ground, LED rear lighting,
  front and rear fascias, non-blinding road beams; and wiper systems including, sensor
  cleaning systems, aquablade, and remote clean4U. The company also offers aftermarket
  services, original equipment spares, and spare parts and services. The company was
  incorporated in 1923 and is headquartered in Paris, France.'
