longBusinessSummary: 'The Walt Disney Company operates as an entertainment company
  in Americas, Europe, and the Asia Pacific. It operates in three segments: Entertainment,
  Sports, and Experiences. It produces and distributes film and television content
  under the ABC Television Network, Disney, Freeform, FX, Fox, National Geographic,
  and Star brand television channels, as well as ABC television stations and A+E television
  networks; and produces original content under the Disney Branded Television, FX
  Productions, Lucasfilm, Marvel, National Geographic Studios, Pixar, Searchlight
  Pictures, Twentieth Century Studios, 20th Television, and Walt Disney Pictures banners.
  It provides consumer streaming services through Disney+, Disney+ Hotstar, and Hulu;
  sports-related video streaming content through ESPN, ESPN on ABC, ESPN+ DTC, and
  Star; sale/licensing of film and episodic content to television and video-on-demand
  services; theatrical, home entertainment, and music distribution services; DVD and
  Blu-ray discs, electronic home video licenses, and VOD rental services; staging
  and licensing of live entertainment events; and post-production services. Further,
  it licenses its intellectual property (IP) to a third party that owns and operates
  Tokyo Disney Resort; licenses trade names, characters, visual, literary, and other
  IP for use on merchandise, published materials, and games; operates a direct-to-home
  satellite distribution platform; sells branded merchandise through retail, online,
  and wholesale businesses; and publishes books, comic books, and magazines. The company
  has strategic alliance with Adobe to support Disney innovation with new AI-powered
  tools. The company was founded in 1923 and is based in Burbank, California.'
