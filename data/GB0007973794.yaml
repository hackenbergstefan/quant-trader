longBusinessSummary: Serco Group plc provides public services in the United Kingdom,
  Europe, North America, the Asia Pacific, and the Middle East. It offers service
  design and advisory, resourcing, programme management, systems integration, case
  management, engineering, and assets and facilities management services. The company
  also provides administrative and back office, asylum seeker accommodation or passenger
  transport services; and supports in the decarbonization journeys of customers. It
  serves the United Kingdom and Canadian governments, devolved authorities, and other
  public sector customers; and federal and civilian agencies, and various state and
  municipal governments in citizen services, defense, health and other facilities
  management, justice and immigration, and transport sectors. Serco Group plc was
  founded in 1929 and is based in Hook, the United Kingdom.
