longBusinessSummary: Garmin Ltd. designs, develops, manufactures, markets, and distributes
  a diverse range of GPS-enabled products and navigation, communications, sensor-based,
  and information products and services worldwide. It offers running; cycling products;
  smartwatch devices; scales and monitors; and sports timing and performance analysis;
  Garmin Connect and Garmin Connect Mobile, which are web and mobile platforms where
  users can track and analyze their fitness, activities and workouts, and wellness
  data; and Connect IQ, which enables third parties to create applications that run
  on Garmin devices. It also provides adventure watches; outdoor handhelds and satellite
  communicators; golf devices; consumer automotive; dog devices; InReach and Garmin
  Response; and dive devices. In addition, it designs, manufactures, and markets various
  aircraft avionics solutions, including integrated flight decks, electronic flight
  displays and instrumentation, navigation and communication products, automatic flight
  control systems and safety-enhancing technologies, audio control systems, engine
  indication systems, traffic awareness and avoidance solutions, ADS-B and transponders,
  weather information and avoidance solutions, datalink and connectivity solutions,
  and portable GPS navigators and wearables, as well as service products to the aviation
  market. Further, it offers chartplotters and multi-function displays, cartography,
  fishfinders, sonar, autopilot systems, radars, compliant instrument displays and
  sensors, VHF communication radios, handhelds and wearable devices, sailing, audio,
  digital switching, trolling motors, and lighting; and domain controllers and infotainment
  units, as well as software, map database, camera, wearable, and automotive solutions.
  The company sells its products through independent retailers, dealers, distributors,
  installation and repair shops, OEM, and online webshop. Garmin Ltd. was founded
  in 1989 and is based in Schaffhausen, Switzerland.
