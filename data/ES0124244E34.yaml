longBusinessSummary: Mapfre, S.A., together with its subsidiaries, engages in insurance,
  reinsurance, and financial activities in Spain. The company offers life; health;
  accident; property and casualty protection that include automobile insurance, homeowner
  and commercial risk, and family third-party liability insurance; savings and investment;
  retirement; burial; travel and leisure insurance; and agriculture and livestock
  insurance products. It also provides investment and pension funds; reinsurance services;
  insurance for businesses; and business multirisk insurance. The company serves its
  products to companies, small, medium, and large corporations, as well as to professionals,
  entrepreneurs, the self-employed, and small businesses. The company was formerly
  known as Corporacion Mapfre and changed its name to Mapfre, S.A. in December 2006.
  Mapfre, S.A. was founded in 1933 and is based in Majadahonda, Spain. Mapfre, S.A.
  operates as a subsidiary of Cartera Mapfre, S.L.
