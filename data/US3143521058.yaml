longBusinessSummary: FedEx Freight Holding Company, Inc. provides less-than-truckload
  freight transportation services in the United States and internationally. The company
  offers FedEx Freight Priority services, including next-business-day service for
  shipments traveling up to 600 miles and second-business-day service for shipments
  traveling up to 1,600 miles and backed by a money-back service guarantee if published
  delivery commitments are not met; and FedEx Freight Economy. It also provides surface
  expedite and white glove services; and LTL Select, a cloud-based transportation
  management system. In addition, the company offers volume and custom critical services,
  FedEx Freight Direct, and Retail Flex. It provides its services under the FedEx
  and FedEx Freight names. The company was incorporated in 2025 and is headquartered
  in Memphis, Tennessee.
