longBusinessSummary: Haleon plc, together with its subsidiaries, engages in the research,
  development, manufacture, and sale of various consumer healthcare products in North
  America, Europe, the Middle East, Africa, Latin America, and the Asia Pacific. The
  company offers oral health products, such as toothpastes, mouth washes, and denture
  care products under the Sensodyne, Polident, Parodontax, and Biotene brands; and
  vitamins, minerals, and supplements under Centrum, Emergen-C, Caltrate brands. It
  also provides various over-the-counter products comprising nasal drops, and cold,
  flu, and allergy relief products under Theraflu, and Flonase brands for respiratory
  issues; and pain relief products under Voltaren, Panadol, and Advil brands; and
  antacids and antihistamine products under TUMS, ENO, and Fenistil brands for digestive
  health and other issues. Haleon plc has a collaboration agreement with Microsoft
  to scale digital, data and AI capabilities across the business and accelerate delivery
  of its global win as one strategy. Haleon plc was formerly known as DRVW 2022 plc
  and changed its name to Haleon plc in February 2022. The company was founded in
  1715 and is headquartered in Weybridge, the United Kingdom.
