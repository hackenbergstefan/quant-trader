longBusinessSummary: Imperial Brands PLC, together with its subsidiaries, manufactures,
  imports, markets, and sells tobacco and tobacco-related products in Europe, the
  Americas, Africa, the Asia, Australasia, and internationally. It offers a range
  of cigarettes, tobacco accessories, vapour, heated tobacco, and oral nicotine. The
  company sells its products under various brands, including JPS, Davidoff, Gauloises,
  West, Winston, Kool, Lambert & Butler, P&S, Fortuna, Nobel, News, Backwoods, Champion,
  Golden Virginia, FINE, Rizla, Blu, Pulze, Skruf, and Zone. In addition, it engages
  in the distribution of tobacco and NGP products for tobacco and NGP product manufacturers;
  and various non-tobacco and NGP products and services. Further, the company is involved
  in the management of a golf course; distribution of pharmaceuticals, POS software,
  and published materials and other products; printing and publishing activities;
  and provision of long haul transportation, industrial parcel and express delivery,
  pharmaceutical products logistics, advertising, payment, freight forwarding, and
  support management services, as well as owns the trademarks; and retails its products.
  Additionally, it engages in edition and distribution of books and non-periodical
  publication. Furthermore, the company is involved in research and development of
  e-vapour products. The company was formerly known as Imperial Tobacco Group PLC
  and changed its name to Imperial Brands PLC in February 2016. Imperial Brands PLC
  was founded in 1636 and is based in Bristol, the United Kingdom.
