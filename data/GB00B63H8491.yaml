longBusinessSummary: 'Rolls-Royce Holdings plc designs and manages mission-critical
  power systems in the United Kingdom and internationally. The company operates through
  three segments: Civil Aerospace, Defence, and Power Systems. The Civil Aerospace
  segment develops, manufactures, markets, and sells aero engines for large commercial
  aircraft, regional jet, and business aviation markets, as well as provides aftermarket
  services. The Defence segment is involved in the development, manufacture, marketing,
  and sale of military aero engines, naval engines, and submarine nuclear power plants,
  as well as offers aftermarket services. The Power Systems segment engages in the
  development, manufacture, marketing, and sale of integrated solutions for onsite
  power and propulsion under the mtu brand name. Rolls-Royce Holdings plc was founded
  in 1884 and is headquartered in London, the United Kingdom.'
