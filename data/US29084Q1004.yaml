longBusinessSummary: EMCOR Group, Inc. provides electrical and mechanical construction
  and facilities, building, and industrial services in the United States and the United
  Kingdom. It offers design, integration, installation, startup, operation, and maintenance
  services related to power transmission, distribution, and generation systems; energy
  solutions; premises electrical and lighting systems; process instrumentation; low-voltage
  systems; voice and data communications systems; roadway and transit lighting, signaling,
  and fiber optic lines; computerized traffic control systems, and signal and communication
  equipment; heating, ventilation, air conditioning, refrigeration, and geothermal
  solutions; clean-room process ventilation systems; fire protection and suppression
  systems; plumbing, process, and piping systems; control and filtration systems;
  water and wastewater treatment systems; central plant heating and cooling systems;
  crane and rigging; millwright; and steel fabrication, erection, and welding services.
  The company also provides site-based operations and maintenance; facility management
  and maintenance; energy retrofit; military base operations support; indoor air quality;
  floor care and janitorial; landscaping, lot sweeping, and snow removal; vendor management
  and call center; installation and support for building systems; program development,
  management, and maintenance for energy systems; technical consulting and diagnostic;
  infrastructure and building projects; modification and retrofit projects; and reception,
  security, and catering services. In addition, it offers refinery turnaround planning
  and engineering; welding; overhaul and maintenance; technical; instrumentation,
  controls, and electrical; electrical panel design, fabrication, and installation;
  on-site repair and maintenance; and renewable energy services, as well as design,
  manufacturing, repair, and hydro blast cleaning services. The company was incorporated
  in 1987 and is headquartered in Norwalk, Connecticut.
