longBusinessSummary: 'Deutsche Lufthansa AG operates as an aviation company in Europe,
  North America, Central and South America, Aisa/Pacific, the Middle East, and Africa.
  It operates in three segments: Passenger Airlines; Logistics; and Maintenance, Repair
  and Overhaul (MRO). The Passenger Airlines segment offers products and services
  to passengers of Lufthansa Airlines, SWISS, Austrian Airlines, Brussels Airlines,
  and Eurowings. The Logistics segment provides airfreight container management, time-critical
  shipments, and customs clearance services; and digital and modular logistics solutions
  for cross-border e-commerce solutions. The MRO segment provides maintenance, repair,
  and overhaul services for civil commercial aircraft serving original equipment manufacturers,
  aircraft leasing companies, VIP jet operators, government, armed forces, and airlines.
  It also sells flight tickets and related ancillary services through agents, its
  own websites, or other airlines; offers vocational and professional training for
  cockpit and cabin crew; and IT solutions. The company operates a fleet of 737 aircraft.
  Deutsche Lufthansa AG was founded in 1926 and is headquartered in Cologne, Germany.'
