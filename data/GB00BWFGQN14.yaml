longBusinessSummary: 'Spirax Group plc provides thermal energy and fluid technology
  solutions in Europe, the Middle East, Africa, the Asia Pacific, and the Americas.
  It operates through three segments: Steam Thermal Solutions, Electric Thermal Solutions,
  and Watson-Marlow Fluid Technology Solutions. The company offers industrial and
  commercial steam systems, including condensate management, controls, and thermal
  energy management products and solutions for heating, curing, cooking, drying, cleaning,
  sterilizing, space heating, humidifying, vacuum packing, and producing hot water;
  electrical process heating and temperature management solutions, such as industrial
  heaters and systems, heat tracing, and various component technologies; and designs
  and manufactures peristaltic and niche pumps and associated fluid path technologies,
  including tubing, specialised filling systems and products for single use applications.
  The company serves food and beverage, pharmaceutical and biotechnology, oil and
  gas, chemical, power generation, healthcare, buildings, water and wastewater, semiconductor,
  transport, original equipment manufacturers machinery, and mining and precious metal
  processing industries. The company was formerly known as Spirax-Sarco Engineering
  plc and changed its name to Spirax Group PLC in June 2024. Spirax Group PLC was
  founded in 1888 and is headquartered in Cheltenham, the United Kingdom.'
