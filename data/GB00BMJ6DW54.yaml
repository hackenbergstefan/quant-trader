longBusinessSummary: 'Informa plc operates as an international events, digital services,
  and academic research company in the United Kingdom, Continental Europe, North America,
  China, and internationally. It operates through five segments: Informa Markets,
  Informa Connect, Informa Festivals, Taylor & Francis, and Infroma TechTarget. The
  Informa Markets segment enable buyers, sellers, and decision makers to meet, discover,
  and showcase new products in various specialist markets, as well as delivers live
  events, including annual business-to-business exhibitions, specialist content, and
  services that help buyers and suppliers connect digitally comprising lead and demand
  generation solutions. Its Informa Connect segment delivers digital content; and
  creates content-led live and on demand events and experiences for professionals
  in finance, life sciences, foodservice, and other specialist markets through in-person,
  live, and online platforms that enables businesses and professionals to meet, network,
  discuss, and learn. Informa Festivals segment engages in experience-led B2B events.
  The Informa TechTarget segment provides B2B data and market access services. Its
  Taylor & Francis segment curates and publishes applied academic research, learning,
  and championing communities of academics, researchers, experts, and knowledge makers
  in science, technology and medicine, and humanities and social sciences fields in
  pay-to-publish and pay-to-read, open research, and advanced learning formats. The
  company was formerly known as T&F Informa plc and changed its name to Informa plc
  in August 2005. Informa plc was founded in 1998 and is headquartered in London,
  the United Kingdom.'
