longBusinessSummary: Syensqo SA/NV, a chemical company, engages in the research, development,
  and production of advanced materials for industrial and consumer applications worldwide.
  The company operates through the Materials, Performance & Care, and Other Solutions
  segments. It offers amine ether, amines, fatty amines, and specialty amines; antioxidants
  and stabilizers; composites; flavors and fragrances, including vanillin, ethylvanillin,
  natural vanillin, and cyclopentanone; lithium derivatives; diphenols and hydrocarbon
  monomers; and phosphorus specialties. The company also provides biobased polymers,
  inverse emlusion polymers, monomers, specialty monomers, and synthetic polymers;
  solvents comprising green solvents, flame retardants, and hydrocarbon; specialty
  chemicals, such as nitric acid; specialty polymers that include aromatic polyamides,
  aromatics, sulfones, fluorinated fluids, fluoropolymers, high performance polyester,
  polyethylene, polyolefin, and polyvinylidene chloride; and amphoteric, anionic,
  blend, cationic, and non-ionic surfactants. It serves the aerospace, automotive,
  agriculture, batteries, building, consumer goods, electronics, food, green hydrogen,
  healthcare, industrial, resources, environment, and energy sectors, as well as renewable
  materials and biotechnology markets. Syensqo SA/NV was founded in 1863 and is headquartered
  in Brussels, Belgium.
