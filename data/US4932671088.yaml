longBusinessSummary: KeyCorp operates as the holding company for KeyBank National
  Association that provides various retail and commercial banking products and services
  in the United States. It operates in two segments, Consumer Bank and Commercial
  Bank. The company offers various deposits and investment products; personal finance
  and financial wellness, lending, student loan refinancing, mortgage and home equity,
  credit card, treasury, and business advisory; commercial leasing, investment management,
  consumer finance; and wealth management and investment services for institutional,
  non-profit, and high-net-worth clients. It also provides lending, cash management,
  equipment financing, and commercial mortgage loans; and capital market products
  and services, such as syndicated finance, debt and equity underwriting, fixed income
  and equity sales and trading, derivatives, foreign exchange, mergers and acquisition,
  other advisory services, and public finance to large corporate and institutional
  clients. In addition, the company offers personal and institutional trust custody
  services, personal financial and planning services, access to mutual funds, treasury
  services, and international banking services. Further, it provides community development
  financing, securities underwriting, brokerage, and investment banking services,
  as well as merchant services. The company was founded in 1849 and is headquartered
  in Cleveland, Ohio.
