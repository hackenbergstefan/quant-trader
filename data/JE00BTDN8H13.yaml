longBusinessSummary: 'Aptiv PLC, an industrial technology company, provides hardware
  and software solutions to support automotive and other industries in North America,
  Europe, the Middle East, Africa, the Asia Pacific, and South America. It operates
  through three segments: Advanced Safety and User Experience, Engineered Components,
  and Electrical Distribution Systems. The company offers active safety, user experience
  and smart vehicle compute, and software products for vehicle safety and security,
  including intelligent sensors, compute platforms, and software tools and services.
  It also provides connection systems, interconnects, and cable management and protection
  solutions for the distribution of power, signal, and data. Aptiv PLC was incorporated
  in 2011 and is based in Schaffhausen, Switzerland.'
