longBusinessSummary: 'Piraeus Bank S.A. provides various banking products and services
  in Greece, Europe, and internationally. The company operates through five segments:
  Retail Banking, Business Banking, Piraeus Financial Markets, Snappi, and Other.
  It offers term deposits, savings, current, and payroll and pension accounts; mortgage
  and personal loans; credit, debit, and prepaid cards; car, civil liability and legal
  protection, home security, health, pension plans, life and accident, and lifestyle
  insurance plans; investment products, including savings programs, portfolio management,
  mutual funds, stock market transactions and services, government bonds and treasury
  bills, gold investment, and securities custody; and electronic banking services.
  The company also provides corporate banking products and services, such as professional
  and farmer accounts; corporate cards; farmer''s, business premise, liability, and
  photovoltaic park insurance plans; and payments and receipts comprising IRIS payments
  for businesses, business remittance, payment records, collection through bank channels,
  payroll, accepting cards, money management, checks, and management of bills of exchange.
  In addition, it offers financing solutions for businesses, which include working
  capital; professional housing and equipment; co-financed programs, such as farmer
  financing and specialized solutions; factoring; and letter of guarantee, as well
  as real estate, equipment, and development leasing. Further, the company provides
  online stock and bond trading; wealth services comprising investment advice, wealth
  advisor, multi-family office, execution of transactions, and custody; asset management
  products, including alternative, structured, and thematic products; and economic
  and financial planning. It offers its products and services through e-banking, Piraeus
  app, phone banking, and stores and ATMs. Piraeus Bank S.A. was founded in 1916 and
  is headquartered in Athens, Greece.'
