longBusinessSummary: 'HP Inc. provides personal computing, printing, 3D printing,
  hybrid work, gaming, and other related technologies in the United States and internationally.
  The company operates through three segments: Personal Systems, Printing, and Corporate
  Investments. The Personal Systems segment offers commercial and consumer desktops
  and notebooks, workstations, thin clients, retail point-of-sale systems, displays,
  software, hybrid systems, and endpoint security and services, as well as lifecycle
  services, including support and deployment, configurations, and extended warranty
  services. The Printing segment provides consumer and commercial printer hardware,
  supplies, and solutions, as well as office and home printing solutions; and focuses
  on graphics, 3D printing, and personalization solutions for the commercial and industrial
  markets. The Corporate Investments segment is involved in the business incubation
  and investment projects. It serves small- and medium-sized businesses, public sector,
  and enterprises. The company was formerly known as Hewlett-Packard Company and changed
  its name to HP Inc. in October 2015. HP Inc. was founded in 1939 and is headquartered
  in Palo Alto, California.'
