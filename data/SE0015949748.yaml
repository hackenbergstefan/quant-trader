longBusinessSummary: Beijer Ref AB (publ), together with its subsidiaries, provides
  commercial and industrial refrigeration, heating, and air conditioning products
  worldwide. It provides commercial refrigeration systems, which are used in shops,
  catering, cafes, hotels, and small refrigerated warehouses; and central refrigeration
  systems, freezer, and refrigeration plants for modern food retailing, as well as
  for a range of applications, including ice rinks, food processing, manufacturing,
  and offshore industries. The company also offers HVAC or comfort cooling and heating
  products, such as products for climate control and ventilation in homes, offices,
  and shops; and provides air-to-water heat pumps, as well as produces chillers and
  heat pumps based on natural refrigerants, such as carbon dioxide, ammonia, and propane.
  The company distributes products through its branch network and logistics centers
  in EMEA, APAC, and North America regions. The company was formerly known as G &
  L Beijer AB (publ) and changed its name to Beijer Ref AB (publ) in 2014. The company
  was founded in 1866 and is headquartered in Malmö, Sweden.
