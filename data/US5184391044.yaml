longBusinessSummary: The Estée Lauder Companies Inc. manufactures, markets, and sells
  skin care, makeup, fragrance, and hair care products worldwide. The company provides
  skin care products, including moisturizers, serums, cleansers, toners, eye care,
  body care, exfoliators, acne care and oil correctors, facial masks, and sun care
  products; and makeup products, such as foundations, powders, concealers and setting
  sprays, lipsticks, lip liners and lip glosses, mascaras, and eyeshadows and eyeliners,
  as well as compacts, brushes, and other makeup tools. It also offers fragrance products
  in various forms comprising parfum, eau de parfum, eau de toilette, eau de cologne,
  and body spray, as well as lotions, creams, powders, candles and soaps; and hair
  care products, including shampoos, conditioners, styling products, treatment, finishing
  sprays, and hair color products, as well as sells ancillary products and services.
  The company provides its products under the La Mer, Jo Malone London, TOM FORD,
  AERIN Beauty, Le Labo, Editions de Parfums Frédéric Malle, KILIAN PARIS, BALMAIN
  Beauty, Estée Lauder, Clinique, M·A·C, The Ordinary, Aveda, Bobbi Brown Cosmetics,
  Too Faced, Dr.Jart+, Bumble and bumble, Smashbox, Darphin Paris, Lab Series, Avestan,
  Loopha, Origins, NIOD, Aramis, and GLAMGLOW brands. It sells its products through
  department stores, duty-free retailers, specialty multi retailers, online pure players,
  upscale perfumeries and pharmacies, and top-tier salons and spas, as well as direct-to-consumer
  businesses across freestanding stores, and brand websites and third-party online
  platforms. The Estée Lauder Companies Inc. was founded in 1946 and is based in New
  York, New York.
