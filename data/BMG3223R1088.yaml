longBusinessSummary: Everest Group, Ltd., together with subsidiaries, provides reinsurance
  and insurance products in the United States, Europe, and internationally. It operates
  in two segment, Insurance and Reinsurance. The company writes property and casualty
  reinsurance; treaty and facultative reinsurance products; and specialty lines of
  business through reinsurance brokers, as well as directly with ceding companies;
  and writes property and casualty insurance directly, as well as through brokers,
  surplus lines, and general agents. It provides reinsurance products comprising mortgage,
  catastrophe, marine, aviation, engineering, professional line, credit and surety,
  motor, agriculture/crop, and political violence reinsurance products. In addition,
  the company offers commercial property and casualty insurance products through wholesale
  and retail brokers, surplus lines brokers, and program administrators. The company
  was formerly known as Everest Re Group, Ltd. and changed its name to Everest Group,
  Ltd. in July 2023.Everest Group, Ltd., was founded in 1973 and is headquartered
  in Hamilton, Bermuda.
