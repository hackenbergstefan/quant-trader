longBusinessSummary: AIB Group plc provides banking and financial products and services
  to personal, business, and corporate customers in the Republic of Ireland, the United
  Kingdom, and internationally. It operates through Retail Banking, AIB Capital Markets,
  Climate & Infrastructure Capital, AIB UK, and Group segments. The company offers
  current and savings accounts, demand deposits, notice deposits, fixed term deposits,
  junior/student saver deposits, and currency deposits. It also provides personal,
  car, home improvement, student, SBCI and government, education, business sustainability,
  and farm and forestry development loans; merger and acquisition, management buyouts,
  syndicated debt facilities, infrastructure and project, mezzanine, asset, invoice,
  trade, revolving credit, corporate credit, prompt pay and insurance premium, structured
  and specialist, and ibanking financing services; mortgages; business and farmer
  credit line and overdrafts; and mortgages. In addition, the company offers credit
  and debit cards; investment funds; life, home, car, travel, and business succession
  insurance products; and pension products. Further, it provides foreign currency
  and interest rate risk management, cash management, equity investments, private
  banking services and advice, lending, treasury, trade facilities, asset finance,
  and invoice discounting services, as well as wealth management and capital markets
  services. The company was formerly known as Allied Irish Banks, p.l.c. and changed
  its name to AIB Group plc in December 2017. AIB Group plc was founded in 1825 and
  is headquartered in Dublin, Ireland.
