longBusinessSummary: argenx SE, a commercial-stage biopharma company, develops various
  therapies for the treatment of autoimmune diseases in the United States, Japan,
  China, the Netherlands, and internationally. The company offers VYVGART for the
  treatment of gMG and immune thrombocytopenia (ITP), and VYVGART HYTRULO for the
  treatment of gMG and chronic inflammatory demyelinating polyneuropathy (CIDP). It
  also develops efgartigimod for the treatment of seronegative gMG, ocular myasthenia
  gravis (MG), primary ITP, grave's disease, myositis, Sjögren's disease, systemic
  sclerosis, and AMR; empasiprubart for MMN, delayed graft function, and CIDP; and
  adimanebart for congenital myasthenic syndrome and spinal muscular atrophy. In addition,
  the company is developing ARGX-213, a neonatal Fc receptor (FcRn)-targeted antibody
  engineered for half-life extension and sustained IgG reduction; ARGX-124, a FcRn
  pipeline candidate; ARGX-109, which targets IL-6 to treat inflammation; ARGX-121,
  which targets immunoglobulin A; and ARGX-118, which develops antibodies against
  Galectin-10, as well as cusatuzumab, ARGX-112, ARGX-114, and ARGX-115. It has strategic
  partnerships and license agreements with Zai Lab to develop and commercialize efgartigimod;
  Halozyme Therapeutics to its ENHANZE for the prevention and treatment of human diseases;
  OncoVerity, Inc for cusatuzumab; and AbbVie, Inc. for ARGX-115. argenx SE was incorporated
  in 2008 and is based in Amsterdam, the Netherlands.
