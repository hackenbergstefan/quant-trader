longBusinessSummary: W.W. Grainger, Inc., together with its subsidiaries, distributes
  maintenance, repair, and operating products and services primarily in North America,
  Japan, and the United Kingdom. The company operates through two segments, High-Touch
  Solutions North America and Endless Assortment. It provides safety, security, material
  handling and storage equipment, pumps and plumbing equipment, cleaning and maintenance,
  and metalworking and hand tools. The company also offers technical support and inventory
  management services. It serves smaller businesses to large corporations, government
  entities, and other institutions, as well as commercial, healthcare, and manufacturing
  industries through sales and service representatives, and electronic and ecommerce
  channels. W.W. Grainger, Inc. was founded in 1927 and is headquartered in Lake Forest,
  Illinois.
