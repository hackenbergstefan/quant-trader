longBusinessSummary: Standard Life plc operates in the long-term savings and retirement
  business in Europe. It operates through Retirement Solutions, Pensions & Savings,
  With-Profits, and Europe & Other segments. The company offers defined contribution
  workplace pensions, retail savings for retirement, international bonds, and legacy
  savings and pension products; defined benefit pension income, income drawdown and
  lifetime annuities, fixed-term annuities, and smoothed managed funds. It also offers
  new and in-force individual annuity and pension risk transfer contracts written
  within shareholder funds; U.K. individual annuity; workplace pensions and self-invested
  personal pensions; new and in-force insurance and investment unit-linked products;
  and protection products. The company offers its products under the Standard Life,
  SunLife, Phoenix Life, Phoenix Wealth, Phoenix Corporate Investment Services, and
  ReAssure brands. Standard Life plc was formerly known as Phoenix Group Holdings
  plc and changed its name to Standard Life plc in February 2026. The company was
  founded in 1782 and is based in London, the United Kingdom.
