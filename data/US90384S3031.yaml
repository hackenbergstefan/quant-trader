longBusinessSummary: Ulta Beauty, Inc. operates as a specialty beauty retailer in
  the United States, Mexico, and Kuwait. The company offers branded and private label
  beauty products, including cosmetics, fragrance, haircare, skincare, bath and body
  products, professional hair products, and salon styling tools through its Ulta Beauty
  stores, shop-in-shops, Ulta.com website, and its mobile applications. It also provides
  wellness products. The company was formerly known as ULTA Salon, Cosmetics & Fragrance,
  Inc. and changed its name to Ulta Beauty, Inc. in January 2017. Ulta Beauty, Inc.
  was incorporated in 1990 and is based in Bolingbrook, Illinois.
