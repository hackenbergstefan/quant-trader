longBusinessSummary: Interpump Group S.p.A., together with its subsidiaries, engages
  in the manufacturing and selling of high-pressure pumps in Italy, rest of Europe,
  North America, the Far East and the Pacific Area, and internationally. The company
  is involved in the design and distribution of volumetric pumps; production, sale,
  and distribution of pressure systems and pumps; production of mechanical sifters;
  production and sale of equipment for the food processing, chemicals, cosmetics,
  and pharmaceuticals industries; galvanic treatment of metals; and sale of centrifugal
  separators. It also engages in drawing, shearing, and pressing sheet metal; design,
  production, and sale of mechanized milking systems; production and sale of power
  take-offs, hydraulic pumps, hydraulic cylinders, valves, rotary unions, hydraulic
  hoses, and fittings, as well as rubber mixtures, rigid and flexible hydraulic lines,
  and directional controls; sale of ancillary products for industrial vehicles; surface
  treatments; and smelting of ferrous metals, cast iron, and aluminum. In addition,
  the company is involved in the production and sale of power transmission systems,
  planetary gears, ratiomotors, and drive wheels; and the design, production, and
  sale of piping systems. Further, it offers water-jetting and hydraulics-related
  components, as well as flanges, oil tanks, gears, orbital motors, steering system,
  cylinder, mixers, plunger pumps, special pumps, cleaning systems, and valves and
  tanks. Interpump Group S.p.A. was founded in 1977 and is based in Sant'ilario D'enza,
  Italy.
