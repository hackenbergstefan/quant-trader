longBusinessSummary: AMETEK, Inc. manufactures and sells electronic instruments (EIG)
  and electromechanical (EMG) devices in the United States and internationally. It
  operates through EIG and EMG segments. The company offers advanced instruments for
  the process, aerospace, power, and industrial markets; process and analytical instruments
  for the oil and gas, petrochemical, pharmaceutical, semiconductor, automation, and
  food and beverage industries; instruments to the laboratory equipment, ultra-precision
  manufacturing, medical, and test and measurement markets; power quality monitoring
  and metering devices, uninterruptible power supplies, programmable power and electromagnetic
  compatibility test equipment, and gas turbines sensors; dashboard instruments for
  heavy trucks and other vehicles; instrumentation and controls for food and beverage
  industries; and aircraft and engine sensors, embedded computing, monitoring, power
  supplies, fuel and fluid measurement, and data acquisition systems for aerospace
  and defense industry. It also provides engineered medical components and devices,
  automation solutions, thermal management systems, specialty metals, and electrical
  interconnects; single-use and consumable surgical instruments, implantable components,
  and drug delivery systems; engineered electrical connectors and electronics packaging;
  precision motion control products for data storage, medical devices, business equipment,
  automation, and other application; high-purity powdered metals, strips and foils,
  specialty clad metals, and metal matrix composites; motor-blower systems and heat
  exchangers for thermal management, military and commercial aircraft, and military
  ground vehicles; and motors used in commercial appliances, food and beverage machines,
  hydraulic pumps, and industrial blowers, as well as operates a network of aviation
  maintenance, repair, and overhaul facilities. AMETEK, Inc. was incorporated in 1930
  and is headquartered in Berwyn, Pennsylvania.
