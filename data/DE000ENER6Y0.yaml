longBusinessSummary: Siemens Energy AG operates as an energy technology company worldwide.
  It operates through Gas Services, Grid Technologies, Transformation of Industry,
  and Siemens Gamesa segments. The company provides gas and steam turbines, generators,
  and heat pumps, as well as performance enhancement, maintenance, digitalization,
  and consulting services for central and distributed power generation; and high voltage
  direct current transmission systems, offshore wind farm grid connections, transformers,
  flexible alternating current transmission systems, high voltage substations, air
  and gas-insulated switchgears, circuit breakers, capacitor, digital grid solutions
  and components, components and cyber security, and transformers and storage solutions.
  It also offers electrolyzers, industrial steam turbines, industrial generators,
  turbo and reciprocating compressors, drive systems and solutions, batteries and
  fuel cells, and other systems and solutions, as well as service and digital offerings;
  onshore and onshore wind turbines; design, engineering, manufacturing, and installation
  solutions for onshore markets; offshore wind turbine equipment design, manufacturing,
  and installation solutions; and management, operation and maintenance services for
  wind farms. The company serves utilities, independent power producers, project developers,
  municipal energy producers, engineering, procurement, and construction companies,
  oil and gas, transmission and distribution system operators, and industrial and
  infrastructure customers. Siemens Energy AG was founded in 1866 and is based in
  Munich, Germany.
