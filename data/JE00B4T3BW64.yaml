longBusinessSummary: Glencore plc engages in the production, refinement, processing,
  storage, transport, and marketing of metals and minerals, and energy products in
  the Americas, Europe, Asia, Africa, and Oceania. The company operates in two segments,
  Marketing Activities and Industrial Activities. It engages in the production and
  marketing of copper, cobalt, lead, nickel, zinc, chrome ore, ferrochrome, vanadium,
  aluminum, alumina, and iron ore; and coal, crude oil, refined products, and natural
  gas, as well as oil exploration and production and refining and distribution. The
  company is also involved in marketing and distributing physical commodities sourced
  from third party producers to industrial consumers, including the battery, electronic,
  construction, automotive, steel, energy, and oil industries. In addition, the company
  provides financing, logistics, and other services to producers and consumers of
  commodities. Glencore plc was founded in 1974 and is headquartered in Baar, Switzerland.
