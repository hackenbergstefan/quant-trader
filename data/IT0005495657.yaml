longBusinessSummary: Saipem SpA provides energy and infrastructure solutions worldwide.
  It operates through Asset Based Services, Offshore Drilling, and Energy Carriers
  segments. The company offers development of subsea fields and pipelaying; installation
  and lifting of offshore structures; engages in engineering, implementation, installation,
  maintenance, modification, and decommissioning activities, as well as offshore engineering
  and construction, and wind activities. It is also involved in onshore engineering
  and construction, sustainable infrastructures, and robotics and industrialized solutions;
  and design and construction of infrastructure projects, such as railway lines in
  high speed/high capacity lines. In addition, the company provides procurement, project
  management, and construction services to oil and gas, civil and marine infrastructure,
  and environmental markets. The company was founded in 1957 and is headquartered
  in Milan, Italy.
