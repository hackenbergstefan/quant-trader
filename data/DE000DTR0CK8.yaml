longBusinessSummary: 'Daimler Truck Holding AG manufactures and sells light, medium-
  and heavy-duty trucks and buses in Europe, North America, Asia, Latin America, and
  internationally. The company operates through five segments: Trucks North America,
  Mercedes-Benz Trucks, Trucks Asia, Daimler Buses, and Financial Services. It offers
  light, medium, and heavy-duty trucks; city and intercity buses, coaches, and bus
  chassis; industrial engines; and special vehicles used in various sector, as well
  as new and used commercial vehicles. The company also provides various financial
  services, such as rental, leasing, and financing for vehicles; and charging infrastructure,
  insurance brokerage, payment, and integrated services for zero emission vehicles.
  In addition, it offers connectivity solutions under the Detroit Connect, Truckonnect,
  TruckLive, OMNIplus ON, Mercedes-Benz Uptime, and Fleetboard brand names; and aftersales
  services, as well as sells spare parts. It provides trucks and buses under the Mercedes-Benz,
  Freightliner, Western Star, FUSO, BharatBenz, RIZON, Setra, and Thomas Built Buses
  brands. The company was founded in 1896 and is headquartered in Leinfelden-Echterdingen,
  Germany.'
