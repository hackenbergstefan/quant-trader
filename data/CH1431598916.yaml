longBusinessSummary: INFICON Holding AG develops instruments for gas analysis, measurement,
  and control in Switzerland and internationally. The company offers industrial gas
  analyzers, mass spectrometers, and process control sensors; vacuum gauges, controllers,
  components, and feedthroughs; leak detectors; thin film controllers; application-based
  software solutions; quartz crystal, RF sensing, and xParts coating technologies;
  chemical detectors and monitors; micro gas chromatography; and service tools. It
  also provides toxic chemical analysis products for emergency response, security,
  and environmental monitoring, as well as instruments for energy and petrochemical
  applications. The company's analysis, measurement, and control products are used
  for gas leak detection in air conditioning, refrigeration, and automotive manufacturing;
  and for equipment manufacturers and end-users in the fabrication of semiconductors
  and thin film coatings for optics, flat panel displays, solar cells, LED lighting,
  and industrial vacuum coating applications. Its products are also used in the life
  sciences, research, aerospace, packaging, heat treatment, laser cutting, and other
  industrial sectors. The company was founded in 2000 and is based in Bad Ragaz, Switzerland.
