longBusinessSummary: Vend Marketplaces ASA, together with its subsidiaries, develops
  and operates various marketplaces in Norway, Sweden, Finland, and Denmark. The company
  operates through Mobility, Real Estate, Jobs, and Recommerce segments. Its marketplaces
  operations include online classified operations through FINN.no, blocket.se, tori.fi
  and oikotie.fi, and bilbasen.dk and dba.dk., which provide technology-based services
  to connect buyers and sellers and facilitate transactions, such as job offers, real
  estate, cars, travel, and consumer goods. The company's marketplaces operations
  also comprise adjacent businesses, including Nettbil, Qasa, AutoVex, and HomeQ.
  The company was formerly known as Schibsted ASA and changed its name to Vend Marketplaces
  ASA in May 2025. Vend Marketplaces ASA was founded in 1839 and is based in Oslo,
  Norway.
