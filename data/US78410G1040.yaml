longBusinessSummary: SBA Communications Corporation is a leading independent owner
  and operator of wireless communications infrastructure, including tower structures,
  rooftops and other structures that support antennas used for wireless communications.
  In our site leasing business, we lease space to wireless service providers and other
  customers on assets we own or operate, and manage rooftop and tower sites for property
  owners under various contractual arrangements. As of December 31, 2025, we owned
  46,328 towers, a substantial portion of which were built by us or by other tower
  owners or operators who, like us, build towers to lease space to multiple wireless
  service providers. As of December 31, 2025, each of our towers had an average of
  1.8 tenants. SBA Communications Corporation was established in 1989 and was incorporated
  in Florida.
