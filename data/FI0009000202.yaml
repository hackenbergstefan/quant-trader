longBusinessSummary: Kesko Oyj engages in the chain operations in Finland, Sweden,
  Norway, Estonia, Latvia, Lithuania, Denmark, and Poland. The company operates through
  Grocery Trade, Building and Technical Trade, and Car Trade divisions. The Grocery
  Trade division is involved in the wholesale and B2B trade of groceries, and retail
  of home and specialty goods under the K-retailer brand; offer online grocery services;
  and operates as a foodservice provider and wholesaler, as well as store retail chains
  under the K-Citymarket, K-Supermarket, K-Market, and Kespro. The Building and Technical
  Trade division engages in the wholesale, retail, and B2B trade of building and home
  improvement, and HEPAC and electrical products and services; and operates retail
  stores chain under the K-Rauta, K-Bygg, Byggmakker, and Davidsen, as well as serves
  technical trade customers under Onninen brand names. The Car Trade division is involved
  in the import, market, and retail of Volkswagen, Audi, SEAT, CUPRA, Bentley, and
  Porsche passenger cars, as well as Volkswagen commercial vehicles under K-Auto brand
  name; purchase and retail of used cars; operation of leasing business for private
  and corporate customers; and other services, including repair and maintenance, as
  well as sale of spare parts and accessories; charging network for electric vehicles
  under the K- Lataus name; and sports trade comprising Intersport and budget sport
  chains. Kesko Oyj was founded in 1940 and is headquartered in Helsinki, Finland.
