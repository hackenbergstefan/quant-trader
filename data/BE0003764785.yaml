longBusinessSummary: Ackermans & Van Haaren NV engages in marine engineering and contracting,
  private banking, real estate, energy and resources, and growth capital businesses
  worldwide. The Marine Engineering & Contracting segment engages in the marine construction
  activities, including dredging and civil works on water, as well as offshore activities
  in the areas of renewable energy, oil and gas, soil and sludge remediation, and
  aggregate and mineral extraction; real estate development, multitechnics, and construction
  and renovation activities; and development of port projects and related industrial
  zones, as well as offshore wind farms. The Private Banking segment offers discretionary
  asset management services for private clients; and specialized advisory banking
  services for entrepreneurs and liberal professionals, as well as financing and financial
  leasing services for cars, equipment, charging stations, and bicycles. The Real
  Estate segment develops mixed real estate projects, including redevelopment of iconic
  buildings and new constructions and residential, retail, and office properties.
  The Energy & Resources segment produces crude palm oil and bananas; offers hybrid
  palm oil seeds; and manufactures cement. The AvH & Growth Capital segment provides
  engineering and solutions in production process automation; validation and compliance
  services; compact biogas installation; specialty chemicals; and logistics services
  for rail, port and road transport, and intermodal transport, and warehousing. It
  also offers crop and food protection products and deals and leases commercial vehicles,
  as well as distributes aftermarket products. The company also develops medical devices
  and medicines for the treatment of cancer and genetic diseases. Ackermans & Van
  Haaren NV was founded in 1876 and is based in Antwerp, Belgium.
