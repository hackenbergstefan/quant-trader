longBusinessSummary: Stora Enso Oyj provides renewable solutions for the packaging,
  biomaterials, wooden constructions, and paper industries in Finland and internationally.
  It operates through Packaging Materials, Packaging Solutions, Biomaterials, Wood
  Products, Forest, and Other segments. The company's Packaging Materials segment
  offers virgin and recycled fiber replace fossil-based materials, renewable and recyclable
  packaging materials for food and beverage, and transport packaging. Its Packaging
  Solutions segment develops and sells fiber-based packaging products and services,
  including converting carton and corrugated boards for packaging solutions for retail,
  e-commerce, and industrials. The company's Biomaterials segment provides various
  pulp for packaging, paper, tissue, specialties, and hygiene products; and tall oil
  and turpentine from biomass. Its Wood Products segment offers wood-based solutions,
  including digital tools for design and construction of building projects with wood;
  applications for windows and doors; and pellets for sustainable heating solutions.
  The company's Forest segment engages in sustainable forest management, as well as
  supplies wood. The company's Other segment produces electricity and heat. It serves
  packaging manufacturers, brand owners, retailers, converters, and construction companies.
  The company was incorporated in 1996 and is headquartered in Helsinki, Finland.
