longBusinessSummary: Edwards Lifesciences Corporation provides products and technologies
  to treat advanced cardiovascular diseases in the United States, Europe, Japan, and
  internationally. It offers transcatheter heart valve replacement products for minimally
  invasive replacement of aortic heart valves under the Edwards SAPIEN family of valves
  system; and transcatheter heart valve repair and replacement products to treat mitral
  and tricuspid valve diseases under the PASCAL and EVOQUE brands. The company also
  provides surgical structural heart solutions, such as aortic surgical valve under
  the INSPIRIS brand name; INSPIRIS RESILIA aortic valve, which offers RESILIA tissue
  and VFit technology; KONECT RESILIA, a pre-assembled tissue valve conduit for complex
  combined procedures; and MITRIS RESILIA valve. It distributes its products through
  a direct sales force and independent distributors. Edwards Lifesciences Corporation
  was founded in 1958 and is headquartered in Irvine, California.
