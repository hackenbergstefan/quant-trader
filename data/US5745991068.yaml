longBusinessSummary: Masco Corporation provides home improvement and building products
  in North America, Europe, and internationally. The company's Plumbing Products segment
  offers faucets, showerheads, handheld showers, valves, bath hardware and accessories,
  bathing units, shower bases and enclosures, shower drains, steam shower systems,
  water filtration systems, and sinks and kitchen accessories; acrylic tubs, bath
  and shower enclosures, and shower bases and trays; spas, exercise pools, and aquatic
  fitness systems and saunas; brass, copper, and composite plumbing system component
  and other non-decorative plumbing products; water products; and thermoplastic products,
  extruded plastic profiles, and specialized fabrication products, as well as PEX
  tubing products. This segment provides its products under the DELTA, BRIZO, PEERLESS,
  HANSGROHE, AXOR, KRAUS, NEWPORT BRASS, GINGER, WALTEC, BRISTAN, HERITAGE, MIROLIN,
  HOT SPRING, CALDERA, FREEFLOW SPAS, FANTASY SPAS, AQUATERRA, LIFESMART, ENDLESS
  POOLS, TYLO, FINNLEO, HELO, BRASSCRAFT, PLUMBSHOP, and MASTER PLUMBER brands, as
  well as under private label to home center and online retailers, mass merchandisers,
  wholesalers and distributors, plumbers, building contractors, remodelers, smaller
  retailers, and consumers and homebuilders. Its Decorative Architectural Products
  segment offers paints, primers, specialty coatings, stains, and waterproofing products,
  as well as paint applicators and accessories; cabinet and door hardware, functional
  hardware, hook and hook rail products, and outdoor living hardware; and decorative
  bath hardware, shower accessories, and shower doors. This segment provides its products
  under the BEHR, KILZ, WHIZZ, LIBERTY, and FRANKLIN BRASS brands to home center and
  other retailers, mass and online retailers, other specialty retailers, and original
  equipment manufacturers and wholesalers. The company was incorporated in 1929 and
  is headquartered in Livonia, Michigan.
