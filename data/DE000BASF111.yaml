longBusinessSummary: 'BASF SE operates as a chemical company worldwide. It operates
  through six segments: Chemicals, Materials, Industrial Solutions, Surface Technologies,
  Nutrition & Care, and Agricultural Solutions. The Chemicals segment provides petrochemicals
  and intermediates. The Materials segment offers advanced materials and their precursors
  for applications and systems comprising isocyanates, polyamides, and inorganic basic
  products, as well as specialties for the plastics and plastics processing industries.
  The Industrial Solutions segment develops and markets ingredients and additives
  for industrial applications, such as polymer dispersions, resins, additives, chemical
  and refining catalysts, electronic materials, and antioxidants for automotive, petrochemical
  and petroleum processing, plastics and electronics, construction, electronics, paper
  coatings, and energy and resources industries. The Surface Technologies segment
  provides catalysts, battery materials, automotive OEM and refinish coatings, surface
  treatment, and precious and base metal services for the automotive and chemical
  industries. The Nutrition & Care segment offers ingredients for consumer applications
  in the areas of nutrition, home, and personal care applications; and serves the
  food and feed producers, pharmaceutical, cosmetics, detergents, and cleaner industries,
  as well as the consumer goods sector. The Agricultural Solutions segment provides
  seeds and traits, and seed treatment products; fungicides, herbicides, insecticides,
  and biological crop protection products; and digital solutions. The company engages
  in engineering and other; rental and leasing; and renewable energy trading, commodity
  trading activities. BASF SE was founded in 1865 and is headquartered in Ludwigshafen
  am Rhein, Germany.'
