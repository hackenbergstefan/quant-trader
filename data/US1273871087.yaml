longBusinessSummary: Cadence Design Systems, Inc. develops computational, AI-driven
  software, hardware, and silicon intellectual property products and solutions. The
  company offers functional verification services, such as Jasper, a formal verification
  platform; Xcelium, a parallel logic simulation platform; Verisium, a generative
  AI solution; Palladium, an enterprise emulation platform; and Protium, a prototyping
  platform for chip verification, as well as digital IC design and sign off products,
  including Innovus platform; and custom IC design and simulation product include
  Virtuoso, a platform to design and verify analog. It also provides Xcelium logic
  simulator and other front-end verification and virtual prototyping technologies;
  controllers and physical interfaces; PCI Express, universal accelerator and compute
  express links, and multiple memory interfaces; and Tensilica, a digital signal processor.
  In addition, the company's design IP portfolio includes serializer/deserializer,
  peripheral component interconnect, USB, and other standard protocols; and Secure-IC,
  a solution for embedded security IP. Additionally, it provides System Design and
  Analysis (SD&A) platform, a solution that enables end-to-end system-level design
  and verification across chips, packages, PCBs, and electronic systems; Allegro X
  and Orca X platforms for PCB and advanced packaging; Sigrity X for signal and power
  integrity; AIR for RF design; Fidelity for computational fluid dynamics; Celsius
  for thermal and airflow analysis; Clarity 3D solver for electromagnetic and power
  electronics analysis and simulation; Integrity 3D-IC solution for 3D-IC and multi-chiplet
  designs; the Optimality Intelligent System Explorer, Reality digital twin, and Millennium
  enterprise multiphasic platforms; Allegro system design platform; and molecular
  modeling and simulation solutions and services. The company has a strategic collaboration
  with NVIDIA. The company was incorporated in 1987 and is headquartered in San Jose,
  California.
