longBusinessSummary: "Enagás, S.A. engages in the transmission, storage, and regasification\
  \ of natural gas. It operates through Regulated Gas Activities, Regulated Activities\
  \ \x96 Hydrogen Infrastructure, New Businesses, and International segments. The\
  \ company provides gas transmission services through primary and secondary transmission\
  \ pipelines; and natural gas regasification services, as well as operates underground\
  \ storage facilities. It is also involved hydrogen infrastructure activities; and\
  \ non-regulated activities related to new energies, such as biomethane, ammonia,\
  \ and CO2. In addition, the company engages in the technical management of the gas\
  \ system; financial management; gas transmission; development of industrial projects\
  \ and activities relating to LNG terminals; development and implementation of facilities\
  \ for the supply of natural gas; provision of commercial services; designing, constructing,\
  \ operating, and maintaining hydrogen and other gas production facilities; and maritime\
  \ transport activities by managing merchant ships. The company was incorporated\
  \ in 1972 and is headquartered in Madrid, Spain."
