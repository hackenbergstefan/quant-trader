longBusinessSummary: 'Redeia Corporación, S.A., through with its subsidiaries, engages
  in the management of the Spanish electricity transport network in Spain and internationally.
  The company operates through three segments: Management and Operation of Domestic
  Electricity Infrastructure; Management and Operation of International Electricity
  Infrastructure; and Telecommunications. The company is involved in electricity transmission;
  system operation; and management of Spanish electricity transmission grid. It operates
  through a transmission network of approximately 46,074 kilometers and has 99,071
  MVA of transformation capacity. The company also provides advisory, engineering,
  and construction services; and telecommunications, financing, reinsurance, line
  and substation maintenance, radio spectrum, telecommunications networks and satellite
  communication, technical consultancy, and satellite telecommunications services.
  In addition, it operates and maintains electricity transmission networks; manages
  the construction of energy storage facilities and the water cycle; acquires, holds,
  manages, and administers equity securities; operates satellite communications system
  and provides space segment services for the geostationary orbital slots; develops
  and sells safety devices for personal and industrial use; and sells and leases satellites
  and spatial capacity, as well as sells and markets satellite capacity. The company
  was formerly known as Red Eléctrica Corporación, S.A. and changed its name to Redeia
  Corporación, S.A. in June 2023. Redeia Corporación, S.A. was incorporated in 1985
  and is based in Alcobendas, Spain.'
