longBusinessSummary: Legal & General Group Plc provides various insurance products
  and services in the United Kingdom, the United States, and internationally. It operates
  through Institutional Retirement, Asset Management, Insurance, and Retail Retirement
  segments. The Institutional Retirement segment offers annuity contracts with guaranteed
  income for a specified time; longevity insurance products; and writes assured payment
  policies (APP). The Asset Management segment provides unit linked institutional
  pensions, segregated investment management mandates, and collective investment schemes;
  index fund management; pooled and segregated active fixed income funds; active equity
  management; solutions for cash management requirements for institutional investors;
  solutions and liability driven investment; multi-asset funds; private markets strategies
  for physical real estate, private corporate debts, infrastructure debts, and real
  estate loans; and direct investment services. The Retail Retirement segment offers
  protection products, such as health, disability, critical illness, and accident;
  annuities; lifetime mortgages; lifetime care plans; retirement interest only mortgages;
  and workplace and retail savings scheme that provides corporate pension scheme solutions.
  Legal & General Group Plc was founded in 1836 and is headquartered in London, the
  United Kingdom.
