longBusinessSummary: United Rentals, Inc., through its subsidiaries, operates as an
  equipment rental company in the United States, Canada, Europe, Australia, and New
  Zealand. It operates through two segments, General Rentals and Specialty. The General
  Rentals segment rents general construction and industrial equipment, such as backhoes,
  skid-steer loaders, forklifts, earthmoving equipment, and material handling equipment;
  aerial work platforms, including boom and scissor lifts; and general tools and light
  equipment comprising pressure washers, water pumps, and power tools for construction
  and industrial companies, manufacturers, utilities, municipalities, homeowners,
  and government entities. The specialty segment rents trench safety equipment consists
  of trench shields, aluminum hydraulic shoring systems, slide rails, crossing plates,
  construction lasers, and line testing equipment for underground work; power and
  heating, ventilating, and air conditioning equipment, such as portable diesel generators,
  electrical distribution equipment, and temperature control equipment; fluid solutions
  equipment for fluid containment, transfer, and treatment; surface protection mats;
  and mobile storage equipment and modular office space. This segment serves construction
  companies involved in infrastructure projects, and municipalities and industrial
  companies. The company also sells aerial lifts, reach forklifts, telehandlers, compressors,
  and generators; construction consumables, tools, small equipment, and safety supplies;
  and parts for equipment that is owned by its customers, as well as provides repair
  and maintenance services. It sells used equipment through its sales force, brokers,
  website, at auctions, and directly to manufacturers. United Rentals, Inc. was incorporated
  in 1997 and is headquartered in Stamford, Connecticut.
