longBusinessSummary: 'Pentair plc provides various water solutions in the United States,
  Western Europe, China, Latin America, the Middle East, Southeast Asia, Australia,
  and Canada. It operates through three segments: Flow, Water Solutions, and Pool.
  The Flow segment designs, manufactures, and sells fluid treatment and pump products
  and systems, including pressure vessels, gas recovery solutions, membrane bioreactors,
  wastewater reuse systems and advanced membrane filtration, separation systems, specialty
  insertion valves, water disposal pumps, water supply pumps, fluid transfer pumps,
  turbine pumps, solid handling pumps, and agricultural spray nozzles. This segment
  provides products under Pentair Flow, Aurora, Berkeley, Codeline, Fairbanks-Nijhuis,
  Haffmans, Hydromatic, Hypro, Jung Pumpen, Myers, Sta-Rite, Shurflo, Südmo, and X-Flow
  brand names. The Water Solutions segment offers commercial and residential water
  treatment products and systems, such as pressure tanks, control valves, activated
  carbon products, commercial ice machines, conventional filtration products, and
  point-of-entry and point-of-use water treatment systems for use in water filtration
  and water softening solutions, as well as commercial water management and filtration
  solutions in foodservice operations; and installation and preventative services
  for water management solutions for commercial operators under the Pentair Water
  Solutions, Everpure, Fleck, Manitowoc Ice, Pentek, and RainSoft brands. The Pool
  segment provides residential and commercial pool equipment and accessories, including
  pumps, filters, heaters, lights, automatic controls and cleaners, chlorinators,
  maintenance equipment, and pool accessories for residential and commercial pool
  maintenance, pool repair, renovation, service, construction, and aquaculture solutions.
  This segment offers products under the Pentair Pool, Kreepy Krauly, Pleatco, and
  Sta-Rite brands. Pentair plc was founded in 1966 and is headquartered in London,
  the United Kingdom.'
