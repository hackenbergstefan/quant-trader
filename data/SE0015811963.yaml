longBusinessSummary: Investor AB (publ) is a private equity firm specializing in mature,
  middle market, buyouts and growth capital investments. For core investments, the
  firm invests in health care, financial services, IT and fintech sectors, life sciences,
  mathematics, data, materials science, AI, quantum technology and considers investments
  in listed companies in leading minority positions. The firm seeks to invest globally.
  For its operating investments, the firm seeks to focus on medium-sized to large
  companies headquartered in Northern Europe. It prefers to invests in North Africa,
  Sub-Saharan Africa, Asia-Pacific, Channel Island, Greenland, The Faroe Islands,
  Finland, Iceland, Ireland, Jan Mayen, Svalbard, Sweden, Isle of Man, Estonia, Latvia,
  Lithuania, Great Lakes, Mountain, Latin America and Caribbean region. It seeks to
  invest between $200 million and $700 million. The firm considers majority or minority
  investments in both listed and unlisted companies. It acquires controlling interest
  or minority position with significant influence in its portfolio companies within
  operating investments. For financial investments, it acquires minority ownership
  in financial holdings for shorter horizon. The firm seeks to exit its private equity
  investments between three years and seven years. The firm seeks to take board membership
  in its portfolio companies. Investor AB (publ) was founded in 1916 and is based
  in Stockholm, Sweden.
