longBusinessSummary: Bio-Techne Corporation, together with its subsidiaries, develops,
  manufactures, and sells life science reagents, instruments, and services for the
  research, diagnostics, and bioprocessing markets worldwide. It operates through
  two segments, Protein Sciences, and Diagnostics and Spatial Biology. The Protein
  Sciences segment develops and manufactures biological reagents used in various aspects
  of life science research, diagnostics, and cell and gene therapy, such as cytokines
  and growth factors, antibodies, small molecules, tissue culture sera, and cell selection
  technologies. This segment also offers proteomic analytical tools for automated
  western blot and multiplexed ELISA workflow consists of manual and automated protein
  analysis instruments and immunoassays for use in quantifying proteins in various
  biological fluids. Its Diagnostics and Genomics segment develops and manufactures
  diagnostic products, including controls, calibrators, and diagnostic assays for
  regulated diagnostics market, advanced tissue-based in-situ hybridization assays
  for spatial genomic and tissue biopsy analysis, and genetic and oncology kits for
  research and clinical applications; and sells products for genetic carrier screening,
  oncology diagnostics, molecular controls, and research, as well as instruments and
  process control products for hematology, blood chemistry and gases, and coagulation
  controls and reagents used in various diagnostic applications. The company was formerly
  known as Techne Corporation and changed its name to Bio-Techne Corporation in November
  2014. Bio-Techne Corporation was incorporated in 1976 and is headquartered in Minneapolis,
  Minnesota.
