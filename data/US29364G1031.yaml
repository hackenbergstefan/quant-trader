longBusinessSummary: Entergy Corporation, together with its subsidiaries, engages
  in the production and retail distribution of electricity in the United States. It
  generates, transmits, distributes, and sells electric power in portions of Arkansas,
  Louisiana, Mississippi, and Texas, including the City of New Orleans. It also engages
  in the ownership of interests in non-nuclear power plants that sell electric power
  to wholesale customers, as well as provides decommissioning services to other nuclear
  power plant owners. It generates electricity through gas, nuclear, coal, hydro,
  and solar power sources. The company sells energy to retail power providers, utilities,
  electric power co-operatives, power trading organizations, and other power generation
  companies. The company's power plants have approximately 25,000 megawatts of electric
  generating capacity. It delivers electricity to 3.1 million utility customers in
  Arkansas, Louisiana, Mississippi, and Texas. Entergy Corporation was founded in
  1913 and is headquartered in New Orleans, Louisiana.
