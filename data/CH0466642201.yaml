longBusinessSummary: Helvetia Baloise Holding AG engages in life and non-life insurance,
  and reinsurance business. It offers life insurance products in the areas of investment-linked,
  group life, and traditional individual life others; non-life insurance products
  in the areas of property, motor vehicle, health/accident, liability, engineering,
  and transport; and pure risk, savings, endowment, and annuity insurance products,
  as well as pension plans and asset management services. The company also provides
  marine, aviation, and art insurance. It operates in Switzerland, Spain, Germany,
  Belgium, Luxembourg, Italian and Austrian Markets, France, and internationally The
  company was formerly known as Helvetia Holding AG and changed its name to Helvetia
  Baloise Holding AG in April 2022. Helvetia Baloise Holding AG was incorporated in
  2017 and is headquartered in Basel, Switzerland.
