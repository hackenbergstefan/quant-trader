longBusinessSummary: KGHM Polska Miedz S.A. engages in the exploration and mining
  of copper, nickel, precious metals, and non-ferrous metals in Poland and internationally.
  The company offers copper cathodes, wire rod, Cu - Ofe wire, Cu - Ag wire, and granules;
  silver and gold; molybdenum; rhenium; nickel; and lead, sulphuric acid, copper and
  nickel sulphate, and selenium products, as well as platinum, palladium, and rock
  salt products. It holds a portfolio of mines located in Europe, Asia, Australia,
  Africa, and the United States. The company was founded in 1961 and is headquartered
  in Lubin, Poland.
