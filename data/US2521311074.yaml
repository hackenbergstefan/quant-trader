longBusinessSummary: DexCom, Inc., a medical device company, focuses on the design,
  development, and commercialization of continuous glucose monitoring (CGM) systems
  for the management of diabetes and metabolic health in the United States and internationally.
  The company offers Dexcom G7 and G7 15 Day, an integrated continuous glucose monitoring
  system; Dexcom G6, a CGM system; Dexcom ONE+ to replace fingerstick blood glucose
  testing for diabetes treatment decisions; Stelo, a biosensor designed for adults
  with prediabetes and Type 2 diabetes who do not use insulin; Dexcom Share, a remote
  monitoring system; and Dexcom Follow application. It markets its products directly
  to endocrinologists, physicians, and diabetes educators. The company was incorporated
  in 1999 and is headquartered in San Diego, California.
