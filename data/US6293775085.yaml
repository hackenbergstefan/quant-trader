longBusinessSummary: NRG Energy, Inc., together with its subsidiaries, operates as
  an energy and home services company in the United States and Canada. It operates
  through the Texas, East, West/Other, Vivint Smart Home, and Corporate Activities
  segments. The company offers retail electricity, energy management, demand response
  and virtual power plant programs, carbon offsets, smart home security, and automation
  services. It also offers system power, distributed and backup generation, energy
  storage, energy management, renewable and low-carbon products, and carbon management
  solutions for large business and commercial customers; a cloud-based home platform,
  including hardware, software, sales, installation, customer service, technical support,
  and professional monitoring solutions; and generation portfolio includes fossil
  fuel and renewable generation assets diversified by fuel type and dispatch level,
  with ongoing development of new natural gas and renewable projects. In addition,
  the company trades in power, natural gas, and related products; environmental products;
  weather products; and financial products, including forwards, futures, options,
  and swaps. It offers its products and services under the NRG, Reliant, Direct Energy,
  Green Mountain Energy, and Vivint. It serves residential, commercial, government,
  industrial, data center, and wholesale customers. NRG Energy, Inc. was founded in
  1989 and is headquartered in Houston, Texas.
