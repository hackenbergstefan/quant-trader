longBusinessSummary: Lowe's Companies, Inc., together with its subsidiaries, operates
  as a home improvement retailer in the United States and Canada. It provides a line
  of products for construction, maintenance, repair, remodeling, and decorating. The
  company also offers home improvement products, such as appliances, seasonal and
  outdoor living, lumber, lawn and garden, kitchens and bath, hardware, building materials,
  millwork, paint, rough plumbing, tools, electrical, flooring, and décor. In addition,
  it provides installation services through independent contractors in various product
  categories; and extended protection plans and repair services. Further, the company
  provides design, distribution, and installation services for interior surface finishes
  to home builders and property managers. It sells its national brand-name merchandise
  and private brand products to professional customers, individual homeowners, and
  renters. The company serves its products through Lowes.com website, mobile applications,
  retail home improvement stores and outlet stores, and its branches. Lowe's Companies,
  Inc. was founded in 1921 and is based in Mooresville, North Carolina.
