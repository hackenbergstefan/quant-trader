longBusinessSummary: Truist Financial Corporation, a financial services company, provides
  banking and trust services in the Southeastern and Mid-Atlantic United States. The
  company operates through two segments, Consumer and Small Business Banking; and
  Wholesale Banking. Its deposit products include noninterest-bearing checking, interest-bearing
  checking, savings, and money market deposit accounts, as well as certificates of
  deposit and individual retirement accounts. The company also provides funding; asset
  management; credit card lending; home equity and mortgage lending; other direct
  retail lending; home mortgage lending; Investment brokerage services; mobile/online
  banking; payment solutions; point-of-sale lending; retail and small business deposit
  products; and small business lending. In addition, it offers asset-based lending,
  commercial deposit and treasury services; commercial lending; floor plan lending;
  derivatives; institutional trust services; insurance premium finance; international
  banking; investment banking and capital markets services; leasing; merchant services;
  mortgage warehouse lending; real estate lending; supply chain financing; and wealth
  management/private banking. The company was formerly known as BB&T Corporation and
  changed its name to Truist Financial Corporation in December 2019. Truist Financial
  Corporation was founded in 1872 and is headquartered in Charlotte, North Carolina.
