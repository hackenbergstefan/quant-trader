longBusinessSummary: Continental Aktiengesellschaft manufactures tire and develops
  and produces solutions for automotive manufacturers, industrial, and end customers
  worldwide. It provides tires for cars, trucks, buses, two-wheel, and specialist
  vehicles, as well as digital tire monitoring and management systems; and engages
  in the retail of tires. The company also develops solutions for industrial applications
  made from rubber, metal, and textiles; hoses, conveyor belts, air springs, and drive
  belts; and surface materials for energy, mining, agriculture, construction, as well
  as interior and exterior design, and automotive sectors. The company was formerly
  known as Continental-Caoutchouc- und Gutta-Percha Compagnie. Continental Aktiengesellschaft
  was founded in 1871 and is headquartered in Hanover, Germany.
