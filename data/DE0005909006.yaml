longBusinessSummary: 'Bilfinger SE provides industrial services to customers in the
  process industry primarily in Europe, North America, and the Middle East. It operates
  through three segments: Engineering & Maintenance Europe; Engineering & Maintenance
  International; and Technologies. The company offers engineering, project, maintenance,
  turnaround, rotating equipment, inspection, insulation, scaffolding, corrosion protection,
  mechanical, electrical, instrumentation, control, digital services, and decommissioning
  of nuclear power plants. It also provides services in the field of nuclear energy,
  battery production, district heating and waste heat, hydropower, waste recycling
  and wastewater treatment, hydrogen, carbon capture and storage, wind power, biogas,
  and environmental tech. In addition, the company offers consulting and engineering;
  prefabrication and installation; and access and insulation services, as well as
  maintenance, engineering, extension, new construction, and operation of industrial
  plants. The company serves customers in energy, chemicals and petrochemicals, pharma
  and biopharma, and oil and gas industries. Bilfinger SE was founded in 1880 and
  is headquartered in Mannheim, Germany.'
