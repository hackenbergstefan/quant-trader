longBusinessSummary: 'American International Group, Inc. provides insurance products
  for commercial, institutional, and individual customers in North America and internationally.
  It operates through three segments: North America Commercial, International Commercial,
  and Global Personal. The company offers commercial and industrial property insurance,
  including business interruption and package insurance that cover exposure to made
  and natural disasters; general liability, environmental, commercial automobile liability,
  workers'' compensation, excess casualty, and crisis management insurance products;
  risk-sharing and other customized structured programs for large corporate and multinational
  customers; professional liability insurance; and marine, energy-related property
  insurance products, aviation, political risk, trade credit, and trade finance products.
  It also provides group personal accident and business travel products for employees,
  associations, and other organizations; voluntary and sponsor-paid personal accident
  and supplemental health products for individuals; and personal auto and homeowners
  in selected markets, comprehensive extended warranty, device protection insurance,
  home warranty and related services, and insurance for high net-worth individuals.
  In addition, the company offers mortgage and other loans receivable, such as commercial
  mortgages, life insurance policy loans, commercial loans, and other loans and notes
  receivable. American International Group, Inc. was founded in 1919 and is headquartered
  in New York, New York.'
