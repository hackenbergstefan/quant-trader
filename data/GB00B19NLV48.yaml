longBusinessSummary: 'Experian plc, together with its subsidiaries, operates as a
  data and technology company in North America, Latin America, the United Kingdom,
  Ireland, Europe, the Middle East, Africa, and the Asia Pacific. It operates through
  two segments: Business-to-Business and Consumer Services. The company provides data,
  software, and AI-enabled analytics integrate directly into client workflows to support
  decisioning, risk management, fraud prevention and customer engagement at scale;
  credit information, affordability insights, identity protection and personalized
  offers. It serves its customers in financial service, health, automotive, and marketing
  services. The company was formerly known as Experian Group Limited and changed its
  name to Experian plc in July 2008. Experian plc was founded in 1826 and is headquartered
  in Dublin, Ireland.'
