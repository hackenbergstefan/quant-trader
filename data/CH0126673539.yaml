longBusinessSummary: 'DKSH Holding AG provides various market expansion services in
  Thailand, Greater China, Malaysia, Singapore, rest of the Asia Pacific, and internationally.
  The company offers sourcing, market insights, marketing, sales, e-Commerce, distribution,
  logistics, and after sales services. It operates through four segments: Healthcare,
  Consumer Goods, Performance Materials, and Technology. The Healthcare segment provides
  various services, such as registration, regulatory, market entry studies, importation,
  customs clearance, marketing and sales, physical distribution, invoicing, and cash
  collection services for pharmaceuticals, consumer health, and over-the-counter health
  products, as well as medical devices. The Consumer Goods segment offers a range
  of services, including product feasibility studies, registration, importation, customs
  clearance, marketing and merchandising, sales, warehousing, physical distribution,
  invoicing, cash collection, and after-sales services for fast moving consumer goods,
  food services, luxury goods, and lifestyle products, as well as hair and skin cosmetics.
  The Performance Materials segment sources, markets, and distributes a range of specialty
  chemicals and ingredients for the pharmaceutical, personal care, food and beverage,
  and industrial applications, as well as provides market expansion services for performance
  materials. The Technology segment offers market expansion services comprising a
  range of capital investment goods and analytical instruments in the areas of infrastructure,
  industrial materials and supplies, precision and textile machinery, semiconductors,
  photovoltaic and electronics, agriculture, and hospitality, as well as specialized
  industrial applications. The company was founded in 1865 and is based in Zurich,
  Switzerland.'
