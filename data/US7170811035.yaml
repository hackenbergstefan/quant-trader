longBusinessSummary: 'Pfizer Inc. discovers, develops, manufactures, markets, distributes,
  and sells biopharmaceutical products in the United States and internationally. It
  operates in three segments: Biopharma, PC1, and Pfizer Ignite. The company offers
  internal medicine products, including cardiovascular metabolic diseases products
  under the Eliquis brand; migraine products under the Nurtec ODT/Vydura and Zavzpret
  brand; vaccines under the Prevnar family, Abrysvo, Nimenrix, FSME/IMMUN-TicoVac,
  and Trumenba brands; and Paxlovid for the treatment of COVID-19. It also provides
  inflammation and immunology products, such as Xeljanz, Enbrel, Cibinqo, Litfulo,
  Eucrisa, and Velsipity; rare disease products for therapeutic areas comprising amyloidosis,
  hemophilia, and endocrine diseases under the Vyndaqel family, Genotropin, BeneFIX,
  Xyntha, Somavert, Ngenla, and Hympavzi brands; and anti-infective and immunoglobulin
  medicines under the Zavicefta, Octagam, and Panzyga brands. In addition, the company
  offers oncology products comprising ADCs, small molecules, bispecific, and other
  immunotherapies for the treatment of cancers, including breast cancer, genitourinary
  cancer, and hematologic malignancies, as well as melanoma, gastrointestinal, gynecological,
  and lung cancer under the Ibrance, Xtandi, Padcev, Adcetris, Inlyta, Lorbrena, Bosulif,
  Tukysa, Braftovi, Mektovi, Orgovyx, Elrexfio, Tivdak, and Talzenna brands. Further,
  it provides biosimilars under the Inflectra brand; oncology biosimilars comprising
  Retacrit, Ruxience, Zirabev, Trazimera and Nivestym, and other biosimilars; and
  sterile injectables, such as Sulperazon, Atgam, Fragmin, Solu Medrol, Solu Cortef,
  and Bicillin. The company has collaboration agreements with Bristol-Myers Squibb
  Company; Astellas Pharma US, Inc.; Merck KGaA; and BioNTech SE, as well as a strategic
  collaboration with Boltz, PBC to develop and deploy biomolecular AI foundation models.
  Pfizer Inc. was founded in 1849 and is headquartered in New York, New York.'
