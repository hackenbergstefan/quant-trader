longBusinessSummary: Simon Property Group, Inc. is a self-administered and self-managed
  real estate investment trust (REIT). Simon Property Group, L.P., or the Operating
  Partnership, is our majority-owned partnership subsidiary that owns all of our real
  estate properties and other assets. In this package, the terms Simon, we, our, or
  the Company refer to Simon Property Group, Inc., the Operating Partnership, and
  its subsidiaries. We own, develop and manage premier shopping, dining, entertainment
  and mixed-use destinations, which consist primarily of malls, Premium Outlets, The
  Mills, and International Properties. At December 31, 2024, we owned or had an interest
  in 229 properties comprising 183 million square feet in North America, Asia and
  Europe. We also owned an 88% interest in The Taubman Realty Group, or TRG, which
  owns 22 regional, super-regional, and outlet malls in the U.S. and Asia. Additionally,
  at December 31, 2024, we had a 22.4% ownership interest in Klepierre, a publicly
  traded, Paris-based real estate company, which owns shopping centers in 14 European
  countries. Simon Property Group, Inc. was incorporated in 1960 and is based in Indianapolis,
  Indiana.
