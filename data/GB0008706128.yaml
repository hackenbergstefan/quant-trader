longBusinessSummary: 'Lloyds Banking Group plc, together with its subsidiaries, provides
  a range of banking and financial products and services for retail and commercial
  customers in the United Kingdom. It operates in three segments: Retail; Commercial
  Banking; and Insurance, Pensions and Investments. The Retail segment offers a range
  of financial service products, including current accounts, savings, mortgages, credit
  cards, unsecured loans, motor finance, and leasing solutions to personal customers.
  Its Commercial Banking segment provides lending, transactional banking, working
  capital management, debt financing, and risk management services to small and medium
  businesses, corporates, and institutions. The Insurance, Pensions and Investments
  segment offers insurance, investment, and pension management products and services.
  It also provides life assurance; and digital banking services. The company offers
  its products and services under the Lloyds Bank, Halifax, Bank of Scotland, Scottish
  Widows, MBNA, Schroders Personal Wealth, Black Horse, Lex Autolease, Birmingham
  Midshires, LDC, AMC, Embark Group, Lloyds Living, Cavendish Online, Tusker, and
  HGP brands. The company was formerly known as Lloyds TSB Group plc and changed its
  name to Lloyds Banking Group plc in January 2009. Lloyds Banking Group plc was founded
  in 1695 and is headquartered in London, the United Kingdom.'
