longBusinessSummary: 'Jabil Inc. provides engineering, manufacturing, and supply chain
  solutions worldwide. It operates in three segments: Regulated Industries, Intelligent
  Infrastructure, and Connected Living and Digital Commerce. The company offers electronic
  hardware, and embedded software design services for analog, digital, radio frequency,
  power, sensor, and optical component applications; creates, develops, and connects
  concepts and specifications that optimize the function, value, and appearance of
  products for both consumers and manufacturing partners; design of plastic and metal
  components, enclosures, sub-assemblies, and systems, with advanced modeling and
  analysis of electronic, electro-mechanical, and optical assemblies; detail design,
  environmental applications, thermal and tooling management; develop solutions for
  virtual and/or augmented reality, light detection and ranging, 3D sensing, projection,
  and imaging; delivering PCBA design with CAD tools; and electrical and mechanical
  assemblies. The company also offers cloud data center server platforms; medical
  and consumer health devices; automotive assemblies; a digital commerce ecosystem;
  and smart controls and security for digital building and utilities. In addition,
  the company offers systems assembly, test, direct-order fulfillment, and configure-to-order
  services. It serves automotive and transportation, building infrastructure, consumer,
  data center, defense and aerospace, digital commerce and robotics, energy, healthcare,
  public safety and surveillance, semiconductor capital equipment, telecommunications,
  photonics industries. Jabil Inc. was formerly known as Jabil Circuit, Inc. and changed
  its name to Jabil Inc. in June 2017. The company was founded in 1966 and is based
  in Saint Petersburg, Florida.'
