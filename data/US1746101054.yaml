longBusinessSummary: Citizens Financial Group, Inc. operates as the bank holding company
  that provides retail and commercial banking products and services to individuals,
  small businesses, middle-market companies, large corporations, and institutions
  in the United States. The company operates through two segments, Consumer Banking
  and Commercial Banking. The Consumer Banking segment offers deposit products, mortgage
  and home equity lending products, credit cards, business loans, and wealth management
  services; and education and point-of-sale finance loans, as well as digital deposit
  products. This segment serves its customers through telephone service centers, as
  well as through its online and mobile platforms. The Commercial Banking segment
  provides various financial products and solutions, including lending and leasing,
  deposit and treasury management services, foreign exchange, and interest rate and
  commodity risk management solutions, as well as syndicated loans, corporate finance,
  mergers and acquisitions, and debt and equity capital markets services. The company
  serves customers and small businesses, high- and ultra-high-net-worth individuals
  and families, as well as investors, entrepreneurs, and companies and institutions,
  as well as multifamily, office, industrial, retail, healthcare, and hospitality
  sectors. The company was formerly known as RBS Citizens Financial Group, Inc. and
  changed its name to Citizens Financial Group, Inc. in April 2014. Citizens Financial
  Group, Inc. was founded in 1828 and is headquartered in Providence, Rhode Island.
