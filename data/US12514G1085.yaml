longBusinessSummary: 'CDW Corporation provides information technology (IT) solutions
  in the United States, the United Kingdom, and Canada. It operates through three
  segments: Commercial, Government, and Education. The company offers discrete hardware
  and software products and services, as well as integrated IT solutions, including
  on-premise and cloud capabilities across hybrid infrastructure, digital experience,
  and security. It also provides hardware products comprising notebooks/mobile devices,
  tablets, network communications, collaboration hardware, data storage and servers,
  desktop computers, and other hardware; and software products, such as cloud solutions,
  software assurance, application suites, security, virtualization, collaboration
  and productivity applications, operating systems, and network management. In addition,
  the company offers advisory and design, software development, implementation, and
  managed services, as well as warranties. It serves business, government, education,
  and healthcare customers. The company was formerly known as CDW Computer Centers,
  Inc. and changed its name to CDW Corporation in June 2003. CDW Corporation was founded
  in 1984 and is based in Vernon Hills, Illinois.'
