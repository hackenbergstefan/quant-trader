longBusinessSummary: 'Duke Energy Corporation, through its subsidiaries, operates
  as an energy company in the United States. The company operates through two segments:
  Electric Utilities and Infrastructure (EU&I); and Gas Utilities and Infrastructure
  (GU&I). The EU&I segment generates, transmits, distributes, and sells electricity
  to customers in the Southeast and Midwest regions. It generates electricity through
  coal, hydroelectric, natural gas, oil, renewables, and nuclear fuel. This segment
  also engages in the wholesale of electricity to municipalities, electric cooperative
  utilities, and other load-serving entities. The GU&I segment distributes natural
  gas to customers in the residential, commercial, industrial, and power generation
  natural gas sectors; and invests in pipeline transmission projects, renewable natural
  gas projects, and natural gas storage facilities. The company was formerly known
  as Duke Energy Holding Corp. and changed its name to Duke Energy Corporation in
  April 2006. Duke Energy Corporation was founded in 1904 and is headquartered in
  Charlotte, North Carolina.'
