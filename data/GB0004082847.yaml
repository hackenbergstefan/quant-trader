longBusinessSummary: 'Standard Chartered PLC, together with its subsidiaries, provides
  various banking products and services in Asia, Africa, the Middle East, Europe,
  and the Americas. The company operates in three segments: Corporate & Investment
  Banking, Wealth & Retail Banking, and Ventures. It offers retail products, such
  as deposits, mortgages, credit cards, and personal loans; wealth management products
  and services that include investments, portfolio management, bancassurance, and
  wealth advice; and transaction banking services, such as cash management, working
  capital, trade financing, securities and prime services, and payments and liquidity
  products. The company also provides mergers and acquisitions, leveraged and acquisition
  finance, infrastructure and development finance, fund finance, and transportation
  and sustainable finance solutions. In addition, it offers international banking,
  private banking, priority banking, wealth solutions, financing for SMEs, and Islamic
  banking products. Further, the company provides financial markets products and services
  that comprise financing and investment ideas; risk management and investment solutions;
  foreign exchange, rates, credit, and structured products; capital raising solutions;
  and sales and structuring, as well as digital banking solutions. It serves financial
  institutions, governments, banks, investors, corporations, small to medium-sized
  businesses, and individuals. Standard Chartered PLC was founded in 1853 and is headquartered
  in London, the United Kingdom.'
