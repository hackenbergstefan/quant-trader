longBusinessSummary: Logitech International S.A., through its subsidiaries, designs,
  manufactures, and markets software-enabled hardware solutions that connect people
  to working, creating, and gaming worldwide. The company offers products for gamers
  and streamers, including mice, steering wheels, headsets, keyboards, console gaming
  headsets, microphones, and streaming services; corded and cordless keyboards and
  keyboard-and-mouse combinations; pointing devices, such as wireless mouse; conference
  room cameras, such as ConferenceCams; controllers for video conferencing room solutions;
  webcams, including streaming cameras; tablet accessories that includes tablet keyboards;
  headsets, including in-ear headphones and premium wireless earbuds; and mobile speakers
  and PC speakers, as well as portable wireless Bluetooth speakers. It sells its products
  to retailers, large and small businesses, end consumers, and e-tailers who resell
  to retailers, value-added resellers, systems integrators, and other distributors.
  The company sells its products under the Logitech and Logitech G brand names. Logitech
  International S.A. was incorporated in 1981 and is headquartered in Lausanne, Switzerland.
