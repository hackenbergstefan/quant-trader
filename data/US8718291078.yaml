longBusinessSummary: Sysco Corporation, through its subsidiaries, engages in the sale,
  marketing, and distribution of food and related products to restaurants, healthcare
  and educational facilities, lodging establishments, and other foodservice customers.
  It operates through U.S. Foodservice Operations, International Foodservice Operations,
  SYGMA, and Other segments. The company distributes frozen food, such as meats, seafood,
  fully prepared entrées, fruits, vegetables, and desserts; canned and dry food; fresh
  meats and seafood; dairy and beverage products; imported specialties; and fresh
  produce. It also supplies paper products, including disposable napkins, plates,
  and cups; tableware comprising glassware and silverware; cookware consisting of
  pots, pans, and utensils; restaurant and kitchen equipment and supplies; and cleaning
  supplies. The company operates in the United States, Canada, the United Kingdom,
  France, Sweden, and internationally. Sysco Corporation was incorporated in 1969
  and is headquartered in Houston, Texas.
