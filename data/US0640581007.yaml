longBusinessSummary: The Bank of New York Mellon Corporation provides a range of financial
  products and services in the United States and internationally. It operates through
  Securities Services, Market and Wealth Services, Investment and Wealth Management,
  and Other segments. The Securities Services segment offers custody, trust and depositary,
  accounting, exchange-traded funds, middle-office solutions, transfer agency, services
  for private equity and real estate funds, foreign exchange, securities lending,
  liquidity/lending services, and data analytics. This segment also provides trustee,
  paying agency, fiduciary, escrow and other financial, issuer, and support services
  for brokers and investors. The Market and Wealth Services segment offers clearing
  and custody, investment, wealth and retirement solutions, technology and enterprise
  data management, trading, and prime brokerage services. This segment also provides
  integrated cash management solutions, including payments, foreign exchange, liquidity
  management, receivables processing, payables management, and trade finance, as well
  as U.S. government and global clearing, and tri-party services. The Investment and
  Wealth Management segment offers investment management strategies, investment products
  distribution, investment management, custody, wealth and estate planning, private
  banking, investment, and information management services. The Other segment provides
  corporate treasury, derivative and other trading, corporate and bank-owned life
  insurance, tax credit investment, other corporate investment, and business exit
  services. The company serves central banks and sovereigns, financial institutions,
  asset managers, insurance companies, corporations, local authorities and high net-worth
  individuals, and family offices. The Bank of New York Mellon Corporation was founded
  in 1784 and is headquartered in New York, New York.
