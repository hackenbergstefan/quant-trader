longBusinessSummary: 'BAE Systems plc provides defense, aerospace, and security solutions
  in the United States, the United Kingdom, the Middle East, Australia, Kingdom of
  Saudi Arabia, Europe, and internationally. The company operates through five segments:
  Electronic Systems, Platforms & Services, Air, Maritime, and Cyber & Intelligence.
  The Electronic Systems segment offers electronic warfare systems, navigation systems,
  electro-optical sensors, military and commercial avionics, and precision guided
  solutions and communications systems, as well as space electronics, spacecraft,
  and ground and tactical systems. The Platforms & Services segment manufactures and
  sells combat vehicles, weapons, and munitions; and offers naval ship repair services,
  as well as operates and manages two government-owned and contractor-operated ammunition
  plants. The Air segment develops future combat air systems and falconworks alongside
  edgewing, and eurofighter and MBDA. The Maritime segment provides maritime and land
  services, including submarine, ship build, and support programs. The Cyber & Intelligence
  segment offers cyber security services for national security, central government,
  and government enterprises. The company was formerly known as British Aerospace
  plc and changed its name to BAE Systems plc in May 2000. BAE Systems plc was incorporated
  in 1979 and is headquartered in London, the United Kingdom.'
