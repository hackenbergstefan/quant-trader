longBusinessSummary: Convatec Group PLC engages in the development, manufacturing,
  and sale of medical products, services and technologies for the management of chronic
  conditions in Europe, North America, and internationally. The company offers advanced
  wound care products for the management of acute and chronic wounds resulting from
  various conditions, such as diabetes, and acute conditions resulting from traumatic
  injury and burns. It also provides ostomy care solutions, including devices, accessories,
  and services for people with a stoma resulting from colorectal cancer, bladder cancer,
  inflammatory bowel disease, and trauma. In addition, the company offers continence
  care products and services for people with urinary continence issues related to
  spinal cord injuries, neurological disease, prostate enlargement or other causes.
  Further, it provides infusion care solutions comprising disposable infusion sets
  for diabetes insulin pumps, or for use in continuous infusion treatments for conditions
  such as Parkinson's disease. The company sells its products to pharmacies, hospitals,
  and other acute and post-acute healthcare service providers directly or through
  distributors and wholesalers. It serves a range of customers, including healthcare
  providers, patients, and manufacturers. Convatec Group PLC was founded in 1978 and
  is headquartered in London, the United Kingdom.
