longBusinessSummary: Bank of Ireland Group plc provides banking and other financial
  services in the Republic of Ireland, the United Kingdom, and internationally. It
  offers current and savings accounts, demand and notice accounts, and business accounts
  and deposits; personal, car, home improvement and energy upgrade, top-up loans,
  and student loans, as well as overdrafts and mortgages; and business and farming
  loans, green business, insurance premium finance, invoice finance, hire purchase,
  and leasing services. The company also provides international payments and credit
  cards; international money transfer services; investment products; premier and private
  banking services; and business protection, mortgage protection, income protection,
  home protection, and protection for individuals and families. In addition, it provides
  home, car, travel, and life insurance products. It offers its products and services
  through its bank branches, banking app, and online and phone banking channels. Bank
  of Ireland Group plc was founded in 1783 and is headquartered in Dublin, Ireland.
