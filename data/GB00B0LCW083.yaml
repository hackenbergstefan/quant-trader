longBusinessSummary: 'Hikma Pharmaceuticals PLC develops, manufactures, markets, and
  sells a range of generic, specialty, and branded pharmaceutical products. The company
  operates through three segments: Injectables, Hikma Rx, and Branded. The Injectables
  segment provides generic and specialty injectable products primarily for use in
  hospitals. The Branded segment offers branded generics and in-licensed products
  to retail and hospital markets. The Hikma Rx segment offers oral, respiratory, and
  other generic and specialty products for the retail market. It provides its products
  in various therapeutic areas, including respiratory, oncology, and pain management.
  The company also offers its products in solid, semi-solid, liquid, and injectable
  dosage forms. It operates in the United Kingdom, Europe, North America, the Middle
  East, North Africa, and internationally. Hikma Pharmaceuticals PLC was founded in
  1978 and is headquartered in London, United Kingdom.'
