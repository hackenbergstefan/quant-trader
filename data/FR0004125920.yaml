longBusinessSummary: Amundi S.A. is a publically owned investment manager. The firm
  engages in the asset management business. The company provides a range of retail
  products and solutions through quasi-exclusive distribution agreements with the
  retail banking networks of the Crédit Agricole and the Société Générale groups in
  France; and through international partner networks and joint ventures outside France,
  as well as through third-party distributors primarily in France, rest of Europe,
  and Asia. The firm prefers to invest between $1.31 million and $53.89 million in
  companies having sales value between $13.09 million and $392.78 million. It also
  offers management and advisory services for various pension funds, insurers, and
  sovereigns; and treasury management and employee savings solutions for corporate
  customers through global relationship managers supported by sales and marketing
  staff in 30 countries. It was formerly known as Amundi Group. The company was founded
  in 1982 and is headquartered in Paris, France. Amundi Group operates as a subsidiary
  of Credit Agricole S.A.
