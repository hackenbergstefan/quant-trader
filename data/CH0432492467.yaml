longBusinessSummary: Alcon Inc. researches, develops, manufactures, distributes, and
  sells eye care products worldwide. The company operates through two segments, Surgical
  and Vision Care. It offers equipment, instrumentation and diagnostics, intraocular
  lenses (IOLs), and other implantables; and consumables, including viscoelastics,
  surgical solutions, incisional instruments, surgical custom packs, and other products
  for surgical procedures. The company's cataract products include Unity CS, LenSx
  laser system, Verion reference unit and Verion digital marker, ARGOS biometer, SMARTCATARACT
  health platform, NGENUITY 3D visualization system, LuxOR surgical ophthalmic microscope,
  and ORA system for intra-operative measurements; ADI cloud-based platform; and implantable
  products, including monofocal, Toric, and Presbyopia-Correcting IOLs, as well as
  delivery systems, such as AutonoMe and UltraSert. In addition, it provides Custom
  Pak surgical procedure packs vitreoretinal products comprising constellation vision
  systems, procedure packs, lasers and hand-held microsurgical instruments, Grieshaber,
  MIVS instruments; scissors, forceps and micro-instruments, medical grade vitreous
  tamponades, and Hypervit probes; and refractive surgery products, including WaveLight
  and Contoura Vision used for LASIK refractive procedure. Further, the company offers
  daily disposable, reusable, and color-enhancing contact lenses; ocular health products,
  such as dry eye, ocular allergies, glaucoma, and contact lens care, as well as ocular
  vitamins and redness relievers. In addition it also develops and commercializes
  therapies for chronic eye diseases, focusing on encapsulated cell therapy platforms
  for ocular conditions. The company was formerly known as Alcon Universal S.A. and
  changed its name to Alcon Inc. in December 2001. Alcon Inc. was founded in 1945
  and is headquartered in Geneva, Switzerland.
