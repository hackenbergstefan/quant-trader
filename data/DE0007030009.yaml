longBusinessSummary: Rheinmetall AG provides mobility and security technologies in
  Germany, Rest of Europe, North, Middle, and South America, Asia and the Near East,
  and internationally. The company operates through the Vehicle Systems, Weapon and
  Ammunition, and Electronic Solutions segments. Its Vehicle Systems segment offers
  combat, logistics, support, and special vehicles, including armored tracked vehicles,
  CBRN protection systems, artillery, turret systems, and wheeled logistics and tactical
  vehicles. The Weapon and Ammunition segment provides firepower and protection solutions,
  such as weapons and ammunition, protection systems, propellants, and international
  projects and services. Its Electronic Solutions segment offers a chain of systems
  network, such as sensors, networking platforms, automated connected effectors for
  soldiers, cyberspace protection solutions, and training and simulation solutions.
  The company's products include air defense, soldier, and fire control systems; radar
  technology; and command, control and reconnaissance systems, as well as simulations
  for the army, air force, navy, and civil applications. It also engages in the aftermarket
  activities. The company was formerly known as Rheinmetall Berlin AG and changed
  its name to Rheinmetall AG in 1996. Rheinmetall AG was founded in 1889 and is headquartered
  in Düsseldorf, Germany.
