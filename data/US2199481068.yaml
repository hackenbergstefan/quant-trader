longBusinessSummary: 'Corpay, Inc. operates as a payments company that helps businesses
  and consumers to manage and pay their expenses.

  It operates through Corporate Payments, Vehicle Payments, Lodging Payments, and
  Other segments. The company offers vehicle payment solutions for fuel, tolls and
  parking, vehicle compliance, auto insurance and road assistance, fleet maintenance,
  and long-haul transportation services, as well as prepaid food and transportation
  vouchers and cards. It also provides corporate payment solutions, such as cross-border
  payments, spend management solutions, AP modernization, virtual cards, and purchasing
  and T&E cards. Additionally, it offers lodging payments solutions for employees
  who travel overnight for work purposes; traveling crews and stranded passengers
  from airlines and cruise lines; workforce lodging solutions for business travel
  programs; airline logistics, crew management, insurance, and other payments solutions.
  Further, the company offers gifts and payroll cards. It serves business, merchant,
  consumer, and payment network customers. The company was formerly known as FLEETCOR
  Technologies, Inc. and changed its name to Corpay, Inc. in June 2002. Corpay, Inc.
  was founded in 1986 and is headquartered in Atlanta, Georgia.'
