longBusinessSummary: Hermès International Société en commandite par actions engages
  in the production, wholesale, and retail of various goods. The company offers leather
  goods and saddlery, such as bags for men and women, travel articles, small leather
  goods and accessories, saddles, bridles, and various equestrian products and clothing;
  ready-to-wear garments for men and women; and accessories, including jewelry, belts,
  hats, gloves, internet of things products, and shoes. It also provides silk and
  textiles for men and women; art of living and tableware products; beauty and perfume
  products; and watches. In addition, the company is involved in weaving, engraving,
  printing, dyeing, finishing, and producing textiles; purchasing, tanning, dyeing,
  finishing, and selling tanneries and precious leathers; and creating and producing
  of metal parts. It sells its products through a network of stores in France, rest
  of Europe, Japan, the Asia Pacific, the Americas, and the Middle East, as well as
  sells watches, perfumes, and tableware through a network of specialized stores.
  The company was founded in 1837 and is headquartered in Paris, France. Hermès International
  Société en commandite par actions is a subsidiary of H51 SAS.
